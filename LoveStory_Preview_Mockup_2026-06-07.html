<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Love Story · Preview — Setnayan</title>
<!--
  STANDALONE preview mockup · 2026-06-07
  The "Our Love Story" payoff screen that follows the onboarding tone choice
  (Warm / Playful / Formal). A live preview of how the couple's told story will
  read on their wedding page. Sample couple: Maria & Juan.
  Clean Editorial palette + phone-frame, ported from
  Onboarding_Wedding_Adaptive_Flow_2026-06-07.html (read-only reference).
  Self-contained — Google Fonts link is the only external dependency.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Clean Editorial palette ── */
  :root{
    --paper:#FBFBFA; --ink:#1E2229; --ink-soft:#4F535B; --ink-faint:#8A8F97;
    --gold:#C5A059; --gold-deep:#A88340; --gold-wash:#F4ECD8;
    --mulberry:#5C2542; --mulberry-deep:#4A1D36; --mulberry-wash:#F5E8EE;
    --line:rgba(30,34,41,.1); --line-2:rgba(30,34,41,.18); --surface:#fff;
    --sans:'Manrope',-apple-system,system-ui,sans-serif;
    --serif:'Cormorant Garamond',Georgia,serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E9E6DF;font-family:var(--sans);color:var(--ink);
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100vh;}

  /* phone frame — fixed height, no page scroll */
  .phone{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--paper);overflow:hidden;
    display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(0,0,0,.12);}
  @media(min-width:480px){.phone{margin:24px 0;height:880px;border-radius:34px;border:1px solid var(--line-2);}}

  /* top brand bar */
  .top{padding:16px 22px 6px;flex:0 0 auto;background:var(--paper);z-index:5;}
  .brandrow{display:flex;align-items:center;gap:10px;}
  .brandlock{display:inline-flex;align-items:center;gap:8px;}
  .blmark-img{width:25px;height:25px;display:block;flex:0 0 auto;}
  .wm{font-family:var(--mono);font-size:12px;letter-spacing:.34em;color:var(--gold-deep);font-weight:500;}

  /* autosave-style hint chip top-right */
  .saved{margin-left:auto;display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#2D4A3A;
    background:rgba(45,74,58,.1);border:1px solid rgba(45,74,58,.25);border-radius:999px;padding:4px 9px;}

  /* screen body */
  .body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 20px 16px;display:flex;flex-direction:column;}
  .body::-webkit-scrollbar{width:0;}
  .viewzone{flex:0 0 auto;animation:rise .45s cubic-bezier(.2,.7,.3,1) both;}
  .tapzone{flex:0 0 auto;margin-top:auto;padding-top:12px;}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  h1.q{font-family:var(--serif);font-style:italic;font-weight:600;font-size:33px;line-height:1.04;letter-spacing:-.01em;margin-bottom:6px;}
  .sub{font-size:13.5px;line-height:1.45;color:var(--ink-soft);margin-bottom:14px;max-width:34ch;}

  /* ── tone toggle ── */
  .tonetoggle{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
  .tonechip{border:1px solid var(--line-2);background:var(--surface);border-radius:30px;
    padding:10px 6px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;
    min-height:44px;display:inline-flex;justify-content:center;align-items:center;gap:6px;user-select:none;
    font-family:var(--sans);color:var(--ink);}
  .tonechip:hover{border-color:var(--gold);}
  .tonechip .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.55;transition:.15s;}
  .tonechip.sel{background:var(--ink);color:var(--paper);border-color:var(--ink);animation:chippop .22s cubic-bezier(.2,.8,.3,1.3);}
  .tonechip.sel .dot{background:var(--gold);opacity:1;}
  .tonechip:active{transform:scale(.96);}
  @keyframes chippop{0%{transform:scale(.92)}55%{transform:scale(1.05)}100%{transform:scale(1)}}

  /* ── the "site card" — preview of the actual wedding page ── */
  .sitecard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;
    box-shadow:0 12px 34px rgba(30,34,41,.07),0 2px 8px rgba(30,34,41,.04);position:relative;}
  /* faint top wash so the card reads like a hero of a real page */
  .sitecard::before{content:"";position:absolute;inset:0 0 auto 0;height:150px;
    background:linear-gradient(180deg,var(--gold-wash),rgba(244,236,216,0));opacity:.6;pointer-events:none;}
  .sc-inner{position:relative;padding:24px 22px 22px;}

  /* monogram lockup at top of the card */
  .sc-mono{display:flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:4px;}
  .sc-monorow{display:flex;align-items:baseline;justify-content:center;gap:9px;
    font-family:var(--serif);font-style:italic;font-weight:600;color:var(--mulberry);line-height:1;}
  .sc-monorow .ini{font-size:54px;letter-spacing:-.02em;}
  .sc-monorow .amp{font-size:30px;color:var(--gold-deep);position:relative;top:-3px;}
  .sc-names{font-family:var(--mono);font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-deep);}
  .sc-rule{width:44px;height:1px;background:var(--gold);margin:11px auto 16px;opacity:.7;}

  /* the written narrative */
  .sc-story{font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px;line-height:1.5;
    color:var(--ink);text-align:center;letter-spacing:.005em;}
  .sc-story.is-anim{animation:storyfade .5s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes storyfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sc-story .lead{font-size:23px;}
  .sc-story em{font-style:normal;color:var(--mulberry);font-weight:600;}

  /* tiny gold timeline inside the card */
  .sc-tl{display:flex;flex-direction:column;gap:0;margin-top:22px;padding-top:20px;border-top:1px solid var(--line);}
  .sc-tlhd{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);text-align:center;margin-bottom:16px;}
  .sc-tl .tl{display:flex;gap:13px;align-items:flex-start;padding-bottom:15px;position:relative;}
  .sc-tl .tl:last-child{padding-bottom:0;}
  .sc-tl .tl .d{width:11px;height:11px;border-radius:50%;background:var(--gold);margin-top:3px;flex:0 0 auto;position:relative;z-index:1;box-shadow:0 0 0 4px var(--gold-wash);}
  .sc-tl .tl .d::after{content:"";position:absolute;left:5px;top:11px;width:1px;height:30px;background:var(--line-2);}
  .sc-tl .tl:last-child .d::after{display:none;}
  .sc-tl .tl .d.peak{background:var(--mulberry);box-shadow:0 0 0 4px var(--mulberry-wash);}
  .sc-tl .tl .yr{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--gold-deep);}
  .sc-tl .tl .mm{font-family:var(--serif);font-style:italic;font-size:17px;font-weight:600;line-height:1.15;margin-top:1px;}

  /* "this updates live" caption under the card */
  .livecap{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:13px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
  .livecap .pulse{width:6px;height:6px;border-radius:50%;background:var(--gold);position:relative;}
  .livecap .pulse::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid var(--gold);opacity:.6;animation:ring 1.8s ease-out infinite;}
  @keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.7);opacity:0}}

  /* ── CTAs ── */
  .btn{width:100%;border:none;border-radius:30px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);min-height:50px;transition:.15s;}
  .btn-primary{background:var(--mulberry);color:#fff;box-shadow:0 7px 20px rgba(92,37,66,.26);}
  .btn-primary:hover{background:var(--mulberry-deep);}
  .btn-primary:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(92,37,66,.24);}
  .ghost{margin-top:11px;font-size:13px;color:var(--ink-faint);text-align:center;cursor:pointer;font-weight:500;}
  .ghost u{text-decoration-color:var(--line-2);cursor:pointer;}
  .ghost:hover{color:var(--ink-soft);}
  @media(prefers-reduced-motion:reduce){
    .viewzone,.sc-story.is-anim,.livecap .pulse::after{animation:none;}
  }
</style>
</head>
<body>
  <div class="phone">

    <!-- brand bar -->
    <div class="top">
      <div class="brandrow">
        <span class="brandlock">
          <svg class="blmark-img" viewBox="0 0 5333.3335 5333.3335" role="img" aria-label="Setnayan"><path d="M 1859.526,3749.781 C 1458.028,3717.757 1065.454,3548.554 758.3406,3241.44 451.2286,2934.328 282.2397,2541.742 250.2195,2140.255 l 1326.8215,1.536 V 661.7647 C 1368.543,727.4195 1172.067,841.5416 1006.804,1006.804 768.3191,1245.29 633.8543,1548.261 602.7217,1859.526 H 250 C 282.024,1458.028 451.2265,1065.455 758.3406,758.3406 1065.453,451.2287 1458.039,282.2396 1859.526,250.2195 V 2422.739 H 661.7647 c 65.6549,208.498 179.7773,404.975 345.0393,570.237 238.486,238.486 541.457,372.95 852.722,404.083 z m 280.948,0 1.537,-1609.307 h 280.948 v 1197.761 c 208.498,-65.655 404.974,-179.776 570.237,-345.039 238.485,-238.486 372.95,-541.457 404.082,-852.722 H 3750 c -32.024,401.498 -201.226,794.071 -508.341,1101.185 -307.112,307.112 -699.697,476.101 -1101.185,508.122 z m 0,-1890.255 c 32.025,-401.498 201.227,-794.073 508.341,-1101.1854 0.658,-0.6584 1.316,-1.3173 1.975,-1.9754 -80.395,-42.041 -163.892,-76.0428 -249.331,-101.7389 -85.439,-25.696 -172.821,-43.0864 -260.985,-51.9046 V 250.2195 c 401.497,32.0253 794.073,201.0094 1101.185,508.1211 307.114,307.1134 476.317,699.6874 508.341,1101.1854 h -352.722 c -31.132,-311.265 -165.597,-614.236 -404.082,-852.722 -15.719,-15.7189 -32.464,-29.741 -48.727,-44.5564 -15.975,14.4789 -31.774,29.1397 -47.191,44.5564 -238.485,238.486 -372.95,541.457 -404.082,852.722 z" fill="#cb9e4b" fill-rule="nonzero" transform="matrix(1.3333333,0,0,-1.3333333,0,5333.3333)"/></svg>
          <span class="wm">SETNAYAN</span>
        </span>
        <span class="saved">✓ Story saved</span>
      </div>
    </div>

    <!-- screen body -->
    <div class="body">
      <div class="viewzone">

        <div class="eyebrow">Our Love Story · Preview</div>
        <h1 class="q">Here&rsquo;s your story.</h1>
        <p class="sub">This is how it&rsquo;ll read on your wedding page. Pick a voice &mdash; you can change it anytime.</p>

        <!-- tone toggle -->
        <div class="tonetoggle" role="group" aria-label="Story voice">
          <button class="tonechip sel" data-tone="warm"    onclick="pickTone(this)"><span class="dot"></span>Warm</button>
          <button class="tonechip"     data-tone="playful" onclick="pickTone(this)"><span class="dot"></span>Playful</button>
          <button class="tonechip"     data-tone="formal"  onclick="pickTone(this)"><span class="dot"></span>Formal</button>
        </div>

        <!-- the site card (preview of the real wedding page) -->
        <div class="sitecard">
          <div class="sc-inner">

            <!-- monogram -->
            <div class="sc-mono">
              <div class="sc-monorow"><span class="ini">M</span><span class="amp">&amp;</span><span class="ini">J</span></div>
              <div class="sc-names">Maria &amp; Juan</div>
            </div>
            <div class="sc-rule"></div>

            <!-- narrative (swapped by tone) -->
            <div class="sc-story" id="story"><!-- filled by JS --></div>

            <!-- tiny gold timeline -->
            <div class="sc-tl">
              <div class="sc-tlhd">How it happened</div>
              <div class="tl"><span class="d"></span><div><div class="yr">2023</div><div class="mm">We met</div></div></div>
              <div class="tl"><span class="d"></span><div><div class="yr">2024</div><div class="mm">Our first trip</div></div></div>
              <div class="tl"><span class="d"></span><div><div class="yr">2025</div><div class="mm">The proposal</div></div></div>
              <div class="tl"><span class="d peak"></span><div><div class="yr">2026</div><div class="mm">We do</div></div></div>
            </div>

          </div>
        </div>

        <div class="livecap"><span class="pulse"></span>Updates live as you tell it</div>

      </div>

      <!-- thumb-zone CTAs -->
      <div class="tapzone">
        <button class="btn btn-primary" onclick="looksBeautiful()">Looks beautiful</button>
        <div class="ghost" onclick="editStory()"><u>Edit my story</u></div>
      </div>
    </div>

  </div>

<script>
  /* Three genuinely different renderings woven from the couple's told inputs:
       met       — "A rainy afternoon in Baguio, one umbrella between us." (2023)
       trip      — "Our first trip" (2024)
       proposal  — "Sunset at the beach, the ring tucked inside a seashell." (2025)
       wedding   — "We do" (2026)
     <span class="lead"> opens each; <em> marks the gold/mulberry accent phrase. */
  const STORIES = {
    warm:
      '<span class="lead">It started on a rainy afternoon in Baguio</span> &mdash; one umbrella, and just enough room for the two of them. A first trip a year later. ' +
      'Then a sunset on the beach, where Juan tucked the ring inside a <em>seashell</em>. ' +
      'In 2026, under everyone they love, Maria &amp; Juan finally say <em>&ldquo;we do.&rdquo;</em>',
    playful:
      '<span class="lead">Blame the rain.</span> One umbrella in Baguio, zero personal space, and somehow &mdash; here we are. ' +
      'One trip later they were inseparable; by the beach at sunset Juan went and hid a ring inside a <em>seashell</em> (very smooth). ' +
      'And in 2026? Maria &amp; Juan are making it official. About time. <em>We do.</em>',
    formal:
      '<span class="lead">Their story began in Baguio,</span> beneath a single umbrella on a rainy afternoon. ' +
      'A journey together followed, and at sunset by the sea, a ring was offered &mdash; tucked, quietly, within a <em>seashell</em>. ' +
      'In the year 2026, surrounded by family and friends, Maria &amp; Juan are honoured to exchange their vows. <em>We do.</em>'
  };

  const storyEl = document.getElementById('story');

  function render(tone, animate){
    storyEl.innerHTML = STORIES[tone];
    if(animate){
      storyEl.classList.remove('is-anim');
      void storyEl.offsetWidth;       /* restart the fade */
      storyEl.classList.add('is-anim');
    }
  }

  function pickTone(el){
    document.querySelectorAll('.tonechip').forEach(c=>c.classList.remove('sel'));
    el.classList.add('sel');
    render(el.dataset.tone, true);
  }

  function looksBeautiful(){
    /* mockup-only confirmation */
    const btn = document.querySelector('.btn-primary');
    btn.textContent = '✓ Saved to your page';
    btn.style.background = '#2D4A3A';
    btn.style.boxShadow = '0 7px 20px rgba(45,74,58,.26)';
  }
  function editStory(){ alert('(Preview) This would reopen your story so you can edit the moments, years, and wording.'); }

  /* initial paint — Warm is the default voice */
  render('warm', false);
</script>
</body>
</html>
