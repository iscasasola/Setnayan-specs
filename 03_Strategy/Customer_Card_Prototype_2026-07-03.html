<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SETNAYAN — Customer Card respine (design prototype)</title>
<style>
  :root{
    --alabaster:#F6F4EF; --paper:#FFFFFF; --obsidian:#191919; --ink:#2B2A28; --ink2:#56524B;
    --gold:#C2A05B; --gold-soft:#EADFC4; --line:#E8E3D9; --line2:#F0ECE3; --muted:#928B7E;
    --inquiry:#2F6FB0; --inquiry-bg:#EAF1F8; --lock:#B5852A; --lock-bg:#F8F0DD;
    --pay:#3E8B59; --pay-bg:#E8F2EA; --review:#7A5AC9; --review-bg:#F0EAFB; --report:#C0564A; --report-bg:#FAE9E6;
    --wait:#C9822B; --wait-bg:#F7EBD9; --terra:#B85C38; --terra-bg:#F7E9E2;
    --shadow:0 1px 2px rgba(25,25,25,.05),0 10px 30px rgba(25,25,25,.06); --shadow-sm:0 1px 2px rgba(25,25,25,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--alabaster);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:16px 16px 74px}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
  .caption{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .caption .t{font-size:13px;color:var(--muted)} .caption .t b{color:var(--ink)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow-sm);margin-bottom:16px}
  .tgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tglabel{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .vbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:12px;cursor:pointer;box-shadow:var(--shadow-sm);color:var(--ink);font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .vbtn:hover{border-color:var(--gold)}
  .vbtn.active{background:var(--obsidian);color:#fff;border-color:var(--obsidian)}
  .vbtn .ico{width:14px;height:14px}
  .sep{width:1px;height:26px;background:var(--line);margin:0 4px;align-self:center}

  .ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
  .vchk{width:11px;height:11px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1px}

  /* device staging */
  body.d .phone{display:none} body.m .desktop{display:none}
  .desktop{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .winbar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid var(--line);background:#FBFAF7}
  .winbar i{width:11px;height:11px;border-radius:50%;background:#E2DDD3;display:block}
  .winbar .url{margin-left:8px;font-size:11.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 11px}
  .dmain{padding:0}

  /* phone frame */
  .phone{display:flex;justify-content:center}
  .pscreen{width:390px;background:var(--paper);border:1px solid var(--line);border-radius:34px;overflow:hidden;box-shadow:var(--shadow);position:relative}
  .pstat{height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line2);background:#FBFAF7}
  .pbody{position:relative;min-height:660px}

  .pane{padding:16px 18px}
  .pmain .pane{padding:13px 14px}

  /* ===== shared idioms ===== */
  .rowlabel{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
  .rowlabel:first-of-type{margin-top:2px} .rl-note{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
  .pill{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;display:inline-block}
  .pill.booked{color:var(--pay);background:var(--pay-bg)} .pill.conv{color:var(--inquiry);background:var(--inquiry-bg)}
  .pill.outside{color:var(--ink2);background:var(--line2)} .pill.done{color:var(--muted);background:var(--line2)}
  .pill.quoted{color:var(--wait);background:var(--wait-bg)}
  .src-badge{font-size:10px;font-weight:700;border-radius:999px;padding:2px 9px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .src-badge .ico{width:11px;height:11px}
  .src-badge.inhouse{color:var(--terra);background:var(--terra-bg)} .src-badge.imported{color:var(--ink2);background:var(--line2)}
  .b{border:none;border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .b .ico{width:14px;height:14px}
  .b.primary{background:var(--obsidian);color:#fff} .b.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)} .b.gold{background:var(--gold);color:#fff}
  .b.ghost:hover{border-color:var(--gold)} .b[disabled]{opacity:.45;cursor:not-allowed}
  .link{font-size:11.5px;color:var(--gold);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .link .ico{width:13px;height:13px}

  /* ===== Messenger (View 1) ===== */
  .msgr{display:grid;grid-template-columns:262px 1fr 268px;border:1px solid var(--line);border-radius:0;overflow:hidden;background:#fff;height:592px;position:relative}
  .pmain .msgr{grid-template-columns:1fr;height:660px;border:none;border-radius:0}
  .msg-list{border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
  .ml-head{padding:13px 14px 9px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between}
  .ml-head .n{font-size:11px;font-weight:700;color:var(--muted);background:var(--line2);border-radius:999px;padding:2px 8px}
  .mthread{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;border-bottom:1px solid var(--line2)}
  .mthread:hover{background:#FBFAF7} .mthread.on{background:#F1EDE5}
  .mthread .av{width:40px;height:40px;border-radius:50%;background:var(--alabaster);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--ink2);flex:0 0 auto}
  .mthread .av .ico{width:20px;height:20px;color:var(--muted)}
  .mt-b{flex:1;min-width:0} .mt-n{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px} .mt-l{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .mt-t{font-size:10.5px;color:var(--muted);flex:0 0 auto;align-self:flex-start}
  .mt-inqtag{font-size:9px;font-weight:700;color:var(--wait);background:var(--wait-bg);border-radius:999px;padding:1px 6px}
  .undot{display:inline-block;width:7px;height:7px;background:var(--report);border-radius:50%}

  .msg-conv{display:flex;flex-direction:column;min-width:0}
  .mc-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#FBFAF7}
  .mc-back{display:none;border:none;background:none;cursor:pointer;color:var(--ink2);padding:0} .mc-back .ico{width:20px;height:20px}
  .mc-head .av{width:34px;height:34px;border-radius:50%;background:var(--alabaster);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--ink2);flex:0 0 auto}
  .mc-head .av .ico{width:18px;height:18px;color:var(--muted)}
  .mc-n{font-size:13.5px;font-weight:700;flex:1;min-width:0} .mc-s{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
  .mc-info{border:none;background:none;cursor:pointer;color:var(--ink2);padding:6px;border-radius:8px;display:flex} .mc-info .ico{width:18px;height:18px} .mc-info:hover{background:var(--line2)}
  .mc-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#faf9f7}
  .bub{max-width:74%;padding:8px 12px;border-radius:15px;font-size:12.5px}
  .bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .bub.me{align-self:flex-end;background:var(--obsidian);color:#fff;border-bottom-right-radius:4px}
  .bub .bt{display:block;font-size:9px;opacity:.55;margin-top:3px}
  .msg-input{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line);align-items:center}
  .msg-input input{flex:1;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:12.5px;font-family:inherit;outline:none}
  .msg-input .b{padding:8px;border-radius:50%} .msg-input .b .ico{width:16px;height:16px}
  .msg-inq{display:flex;align-items:center;gap:8px;padding:11px 12px;border-top:1px solid var(--line);font-size:11.5px;color:#7a5d2a;background:var(--wait-bg)} .msg-inq .ico{width:14px;height:14px;color:var(--wait);flex:0 0 auto}
  .conv-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12.5px;text-align:center;padding:24px}
  .conv-empty .ico{width:34px;height:34px;color:var(--line)}

  /* info rail */
  .msg-info{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;background:#FBFAF7}
  .pmain .msg-info{display:none}
  .mi-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
  .mi-x{border:none;background:none;cursor:pointer;color:var(--muted);padding:0;display:none} .mi-x .ico{width:18px;height:18px}
  .mi-card{padding:16px 14px;text-align:center;border-bottom:1px solid var(--line2)}
  .mi-card .av.lg{width:54px;height:54px;border-radius:50%;background:var(--alabaster);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--ink2);margin:0 auto 8px}
  .mi-card .av.lg .ico{width:26px;height:26px;color:var(--muted)}
  .mi-nm{font-size:14px;font-weight:700} .mi-badges{display:flex;gap:6px;justify-content:center;margin-top:7px;flex-wrap:wrap}
  .mi-rows{margin-top:14px;text-align:left;display:flex;flex-direction:column;gap:10px}
  .mi-rows>div{display:flex;flex-direction:column;gap:2px} .mi-rows span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} .mi-rows b{font-size:12px;font-weight:600}
  .mi-rows .locked-v{color:var(--lock);display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:11.5px} .mi-rows .locked-v .ico{width:12px;height:12px}
  .mi-sync{display:flex;align-items:flex-start;gap:7px;margin:12px 12px 8px;padding:8px 10px;font-size:10.5px;color:#3e6b4c;background:var(--pay-bg);border:1px solid #cfe6d5;border-radius:9px;line-height:1.4} .mi-sync .ico{width:13px;height:13px;color:var(--pay);flex:0 0 auto;margin-top:1px}
  .mi-actions{padding:2px 12px 6px;display:flex;flex-direction:column;gap:6px}
  .mi-actions button{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;font-family:inherit;text-align:left} .mi-actions button:hover{border-color:var(--gold)} .mi-actions button .ico{width:15px;height:15px;color:var(--ink2);flex:0 0 auto}
  .mi-profile{margin:6px 12px 14px;width:calc(100% - 24px);justify-content:center;background:var(--obsidian);color:#fff;border:none;border-radius:9px;padding:10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px} .mi-profile .ico{width:15px;height:15px}
  /* mobile slide-over */
  .pmain .msg-info.open{display:flex;position:absolute;inset:0;z-index:8;border-left:none}
  .pmain .mi-x{display:flex}
  .pmain .msg-conv{display:none} .pmain .msgr.open .msg-list{display:none} .pmain .msgr.open .msg-conv{display:flex} .pmain .mc-back{display:flex}

  /* ===== Full Customer Card (View 2) ===== */
  .cc-sticky{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 22px 0}
  .pmain .cc-sticky{padding:12px 14px 0}
  .cc-hero{display:flex;align-items:center;gap:14px}
  .cc-hero .av{width:56px;height:56px;border-radius:14px;background:var(--alabaster);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--ink2);flex:0 0 auto}
  .cc-id{flex:1;min-width:0} .cc-n{font-size:19px;font-weight:700;line-height:1.15} .cc-m{font-size:12.5px;color:var(--muted);margin:3px 0 0}
  .cc-badges{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .cc-acts{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 12px}
  .pmain .cc-acts{gap:6px}
  .cc-acts .b{padding:8px 12px}
  /* pipeline */
  .pipe{display:flex;align-items:center;gap:0;margin:2px 0 14px;overflow-x:auto}
  .pstep{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .pdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex:0 0 auto}
  .pdot .ico{width:13px;height:13px}
  .plab{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
  .pline{width:26px;height:2px;background:var(--line);margin:0 4px;flex:0 0 auto}
  .pmain .pline{width:14px}
  .pstep.done .pdot{background:var(--pay);border-color:var(--pay);color:#fff} .pstep.done .plab{color:var(--ink2)}
  .pstep.done + .pline{background:var(--pay)}
  .pstep.cur .pdot{background:var(--obsidian);border-color:var(--obsidian);color:#fff;box-shadow:0 0 0 4px rgba(25,25,25,.09)} .pstep.cur .plab{color:var(--ink);font-weight:700}
  /* tabs */
  .cc-tabs{display:flex;gap:2px;border-bottom:1px solid transparent}
  .pmain .cc-tabs{overflow-x:auto;gap:6px;padding-bottom:8px}
  .cc-tab{font-size:12.5px;font-weight:600;color:var(--ink2);padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
  .cc-tab:hover{color:var(--ink)}
  .cc-tab.on{color:var(--ink);border-bottom-color:var(--gold)}
  .pmain .cc-tab{border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 14px}
  .pmain .cc-tab.on{background:var(--obsidian);color:#fff;border-color:var(--obsidian)}

  .cc-body{padding:16px 22px}
  .pmain .cc-body{padding:14px}

  /* generic cards */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .pmain .grid2{grid-template-columns:1fr}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:var(--shadow-sm)}
  .card .h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink2)} .card .h .ico{width:15px;height:15px;color:var(--gold)}
  .card .big{font-size:22px;font-weight:700;margin-top:8px;line-height:1.1} .card .big .frac{font-size:13px;color:var(--muted);font-weight:600}
  .card .s{font-size:11.5px;color:var(--muted);margin-top:3px} .card .s b{color:var(--ink2);font-weight:600}
  .card .krow{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line2)} .card .krow:first-of-type{border-top:none;padding-top:9px} .card .krow .k{color:var(--muted)} .card .krow .v{font-weight:600;text-align:right}
  .chipset{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .minichip{font-size:11px;font-weight:600;color:var(--ink2);background:var(--line2);border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px} .minichip .ico{width:12px;height:12px;color:var(--muted)}
  .minichip.ask{background:var(--inquiry-bg);color:var(--inquiry)}
  .miscount{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap} .misc{font-size:11.5px;color:var(--muted)} .misc b{color:var(--ink);font-weight:700;font-size:13px;display:block}
  .empty{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;background:#FBFAF7;border:1px dashed var(--line);border-radius:10px;padding:11px 12px;margin-top:8px} .empty .ico{width:15px;height:15px;color:var(--muted);flex:0 0 auto}

  /* style card swatches + monogram */
  .segrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line2)} .segrow:first-of-type{border-top:none}
  .segrow .sn{font-size:11.5px;color:var(--ink2);width:82px;flex:0 0 auto;font-weight:600}
  .sw{display:flex;gap:5px} .sw i{width:17px;height:17px;border-radius:50%;border:1px solid rgba(0,0,0,.06);display:block}
  .mono{width:58px;height:58px;border-radius:13px;border:1px solid var(--gold-soft);background:linear-gradient(135deg,#FBF7EF,#F3EBDC);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .mono b{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:600;color:var(--gold);letter-spacing:.02em}
  .stylehead{display:flex;align-items:center;gap:13px;margin-bottom:6px}

  /* locked row (disclosure ladder) */
  .lockrow{display:flex;align-items:center;gap:10px;background:var(--lock-bg);border:1px solid #ECD9BD;border-radius:11px;padding:11px 13px;margin-top:8px}
  .lockrow .ico{width:16px;height:16px;color:var(--lock);flex:0 0 auto}
  .lockrow .lk-b{flex:1;min-width:0} .lockrow .lk-t{font-size:12.5px;font-weight:600;color:#7a5d2a} .lockrow .lk-s{font-size:11px;color:#93762f;margin-top:1px}

  /* quote / payment rows */
  .qrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-left-width:3px;border-radius:11px;padding:11px 13px;background:#fff;margin-bottom:8px}
  .qrow.sent{border-left-color:var(--inquiry)} .qrow.declined{border-left-color:var(--muted);opacity:.72}
  .qrow .qv{font-size:13px;font-weight:700;flex:0 0 auto;width:56px} .qrow .qb{flex:1;min-width:0} .qrow .qamt{font-size:14px;font-weight:700} .qrow .qmeta{font-size:11px;color:var(--muted);margin-top:2px}
  .qrow .qstat{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;flex:0 0 auto} .qstat.viewed{color:var(--pay);background:var(--pay-bg)} .qstat.dec{color:var(--muted);background:var(--line2)}
  .payhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .paybar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;margin:4px 0 12px} .payfill{height:100%;background:var(--pay);border-radius:4px}
  .mile{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#FCFBF8;margin-bottom:8px}
  .mile .mck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .mile .mck.on{background:var(--pay);border-color:var(--pay)} .mile .mck.on .ico{width:12px;height:12px;stroke:#fff}
  .mile .mb{flex:1;min-width:0} .mile .mt{font-size:13px;font-weight:600} .mile .mm{font-size:11px;color:var(--muted);margin-top:1px}
  .mile .mtag{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;flex:0 0 auto} .mtag.paid{color:var(--pay);background:var(--pay-bg)} .mtag.open{color:var(--lock);background:var(--lock-bg)}
  .expect{display:flex;align-items:center;gap:9px;background:#FBF4E6;border:1px solid var(--gold-soft);border-radius:11px;padding:11px 13px;margin:4px 0 12px;font-size:12.5px;color:#6b5d3c} .expect .ico{width:16px;height:16px;color:var(--gold);flex:0 0 auto} .expect b{color:var(--ink)}

  /* files */
  .frow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#fff;margin-bottom:8px}

function svg(n,cls){return `<svg class="${cls||'ico'}" viewBox="0 0 24 24">${IC[n]||''}</svg>`}

/* ===== state ===== */

let cust='RT';         // 'RT' | 'MJ' | 'GM'

let tab='overview';    // overview | quote | files | schedule | activity
let msgThread='RT';    // selected thread cust key
let msgOpen=false;     // mobile: conversation open
let railOpen=false;    // mobile: info rail slide-over
let remindOn=false;    // note composer: remind chip
let notes=[];          // appended activity notes

/* ===== data (shared with Vendor_Dashboard prototype) ===== */
const CUST={

    source:'inhouse', thread:true,

const MSGS={

/* ===== helpers ===== */
function isBooked(){return stage==='booked'}
function toast(msg){const t=document.getElementById('toast');t.innerHTML=svg('check')+' '+msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600);}
function actToast(label){toast(label+' — synced across your store')}

const QUICK=[['filetext','Send quote','Quote sent'],['news','Send contract','Contract sent for e-sign'],['folder','Share files','Files shared'],['cal','Propose schedule','Schedule proposed'],['wallet','Log payment','Payment logged']];

/* ===== VIEW 1 — Messenger ===== */
function threadList(){
  const order=['RT','MJ']; // GM has no thread
  return order.map(k=>{
    const c=CUST[k],m=MSGS[k],last=m.msgs[m.msgs.length-1];
    const masked=m.inquiry;
    const nm=masked?'New Customer':c.nm;
    const av=masked?svg('user'):k;
    const preview=masked?'New inquiry — accept to see who they are':(last.from==='me'?'You: ':'')+last.text;
    return `<div class="mthread ${k===msgThread?'on':''}" data-thread="${k}">
      <div class="av">${av}</div>
      <div class="mt-b"><div class="mt-n">${nm}${m.unread?' <span class="undot"></span>':''}${masked?' <span class="mt-inqtag">Inquiry</span>':''}</div>
      <div class="mt-l">${preview}</div></div>
      <span class="mt-t">${m.time}</span></div>`;
  }).join('');
}
function conversation(){
  const c=CUST[msgThread],m=MSGS[msgThread];
  if(!m) return `<div class="conv-empty">${svg('msg')}<div>No thread yet with ${c.nm}.</div></div>`;
  const masked=m.inquiry;
  const nm=masked?'New Customer':c.nm, av=masked?svg('user'):msgThread;
  const bubbles=m.msgs.map(b=>`<div class="bub ${b.from}">${b.text}<span class="bt">${b.time}</span></div>`).join('');
  const foot=masked
    ? `<div class="msg-inq">${svg('lock')}<span>New inquiry — <b>accept to reply</b> and reveal their details.</span><button class="b primary" style="margin-left:auto" data-accept="1">Accept</button></div>`
    : `<div class="msg-input"><input placeholder="Message ${c.first}…"/><button class="b primary" data-toast="Message sent">${svg('send')}</button></div>`;
  return `<div class="mc-head">
      <button class="mc-back" data-msgback="1">${svg('chevL')}</button>
      <div class="av">${av}</div>
      <div style="flex:1;min-width:0"><div class="mc-n">${nm}</div><div class="mc-s">${masked?'Awaiting your accept':c.svc.split(' · ')[0]+' · '+c.loc}</div></div>
      <button class="mc-info" data-rail="1" title="Details">${svg('info')}</button></div>
    <div class="mc-body">${bubbles}</div>${foot}`;
}
function infoRail(){
  const c=CUST[msgThread],m=MSGS[msgThread];
  const masked=m&&m.inquiry;
  const nm=masked?'New Customer':c.nm, av=masked?svg('user'):msgThread;

  // event snapshot — masked shows city + estimate; ladder locks address pre-book
  const snap = masked
    ? `<div><span>Event</span><b>Wedding · a Saturday in July</b></div>
       <div><span>Location</span><b>${c.city}</b></div>
       <div><span>Service</span><b>${c.svc.split(' · ')[0]}</b></div>
       <div><span>Guests</span><b>~150 (estimate)</b></div>`
    : `<div><span>Event</span><b>${c.ev} · ${c.day}</b></div>
       <div><span>Location</span><b>${isBooked()?c.venue+', '+c.loc:c.city}</b></div>
       <div><span>Service</span><b>${c.svc.split(' · ')[0]}</b></div>
       <div><span>Guests</span><b>${c.attend?c.attend+' / '+c.invited:'—'}</b></div>`;
  const acts=QUICK.map(a=>`<button data-qa="${a[1]}"${masked?' disabled':''}>${svg(a[0])} ${a[1]}</button>`).join('');
  return `<div class="mi-head"><span>Customer</span><button class="mi-x" data-rail="1">${svg('chevR')}</button></div>
    <div class="mi-card">
      <div class="av lg">${av}</div>
      <div class="mi-nm">${nm}</div>
      <div class="mi-badges">${statusPill}${srcBadge}</div>
      <div class="mi-rows">${snap}</div>
    </div>
    <div class="rowlabel" style="padding:0 14px 2px">Quick actions</div>
    <div class="mi-sync">${svg('check')} Every action here syncs across your store — calendar, quotes, contracts, files &amp; the couple's page.</div>
    <div class="mi-actions">${acts}</div>
    <button class="mi-profile" data-openprofile="1"${masked?' disabled':''}>${svg('user')} Full customer profile ${svg('arrowr')}</button>`;
}
function messengerBody(){
  const rail=CUST[msgThread]?infoRail():'';
  return `<div class="msgr ${msgOpen?'open':''} ${railOpen?'':''}">
      <div class="msg-list"><div class="ml-head"><span>Messages</span><span class="n">2 new</span></div>${threadList()}</div>
      <div class="msg-conv">${conversation()}</div>
      <div class="msg-info ${railOpen?'open':''}">${rail}</div>
    </div>`;
}

/* ===== VIEW 2 — Full Customer Card ===== */
function pipeline(){
  const c=CUST[cust], steps=['Inquiry','Quoted','Booked','Delivered','Reviewed'];
  const curr=c.pipe[stage];
  let h='';
  steps.forEach((s,i)=>{
    const cls=i<curr?'done':i===curr?'cur':'';
    h+=`<div class="pstep ${cls}"><div class="pdot">${i<curr?svg('check'):(i+1)}</div><span class="plab">${s}</span></div>`;
    if(i<steps.length-1)h+=`<div class="pline"></div>`;
  });
  return `<div class="pipe">${h}</div>`;
}
function cardHeader(){
  const c=CUST[cust];
  const statusPill=`<span class="pill ${c.pill[stage]}">${c.statusLabel[stage]}</span>`;
  const srcBadge=`<span class="src-badge ${c.source==='inhouse'?'inhouse':'imported'}">${svg(c.source==='inhouse'?'handshake':'download')} ${c.source==='inhouse'?'In-house':'Imported'}</span>`;
  const meta=c.ev+' · '+c.day+(c.loc?' · '+c.loc:'');
  const acts=[['msg','Message','open-messenger'],['filetext','Send quote','Send quote'],['news','Contract','Contract sent for e-sign'],['folder','Files','Files shared'],['cal','Schedule','Schedule proposed'],['wallet','Log payment','Payment logged']];
  const actHtml=acts.map((a,i)=>`<button class="b ${i===0?'primary':'ghost'}" data-headact="${a[2]}">${svg(a[0])} ${a[1]}</button>`).join('');
  const tabs=[['overview','Overview'],['quote','Quote & Payments'],['files','Files'],['schedule','Schedule'],['activity','Activity']];
  return `<div class="cc-sticky">
    <div class="cc-hero">
      <div class="av">${cust}</div>
      <div class="cc-id"><div class="cc-n">${c.nm}</div><div class="cc-m">${meta}</div>
        <div class="cc-badges">${statusPill}${srcBadge}</div></div>
    </div>
    <div class="cc-acts">${actHtml}</div>
    ${pipeline()}
    <div class="cc-tabs">${tabs.map(t=>`<button class="cc-tab ${t[0]===tab?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>
  </div>`;
}
/* --- disclosure ladder locked row --- */
function lockRow(t,s){return `<div class="lockrow">${svg('lock')}<div class="lk-b"><div class="lk-t">${t}</div><div class="lk-s">${s}</div></div></div>`}

/* --- Overview tab --- */
function tabOverview(){
  const c=CUST[cust];
  // Event snapshot
  const snapVenue = isBooked()
    ? `<div class="krow"><span class="k">Venue</span><span class="v">${c.venue}</span></div>
       <div class="krow"><span class="k">Address</span><span class="v">${c.addr}</span></div>`
    : `<div class="krow"><span class="k">Area</span><span class="v">${c.city}</span></div>`;
  const snap=`<div class="card">
    <div class="h">${svg('cal')} Event snapshot</div>
    <div style="margin-top:8px">
      <div class="krow"><span class="k">Date</span><span class="v">${c.day}</span></div>
      ${snapVenue}
    </div>
    <div class="chipset">
      <span class="minichip">${svg('church')} ${c.ceremony} ceremony</span>
      <span class="minichip">${svg('sun')} ${c.space}</span>
    </div>
    ${isBooked()?'':lockRow('Exact venue address','Unlocks when they book you — you see the area for now.')}
  </div>`;
  // Headcount
  const head = c.attend
    ? `<div class="card">
        <div class="h">${svg('users')} Headcount</div>
        <div class="big">${c.attend} attending <span class="frac">/ ${c.invited} invited</span></div>
        <div class="miscount"><span class="misc"><b>${c.pending}</b>pending</span><span class="misc"><b>${c.maybe}</b>maybe</span><span class="misc"><b>${c.declined}</b>declined</span></div>
        <div class="s" style="margin-top:8px">RSVPs still moving — numbers may firm up closer to the day.</div>
      </div>`
    : `<div class="card"><div class="h">${svg('users')} Headcount</div><div class="empty">${svg('info')} No guest list yet — this fills in once they start their RSVPs.</div></div>`;
  // Service requested
  const asked = c.ask?` · <span style="color:var(--inquiry);font-weight:600">+${c.ask} asked about</span>`:'';
  const svcCard=`<div class="card"><div class="h">${svg('camera')} Service requested</div>
    <div class="s" style="margin-top:8px;font-size:12.5px;color:var(--ink)"><b>${c.svc}</b>${asked}</div>
    <div class="s" style="margin-top:4px">What the couple asked for when they reached out.</div></div>`;
  // Style card
  const segs=Object.keys(c.palette).map(k=>`<div class="segrow"><span class="sn">${k}</span><span class="sw">${c.palette[k].map(col=>`<i style="background:${col}"></i>`).join('')}</span></div>`).join('');
  const styleCard=`<div class="card"><div class="h">${svg('palette')} Style</div>
    <div class="stylehead" style="margin-top:9px"><div class="mono"><b>${c.mono}</b></div><div style="font-size:11.5px;color:var(--muted)">Their monogram &amp; palettes, pulled from the mood board.</div></div>
    ${segs}
    <span class="link" data-toast="Opening mood board" style="margin-top:10px">${svg('image')} Open mood board</span></div>`;
  // Budget band
  const budget = c.budgetShared
    ? `<div class="card"><div class="h">${svg('wallet')} Budget band</div>
        <div class="big">${c.budgetLo} – ${c.budgetHi}</div>
        <div class="s" style="margin-top:3px">shared by the couple</div>
        <div class="minichip" style="margin-top:9px;background:var(--pay-bg);color:var(--pay)">${svg('check')} Couple opted in to share</div></div>`
    : `<div class="card"><div class="h">${svg('wallet')} Budget band</div>
        <div class="empty">${svg('lock')} Not shared — the couple hasn't opted to share a budget yet.</div>
        <div class="s" style="margin-top:7px">You'll see a band here if they choose to share it with vendors.</div></div>`;
  // Date capacity
  const dateLine=`<div class="card"><div class="h">${svg('clock')} Date capacity</div>
    <div class="s" style="margin-top:7px;font-size:12.5px;color:var(--ink)">Their date: <b>${c.day.replace('Sat, ','').replace('Sun, ','')}</b> · ${c.ev==='Prenup'?'your calendar is open':'your last open slot that day'}</div>
    <span class="link" data-toast="Opening your calendar" style="margin-top:8px">${svg('cal')} Open calendar</span></div>`;
  return `<div class="grid2">${snap}${head}</div>
    <div class="grid2" style="margin-top:12px">${svcCard}${styleCard}</div>
    <div class="grid2" style="margin-top:12px">${budget}${dateLine}</div>`;
}

/* --- Quote & Payments tab --- */
function tabQuote(){
  const c=CUST[cust];
  const quotes=cust==='RT'
   ? [['v2','₱52,999','Sent Jun 21 · Viewed Jun 22 · valid until Jul 1','sent','Viewed','viewed'],
      ['v1','₱58,999','Sent Jun 18 · Declined Jun 20','declined','Declined','dec']]
   : cust==='MJ'
   ? [['v1','₱18,999','Sent Jun 28 · Viewed Jun 29 · valid until Jul 12','sent','Viewed','viewed']]
   : [];
  const qBlock = quotes.length
   ? quotes.map(q=>`<div class="qrow ${q[3]}"><span class="qv">Quote ${q[0]}</span><div class="qb"><div class="qamt">${q[1]}</div><div class="qmeta">${q[2]}</div></div><span class="qstat ${q[5]}">${q[4]}</span></div>`).join('')
   : `<div class="empty">${svg('filetext')} No quotes sent yet.</div>`;
  // payment schedule (RT booked). Pre-book / MJ / GM: quote-only state
  let payBlock;
  if(cust==='RT' && isBooked()){
    payBlock=`<div class="payhead"><div class="card-h2" style="font-weight:700;font-size:13px">Payment schedule</div><span class="link" data-toast="Opening payment log">History ›</span></div>
      <div class="paybar"><div class="payfill" style="width:38%"></div></div>
      <div class="mile"><span class="mck on">${svg('check')}</span><div class="mb"><div class="mt">Downpayment · ₱20,000</div><div class="mm">Paid Jun 24 · GCash</div></div><span class="mtag paid">Paid</span></div>
      <div class="mile"><span class="mck"></span><div class="mb"><div class="mt">Balance · ₱32,999</div><div class="mm">Due Jul 1 · before the event</div></div><span class="mtag open">Open</span></div>
      <div class="expect">${svg('coins')}<span>Expected this month: <b>₱32,999</b></span></div>
      <button class="b primary" data-qa="Log payment received">${svg('wallet')} Log payment received</button>`;
  } else {
    payBlock=`<div class="payhead"><div style="font-weight:700;font-size:13px">Payment schedule</div></div>
      <div class="empty">${svg('wallet')} No payments yet — a schedule appears once they book you and pay a downpayment.</div>`;
  }
  return `<div class="rowlabel">Quotation</div>
    ${qBlock}
    <button class="b ghost" data-qa="New quote sent" style="margin-top:4px">${svg('filetext')} New quote</button>
    <div class="rowlabel" style="margin-top:20px">Payments</div>
    ${payBlock}`;
}

/* --- Files tab --- */
function tabFiles(){
  const files=cust==='RT'
   ? [['news','contract.pdf','You · Jun 22','you','You'],
      ['image','moodboard.pdf','Couple · Jun 19','them','Couple'],
      ['image','venue-layout.jpg','Couple · Jun 21','them','Couple']]
   : cust==='MJ'
   ? [['image','inspo-pinboard.jpg','Couple · Jun 27','them','Couple']]
   : [];
  const rows=files.length
   ? files.map(f=>`<div class="frow"><span class="fq">${svg(f[0])}</span><div class="fb"><div class="ft">${f[1]}</div><div class="fm">${f[2]}</div></div><span class="fdir ${f[3]}">${f[4]}</span><span class="dl" data-toast="Downloading ${f[1]}">${svg('download')}</span></div>`).join('')
   : `<div class="empty">${svg('folder')} No files shared yet.</div>`;
  return `<div class="rowlabel">Shared files <span class="rl-note">· both directions</span></div>
    ${rows}
    <button class="b ghost" data-qa="Files shared" style="margin-top:4px">${svg('folder')} Share files</button>`;
}

/* --- Schedule tab --- */
function tabSchedule(){
  const c=CUST[cust];
  if(!isBooked() && cust==='RT'){
    return `<div class="rowlabel">Day-of timeline</div>
      ${lockRow('Full day-of timeline','Unlocks when they book you — you can propose a call time now.')}
      <div class="calltime" style="margin-top:12px">
        <div class="ct-ic">${svg('clock')}</div>
        <div class="ct-b"><div class="ct-t">Suggested call time · 12:00 PM</div><div class="ct-s">2-hr setup before the ceremony (2:00 PM).</div></div>
        <button class="b gold" data-toast="Call time requested — sent to the couple">Request this call time</button>
      </div>`;
  }
  if(cust!=='RT'){
    return `<div class="rowlabel">Day-of timeline</div><div class="empty">${svg('cal')} No day-of timeline yet — it builds out closer to the event.</div>`;
  }
  const tl=[
    ['12:00 PM','Vendor call time','Taal Vista Hotel · setup',true],
    ['1:15 PM','Bride prep + details','Bridal suite',true],
    ['2:00 PM','Ceremony','Chapel on the Hill',true],
    ['3:30 PM','Cocktails + couple portraits','Garden terrace',true],
    ['5:00 PM','Reception program','Grand ballroom',true],
    ['9:00 PM','Send-off','Main lobby',false],
  ];
  const rows=tl.map(r=>`<div class="tlrow ${r[3]?'mine':''}">
    <span class="tt">${r[0]}</span>
    <div class="tb"><div class="tn">${r[1]}${r[3]?' <span class="yourtag">Your slot</span>':''}</div><div class="tm">${r[2]}</div></div>
    <span class="req" data-toast="Change requested for &quot;${r[1]}&quot;">Request a change</span>
  </div>`).join('');
  return `<div class="calltime">
      <div class="ct-ic">${svg('clock')}</div>
      <div class="ct-b"><div class="ct-t">Suggested call time · 12:00 PM</div><div class="ct-s">2-hr setup before the ceremony (2:00 PM).</div></div>
      <button class="b gold" data-toast="Call time requested — sent to the couple">Request this call time</button>
    </div>
    <div class="rowlabel">Day-of timeline <span class="link" data-toast="Timeline added to your calendar (.ics)" style="float:right">${svg('download')} Add to calendar (.ics)</span></div>
    <div class="tl">${rows}</div>`;
}

/* --- Activity tab --- */
function tabActivity(){
  const c=CUST[cust];
  const baseSys=cust==='RT'
   ? [['sys','handshake','Inquiry accepted','You accepted this inquiry','Jun 20'],
      ['sys','filetext','Quote v2 sent','₱52,999 · valid until Jul 1','Jun 21'],
      ['pay','wallet','Downpayment received','₱20,000 · GCash','Jun 24'],
      ['sys','check','Marked complete','Pending — awaiting the event day','—']]
   : cust==='MJ'
   ? [['sys','handshake','Inquiry accepted','You accepted this inquiry','Jun 27'],
      ['sys','filetext','Quote v1 sent','₱18,999 · valid until Jul 12','Jun 28']]
   : [['sys','download','Imported to your book','Added from your own client list','Jun 15']];
  // built-in private note for RT
  const seedNotes=cust==='RT'
   ? [{text:'Couple wants extra coverage of the grand entrance — confirm second shooter.',meta:'You · Jun 22',due:false}]
   : [];
  const allNotes=[...seedNotes,...notes.filter(n=>n.cust===cust)];
  const feedSys=baseSys.map(f=>`<div class="fitem ${f[0]}"><div class="fdot">${svg(f[1])}</div><div class="fc"><div class="fh">${f[2]}</div><div class="fs">${f[3]}</div></div><span class="fwhen">${f[4]}</span></div>`).join('');
  const feedNotes=allNotes.map(n=>`<div class="fitem"><div class="fdot">${svg('lock')}</div><div class="fc"><div class="note ${n.due?'due':''}"><div class="nh">${svg('lock')} ${n.due?'Follow-up · '+n.dueLabel:'Only your team sees this'}</div><div class="ntext">${n.text}</div><div class="nmeta">${n.meta}</div></div></div></div>`).join('');
  const composer=`<div class="composer">
      <div class="note-priv">${svg('lock')} Private note — only your team sees this.</div>
      <textarea id="noteText" placeholder="Add a note about ${c.first}…"></textarea>
      <div class="crow">
        <span class="remindchip ${remindOn?'on':''}" data-remind="1">${svg('clock')} Remind me${remindOn?' · in 3 days':''}</span>
        <button class="b primary" data-addnote="1">${svg('check')} Save note</button>
      </div>
    </div>`;
  return `<div class="rowlabel">History <span class="rl-note">· newest first · notes + system events</span></div>
    <div class="feed">${feedNotes}${feedSys}</div>
    ${composer}`;
}

function cardBody(){
  const c=CUST[cust];
  let inner;
  if(c.source==='imported' && tab==='overview'){
    // imported hint at top of overview
    inner=`<div class="invitecard">${svg('rocket')}<div class="iv-b"><div class="iv-t">Invite them to SETNAYAN — free</div><div class="iv-s">${c.first}'s wedding lives in your own list. Invite the couple and their planning syncs here automatically.</div></div><button class="b gold" data-toast="Invite sent to the couple">Invite couple</button></div>`+tabOverview();
  } else {
    inner={overview:tabOverview,quote:tabQuote,files:tabFiles,schedule:tabSchedule,activity:tabActivity}[tab]();
  }
  return cardHeader()+`<div class="cc-body">${inner}</div>`;
}

/* ===== render ===== */
function render(){
  const c=CUST[cust];
  document.getElementById('dUrl').textContent = view==='messenger'
    ? 'setnayan.com/vendor/messages'
    : 'setnayan.com/vendor/customers/'+cust.toLowerCase();
  const body = view==='messenger'?messengerBody():cardBody();
  document.getElementById('dBody').innerHTML=body;
  document.getElementById('pBody').innerHTML=body;

  // wire (both frames)
  document.querySelectorAll('[data-thread]').forEach(el=>el.onclick=()=>{msgThread=el.dataset.thread;msgOpen=true;MSGS[msgThread]&&(MSGS[msgThread].unread=false);render()});
  document.querySelectorAll('[data-msgback]').forEach(el=>el.onclick=()=>{msgOpen=false;railOpen=false;render()});
  document.querySelectorAll('[data-rail]').forEach(el=>el.onclick=()=>{railOpen=!railOpen;render()});
  document.querySelectorAll('[data-accept]').forEach(el=>el.onclick=()=>{if(MSGS[msgThread]){MSGS[msgThread].inquiry=false;CUST[msgThread].pill.inquiry='conv';}toast('Inquiry accepted — you can reply now');render()});
  document.querySelectorAll('[data-openprofile]').forEach(el=>el.onclick=()=>{if(el.hasAttribute('disabled'))return;cust=msgThread;view='card';tab='overview';syncToolbar();render()});
  document.querySelectorAll('[data-qa]').forEach(el=>el.onclick=()=>{if(el.hasAttribute('disabled'))return;actToast(el.dataset.qa)});
  document.querySelectorAll('[data-headact]').forEach(el=>el.onclick=()=>{const v=el.dataset.headact;if(v==='open-messenger'){view='messenger';msgThread=cust;msgOpen=true;syncToolbar();render();}else{actToast(v)}});
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render()});
  document.querySelectorAll('[data-toast]').forEach(el=>el.onclick=()=>toast(el.dataset.toast));
  document.querySelectorAll('[data-remind]').forEach(el=>el.onclick=()=>{remindOn=!remindOn;render()});
  document.querySelectorAll('[data-addnote]').forEach(el=>el.onclick=()=>{
    const boxes=document.querySelectorAll('#noteText'); let txt='';
    boxes.forEach(b=>{if(b.value.trim())txt=b.value.trim()});
    if(!txt)txt='(quick note)';
    notes.push({cust,text:txt,meta:'You · Jul 3',due:remindOn,dueLabel:'due Jul 6'});
    remindOn=false;
    toast(notes[notes.length-1].due?'Note saved — reminder set for Jul 6':'Private note saved');
    render();
  });
}
function syncToolbar(){
  document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));
  document.querySelectorAll('[data-cust]').forEach(x=>x.classList.toggle('active',x.dataset.cust===cust));
  document.querySelectorAll('[data-stage]').forEach(x=>x.classList.toggle('active',x.dataset.stage===stage));
}
/* toolbar */
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view==='messenger'){msgThread=CUST[cust].thread?cust:'RT';msgOpen=false;railOpen=false;}syncToolbar();render()});
document.querySelectorAll('[data-cust]').forEach(b=>b.onclick=()=>{cust=b.dataset.cust;tab='overview';if(view==='messenger'){msgThread=CUST[cust].thread?cust:'RT';msgOpen=false;railOpen=false;}syncToolbar();render()});
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;syncToolbar();render()});
document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{document.body.className=b.dataset.dev;document.querySelectorAll('[data-dev]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
render();
</script>
</body>
</html>
