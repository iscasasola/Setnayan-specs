<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SETNAYAN — Entity Map Console (design prototype)</title>
<style>
  :root{
    --alabaster:#F6F4EF; --paper:#FFFFFF; --obsidian:#191919; --ink:#2B2A28; --ink2:#56524B;
    --gold:#C2A05B; --gold-soft:#EADFC4; --line:#E8E3D9; --line2:#F0ECE3; --muted:#928B7E;
    --sky:#2F6FB0; --sky-bg:#EAF1F8; --lock:#B5852A; --lock-bg:#F8F0DD;
    --ok:#3E8B59; --ok-bg:#E8F2EA; --violet:#7A5AC9; --violet-bg:#F0EAFB;
    --report:#C0564A; --report-bg:#FAE9E6; --wait:#C9822B; --wait-bg:#F7EBD9;
    --terra:#B85C38; --terra-bg:#F7E9E2;
    /* entity hue ramp — one warm-to-cool ladder so types read as a family */
    --e-user:#4C7BA6;   --e-user-bg:#EAF1F7;
    --e-event:#B58A3A;  --e-event-bg:#F7EFDC;
    --e-guest:#6E9B6A;  --e-guest-bg:#EDF3EC;
    --e-vendor:#8A5FB0; --e-vendor-bg:#F1EAF8;
    --e-service:#B85C38;--e-service-bg:#F7E9E2;
    --e-order:#3E8B59;  --e-order-bg:#E8F2EA;
    --e-thread:#2F6FB0; --e-thread-bg:#EAF1F8;
    --e-billing:#B5852A;--e-billing-bg:#F8F0DD;
    --e-org:#7A5AC9;    --e-org-bg:#F0EAFB;
    --shadow:0 1px 2px rgba(25,25,25,.05),0 10px 30px rgba(25,25,25,.06);
    --shadow-sm:0 1px 2px rgba(25,25,25,.05);
    --shadow-pop:0 8px 40px rgba(25,25,25,.14),0 2px 8px rgba(25,25,25,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--alabaster);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
  button{font-family:inherit}
  .ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block;flex:0 0 auto}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* ── app frame ── */
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{display:flex;align-items:center;gap:14px;padding:11px 20px;background:var(--paper);
    border-bottom:1px solid var(--line);flex:0 0 auto;z-index:20}
  .brand{display:flex;flex-direction:column;gap:1px;min-width:0}
  .brand .t{font-size:15px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
  .brand .t .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  .brand .s{font-size:11.5px;color:var(--muted)}

  /* control toggle (Map | Tables) */
  .ctrl-toggle{display:flex;gap:4px;background:var(--alabaster);border:1px solid var(--line);border-radius:999px;padding:3px}
  .ctrl-toggle button{border:none;background:none;border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:600;
    cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
  .ctrl-toggle button .ico{width:15px;height:15px}
  .ctrl-toggle button.on{background:var(--obsidian);color:#fff;box-shadow:var(--shadow-sm)}

  .searchwrap{position:relative;margin-left:auto;flex:0 0 auto}
  .searchwrap .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
  #search{width:250px;border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 32px;font-size:12.5px;
    outline:none;background:var(--alabaster);color:var(--ink)}
  #search:focus{border-color:var(--gold);background:#fff}

  /* scope bar */
  .scopebar{display:flex;align-items:center;gap:10px;padding:8px 20px;background:var(--paper);
    border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;z-index:19}
  .scope-lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .scopepick{display:flex;gap:6px;flex-wrap:wrap}
  .schip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:12px;
    cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .schip:hover{border-color:var(--gold)}
  .schip.on{background:var(--obsidian);color:#fff;border-color:var(--obsidian)}
  .schip .ico{width:14px;height:14px}
  .schip .sub{font-size:10px;color:var(--muted);font-weight:600}
  .schip.on .sub{color:rgba(255,255,255,.72)}
  .scope-note{margin-left:auto;font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:7px}
  .scope-note .ico{width:14px;height:14px;color:var(--gold)}

  /* legend */
  .legend{display:flex;align-items:center;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--ink2)}
  .legend .li{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .legend .sw{width:9px;height:9px;border-radius:3px;flex:0 0 auto}

  .stage{display:flex;flex:1 1 auto;min-height:0;position:relative}

  /* ── MINDMAP ── */
  .mapwrap{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 1px 1px, rgba(146,139,126,.16) 1px, transparent 0) 0 0/26px 26px,
      var(--alabaster);cursor:grab}
  .mapwrap.grabbing{cursor:grabbing}
  #mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .edge{stroke:#C9C1B2;stroke-width:1.4;fill:none;transition:stroke .15s,stroke-width .15s}
  .edge.hot{stroke:var(--gold);stroke-width:2}
  .edge-lab{font-size:9.5px;fill:var(--muted);paint-order:stroke;stroke:var(--alabaster);stroke-width:3px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .node{cursor:pointer}
  .node .chip-bg{fill:#fff;stroke-width:1.4;transition:filter .12s}
  .node:hover .chip-bg{filter:drop-shadow(0 4px 10px rgba(25,25,25,.14))}
  .node.sel .chip-bg{stroke-width:2.4}
  .node.dim{opacity:.32}
  .node .chip-ic{stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .node .chip-lab{font-size:11px;font-weight:600;fill:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;dominant-baseline:middle}
  .node .chip-ct{font-size:9.5px;font-weight:700;fill:var(--muted);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;dominant-baseline:middle}
  .node.big .chip-lab{font-size:12.5px;font-weight:700}

  .mapctl{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .mapctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
    color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
  .mapctl button:hover{border-color:var(--gold);color:var(--ink)}
  .mapctl button .ico{width:17px;height:17px}
  .maphint{position:absolute;left:16px;bottom:16px;z-index:5;font-size:11px;color:var(--muted);
    background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:9px;padding:6px 11px;
    display:flex;align-items:center;gap:7px;backdrop-filter:blur(4px)}
  .maphint .ico{width:13px;height:13px;color:var(--gold)}

  /* ── TABLES ── */
  .tblstage{display:flex;flex:1 1 auto;min-height:0}
  .tblrail{width:230px;flex:0 0 auto;background:var(--paper);border-right:1px solid var(--line);
    overflow-y:auto;padding:12px 10px 40px}
  .tblrail .rail-title{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    padding:8px 10px 6px}
  .tblfolder{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink2)}
  .tblfolder:hover{background:var(--alabaster)}
  .tblfolder.on{background:var(--obsidian);color:#fff}
  .tblfolder .ico{width:17px;height:17px}
  .tblfolder .lbl{flex:1;font-size:13px;font-weight:600}
  .tblfolder .ct{font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .tblfolder.on .ct{color:rgba(255,255,255,.7)}

  .tblmain{flex:1 1 auto;min-width:0;overflow-y:auto;padding:22px 26px 60px}
  .tblhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .tblhead .h{font-size:20px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:11px}
  .tblhead .h .ico{width:21px;height:21px}
  .tblhead .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .tblsearch{position:relative}
  .tblsearch .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
  .tblsearch input{width:230px;border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 32px;font-size:12px;
    outline:none;background:var(--alabaster)}
  .tblsearch input:focus{border-color:var(--gold);background:#fff}

  .etable{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);
    border-radius:14px;overflow:hidden;font-size:12.5px}
  .etable th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    padding:11px 15px;background:var(--alabaster);border-bottom:1px solid var(--line);white-space:nowrap}
  .etable td{padding:11px 15px;border-bottom:1px solid var(--line2);vertical-align:middle}
  .etable tr:last-child td{border-bottom:none}
  .etable tbody tr{cursor:pointer}
  .etable tbody tr:hover td{background:#fdfcf9}
  .et-name{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:9px}
  .et-ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .et-ic .ico{width:14px;height:14px}
  .et-id{font-size:10.5px;color:var(--muted)}
  .et-sub{font-size:11px;color:var(--muted)}

  .badge{font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:4px;text-transform:uppercase;letter-spacing:.04em}
  .badge.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-transform:none;letter-spacing:0}
  .badge .ico{width:11px;height:11px}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.wait{background:var(--wait-bg);color:#8a6220}
  .badge.sky{background:var(--sky-bg);color:var(--sky)}
  .badge.violet{background:var(--violet-bg);color:var(--violet)}
  .badge.terra{background:var(--terra-bg);color:var(--terra)}
  .badge.neutral{background:var(--line2);color:var(--ink2)}
  .badge.gold{background:var(--lock-bg);color:var(--lock)}
  .badge.report{background:var(--report-bg);color:var(--report)}

  .empty{color:var(--muted);font-size:12.5px;border:1px dashed var(--line);border-radius:12px;padding:22px;
    text-align:center;background:var(--alabaster)}

  /* ── ENTITY CARD (the hinge) ── */
  .scrim{position:fixed;inset:0;background:rgba(25,25,25,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .card{position:fixed;top:0;right:0;height:100vh;width:452px;max-width:96vw;background:var(--paper);
    border-left:1px solid var(--line);box-shadow:var(--shadow-pop);transform:translateX(100%);
    transition:transform .24s cubic-bezier(.4,0,.1,1);z-index:50;display:flex;flex-direction:column}
  .card.on{transform:translateX(0)}

  .card-crumb{display:flex;align-items:center;gap:6px;padding:10px 14px 0;flex:0 0 auto;flex-wrap:wrap;min-height:12px}
  .crumb-b{border:none;background:none;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;
    display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:7px}
  .crumb-b:hover{background:var(--line2);color:var(--ink)}
  .crumb-b .ico{width:12px;height:12px}
  .crumb-sep{color:var(--line);font-size:11px}
  .crumb-cur{font-size:11px;font-weight:700;color:var(--ink2);padding:3px 4px;display:inline-flex;align-items:center;gap:5px}

  .card-head{display:flex;align-items:center;gap:12px;padding:12px 16px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .card-head .av{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;font-weight:700;font-size:15px;position:relative}
  .card-head .av .ico{width:22px;height:22px}
  .card-head .ti{flex:1;min-width:0}
  .card-head .ti .nm{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.15;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-head .ti .row2{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
  .card-head .ti .id{font-size:10.5px;color:var(--muted)}
  .card-x{border:none;background:none;cursor:pointer;color:var(--muted);padding:7px;border-radius:9px;display:flex;align-self:flex-start}
  .card-x:hover{background:var(--line2);color:var(--ink)}

  .status-line{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line2);
    background:var(--alabaster);flex:0 0 auto;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
  .status-line .ico{width:14px;height:14px;color:var(--ok)}
  .status-line b{color:var(--ink);font-weight:600}

  .card-body{flex:1;overflow-y:auto;padding:16px}
  .sect{margin-bottom:18px}
  .sect > .lab{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .sect > .lab .ico{width:13px;height:13px;color:var(--gold)}
  .sect > .lab .n{font-size:9.5px;font-weight:700;color:var(--muted);background:var(--line2);border-radius:999px;padding:1px 7px}

  /* key-value block */
  .kv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .kv .r{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:9px 13px;border-top:1px solid var(--line2)}
  .kv .r:first-child{border-top:none}
  .kv .r .k{color:var(--muted)}
  .kv .r .v{font-weight:600;text-align:right}
  .kv .r .v.mono{font-weight:600}

  /* connection rail — chips grouped by edge */
  .edgegroup{margin-bottom:12px}
  .edgegroup .eg-lab{font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .edgegroup .eg-lab .verb{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    background:var(--line2);border-radius:999px;padding:1px 7px}
  .conn-list{display:flex;flex-wrap:wrap;gap:7px}
  .conn{border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 7px;background:#fff;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;max-width:100%;transition:border-color .12s,box-shadow .12s}
  .conn:hover{border-color:var(--gold);box-shadow:var(--shadow-sm)}
  .conn .cav{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    font-size:9.5px;font-weight:700}
  .conn .cav .ico{width:13px;height:13px}
  .conn .cb{min-width:0}
  .conn .cn{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .conn .cs{font-size:10px;color:var(--muted)}
  .conn.count{cursor:default;color:var(--muted);border-style:dashed}
  .conn.count:hover{border-color:var(--line);box-shadow:none}

  /* actions row */
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .btn{border:none;border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn .ico{width:14px;height:14px}
  .btn.primary{background:var(--obsidian);color:#fff}
  .btn.gold{background:var(--gold);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
  .btn.ghost:hover{border-color:var(--gold)}

  /* lifecycle ribbon (guest) */
  .ribbon{display:flex;align-items:center;gap:0;margin:2px 0 4px;overflow-x:auto;padding-bottom:2px}
  .rstep{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .rdot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;
    justify-content:center;font-size:10px;font-weight:700;color:var(--muted);flex:0 0 auto}
  .rdot .ico{width:12px;height:12px}
  .rlab{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
  .rline{width:20px;height:2px;background:var(--line);margin:0 3px;flex:0 0 auto}
  .rstep.done .rdot{background:var(--ok);border-color:var(--ok);color:#fff}
  .rstep.done .rlab{color:var(--ink2)}
  .rstep.done + .rline{background:var(--ok)}
  .rstep.cur .rdot{background:var(--obsidian);border-color:var(--obsidian);color:#fff;box-shadow:0 0 0 4px rgba(25,25,25,.08)}
  .rstep.cur .rlab{color:var(--ink);font-weight:700}

  /* activation / billing sub-cards */
  .subcard{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;margin-bottom:9px}
  .subcard .sc-top{display:flex;align-items:center;gap:9px}
  .subcard .sc-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .subcard .sc-ic .ico{width:16px;height:16px}
  .subcard .sc-b{flex:1;min-width:0}
  .subcard .sc-n{font-size:13px;font-weight:700}
  .subcard .sc-m{font-size:11px;color:var(--muted);margin-top:1px}
  .subcard .sc-body{margin-top:9px;font-size:12px;color:var(--ink2)}
  .memtok{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line2);font-size:12px}
  .memtok:first-child{border-top:none;padding-top:2px}
  .memtok .mt-n{display:flex;align-items:center;gap:8px}
  .memtok .mt-n .mav{width:22px;height:22px;border-radius:6px;background:var(--e-user-bg);color:var(--e-user);
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
  .memtok .mt-bal{font-weight:700;font-variant-numeric:tabular-nums}
  .memtok .mt-bal.zero{color:var(--muted);font-weight:600}
  .infoline{font-size:11px;color:#7a5d2a;background:var(--wait-bg);border:1px solid #e7cfa6;border-radius:9px;
    padding:8px 11px;display:flex;align-items:flex-start;gap:7px;line-height:1.45;margin-top:2px}
  .infoline .ico{width:13px;height:13px;color:var(--wait);margin-top:1px;flex:0 0 auto}

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--obsidian);
    color:#fff;border-radius:11px;padding:11px 18px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-pop);
    display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:88vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .ico{width:15px;height:15px;color:#9ad9ac}

  .footer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);font-size:10.5px;color:var(--muted);
    background:rgba(246,244,239,.92);border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;
    padding:5px 15px;z-index:30;text-align:center}

  /* narrow fallback */
  @media (max-width:900px){
    body{overflow:auto}
    .app{height:auto}
    .topbar{flex-wrap:wrap}
    .searchwrap{margin-left:0;flex:1 1 100%;order:5}
    #search{width:100%}
    .mapwrap{min-height:62vh}
    .tblstage{flex-direction:column}
    .tblrail{width:100%;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;padding:10px}
    .tblrail .rail-title{width:100%}
    .tblfolder{flex:0 0 auto;padding:7px 11px}
    .tblmain{padding:16px}
    .card{width:100%}
    .scope-note{margin-left:0;flex:1 1 100%}
    .legend{width:100%}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ── TOP BAR ── -->
  <div class="topbar">
    <div class="brand">

/* which edges to DRAW on the map for each scope (from → to, with a verb) */
function scopeEdges(scope){
  const layout=LAYOUTS[scope];
  const present=new Set(layout.map(n=>n.id));
  const out=[];
  layout.forEach(n=>{
    const rec=ENT[n.id]; if(!rec||!rec.edges) return;
    rec.edges.forEach(eg=>{
      (eg.to||[]).forEach(t=>{
        if(present.has(t)){ out.push({from:n.id, to:t, verb:eg.verb}); }
      });
    });
  });
  // de-dupe reciprocal edges (keep first)
  const seen=new Set(), dedup=[];
  out.forEach(e=>{ const k=[e.from,e.to].sort().join('|'); if(!seen.has(k)){seen.add(k);dedup.push(e);} });
  return dedup;
}

const SVGNS='http://www.w3.org/2000/svg';
const mapg=document.getElementById('mapg');
const mapsvg=document.getElementById('mapsvg');
const mapwrap=document.getElementById('mapwrap');
let highlightId=null;   // node to pulse after a cross-jump

function nodeWidth(rec){
  const base=rec.name.length*6.6+52;
  return Math.max(96, Math.min(220, base)) + (rec.typeNode?18:0);
}
function renderMap(){
  mapg.innerHTML='';
  const layout=LAYOUTS[state.scope];
  const pos={}; layout.forEach(n=>pos[n.id]=n);
  const edges=scopeEdges(state.scope);

  // edges first (under nodes)
  edges.forEach((e,i)=>{
    const a=pos[e.from], b=pos[e.to];
    const path=document.createElementNS(SVGNS,'path');
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const dx=b.x-a.x, dy=b.y-a.y;
    // gentle curve: bow the control point perpendicular a touch
    const cx=mx - dy*0.08, cy=my + dx*0.08;
    path.setAttribute('d','M'+a.x+' '+a.y+' Q'+cx+' '+cy+' '+b.x+' '+b.y);
    path.setAttribute('class','edge');
    path.dataset.from=e.from; path.dataset.to=e.to;
    mapg.appendChild(path);
    // edge label — always on for platform, else on hover
    if(state.scope==='platform'){
      const t=document.createElementNS(SVGNS,'text');
      t.setAttribute('x',cx); t.setAttribute('y',cy-2);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('class','edge-lab');
      t.textContent=e.verb;
      mapg.appendChild(t);
    }
  });

  // nodes
  layout.forEach(n=>{
    const rec=ENT[n.id]; if(!rec) return;
    const t=TYPE[rec.type];
    const w=nodeWidth(rec), h=n.big?38:32;
    const g=document.createElementNS(SVGNS,'g');
    g.setAttribute('class','node'+(n.big?' big':'')+(highlightId===n.id?' sel':''));
    g.setAttribute('transform','translate('+(n.x-w/2)+','+(n.y-h/2)+')');
    g.dataset.id=n.id;

    const bg=document.createElementNS(SVGNS,'rect');
    bg.setAttribute('class','chip-bg');
    bg.setAttribute('width',w); bg.setAttribute('height',h);
    bg.setAttribute('rx',h/2);
    bg.setAttribute('fill', highlightId===n.id ? t.bg : '#fff');
    bg.setAttribute('stroke', t.c);
    g.appendChild(bg);

    // icon puck
    const puck=document.createElementNS(SVGNS,'circle');
    puck.setAttribute('cx',h/2); puck.setAttribute('cy',h/2); puck.setAttribute('r',h/2-6);
    puck.setAttribute('fill',t.bg);
    g.appendChild(puck);
    const ic=document.createElementNS(SVGNS,'svg');
    ic.setAttribute('viewBox','0 0 24 24');
    ic.setAttribute('x',h/2-8); ic.setAttribute('y',h/2-8);
    ic.setAttribute('width',16); ic.setAttribute('height',16);
    ic.setAttribute('class','chip-ic');
    ic.setAttribute('stroke',t.c); ic.setAttribute('fill','none');
    ic.innerHTML=IP[rec.setnayan?'bolt':t.ic]||IP.tag;
    g.appendChild(ic);

    // label
    const lab=document.createElementNS(SVGNS,'text');
    lab.setAttribute('class','chip-lab');
    lab.setAttribute('x',h-2); lab.setAttribute('y',h/2+1);
    lab.textContent=rec.name.length>26?rec.name.slice(0,24)+'…':rec.name;
    g.appendChild(lab);

    // count / id micro-line for type nodes
    if(rec.typeNode && rec.kv){
      const ct=document.createElementNS(SVGNS,'text');
      ct.setAttribute('class','chip-ct');
      ct.setAttribute('x',h-2); ct.setAttribute('y',h/2+13);
      ct.textContent=rec.kv[0][1];
      g.appendChild(ct);
      lab.setAttribute('y',h/2-4);
    }

    g.addEventListener('click',(e)=>{e.stopPropagation();openCard(n.id,true);});
    g.addEventListener('mouseenter',()=>hotEdges(n.id,true));
    g.addEventListener('mouseleave',()=>hotEdges(n.id,false));
    mapg.appendChild(g);
  });

  applyView();
}
function hotEdges(id,on){
  mapg.querySelectorAll('.edge').forEach(p=>{
    if(p.dataset.from===id||p.dataset.to===id){
      p.classList.toggle('hot',on);
      if(on) p.parentNode.appendChild(p); // raise
    }
  });
}
function applyView(){
  mapg.setAttribute('transform','translate('+state.view.x+','+state.view.y+') scale('+state.view.k+')');
}
function fitView(){
  const layout=LAYOUTS[state.scope];
  const xs=layout.map(n=>n.x), ys=layout.map(n=>n.y);
  const minX=Math.min(...xs)-140,maxX=Math.max(...xs)+140,minY=Math.min(...ys)-90,maxY=Math.max(...ys)+90;
  const bw=maxX-minX, bh=maxY-minY;
  const rect=mapwrap.getBoundingClientRect();
  const k=Math.min(rect.width/bw, rect.height/bh, 1.15);
  state.view.k=k;
  state.view.x=(rect.width-bw*k)/2 - minX*k;
  state.view.y=(rect.height-bh*k)/2 - minY*k;
  applyView();
}

/* pan + zoom */
let panning=false, panStart=null;
mapwrap.addEventListener('mousedown',(e)=>{
  if(e.target.closest('.node')||e.target.closest('.mapctl')) return;
  panning=true; panStart={x:e.clientX,y:e.clientY,vx:state.view.x,vy:state.view.y};
  mapwrap.classList.add('grabbing');
});
window.addEventListener('mousemove',(e)=>{
  if(!panning) return;
  state.view.x=panStart.vx+(e.clientX-panStart.x);
  state.view.y=panStart.vy+(e.clientY-panStart.y);
  applyView();
});
window.addEventListener('mouseup',()=>{panning=false;mapwrap.classList.remove('grabbing');});
mapwrap.addEventListener('wheel',(e)=>{
  e.preventDefault();
  const rect=mapwrap.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const factor=e.deltaY<0?1.12:0.89;
  const nk=Math.max(0.4,Math.min(2.4,state.view.k*factor));
  // zoom to cursor
  state.view.x=mx-(mx-state.view.x)*(nk/state.view.k);
  state.view.y=my-(my-state.view.y)*(nk/state.view.k);
  state.view.k=nk; applyView();
},{passive:false});
function zoomBy(f){
  const rect=mapwrap.getBoundingClientRect();
  const mx=rect.width/2, my=rect.height/2;
  const nk=Math.max(0.4,Math.min(2.4,state.view.k*f));
  state.view.x=mx-(mx-state.view.x)*(nk/state.view.k);
  state.view.y=my-(my-state.view.y)*(nk/state.view.k);
  state.view.k=nk; applyView();
}
document.getElementById('zoomIn').onclick=()=>zoomBy(1.2);
document.getElementById('zoomOut').onclick=()=>zoomBy(0.83);
document.getElementById('zoomFit').onclick=()=>fitView();
mapwrap.addEventListener('click',(e)=>{ if(!e.target.closest('.node')) { /* background click: nothing */ } });

  events:[['Event','name'],['Date','date'],['Vendors','vendors'],['Status','status']],

  vendors:[['Vendor','name'],['Leaf','leaf'],['Tier','tier'],['Status','status']],
  services:[['Service card','name'],['Leaf','leaf'],['Publisher','pub'],['Model','model']],
  orders:[['Order','name'],['Amount','amt'],['Reference','ref'],['Status','status']],
  threads:[['Thread','name'],['Between','between'],['State','tstate'],['Msgs','msgs']],
  billing:[['Billing item','name'],['Belongs to','belongs'],['Kind','kind'],['Detail','detail']],
};
function cell(r,col){
  const kv=k=>{const f=(r.kv||[]).find(x=>x[0].toLowerCase()===k.toLowerCase());return f?f[1]:'—';};
  switch(col){
    case 'roles': return r.roles ? r.roles.map(x=>x.role).join(', ') : '—';
    case 'origin': return kv('Account origin');
    case 'date': return kv('Date');
    case 'vendors':{const eg=(r.edges||[]).find(e=>e.verb==='vendors booked');return eg?eg.to.length:'—';}
    case 'life': return r.guest?GSTATE[r.guest.state]:'—';
    case 'seat': return r.guest?r.guest.table:'—';
    case 'tagged': return r.guest?String(r.guest.tagged):'—';
    case 'leaf': return kv('Leaf');
    case 'tier': return kv('Tier');
    case 'pub': return r.setnayan?'SETNAYAN':kv('Published by')||(r.edges||[]).some(e=>e.verb==='published by')?'Vendor org':'—';
    case 'model': return r.setnayan?'order → activate':'inquire → book';
    case 'amt': return kv('Amount');
    case 'ref': return kv('Reference');
    case 'between': return kv('Between');
    case 'tstate': return kv('State')!=='—'?kv('State'):'Open';
    case 'msgs': return kv('Messages');
    case 'belongs': return r.billing==='sub'?'Org':'Members';
    case 'kind': return r.billing==='sub'?'Subscription':'Tokens';
    case 'detail': return r.billing==='sub'?kv('Amount')+' · '+kv('Cycle'):(r.members?r.members.reduce((a,m)=>a+m[3],0)+' tokens':'—');
    default: return '';
  }
}

  const map={
    'S89U':'ok','event':'ok'
  };
  // derive a chip from record type/state
  if(r.type==='order') return r.id.includes('PEND')?'<span class="badge wait">'+svg('clock')+'Pending</span>':'<span class="badge ok">'+svg('check')+'Paid</span>';
  if(r.type==='vendor') return r.verified?'<span class="badge ok">'+svg('shield')+'Verified</span>':'<span class="badge neutral">Unverified</span>';
  if(r.type==='service'&&r.setnayan) return r.activation.state==='ACTIVE'?'<span class="badge ok">'+svg('check')+'Active</span>':'<span class="badge wait">'+svg('clock')+'Pending</span>';
  if(r.type==='event') return '<span class="badge ok">'+svg('check')+'Active</span>';
  return '<span class="badge ok">'+svg('check')+'Active</span>';
}
function renderTables(){
  // rail
  const rail=document.getElementById('tblrail');
  rail.innerHTML='<div class="rail-title">Entity tables</div>'+TABLES.map(t=>{
    const n=recordsFor(t.key).length;
    return '<div class="tblfolder'+(state.table===t.key?' on':'')+'" data-table="'+t.key+'">'
      +'<span style="color:'+TYPE[t.type].c+'">'+svg(t.ic)+'</span>'
      +'<span class="lbl">'+t.lab+'</span><span class="ct">'+n+'</span></div>';
  }).join('');
  rail.querySelectorAll('[data-table]').forEach(el=>el.onclick=()=>{state.table=el.dataset.table;state.tableSearch='';renderTables();});

  // main
  const t=TABLES.find(x=>x.key===state.table);
  let recs=recordsFor(state.table);
  const q=state.tableSearch.toLowerCase();
  if(q) recs=recs.filter(r=>r.name.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)
    ||(r.kv||[]).some(kv=>String(kv[1]).toLowerCase().includes(q)));
  const cols=TABLE_COLS[state.table];
  const rows=recs.length?recs.map(r=>{
    const tds=cols.map(c=>{
      if(c[1]==='name'){
        return '<td><div class="et-name"><span class="et-ic" style="background:'+TYPE[r.type].bg+';color:'+TYPE[r.type].c+'">'
          +svg(r.setnayan?'bolt':TYPE[r.type].ic)+'</span><div><div>'+esc(r.name)+'</div><div class="et-id mono">'+r.id+'</div></div></div></td>';
      }
      if(c[1]==='status') return '<td>'+statusChip(r)+'</td>';
      return '<td class="et-sub">'+esc(String(cell(r,c[1])))+'</td>';
    }).join('');
    return '<tr data-row="'+r.id+'">'+tds+'</tr>';
  }).join(''):'';
  const main=document.getElementById('tblmain');
  main.innerHTML='<div class="tblhead"><div><div class="h"><span style="color:'+TYPE[t.type].c+'">'+svg(t.ic)+'</span>'+t.lab+'</div>'
    +'<div class="sub">'+recs.length+' record'+(recs.length===1?'':'s')+' · click a row to open its card</div></div>'
    +'<div class="tblsearch">'+svg('user').replace(IP.user,IP.eye)+'<input id="tblSearchInput" placeholder="Filter these rows…" value="'+esc(state.tableSearch)+'"/></div></div>'
    +(recs.length
      ? '<table class="etable"><thead><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table>'
      : '<div class="empty">'+svg('info')+' No records match “'+esc(state.tableSearch)+'”.</div>');
  const si=document.getElementById('tblSearchInput');
  si.oninput=()=>{state.tableSearch=si.value;renderTablesRowsOnly();};
  main.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>openCard(el.dataset.row,true));
}
/* keep focus while typing in the table search */
function renderTablesRowsOnly(){
  const t=TABLES.find(x=>x.key===state.table);
  let recs=recordsFor(state.table);
  const q=state.tableSearch.toLowerCase();
  if(q) recs=recs.filter(r=>r.name.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)
    ||(r.kv||[]).some(kv=>String(kv[1]).toLowerCase().includes(q)));
  const cols=TABLE_COLS[state.table];
  const body=document.querySelector('.etable tbody');
  const wrap=document.querySelector('.tblmain');
  if(!recs.length){
    // replace whole table area with empty note but keep the head/search
    let tbl=document.querySelector('.etable');
    if(tbl) tbl.outerHTML='<div class="empty" id="tblEmpty">'+svg('info')+' No records match “'+esc(state.tableSearch)+'”.</div>';
    return;
  }
  const rowsHtml=recs.map(r=>{
    const tds=cols.map(c=>{
      if(c[1]==='name') return '<td><div class="et-name"><span class="et-ic" style="background:'+TYPE[r.type].bg+';color:'+TYPE[r.type].c+'">'
        +svg(r.setnayan?'bolt':TYPE[r.type].ic)+'</span><div><div>'+esc(r.name)+'</div><div class="et-id mono">'+r.id+'</div></div></div></td>';
      if(c[1]==='status') return '<td>'+statusChip(r)+'</td>';
      return '<td class="et-sub">'+esc(String(cell(r,c[1])))+'</td>';
    }).join('');
    return '<tr data-row="'+r.id+'">'+tds+'</tr>';
  }).join('');
  let tbl=document.querySelector('.etable'), emptyEl=document.getElementById('tblEmpty');
  if(!tbl && emptyEl){
    emptyEl.outerHTML='<table class="etable"><thead><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody></tbody></table>';
    tbl=document.querySelector('.etable');
  }
  if(tbl){ tbl.querySelector('tbody').innerHTML=rowsHtml;
    tbl.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>openCard(el.dataset.row,true)); }
}

/* ═════════════════════════════════════════════════════════════════════════
   ENTITY CARD (the hinge)
   ═════════════════════════════════════════════════════════════════════════ */
const cardEl=document.getElementById('card');
const scrim=document.getElementById('scrim');
function openCard(id,fresh){
  if(!ENT[id]){toast('That record isn’t in this demo slice.');return;}
  if(fresh) state.cardStack=[id];
  else state.cardStack.push(id);
  renderCard();
  cardEl.classList.add('on'); scrim.classList.add('on');
}
function cardBack(){
  if(state.cardStack.length>1){ state.cardStack.pop(); renderCard(); }
}
function crumbTo(i){ state.cardStack=state.cardStack.slice(0,i+1); renderCard(); }
function closeCard(){ cardEl.classList.remove('on'); scrim.classList.remove('on'); }

function connChip(id){
  const r=ENT[id]; if(!r) return '';
  const t=TYPE[r.type];
  const ic=r.setnayan?'bolt':t.ic;
  return '<div class="conn" data-conn="'+id+'"><span class="cav" style="background:'+t.bg+';color:'+t.c+'">'+svg(ic)+'</span>'
    +'<div class="cb"><div class="cn">'+esc(r.name)+'</div><div class="cs">'+t.lab+' · '+r.id.slice(0,9)+'…</div></div></div>';
}
function countChip(txt){ return '<div class="conn count"><span class="cav" style="background:var(--line2);color:var(--muted)">'+svg('layers')+'</span><div class="cb"><div class="cn">'+esc(txt)+'</div><div class="cs">summary</div></div></div>'; }

function renderCard(){
  const id=state.cardStack[state.cardStack.length-1];
  const r=ENT[id]; const t=TYPE[r.type];

  /* breadcrumb */
  const crumb=document.getElementById('cardCrumb');
  if(state.cardStack.length>1){
    let h='<button class="crumb-b" data-back="1">'+svg('chevL')+'Back</button>';
    state.cardStack.forEach((cid,i)=>{
      const cr=ENT[cid];
      if(i===state.cardStack.length-1){ h+='<span class="crumb-sep">›</span><span class="crumb-cur">'+esc(cr.name)+'</span>'; }
      else { h+=(i===0?'':'<span class="crumb-sep">›</span>')+'<button class="crumb-b" data-crumb="'+i+'">'+esc(cr.name)+'</button>'; }
    });
    crumb.innerHTML=h;
  } else crumb.innerHTML='';

  /* header */
  const head=document.getElementById('cardHead');
  const badges=[];
  if(r.verified) badges.push('<span class="badge ok">'+svg('shield')+'Verified</span>');
  if(r.setnayan) badges.push('<span class="badge terra">'+svg('bolt')+'In-app · SETNAYAN</span>');
  if(r.typeNode) badges.push('<span class="badge neutral">Type-level</span>');
  if(r.org) badges.push('<span class="badge violet">Org</span>');
  head.innerHTML='<div class="av" style="background:'+t.bg+';color:'+t.c+'">'
    +(r.initials&&r.initials.length<=3&&/^[A-Z0-9&$◈…✓]+$/i.test(r.initials)?('<b>'+r.initials+'</b>'):svg(r.setnayan?'bolt':t.ic))+'</div>'
    +'<div class="ti"><div class="nm">'+esc(r.name)+'</div>'
    +'<div class="row2"><span class="badge neutral">'+t.lab+'</span>'+badges.join('')+'<span class="id mono">'+r.id+'</span></div></div>'
    +'<button class="card-x" id="cardX">'+svg('x')+'</button>';

  /* status line */
  const st=document.getElementById('cardStatus');
  st.innerHTML=(r.status?svg(r.status.ic)+'<span>'+r.status.txt+'</span>':'');

  /* body */
  let body='';

  // guest lifecycle ribbon
  if(r.type==='guest' && r.guest){
    const steps=['Invited','RSVP’d','Claimed'];
    let rb='';
    steps.forEach((s,i)=>{
      const cls=i<r.guest.state?'done':i===r.guest.state?'cur':'';
      rb+='<div class="rstep '+cls+'"><div class="rdot">'+(i<r.guest.state?svg('check'):(i+1))+'</div><span class="rlab">'+s+'</span></div>';
      if(i<steps.length-1) rb+='<div class="rline"></div>';
    });
    body+='<div class="sect"><div class="lab">'+svg('bolt')+'Lifecycle</div><div class="ribbon">'+rb+'</div>'
      +(r.guest.qr?'<div class="infoline" style="background:var(--ok-bg);border-color:#cfe6d5;color:#3e6b4c">'+svg('qr').replace('color:#7a5d2a','')+'<span>Personal QR issued · powers photo tagging &amp; check-in.</span></div>'
        :'<div class="infoline"><span></span>'+svg('info')+'<span>No personal QR yet — issues on RSVP.</span></div>')+'</div>';
  }

  // key-values
  if(r.kv){
    body+='<div class="sect"><div class="lab">'+svg('info')+'Details</div><div class="kv">'
      +r.kv.map(kv=>'<div class="r"><span class="k">'+esc(kv[0])+'</span><span class="v'+(/^[₱S]/.test(String(kv[1]))?' mono':'')+'">'+esc(String(kv[1]))+'</span></div>').join('')
      +'</div></div>';
  }

  // in-app activation block (service · setnayan variant)
  if(r.type==='service' && r.setnayan && r.activation){
    const active=r.activation.state==='ACTIVE';
    body+='<div class="sect"><div class="lab">'+svg('bolt')+'Per-event activation</div>'
      +'<div class="subcard"><div class="sc-top"><div class="sc-ic" style="background:'+(active?'var(--ok-bg)':'var(--wait-bg)')+';color:'+(active?'var(--ok)':'var(--wait)')+'">'+svg(active?'check':'clock')+'</div>'
      +'<div class="sc-b"><div class="sc-n">'+r.activation.state+'</div><div class="sc-m">order → pay → activate · not inquire → thread → book</div></div></div>'
      +'<div class="sc-body">'+esc(r.activation.line)+'</div></div>'
      +'<div class="infoline"><span></span>'+svg('info')+'<span>Same card grammar as a vendor service — different edge. This one is published by the SETNAYAN org (<span class="mono">is_setnayan_service</span>).</span></div></div>';
  }

  // vendor billing blocks (subscription = org, tokens = per member)
  if(r.type==='billing' && r.billing==='sub'){
    body+='<div class="sect"><div class="lab">'+svg('wallet')+'Subscription — belongs to the org</div>'
      +'<div class="infoline"><span></span>'+svg('info')+'<span>The subscription is the <b>organisation’s</b>. Tokens are separate and personal to each member — see the token card.</span></div></div>';
  }
  if(r.type==='billing' && r.billing==='tokens' && r.members){
    body+='<div class="sect"><div class="lab">'+svg('coins')+'Tokens — personal to each member</div><div class="subcard">'
      +r.members.map(m=>'<div class="memtok" data-conn="'+m[0]+'"><span class="mt-n"><span class="mav">'+m[2]+'</span>'+esc(m[1])+'</span><span class="mt-bal'+(m[3]===0?' zero':'')+'">'+m[3]+' ◈</span></div>').join('')
      +'</div><div class="infoline"><span></span>'+svg('info')+'<span>Tokens burn to <b>answer an inquiry</b> (once per vendor-event). They are not a way to buy SKUs.</span></div></div>';
  }

  // vendor: members-with-roles shown as a labelled group even if also in edges
  // roles block on a user card
  if(r.roles && r.roles.length){
    body+='<div class="sect"><div class="lab">'+svg('key')+'Roles</div><div class="conn-list" style="flex-direction:column">'
      +r.roles.map(role=>{
        const ref=ENT[role.of]; const rt=ref?TYPE[ref.type]:null;
        return '<div class="conn" data-conn="'+role.of+'" style="width:100%"><span class="cav" style="background:'+(rt?rt.bg:'var(--line2)')+';color:'+(rt?rt.c:'var(--muted)')+'">'+svg(rt?rt.ic:'link')+'</span>'
          +'<div class="cb"><div class="cn">'+role.r+' '+esc(ref?ref.name:'—')+'</div><div class="cs">Role · '+role.role+'</div></div></div>';
      }).join('')+'</div></div>';
  }

  // connections rail — grouped by edge verb
  if(r.edges && r.edges.length){
    body+='<div class="sect"><div class="lab">'+svg('link')+'Connections</div>';
    r.edges.forEach(eg=>{
      const chips=(eg.to||[]).map(connChip).filter(Boolean);
      if(!chips.length && !eg.count) return;
      body+='<div class="edgegroup"><div class="eg-lab"><span class="verb">'+esc(eg.verb)+'</span>'
        +(eg.to&&eg.to.length?'<span style="color:var(--muted);font-size:10.5px">'+eg.to.length+(eg.more?'+':'')+'</span>':'')+'</div>'
        +'<div class="conn-list">'+chips.join('')
        +(eg.count?countChip(eg.count):'')
        +(eg.more?countChip('+'+eg.more+' more '+(TYPE[ENT[eg.to[0]].type]?TYPE[ENT[eg.to[0]].type].lab.toLowerCase():'records')):'')
        +'</div></div>';
    });
    body+='</div>';
  }

  // actions row + show-on-map
  const onMap=LAYOUTS[state.scope] && LAYOUTS[state.scope].some(n=>n.id===r.id)
    || jumpScopeFor(r.id)!==null;
  body+='<div class="sect"><div class="lab">'+svg('bolt')+'Actions</div><div class="actions">';
  if(!r.typeNode) body+='<button class="btn primary" data-act="Opened full record">'+svg('eye')+'Open full record</button>';
  if(onMap) body+='<button class="btn gold" data-showmap="'+r.id+'">'+svg('map')+'Show on map</button>';
  body+=cardActionsFor(r);
  body+='</div></div>';

  document.getElementById('cardBody').innerHTML=body;

  // wire
  document.getElementById('cardX').onclick=closeCard;
  cardEl.querySelectorAll('[data-conn]').forEach(el=>el.onclick=()=>openCard(el.dataset.conn,false));
  cardEl.querySelectorAll('[data-back]').forEach(el=>el.onclick=cardBack);
  cardEl.querySelectorAll('[data-crumb]').forEach(el=>el.onclick=()=>crumbTo(+el.dataset.crumb));
  cardEl.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>toast(el.dataset.act));
  cardEl.querySelectorAll('[data-showmap]').forEach(el=>el.onclick=()=>showOnMap(el.dataset.showmap));
}
function cardActionsFor(r){
  switch(r.type){
    case 'user': return '<button class="btn ghost" data-act="Message sent">'+svg('send')+'Message</button>';
    case 'event': return '<button class="btn ghost" data-act="Opened couple dashboard">'+svg('eye')+'Dashboard</button>';
    case 'vendor': return '<button class="btn ghost" data-act="Opened vendor profile">'+svg('building')+'Profile</button>';
    case 'guest': return '<button class="btn ghost" data-act="Resent invite">'+svg('mail')+'Resend invite</button>';
    case 'order': return '<button class="btn ghost" data-act="Opened reconciliation">'+svg('receipt')+'Reconcile</button>';
    case 'thread': return '<button class="btn ghost" data-act="Opened thread">'+svg('chat')+'Open thread</button>';
    default: return '';
  }
}

/* which scope owns a given entity id (for cross-jump) */
function jumpScopeFor(id){
  for(const s of ['event','vendor','platform']){
    if(LAYOUTS[s] && LAYOUTS[s].some(n=>n.id===id)) return s;
  }
  return null;
}
function showOnMap(id){
  // switch to map control; pick a scope that contains this node
  let scope=state.scope;
  if(!(LAYOUTS[scope] && LAYOUTS[scope].some(n=>n.id===id))){
    scope=jumpScopeFor(id)||state.scope;
  }
  setControl('map');
  if(scope!==state.scope){ setScope(scope,true); }
  closeCard();
  highlightId=id;
  renderMap();
  // center the node
  const node=LAYOUTS[scope].find(n=>n.id===id);
  if(node){
    const rect=mapwrap.getBoundingClientRect();
    state.view.k=Math.max(state.view.k,0.95);
    state.view.x=rect.width/2 - node.x*state.view.k;
    state.view.y=rect.height/2 - node.y*state.view.k;
    applyView();
  }
  toast('Centered on the map — '+ENT[id].name);
  setTimeout(()=>{ highlightId=null; renderMap(); }, 2400);
}

/* ═════════════════════════════════════════════════════════════════════════
   CONTROL / SCOPE SWITCHING
   ═════════════════════════════════════════════════════════════════════════ */
function setControl(c){
  state.control=c;
  document.querySelectorAll('#ctrlToggle button').forEach(b=>b.classList.toggle('on',b.dataset.ctrl===c));
  document.getElementById('mapwrap').style.display=c==='map'?'':'none';
  document.getElementById('tblstage').style.display=c==='tables'?'flex':'none';
  // scope bar + legend only meaningful for the map; keep visible but soften for tables
  document.querySelector('.scopebar').style.opacity=c==='map'?'1':'.55';
  if(c==='map'){ renderMap(); fitView(); }
  else renderTables();
}
function setScope(scope,noFit){
  state.scope=scope;
  document.querySelectorAll('#scopePick .schip').forEach(b=>b.classList.toggle('on',b.dataset.scope===scope));
  document.querySelector('#scopeNote span').textContent=SCOPE_NOTE[scope];
  renderLegend();
  if(state.control==='map'){ renderMap(); if(!noFit) fitView(); }
}
function renderLegend(){
  // show only the types present in the active scope
  const layout=LAYOUTS[state.scope];
  const present=[...new Set(layout.map(n=>ENT[n.id].type))];
  const order=['user','event','guest','vendor','service','order','thread','billing'];
  const items=order.filter(t=>present.includes(t));
  document.getElementById('legend').innerHTML='<span class="scope-lab" style="margin-right:2px">Legend</span>'
    +items.map(t=>'<span class="li"><span class="sw" style="background:'+TYPE[t].c+'"></span>'+TYPE[t].lab+'</span>').join('')
    +'<span class="li" style="color:var(--muted)"><span class="sw" style="background:#C9C1B2"></span>edge = relationship</span>';
}

/* toggle + scope wiring */
document.querySelectorAll('#ctrlToggle button').forEach(b=>b.onclick=()=>setControl(b.dataset.ctrl));
document.querySelectorAll('#scopePick .schip').forEach(b=>b.onclick=()=>setScope(b.dataset.scope));

/* global search — jumps to the best-matching entity's card */
document.getElementById('search').addEventListener('keydown',(e)=>{
  if(e.key!=='Enter') return;
  const q=e.target.value.trim().toLowerCase(); if(!q) return;
  const hit=Object.values(ENT).find(r=>!r.typeNode && (r.name.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)));
  if(hit){ openCard(hit.id,true); toast('Found '+hit.name); }
  else toast('Nothing matches “'+e.target.value.trim()+'” in this slice.');
});

/* toast */
let toastT=null;
function toast(msg){
  const el=document.getElementById('toast');
  document.getElementById('toastMsg').innerHTML=esc(msg);
  el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2600);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeCard(); });
window.addEventListener('resize',()=>{ if(state.control==='map') fitView(); });

/* boot */
setScope('platform',true);
setControl('map');
</script>
</body>
</html>
