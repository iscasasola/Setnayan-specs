<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vendor Dashboard — all 5 menus (actual screens)</title>
<style>
  :root{
    --alabaster:#F6F4EF; --paper:#FFFFFF; --obsidian:#191919; --ink:#2B2A28; --ink2:#56524B;
    --gold:#C2A05B; --gold-soft:#EADFC4; --line:#E8E3D9; --line2:#F0ECE3; --muted:#928B7E;
    --inquiry:#2F6FB0; --inquiry-bg:#EAF1F8; --lock:#B5852A; --lock-bg:#F8F0DD;
    --pay:#3E8B59; --pay-bg:#E8F2EA; --review:#7A5AC9; --review-bg:#F0EAFB; --report:#C0564A; --report-bg:#FAE9E6;
    --wait:#C9822B; --wait-bg:#F7EBD9;
    --shadow:0 1px 2px rgba(25,25,25,.05),0 10px 30px rgba(25,25,25,.06); --shadow-sm:0 1px 2px rgba(25,25,25,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--alabaster);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:16px 16px 70px}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
  .caption{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .caption .t{font-size:13px;color:var(--muted)} .caption .t b{color:var(--ink)}
  .toggles{display:flex;gap:6px;flex-wrap:wrap}
  .vbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;box-shadow:var(--shadow-sm);color:var(--ink)}
  .vbtn.active{background:var(--obsidian);color:#fff;border-color:var(--obsidian)}
  .sep{width:1px;height:22px;background:var(--line);margin:0 3px;align-self:center}

  .ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
  .vchk{width:11px;height:11px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1px}

  .stage{display:grid;grid-template-columns:1fr 400px;gap:22px;align-items:start}
  body.d .phone{display:none} body.d .stage{grid-template-columns:1fr}
  body.m .desktop{display:none} body.m .stage{grid-template-columns:400px;justify-content:center}
  @media(max-width:1040px){.stage{grid-template-columns:1fr}.phone{justify-self:center}}

  .desktop{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .winbar{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid var(--line);background:#FBFAF7}
  .winbar i{width:11px;height:11px;border-radius:50%;background:#E2DDD3;display:block}
  .winbar .url{margin-left:8px;font-size:11.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 11px}
  .layout{display:grid;grid-template-columns:214px 1fr}
  .side{border-right:1px solid var(--line);background:#FBFAF7;padding:14px 11px;min-height:680px;position:relative}
  .side-toggle{position:absolute;top:13px;right:9px;z-index:2;border:1px solid var(--line);background:#fff;border-radius:7px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2)} .side-toggle .ico{width:14px;height:14px} .side-toggle:hover{border-color:var(--gold)}
  .layout.collapsed{grid-template-columns:64px 1fr}
  .layout.collapsed .brand .w,.layout.collapsed .brand .e,.layout.collapsed .nl,.layout.collapsed .acct .nm,.layout.collapsed .acct .sub,.layout.collapsed .plan .lbl,.layout.collapsed .plan .mng,.layout.collapsed .tk span:first-child{display:none}
  .layout.collapsed .side-toggle{transform:rotate(180deg);position:static;margin:0 auto 10px}
  .layout.collapsed .brand{display:none}
  .layout.collapsed .ni{justify-content:center;padding:9px 4px} .layout.collapsed .acct{justify-content:center;padding:7px 4px} .layout.collapsed .acct>div:last-child{display:none}
  .layout.collapsed .plan{justify-content:center;padding:8px 4px} .layout.collapsed .plan .badge{padding:4px} .layout.collapsed .tk{justify-content:center}
  .brand{display:flex;flex-direction:column;gap:1px;padding:2px 8px 12px;border-bottom:1px solid var(--line2);margin-bottom:10px}
  .brand .w{font-size:15px;font-weight:700;letter-spacing:.13em} .brand .w b{color:var(--gold)}
  .brand .e{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .acct{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;margin-bottom:10px;background:#fff;border:1px solid var(--line)}
  .acct .av{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2b2b2b,#5a5246);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .acct .nm{font-size:12.5px;font-weight:600;line-height:1.1} .acct .sub{font-size:10px;color:var(--muted)}
  .verified{color:var(--gold);font-size:10px} .unverified{color:var(--muted);font-size:10px}
  .nav .ni{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13px;color:var(--ink2);cursor:pointer;margin-bottom:1px}
  .nav .ni .ic{width:18px;display:flex;align-items:center;justify-content:center}
  .nav .ni:hover{background:#F1EDE5}
  .nav .ni.active{background:var(--obsidian);color:#fff}
  .nav .plan{display:flex;align-items:center;gap:7px;margin:12px 8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .nav .plan .badge{font-size:10px;font-weight:700;letter-spacing:.03em;color:#fff;background:var(--gold);border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
  .nav .plan .badge.free{background:var(--muted)}
  .nav .plan .badge svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav .plan .lbl{font-size:11.5px;color:var(--ink2);font-weight:600}
  .nav .plan .mng{margin-left:auto;font-size:10.5px;color:var(--muted);cursor:pointer}
  .nav .tk{margin:7px 8px 4px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:3px 4px;border-radius:7px}
  .nav .tk:hover{background:#F1EDE5} .nav .plan{cursor:pointer} .nav .plan:hover{border-color:var(--gold)}
  .nav .tk b{color:var(--gold)} .nav .tk .locked{color:var(--muted);font-weight:600;font-size:10px}

  .main{padding:18px 22px}
  .topline{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
  .topline .bell{position:relative;color:var(--ink2);cursor:pointer} .topline .bell .ico{width:19px;height:19px}
  .topline .bell .dot{position:absolute;top:-2px;right:-3px;width:7px;height:7px;background:var(--report);border-radius:50%}
  .hi{font-size:20px;font-weight:600} .sub{font-size:12.5px;color:var(--muted)}

  /* sections + rows */
  .rowlabel{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
  .rowlabel:first-of-type{margin-top:2px}
  .sec-h{display:flex;align-items:center;gap:9px;margin:16px 0 10px}
  .sec-h:first-child{margin-top:2px}
  .sec-h h3{font-size:13.5px} .count{font-size:11px;font-weight:700;background:var(--obsidian);color:#fff;border-radius:999px;padding:1px 8px}
  .count.soft{background:var(--line);color:var(--ink2)} .sec-h .more{margin-left:auto;font-size:12px;color:var(--muted);cursor:pointer}

  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-left-width:3px;border-radius:11px;padding:11px 13px;box-shadow:var(--shadow-sm)}
  .row .chip{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .row .chip .ico{width:18px;height:18px}
  .row .body{min-width:0;flex:1} .row .ttl{font-size:13.5px;font-weight:600;line-height:1.25}
  .row .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .row .when{font-size:11px;color:var(--muted);flex:0 0 auto;align-self:flex-start;padding-top:2px}
  .row .acts{display:flex;gap:7px;flex:0 0 auto}
  .b{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
  .b.primary{background:var(--obsidian);color:#fff} .b.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)} .b.gold{background:var(--gold);color:#fff}
  .tok{font-weight:700}
  .i-inquiry{border-left-color:var(--inquiry)} .c-inquiry{background:var(--inquiry-bg);color:var(--inquiry)}
  .i-lock{border-left-color:var(--lock)} .c-lock{background:var(--lock-bg);color:var(--lock)}
  .i-review{border-left-color:var(--review)} .c-review{background:var(--review-bg);color:var(--review)}
  .i-report{border-left-color:var(--report)} .c-report{background:var(--report-bg);color:var(--report)}
  .i-pay{border-left-color:var(--pay)} .c-pay{background:var(--pay-bg);color:var(--pay)}

  .orow{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#FCFBF8}
  .orow .ck{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);flex:0 0 auto}
  .orow .ttl{font-size:13px;font-weight:550;flex:1} .orow .due{font-size:11px;color:var(--lock);background:var(--lock-bg);border-radius:999px;padding:2px 9px;font-weight:600}
  .orow .due.soft{color:var(--muted);background:var(--line2)} .orow .open{font-size:12px;color:var(--ink2);cursor:pointer;font-weight:600}

  .upcoming{display:flex;flex-direction:column;gap:7px}
  .uev{display:flex;align-items:center;gap:13px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:9px 13px;box-shadow:var(--shadow-sm)}
  .date{flex:0 0 auto;width:46px;text-align:center;border-right:1px solid var(--line2);padding-right:11px}
  .date .mo{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--report);text-transform:uppercase} .date .dy{font-size:19px;font-weight:700;line-height:1} .date .wd{font-size:9.5px;color:var(--muted)}
  .uev .nm{font-size:13.5px;font-weight:600} .uev .det{font-size:11.5px;color:var(--muted)} .uev .cd{font-size:11px;font-weight:600;color:var(--ink2);background:var(--line2);border-radius:999px;padding:3px 10px;flex:0 0 auto;margin-left:auto} .uev .cd.near{color:var(--pay);background:var(--pay-bg)}

  /* My Shop storefront hero + stat strip */
  .shophero{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(135deg,#FBF7EF,#F3EBDC);border:1px solid var(--gold-soft);border-radius:16px;padding:16px 18px;margin-bottom:12px} .pmain .shophero{flex-direction:column;align-items:stretch;gap:14px}
  .sh-id{display:flex;align-items:center;gap:14px} .sh-av{width:54px;height:54px;border-radius:13px;background:linear-gradient(135deg,#2b2b2b,#5a5246);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:0 0 auto}
  .sh-nm{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap} .sh-vf{font-size:10.5px;font-weight:700;color:var(--gold);display:inline-flex;align-items:center;gap:3px} .sh-vf .vchk{width:12px;height:12px}
  .sh-meta{font-size:12px;color:var(--ink2);margin-top:2px} .sh-url{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:4px} .sh-url .ico{width:13px;height:13px}
  .sh-right{display:flex;align-items:center;gap:14px;flex:0 0 auto} .pmain .sh-right{justify-content:space-between}
  .gauge.sm{width:96px;height:96px} .gauge.sm svg{width:96px;height:96px} .gauge.sm .gval{font-size:22px} .gauge.sm .gband{font-size:9px;margin-top:1px}
  .statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px} .pmain .statstrip{grid-template-columns:repeat(2,1fr)}
  .sstat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff} .sstat>.ico{width:16px;height:16px;color:var(--gold)} .sbig{font-size:22px;font-weight:700;margin-top:6px} .sl{font-size:11.5px;font-weight:600} .ss{font-size:10.5px;color:var(--muted)}

  /* hub tiles (shop) */
  .grid{display:grid;gap:10px} .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  .tile{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.14s;display:flex;flex-direction:column;gap:9px;min-height:104px;font:inherit;color:inherit}
  .tile:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:var(--shadow)}
  .tile.locked{opacity:.6} .tile .trow{display:flex;align-items:center;justify-content:space-between}
  .sq{width:38px;height:38px;border-radius:10px;background:var(--alabaster);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)} .sq .ico{width:19px;height:19px}
  .tile.accent .sq{background:#FBF4E6;border-color:var(--gold-soft);color:var(--gold)}
  .lockbadge{font-size:9.5px;font-weight:700;color:#8a7f70;background:#efece7;padding:2px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:3px} .lockbadge .ico{width:11px;height:11px}
  .lab{font-size:13.5px;font-weight:600;margin-top:auto} .stat{font-size:12px;color:var(--muted)} .stat b{color:var(--ink);font-weight:700;font-size:14px} .stat .star{color:var(--gold)}

  /* filter chips */
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
  .fchip{font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink2)}
  .fchip.on{background:var(--obsidian);color:#fff;border-color:var(--obsidian)}
  .fchip .n{opacity:.6;font-weight:600;margin-left:3px}

  /* customer rows */
  .crow{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:10px 13px;box-shadow:var(--shadow-sm);cursor:pointer}
  .crow:hover{border-color:var(--gold)}
  .crow .av{width:34px;height:34px;border-radius:9px;background:var(--alabaster);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--ink2);flex:0 0 auto}
  .crow .info{flex:1;min-width:0} .crow .nm{font-size:13.5px;font-weight:600} .crow .det{font-size:11.5px;color:var(--muted)}
  .pill{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .pill.booked{color:var(--pay);background:var(--pay-bg)} .pill.conv{color:var(--inquiry);background:var(--inquiry-bg)} .pill.outside{color:var(--ink2);background:var(--line2)} .pill.done{color:var(--muted);background:var(--line2)}
  .crow .amt{font-size:11.5px;color:var(--ink2);font-weight:600;text-align:right;flex:0 0 auto}

  /* calendar */
  .cal{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:var(--shadow-sm);margin-bottom:12px}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px} .cal-top .mh{font-size:14px;font-weight:700}
  .cal-nav{display:flex;gap:5px} .cal-nav b{width:26px;height:26px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer} .cal-nav b .ico{width:14px;height:14px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px} .dow span{text-align:center;font-size:9.5px;font-weight:700;color:var(--muted)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{min-height:56px;border:1px solid var(--line2);border-radius:8px;padding:4px 5px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .cell:hover{border-color:var(--gold)} .cell.other{background:#FBFAF7;cursor:default} .cell.other .dn{color:var(--muted)}
  .cell .dn{font-size:11px;font-weight:600;align-self:flex-start}
  .cell.today .dn{background:var(--obsidian);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px}
  .cell .ev{font-size:9px;font-weight:600;border-radius:4px;padding:1px 4px;background:var(--inquiry-bg);color:var(--inquiry);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .ev.blk{background:var(--line2);color:var(--muted)}
  .cal-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;margin-bottom:12px;border:1px solid var(--line);border-radius:8px;padding:6px 11px;background:#fff;font-family:inherit} .cal-back .ico{width:14px;height:14px}
  .dentry{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-left-width:3px;border-left-color:var(--inquiry);border-radius:11px;padding:11px 13px;background:#fff;cursor:pointer;margin-bottom:8px;box-shadow:var(--shadow-sm)}
  .dentry:hover{border-color:var(--gold)} .dentry.blk{border-left-color:var(--muted);cursor:default}
  .dentry .time{font-size:12px;font-weight:700;color:var(--ink2);width:64px;flex:0 0 auto} .dentry .ttl{font-size:13.5px;font-weight:600} .dentry .meta{font-size:11.5px;color:var(--muted)} .dentry .go{margin-left:auto;color:var(--muted)} .dentry .go .ico{width:16px;height:16px}
  .profile{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow-sm)}
  .profile .ph{display:flex;align-items:center;gap:12px;margin-bottom:8px} .profile .av.lg{width:46px;height:46px;border-radius:11px;background:var(--alabaster);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink2)} .profile .nm{font-size:16px;font-weight:700} .profile .det{font-size:12px;color:var(--muted)} .profile .ph .pill{margin-left:auto}
  .prow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line2);font-size:12.5px} .prow .k{color:var(--muted)} .prow .v{font-weight:600;text-align:right}
  .pacts{display:flex;gap:8px;margin-top:14px} .pacts .b{display:inline-flex;align-items:center;gap:6px} .pacts .b .ico{width:14px;height:14px}
  .pmain .cell{min-height:44px} .pmain .cell .ev{font-size:0;padding:0;width:6px;height:6px;border-radius:50%;margin-top:1px}
  /* schedule type colors */
  .ev.locked{background:var(--lock-bg);color:var(--lock)} .ev.booked{background:var(--pay-bg);color:var(--pay)} .ev.waitlist{background:var(--wait-bg);color:var(--wait)} .ev.whitelist{background:var(--review-bg);color:var(--review)} .ev.blocked{background:var(--line2);color:var(--muted)} .ev.other{background:var(--inquiry-bg);color:var(--inquiry)}
  .fulltag{font-size:8px;font-weight:700;color:#fff;background:var(--report);border-radius:3px;padding:0 4px;align-self:flex-start}
  .dentry.locked{border-left-color:var(--lock)} .dentry.booked{border-left-color:var(--pay)} .dentry.waitlist{border-left-color:var(--wait)} .dentry.whitelist{border-left-color:var(--review)} .dentry.blocked{border-left-color:var(--muted)} .dentry.other{border-left-color:var(--inquiry)}
  .pill.locked{color:var(--lock);background:var(--lock-bg)} .pill.wait{color:var(--wait);background:var(--wait-bg)} .pill.white{color:var(--review);background:var(--review-bg)}
  /* filter bar + legend */
  .fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
  .flabel{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .fchip.sm{font-size:11px;padding:4px 10px}

function evFor(m,d){return (EV[m+'.'+d]||[]).filter(e=>(fType==='all'||e.type===fType)&&(fSvc==='all'||e.svc===fSvc)&&agentOK(e.cust));}
function photoFull(m,d){return (EV[m+'.'+d]||[]).some(e=>e.svc==='photo'&&(e.type==='booked'||e.type==='locked'));}
function heatClass(m,d){if(!heat)return '';const wd=(MONTHS[m].first+(d-1))%7;return wd===6?'h3':wd===0?'h2':wd===5?'h1':'';}
function filterBar(){

  return `<div class="fbar">

}
function monthGrid(){
  const m=calMonth,M=MONTHS[m],dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells='';
  for(let i=M.first-1;i>=0;i--)cells+=`<div class="cell other"><span class="dn">${M.prev-i}</span></div>`;
  for(let d=1;d<=M.days;d++){
    const chips=evFor(m,d).map(e=>`<span class="ev ${e.type}">${e.type==='other'?e.t:TYPES[e.type].label+(e.cust?' · '+e.cust:'')}</span>`).join('');
    const full=(photoFull(m,d)&&(fSvc==='all'||fSvc==='photo'))?`<span class="fulltag">Full</span>`:'';
    cells+=`<div class="cell ${(m===1&&d===1)?'today':''} ${heatClass(m,d)}" data-day="${d}"><span class="dn">${d}</span>${full}${chips}</div>`;
  }
  const total=M.first+M.days,trail=(7-total%7)%7;
  for(let d=1;d<=trail;d++)cells+=`<div class="cell other"><span class="dn">${d}</span></div>`;
  return `<div class="cal"><div class="cal-top"><span class="cal-nav"><b data-mnav="prev">${svg('chevL')}</b></span><span class="mh">${M.name}</span><span class="cal-nav"><b data-mnav="next">${svg('chevR')}</b></span></div>
    <div class="dow">${dow.map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-grid">${cells}</div></div>`;
}
function dayCard(){
  const m=calMonth,d=calDay,evs=evFor(m,d).slice().sort((a,b)=>(a.time||'~').localeCompare(b.time||'~'));
  const cap=photoFull(m,d)?`<div class="cap">${svg('clock')}<span><b>Wedding Photography</b> — 1 of 1 booked (at capacity). <b>No double-booking</b> — new couples can only <b>join the waitlist</b> for this date (promoted if it cancels). Still bookable on other dates.</span></div>`:'';
  const body=evs.length?evs.map(e=>`<div class="dentry ${e.type} ${e.cust?'':'blk'}" ${e.cust?`data-cust="${e.cust}"`:''}><span class="time">${e.time||'All day'}</span><div><div class="ttl">${e.t}</div><div class="meta">${TYPES[e.type].label}${e.sub?' · '+e.sub:''}</div></div>${e.cust?`<span class="go">${svg('chevR')}</span>`:''}</div>`).join('')
    :`<div class="lockmsg">${svg('cal')} Nothing scheduled here.</div>`;
  return `<div class="cal"><div class="cal-top"><button class="cal-back" data-back="month">${svg('chevL')} Month</button><span class="mh">${dayName(m,d)}, ${MONTHS[m].name.split(' ')[0]} ${d}</span><span class="cal-nav"><b data-dnav="prev">${svg('chevL')}</b><b data-dnav="next">${svg('chevR')}</b></span></div>${cap}<div style="padding-top:4px">${body}</div></div>`;

function animateCount(el){
  const raw=el.dataset.count, target=+raw, dec=(raw.split('.')[1]||'').length, dur=950, pre=el.dataset.pre||'', suf=el.dataset.suf||'';
  let s=null;
  function step(ts){if(s===null)s=ts;const p=Math.min(1,(ts-s)/dur),v=target*(1-Math.pow(1-p,3));el.textContent=pre+(dec?v.toFixed(dec):Math.round(v).toLocaleString())+suf;if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}
function animateViz(){
  document.querySelectorAll('#dBody [data-count], #pBody [data-count]').forEach(animateCount);
  requestAnimationFrame(()=>{
    document.querySelectorAll('.gprog').forEach(c=>{const r=c.r.baseVal.value,circ=2*Math.PI*r;c.style.strokeDasharray=circ.toFixed(1);c.style.strokeDashoffset=(circ*(1-(+c.dataset.score)/100)).toFixed(1);});
    document.querySelectorAll('.pfill, .fnl-fill, .src-fill, .ab-fill, .dr-fill').forEach(b=>{b.style.width=b.dataset.w+'%';});
    document.querySelectorAll('.bars .bar').forEach(b=>{b.style.height=b.dataset.h+'%';});
    document.querySelectorAll('.afill').forEach(p=>p.classList.add('show'));
    document.querySelectorAll('.aline').forEach(p=>{try{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;requestAnimationFrame(()=>{p.style.transition='stroke-dashoffset 1.15s ease';p.style.strokeDashoffset='0';});}catch(e){}});
  });
}

   <div class="sub" style="margin-top:12px;font-size:11px">A subscription year = <b>13 cycles</b>; you’re billed for <b>10</b> (first 3 cycles free — no paid money used during them). Annual = pay the 10 up front; monthly = per 28-day cycle. Mirrors <b>VENDOR_TIERS_AND_BENEFITS §2</b> · boost radius Local → 20 → 50 → nationwide. *Solo+ “unlimited answering” pending owner confirmation.</div>`;
}
/* ===== Buy tokens page (opened from the sidebar token balance) ===== */
function tokensPage(){
  const packs=[['4','₱400',''],['10','₱1,000',''],['25','₱2,500','+2 bonus'],['50','₱5,000','+5 bonus'],['100','₱10,000','+12 bonus']];
  const banner=!verified()?`<div class="cap">${svg('lock')}<span><b>Verify your shop first.</b> Buying tokens requires verification.</span></div>`:'';
  const holder=isAdmin()
    ? `<div class="rowlabel">Credit tokens to</div><div class="fbar"><select class="fsel"><option>Yourself (◎ ${tokenBal()})</option><option>Ana R. (◎ 8)</option><option>Ben S. (◎ 0)</option></select><span style="font-size:11px;color:var(--muted)">Admins can buy for a teammate · non-transferable once credited</span></div>`
    : `<div class="note" style="margin-top:0">${svg('coins')} Tokens you buy are <b>yours</b> — non-transferable.</div>`;
  const teamBal=isAdmin()
    ? `<div class="rowlabel">Team token balances</div><div class="rows">${[['You (founder)','◎ 24'],['Ana R. · Agent','◎ 8'],['Ben S. · Agent','◎ 0']].map(m=>`<div class="crow"><div class="av">${m[0][0]}</div><div class="info"><div class="nm">${m[0]}</div></div><div class="amt">${m[1]}</div></div>`).join('')}</div>`
    : '';
  return `<button class="cal-back" data-close="1">${svg('chevL')} Back</button>
   <div class="bal"><div><div class="ml">Your tokens</div><div class="balbig">◎ ${tokenBal()}</div></div>${svg('coins')}</div>
   <div class="note">${svg('coins')} Tokens answer couple inquiries. Cost per lead depends on the <b>customer’s event location</b> (₱100–₱300 bands). No free tokens — you buy only what you spend.</div>
   ${banner}${holder}
   <div class="rowlabel">Buy a pack · ₱100 / token</div>
   <div class="packs">${packs.map(p=>`<button class="pack" ${!verified()?'disabled':''}><div class="ptok">◎ ${p[0]}</div><div class="pprice">${p[1]}</div>${p[2]?`<div class="pbonus">${p[2]}</div>`:'<div class="pbonus" style="visibility:hidden">·</div>'}</button>`).join('')}</div>
   ${teamBal}
   <div class="note" style="margin-top:10px">${svg('wallet')} Apply, then pay via GCash / BDO QR and upload your receipt — Setnayan credits within 24h.</div>`;
}
/* ===== ON THE DAY — event-day console; tools ADAPT to the service ===== */
const ODAY_CATS=[['photo','Photo/Video'],['coord','Coordinator'],['cater','Caterer'],['band','Band/DJ']];
function ondayBody(){
  const catName=(ODAY_CATS.find(c=>c[0]===odayCat)||ODAY_CATS[0])[1];
  const header=`
  <div class="cap">${svg('lock')}<span><b>Shows automatically on an event day</b> (T-1h → T+8h). Visible here for design — normally hidden until you have an event today.</span></div>
  <div class="oday-ev"><div class="av lg">RT</div><div class="oe-b"><div class="oe-n">Reyes – Tan</div><div class="oe-m">Sat, Jul 5 · Tagaytay · <b>${catName}</b></div></div><button class="b ghost" ${!canAct()?'disabled':''}>Change event</button></div>
  <div class="ph-h" style="margin-bottom:10px"><span class="ph-sub">Day-of tools adapt to your service →</span> <span class="seg">${ODAY_CATS.map(c=>`<span class="sgi ${odayCat===c[0]?'on':''}" data-odaycat="${c[0]}">${c[1]}</span>`).join('')}</span></div>`;
  const review=`
  <div class="rowlabel">Instant reviews from guests</div>
  <div class="qrcard"><div class="qrbox">${svg('qr')}</div><div class="qr-b"><div class="qr-t">Guest review QR</div><div class="qr-s">Display it or print it at the event — guests scan to review you on the spot. No app, no login.</div><div class="qr-a"><button class="b primary">${svg('news')} Print</button><button class="b ghost">Show fullscreen</button></div></div></div>`;
  const body=odayCat==='coord'?ondayCoord():odayCat==='cater'?ondayCater():odayCat==='band'?ondayBand():ondayPhoto();
  return header+body+review;
}
function ondayPhoto(){
  const cl=[['Arrival & setup',true],['Ceremony coverage',true],['Couple portraits',true],['Reception coverage',false],['Send same-day preview',false]];
  const pct=Math.round(cl.filter(c=>c[1]).length/cl.length*100);
  return `<div class="cards2">
    <div class="icard"><div class="h">${svg('check')} Delivery to the couple</div><div class="big">${pct}% <span class="frac">done</span></div><div class="s">They see these updates live</div><div class="paybar"><div class="payfill" style="width:${pct}%"></div></div></div>
    <div class="icard"><div class="h">${svg('users')} Guests</div><div class="big">138 <span class="frac">/ 150 pax</span></div><div class="s">headcount · light for photo</div></div></div>
  <div class="rowlabel">Shot list <span class="rl-note">· syncs to the couple</span></div>
  <div class="rows">${cl.map(c=>`<div class="orow"><span class="ck ${c[1]?'on':''}">${c[1]?svg('check'):''}</span><span class="ttl">${c[0]}</span>${c[1]?'<span class="due soft">Done</span>':'<span class="open">Mark done ›</span>'}</div>`).join('')}</div>
  <div class="rowlabel">Capture for your website + their recap</div>
  <div class="grid g3">
    <button class="tile accent"><div class="trow"><span class="sq">${svg('film')}</span></div><div class="lab">Recap capture</div><div class="stat"><b>8</b> clips · 5s each</div></button>
    <button class="tile"><div class="trow"><span class="sq">${svg('news')}</span></div><div class="lab">Photos</div><div class="stat"><b>24</b> for portfolio</div></button>
    <button class="tile"><div class="trow"><span class="sq">${svg('star')}</span></div><div class="lab">Review the couple</div><div class="stat">Leave your review</div></button>
  </div>`;
}
function ondayCoord(){
  const tl=[['2:00','Guests arrive','done'],['3:00','Ceremony','now'],['3:30','Cocktails','next'],['5:00','Reception & dinner','next'],['6:30','Program & speeches','next'],['8:30','Send-off','next']];
  const vend=[['Photographer','Sinag Studio','in','Arrived 1:40 PM'],['Caterer','Kusina Catering','in','Arrived 12:00 PM'],['HMUA','Glow Studio','in','Arrived 10:00 AM'],['Band','The Rhythms','wait','En route · ETA 4:30'],['Host','MC Rey','wait','Call time 5:30']];
  return `<div class="cards2">
    <div class="icard"><div class="h">${svg('cal')} Run of show</div><div class="big">Ceremony <span class="frac">now</span></div><div class="s">Next: Cocktails · 3:30 PM</div></div>
    <div class="icard click"><div class="h">${svg('users')} Vendors on site</div><div class="big">3 <span class="frac">/ 5 arrived</span></div><div class="s">Band en route · Host at 5:30</div><span class="link">Broadcast call-time ›</span></div></div>
  <div class="rowlabel">Run of show · timeline</div>
  <div class="rows">${tl.map(t=>`<div class="dentry ${t[2]==='now'?'booked':t[2]==='done'?'done':'other'}"><span class="time">${t[0]}</span><div><div class="ttl">${t[1]}</div><div class="meta">${t[2]==='now'?'Happening now':t[2]==='done'?'Done':'Upcoming'}</div></div>${t[2]==='now'?'<span class="tl-now">NOW</span>':t[2]==='done'?svg('check'):'<span class="open">Cue ›</span>'}</div>`).join('')}</div>
  <div class="rowlabel">Vendors — call-times & check-in</div>
  <div class="rows">${vend.map(v=>`<div class="crow"><div class="av">${v[0][0]}</div><div class="info"><div class="nm">${v[0]} · ${v[1]}</div><div class="det">${v[3]}</div></div><span class="pill ${v[2]==='in'?'booked':'wait'}">${v[2]==='in'?'On site':'Awaited'}</span></div>`).join('')}</div>
  <div class="rowlabel">Issues & contingencies</div>
  <div class="rows">
    <div class="orow"><span class="ck on">${svg('check')}</span><span class="ttl">Light rain — moved cocktails indoors</span><span class="due soft">Resolved</span></div>
    <div class="orow"><span class="ck on">${svg('check')}</span><span class="ttl">Cake delayed 30 min — adjusted program</span><span class="due soft">Resolved</span></div>
    <div class="orow"><span class="ck"></span><span class="ttl" style="color:var(--muted)">Log an issue…</span><span class="open">Add ›</span></div>
  </div>
  <div class="rowlabel">Team</div>
  <div class="icard click"><div class="h">${svg('msg')} Broadcast to all vendors &amp; crew</div><div class="s" style="margin-top:4px">Send a call-time reminder or a live cue to everyone at once.</div><span class="link">Send broadcast ›</span></div>`;
}
function ondayCater(){
  return `<div class="cards2">
    <div class="icard"><div class="h">${svg('users')} Headcount served</div><div class="big">142 <span class="frac">/ 150 booked</span></div><div class="s">reconciles pax billing · 8 no-shows</div><span class="link">Adjust pax ›</span></div>
    <div class="icard"><div class="h">${svg('hardhat')} Crew on site</div><div class="big">6 <span class="frac">/ 6</span></div><div class="s">all checked in</div></div></div>
  <div class="rowlabel">Meal service timeline</div>
  <div class="rows">
    <div class="orow"><span class="ck on">${svg('check')}</span><span class="ttl">Cocktail canapés · 3:30</span><span class="due soft">Served</span></div>
    <div class="orow"><span class="ck on">${svg('check')}</span><span class="ttl">Plated dinner · 5:30</span><span class="due soft">Served</span></div>

}
function ondayBand(){
  return `<div class="cards2">
    <div class="icard click"><div class="h">${svg('music')} Setlist</div><div class="big">18 <span class="frac">songs</span></div><div class="s">your repertoire + couple's picks</div><span class="link">Open setlist ›</span></div>
    <div class="icard"><div class="h">${svg('check')} Sound check</div><div class="big">Done</div><div class="s">3:00 PM · levels set</div></div></div>
  <div class="rowlabel">Program cues</div>
  <div class="rows">
    <div class="orow"><span class="ck on">${svg('check')}</span><span class="ttl">Processional song · 3:00</span><span class="due soft">Done</span></div>
    <div class="orow"><span class="ck"></span><span class="ttl">First dance · 6:00</span><span class="open">Cue ›</span></div>
    <div class="orow"><span class="ck"></span><span class="ttl">Couple's requested song · 8:00</span><span class="open">Cue ›</span></div>
  </div>`;
}
const BODY={overview:overviewBody,shop:shopBody,customers:customersBody,performance:performanceBody,services:servicesBody,onday:ondayBody};
function roleBanner(){
  if(role==='viewer')return `<div class="rolebar view">${svg('lock')} <b>Viewer</b> — read-only. You can’t answer leads, transact, or change anything.</div>`;
  if(role==='agent')return `<div class="rolebar">${svg('user')} <b>Agent view</b> — only your assigned customers &amp; schedule. My Shop &amp; My Services are admin-only.</div>`;
  return '';
}
function screenBody(){return roleBanner()+(screen==='subscription'?subscriptionPage():screen==='tokens'?tokensPage():(BODY[screen]||overviewBody)());}

/* ===== chrome ===== */
function render(){
  const sc=SCREENS.find(s=>s.key===screen)||{title:screen==='subscription'?'Subscription':'Buy tokens',sub:''}, tm=tierMeta();
  document.getElementById('dUrl').textContent='setnayan.com/vendor-dashboard'+(screen==='overview'?'':'/'+screen);
  document.getElementById('dAcctSub').innerHTML= verified()
    ? `<span class="verified"><svg class="vchk" viewBox="0 0 24 24"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg> Verified</span>`
    : `<span class="unverified">Unverified</span>`;
  // nav
  document.getElementById('dNav').innerHTML=
    visibleScreens().map(s=>`<div class="ni ${s.key===screen?'active':''}" data-s="${s.key}" title="${s.label}"><span class="ic">${svg(s.ic)}</span><span class="nl">${s.label}</span>${s.dayof?'<span class="ni-dot" title="Event-day only"></span>':''}</div>`).join('')
    +`<div class="plan" data-open="subscription"><span class="badge ${tm.free?'free':''}"><svg viewBox="0 0 24 24">${tm.free?IC.user:IC.crown}</svg>${tm.plan}</span><span class="lbl">Subscription</span><span class="mng">${isAdmin()?(verified()?'Manage ›':'Verify first'):'Admin only'}</span></div>`
    +`<div class="tk" data-open="tokens"><span>Your tokens</span>${verified()?`<b>◎ ${tokenBal()}</b>`:`<span class="locked">Verify to buy</span>`}</div>`;
  document.getElementById('dTitle').textContent=sc.title;
  document.getElementById('dSub').textContent=sc.sub;
  document.getElementById('dBody').innerHTML=screenBody();
  // phone
  document.getElementById('pTitle').textContent=sc.title;
  document.getElementById('pPr').innerHTML=`<span class="plan-pill ${tm.free?'free':''}" data-open="subscription">${tm.plan}</span>`+(verified()?`<span class="tk" data-open="tokens">◎ ${tokenBal()}</span>`:`<span class="tk" data-open="tokens" style="background:var(--line2);color:var(--muted)">Verify</span>`);
  document.getElementById('pBody').innerHTML=screenBody();
  document.getElementById('pNav').innerHTML=visibleScreens().map(s=>`<div class="nv ${s.key===screen?'active':''}" data-s="${s.key}"><span class="ic">${svg(s.ic)}</span>${s.label.replace('My ','')}</div>`).join('');
  document.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>{screen=el.dataset.s;calView='month';calDay=null;calCust=null;calMonth=1;fType='all';fSvc='all';heat=false;legendOpen=false;render()});
  document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{calDay=+el.dataset.day;calView='day';render()});
  document.querySelectorAll('[data-back]').forEach(el=>el.onclick=()=>{calView=el.dataset.back;render()});
  document.querySelectorAll('[data-cust]').forEach(el=>{if(el.dataset.cust)el.onclick=()=>{calCust=el.dataset.cust;calView='profile';render()}});
  document.querySelectorAll('[data-typesel]').forEach(el=>el.onchange=()=>{fType=el.value;render()});
  document.querySelectorAll('[data-svcsel]').forEach(el=>el.onchange=()=>{fSvc=el.value;render()});
  document.querySelectorAll('[data-agentsel]').forEach(el=>el.onchange=()=>{fAgent=el.value;render()});
  document.querySelectorAll('[data-heat]').forEach(el=>el.onclick=()=>{heat=!heat;render()});
  document.querySelectorAll('[data-legend]').forEach(el=>el.onclick=()=>{legendOpen=!legendOpen;render()});
  document.querySelectorAll('[data-mnav]').forEach(el=>el.onclick=()=>{calMonth=Math.max(0,Math.min(2,calMonth+(el.dataset.mnav==='next'?1:-1)));render()});
  document.querySelectorAll('[data-dnav]').forEach(el=>el.onclick=()=>{const M=MONTHS[calMonth];calDay=Math.max(1,Math.min(M.days,calDay+(el.dataset.dnav==='next'?1:-1)));render()});
  document.querySelectorAll('[data-range]').forEach(el=>el.onclick=()=>{perfRange=el.dataset.range;render()});
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{if(SCREENS.some(s=>s.key===screen))returnScreen=screen;screen=el.dataset.open;render()});
  document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>{screen=returnScreen;render()});
  document.querySelectorAll('[data-cycle]').forEach(el=>el.onclick=()=>{subCycle=el.dataset.cycle;render()});
  document.querySelectorAll('[data-odaycat]').forEach(el=>el.onclick=()=>{odayCat=el.dataset.odaycat;render()});
  document.querySelectorAll('[data-msgs]').forEach(el=>el.onclick=()=>{screen='customers';calView='messages';msgOpen=false;render()});
  document.querySelectorAll('[data-thread]').forEach(el=>el.onclick=()=>{msgThread=+el.dataset.thread;msgOpen=true;render()});
  document.querySelectorAll('[data-msgback]').forEach(el=>el.onclick=()=>{msgOpen=false;render()});
  document.querySelectorAll('[data-info]').forEach(el=>el.onclick=()=>{msgInfo=!msgInfo;render()});
  document.querySelectorAll('[data-chataction]').forEach(el=>el.onclick=()=>{const t=document.getElementById('toast');t.innerHTML=svg('check')+' '+el.dataset.chataction;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2800);});
  document.querySelectorAll('[data-collapse]').forEach(el=>el.onclick=()=>{sideCollapsed=!sideCollapsed;render()});
  const lay=document.querySelector('.desktop .layout'); if(lay)lay.classList.toggle('collapsed',sideCollapsed);
  animateViz();
  document.getElementById('legend').innerHTML=`<b>${tm.label}</b> view · click the sidebar / bottom-nav to switch menus. No free tokens — balance is purchased only, and buying tokens or subscribing requires verification. Token cost per lead depends on the customer’s event location.`;
}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.body.className=b.dataset.v==='both'?'both':b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
document.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{tierState=b.dataset.tier;document.querySelectorAll('[data-tier]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(SCREENS.some(s=>s.key===screen)&&!visibleScreens().some(s=>s.key===screen))screen='overview';if(screen==='subscription'&&!isAdmin())screen='overview';render()});
render();
</script>
</body>
