function renderShell(){ const fr=(cap,note,src,w,h,desk)=>`<div class="frame${desk?' desk':''}"><p class="cap">${cap}</p><p class="note">${note}</p><iframe src="${src}" width="${w}" height="${h}" title="${cap}" loading="lazy"></iframe></div>`;
 document.getElementById('app').innerHTML=`<div class="wrap">
  <p class="eyebrow">Event Hub Maker · blueprint · 2026-09-29</p><h1>The Event Hub Maker — rearranged, the new rules, and how it is presented</h1>
  <p class="sub">One document for the whole Maker. <b>Part 1</b> moves what already ships (every row cites its source on <code>origin/main</code>). <b>Part 2</b> lists only what is genuinely new, in the owner’s words with its DECISION_LOG row. <b>Part 3</b> shows the Maker as couples will see it, phone first; the Details frames are the approved Details prototype, embedded, not redrawn.</p>
  <div class="toc"><a href="#p1">Part 1 · Rearranged</a><a href="#p2">Part 2 · New rules</a><a href="#p3">Part 3 · Presented</a></div>

  <h2 id="p1">Part 1 · Rearranged, not invented</h2><p class="sub"><span class="tag w">moved whole</span> = the shipped component and its labels, as they are · <span class="tag c">moved + small change</span> = the same thing, with the change named.</p>
  <table><thead><tr><th>From (ships today)</th><th>To</th><th>Shipped source</th><th></th><th>What changes</th></tr></thead><tbody>${LEDGER.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td><code>${r[2]}</code></td><td><span class="tag ${r[3]}">${r[3]==='w'?'moved whole':'moved + small change'}</span></td><td>${r[4]}</td></tr>`).join('')}</tbody></table>

  <h2 id="p2">Part 2 · New rules — only what is genuinely new</h2><p class="sub">Each with the owner’s words and the DECISION_LOG row it lives in (rows dated 2026-09-28 and 2026-09-29).</p>
  <ul class="rules">${RULES.map(r=>`<li><b>${r[0]}</b><q>${r[1]}</q><small>${r[2]}</small></li>`).join('')}</ul>

  <h2 id="p3">Part 3 · How it is presented</h2><p class="sub">Phone first (375 / 390), then desktop. Top bar as shipped: Exit · Play ▾ · + Add (stages only) · the place menu · Scenes · View · More · Apply.</p>
  <div class="frames">
   ${fr('a · The event menu — five rows','Home · Guest list · Your Team · Event Hub Maker · Our Services. Refer a couple lives in the account menu.',`${location.pathname}?view=menu`,375,812)}
   ${fr('b · Opening the Maker cold — Details, Round 1 · 1 of 7','The easy path: one thing per screen; All items one tap away.',`${D}?view=easy&step=1`,375,812)}
   ${fr('b · Pick a step — any time','Tap the progress label: all 19 steps by round, ✓ / ○; tap one to jump. Next goes to the next unfinished step; Skip keeps it in What’s left.',`${D}?view=easy&step=3&steps=open`,390,844)}
   ${fr('b · Round 1 done','Preview · Share your Save the Date · Apply. Round 2 ends in Send invitations; Round 3 in Print · Guests see this now.',`${D}?view=easy&step=8`,390,844)}
   ${fr('c · A stage being edited — Invitation, phone','Scenes strip below; a fact tapped on the canvas opens the same Details field in the sheet.',`${location.pathname}?view=stage&tab=content&sheet=open`,390,844)}
   ${fr('c · A stage being edited — Invitation, desktop','Left: the scene navigator. Right: Format · Animate · Arrange · Content, ◆ on Pro rows.',`${location.pathname}?view=stage&tab=format`,1280,820,true)}
   ${fr('d · Details — the full navigator, phone','Look · Your event · Words · Story & plans · Your Event Hub · Invitation set · For the day · Download.',`${D}?view=page&item=theme`,375,812)}
   ${fr('d · Details — the full navigator, desktop','Theme selected: the sample gallery in the body, the Theme editor right.',`${D}?view=page&item=logo`,1280,820,true)}
   ${fr('e · The Apply sheet','The draft’s changes; “Unlock Pro and Apply” · “Apply without the Pro effects”.',`${D}?view=apply&open=1`,390,844)}
   ${fr('f · The draft preview — Back to the Maker','Play ▾ → Preview the whole stage.',`${D}?view=preview`,390,844)}
   ${fr('g · A theme full-screen — Exit preview','From the gallery: the sample wedding in Rustic, full screen; Exit preview returns to the gallery; Use this theme drafts it.',`${location.pathname}?view=theme-preview`,390,844)}
  </div>
  <ul class="notes">
   <li><b>Could not place</b>: the event menu’s <i>review</i> row (post-event review) and <i>Galleries</i> vs <i>Gallery</i> naming (the registry has both; drawn as Gallery under Our Services); Arena / movie-ticket pass sizes (pending a measured ticket); shaped QR codes beyond square/circle (documented, not built); the Live Studio and SAI rows are named as the owner named them — their own pages were not read for this blueprint.</li>
   <li><b>Not drawn from real data</b>: the Details prototype’s placeholders (fake guests, entourage, candidate dates, venue addresses, ₱5,000).</li>
  </ul></div>`; }

/* ═════════ drawn views ═════════ */
function bar(here,addOn){ return `<header class="bar"><button type="button" class="tool"><i>✕</i>Exit</button><button type="button" class="tool"><i>▷</i>Play ▾</button>${addOn?'<button type="button" class="tool"><i>+</i>Add</button>':''}<span class="sep"></span><div class="place" id="place"><button type="button" class="page-pick" onclick="event.stopPropagation();document.getElementById('place').classList.toggle('open')">${here} <span style="font-size:11px">▾</span></button><div class="menu">${['Save the Date','Invitation','On the Day','Post Event','Details'].map(p=>`<button type="button" class="${p===here?'on':''}">${p}${p===here?'<span style="font-size:11px">✓</span>':''}</button>`).join('')}</div></div><button type="button" class="tool on"><i>▣</i>Scenes</button><button type="button" class="tool hide-sm"><i>▭</i>View</button><button type="button" class="tool"><i>⋯</i>More</button><button type="button" class="word">Live now</button><button type="button" class="word">↺ Restore</button><button type="button" class="apply">Apply<span class="dia">◆</span></button></header>`; }

function renderMenu(){ document.getElementById('app').innerHTML=`<div class="emenu"><p class="eyebrow">Your event</p><p class="hd">Indalecio &amp; Claire</p><p class="ev">December 18, 2026 · 180 guests</p>
 ${[['⌂','Home','Event Hub · Round 1 · 5 of 7 · <b style="color:var(--terracotta)">Continue ›</b>'],['☺','Guest list','Guests · hosts · check-in · replies'],['✦','Your Team','Suppliers · budget · bookings'],['▣','Event Hub Maker','Your Event Hub, the invitation, every print']].map(([i,l,s])=>`<div class="rowm"><i>${i}</i><span>${l}<small>${s}</small></span><span class="arr">›</span></div>`).join('')}
 <div class="rowm" style="border-bottom:0"><i>✧</i><span>Our Services<small>What we can add to your day</small></span><span class="arr">›</span></div><div class="services"><span>Papic</span><span>Live Studio</span><span>Gallery</span><span>Patiktok</span><span>Music Maker</span><span>SAI</span></div>
 <p class="small" style="margin-top:22px">Refer a couple · in your account menu.</p></div>`; }

function renderStage(){ const tab=P.get('tab')||'format'; const open=P.get('sheet')==='open';
 const scenes=['Hero','Countdown','The day','Dress code','Entourage','Story','Everything else'];
 const canvas=`<div class="pg"><div class="in" style="min-height:560px"><p class="l">Together with their families</p><p class="m">IC</p><h1 class="names">Indalecio<span class="amp">and</span>Claire</h1><p class="l">invite you to celebrate their wedding</p><p class="date">December 18, 2026</p><div class="rule"></div><span class="btn2">Find your seat</span></div>
   <div class="sc"><p class="l">Everything else</p><h2>See you soon.</h2><p class="tapped" data-tag="Special message · from Details" style="font-size:18px;line-height:1.5;max-width:300px;margin:14px auto 0">We can’t wait to celebrate with you on December 18.</p></div></div>`;
 const nav=`<nav class="nav"><ol><p class="gh" style="display:none">Scenes</p>${scenes.map((s,i)=>`<li><button type="button" class="nb${i===6?' on':''}"><span class="th">${i+1}</span><span class="nl">${s}</span></button></li>`).join('')}</ol></nav>`;
 const row=(l,r,p)=>`<div class="row"><span class="l">${l}${p?' '+pro():''}</span><span class="r">${r}</span></div>`;
 const dd=(opts,sel)=>`<select class="dd">${opts.map(o=>`<option${o===sel?' selected':''}>${o}</option>`).join('')}</select>`;
 const tabs={
  format:`<p class="sect">Everything else · Special message</p>${row('Font',dd(['EB Garamond','Cormorant Garamond','Lora','Jost'],'EB Garamond'),true)}${row('Size',dd(['Small','Medium','Large'],'Medium'))}${row('Colour','<i class="swatch" style="background:#2b241c"></i>'+dd(['Ink','Heading','Mood Board 1'],'Ink'))}${row('Weight',dd(['Regular','Medium','Bold'],'Regular'))}${row('Alignment',dd(['Centre','Left','Right'],'Centre'))}${row('Letter spacing',dd(['Normal','Wide'],'Normal'))}${row('Background colour','<i class="swatch" style="background:#f6f1e7"></i>'+dd(['Paper','Surface','None'],'Paper'))}${row('Photo behind',`<button type="button" class="btn">Upload media</button>`,true)}`,
  animate:`${row('Comes in',dd(['Fade','Rise','None'],'Rise'),true)}${row('Goes out',dd(['Fade','None'],'Fade'),true)}${row('How it moves',dd(['Still','Calm','Editorial','Cinematic'],'Calm'),true)}${row('Speed',dd(['Slow','Normal','Fast'],'Normal'))}${row('Into the next scene',dd(['Scroll','Scrub','Auto'],'Scroll'),true)}${row('Timing',dd(['With the scene','Follows the scroll'],'With the scene'))}`,
  arrange:`${row('Layout',dd(['Centred','Left, low','Split'],'Centred'))}${row('Order',`<button type="button" class="btn">↑</button><button type="button" class="btn">↓</button>`)}${row('Show this scene',`<span class="small">On</span>`)}${row('Parts',dd(['All','Names only','Message only'],'All'))}`,
  content:`<p class="small" style="margin:6px 0 2px">The same field as Details → Words — saved once, shown everywhere.</p><p class="sect">Special message</p><textarea class="fld" rows="4">We can’t wait to celebrate with you on December 18.</textarea><p class="small" style="margin-top:6px">Every scene that shows your message follows this.</p><div style="display:flex;gap:10px;align-items:center;padding-top:12px"><button type="button" class="btn primary">Save</button><span class="small">Drafted — Undo steps it back, Apply puts it live.</span></div>`};
 const ed=`<aside class="ed${open?' open':''}"><button type="button" class="handle"><span class="grab"></span><span>Edit · Special message</span><span>${open?'▾':'▴'}</span></button><div class="scroll"><p class="ed-h">Everything else</p><div class="tabs">${['format','animate','arrange','content'].map(t=>`<button type="button" class="${t===tab?'on':''}" onclick="location.search='?view=stage&tab=${t}${open?'&sheet=open':''}'">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><div class="ed-in">${tabs[tab]}</div></div></aside>`;
 document.getElementById('app').innerHTML=`<div class="maker">${bar('Invitation',true)}<div class="work">${nav}<main class="body" id="body"><div class="canvas">${canvas}</div></main>${ed}</div></div>`;
 document.addEventListener('click',(e)=>{ if(!e.target.closest('#place')) document.getElementById('place')?.classList.remove('open'); }); }

function renderThemePreview(){ document.getElementById('app').innerHTML=`<div class="tp"><button type="button" class="exit">← Exit preview</button><span class="small">Rustic ${pro()} · sample wedding</span><button type="button" class="use">Use this theme</button></div><div class="rustic"><div class="in"><p class="l">Together with their families</p><p class="m">M &amp; J</p><h1 class="names">Maria<span class="amp">and</span>Jose</h1><p class="l">invite you to celebrate their wedding</p><p class="date">December 12, 2026</p><div class="rule"></div><span class="btn2">Find your seat</span><p class="l" style="margin-top:40px">the day, the place, the story ↓</p></div></div>`; document.body.style.overflow='auto'; }

window.addEventListener('error',(e)=>document.documentElement.setAttribute('data-err',`${e.message} @${e.lineno}`));
try{ const v=P.get('view'); if(v==='menu') renderMenu(); else if(v==='stage') renderStage(); else if(v==='theme-preview') renderThemePreview(); else renderShell(); document.documentElement.setAttribute('data-rendered','1'); }catch(e){ document.documentElement.setAttribute('data-err',String(e.stack||e)); }
window.addEventListener('load',()=>{ const d=document.documentElement; d.setAttribute('data-clientw',d.clientWidth); d.setAttribute('data-scrollw',d.scrollWidth); });
</script>
