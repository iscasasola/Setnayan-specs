<title>Guests — Living Roster prototype</title>
<style>
  :root{
    --bg:#FDFBF7; --surface:#FDFBF7; --surface-2:#FDFBF7;
    --ink:#2C2A29; --ink-soft:#4F535B; --ink-faint:#B6B9BE;
    --line:rgba(30,34,41,.12); --line-soft:rgba(30,34,41,.06);
    --gold:#A9834B; --gold-deep:#8A6B39; --gold-wash:rgba(197,160,89,.12);
    --cta:#C24E25; --cta-ink:#FDFBF7;
    --sage-fill:#e3ece0; --sage-ink:#364632; --sage-dot:#4F6B4A;
    --warn-fill:#f4ecd8; --warn-ink:#8A6B39; --warn-dot:#8A6B39;
    --blush-fill:#f4d7c9; --blush-ink:#783b28; --blush-strong:#b65a3a; --blush-bg:#fdf4f0;
    --rose-fill:#f4d7c9; --rose-ink:#8a3d28;
    --sky-fill:#e0f0f7; --sky-ink:#2a5f7a;
    --amber-fill:#f4ecd8; --amber-ink:#A9834B;
    --shadow:0 12px 32px -14px rgba(30,34,41,.4);
    --font-display:Georgia,'Times New Roman',serif;
    --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --font-mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#1E2229; --surface:#1E2229; --surface-2:#1E2229;
      --ink:#FBFAF7; --ink-soft:#B6B9BE; --ink-faint:#B6B9BE;
      --line:rgba(251,251,250,.14); --line-soft:rgba(251,251,250,.07);
      --gold:#CBA766; --gold-deep:#CBA766; --gold-wash:rgba(224,204,160,.16);
      --cta:#E5794E; --cta-ink:#2C2A29;
      --sage-fill:rgba(125,152,115,.24); --sage-ink:#c5d2bd; --sage-dot:#69B98E;
      --warn-fill:rgba(197,160,89,.22); --warn-ink:#CBA766; --warn-dot:#8A6B39;
      --blush-fill:rgba(182,90,58,.26); --blush-ink:#eab8a2; --blush-strong:#cd7252; --blush-bg:rgba(182,90,58,.12);
      --rose-fill:rgba(182,90,58,.22); --rose-ink:#eab8a2;
      --sky-fill:rgba(56,120,150,.28); --sky-ink:#a9d2e6;
      --amber-fill:rgba(197,160,89,.22); --amber-ink:#CBA766;
      --shadow:0 12px 34px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
      --bg:#1E2229; --surface:#1E2229; --surface-2:#1E2229;
      --ink:#FBFAF7; --ink-soft:#B6B9BE; --ink-faint:#B6B9BE;
      --line:rgba(251,251,250,.14); --line-soft:rgba(251,251,250,.07);
      --gold:#CBA766; --gold-deep:#CBA766; --gold-wash:rgba(224,204,160,.16);
      --cta:#E5794E; --cta-ink:#2C2A29;
      --sage-fill:rgba(125,152,115,.24); --sage-ink:#c5d2bd; --sage-dot:#69B98E;
      --warn-fill:rgba(197,160,89,.22); --warn-ink:#CBA766; --warn-dot:#8A6B39;
      --blush-fill:rgba(182,90,58,.26); --blush-ink:#eab8a2; --blush-strong:#cd7252; --blush-bg:rgba(182,90,58,.12);
      --rose-fill:rgba(182,90,58,.22); --rose-ink:#eab8a2;
      --sky-fill:rgba(56,120,150,.28); --sky-ink:#a9d2e6;
      --amber-fill:rgba(197,160,89,.22); --amber-ink:#CBA766;
      --shadow:0 12px 34px -12px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
      --bg:#FDFBF7; --surface:#FDFBF7; --surface-2:#FDFBF7;
      --ink:#2C2A29; --ink-soft:#4F535B; --ink-faint:#B6B9BE;
      --line:rgba(30,34,41,.12); --line-soft:rgba(30,34,41,.06);
      --gold:#A9834B; --gold-deep:#8A6B39; --gold-wash:rgba(197,160,89,.12);
      --cta:#C24E25; --cta-ink:#FDFBF7;
      --sage-fill:#e3ece0; --sage-ink:#364632; --sage-dot:#4F6B4A;
      --warn-fill:#f4ecd8; --warn-ink:#8A6B39; --warn-dot:#8A6B39;
      --blush-fill:#f4d7c9; --blush-ink:#783b28; --blush-strong:#b65a3a; --blush-bg:#fdf4f0;
      --rose-fill:#f4d7c9; --rose-ink:#8a3d28;
      --sky-fill:#e0f0f7; --sky-ink:#2a5f7a;
      --amber-fill:#f4ecd8; --amber-ink:#A9834B;
      --shadow:0 12px 32px -14px rgba(30,34,41,.4);
  }
  *{box-sizing:border-box}
  #stage{font-family:var(--font-sans);color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
  .mono{font-family:var(--font-mono)}
  .serif{font-family:var(--font-display)}
  button{font-family:inherit;cursor:pointer;color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

  /* ——— prototype chrome (not part of product) ——— */
  .protobar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
  .protobar .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep)}
  .seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--line-soft);border:.5px solid var(--line)}
  .seg button{border:0;background:transparent;color:var(--ink-soft);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .hint{font-size:12px;color:var(--ink-faint);margin-left:auto}

  /* ——— frame ——— */
  #frame{margin:0 auto;transition:max-width .3s ease}
  #stage[data-view="desktop"] #frame{max-width:1280px;padding:18px 22px 120px}
  #stage[data-view="mobile"] #frame{max-width:392px;padding:0 0 96px;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh;background:var(--bg)}
  .desktop-only{display:none}.mobile-only{display:none}
  #stage[data-view="desktop"] .desktop-only{display:revert}
  #stage[data-view="mobile"] .mobile-only{display:revert}

  /* ——— shared bits ——— */
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep)}
  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;line-height:1.6;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:999px;display:inline-block}
  .side-bride{background:var(--rose-fill);color:var(--rose-ink)}

  .side-both{background:var(--amber-fill);color:var(--amber-ink)}
  .rsvp-attending{background:var(--sage-fill);color:var(--sage-ink)}
  .rsvp-pending{background:var(--warn-fill);color:var(--warn-ink)}
  .rsvp-declined{background:var(--line-soft);color:var(--ink-soft)}

  :root[data-theme="dark"] .clickable:hover{filter:brightness(1.15)}

  /* masthead */
  .mast-title{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;font-size:13px;color:var(--ink-soft);font-weight:500}
  .btn:hover{border-color:var(--ink-soft)}
  .btn.needs{border-color:var(--blush-fill);background:var(--blush-bg);color:var(--blush-ink)}
  .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--blush-strong);color:#FDFBF7;font-size:11px;font-weight:700}
  .meter{height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden;display:flex}
  .meter > i{display:block;height:100%}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px}

  /* capture bar */
  .capture{display:flex;align-items:center;gap:10px;border:2px solid color-mix(in srgb,var(--gold) 55%,transparent);background:var(--surface);border-radius:13px;padding:8px 10px;box-shadow:0 2px 12px -6px var(--gold)}
  .capture input{flex:1;border:0;background:transparent;color:var(--ink);font-size:15px;font-family:inherit;outline:none;min-width:0}
  .capture input::placeholder{color:var(--ink-faint)}
  .modetog{display:inline-flex;background:var(--line-soft);border-radius:8px;padding:2px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .modetog button{border:0;background:transparent;padding:4px 10px;border-radius:6px;color:var(--ink-faint);font-family:inherit}
  .modetog button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

  /* facet bar */
  .facetbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:11px 14px}
  .lensgroup{display:flex;align-items:center;gap:6px}
  .lenslabel{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .lens{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink-soft);background:transparent}
  .lens[aria-pressed="true"]{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-deep);font-weight:600}
  .breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-faint)}
  .crumb{display:inline-flex;align-items:center;gap:5px;background:var(--gold-wash);color:var(--gold-deep);border-radius:999px;padding:3px 9px;border:0;font-size:12px}

  /* roster table (desktop) */
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  thead th{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;text-align:left;padding:9px 12px;background:var(--surface-2)}
  .tierrow td{padding:14px 14px 4px;background:var(--surface-2)}
  .tierlabel{font-family:var(--font-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint)}
  tbody tr.guest{border-top:1px solid var(--line-soft)}
  tbody tr.guest td{padding:10px 12px;vertical-align:middle}
  tbody tr.guest:hover{background:color-mix(in srgb,var(--gold) 4%,transparent)}
  tbody tr.sel{background:var(--gold-wash)}
  tbody tr.sj{background:var(--blush-bg)}
  .avatar{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 0 0 1px var(--line) inset;flex:none}
  .name{font-weight:600;display:flex;align-items:center;gap:6px;overflow:hidden}
  .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{font-size:12px;color:var(--ink-faint)}
  .rowact{display:flex;justify-content:flex-end;gap:8px;color:var(--ink-faint);opacity:0;transition:opacity .12s}
  tr.guest:hover .rowact{opacity:1}
  .iconbtn{border:0;background:transparent;color:var(--ink-faint);padding:3px;border-radius:6px}
  .iconbtn:hover{color:var(--ink);background:var(--line-soft)}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
  .releasebar{display:flex;align-items:center;gap:8px;background:var(--warn-fill);color:var(--warn-ink);border-radius:9px;padding:5px 9px;font-size:12px}
  .miniact{border:0;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600}
  .miniact.solid{background:var(--warn-ink);color:var(--bg)}
  .miniact.ghost{border:1px solid var(--warn-ink);color:var(--warn-ink);background:transparent}
  .sjact{display:flex;gap:6px}
  .sjact button{border:1px solid var(--line);background:transparent;border-radius:7px;padding:4px 10px;font-size:12px;color:var(--ink-soft);font-weight:600}
  .sjact button.keep{background:var(--blush-strong);color:#FDFBF7;border-color:transparent}

  /* animations */
  @keyframes settle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .enter{animation:settle .32s cubic-bezier(.2,.7,.2,1)}
  tr.adding td{opacity:.55}
  .countflash{animation:flash .5s ease}
  @keyframes flash{0%{color:var(--gold);transform:scale(1.12)}100%{}}

  /* mobile */
  .mtop{position:sticky;top:44px;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px}
  .mtools{padding:12px 14px 4px;display:flex;flex-direction:column;gap:9px}
  .msearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 11px;color:var(--ink-faint);font-size:14px}
  .mgrid{padding:8px 14px;display:flex;flex-direction:column;gap:16px}
  .tier-cards{display:grid;gap:9px}
  .gcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  .gcard.enter{animation:settle .3s ease}
  .gcard.sj{border:2px solid var(--blush-fill);background:var(--blush-bg)}
  .gphoto{position:relative;display:grid;place-items:center;font-family:var(--font-display);font-weight:600}
  .gphoto .corner{position:absolute;top:6px;right:6px}
  .gphoto .pin{position:absolute;top:6px;left:8px;color:var(--gold-deep)}
  .gmeta{padding:8px 9px;display:flex;flex-direction:column;gap:5px}
  .gname{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowline{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .mfab{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:40}
  .mfab button{width:56px;height:56px;border-radius:999px;border:0;background:var(--cta);color:var(--cta-ink);font-size:26px;box-shadow:var(--shadow);display:grid;place-items:center}
  .mbar{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:center;
    background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  #stage[data-view="desktop"] .mfab,#stage[data-view="mobile"] .mfab{position:sticky}
  .mbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--ink-faint);text-decoration:none}
  .mbar a.on{color:var(--gold-deep);font-weight:600}
  .mpill{flex:1;text-align:center;border-radius:999px;padding:6px 0;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--ink-soft);background:transparent}
  .mpill[aria-pressed="true"]{background:var(--sage-fill);color:var(--sage-ink);border-color:transparent}
  .segmode{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--line-soft);border:.5px solid var(--line)}
  .segmode button{flex:1;border:0;background:transparent;color:var(--ink-soft);border-radius:999px;padding:7px 0;font-size:13px;font-weight:500}
  .segmode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .mrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
  .densbtn{border:1px solid var(--line);background:transparent;color:var(--ink-faint);border-radius:7px;width:30px;height:26px;font-size:14px;line-height:1;display:inline-grid;place-items:center}
  .densbtn.on{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-deep)}

  /* popover + toast */
  .pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:180px;animation:pop .14s ease}
  .pop h6{margin:4px 8px 6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
  .pop button{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;border-radius:8px;padding:8px 9px;font-size:13px;color:var(--ink);text-align:left}
  .pop button:hover{background:var(--gold-wash)}
  .scrim{position:fixed;inset:0;z-index:70}
  .scrim.dim{background:rgba(15,17,20,.34)}
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:11px 15px;font-size:13px;animation:pop .18s ease}
  .toast button{border:0;background:transparent;color:var(--gold-deep);font-weight:700;font-size:13px}
  .bulkbar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    background:var(--surface);border:1px solid var(--gold);border-radius:13px;box-shadow:var(--shadow);padding:9px 12px;max-width:94vw;animation:settle .2s ease}
  .bulkbar .count{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:var(--gold);color:#C24E25;font-weight:700;font-size:13px}
  .bulkbar button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 11px;font-size:12px;color:var(--ink-soft);font-weight:600}
  .bulkbar button.danger{border-color:var(--line);color:var(--ink-soft)}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:392px;max-width:92vw;z-index:75;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow:auto;padding:18px;animation:slidein .28s cubic-bezier(.2,.7,.2,1)}
  @keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
  #stage[data-view="mobile"] .drawer{top:auto;bottom:0;left:0;right:0;width:100%;height:auto;max-height:90vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;animation:sheetup .3s ease}
  @keyframes sheetup{from{transform:translateY(34px);opacity:.5}to{transform:none;opacity:1}}
  .unlock{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13px}
  .unlock:first-of-type{border-top:0}
  .foot{max-width:1280px;margin:22px auto 0;padding:0 22px;color:var(--ink-faint);font-size:12px;text-align:center}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage" data-view="desktop">
  <div class="protobar">
    <span class="tag">Prototype · Living Roster</span>
    <div class="seg" role="group" aria-label="View">
      <button data-act="view" data-view="desktop" aria-pressed="true">Desktop</button>
      <button data-act="view" data-view="mobile" aria-pressed="false">Mobile</button>
    </div>
    <div class="seg" role="group" aria-label="Theme">
      <button data-act="theme" data-theme="light" aria-pressed="true">Light</button>
      <button data-act="theme" data-theme="dark" aria-pressed="false">Dark</button>
    </div>
    <span class="hint">Seat column: ⌁~Tn = auto-suggested (role+side) · 🪑Tn = placed. Add a guest to a group → suggestion transfers to that group’s table. Try it via a name’s drawer → Groups.</span>
  </div>
  <div id="frame"></div>
</div>

<script>
(function(){
  const S = {
    view:'desktop', theme:'light',
    addMode:true, q:'',
    filters:{side:null, rsvp:null, group:null},
    mobileMode:'roster', mobileDensity:'grid',
    sel:new Set(),
    undo:null,
    estimatedPax:14, freezeDays:12,
    // A group's team_side is its own tag, independent of each member's side —
    // a group clusters across sides, so 'both' is the default for new ones.
    groupMeta:{'College Friends':'both','Katropa':'groom'},
    // Each group maps to a table — a grouped guest's suggested seat transfers here.
    groupTable:{'Katropa':'T3','College Friends':'T5'},
    guests:[]
  };
  const TIERS = ['Bride & Groom','VIP Family','Wedding Party','Principal Sponsors','Guests'];
  let _id=100;
  function g(first,last,side,tier,rsvp,seatStatus,seatT,opt={}){
    return {id:++_id,first,last,side,tier,rsvp,seat:{status:seatStatus,t:seatT},
      pinned:!!opt.pinned, pluses:opt.pluses||[], groups:opt.groups||[], selfjoin:!!opt.selfjoin, needsYou:!!opt.selfjoin, account:!!opt.account, _new:false};
  }
  S.guests = [
    g('Isabela','Reyes','bride','Bride & Groom','attending','seated','T1',{pinned:true,account:true}),
    g('Marco','Santos','groom','Bride & Groom','attending','seated','T1',{pinned:true,account:true}),
    g('Elena','Reyes','bride','VIP Family','attending','seated','T2',{account:true}),
    g('Tomas','Santos','groom','VIP Family','pending','held','T2'),
    g('Corazon','Lim','bride','VIP Family','attending','seated','T2'),
    g('Grace','Lim','bride','Wedding Party','attending','unseated',null,{pluses:['Ana'],groups:['College Friends']}),
    g('Paolo','Cruz','groom','Wedding Party','attending','seated','T3',{groups:['Katropa']}),
    g('Bea','Tan','bride','Wedding Party','pending','unseated',null,{groups:['College Friends']}),
    g('Ramon','Aquino','both','Principal Sponsors','attending','seated','T4'),
    g('Gloria','Bautista','both','Principal Sponsors','pending','held','T4'),
    g('Rosa','Dela Cruz','both','Principal Sponsors','attending','unseated',null,{selfjoin:true}),
    g('Sofia','Mendoza','bride','Guests','attending','seated','T6'),
    g('Rafael','Ong','both','Guests','pending','unseated',null,{groups:['Katropa']}),
    g('Diego','Cruz','groom','Guests','attending','seated','T5',{pluses:['Mia','Leo'],account:true}),
    g('Camille','Ramos','groom','Guests','declined','unseated',null),
    g('Josef','Villanueva','bride','Guests','pending','unseated',null),
  ];

  const SIDE_LBL={bride:'Bride',groom:'Groom',both:'Both'};
  const RSVP_LBL={attending:'Confirmed',pending:'Pending',declined:'Declined'};
  const RSVP_NEXT={attending:'pending',pending:'declined',declined:'attending'};
  const initials=x=>(x.first[0]||'')+((x.last||' ')[0]||'');
  // A guest may bring UP TO 2 plus-ones. Label them by name, or "(TBA)" if unnamed.
  function plusLabel(x){
    if(!x.pluses.length) return '';
    const named=x.pluses.filter(Boolean);
    if(named.length===x.pluses.length) return named.join(', ');
    if(named.length===0) return `${x.pluses.length} guest${x.pluses.length>1?'s':''} (TBA)`;
    return `${named.join(', ')} +${x.pluses.length-named.length} TBA`;
  }

  function counts(){
    const c={total:0,side:{bride:0,groom:0,both:0},rsvp:{attending:0,pending:0,declined:0},needsYou:0,pax:0};
    for(const x of S.guests){c.total++;c.side[x.side]++;if(x.rsvp!=='declined')c.pax++;c.rsvp[x.rsvp]++;if(x.needsYou)c.needsYou++;}
    return c;
  }
  function visible(){
    const q=S.q.trim().toLowerCase();
    return S.guests.filter(x=>{
      if(S.filters.side && x.side!==S.filters.side && !(S.filters.side!=='both'&&x.side==='both')) {
        if(x.side!=='both') return false;
      }
      if(S.filters.side==='bride' && !(x.side==='bride'||x.side==='both')) return false;
      if(S.filters.side==='groom' && !(x.side==='groom'||x.side==='both')) return false;
      if(S.filters.side==='both' && x.side!=='both') return false;
      if(S.filters.rsvp && x.rsvp!==S.filters.rsvp) return false;
      if(S.filters.group && !x.groups.includes(S.filters.group)) return false;
      if(q){ const h=(x.first+' '+x.last+' '+x.tier+' '+SIDE_LBL[x.side]+' '+RSVP_LBL[x.rsvp]+' '+x.groups.join(' ')).toLowerCase(); if(!h.includes(q)) return false; }
      return true;
    });
  }
  function byTier(list){
    return TIERS.map(t=>({tier:t,items:list.filter(x=>x.tier===t)})).filter(s=>s.items.length);
  }

  // Pax model — mirrors the real app: livePax = max(estimated_pax, confirmed headcount).
  // estimate is a FLOOR the confirmed count grows into; whichever is higher is what
  // vendors quote on, until the count freezes at the edit deadline.
  function paxModel(c){
    const est=S.estimatedPax, conf=c.rsvp.attending, live=Math.max(est,conf);
    return {est,conf,live,over:conf-est,leads: conf>est?'confirmed':'estimate'};
  }
  function paxBlock(variant,c){
    const m=paxModel(c);
    const confW=Math.min(100,Math.round(m.conf/m.live*100));
    const pendW=Math.min(100-confW,Math.round(c.rsvp.pending/m.live*100));
    const cap = m.leads==='estimate'
      ? `${m.conf} confirmed so far · your starting estimate of ${m.est} still leads, so vendors quote on <b>${m.est}</b>.`
      : `${m.conf} confirmed · <b>${m.over} over</b> your ${m.est} estimate — booked vendors may propose an added-guest cost.`;
    if(variant==='mobile'){
      return `<div style="display:flex;flex-direction:column;gap:5px">
        <div style="display:flex;align-items:center;gap:7px">
          <span class="eyebrow" style="font-size:9px">Planning for</span>
          <b class="serif" style="font-size:17px;line-height:1">${m.live}</b>
          <span class="chip ${m.leads==='estimate'?'seat-held':'rsvp-attending'}" style="font-size:10px">${m.leads==='estimate'?'your estimate':m.over+' over'}</span>
          <span style="margin-left:auto;color:var(--gold-deep);font-size:10px" title="Counts freeze at your guest-list deadline">🔒 ${S.freezeDays}d to freeze</span>
        </div>
        <div class="meter"><i style="width:${confW}%;background:var(--sage-dot)"></i><i style="width:${pendW}%;background:var(--warn-dot)"></i></div>
        <div style="font-size:10px;color:var(--ink-faint)">${m.conf} ✓ confirmed · ${c.rsvp.pending} ⏳ pending</div>
      </div>`;
    }
    return `<div class="card" style="display:flex;align-items:center;gap:22px;padding:12px 18px">
      <div style="min-width:132px">
        <div class="eyebrow">Planning for</div>
        <div style="display:flex;align-items:baseline;gap:9px;margin-top:2px">
          <span class="serif" style="font-size:32px;font-weight:600;line-height:1">${m.live}</span>
          <span class="chip ${m.leads==='estimate'?'seat-held':'rsvp-attending'}">${m.leads==='estimate'?'your estimate':m.over+' over estimate'}</span>
        </div>
      </div>
      <div style="flex:1;min-width:200px">
        <div class="meter" style="height:8px"><i style="width:${confW}%;background:var(--sage-dot)"></i><i style="width:${pendW}%;background:var(--warn-dot)"></i></div>
        <div style="margin-top:6px;font-size:12.5px;color:var(--ink-soft)">${cap}</div>
      </div>
      <div class="chip seat-seated" style="align-self:flex-start;padding:5px 11px" title="Late RSVPs after this date no longer change vendor costs">🔒 Counts freeze in ${S.freezeDays} days</div>
    </div>`;
  }

  /* ————— GUEST DRAWER + PERSONAL QR ————— */
  // Decorative QR stand-in (deterministic per guest). Illustrative only — the
  // real app renders the guest's qr_token as a branded, palette-tinted PNG.
  function qrSvg(seed){
    const N=13,m=7,SZ=N*m;let r=((seed+7)*2654435761)>>>0;
    const rnd=()=>{r^=r<<13;r>>>=0;r^=r>>>17;r^=r<<5;r>>>=0;return r/4294967296;};
    const inEye=(x,y)=>{const e=(cx,cy)=>x>=cx&&x<cx+3&&y>=cy&&y<cy+3;return e(0,0)||e(N-3,0)||e(0,N-3);};
    let cells='';
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(inEye(x,y))continue; if(rnd()>0.5)cells+=`<rect x="${x*m}" y="${y*m}" width="${m}" height="${m}"/>`; }
    const eye=(cx,cy)=>`<rect x="${cx*m}" y="${cy*m}" width="${3*m}" height="${3*m}"/><rect x="${(cx+1)*m}" y="${(cy+1)*m}" width="${m}" height="${m}" fill="var(--surface)"/>`;
    return `<svg viewBox="-4 -4 ${SZ+8} ${SZ+8}" width="112" height="112" fill="var(--gold-deep)" style="flex:none;background:var(--surface);border-radius:10px;border:1px solid var(--line)">${cells}${eye(0,0)}${eye(N-3,0)}${eye(0,N-3)}</svg>`;
  }

  /* ————— ACTIONS ————— */
  function findG(id){return S.guests.find(x=>x.id==id);}
  function render(){
    document.querySelectorAll('#dfab,.bulkbar').forEach(e=>e.remove());
    closePop();
    S.view==='desktop'?renderDesktop():renderMobile();

  function setRsvp(id,val){
    const x=findG(id); if(!x)return;
    const prevRsvp=x.rsvp, prevSeat={...x.seat};
    x.rsvp=val;
    // Shipped behavior (owner-locked 2026-06-22 · DB trigger free_seat_on_decline):
    // a decline AUTO-FREES the seat on every path. We mirror that — auto-free —
    // but make it VISIBLE + UNDOABLE instead of silent, so a mis-tap is one tap back.
    if(val==='declined' && (prevSeat.status==='seated'||prevSeat.status==='held')){
      x.seat={status:'unseated',t:null};
      render();
      toast(`<b>${x.first} ${x.last}</b> declined · Seat ${prevSeat.t||''} freed`, ()=>{x.rsvp=prevRsvp;x.seat=prevSeat;render();});
      return;
    }
    render();
  }

  function addGuest(raw){
    const str=raw.trim(); if(!str)return;
    let side=S.filters.side||'both', plusN=0, groups=[], tier='Guests';
    const words=[];
    str.split(/\s+/).forEach(w=>{
      const lw=w.toLowerCase();
      if(lw==='bride'||lw==='groom'||lw==='both'){side=lw;return;}
      const pm=w.match(/^\+(\d+)$/);
      if(pm){plusN=Math.min(2,parseInt(pm[1],10)||1);return;}   // +1 / +2 (capped at 2)
      if(w.startsWith('#')){groups.push(w.slice(1));return;}
      if(lw==='vip'){tier='VIP Family';return;}
      if(lw==='sponsor'||lw==='ninong'||lw==='ninang'){tier='Principal Sponsors';return;}
      words.push(w);
    });
    const first=words[0]||'Guest', last=words.slice(1).join(' ')||'';
    const ng=g(first,last,side,tier,'pending','unseated',null,{pluses:Array(plusN).fill(null),groups});
    ng._new=true;
    S.guests.push(ng);
    render();
    setTimeout(()=>{ng._new=false;render();},650);
  }

  function del(id,silent){
    const idx=S.guests.findIndex(x=>x.id==id); if(idx<0)return;
    const removed=S.guests[idx]; S.guests.splice(idx,1); S.sel.delete(+id);
    if(!silent) toast(`Removed <b>${removed.first} ${removed.last}</b>`, ()=>{S.guests.splice(idx,0,removed);render();});
    render();
  }

  document.getElementById('stage').addEventListener('click',e=>{
    const t=e.target.closest('[data-act]'); if(!t)return;
    const a=t.dataset.act, id=t.dataset.id;
    if(a==='view'){S.view=t.dataset.view;syncSeg('view',t.dataset.view);document.getElementById('stage').dataset.view=S.view;S.sel.clear();render();return;}
    if(a==='theme'){S.theme=t.dataset.theme;syncSeg('theme',t.dataset.theme);document.documentElement.setAttribute('data-theme',S.theme);render();return;}
    if(a==='addmode'){S.addMode=t.dataset.on==='1';if(S.addMode)S.q='';render();setTimeout(()=>document.getElementById('capture')?.focus(),0);return;}
    if(a==='lens'){const d=t.dataset.dim,v=t.dataset.val;S.filters[d]=S.filters[d]===v?null:v;S.sel.clear();render();return;}
    if(a==='clearlens'){S.filters={side:null,rsvp:null,group:null};S.q='';render();return;}
    if(a==='mmode'){S.mobileMode=t.dataset.m;render();return;}
    if(a==='dens'){S.mobileDensity=t.dataset.d;render();return;}
    if(a==='rsvp-open'){const r=t.getBoundingClientRect();popover(r.left,r.bottom,'Set RSVP',[
      {act:'setrsvp',id,val:'attending',label:'Confirmed',chip:'rsvp-attending',icon:'✓'},
      {act:'setrsvp',id,val:'pending',label:'Pending',chip:'rsvp-pending',icon:'⏳'},
      {act:'setrsvp',id,val:'declined',label:'Declined',chip:'rsvp-declined',icon:'✕'}]);return;}
    if(a==='rsvp-cycle'){setRsvp(id,RSVP_NEXT[findG(id).rsvp]);return;}
    if(a==='setrsvp'){closePop();setRsvp(id,t.dataset.val);return;}
    if(a==='side-open'){const r=t.getBoundingClientRect();popover(r.left,r.bottom,'Set side',[
      {act:'setside',id,val:'bride',label:"Bride’s side",chip:'side-bride'},
      {act:'setside',id,val:'groom',label:"Groom’s side",chip:'side-groom'},
      {act:'setside',id,val:'both',label:'Both sides',chip:'side-both'}]);return;}
    if(a==='setside'){closePop();findG(id).side=t.dataset.val;render();return;}
    if(a==='release'){const x=findG(id);x.seat={status:'unseated',t:null};x._release=false;toast(`Seat opened up`);render();return;}
    if(a==='keephold'){const x=findG(id);x.seat.status='held';x._release=false;render();return;}
    if(a==='sj'){const x=findG(id);const op=t.dataset.op;if(op==='remove'){del(id);}else{x.needsYou=false;x.selfjoin=false;toast(op==='link'?`Linked <b>${x.first}</b> to their invite`:`<b>${x.first}</b> added to your list`);render();}return;}
    if(a==='del'){del(id);return;}
    if(a==='sel'){return;}
    if(a==='selall'){return;}
    if(a==='closepop'){closePop();return;}
    if(a==='opendrawer'){openDrawer(id);return;}
    if(a==='closedrawer'){document.querySelectorAll('.drawer,.scrim').forEach(e=>e.remove());return;}
    if(a==='qr'){toast(t.dataset.op==='regen'?`New QR generated · the old code stops working`:`QR downloaded as a branded PNG`);return;}
    if(a==='openinvite'){openInvite();return;}
    if(a==='copyinvite'){toast('Invite link copied');return;}
    if(a==='grpadd'){const x=findG(id);const r=t.getBoundingClientRect();const opts=allGroupNames().filter(g=>!x.groups.includes(g)).map(g=>({act:'grpset',id,val:g,label:g}));opts.push({act:'grpnewprompt',id,val:'',label:'New group…',icon:'＋'});popover(r.left,r.bottom,`Add ${x.first} to…`,opts);return;}
    if(a==='grpset'){closePop();const x=findG(id);const g=t.dataset.val;if(!x.groups.includes(g))x.groups.push(g);const moved=x.seat.status==='unseated'&&x.rsvp!=='declined';toast(`Added ${x.first} to ${g}${moved?` · suggested seat → ${S.groupTable[g]||'their table'}`:''}`);render();openDrawer(id);return;}
    if(a==='grpremove'){const x=findG(id);x.groups=x.groups.filter(g=>g!==t.dataset.g);render();openDrawer(id);return;}
    if(a==='setplus'){const x=findG(id);const n=+t.dataset.n;const cur=x.pluses;x.pluses=Array.from({length:n},(_,i)=>cur[i]||null);render();openDrawer(id);return;}
    if(a==='grpnewprompt'){closePop();const x=findG(id);groupCreatePopover(e.clientX,e.clientY,(name,side)=>{S.groupMeta[name]=side;S.groupTable[name]=assignGroupTable();if(!x.groups.includes(name))x.groups.push(name);toast(`Created “${name}” (${SIDE_WORD[side]}) → table ${S.groupTable[name]} · added ${x.first}`);render();openDrawer(id);});return;}
    if(a==='bulkgrp'){closePop();const g=t.dataset.val;let n=0;S.guests.forEach(x=>{if(S.sel.has(x.id)&&!x.groups.includes(g)){x.groups.push(g);n++;}});S.sel.clear();toast(`Added ${n} guest${n===1?'':'s'} to ${g}`);render();return;}
    if(a==='bulkgrpnew'){closePop();groupCreatePopover(e.clientX,e.clientY,(g,side)=>{S.groupMeta[g]=side;S.groupTable[g]=assignGroupTable();let n=0;S.guests.forEach(x=>{if(S.sel.has(x.id)){x.groups.push(g);n++;}});S.sel.clear();toast(`Created “${g}” (${SIDE_WORD[side]}) → table ${S.groupTable[g]} · seated ${n} together`);render();});return;}
    if(a==='undo'){if(S._undoFn){S._undoFn();S._undoFn=null;document.querySelectorAll('.toast').forEach(e=>e.remove());}return;}
    if(a==='fab'){S.addMode=true;if(S.view==='desktop'){render();document.getElementById('capture')?.focus();}else{const name=prompt('Add guest — try “Ana Cruz +1 groom vip #Barkada”');if(name)addGuest(name);}return;}
    if(a==='needs'){S.filters={side:null,rsvp:null};render();const first=document.querySelector('tr.sj,.gcard.sj');first&&first.scrollIntoView({behavior:'smooth',block:'center'});return;}
    if(a==='bulk'){bulk(t.dataset.op);return;}
    if(a==='noop'){e.preventDefault();return;}
  });

  document.getElementById('stage').addEventListener('change',e=>{
    const t=e.target.closest('[data-act]'); if(!t)return;
    if(t.dataset.act==='sel'){const id=+t.dataset.id;t.checked?S.sel.add(id):S.sel.delete(id);
      const tr=t.closest('tr');tr&&tr.classList.toggle('sel',t.checked);renderBulk();return;}
    if(t.dataset.act==='selall'){const list=visible().filter(x=>!x.needsYou);if(t.checked)list.forEach(x=>S.sel.add(x.id));else S.sel.clear();render();return;}
  });

  function bulk(op){
    if(op==='clear'){S.sel.clear();render();return;}
    if(op==='remove'){const n=S.sel.size;const removed=S.guests.filter(x=>S.sel.has(x.id));S.guests=S.guests.filter(x=>!S.sel.has(x.id));S.sel.clear();toast(`Removed ${n} guests`,()=>{S.guests.push(...removed);render();});render();return;}
    if(op==='confirm'){S.guests.forEach(x=>{if(S.sel.has(x.id))x.rsvp='attending';});const n=S.sel.size;S.sel.clear();toast(`Marked ${n} as Confirmed`);render();return;}
    if(op==='qrpack'){toast(`Building a print pack of ${S.sel.size} branded QR place-cards…`);S.sel.clear();render();return;}
    if(op==='group'){const anchor=document.querySelector('.bulkbar [data-op="group"]');const r=anchor.getBoundingClientRect();const opts=allGroupNames().map(g=>({act:'bulkgrp',id:'',val:g,label:g}));opts.push({act:'bulkgrpnew',id:'',val:'',label:'New group…',icon:'＋'});popover(r.left,r.top,`Add ${S.sel.size} to group`,opts);return;}
    if(op==='side'||op==='seat'){toast(op==='seat'?`Sent ${S.sel.size} to the Seat Plan →`:`Bulk ${op} applied to ${S.sel.size}`);S.sel.clear();render();return;}
  }

  function wireCapture(){
    const inp=document.getElementById('capture'); if(!inp)return;
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();if(S.addMode){addGuest(inp.value);inp.value='';setTimeout(()=>document.getElementById('capture')?.focus(),0);}else{S.q=inp.value;render();setTimeout(()=>{const i=document.getElementById('capture');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},0);}}
      if(e.key==='Escape'&&!S.addMode){S.q='';render();}
    });
    if(!S.addMode){inp.addEventListener('input',()=>{S.q=inp.value; const list=byTier(visible()); /* light live filter without full rerender */
      // simple: rerender on input for correctness
      render();setTimeout(()=>{const i=document.getElementById('capture');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},0);});}
  }
  function syncSeg(kind,val){
    document.querySelectorAll(`[data-act="${kind}"]`).forEach(b=>b.setAttribute('aria-pressed', (b.dataset.view||b.dataset.theme)===val ? 'true':'false'));
  }

  render();
})();
</script>

</body></html>
