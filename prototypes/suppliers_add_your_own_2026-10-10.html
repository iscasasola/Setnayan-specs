html,body{height:100%;margin:0;overflow:hidden;background:#cfd2d8}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--sans);font-weight:500;margin:0;letter-spacing:-.01em}
.mute{color:var(--mute)} .wine{color:var(--wine)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- the stage: owner bar · the phone · the owner's grey strip ---------- */
.stage{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--g-bg);overflow:hidden}
.ownerbar{flex:0 0 auto;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--g-bg);color:var(--g-ink);border-bottom:1px solid var(--g-line);font-size:12.5px}
.ownerbar .obtag{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;color:var(--g-mute);white-space:nowrap}
.osel{position:relative;flex:1;min-width:0;height:34px;display:flex;align-items:center;gap:6px;border:1px solid var(--g-line);border-radius:999px;padding:0 30px 0 12px;background:var(--g-card);font-weight:600;white-space:nowrap;overflow:hidden}
.osel .lead{color:var(--g-mute);font-weight:500;flex:0 0 auto}
.osel #caseLabel{overflow:hidden;text-overflow:ellipsis;min-width:0}
.osel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.osel:after,.sel:after,.gsel:after{content:"";position:absolute;right:12px;top:50%;width:14px;height:14px;transform:translateY(-50%);pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236a6f78' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") center/contain no-repeat}

.phone{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--paper)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-padding:calc(var(--stick-h,150px) + 60px) 0 calc(var(--bar) + 70px);-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--bar) + 84px);scroll-behavior:smooth}

/* ---------- the app (as the approved prototype draws it) ---------- */
.shell{position:sticky;top:0;z-index:5;background:var(--paper-2);border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;gap:14px;padding:0 16px}
.shell .burger{font-size:18px;line-height:1}
.shell .logo{font-weight:700;color:var(--gild);font-size:17px;letter-spacing:.12em}
.shell .right{margin-left:auto;display:flex;gap:8px}
.shell .ic{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.shell .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shell .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gild),var(--wine))}
main{padding:0 16px}
.stick{position:sticky;top:56px;z-index:4;background:var(--paper);padding:10px 16px 8px;margin:0 -16px;box-shadow:0 1px 0 var(--line)}
.facts{margin:0;font-size:15px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.facts button{border-bottom:1px dotted var(--mute);padding-bottom:1px}
.seg{display:flex;gap:2px;border-radius:8px;background:var(--seg-track);padding:2px;margin:10px 0 0}
.seg button{flex:1;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--seg-off);white-space:nowrap}
.seg button.on{background:var(--mulberry);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg b{font-weight:500;opacity:.8;margin-left:2px}
section{padding:18px 0 8px}
section h2{font-size:21px;line-height:1.15}
.i{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--line);border-radius:50%;font-size:11px;color:var(--mute);vertical-align:middle;margin-left:4px}
.sub{color:var(--mute);margin:2px 0 10px;font-size:14px}
.k2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:16px 0 2px}

/* categories — hairline rows */
.cat{border-top:1px solid var(--line);scroll-margin-top:var(--stick-h,150px)}
.cat.open>.cathead{position:sticky;top:var(--stick-h,150px);z-index:3;background:var(--paper);box-shadow:0 1px 0 var(--line)}
.cat .bar{display:grid;grid-template-columns:36px 1fr auto 14px;gap:12px;align-items:center;min-height:56px;padding:10px 0;width:100%}
.cat .ico{width:36px;height:36px;border-radius:50%;background:var(--gild-soft);display:grid;place-items:center;color:#6b5a2a}
.cat .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cat .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .state{font-size:13px;color:var(--mute);white-space:nowrap}
.cat .state.ok{color:var(--ok)} .cat .state.wine{color:var(--wine)}
.cat .state.late{color:var(--danger);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.cat .state.kind{color:var(--mute);white-space:normal;text-align:right;max-width:132px;line-height:1.25}
.chev{color:var(--mute);font-size:18px;line-height:1;transition:transform var(--t) var(--ease)}
.open .chev{transform:rotate(180deg)}
.exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t) var(--ease)}
.exp>div{overflow:clip;min-width:0}
.open>.exp{grid-template-rows:1fr}
@keyframes catpop{0%{transform:scale(1)}30%{transform:scale(1.28) rotate(-6deg)}60%{transform:scale(.92) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
.cat.open.justopened>.cathead .ico{animation:catpop 420ms var(--ease)}
.unfold{padding:0 0 6px}
.findhead{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:40px}
.findhead .k2{margin:0}
.findhead .acts{margin-left:auto;display:flex}
.spend{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:13.5px;margin:6px 0 2px;padding:9px 12px;border-radius:10px;background:var(--gild-soft);color:#5c4c1e}
.spend b{font-weight:600}
.hole{display:inline-block;border:1px dashed currentColor;border-radius:6px;padding:0 6px;font-style:italic;opacity:.8}

/* the service card (the shipped ServiceCardFace shape) */
.scard{display:grid;grid-template-columns:80px 1fr;gap:4px 12px;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--paper-2);margin:8px 0;align-items:start}
.scard.new{animation:slide 420ms var(--ease) both}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scard .cover{width:80px;height:112px;border-radius:8px;display:grid;place-items:center;color:rgba(255,255,255,.9);font-weight:600;letter-spacing:.06em;font-size:15px}
.scard .body{display:grid;gap:3px;min-width:0}
.sc-name{font-size:14px;font-weight:600}
.sc-leaf{font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-price{font-size:12.5px;font-weight:500;color:var(--price)}
.sc-inc{font-size:11.5px;font-weight:500;color:var(--ok)}
.sc-not{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn-ink);justify-self:start}
.sc-state{grid-column:1/-1;margin-top:2px;font-size:13px;color:var(--ok)}
.sc-state .mute{color:var(--mute)}
.acts{display:flex;gap:8px;align-items:center;min-width:0}
.scard .acts{grid-column:1/-1;margin-top:2px;flex-wrap:nowrap;overflow:hidden}
.frow{display:grid;grid-template-columns:44px 1fr;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.frow:first-of-type{border-top:0}
.frow .acts{grid-column:2}
.logo2{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;letter-spacing:.06em;color:var(--mute);background:var(--paper-2)}

/* buttons — one colour per meaning (the approved table) */
button.ic,.btn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--ink);flex:0 0 auto;white-space:nowrap;font-size:13px;font-weight:500;transition:transform 160ms var(--ease)}
button.ic:active,.btn:active{transform:scale(.97)}
button.ic svg,.btn svg{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-only{width:40px;padding:0!important}
.icon-only .lbl{display:none}
.t-brand{--tone:var(--mulberry)}.t-ok{--tone:var(--ok)}.t-info{--tone:var(--info)}.t-warn{--tone:var(--warn)}.t-danger{--tone:var(--danger)}.t-neutral{--tone:var(--mute)}
button.ic,.btn{color:var(--tone,var(--ink));border-color:color-mix(in srgb,var(--tone,var(--ink)) 45%,transparent);background:color-mix(in srgb,var(--tone,var(--ink)) 9%,transparent)}
button.ic.main,.btn.main{background:var(--tone);color:#fff;border-color:var(--tone)}
.btn.t-neutral,button.ic.t-neutral{color:var(--ink)}
.btn.t-neutral.main{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.wide{flex:1 1 auto}
.btn[aria-disabled=true]{opacity:.45}

/* the thumb bar (glass) + the shipped 5-item bar */
.lower{position:absolute;left:0;right:0;bottom:var(--bar);padding:10px 16px;display:flex;gap:6px;align-items:center;z-index:5}
.lower input{flex:1 1 60%;min-width:60%;height:40px;border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);border-radius:999px;padding:0 14px;background:color-mix(in srgb,var(--paper) 62%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);font-size:16px}
.lower .btn.t-neutral{background:color-mix(in srgb,var(--paper) 62%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-color:color-mix(in srgb,var(--ink) 14%,transparent)}
.bar5{position:absolute;left:0;right:0;bottom:0;height:var(--bar);background:var(--paper-2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:6}
.bar5 button{display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;color:var(--mute);text-align:center}
.bar5 .on{color:var(--ink)}
.bar5 i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:50%}
.bar5 .on i{background:var(--gild-soft)}
.bar5 svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

/* the sheet — for input only; rises from the bar, never over it */
.scrim{position:absolute;inset:0;bottom:var(--bar);background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity var(--t) var(--ease);z-index:7}
.sheet{position:absolute;left:0;right:0;bottom:var(--bar);max-height:calc(100% - var(--bar) - 28px);background:var(--paper-2);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18);transform:translateY(calc(100% + var(--bar) + 40px));visibility:hidden;transition:transform 320ms var(--ease),visibility 0s 320ms;z-index:8;display:flex;flex-direction:column}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0;flex:0 0 auto}
.sheet .x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);font-size:18px;background:var(--paper-2);z-index:1}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 18px 12px;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:0 0 auto;display:flex;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line);background:var(--paper-2)}
.sheet-foot:empty{display:none}
.sheet h3{font-size:20px;margin:0 44px 2px 0}
.phone.sheet-open .scrim{opacity:1;pointer-events:auto}
.phone.sheet-open .sheet{transform:none;visibility:visible;transition:transform 320ms var(--ease),visibility 0s}
.steps{display:flex;align-items:center;gap:6px;margin:10px 0 2px;font-size:12px;color:var(--mute);letter-spacing:.04em}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--mulberry)}
.steps span{flex:0 0 auto;margin-left:4px;white-space:nowrap}
.field{display:grid;gap:4px;margin-top:12px;font-size:14px}
.field input,.field textarea,.field .sel{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--paper);width:100%;font-size:16px}
.field textarea{resize:none;min-height:64px}
.field .sel{position:relative;padding-right:34px}
.field select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.hint{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.hint.err{color:var(--danger)}
.guard{font-size:13.5px;margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink)}
.guard .acts{margin-top:8px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.mute{background:var(--gild-soft);color:var(--mute)}
.qr{display:grid;place-items:center;padding:10px 0 4px}
.qr-svg{width:156px;height:156px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qr-svg svg{width:100%;height:100%;display:block}
.link{font-size:12px;text-align:center;margin:4px 0 8px;color:var(--mute);word-break:break-all}
.cta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--bar) + 66px);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:14px;font-size:14px;z-index:9;transform:translateY(20px);opacity:0;pointer-events:none;transition:transform var(--t) var(--ease),opacity var(--t)}
.toast.on{transform:none;opacity:1}

/* ---------- the owner's strip: the switches and what they do, always in view; the notes fold away ---------- */
.strip{flex:0 0 auto;max-height:46vh;max-height:min(46dvh,calc(100dvh - 344px));overflow-y:auto;overflow-x:hidden;background:var(--g-bg);color:var(--g-ink);border-top:2px solid var(--g-on);font-size:13px;line-height:1.36;-webkit-overflow-scrolling:touch}
.strip.notes{max-height:calc(100vh - 344px);max-height:calc(100dvh - 344px)} /* the phone always keeps 300px */
.strip:not(.notes) .snotes{display:none}
.shead{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;min-height:34px;padding:3px 10px 3px 12px;background:var(--g-bg)}
.shead small{flex:1;min-width:0;font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--g-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead button{flex:0 0 auto;height:28px;padding:0 12px;border:1px solid var(--g-line);border-radius:999px;background:var(--g-card);font-size:12px;font-weight:600;color:var(--g-ink);text-align:center}
.smain{padding:0 12px 10px}
.smain p{margin:2px 0 4px}
.snotes{padding:8px 12px 14px;border-top:1px solid var(--g-line)}
.snotes p{margin:6px 0}
.strip .q{font-weight:700}
.strip .src{color:var(--g-mute);font-size:11.5px}
.strip code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--g-card);border:1px solid var(--g-line);border-radius:4px;padding:0 3px;word-break:break-word}
.gsel{position:relative;display:flex;align-items:center;min-height:40px;border:1px solid var(--g-on);border-radius:10px;padding:6px 34px 6px 12px;background:#fff;font-weight:600;font-size:12.5px;line-height:1.25}
.gsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.trow{display:flex;align-items:center;gap:8px;min-height:42px;border-top:1px solid var(--g-line)}
.smain>.trow:first-child{border-top:0}
.trow .lab{flex:1;min-width:0;padding:6px 0;cursor:pointer}
.trow input{flex:0 0 auto;height:32px;border:1px solid var(--g-on);border-radius:8px;padding:0 8px;background:#fff;font-size:16px;min-width:0}
.trow .say{flex:0 0 auto;font-size:11.5px;font-weight:700;min-width:22px;text-align:right;color:var(--g-mute)}
.tog{flex:0 0 auto;width:48px;height:42px;position:relative}
.tog:before{content:"";position:absolute;left:0;right:0;top:7px;height:28px;border-radius:999px;background:#aeb3bc;transition:background 160ms}
.tog:after{content:"";position:absolute;left:3px;top:10px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform 160ms var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog[aria-checked=true]:before{background:var(--g-on)}
.tog[aria-checked=true]:after{transform:translateX(20px)}
.out,.ex{margin:6px 0 0;border:1px solid var(--g-line);border-radius:10px;background:var(--g-card);overflow:hidden}
.out .r,.ex .r{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 8px 4px 10px;border-top:1px solid var(--g-line)}
.out .r:first-child,.ex .r:first-child{border-top:0}
.out .r .w{flex:1;min-width:0;font-size:12px;color:var(--g-mute)}
.out .r .w b{color:var(--g-ink);font-size:13px}
.fee,.ex .v{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
.fee.bill,.ex .v.yes{background:var(--g-on);color:#fff;border:1px solid var(--g-on)}
.fee.free,.ex .v.no{background:#fff;color:var(--g-ink);border:1px solid var(--g-line)}
.fee.open{background:transparent;color:var(--g-mute);border:1px dashed var(--g-mute)}
.same{margin:5px 0 0!important;font-size:12px;font-weight:700}
.ex .r span:first-child{flex:1;min-width:0;font-size:12.5px}
.ex .r small{color:var(--g-mute);font-size:11px}
.slider{display:block;width:100%;height:36px;margin:0;accent-color:var(--g-on);touch-action:pan-y}
.tolnow b{font-size:15px;font-weight:800}
@media (min-width:430px){ .strip{font-size:13.5px} }

/* ---------- case E · whose phone — the switch above the phone (only in case E) ---------- */
.who{flex:0 0 auto;display:none;align-items:center;gap:8px;padding:6px 10px;background:var(--g-bg);border-bottom:1px solid var(--g-line)}
.stage.caseE .who{display:flex}
/* with the switch row above the phone, the strip gives back its height so the phone still keeps 300px */
.stage.caseE .strip{max-height:min(46dvh,calc(100dvh - 408px))}
.stage.caseE .strip.notes{max-height:calc(100dvh - 408px)}
.who .wseg{flex:1;display:flex;gap:2px;border-radius:999px;background:#fff;border:1px solid var(--g-line);padding:2px}
.who .wseg button{flex:1;min-height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--g-mute);text-align:center}
.who .wseg button.on{background:var(--g-on);color:#fff}
.who .wseg button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who .wstep{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g-mute);white-space:nowrap}

/* ---------- case E · the SUPPLIER's phone — the supplier dashboard's approved look (supplier_dashboard_2026-10-08_fable.html), scoped under .sup ---------- */
.sup{--ok:#2B744A;--warn:#965A00;--warn-soft:#f6e9dd;--on-tone:#fff}
.sup .shell{gap:10px}
.sup .shell .logo{font-size:15px;letter-spacing:.14em}
.sup .shell .shop{font-size:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sup .shell .door{position:relative;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--paper-2)}
.sup .shell .door svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sup .shell .door b{position:absolute;top:-3px;right:-3px;background:var(--wine);color:#fff;font-size:10px;border-radius:999px;padding:1px 5px;line-height:1.3}
.sup .shell .av{width:44px;height:44px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px}
.sup .shell .back{width:44px;height:44px;display:grid;place-items:center;margin-left:-8px;font-size:22px;color:var(--ink)}
.sup .shell .title{font-size:16px;font-weight:500}
.sup main{padding:0 16px}
.sup .scroll{padding-bottom:calc(var(--bar) + 84px)}
/* public page (the claim link) — the same rows, a title block */

        <p>${e.miss==='noreply'?`<b>Today the couple sees nothing.</b> No “Invite sent · ${e.days} days”, no countdown — the link quietly expires after ${TTL_DAYS} days and the Connect panel offers “Create their link” again. “No reply · N days” ships only for chat threads, not for a link. The record stays “your record, not a booking”. <span class="q">Question:</span> should the card say “Link sent · ${e.days} days · not opened”? (Not shipped — pill copy exists in <code>INVITE_PILL_COPY</code> with no caller.)`
          :e.miss==='declined'?`<b>They see “Declined · This invite was previously declined.”</b> The couple is told <b>nothing</b>: no notification, no pill; the Connect panel offers “Create their link” again. The record stays the couple’s. <span class="q">Question:</span> should the couple be told?`
          :`<b>Approval 11’s case.</b> The couple’s link carries no email, so the shipped “Already a supplier · Sign in &amp; connect” screen never appears for it — the owner of an existing shop sees the same “Claim &amp; sign up” page and, if they sign up again, gets a <b>second shop</b>. Credit follows the case B switch (approval 11): <b>${RULES[S.rule11]}</b>${S.rule11==='proposed'?` · couple saw them before: <b>${S.seen?'yes → Setnayan’s, billable kind':'no → the supplier’s, free'}</b>`:''}.`}</p>`;
      notes=`<p class="q">E7 · When it does not complete.</p><p class="src">Shipped: <code>declineVendorInviteByToken</code> sets <code>vendor_invites.status='declined'</code> and nothing notifies the couple · <code>daysLeftFor</code>, <code>pillVariantFor</code>, <code>INVITE_PILL_COPY</code> (“Invite sent · Joined Setnayan · Declined invite · Invite expired”) are defined with no caller · the “Already a supplier” branch keys on <code>invite.email</code>, which the couple’s link does not carry. Case B’s switch (approval 11) is the same state as here — flip it in case B or E6 and the credit line follows.</p>`; }
    return {main,notes}; }

  /* ---------------- cases ---------------- */
  const CASE_LABEL={a:'A · Start','a-match':'A · Name is on Setnayan','a-none':'A · Name is not on Setnayan','a-link':'A · Their link','a-note':'A · Your record',b:'B · Who gets the credit',c:'C · Add later',d:'D · The price check',
    e:'E1 · They open the link','e-join':'E2 · They join','e-card':'E3 · Their first card','e-today':'E4 · Their Today','e-couple':'E5 · The couple’s phone','e-fee':'E6 · The booking fee','e-miss':'E7 · Not completed'};
  const TITA="Tita Baby's Catering";
  function addOwn(extra){ const d=S.draft; const x=Object.assign({id:'own'+(S.yours.length+1),own:true,cat:d.cat,name:d.name.trim(),who:d.who,mobile:d.mobile,status:'own',fresh:true},extra||{}); S.yours.push(x); S.open=d.cat; return x; }
  function setCase(c,keepE){ hush(); const keep=S.notes; const prevE=S.e; CASE=c; S=seed(); S.notes=keep; $('#phone').classList.remove('sheet-open'); $('#scroll').scrollTop=0; $('#caseSel').value=c; $('#caseLabel').textContent=CASE_LABEL[c];
    if(c[0]==='e'){ S.e=keepE&&prevE?prevE:eSeed(); if(!keepE){ const e=S.e, st=STEP_OF[c];
        if(st>=2) e.who='supplier'; if(st===2) e.scr='signup';
        if(st>=3){ e.joined=true; e.email='tita@example.com'; e.scr='maker'; }
        if(st>=4){ e.cover=true; e.published=true; e.bell=1; e.scr='today'; }
        if(st===5) e.who='couple';
        if(st===6){ e.accepted=true; e.verified=true; e.asked=true; e.agreed=true; e.scr='money'; }
        if(st===7){ e.who='couple'; e.joined=false; e.published=false; e.cover=false; e.bell=0; e.scr='claim'; } }
      renderE(); return; }
    $('#stage').classList.remove('caseE'); S.e=null; restoreCouple();
    if(c==='a-match'||c==='b'){ S.draft.name='Luntian'; S.sheet='add'; S.step=1; }
    if(c==='a-none'){ S.draft.name=TITA; S.sheet='add'; S.step=1; }
    if(c==='a-link'){ S.draft={name:TITA,cat:'catering',who:'Maria Santos',mobile:''}; addOwn(); S.sheet='add'; S.step=4; }
    if(c==='a-note'){ S.draft={name:TITA,cat:'catering',who:'Maria Santos',mobile:''}; const x=addOwn(); S.recId=x.id; S.sheet='record'; }
    if(c==='d'){ S.draft={name:TITA,cat:'catering',who:'Maria Santos',mobile:''}; const x=addOwn({price:PLAN_TYPED}); S.recId=x.id; S.sheet='record'; }
    renderView(); renderLower(); if(S.sheet){ renderSheet(); $('#phone').classList.add('sheet-open'); if(c==='d') requestAnimationFrame(()=>{ const f=$('#recNoteHead'), b=$('#sheetBody'); if(f&&b) b.scrollTop=Math.max(0,f.getBoundingClientRect().top-b.getBoundingClientRect().top+b.scrollTop-8); }); }
    renderStrip(); requestAnimationFrame(()=>{ measure(); const own=S.yours.find(x=>x.own&&x.cat==='catering'); if(own&&!S.sheet) landOn(own.id); }); }

  /* ---------------- actions ---------------- */
  const ACT={
    else(){ toast('That one is on the built page. This prototype is only “Add your own”.'); },
    said(d){ toast(d.text); },
    close(){ closeSheet(); },
    opencat(d){ S.open=S.open===d.cat?null:d.cat; S.justOpened=S.open; S.query=''; renderView(); renderLower(); },
    add(){ S.draft={name:S.query.trim(),cat:S.open||'catering',who:'',mobile:''}; S.step=1; S.query=''; openSheet('add'); renderView(); renderLower(); },
    next(){ const d=S.draft; if(S.step===1){ if(!d.name.trim()){ S.err='Type their name first.'; const e=$('#addErr'); if(e) e.textContent=S.err; const f=$('#addName'); if(f) f.focus(); return; } }
      S.err=''; S.step=Math.min(4,S.step+1); renderSheet(); renderStrip(); },
    back(){ S.err=''; S.step=Math.max(1,S.step-1); renderSheet(); renderStrip(); },
    addown(){ const d=S.draft; if(!d.who.trim()&&!d.mobile.trim()){ S.err='Add who you talk to, or their mobile.'; const e=$('#addErr'); if(e) e.textContent=S.err; const f=$('#addWho'); if(f) f.focus(); return; }
      S.err=''; addOwn(); S.step=4; renderView(); renderSheet(); renderStrip(); },
    done(){ const own=[...S.yours].reverse().find(x=>x.own&&x.fresh); closeSheet(); renderView(); if(own){ landOn(own.id); toast(`You added ${own.name} — your record, not a booking`); } },
    inquire(d){ addShopAsAsked(d.id); S.open=SHOPS[d.id].cat; closeSheet(); renderView(); renderLower(); landOn(d.id); toast(`Asked ${SHOPS[d.id].name} — now under Yours`); },
    ask(d){ const x=S.yours.find(y=>y.id===d.id); if(x){ x.status='waiting'; x.quiet='Waiting for their quote'; x.fresh=true; } else addShopAsAsked(d.id); renderView(); renderStrip(); landOn(d.id); toast(`Asked ${SHOPS[d.id].name} — now under Yours`); },
    ask3(){ const three=market('catering').slice(0,3); three.forEach(m=>addShopAsAsked(m.id)); renderView(); renderStrip(); landOn(three[0].id); toast(`Asked ${three.length} suppliers — now under Yours`); },
    remove(d){ const x=S.yours.find(y=>y.id===d.id); S.yours=S.yours.filter(y=>y.id!==d.id); renderView(); renderStrip(); toast(`Removed ${x?nameOf(x):'them'}`); },
    record(d){ S.recId=d.id; openSheet('record'); },
    saverec(){ const x=S.yours.find(y=>y.id===S.recId); const nm=($('#recName').value||'').trim(); if(nm) x.name=nm; x.cat=$('#recCat').value; x.who=$('#recWho').value; x.mobile=$('#recMobile').value; x.price=digits($('#recPrice').value)||null; x.note=$('#recNote').value;
      const leak=leakByPrice(x.price,x.cat); x.leak=leak?{name:nameOf(leak),q:leak.quote}:null; x.fresh=false; S.open=x.cat; closeSheet(); renderView(); renderLower(); landOn(x.id); toast('Saved your record'); },
    bookleak(d){ const x=S.yours.find(y=>y.id===d.id); if(x) { x.status='asked'; x.fresh=true; } if(S.sheet==='record'){ S.yours=S.yours.filter(y=>y.id!==S.recId); S.recId=null; }
      closeSheet(); renderView(); renderLower(); landOn(d.id); toast(`Asked ${SHOPS[d.id].name} to book — waiting for their yes`); },
    /* ---- case E ---- */
    e_go(d){ eGo(d.to); },
    e_back(){ const e=S.e; e.scr=e.back.pop()||'today'; e.open={}; renderSup(); renderStrip(); },
    e_fold(d){ S.e.open[d.key]=!S.e.open[d.key]; renderSup(); },
    e_sw(d){ toast(d.key==='blk'?'Blocked — couples see only “unavailable”':'Switched'); },
    e_claim(){ setCase('e-join',true); S.e.scr='signup'; renderE(); },
    e_decline(){ S.e.miss='declined'; S.e.scr='declined'; renderSup(); renderStrip(); toast('Declined — the couple is told nothing (today’s behaviour)'); },
    e_terms(){ S.e.terms=!S.e.terms; renderSup(); },
    e_stay(){ S.e.stay=!S.e.stay; renderSup(); },
    e_signup(){ const e=S.e; if(!(e.email.includes('@')&&e.pw.length>=8&&e.terms)){ toast(!e.terms?'Tick the Terms and Privacy Policy first.':'An email and a password of at least 8 characters.'); return; }
      e.joined=true; setCase('e-card',true); S.e.scr='maker'; renderE(); toast('Account made · your shop stub exists · linked to the couple’s record'); },
    e_cover(){ S.e.cover=true; if(S.e.tour) S.e.tourStep=1; renderSup(); renderStrip(); toast('Cover photo added'); },
    e_rmincl(d){ S.e.incl.splice(+d.i,1); renderSup(); renderStrip(); },
    e_addincl(){ S.e.incl.push('Crew meals'); renderSup(); renderStrip(); },
    e_draft(){ toast('Saved as a draft — the couple is not told yet'); },
    e_publish(){ const e=S.e; const g=eGaps(); if(e.published){ setCase('e-today',true); S.e.scr='today'; renderE(); return; }
      if(g.length){ e.open={[!e.cover?'photos':!(e.price>0)?'price':'incl']:true}; renderSup(); toast(`Add ${g[0]} first — or keep it as a draft`); return; }
      e.published=true; e.bell=1; e.tour=false; setCase('e-today',true); S.e.scr='today'; renderE(); toast(`Published · linked to ${COUPLE}’s wedding · they are told you joined`); },
    e_accept(){ S.e.accepted=true; renderSup(); renderStrip(); toast('Inquiry accepted — the chat is open'); },
    e_agree(){ const e=S.e; e.agreed=true; e.accepted=true; const fo=feeOutcome(); e.scr='money'; e.back=['today']; setCase('e-fee',true); renderE();
      toast(fo.status==='pending'?`Booked · booking fee ${peso(fo.fee)} opened (sample)`:fo.status==='waived_free5'?`Booked · fee waived — booking ${fo.ordinal} of your first ${FREE_LIMIT}`:fo.status==='waived_import'?'Booked · no booking fee — a client you brought':'Booked · no charge row'); },
    e_logpay(){ S.e.logged=true; renderSup(); renderStrip(); toast('Logged — it clears once our team confirms your payment (within 24 hours)'); },
    e_verify(){ S.e.verified=true; renderSup(); renderStrip(); toast('Approved · your page is live · couples can book you'); },
    e_bell(){ toast('Your supplier joined Setnayan — A supplier you added has linked their service to your plan.'); },
    e_tournext(){ const e=S.e; if(e.tourStep>=TOUR_E.length-1){ e.tour=false; } else e.tourStep++; renderSup(); },
    e_tourskip(){ S.e.tour=false; renderSup(); },
    e_book(d){ const e=S.e; const x=S.yours.find(y=>y.id===d.id); if(!x) return;
      if(x.own&&!x.linked){ e.prebooked=true; x.status='booked'; renderView(); renderStrip(); landOn(x.id); toast('Booked by hand — no handshake, no fee: they have no shop link yet'); return; }
      if(!e.verified){ e.verified=true; renderStrip(); toast('This supplier is completing verification and can’t be booked just yet. Keep them shortlisted — you’ll be able to book them once they’re verified. (Prototype approved the shop for you — tap Book again.)'); return; }
      e.asked=true; x.status='asked'; x.fresh=true; renderView(); renderStrip(); landOn(x.id); toast(`Asked ${nameOf(x)} to book — waiting for their yes`); }
  };
  function supDeclined(){ return `<div class="pub"><span class="eye">Declined</span><h2>This invite was previously declined.</h2><p>If you’d like to reconsider, please ask Setnayan to send a new invite.</p><div class="acts" style="margin-top:14px">${sbtn('grey','out','Back to Setnayan',false,'data-act="said" data-text="Back to Setnayan"')}</div></div>`; }
  SUP_SCREEN.declined=supDeclined; SUP_TITLE.declined=undefined;
  document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(t){ if(t.getAttribute('aria-disabled')==='true'&&t.dataset.act!=='e_publish'&&t.dataset.act!=='e_signup') return; const a=ACT[t.dataset.act]; if(a) a(t.dataset); return; }
    const w=e.target.closest('[data-who]'); if(w&&isE()){ hush(); const who=w.dataset.who; const st=STEP_OF[CASE]; if(who==='couple'&&st===4&&S.e.published){ S.e.who=who; setCase('e-couple',true); return; } if(who==='supplier'&&st===5){ S.e.who=who; S.e.scr=S.e.asked&&!S.e.agreed?'today':S.e.scr; setCase('e-today',true); return; } S.e.who=who; renderE(); return; }
    const g=e.target.closest('[data-tog],[data-togl]'); if(g){ hush(); const k=g.dataset.tog||g.dataset.togl;
      if(isE()&&(k==='priceWaits'||k==='seen11'||k==='prebooked'||k==='feeLock')){ S.e[k]=!S.e[k]; if(k==='seen11') S.seen=S.e.seen11; renderE(); return; }
      if(k==='seen') S.seen=!S.seen; else S.c12[k]=!S.c12[k]; renderStrip(); if(CASE==='c'){ renderView(); showFor(k); } return; }
    if(e.target.closest('#stripToggle')){ S.notes=!S.notes; renderStrip(); requestAnimationFrame(()=>{ measure(); fitActs(); }); } });
  let qT=null, mT=null;
  document.addEventListener('input',e=>{ const t=e.target;
    if(t.id==='thumbSearch'){ const v=t.value; clearTimeout(qT); qT=setTimeout(()=>{ S.query=v; renderView(); renderLower(true); },250); }
    else if(t.id==='addName'){ S.draft.name=t.value; S.err=''; const er=$('#addErr'); if(er) er.textContent=''; clearTimeout(mT); mT=setTimeout(()=>{ const box=$('#addMatches'); if(box) box.innerHTML=matchesHtml(); $('#sheetFoot').innerHTML=footHtml(); renderStrip(); showMatches(); },250); }
    else if(t.id==='addWho'||t.id==='addMobile'){ S.draft[t.id==='addWho'?'who':'mobile']=t.value; S.err=''; const er=$('#addErr'); if(er) er.textContent=''; }
    else if(t.id==='recPrice'){ const n=digits(t.value); t.value=n?peso(n):''; const x=S.yours.find(y=>y.id===S.recId); if(x){ x.price=n||null; const leak=leakByPrice(x.price,x.cat); $('#recLeak').innerHTML=leak?leakCard(leak,true):''; } if(CASE==='d'){ const b=$('#exBox'); if(b) b.innerHTML=ownerRow()+exRows(); } }
    else if(t.id==='tol'){ S.tol=parseFloat(t.value); S.tolTouched=true; $('#tolNow').innerHTML=tolLine(); $('#exBox').innerHTML=ownerRow()+exRows(); const x=S.yours.find(y=>y.id===S.recId); const box=$('#recLeak'); if(x&&box){ const leak=leakByPrice(x.price,x.cat); box.innerHTML=leak?leakCard(leak,true):''; } }
    else if(t.id==='spendFig'){ const n=digits(t.value); t.value=n?n.toLocaleString('en-US'):''; S.c12.spendFig=t.value; renderView(); }
    else if(t.id==='kindN'){ t.value=t.value.replace(/\D/g,'').slice(0,2); S.c12.kindN=t.value; renderView(); }
    else if(isE()&&t.id==='suEmail'){ S.e.email=t.value; $('#lower').innerHTML=supLower(); }
    else if(isE()&&t.id==='suPw'){ S.e.pw=t.value; $('#lower').innerHTML=supLower(); }
    else if(isE()&&t.id==='mkPrice'){ const n=digits(t.value); S.e.price=n; const c=$('.sup .card .pr'); if(c){ c.textContent=n?peso(n):'from ₱—'; c.classList.toggle('ph',!n); } $('#lower').innerHTML=supLower(); }
    else if(isE()&&t.id==='mkTitle'){ S.e.title=t.value; const c=$('.sup .card .nm'); if(c){ c.textContent=t.value||'Service name'; c.classList.toggle('ph',!t.value); } }
    else if(isE()&&t.id==='eDays'){ t.value=t.value.replace(/\D/g,'').slice(0,3); S.e.days=parseInt(t.value,10)||0; const lab=$('#stripMain p'); if(lab) renderStrip(); }
    else if(isE()&&t.id==='eTol'){ S.e.tolD=parseFloat(t.value); S.e.tolTouched=true; renderE(); const sl=$('#eTol'); if(sl) sl.focus(); } });
  document.addEventListener('change',e=>{ const t=e.target;
    if(t.id==='caseSel') setCase(t.value);
    else if(t.id==='addCat'){ S.draft.cat=t.value; $('#addCatLabel').textContent=cat(t.value).name; }
    else if(t.id==='recCat'){ $('#recCatLabel').textContent=cat(t.value).name; }
    else if(t.id==='rule11'){ S.rule11=t.value; renderStrip(); }
    else if(isE()&&t.id==='eView'){ S.e.view=t.value; renderE(); }
    else if(isE()&&t.id==='eFeePath'){ S.e.feePath=t.value; S.e.open={}; renderE(); }
    else if(isE()&&t.id==='eRule11'){ S.e.fee11=t.value; S.rule11=t.value; renderE(); }
    else if(isE()&&t.id==='eOrd'){ S.e.ord=t.value; renderE(); }
    else if(isE()&&t.id==='eMiss'){ S.e.miss=t.value; if(t.value==='hasShop'){ S.e.who='supplier'; S.e.scr='claim'; } else if(t.value==='declined'){ S.e.who='supplier'; S.e.scr='declined'; } else { S.e.who='couple'; } renderE(); } });
  // the strip changes height with its content → the phone changes height → re-fit what depends on it
  if(window.ResizeObserver) new ResizeObserver(()=>{ measure(); fitActs(); if(S.sheet==='add'&&S.step===1) showMatches(); }).observe($('#phone'));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.sheet) closeSheet(); if(e.key==='Enter'&&e.target.id==='addName'){ e.preventDefault(); ACT.next(); } });
  addEventListener('resize',()=>{ measure(); fitActs(); });

  const start=new URLSearchParams(location.search).get('case'); setCase(CASE_LABEL[start]?start:'a');
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ measure(); fitActs(); });
})();
</script>
</body>
