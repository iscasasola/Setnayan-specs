<title>Setnayan — Payment Flow</title>
<style>
  :root{
    --ground:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFFFFF;
    --ink:#2C2A29; --ink-soft:#4F535B; --ink-faint:#4F535B;
    --gold:#A9834B;--cta:#C24E25;--cta-label:#FFFFFF; --gold-bright:#8A6B39;
    --on-gold:#FFFFFF; --panel:#17160F; --panel-ink:#FFFFFF;
    --line:rgba(27,24,19,.13); --line-strong:rgba(27,24,19,.22);
    --ok:#4F6B4A; --ok-bg:rgba(63,115,85,.12);
    --wait:#8A6B39; --wait-bg:rgba(154,116,26,.12);
    --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"Space Mono",ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  
  :root[data-theme="light"]{
    --ground:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFFFFF;
    --ink:#2C2A29; --ink-soft:#4F535B; --ink-faint:#4F535B;
    --gold:#A9834B;--cta:#C24E25;--cta-label:#FFFFFF; --gold-bright:#8A6B39; --on-gold:#FFFFFF; --panel:#17160F; --panel-ink:#FFFFFF;
    --line:rgba(27,24,19,.13); --line-strong:rgba(27,24,19,.22);
    --ok:#4F6B4A; --ok-bg:rgba(63,115,85,.12); --wait:#8A6B39; --wait-bg:rgba(154,116,26,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:940px;margin:0 auto;padding:0 clamp(18px,4vw,36px);}
  .mono{font-family:var(--mono);}
  h1{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:-.02em;font-weight:800;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;}

  header{padding:28px 0 8px;}
  .htop{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:.26em;font-size:13px;}
  .sub{color:var(--ink-soft);margin-top:8px;font-size:16px;}

  /* payer toggle */
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:3px;gap:3px;margin-top:22px;flex-wrap:wrap;}
  .seg button{font-family:var(--mono);font-size:12px;letter-spacing:.03em;text-transform:uppercase;font-weight:700;
    border:0;background:transparent;color:var(--ink-soft);padding:9px 15px;border-radius:2px;cursor:pointer;transition:.15s;}
  .seg button[aria-selected="true"]{background:var(--gold);color:var(--on-gold);}
  .seg small{display:block;font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:0;text-transform:none;opacity:.75;}

  /* stepper */
  .stepper{display:flex;gap:0;margin:30px 0 22px;overflow-x:auto;padding-bottom:4px;}
  .stepper button{flex:1;min-width:96px;background:transparent;border:0;cursor:pointer;text-align:left;padding:0;position:relative;}
  .stepper .bar{height:3px;background:var(--line);border-radius:2px;margin-bottom:9px;transition:.3s;}
  .stepper button[data-done="1"] .bar,.stepper button[aria-current="step"] .bar{background:var(--gold);}
  .stepper .n{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);}
  .stepper .t{font-size:12.5px;line-height:1.25;color:var(--ink-soft);display:block;margin-top:1px;padding-right:8px;}
  .stepper button[aria-current="step"] .t{color:var(--ink);font-weight:600;}

  .lane{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:5px 11px;border-radius:2px;margin-bottom:14px;}
  .lane.payer{color:var(--gold);background:var(--wait-bg);}
  .lane.setnayan{color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);}

  /* screen frame */
  .screen{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:clamp(20px,3.5vw,34px);box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 40px -26px rgba(27,24,19,.35);min-height:340px;}
  .caption{color:var(--ink-soft);font-size:15.5px;margin:18px 2px 0;max-width:66ch;}
  .caption b{color:var(--ink);}

  /* nav */
  .nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:22px 0 8px;}
  .btn{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;border:1px solid var(--cta);background:var(--cta);color:var(--cta-label);padding:11px 20px;border-radius:2px;cursor:pointer;transition:.15s;}
  .btn:hover{transform:translateY(-1px);} .btn:disabled{opacity:.4;cursor:default;transform:none;}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);}
  .counter{font-family:var(--mono);font-size:12px;color:var(--ink-faint);letter-spacing:.05em;}

  .hood{margin:14px 0 40px;font-family:var(--mono);font-size:12px;color:var(--ink-faint);border-top:1px dashed var(--line-strong);padding-top:14px;display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;}
  .hood b{color:var(--gold);}
  .hood .st{color:var(--ink-soft);}

  /* mock atoms */
  .mock{display:flex;flex-direction:column;gap:16px;}
  .mrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .item{font-size:20px;font-weight:700;letter-spacing:-.01em;}
  .muted{color:var(--ink-soft);font-size:14px;}
  .amount{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .refchip{font-family:var(--mono);font-size:13px;background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:4px;padding:8px 12px;display:inline-flex;gap:8px;align-items:center;letter-spacing:.05em;}
  .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 9px;border-radius:2px;display:inline-block;}
  .pill.wait{color:var(--wait);background:var(--wait-bg);} .pill.ok{color:var(--ok);background:var(--ok-bg);}
  .pill.line{color:var(--ink-soft);border:1px solid var(--line-strong);}
  .divider{height:1px;background:var(--line);margin:2px 0;}
  .qrs{display:flex;gap:16px;flex-wrap:wrap;}
  .qrcard{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;align-items:center;}
  .qrcard .bank{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);align-self:flex-start;font-weight:700;}
  .qr{width:118px;height:118px;display:grid;grid-template-columns:repeat(11,1fr);gap:2px;background:transparent;}
  .qr i{background:var(--ink);border-radius:1px;} .qr i.o{background:transparent;}
  .qrnum{font-family:var(--mono);font-size:12.5px;color:var(--ink);letter-spacing:.03em;}
  .field{border:1px solid var(--line-strong);border-radius:6px;padding:12px 14px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;color:var(--ink-soft);font-size:14px;}
  .field b{color:var(--ink);font-family:var(--mono);}
  .dropzone{border:1.5px dashed var(--line-strong);border-radius:8px;padding:22px;text-align:center;color:var(--ink-faint);font-size:14px;background:var(--surface-2);}
  .dropzone .up{display:inline-flex;flex-direction:column;align-items:center;gap:6px;}
  .waitbox{text-align:center;padding:26px 10px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .clock{width:70px;height:70px;border-radius:50%;border:3px solid var(--wait);display:grid;place-items:center;font-size:30px;}
  .qrow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface-2);flex-wrap:wrap;}
  .qrow.clean{border-color:var(--ok);}
  .qrow .who{font-weight:600;} .grow{flex:1;}
  .checks{display:flex;gap:8px;flex-wrap:wrap;}
  .chk{font-family:var(--mono);font-size:11px;color:var(--ok);background:var(--ok-bg);padding:4px 8px;border-radius:2px;}
  .approve{font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--ok);color:#FFFFFF;border:0;border-radius:2px;padding:9px 16px;cursor:pointer;}
  .batchbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 14px;flex-wrap:wrap;}
  .success{text-align:center;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .tick{width:76px;height:76px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:38px;}
  .prov{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px 18px;font-size:14px;color:var(--ink);}
  .prov b{color:var(--gold);}
  .callout{font-size:13.5px;color:var(--gold);background:var(--wait-bg);border-radius:6px;padding:11px 14px;}
  @media (max-width:640px){.amount{font-size:28px}.stepper button{min-width:84px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="htop">
      <div>
        <div class="brand">SETNAYAN</div>
        <div class="eyebrow" style="margin-top:12px">Payment flow · manual verification (V1)</div>
        <h1 style="margin-top:6px">One flow for every purchase.</h1>
        <p class="sub">Vendors, users, and events all pay the same way — GCash / BDO transfer, verified by the team. Toggle who's paying:</p>
      </div>
    </div>
    <div class="seg" id="seg" role="tablist" aria-label="Who is paying">
      <button role="tab" data-payer="vendor" aria-selected="true">Vendor<small>5% booking fee</small></button>
      <button role="tab" data-payer="user" aria-selected="false">User<small>SKU purchase</small></button>
      <button role="tab" data-payer="event" aria-selected="false">Event<small>add-on</small></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="stepper" id="stepper"></div>
  <div id="laneWrap"></div>
  <div class="screen" id="screen"></div>
  <p class="caption" id="caption"></p>
  <div class="nav">
    <button class="btn ghost" id="prev">‹ Back</button>
    <span class="counter" id="counter"></span>
    <button class="btn" id="next">Next ›</button>
  </div>
  <div class="hood" id="hood"></div>
</main>

<script>
(function(){
  var payers = {
    vendor: {tag:"Vendor pays Setnayan", item:"Booking fee — Cruz × Santos wedding", detail:"5% of ₱120,000 final agreed price", amount:"₱6,000", who:"Blooms by Ana", whoNote:"vendor", ref:"SN3F9A21C4", key:"vendor_booking_fee", prov:"Booking fee cleared — proposal can send / booking confirmed",
      callout:"A vendor's first 5 booked customers are FREE — no order is created for those. This is booking #6."},
    user: {tag:"User pays Setnayan", item:"Animated Monogram", detail:"One-time purchase · couple", amount:"₱999", who:"Maria & Josef", whoNote:"couple", ref:"SN7B22E0D9", key:"animated_monogram", prov:"Animated Monogram unlocked across your event",
      callout:null},
    event: {tag:"Event add-on", item:"Papic — 5 Seats", detail:"Event gallery + candid capture", amount:"₱2,999", who:"Cruz × Santos event", whoNote:"event add-on", ref:"SN10C4AA5E", key:"papic_seats_5", prov:"Papic seats activated for the event",
      callout:null}
  };

  // deterministic QR-ish pattern
  function qr(seed){
    var cells="";
    for(var i=0;i<121;i++){
      var r=Math.floor(i/11), c=i%11;
      var corner=(r<3&&c<3)||(r<3&&c>7)||(r>7&&c<3);
      var on = corner ? ((r===0||r===2||c===0||c===2)|| (r===1&&c===1)) : (((i*7+seed)%3)===0 || ((i+seed)%5===0));
      cells+='<i class="'+(on?'':'o')+'"></i>';
    }
    return '<div class="qr" aria-hidden="true">'+cells+'</div>';
  }

  var steps = [
    {n:"01", t:"Order created", lane:"payer", orders:"awaiting_payment", pay:"—",
     cap:function(p){return "You choose what to buy and an <b>order</b> is created with a unique reference code. Every purchase — vendor fee, user SKU, event add-on — starts here on the same <b>orders</b> table.";},
     render:function(p){return '<div class="mock">'+
        '<div class="mrow"><div><div class="item">'+p.item+'</div><div class="muted">'+p.detail+'</div></div><span class="pill wait">awaiting payment</span></div>'+
        '<div class="divider"></div>'+
        '<div class="mrow"><span class="muted">Amount due</span><span class="amount">'+p.amount+'</span></div>'+
        '<div class="mrow"><span class="muted">Paying as</span><span class="mono">'+p.who+' · '+p.whoNote+'</span></div>'+
        '<div class="refchip">REF <b>'+p.ref+'</b> · include this in your transfer</div>'+
        (p.callout?'<div class="callout">'+p.callout+'</div>':'')+
      '</div>';}},

    {n:"02", t:"Pay via QR", lane:"payer", orders:"awaiting_payment", pay:"—",
     cap:function(p){return "Scan the <b>GCash</b> or <b>BDO</b> QR and pay from your own app. Put the reference code in the notes — that's what lets us match your payment automatically.";},
     render:function(p){return '<div class="mock">'+
        '<div class="mrow"><div class="item">Pay '+p.amount+'</div><span class="refchip">REF <b>'+p.ref+'</b></span></div>'+
        '<div class="qrs">'+
          '<div class="qrcard"><span class="bank">GCash</span>'+qr(3)+'<span class="qrnum">0917 555 0134</span></div>'+
          '<div class="qrcard"><span class="bank">BDO</span>'+qr(8)+'<span class="qrnum">0012 8899 4471</span></div>'+
        '</div>'+
        '<div class="field"><span>Reference to include</span><b>'+p.ref+'</b></div>'+
      '</div>';}},

    {n:"03", t:"Log your payment", lane:"payer", orders:"submitted", pay:"pending",
     cap:function(p){return "After paying, you upload a screenshot of the receipt. This creates a <b>payment</b> record (status <b>pending</b>) — proof the team can check against the bank.";},
     render:function(p){return '<div class="mock">'+
        '<div class="item">Log your payment</div>'+
        '<div class="field"><span>Amount paid</span><b>'+p.amount+'</b></div>'+
        '<div class="field"><span>Reference</span><b>'+p.ref+'</b></div>'+
        '<div class="dropzone"><span class="up"><span style="font-size:26px">⬆︎</span>Upload GCash / BDO receipt screenshot<br><span class="mono" style="font-size:12px">receipt_'+p.ref.toLowerCase()+'.jpg</span></span></div>'+
        '<div class="mrow"><span class="pill line">payment · pending</span><button class="approve" style="background:var(--gold)">Submit for verification</button></div>'+
      '</div>';}},

    {n:"04", t:"Up for verification", lane:"payer", orders:"submitted", pay:"pending",
     cap:function(p){return "You see an honest wait message. Manual verification has a <b>24-hour SLA</b> — no guessing, no silent limbo.";},
     render:function(p){return '<div class="mock"><div class="waitbox">'+
        '<div class="clock">⏳</div>'+
        '<div class="item">Your purchase is up for verification</div>'+
        '<div class="muted" style="max-width:42ch">Please wait for confirmation within <b>24 hours</b>. We’ll email you the moment your '+p.whoNote+' payment clears.</div>'+
        '<span class="refchip">REF <b>'+p.ref+'</b> · '+p.amount+'</span>'+
      '</div></div>';}},

    {n:"05", t:"Team confirms", lane:"setnayan", orders:"paid", pay:"matched",
     cap:function(p){return "In <b>/admin/payments</b>, the payment appears with its reference matched and amount reconciled. On a clean match it’s <b>one click to approve</b> (and clean matches can be batch-approved) — a partial or mismatched payment still gets a full manual check.";},
     render:function(p){return '<div class="mock">'+
        '<div class="batchbar"><span class="mono" style="font-size:12px">ADMIN · PAYMENTS QUEUE</span><span>3 clean matches · <b style="color:var(--ok)">Approve all</b></span></div>'+
        '<div class="qrow clean">'+
          '<div><div class="who">'+p.who+'</div><div class="muted mono" style="font-size:12px">'+p.key+' · '+p.ref+'</div></div>'+
          '<div class="grow"></div>'+
          '<div class="checks"><span class="chk">✓ Reference matches</span><span class="chk">✓ '+p.amount+' reconciles</span></div>'+
          '<button class="approve">Approve</button>'+
        '</div>'+
        '<div class="qrow" style="opacity:.6"><div><div class="who">Other payment</div><div class="muted mono" style="font-size:12px">amount short ₱200</div></div><div class="grow"></div><span class="pill line">needs review</span></div>'+
      '</div>';}},

    {n:"06", t:"Activated", lane:"payer", orders:"fulfilled", pay:"matched",
     cap:function(p){return "The order flips to <b>paid → fulfilled</b> and the thing is provisioned automatically. You’re notified. Later, a bank feed will make step 5 automatic — the payer’s experience never changes.";},
     render:function(p){return '<div class="mock"><div class="success">'+
        '<div class="tick">✓</div>'+
        '<div class="item">Paid & activated</div>'+
        '<div class="prov"><b>'+p.prov+'</b></div>'+
        '<div class="muted">'+p.who+' notified · '+p.amount+' · '+p.ref+'</div>'+
        '<span class="pill ok">order · fulfilled</span>'+
      '</div></div>';}}
  ];

  var payer="vendor", step=0;
  var seg=document.getElementById("seg"), stepper=document.getElementById("stepper"),
      screen=document.getElementById("screen"), caption=document.getElementById("caption"),
      counter=document.getElementById("counter"), hood=document.getElementById("hood"),
      laneWrap=document.getElementById("laneWrap"),
      prev=document.getElementById("prev"), next=document.getElementById("next");

  function buildStepper(){
    stepper.innerHTML="";
    steps.forEach(function(s,i){
      var b=document.createElement("button");
      b.innerHTML='<div class="bar"></div><span class="n">'+s.n+'</span><span class="t">'+s.t+'</span>';
      b.setAttribute("data-done", i<step?"1":"0");
      if(i===step) b.setAttribute("aria-current","step");
      b.onclick=function(){step=i;render();};
      stepper.appendChild(b);
    });
  }
  function render(){
    var p=payers[payer], s=steps[step];
    buildStepper();
    laneWrap.innerHTML='<span class="lane '+s.lane+'">'+(s.lane==="payer"?"● "+p.tag:"◆ Setnayan · internal")+'</span>';
    screen.innerHTML=s.render(p);
    caption.innerHTML=s.cap(p);
    counter.textContent="Step "+(step+1)+" of "+steps.length;
    hood.innerHTML='<span class="st">Under the hood</span> <span><b>orders</b>.status → '+s.orders+'</span> <span><b>payments</b>.status → '+s.pay+'</span>';
    prev.disabled=step===0; next.disabled=step===steps.length-1;
  }
  seg.querySelectorAll("button").forEach(function(b){
    b.onclick=function(){
      payer=b.getAttribute("data-payer");
      seg.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-selected", x===b?"true":"false");});
      render();
    };
  });
  prev.onclick=function(){if(step>0){step--;render();}};
  next.onclick=function(){if(step<steps.length-1){step++;render();}};
  document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")next.onclick();if(e.key==="ArrowLeft")prev.onclick();});
  render();
})();
</script>

</body></html>
