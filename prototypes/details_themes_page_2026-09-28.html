<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Details — navigator · preview · editor, with Prints &amp; Tickets folded in · prototype 2026-09-28</title>
<!--
  PROTOTYPE · Event Hub Maker → Details as the Maker's own three-column pattern.
    LEFT  · a navigator of the Details items, grouped, with thumbnails (the scene navigator's shape)
    BODY  · the visual preview of the picked item
    RIGHT · the editor for the picked item (typing + switches)
  Prints & Tickets is FOLDED INTO Details (owner 2026-09-28: "1 fold prints and tickets into details").
  The Theme item's gallery shows CLEAN TEMPLATES on the sample wedding Maria & Jose (owner: "we will show a
  clean preview of each website … as sample template with the prints, with the sample event hub").
  Text-carrying switches show the SAME field inline, editable in place — no link-outs (DECISION_LOG "NO "GO EDIT IT OVER THERE" LINKS" + "EVERY TEXT IS TYPED
  WHERE IT LIVES; THE DETAILS CHECKLIST ONLY SWITCHES IT ON"); only Opening line and Kindly reply are typed here.

  Sources (origin/main, never ~): lib/invite-themes.ts (ten themes) · lib/print-pieces.ts (pieces, sizes,
  PRINT_FORMATS) · lib/free-prints.ts (For the day) · launch/_components/maker-details.tsx, maker-prints.tsx,
  qr-look-controls.tsx (lib/qr-look.ts), invitation/_components/slug-field.tsx, website/editor/_components/
  editor-shell.tsx (navigator: phone = horizontal strip under the canvas; lg = left column) ·
  lib/maker-made-once-pages.ts (page dropdown). Sample content read from the live public page /maria-and-jose.

  No query → the shell (frames + item switcher). ?view=page&item=<key>&sheet=open → the page itself.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+SC&family=EB+Garamond&family=Great+Vibes&family=Lora:ital@0;1&family=Kaushan+Script&family=Instrument+Serif&family=Jost:wght@400;500&family=Italiana&family=Alex+Brush&family=Bodoni+Moda&family=Pinyon+Script&family=Playfair+Display&family=Libre+Baskerville&family=Mrs+Saint+Delafield&family=Yeseva+One&family=Quicksand:wght@400;600&family=Cookie&family=Prata&family=Crimson+Pro&family=Parisienne&family=Limelight&family=Josefin+Sans&family=Poiret+One&family=Syne:wght@500;700&family=Outfit&family=Monoton&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#f8f6f1; --ink:#2a2622; --ink-70:rgba(42,38,34,.7); --ink-55:rgba(42,38,34,.55); --ink-35:rgba(42,38,34,.35);
    --line:rgba(42,38,34,.1); --line-soft:rgba(42,38,34,.05); --gold:#cba766; --mulberry:#8f2f45; --terracotta:#b5562f;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; --display:"Fraunces",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --nav-w:236px; --ed-w:360px;
  }
  *{box-sizing:border-box} html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
  button,select,input,textarea{font:inherit;color:inherit} a{color:var(--mulberry)}
  .mono{font-family:var(--mono)}

  /* ═════════ SHELL ═════════ */
  .shell{padding:18px 20px 40px}
  .shell h1{font:500 22px/1.2 var(--display);margin:0 0 4px}
  .shell .sub{font-size:13px;color:var(--ink-70);margin:0 0 14px;max-width:1100px}
  .shell .sub b{color:var(--ink)}
  .sw{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;margin-bottom:12px}
  .sw fieldset{border:0;padding:0;margin:0}
  .sw legend{font:11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);margin-bottom:6px}
  .seg{display:inline-flex;flex-wrap:wrap;background:rgba(42,38,34,.06);border-radius:999px;padding:2px}
  .seg label{cursor:pointer} .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:inline-flex;align-items:center;min-height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-70)}
  .seg input:checked+span{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .frames{display:flex;gap:26px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
  .frame{flex:0 0 auto}
  .frame .cap{font:11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);margin:0 0 8px}
  .frame iframe{display:block;border:1px solid rgba(42,38,34,.18);border-radius:22px;background:#fff;box-shadow:0 30px 60px -34px rgba(30,26,18,.5)}
  .frame.desk iframe{border-radius:10px}
  .notes{font-size:13px;color:var(--ink-70);max-width:1100px;padding-left:18px;margin:14px 0 0}
  .notes li{margin:3px 0} .notes b{color:var(--ink)}

  /* ═════════ THE MAKER ═════════ */
  .maker{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--cream);position:relative;z-index:20;flex:0 0 auto}
  .bar .tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:42px;padding:4px 6px;border:0;background:none;font-size:10.5px;color:var(--ink-70);border-radius:8px}
  .bar .tool i{font-style:normal;font-size:17px;line-height:1;color:var(--ink)}
  .bar .tool.on{background:rgba(42,38,34,.08)}
  .bar .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
  .bar .place{position:relative;margin:0 auto}
  .bar .page-pick{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:0;background:none;font-size:15px;font-weight:500;border-radius:8px;cursor:pointer}
  .bar .page-pick:hover{background:rgba(42,38,34,.06)}
  .bar .menu{display:none;position:absolute;left:50%;top:40px;transform:translateX(-50%);min-width:190px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);padding:6px;z-index:30}
  .bar .place.open .menu,.bar .playm.open .menu{display:block}
  .bar .menu button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:8px 10px;border:0;background:none;border-radius:6px;font-size:13.5px;text-align:left}
  .bar .menu button.on{background:rgba(42,38,34,.06);font-weight:600}
  .bar .menu .grp{font:10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);padding:6px 10px 2px}
  .bar .word{padding:6px 8px;font-size:12.5px;color:var(--ink-70);background:none;border:0;white-space:nowrap}
  .bar .apply{padding:7px 14px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
  .bar .apply .dia{color:var(--gold);margin-left:4px}
  @media (max-width:640px){ .bar .tool{min-width:36px} .bar .word,.bar .hide-sm{display:none} .bar .page-pick{font-size:14px} }

  .work{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
  @media (min-width:1024px){ .work{flex-direction:row} }

  /* ── NAVIGATOR — the scene navigator's shape: strip on a phone, column from lg ── */
  .nav{order:2;flex:0 0 auto;background:rgba(248,246,241,.92);border-top:1px solid var(--line)}
  .nav ol{display:flex;gap:10px;overflow-x:auto;padding:8px 12px 54px;margin:0;list-style:none;scrollbar-width:none} /* 54px = room for the sheet's collapsed handle */
  .nav .grp{display:contents}
  .nav .gh{display:none}
  .nav li.item{flex:0 0 auto}
  .nav .nb{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .nav .th{width:48px;height:60px;border-radius:5px;background:#fff;box-shadow:0 1px 2px rgba(40,34,24,.15);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font:600 10px var(--mono);color:var(--ink-55);letter-spacing:.04em}
  .nav .th.wide{width:60px;height:40px}
  .nav .th .scaled{box-shadow:none;border-radius:0}
  .nav .nb.on .th{box-shadow:0 0 0 2px var(--ink)}
  .nav .nl{font-size:10px;line-height:1.2;text-align:center;color:var(--ink-70);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav .nb.on .nl{color:var(--ink);font-weight:600}
  .nav .nl small{display:none} /* the sub-line is a desktop courtesy; the strip keeps one word */
  .nav .nl .pro{margin-left:2px}
  @media (min-width:1024px){
    .nav{order:1;width:var(--nav-w);border-top:0;border-right:1px solid var(--line);min-height:0;display:flex;flex-direction:column}
    .nav ol{flex-direction:column;gap:0;overflow-x:hidden;overflow-y:auto;padding:12px 10px 20px;flex:1}
    .nav .grp{display:block;margin-bottom:10px}
    .nav .gh{display:block;font:10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);padding:8px 8px 6px}
    .nav li.item{width:100%}
    .nav .nb{flex-direction:row;width:100%;gap:10px;padding:5px 8px;border-radius:8px}
    .nav .nb:hover{background:rgba(42,38,34,.05)}
    .nav .nb.on{background:rgba(42,38,34,.07)}
    .nav .th{width:38px;height:48px;flex:0 0 auto} .nav .th.wide{width:48px;height:32px}
    .nav .nl{font-size:12.5px;text-align:left;max-width:none;white-space:normal;flex:1}
    .nav .nl small{display:block;font-size:11px;color:var(--ink-55);font-weight:400}
  }

  /* ── BODY ── */
  .body{order:1;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px 28px;background:radial-gradient(120% 90% at 50% 0%,rgba(203,167,102,.10),transparent 60%)}
  @media (min-width:1024px){ .body{order:2;padding:22px 28px 40px} }
  .body-in{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;padding:7px 12px 7px 9px;border-radius:999px;background:rgba(42,38,34,.07);margin-bottom:12px;min-height:36px}
  .back:hover{background:rgba(42,38,34,.12)}
  .bar .playm{position:relative}
  .bar .playm .menu{left:0;transform:none}
  .pv{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--cream);border-bottom:1px solid var(--line)}
  .pv .word{font-size:12.5px;color:var(--ink-55)}
  .eyebrow{font:11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-55);margin:0}
  .title{font:400 24px/1.15 var(--display);margin:3px 0 4px}
  .lede{font-size:13.5px;color:var(--ink-70);margin:0;max-width:600px}
  .stage{background:rgba(42,38,34,.04);border-radius:12px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:300px}
  .stage .scaled{box-shadow:0 18px 26px -10px rgba(0,0,0,.32)}
  .stage .under{font-size:12px;color:var(--ink-55);margin:0;text-align:center}
  .inline-dd{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center}
  .inline-dd label{display:flex;align-items:center;gap:6px;font-size:13px}

  /* ⓘ */
  .tip{position:relative;display:inline-flex;vertical-align:middle}
  .tip>button{width:18px;height:18px;border-radius:50%;border:1px solid var(--ink-35);background:none;font-size:11px;line-height:1;color:var(--ink-70);cursor:pointer;padding:0}
  .tip .pop{display:none;position:absolute;left:0;top:24px;z-index:40;width:min(280px,78vw);padding:10px 12px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:400;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
  .tip.open .pop{display:block}
  .tip.r .pop{left:auto;right:0}
  .pro{display:inline-flex;align-items:center;gap:3px;font:600 10px var(--mono);letter-spacing:.08em;color:var(--gold);text-transform:uppercase;vertical-align:middle}
  .pro:before{content:"◆";font-size:10px}
  .saves{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mulberry);margin:4px 0 0}
  .drafted{font-size:12px;color:var(--ink-55);margin:4px 0 0}
  .dd{appearance:none;-webkit-appearance:none;padding:7px 28px 7px 10px;border:1px solid rgba(42,38,34,.15);border-radius:6px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%232a2622' stroke-width='1.5'/></svg>") no-repeat right 10px center;font-size:13px;min-height:36px;max-width:100%}
  .swatch{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block;vertical-align:middle}

  /* ── THEME GALLERY (samples) ── */
  .gal{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 10px;margin:0 -2px;list-style:none;overscroll-behavior-x:contain;scrollbar-width:thin}
  .gal li{flex:0 0 auto;scroll-snap-align:start}
  @media (min-width:1024px){ .gal{flex-wrap:wrap;overflow:visible} }
  .entry{display:block;border:0;background:none;padding:0;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .entry .set{display:flex;gap:7px;align-items:flex-start;position:relative;padding:6px;border-radius:12px;background:rgba(255,255,255,.55)}
  .entry.picked .set{box-shadow:0 0 0 2px var(--ink)}
  .entry .chk{display:none;position:absolute;right:-5px;top:-5px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;align-items:center;justify-content:center;z-index:2}
  .entry.picked .chk{display:flex}
  .entry .prints{display:flex;flex-direction:column;gap:6px}
  .entry .name{display:flex;align-items:center;gap:6px;margin:7px 0 0 6px;font-size:12.5px;font-weight:600}
  .sample-tag{display:inline-flex;align-items:center;gap:6px;font:10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-55);padding:4px 8px;border:1px dashed var(--ink-35);border-radius:999px}

  .scaled{position:relative;overflow:hidden;border-radius:6px;background:#fff;box-shadow:0 1px 2px rgba(40,34,24,.12)}
  .scaled>div{position:absolute;left:0;top:0;transform-origin:0 0}

  /* ── ADDRESS + QR body panels ── */
  .addr{background:rgba(255,255,255,.85);border-radius:12px;padding:20px 16px;box-shadow:0 1px 2px rgba(40,34,24,.06);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .addr .qr{width:200px;height:200px;background:#fff;padding:4px}
  .addr .qr.big{width:260px;height:260px}
  .addr .qr svg{display:block;width:100%;height:100%}
  .addr .url{font:400 22px/1.2 var(--display);margin:0;word-break:break-all}
  .addr .lbl{font-size:14px;font-weight:600;margin:0}
  .addr .note{font-size:12.5px;color:var(--ink-55);margin:0;max-width:420px}
  @media (min-width:640px){ .addr.row{flex-direction:row;text-align:left;justify-content:center;gap:28px} }

  /* ── EDITOR (right column / bottom sheet) ── */
  .ed{order:3;background:var(--cream)}
  .ed .ed-in{display:flex;flex-direction:column;gap:2px;padding:0 14px 26px}
  .ed .ed-h{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;font:400 18px var(--display)}
  .ed .ed-h .sz{font:12px var(--ui);color:var(--ink-55)}
  .ed .lede{font-size:12.5px;padding:0 14px 10px}
  @media (max-width:1023.98px){
    .ed{position:absolute;left:0;right:0;bottom:0;z-index:15;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -14px 30px -18px rgba(0,0,0,.35);transform:translateY(calc(100% - 46px));transition:transform .2s;max-height:72%;display:flex;flex-direction:column}
    .ed.open{transform:none}
    .ed .handle{display:flex;align-items:center;justify-content:space-between;gap:10px;height:46px;padding:0 16px;border:0;background:none;width:100%;font-size:13.5px;font-weight:600;cursor:pointer}
    .ed .handle .grab{position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:2px;background:var(--ink-35);transform:translateX(-50%)}
    .ed .handle .arr{color:var(--ink-55);font-size:12px}
    .ed .ed-h{display:none}
    .ed .scroll{overflow-y:auto;min-height:0}
  }
  @media (min-width:1024px){
    .ed{width:var(--ed-w);flex:0 0 auto;border-left:1px solid var(--line);min-height:0;display:flex;flex-direction:column}
    .ed .handle{display:none}
    .ed .scroll{overflow-y:auto;min-height:0;flex:1}
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:4px 0;border-bottom:1px solid var(--line-soft)}
  .row .l{display:flex;align-items:center;gap:6px;font-size:14px}
  .row .r{display:flex;align-items:center;gap:8px}
  .row .r .muted{font-size:12px;font-weight:500;color:var(--ink-55)}
  .sw2{position:relative;width:44px;height:24px;border-radius:999px;background:rgba(42,38,34,.2);flex:0 0 auto;transition:background .15s}
  .sw2:after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
  .tg{display:flex;flex-direction:column;border-bottom:1px solid var(--line-soft);padding:4px 0}
  .tg label.main{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer}
  .tg label.main .l{display:flex;align-items:center;gap:6px;font-size:14px}
  .tg input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}
  .tg input:checked~.sw2{background:var(--terracotta)} .tg input:checked~.sw2:after{transform:translateX(20px)}
  .tg input:disabled~.sw2{opacity:.4}
  .tg .sub{display:none;flex-direction:column;gap:7px;padding:0 0 10px 2px}
  .tg.on .sub{display:flex}
  .sum{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-70);margin:0}
  .sum span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sum a{white-space:nowrap;font-size:12px;font-weight:500}
  .sum.empty span{color:var(--ink-55);font-style:italic}
  .small{font-size:12px;color:var(--ink-55);margin:0}
  .fld{width:100%;padding:8px 10px;border:1px solid rgba(42,38,34,.15);border-radius:6px;background:#fff;font-size:14px}
  .with-dd{display:flex;gap:8px;align-items:center} .with-dd .fld{flex:1;min-width:0}
  .slug{display:flex;align-items:center;gap:8px}
  .slug .k{font:11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55)}
  .slug input{flex:1;min-width:0;font-family:var(--mono)}
  .btn{padding:8px 12px;border-radius:6px;border:1px solid rgba(42,38,34,.2);background:#fff;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:600}
  .btn.link{border:0;background:none;color:var(--mulberry);text-decoration:underline;text-underline-offset:2px;padding:6px 0}
  .save{display:flex;align-items:center;gap:10px;padding-top:12px;flex-wrap:wrap}
  .dl{display:flex;flex-direction:column;gap:8px;padding:8px 0}
  .dl .btn{text-align:left}
  .sect{font:10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);margin:14px 0 4px}
  .ed .status{font-size:12px;color:var(--ink-55);margin:6px 0 0}

  /* ═════════ THEMED PREVIEWS ═════════ */
  .pg{width:390px;height:760px;position:relative;overflow:hidden;background:var(--t-canvas);color:var(--t-ink);font-family:var(--t-body)}
  .pg .bg{position:absolute;inset:0;background:var(--t-poster,none) center/cover}
  .pg .scrim{position:absolute;inset:0;background:var(--t-scrim);opacity:var(--t-scrim-o)}
  .pg .in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 34px;gap:10px}
  .pg .l{font-family:var(--t-labels);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--t-muted);margin:0}
  .pg .m{font-size:34px;line-height:1;color:var(--t-heading);margin:6px 0 2px;letter-spacing:.06em}
  .pg .names{font-weight:400;font-size:52px;line-height:1.02;margin:0;color:var(--t-heading)}
  .pg .names .amp{display:block;font-family:var(--t-script,inherit);font-size:30px;line-height:1.1;color:var(--t-muted);font-style:italic}

function qrSvg({size=25, shape='square', pattern='classic', ink='#1A1A1A', centre=true, seed=7, mono=C.mono}={}){

  finder(0,0); finder(0,size-7); finder(size-7,0);
  const rx = pattern==='rounded'?0.32:0; const dots = pattern==='dots';
  const body = cells.map(([r,c])=> dots?`<circle cx="${c+.5}" cy="${r+.5}" r=".42"/>`:`<rect x="${c+.06}" y="${r+.06}" width=".88" height=".88" rx="${rx}"/>`).join('');
  const clip = shape==='circle' ? `<clipPath id="cq${seed}"><circle cx="${mid}" cy="${mid}" r="${mid}"/></clipPath>` : '';
  const g = shape==='circle' ? `<g clip-path="url(#cq${seed})" fill="${ink}">${body}</g>` : `<g fill="${ink}">${body}</g>`;
  const ctr = centre ? `<circle cx="${mid}" cy="${mid}" r="3.4" fill="#fff"/><text x="${mid}" y="${mid+1.05}" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="${mono.length>2?2.4:3.6}" font-style="italic" fill="${ink}">${mono}</text>` : '';
  return `<svg viewBox="-1 -1 ${size+2} ${size+2}" xmlns="http://www.w3.org/2000/svg"><rect x="-1" y="-1" width="${size+2}" height="${size+2}" fill="#fff"/>${clip}${g}${ctr}</svg>`;

function posterPreview(t,p){ return `<div class="poster t-${t.id}${t.foil?' foil':''}"><div class="bg"></div><div class="scrim"></div><div class="in"><p class="l">Welcome to the wedding of</p><h2 class="names">${amp(p)}</h2><p class="l">${p.date}</p><div class="q">${tinyQr}</div><p class="l">Scan for our Event Hub</p></div></div>`; }
function cardPreview(t,p,fmt='card-a5'){ const land = fmt!=='card-a5'; return `<div class="pr finer t-${t.id}" style="${land?'width:420px;height:252px':''}"><div class="frame"></div><div class="inbody" style="padding-top:${land?22:40}px"><p class="m">${p.mono}</p><h2 class="h">${p.a} &amp; ${p.b}</h2><div class="rule"></div><p class="when">${p.date}</p>${p.venue?`<p class="fine">${p.venue}</p>`:''}<p class="l" style="margin-top:8px">${p.url}</p></div>${land?'':`<div class="bqr">${tinyQr}</div><p class="scan">Scan for our Event Hub</p>`}</div>`; }
function a4Preview(kind){ const rows=(n)=>Array.from({length:n},(_,i)=>`<div class="rw"><i style="width:${40+(i*17)%55}%"></i><i style="width:60%"></i><i style="width:40%"></i><i style="width:50%"></i></div>`).join('');
  if(kind==='guest-registry') return `<div class="a4"><p class="t">Guest list registry</p><p class="s">${C.a} &amp; ${C.b} · ${C.date} · A to Z</p><div class="hd"><span>Name</span><span>Party</span><span>Table</span><span>RSVP</span></div>${rows(22)}</div>`;
  if(kind==='caterer') return `<div class="a4"><p class="t">Caterer meal counts</p><p class="s">Meals per table · dietary notes · confirmed guests</p><div class="hd"><span>Table</span><span>Meals</span><span>Notes</span><span>Total</span></div>${rows(14)}</div>`;
  if(kind==='qr-codes') return `<div class="a4"><p class="t">Guest QR codes</p><p class="s">Every guest’s own QR with their name · twelve to a page</p><div class="qrs">${Array.from({length:12},(_,i)=>`<div>${qrSvg({size:21,centre:false,seed:10+i})}</div>`).join('')}</div></div>`;
  if(kind==='seating-pack') return `<div class="a4"><p class="t">Table signs &amp; place cards</p><p class="s">A table directory · one sign per table with its QR · a place card per seated guest</p><div class="hd"><span>Table</span><span>Seats</span><span>Sign</span><span>Cards</span></div>${rows(12)}</div>`;
  if(kind==='seat-plan') return `<div class="a4 landscape"><p class="t">2D seat plan</p><p class="s">Your room from above — every table, every chair</p><div class="room">${Array.from({length:12},(_,i)=>`<i style="left:${18+(i%4)*64}px;top:${22+Math.floor(i/4)*54}px"></i>`).join('')}</div></div>`;
  return `<div class="a4"><p class="t">Event QR</p><p class="s">One code that opens your Event Hub</p><div class="big">${qrSvg({size:25,centre:true,seed:7})}</div><p class="s" style="text-align:center;margin-top:8px">${C.url}</p></div>`; }
function scaled(html,w,h,s,cls=''){ return `<div class="scaled ${cls}" style="width:${Math.round(w*s)}px;height:${Math.round(h*s)}px"><div style="width:${w}px;height:${h}px;transform:scale(${s})">${html}</div></div>`; }
/* never wider than the body's own width on a phone (16 px gutter + the stage's padding) */
function fit(html,w,h,maxW,maxH){ const body=document.getElementById('body'); const avail=(body?body.clientWidth:window.innerWidth)-64; const s=Math.min(Math.min(maxW,avail)/w,maxH/h,1.4); return scaled(html,w,h,s); }

/* ── NAVIGATOR — Details items, grouped, with Prints & Tickets folded in ── */
/* DECISION_LOG 2026-09-28 "DETAILS IS THE ONE FILL-IN AREA; STAGES ARE LOOK AND MOTION; TAP IS A SHORTCUT" */
const NAV = [
  { h:'Theme', items:[ {k:'theme',label:'Theme',sub:'Samples · Maria & Jose'} ] },
  { h:'Your event', items:[ {k:'names',label:'Names',sub:'Indalecio · Claire'}, {k:'date',label:'Date',sub:'December 18, 2026'}, {k:'venues',label:'Venues',sub:'Ceremony · reception'}, {k:'parents',label:'Parents & hosts',sub:'From the Guest list'} ] },
  { h:'Words', items:[ {k:'special-message',label:'Special message'}, {k:'thank-you',label:'Thank-you message',sub:'E-Gifts'}, {k:'opening-line',label:'Opening line'}, {k:'kindly-reply',label:'Kindly reply',sub:'Reply by · who'} ] },
  { h:'Love Story', items:[ {k:'love-story',label:'Love Story',sub:'5 stories'} ] },
  { h:'Schedule', items:[ {k:'schedule',label:'Schedule',sub:'The program'} ] },
  { h:'Your Event Hub', items:[ {k:'address',label:'Event Hub address'}, {k:'qr',label:'QR code'} ] },
  { h:'Invitation set', items:[ {k:'invitation',label:'The Invitation',sub:'5 × 7 in · A5'}, {k:'entourage',label:'The Entourage',sub:'5 × 7 in'}, {k:'details',label:'The Finer Details',sub:'5 × 7 in'}, {k:'menu',label:'The Menu',sub:'5 × 7 in'}, {k:'pass',label:'Event pass',sub:'Calling card · train · boarding pass'}, {k:'poster',label:'Welcome poster',sub:'A3'}, {k:'card',label:'Event card',sub:'A5 · index card'} ] },
  { h:'For the day', items:[ {k:'guest-registry',label:'Guest list registry',sub:'A4'}, {k:'qr-codes',label:'Guest QR codes',sub:'A4 · every guest'}, {k:'seat-plan',label:'2D seat plan'}, {k:'seating-pack',label:'Table signs & place cards',sub:'A4'}, {k:'caterer',label:'Caterer meal counts',sub:'A4'}, {k:'event-qr',label:'Event QR',sub:'PNG'} ] },
  { h:'Download', items:[ {k:'download',label:'Download the set',sub:'PDF · every pass'} ] },
];
/* the onboarding feel points at one theme (lib/invite-themes.ts `suggestedInviteTheme`) — drawn as a label, never pre-picked */
const SUGGESTED = 'vintage';
const ITEM = Object.fromEntries(NAV.flatMap(g=>g.items.map(i=>[i.k,i])));

/* ── state ── */
const P = new URLSearchParams(location.search);
const S = { theme:'house', item:P.get('item')||'theme', sheet:P.get('sheet')==='open', qr:{shape:'square',pattern:'classic',ink:'#1A1A1A'}, passFmt:'calling-card', invFmt:'inv-5x7', cardFmt:'card-a5' };

function tip(label,text,right=false){ return `<span class="tip${right?' r':''}"><button type="button" aria-label="About ${label}" onclick="event.stopPropagation();this.parentNode.classList.toggle('open')">i</button><span class="pop">${text}</span></span>`; }
const pro = ()=>`<span class="pro">Pro</span>`;
const savesNow = ()=>`<p class="saves">Saves immediately ${tip('Saves immediately','This is not part of your draft, so Apply, Undo and Restore do not cover it.')}</p>`;
const drafted = ()=>`<p class="drafted">Drafted — Undo steps it back, Apply puts it live.</p>`;
const thumbOf = (k)=>{ const t=T[S.theme]; switch(k){
  case 'theme': return scaled(pagePreview(t,SAMPLE),390,760,0.123);
  case 'names': case 'date': case 'opening-line': return scaled(pagePreview(t,C),390,760,0.123);
  case 'venues': case 'parents': case 'kindly-reply': return scaled(invitePreview(t,C),300,420,0.16);
  case 'special-message': case 'thank-you': case 'love-story': case 'schedule': return scaled(finerPreview(t,C),300,420,0.16);
  case 'address': return `<span class="mono" style="font-size:8px;letter-spacing:0;text-align:center;line-height:1.3;padding:3px">setnayan.com/<br>${C.slug}</span>`;
  case 'qr': return `<div style="width:34px;height:34px">${qrSvg(S.qr)}</div>`;
  case 'download': return `<span style="font-size:18px">⤓</span>`;
  case 'invitation': return scaled(invitePreview(t,C),300,420,0.16);
  case 'entourage': return scaled(rowsPreview(t,C,'The Entourage',['Maid of Honour','Best Man']),300,420,0.16);
  case 'details': return scaled(finerPreview(t,C),300,420,0.16);
  case 'menu': return scaled(rowsPreview(t,C,'The Menu',['Starters','Mains']),300,420,0.16);
  case 'pass': { const p=passPreview(t,C,S.passFmt); return scaled(p.html,p.w,p.h,48/p.w); }
  case 'poster': return scaled(posterPreview(t,C),297,420,0.16);
  case 'card': return scaled(cardPreview(t,C,'card-a5'),300,420,0.16);
  case 'seat-plan': return scaled(a4Preview('seat-plan'),297,210,0.19);
  default: return scaled(a4Preview(k),210,297,0.2); } };
const isWide = (k)=> k==='pass'||k==='seat-plan';

function navHtml(){ return `<nav class="nav" aria-label="Details — what to edit"><ol>${NAV.map(g=>`<li class="grp"><p class="gh">${g.h}</p>${g.items.map(i=>`<li class="item"><button type="button" class="nb${i.k===S.item?' on':''}" data-item="${i.k}" aria-pressed="${i.k===S.item}"><span class="th${isWide(i.k)?' wide':''}" data-thumb="${i.k}">${thumbOf(i.k)}</span><span class="nl">${i.label}${i.k==='theme'&&T[S.theme].tier==='pro'?pro():''}${i.sub?`<small>${i.sub}</small>`:''}</span></button></li>`).join('')}</li>`).join('')}</ol></nav>`; }

/* ── BODY per item ── */
function head(eyebrow,title,lede){ return `<header><a class="back" href="${location.pathname}?view=stage" aria-label="Back to the Invitation stage">← Invitation</a><p class="eyebrow">${eyebrow}</p><p class="title">${title}</p>${lede?`<p class="lede">${lede}</p>`:''}</header>`; }
/* a fact's body: the places it appears, small — the hero, then the print it feeds */
function feeds(t,parts){ return `<div class="stage" style="flex-direction:row;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:18px">${parts.map(([html,w,h,s,cap])=>`<figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px">${scaled(html,w,h,s)}<figcaption class="small">${cap}</figcaption></figure>`).join('')}</div>`; }
function bodyHtml(){ const t=T[S.theme], k=S.item; switch(k){
  case 'names': return head('Your event','Names','Where your names appear — the hero, every print, every pass.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Hero'],[invitePreview(t,C),300,420,0.62,'The Invitation'],[passPreview(t,C,S.passFmt).html,passPreview(t,C,S.passFmt).w,passPreview(t,C,S.passFmt).h,0.5,'Event pass']]);
  case 'date': return head('Your event','Date','The day on the hero and the countdown; the ceremony time comes from your Schedule.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Hero'],[invitePreview(t,C),300,420,0.62,'The Invitation']]);
  case 'venues': return head('Your event','Venues','The ceremony and the reception, on the invitation and the event card.') + feeds(t,[[invitePreview(t,C),300,420,0.62,'The Invitation'],[cardPreview(t,C),300,420,0.62,'Event card']]);
  case 'parents': return head('Your event','Parents & hosts','Parents on the invitation, read from the Guest list roles; hosts are the accounts guests reply to.') + feeds(t,[[invitePreview(t,C),300,420,0.75,'The Invitation']]);
  case 'special-message': return head('Words','Special message','Your closing words — on every scene that shows them, and on The Finer Details.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Scene · Everything else'],[finerPreview(t,C),300,420,0.62,'The Finer Details']]);
  case 'thank-you': return head('Words','Thank-you message','The message on your E-Gifts page and The Finer Details — one message.') + feeds(t,[[finerPreview(t,C),300,420,0.75,'The Finer Details']]);
  case 'opening-line': return head('Words','Opening line','The first line on the hero and on the invitation.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Hero'],[invitePreview(t,C),300,420,0.62,'The Invitation']]);
  case 'kindly-reply': return head('Words','Kindly reply','Who guests reply to, and by when — on the invitation and the RSVP page.') + feeds(t,[[invitePreview(t,C),300,420,0.75,'The Invitation']]);
  case 'love-story': return head('Love Story','Love Story','Your stories on the Event Hub, and a short excerpt on The Finer Details.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Scene · Story'],[finerPreview(t,C),300,420,0.62,'The Finer Details']]);
  case 'schedule': return head('Schedule','Schedule','The moments guests can see — on the Event Hub, the invitation’s ceremony time and The Finer Details.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Scene · The day'],[finerPreview(t,C),300,420,0.62,'The Finer Details']]);
  case 'theme': return head('Theme · the first choice',`Theme`,`Each theme on the sample wedding, <b>Maria &amp; Jose</b> — its page and its prints. Tap one: your own page and every print below wear it.`) +
    `<p><span class="sample-tag">Samples · Maria &amp; Jose</span></p><ul class="gal" aria-label="Themes">${THEMES.map(x=>{ const ps=passPreview(x,SAMPLE,'calling-card'); return `<li><button type="button" class="entry${x.id===S.theme?' picked':''}" data-pick="${x.id}" aria-pressed="${x.id===S.theme}"><div class="set"><span class="chk">✓</span>${scaled(pagePreview(x,SAMPLE),390,760,0.35)}<div class="prints">${scaled(invitePreview(x,SAMPLE),300,420,0.25)}${scaled(finerPreview(x,SAMPLE),300,420,0.25)}${scaled(ps.html,ps.w,ps.h,75/ps.w)}</div></div><span class="name">${x.name}${x.tier==='pro'?pro():''}${x.id===SUGGESTED?`<span class="sample-tag" style="margin-left:4px;padding:2px 7px;font-size:9.5px">Suggested for you</span>`:''}</span></button></li>`; }).join('')}</ul>`;
  case 'address': return head('Your Event Hub · address','Event Hub address','Every printed piece and every guest pass carries this address and its QR.') +
    `<div class="addr row"><div class="qr">${qrSvg(S.qr)}</div><div><p class="lbl">Your Event Hub address</p><p class="url" id="url-line">${C.url}</p><p class="note" style="margin-top:8px">Guests scan the QR to open your Event Hub. Its shape, pattern and colour are set under QR code.</p></div></div>`;
  case 'qr': return head('Your Event Hub · QR code',`QR code`,`The code every print and pass carries. Your logo in the centre with Event Hub Pro.`) +
    `<div class="addr"><div class="qr big" id="bigqr">${qrSvg(S.qr)}</div><div class="inline-dd">
      <label>Shape <select class="dd" data-qr="shape" aria-label="QR shape"><option value="square">Square</option><option value="circle">Circle</option></select></label>
      <label>Pattern <select class="dd" data-qr="pattern" aria-label="QR pattern"><option value="classic">Classic</option><option value="rounded">Rounded</option><option value="dots">Dots</option></select></label>
      <label>Colour <i class="swatch" id="qrsw" style="background:${S.qr.ink}"></i><select class="dd" data-qr="ink" aria-label="QR colour"><option value="#1A1A1A">Ink</option><option value="#4a1f2a">Mood Board colour 1 · #4a1f2a</option><option value="#6b7a4a">Mood Board colour 2 · #6b7a4a</option><option value="#7a3b3b">Mood Board colour 5 · #7a3b3b</option></select></label></div>
      <p class="note">${C.url}</p></div>`;
  case 'download': return head('Invitation set','Download the set',`Invitation cards, passes, a welcome poster and an event card, drawn in <b>${t.name}</b>. Print uses your <b>ceremony</b> time from your schedule.`) +
    `<div class="stage" style="flex-direction:row;flex-wrap:wrap;gap:10px;align-items:flex-end">${scaled(invitePreview(t,C),300,420,0.42)}${scaled(rowsPreview(t,C,'The Entourage',['Maid of Honour','Best Man','Principal Sponsors']),300,420,0.42)}${scaled(finerPreview(t,C),300,420,0.42)}${scaled(rowsPreview(t,C,'The Menu',['Starters','Mains','Dessert']),300,420,0.42)}${scaled(posterPreview(t,C),297,420,0.42)}${scaled(cardPreview(t,C),300,420,0.42)}${(()=>{const p=passPreview(t,C,S.passFmt);return scaled(p.html,p.w,p.h,150/p.w)})()}<p class="under" style="width:100%">Classic prints are free and print-ready — 3 mm bleed and crop marks.${t.tier==='pro'?` With Event Hub Pro they print in ${t.name} too.`:''}</p></div>`;
  case 'invitation': return head('Invitation set','The Invitation',`${INV_FORMATS.find(f=>f[0]===S.invFmt)[1]} · your opening line, your parents and “Kindly reply”.`) + `<div class="stage" id="stage">${fit(invitePreview(t,C,S.invFmt),300,S.invFmt==='inv-a5'?426:420,560,520)}<p class="under">Change a switch and save — the card redraws.</p></div>`;
  case 'entourage': return head('Invitation set','The Entourage','5 × 7 in · your wedding party, read from the Guest list roles.') + `<div class="stage">${fit(rowsPreview(t,C,'The Entourage',['Maid of Honour & Best Man','Principal Sponsors','Bride’s crew & Groom’s crew','Bearers & flower girl']),300,420,560,520)}</div>`;
  case 'details': return head('Invitation set','The Finer Details','5 × 7 in · E-Gifts, the thank-you message, your Love Story, the program, your colours and your special message.') + `<div class="stage" id="stage">${fit(finerPreview(t,C),300,420,560,520)}<p class="under">Change a switch and save — the card redraws.</p></div>`;
  case 'menu': return head('Invitation set','The Menu','5 × 7 in · the courses, from your caterer or typed in.') + `<div class="stage">${fit(rowsPreview(t,C,'The Menu',['Starters','Mains','Dessert','Drinks']),300,420,560,520)}</div>`;
  case 'pass': { const f=PASS_FORMATS.find(x=>x[0]===S.passFmt); const p=passPreview(t,C,S.passFmt); return head('Invitation set','Event pass',`${f[1]} · ${f[2]} × ${f[3]} mm · one per guest, with their name and their own QR.`) + `<div class="stage" id="stage">${fit(p.html,p.w,p.h,600,360)}<p class="under">Passes print ${f[1]} size, ganged on A4 with cut lines.</p></div>`; }
  case 'poster': return head('Invitation set','Welcome poster','A3 · 297 × 420 mm · for the door or the easel.') + `<div class="stage">${fit(posterPreview(t,C),297,420,560,520)}</div>`;
  case 'card': { const f=CARD_FORMATS.find(x=>x[0]===S.cardFmt); const land=S.cardFmt!=='card-a5'; return head('Invitation set','Event card',`${f[1]} · the essentials on one card.`) + `<div class="stage" id="stage">${fit(cardPreview(t,C,S.cardFmt),land?420:300,land?252:420,560,520)}</div>`; }
  case 'guest-registry': return head('For the day','Guest list registry','A4 · the reception desk list — A to Z, party size, table, RSVP, a box to tick and a line to sign.') + `<div class="stage">${fit(a4Preview('guest-registry'),210,297,520,560)}</div>`;
  case 'qr-codes': return head('For the day','Guest QR codes','A4 · every guest’s own QR with their name, twelve to a page.') + `<div class="stage">${fit(a4Preview('qr-codes'),210,297,520,560)}</div>`;
  case 'seat-plan': return head('For the day','2D seat plan','Your room from above — every table, every chair, and who sits where.') + `<div class="stage">${fit(a4Preview('seat-plan'),297,210,600,440)}</div>`;
  case 'seating-pack': return head('For the day','Table signs & place cards','A4 · a table directory, one sign per table with its QR, and a place card for every seated guest.') + `<div class="stage">${fit(a4Preview('seating-pack'),210,297,520,560)}</div>`;
  case 'caterer': return head('For the day','Caterer meal counts','A4 · meals per table and every dietary note, for confirmed guests.') + `<div class="stage">${fit(a4Preview('caterer'),210,297,520,560)}</div>`;
  default: return head('For the day','Event QR','One code that opens your Event Hub — for a welcome sign, a table card or a screen.') + `<div class="stage">${fit(a4Preview('event-qr'),210,297,520,560)}</div>`; } }

/* ── EDITOR per item — real labels; a text-carrying switch shows its field inline, edited in place ── */
function tg(name,label,on,{tipText=null,disabled=false,sub=null}={}){ return `<div class="tg${on?' on':''}" data-include="${name}"><label class="main"><span class="l">${label}${tipText?' '+tip(label,tipText,true):''}</span><input type="checkbox" role="switch" ${on?'checked':''} ${disabled?'disabled':''} onchange="this.closest('.tg').classList.toggle('on',this.checked)"/><span class="sw2"></span></label>${sub?`<div class="sub">${sub}</div>`:''}</div>`; }
/* NO "go edit it over there" links (owner 2026-09-28): the SAME field sits here, editable in place. */
const inl = (text,placeholder,rows=0)=> rows ? `<textarea class="fld" rows="${rows}" placeholder="${placeholder}">${text}</textarea>` : `<input class="fld" type="text" value="${text}" placeholder="${placeholder}"/>`;
const parentsInl = ()=>`<div style="display:flex;flex-direction:column;gap:6px">${['Atty. Eufrocina M. Sacdalan-Casasola','Mrs. Milagros Buanhog','Peregrino Buanhog'].map(x=>`<input class="fld" type="text" value="${x}" aria-label="Parent"/>`).join('')}<button type="button" class="btn link" style="align-self:flex-start">+ Add a parent</button></div>`;
const momentsInl = ()=>[['Ceremony','3:00 PM',true],['Cocktails','6:00 PM',true],['Reception','7:00 PM',true],['Vendor call time','12:00 PM',false]].map(([l,tm,g])=>`<div class="tg${g?' on':''}" style="padding:0"><label class="main" style="min-height:36px"><span class="l" style="font-size:13px">${l} <span style="font-size:12px;color:var(--ink-55)">${tm}</span></span><input type="checkbox" role="switch" ${g?'checked':''} onchange="this.closest('.tg').classList.toggle('on',this.checked)"/><span class="sw2" style="transform:scale(.85)"></span></label></div>`).join('');
const coloursInl = ()=>`<div style="display:flex;gap:6px;align-items:center">${C.dots.map(d=>`<input type="color" value="${d}" aria-label="Colour" style="width:28px;height:28px;border:1px solid rgba(0,0,0,.15);border-radius:50%;padding:0;background:none"/>`).join('')}</div>`;
const saveRow = (label='Save')=>`<div class="save"><button type="button" class="btn primary">${label}</button><span class="small">The card redraws.</span></div>`;
const dlSet = (t)=>`<div class="dl"><button type="button" class="btn primary">Whole set · Classic (PDF)</button><button type="button" class="btn">Every guest’s pass · Classic</button>${t.tier==='pro'?`<button type="button" class="btn">${pro()} Whole set · ${t.name} (PDF)</button><button type="button" class="btn">${pro()} Every guest’s pass · ${t.name}</button><button type="button" class="btn link">Sample sheet · ${t.name} (JPG)</button>`:''}</div>`;
function edHead(title,size){ return `<p class="ed-h">${title}${size?`<span class="sz">${size}</span>`:''}</p>`; }
const field = (label,value,{type='text',rows=0,placeholder='',tipText=null}={})=>`<div class="tg on" style="border:0"><label class="main" style="min-height:36px;cursor:default"><span class="l">${label}${tipText?' '+tip(label,tipText,true):''}</span></label><div class="sub" style="padding-top:0">${rows?`<textarea class="fld" rows="${rows}" placeholder="${placeholder}">${value}</textarea>`:`<input class="fld" type="${type}" value="${value}" placeholder="${placeholder}"/>`}</div></div>`;
function editorHtml(){ const t=T[S.theme], k=S.item, item=ITEM[k]; let inner=''; switch(k){
  case 'names': inner = edHead('Names') + `<div class="ed-in">${field('Bride',C.b)}${field('Groom',C.a)}${field('Monogram',C.mono,{tipText:'Two or three letters. Its look is drawn under Logo.'})}${saveRow('Save')}</div>`; break;

      ${tg('inc_thank_you','E-Gifts — thank-you message',true,{sub:inl('Thank you for celebrating with us — every gift helps our new home begin.','Your thank-you to gift-givers…',2)})}
      ${tg('inc_love_story','Love Story',true,{tipText:'A short excerpt of your story on the Finer Details card.',sub:inl('','Write the short excerpt for the card…',3)})}

      <div class="row"><span class="l">Event Hub QR code</span><span class="r"><span class="muted">Always printed</span></span></div>
      ${tg('inc_nfc','Add an NFC sticker spot',false,{tipText:'Use 25 mm round NFC stickers (NTAG213/215). Write your Event Hub link to them first. The spot prints beside the QR.'})}

function bar(){ const tools=(a)=>a.map(([i,l,on,hide])=>`<button type="button" class="tool${on?' on':''}${hide?' hide-sm':''}"><i>${i}</i>${l}</button>`).join('');
  const here = S.view==='stage' ? 'Invitation' : 'Details';
  return `<header class="bar">${tools([['✕','Exit']])}
    <div class="playm" id="playm"><button type="button" class="tool" onclick="event.stopPropagation();document.getElementById('playm').classList.toggle('open')"><i>▷</i>Play</button>
      <div class="menu" role="menu"><button type="button">Play this scene</button><button type="button" onclick="location.href='${location.pathname}?view=preview'">Preview the whole stage</button></div></div>
    ${tools([['+','Add']])}<span class="sep"></span>
    <div class="place" id="place"><button type="button" class="page-pick" onclick="event.stopPropagation();document.getElementById('place').classList.toggle('open')">${here} <span style="font-size:11px">▾</span></button>
      <div class="menu" role="menu"><p class="grp">Stages</p>${['Save the Date','Invitation','The Day','Post Event'].map(p=>`<button type="button" class="${p===here?'on':''}" onclick="location.href='${location.pathname}?view=stage'">${p}${p===here?'<span style="font-size:11px">✓</span>':''}</button>`).join('')}<p class="grp">Pages</p>${['Details','Logo','Hero','Reveal','Love Story','RSVP'].map(p=>`<button type="button" class="${p===here?'on':''}" onclick="location.href='${location.pathname}?view=page&item=theme'">${p}${p===here?'<span style="font-size:11px">✓</span>':''}</button>`).join('')}</div></div>
    ${tools([['▣','Scenes',true],['▭','View',false,true],['⋯','More']])}<button type="button" class="word">Live now</button><button type="button" class="word">↺ Restore</button>
    <button type="button" class="apply" id="apply">Apply<span class="dia" id="apply-dia" ${T[S.theme].tier==='pro'?'':'hidden'}>◆</span></button></header>`; }

function renderPage(){ document.getElementById('app').innerHTML = `<div class="maker">${bar()}<div class="work">${navHtml()}<main class="body" id="body"><div class="body-in">${bodyHtml()}</div></main>${editorHtml()}</div></div>`; wire(); }

/* ── THE SHORTCUT — on a stage, tapping the special message opens the SAME Details field in the right panel ── */
function renderStage(){ const t=T[S.theme]; S.item='special-message'; S.sheet=true; S.view='stage';
  const scenes=['Hero','Countdown','The day','Story','Everything else'];
  const canvas=`<div class="pg t-${t.id}${t.foil?' foil':''}" style="height:1240px"><div class="bg"></div><div class="scrim"></div><div class="in" style="height:760px"><p class="l">Together with their families</p><p class="m">${C.mono}</p><h1 class="names">${amp(C)}</h1><p class="l">invite you to celebrate their wedding</p><p class="date">${C.dateShort}</p><p class="time">${C.time}</p><div class="rule"></div><p class="link">${C.short}</p><span class="btn2">Find your seat</span></div>
    <div class="in" style="height:480px;justify-content:flex-start;padding-top:60px"><p class="l">Everything else</p><h2 class="names" style="font-size:30px">See you soon.</h2><div class="rule"></div><p style="font-size:18px;line-height:1.5;max-width:300px;margin:0;outline:2px solid #2a2622;outline-offset:8px;border-radius:2px;position:relative">We can’t wait to celebrate with you on December 18.<span style="position:absolute;right:-10px;top:-30px;background:#2a2622;color:#fff;font:600 10px var(--ui);letter-spacing:.04em;padding:3px 7px;border-radius:999px">Special message · from Details</span></p></div></div>`;
  const nav=`<nav class="nav" aria-label="Scenes"><ol>${scenes.map((s,i)=>`<li class="item"><button type="button" class="nb${i===4?' on':''}"><span class="th"><span class="mono" style="font-size:9px">${i+1}</span></span><span class="nl">${s}</span></button></li>`).join('')}</ol></nav>`;
  const ed=`<aside class="ed open" aria-label="Special message — edit"><button type="button" class="handle" id="handle"><span class="grab"></span><span>Edit · Special message</span><span class="arr">▾</span></button><div class="scroll">${edHead('Special message')}<div class="ed-in"><p class="small" style="margin:6px 0 2px">The same field as Details → Words — saved once, shown everywhere. ${tip('shortcut','Tap is a shortcut: the words are typed once, in Details → Words. Saving here saves there.',true)}</p>${field('Your closing words to guests','We can’t wait to celebrate with you on December 18.',{rows:4})}<p class="small">Every scene that shows your message follows this.</p>${saveRow('Save')}${drafted()}</div></div></aside>`;
  document.getElementById('app').innerHTML = `<div class="maker">${bar()}<div class="work">${nav}<main class="body" id="body" style="padding:12px;display:flex;justify-content:center;align-items:flex-start"><div style="width:min(390px,100%);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(40,34,24,.06),0 28px 54px -30px rgba(30,26,18,.5)">${scaled(canvas,390,1240,Math.min(1,(Math.min(390,window.innerWidth-24))/390))}</div></main>${ed}</div></div>`; wire(); }
function rerender(){ const b=document.getElementById('body'); const y=b?b.scrollTop:0; renderPage(); const nb=document.getElementById('body'); if(nb) nb.scrollTop=y; }
function wire(){
  document.querySelectorAll('[data-item]').forEach(b=>b.addEventListener('click',()=>{ S.item=b.dataset.item; S.sheet=false; renderPage(); const on=document.querySelector('.nav .nb.on'); if(on) on.scrollIntoView({block:'nearest',inline:'center'}); }));
  document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.pick)));
  const dd=document.getElementById('theme-dd'); if(dd) dd.addEventListener('change',()=>pick(dd.value));
  document.querySelectorAll('[data-qr]').forEach(sel=>{ sel.value=S.qr[sel.dataset.qr]; sel.addEventListener('change',()=>{ S.qr[sel.dataset.qr]=sel.value; document.getElementById('bigqr').innerHTML=qrSvg(S.qr); document.getElementById('qrsw').style.background=S.qr.ink; document.querySelector('[data-thumb="qr"]').innerHTML=thumbOf('qr'); }); });
  document.querySelectorAll('[data-fmt]').forEach(sel=>sel.addEventListener('change',()=>{ ({inv:'invFmt',pass:'passFmt',card:'cardFmt'})[sel.dataset.fmt] && (S[({inv:'invFmt',pass:'passFmt',card:'cardFmt'})[sel.dataset.fmt]]=sel.value); S.sheet=true; rerender(); }));
  const h=document.getElementById('handle'); if(h) h.addEventListener('click',()=>{ S.sheet=!S.sheet; document.querySelector('.ed').classList.toggle('open',S.sheet); h.querySelector('.arr').textContent=S.sheet?'▾':'▴'; });
  document.addEventListener('click',(e)=>{ if(!e.target.closest('.tip')) document.querySelectorAll('.tip.open').forEach(x=>x.classList.remove('open')); if(!e.target.closest('#place')) document.getElementById('place')?.classList.remove('open'); if(!e.target.closest('#playm')) document.getElementById('playm')?.classList.remove('open'); });
}
/* A pick is a DRAFT edit: the sample entry is marked, every thumbnail and print of the couple's own wears it, Apply shows ◆ for a Pro theme. */
function pick(id){ if(id===S.theme) return; S.theme=id; rerender(); }

/* ── PREVIEW THE WHOLE STAGE — the couple's page as guests meet it, with one way back ── */
function renderPreview(){ const t=T[S.theme]; const w=Math.min(390,window.innerWidth); const sc=w/390;
  const canvas=`<div class="pg t-${t.id}${t.foil?' foil':''}" style="height:1240px"><div class="bg"></div><div class="scrim"></div><div class="in" style="height:760px"><p class="l">Together with their families</p><p class="m">${C.mono}</p><h1 class="names">${amp(C)}</h1><p class="l">invite you to celebrate their wedding</p><p class="date">${C.dateShort}</p><p class="time">${C.time}</p><div class="rule"></div><p class="link">${C.short}</p><span class="btn2">Find your seat</span></div><div class="in" style="height:480px;justify-content:flex-start;padding-top:60px"><p class="l">Everything else</p><h2 class="names" style="font-size:30px">See you soon.</h2><div class="rule"></div><p style="font-size:18px;line-height:1.5;max-width:300px;margin:0">We can’t wait to celebrate with you on December 18.</p></div></div>`;
  document.body.style.overflow='auto';
  document.getElementById('app').innerHTML = `<div class="pv"><a class="back" href="${location.pathname}?view=stage" style="margin:0">← Back to the Maker</a><span class="word">Previewing · Invitation</span></div><div style="display:flex;justify-content:center;background:${t.canvas}"><div style="position:relative;overflow:hidden;width:${Math.round(390*sc)}px;height:${Math.round(1240*sc)}px"><div style="position:absolute;left:0;top:0;width:390px;height:1240px;transform:scale(${sc});transform-origin:0 0">${canvas}</div></div></div>`; }
function renderShell(){
  const items=[['theme','Theme'],['names','Names'],['date','Date'],['special-message','Special message'],['kindly-reply','Kindly reply'],['love-story','Love Story'],['schedule','Schedule'],['qr','QR code'],['address','Address'],['invitation','The Invitation'],['details','The Finer Details'],['pass','Event pass'],['download','Download the set']];
  let cur={p375:'theme',p390:'special-message',desk:'theme'};
  const src=(item,sheet)=>`${location.pathname}?view=page&item=${item}${sheet?'&sheet=open':''}`;
  const seg=(name,val)=>`<div class="seg">${items.map(([k,l])=>`<label><input type="radio" name="${name}" value="${k}" ${k===val?'checked':''}/><span>${l}</span></label>`).join('')}</div>`;
  document.getElementById('app').innerHTML = `<div class="shell">
    <h1>Details — the one fill-in area · navigator, preview, editor</h1>
    <p class="sub">The Maker’s own three-column pattern, now for Details (DECISION_LOG 2026-09-28 “Details is the one fill-in area; stages are look and motion; tap is a shortcut”). <b>Left</b>, a navigator grouped <b>Your event</b> (Names · Date · Venues · Parents &amp; hosts) · <b>Words</b> (Special message · Thank-you · Opening line · Kindly reply) · <b>Love Story</b> · <b>Schedule</b> · <b>Theme</b> first (Details opens on it) · … · <b>Your Event Hub</b> (Address · QR code) · <b>Invitation set</b> (every print piece) · <b>For the day</b> (the free prints) · <b>Download the set</b>. <b>Body</b>, the visual of the picked item — for a fact, the places it appears (the hero, the print it feeds). <b>Right</b>, the fields. On a phone the navigator is the thumbnail strip under the body (the scene navigator’s own shape) and the editor is a bottom sheet — tap its handle. The Theme item shows each theme as a clean template on the sample wedding <b>Maria &amp; Jose</b> (page · The Invitation · The Finer Details · a pass) with <i>Suggested for you</i> on the theme the onboarding feel points at; everything else is the couple’s own (Indalecio &amp; Claire · cale-ice). The page dropdown (tap “Details ▾”) no longer lists Prints &amp; Tickets.</p>
    <div class="frames">
      <div class="frame"><p class="cap">375 · phone</p>${seg('p375',cur.p375)}<iframe id="f375" src="${src(cur.p375)}" width="375" height="812" title="375" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · phone · sheet open</p>${seg('p390',cur.p390)}<iframe id="f390" src="${src(cur.p390,true)}" width="390" height="844" title="390" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · the shortcut — a stage, special message tapped</p><p class="small" style="height:36px;margin-top:8px">Same field, opened from the scene.</p><iframe src="${location.pathname}?view=stage" width="390" height="844" title="shortcut" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Play → Preview the whole stage</p><p class="small" style="height:36px;margin-top:8px">One way back, top-left.</p><iframe src="${location.pathname}?view=preview" width="390" height="844" title="preview" style="margin-top:8px"></iframe></div>
      <div class="frame desk"><p class="cap">Desktop · 1280</p>${seg('desk',cur.desk)}<iframe id="fdesk" src="${src(cur.desk)}" width="1280" height="820" title="desktop" style="margin-top:8px"></iframe></div>
    </div>
    <ul class="notes">
      <li><b>The way back</b> (recommended, shown in every frame): a <b>← Invitation</b> chip at the top-left of the Details body — it names the stage you left, so it reads as “back”, not as another menu; it is the same on phone and desktop. The place picker (“Details ▾”) is kept as the second way and now lists <b>Stages</b> (Save the Date · Invitation · The Day · Post Event) above <b>Pages</b>, with the current one ticked, so it reads as a switcher.</li>
      <li><b>Play</b> opens a two-item menu — <i>Play this scene</i> · <i>Preview the whole stage</i>; the preview (fourth frame) is the couple’s page with one <b>← Back to the Maker</b> control at the top-left.</li>
      <li><b>Download the set</b> is the last group, on its own — it is the set’s output, after every piece; nothing else in it to edit.</li>
      <li><b>No “go edit it over there” links, anywhere</b>: on The Invitation and The Finer Details each include switch that carries text shows the SAME field inline under the switch, editable in place — an empty one is a field with a placeholder (see Love Story on The Finer Details); parents are editable names; the gift line, the thank-you, the special message, the moments and the colours all sit right there. One value, several places to type it.</li>
      <li><b>The shortcut</b> (third frame): on a stage, tapping the special message opens the same Details field in the sheet — nothing to follow, nowhere else to go.</li>
      <li><b>QR</b>: Shape · Pattern · Colour are dropdowns under the code in the body (it is visual); the right editor keeps the logo line, Saves immediately and Save image.</li>
      <li><b>◆ PRO</b> is information, never a lock: a free couple picks a Pro theme, the draft wears it, Apply gains a ◆ and names it.</li>
      <li><b>Not drawn from real data</b>: the venue addresses, the reply-by date, the Love Story titles and the Schedule moments (placeholders shaped like the real fields), the couple’s Entourage and Menu names (wireframe bars), the sample’s venue and time (its public page shows none), the suggested theme (needs the couple’s onboarding feel), and the invitation’s photo (the theme’s still stands in for the couple’s hero photo; Classic stays paper).</li>
    </ul></div>`;
  document.querySelectorAll('.shell input[type=radio]').forEach(r=>r.addEventListener('change',()=>{ const map={p375:['f375',false],p390:['f390',true],desk:['fdesk',false]}; const [id,sheet]=map[r.name]; document.getElementById(id).src=src(r.value,sheet); }));
}

window.addEventListener('error',(e)=>document.documentElement.setAttribute('data-err',`${e.message} @${e.lineno}:${e.colno}`));
try { if(P.get('view')==='page') renderPage(); else if(P.get('view')==='stage') renderStage(); else if(P.get('view')==='preview') renderPreview(); else renderShell(); document.documentElement.setAttribute('data-rendered','1'); } catch(e){ document.documentElement.setAttribute('data-err',String(e.stack||e)); }
window.addEventListener('load',()=>{ const d=document.documentElement; d.setAttribute('data-clientw',d.clientWidth); d.setAttribute('data-scrollw',d.scrollWidth); const b=document.getElementById('body'); if(b){ d.setAttribute('data-body-clientw',b.clientWidth); d.setAttribute('data-body-scrollw',b.scrollWidth); } });
</script>
</body>
</html>
