<title>Details — navigator · preview · editor, with Prints &amp; Tickets folded in · prototype 2026-09-28</title>
<!--
  PROTOTYPE · Event Hub Maker → Details as the Maker's own three-column pattern.
    LEFT  · a navigator of the Details items, grouped, with thumbnails (the scene navigator's shape)
    BODY  · the visual preview of the picked item
    RIGHT · the editor for the picked item (typing + switches)
  Prints & Tickets is FOLDED INTO Details (owner 2026-09-28: "1 fold prints and tickets into details").
  The Theme item's gallery shows CLEAN TEMPLATES on the sample wedding Maria & Jose (owner: "we will show a
  clean preview of each website … as sample template with the prints, with the sample event hub").
  Text-carrying switches show the SAME field inline, editable in place — no link-outs (DECISION_LOG "NO "GO EDIT IT OVER THERE" LINKS" + "EVERY TEXT IS TYPED
  WHERE IT LIVES; THE DETAILS CHECKLIST ONLY SWITCHES IT ON"); only Opening line and Kindly reply are typed here.

  Sources (origin/main, never ~): lib/invite-themes.ts (ten themes) · lib/print-pieces.ts (pieces, sizes,
  PRINT_FORMATS) · lib/free-prints.ts (For the day) · launch/_components/maker-details.tsx, maker-prints.tsx,
  qr-look-controls.tsx (lib/qr-look.ts), invitation/_components/slug-field.tsx, website/editor/_components/
  editor-shell.tsx (navigator: phone = horizontal strip under the canvas; lg = left column) ·
  lib/maker-made-once-pages.ts (page dropdown). Sample content read from the live public page /maria-and-jose.

  No query → the shell (frames + item switcher). ?view=page&item=<key>&sheet=open → the page itself.
-->

<style>

  .btn.big{padding:13px 26px;font-size:15px}

/* ── a deterministic fake QR ── */
function qrSvg({size=25, shape='square', pattern='classic', ink='#1A1A1A', centre=true, seed=7, mono=C.mono}={}){
  let x=seed; const rnd=()=>{x=(x*1103515245+12345)&0x7fffffff; return x/0x7fffffff};
  const cells=[]; const finder=(r,c)=>{ for(let i=0;i<7;i++)for(let j=0;j<7;j++){const ring=(i===0||i===6||j===0||j===6); const core=(i>=2&&i<=4&&j>=2&&j<=4); if(ring||core) cells.push([r+i,c+j]);} };
  const inFinder=(r,c)=> (r<8&&c<8)||(r<8&&c>=size-8)||(r>=size-8&&c<8);
  const mid=size/2, keep=centre?3.6:0;
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){ if(inFinder(r,c)) continue; if(Math.hypot(r+.5-mid,c+.5-mid)<keep) continue; if(rnd()<.46) cells.push([r,c]); }
  finder(0,0); finder(0,size-7); finder(size-7,0);
  const rx = pattern==='rounded'?0.32:0; const dots = pattern==='dots';
  const body = cells.map(([r,c])=> dots?`<circle cx="${c+.5}" cy="${r+.5}" r=".42"/>`:`<rect x="${c+.06}" y="${r+.06}" width=".88" height=".88" rx="${rx}"/>`).join('');
  const clip = shape==='circle' ? `<clipPath id="cq${seed}"><circle cx="${mid}" cy="${mid}" r="${mid}"/></clipPath>` : '';
  const g = shape==='circle' ? `<g clip-path="url(#cq${seed})" fill="${ink}">${body}</g>` : `<g fill="${ink}">${body}</g>`;
  const ctr = centre ? `<circle cx="${mid}" cy="${mid}" r="3.4" fill="#fff"/><text x="${mid}" y="${mid+1.05}" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="${mono.length>2?2.4:3.6}" font-style="italic" fill="${ink}">${mono}</text>` : '';
  return `<svg viewBox="-1 -1 ${size+2} ${size+2}" xmlns="http://www.w3.org/2000/svg"><rect x="-1" y="-1" width="${size+2}" height="${size+2}" fill="#fff"/>${clip}${g}${ctr}</svg>`;
}

  case 'march': return head('Your event','Wedding march','Who walks, and in what order — on your invitation, The Entourage card and the program. Each member’s own invitation tells them their role and their turn.') + `<div class="stage" style="flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:18px"><figure style="margin:0;flex:1 1 260px;max-width:340px"><div style="width:100%">${aisleSvg()}</div><figcaption class="small" style="text-align:center;margin-top:6px">The aisle, in walking order</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px">${scaled(marchPreview(t),300,420,0.6)}<figcaption class="small">The Entourage card</figcaption></figure></div>`;
  case 'logo': return head('Look','Logo','Your mark — on the hero, in the QR’s centre and on every print.') + `<div class="stage"><div style="width:min(320px,80%);aspect-ratio:1;background:#fff;border-radius:8px;box-shadow:0 18px 26px -10px rgba(0,0,0,.25);padding:20px">${logoSvg(t)}</div><p class="under">Drag a layer to move it. Layers and their tools are beside.</p></div>`;
  case 'hero': { const d=HERO_DESIGNS.find(x=>x[0]===S.heroDesign); return head('Look','Hero',`${d[1]} — ${d[2]}`) + `<div class="stage">${fit(pagePreview(t,C,S.heroDesign),390,760,390,560)}<p class="under">The same parts in one of four arrangements — a design never adds a word.</p></div>`; }
  case 'reveal': return head('Look','Reveal',`How the invitation opens the first time — ${REVEALS.find(x=>x[0]===S.reveal)[1]}.`) + `<div class="stage" style="position:relative">${fit(pagePreview(t,C,S.heroDesign),390,760,390,520)}${S.reveal==='none'?'':`<div style="position:absolute;inset:22px 16px;display:flex;pointer-events:none"><div style="flex:1;background:${t.surface};opacity:.92;transform:translateX(-42%)"></div><div style="flex:1;background:${t.surface};opacity:.92;transform:translateX(42%)"></div></div>`}<p class="under">Every reveal is Event Hub Pro — Apply names it.</p></div>`;
  case 'rsvp': return head('Story & plans','RSVP','What guests see when they reply — one screen, or one question at a time.') + `<div class="stage">${fit(rsvpPreview(t),390,760,390,560)}</div>`;
  case 'names': return head('Your event','Names','Where your names appear — the hero, every print, every pass.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Hero'],[invitePreview(t,C),300,420,0.62,'The Invitation'],[passPreview(t,C,S.passFmt).html,passPreview(t,C,S.passFmt).w,passPreview(t,C,S.passFmt).h,0.5,'Event pass']]);
  case 'date': return head('Your event','Date','The day on the hero and the countdown; the ceremony time comes from your Schedule.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Hero'],[invitePreview(t,C),300,420,0.62,'The Invitation']]);
  case 'venues': return head('Your event','Venues','The ceremony and the reception, on the invitation and the event card.') + feeds(t,[[invitePreview(t,C),300,420,0.62,'The Invitation'],[cardPreview(t,C),300,420,0.62,'Event card']]);
  case 'parents': return head('Your event','Parents & hosts','Parents on the invitation, read from the Guest list roles; hosts are the accounts guests reply to.') + feeds(t,[[invitePreview(t,C),300,420,0.75,'The Invitation']]);
  case 'special-message': return head('Words','Special message','Your closing words — on every scene that shows them, and on The Finer Details.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Scene · Everything else'],[finerPreview(t,C),300,420,0.62,'The Finer Details']]);
  case 'thank-you': return head('Words','Thank-you message','The message on your E-Gifts page and The Finer Details — one message.') + feeds(t,[[finerPreview(t,C),300,420,0.75,'The Finer Details']]);
  case 'opening-line': return head('Words','Opening line','The first line on the hero and on the invitation.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Hero'],[invitePreview(t,C),300,420,0.62,'The Invitation']]);
  case 'kindly-reply': return head('Words','Kindly reply','Who guests reply to, and by when — on the invitation and the RSVP page.') + feeds(t,[[invitePreview(t,C),300,420,0.75,'The Invitation']]);
  case 'love-story': return head('Love Story','Love Story','Your stories on the Event Hub, and a short excerpt on The Finer Details.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Scene · Story'],[finerPreview(t,C),300,420,0.62,'The Finer Details']]);
  case 'schedule': return head('Schedule','Schedule','The moments guests can see — on the Event Hub, the invitation’s ceremony time and The Finer Details.') + feeds(t,[[pagePreview(t,C),390,760,0.5,'Scene · The day'],[finerPreview(t,C),300,420,0.62,'The Finer Details']]);
  case 'theme': return head('Theme · the first choice',`Theme`,`Each theme on the sample wedding, <b>Maria &amp; Jose</b> — its page and its prints. Tap one: your own page and every print below wear it.`) +
    `<p><span class="sample-tag">Samples · Maria &amp; Jose</span></p><ul class="gal" aria-label="Themes">${THEMES.map(x=>{ const ps=passPreview(x,SAMPLE,'calling-card'); return `<li><button type="button" class="entry${x.id===S.theme?' picked':''}" data-pick="${x.id}" aria-pressed="${x.id===S.theme}"><div class="set"><span class="chk">✓</span>${scaled(pagePreview(x,SAMPLE),390,760,0.35)}<div class="prints">${scaled(invitePreview(x,SAMPLE),300,420,0.25)}${scaled(finerPreview(x,SAMPLE),300,420,0.25)}${scaled(ps.html,ps.w,ps.h,75/ps.w)}</div></div><span class="name">${x.name}${x.tier==='pro'?pro():''}${x.id===SUGGESTED?`<span class="sample-tag" style="margin-left:4px;padding:2px 7px;font-size:9.5px">Suggested for you</span>`:''}</span></button></li>`; }).join('')}</ul>`;
  case 'address': return head('Your Event Hub · address','Event Hub address','Every printed piece and every guest pass carries this address and its QR.') +
    `<div class="addr row"><div class="qr">${qrSvg(S.qr)}</div><div><p class="lbl">Your Event Hub address</p><p class="url" id="url-line">${C.url}</p><p class="note" style="margin-top:8px">Guests scan the QR to open your Event Hub. Its shape, pattern and colour are set under QR code.</p></div></div>`;
  case 'qr': return head('Your Event Hub · QR code',`QR code`,`The code every print and pass carries. Your logo in the centre with Event Hub Pro.`) +
    `<div class="addr"><div class="qr big" id="bigqr">${qrSvg(S.qr)}</div><div class="inline-dd">
      <label>Shape <select class="dd" data-qr="shape" aria-label="QR shape"><option value="square">Square</option><option value="circle">Circle</option></select></label>
      <label>Pattern <select class="dd" data-qr="pattern" aria-label="QR pattern"><option value="classic">Classic</option><option value="rounded">Rounded</option><option value="dots">Dots</option></select></label>
      <label>Colour <i class="swatch" id="qrsw" style="background:${S.qr.ink}"></i><select class="dd" data-qr="ink" aria-label="QR colour"><option value="#1A1A1A">Ink</option><option value="#4a1f2a">Mood Board colour 1 · #4a1f2a</option><option value="#6b7a4a">Mood Board colour 2 · #6b7a4a</option><option value="#7a3b3b">Mood Board colour 5 · #7a3b3b</option></select></label></div>
      <p class="note">${C.url}</p></div>`;
  case 'download': return head('Invitation set','Download the set',`Invitation cards, passes, a welcome poster and an event card, drawn in <b>${t.name}</b>. Print uses your <b>ceremony</b> time from your schedule.`) +
    `<div class="stage" style="flex-direction:row;flex-wrap:wrap;gap:10px;align-items:flex-end">${scaled(invitePreview(t,C),300,420,0.42)}${scaled(rowsPreview(t,C,'The Entourage',['Maid of Honour','Best Man','Principal Sponsors']),300,420,0.42)}${scaled(finerPreview(t,C),300,420,0.42)}${scaled(rowsPreview(t,C,'The Menu',['Starters','Mains','Dessert']),300,420,0.42)}${scaled(posterPreview(t,C),297,420,0.42)}${scaled(cardPreview(t,C),300,420,0.42)}${(()=>{const p=passPreview(t,C,S.passFmt);return scaled(p.html,p.w,p.h,150/p.w)})()}<p class="under" style="width:100%">Classic prints are free and print-ready — 3 mm bleed and crop marks.${t.tier==='pro'?` With Event Hub Pro they print in ${t.name} too.`:''}</p></div>`;
  case 'invitation': return head('Invitation set','The Invitation',`${INV_FORMATS.find(f=>f[0]===S.invFmt)[1]} · your opening line, your parents and “Kindly reply”.`) + `<div class="stage" id="stage">${fit(invitePreview(t,C,S.invFmt),300,S.invFmt==='inv-a5'?426:420,560,520)}<p class="under">Change a switch and save — the card redraws.</p></div>`;
  case 'entourage': return head('Invitation set','The Entourage','5 × 7 in · your wedding party, read from the Guest list roles.') + `<div class="stage">${fit(rowsPreview(t,C,'The Entourage',['Maid of Honour & Best Man','Principal Sponsors','Bride’s crew & Groom’s crew','Bearers & flower girl']),300,420,560,520)}</div>`;
  case 'details': return head('Invitation set','The Finer Details','5 × 7 in · E-Gifts, the thank-you message, your Love Story, the program, your colours and your special message.') + `<div class="stage" id="stage">${fit(finerPreview(t,C),300,420,560,520)}<p class="under">Change a switch and save — the card redraws.</p></div>`;
  case 'menu': return head('Invitation set','The Menu','5 × 7 in · the courses, from your caterer or typed in.') + `<div class="stage">${fit(rowsPreview(t,C,'The Menu',['Starters','Mains','Dessert','Drinks']),300,420,560,520)}</div>`;
  case 'pass': { const f=PASS_FORMATS.find(x=>x[0]===S.passFmt); const p=passPreview(t,C,S.passFmt); return head('Invitation set','Event pass',`${f[1]} · ${f[2]} × ${f[3]} mm · one per guest, with their name and their own QR.`) + `<div class="stage" id="stage">${fit(p.html,p.w,p.h,600,360)}<p class="under">Passes print ${f[1]} size, ganged on A4 with cut lines.</p></div>`; }
  case 'poster': return head('Invitation set','Welcome poster','A3 · 297 × 420 mm · for the door or the easel.') + `<div class="stage">${fit(posterPreview(t,C),297,420,560,520)}</div>`;
  case 'card': { const f=CARD_FORMATS.find(x=>x[0]===S.cardFmt); const land=S.cardFmt!=='card-a5'; return head('Invitation set','Event card',`${f[1]} · the essentials on one card.`) + `<div class="stage" id="stage">${fit(cardPreview(t,C,S.cardFmt),land?420:300,land?252:420,560,520)}</div>`; }
  case 'guest-registry': return head('For the day','Guest list registry','A4 · the reception desk list — A to Z, party size, table, RSVP, a box to tick and a line to sign.') + `<div class="stage">${fit(a4Preview('guest-registry'),210,297,520,560)}</div>`;
  case 'qr-codes': return head('For the day','Guest QR codes','A4 · every guest’s own QR with their name, twelve to a page.') + `<div class="stage">${fit(a4Preview('qr-codes'),210,297,520,560)}</div>`;
  case 'seat-plan': return head('For the day','2D seat plan','Your room from above — every table, every chair, and who sits where.') + `<div class="stage">${fit(a4Preview('seat-plan'),297,210,600,440)}</div>`;
  case 'seating-pack': return head('For the day','Table signs & place cards','A4 · a table directory, one sign per table with its QR, and a place card for every seated guest.') + `<div class="stage">${fit(a4Preview('seating-pack'),210,297,520,560)}</div>`;
  case 'caterer': return head('For the day','Caterer meal counts','A4 · meals per table and every dietary note, for confirmed guests.') + `<div class="stage">${fit(a4Preview('caterer'),210,297,520,560)}</div>`;
  default: return head('For the day','Event QR','One code that opens your Event Hub — for a welcome sign, a table card or a screen.') + `<div class="stage">${fit(a4Preview('event-qr'),210,297,520,560)}</div>`; } }

/* ── EDITOR per item — real labels; a text-carrying switch shows its field inline, edited in place ── */
function tg(name,label,on,{tipText=null,disabled=false,sub=null}={}){ return `<div class="tg${on?' on':''}" data-include="${name}"><label class="main"><span class="l">${label}${tipText?' '+tip(label,tipText,true):''}</span><input type="checkbox" role="switch" ${on?'checked':''} ${disabled?'disabled':''} onchange="this.closest('.tg').classList.toggle('on',this.checked)"/><span class="sw2"></span></label>${sub?`<div class="sub">${sub}</div>`:''}</div>`; }
/* NO "go edit it over there" links (owner 2026-09-28): the SAME field sits here, editable in place. */
const inl = (text,placeholder,rows=0)=> rows ? `<textarea class="fld" rows="${rows}" placeholder="${placeholder}">${text}</textarea>` : `<input class="fld" type="text" value="${text}" placeholder="${placeholder}"/>`;
const parentsInl = ()=>`<div style="display:flex;flex-direction:column;gap:6px">${['Atty. Eufrocina M. Sacdalan-Casasola','Mrs. Milagros Buanhog','Peregrino Buanhog'].map(x=>`<input class="fld" type="text" value="${x}" aria-label="Parent"/>`).join('')}<button type="button" class="btn link" style="align-self:flex-start">+ Add a parent</button></div>`;
const momentsInl = ()=>[['Ceremony','3:00 PM',true],['Cocktails','6:00 PM',true],['Reception','7:00 PM',true],['Vendor call time','12:00 PM',false]].map(([l,tm,g])=>`<div class="tg${g?' on':''}" style="padding:0"><label class="main" style="min-height:36px"><span class="l" style="font-size:13px">${l} <span style="font-size:12px;color:var(--ink-55)">${tm}</span></span><input type="checkbox" role="switch" ${g?'checked':''} onchange="this.closest('.tg').classList.toggle('on',this.checked)"/><span class="sw2" style="transform:scale(.85)"></span></label></div>`).join('');
const coloursInl = ()=>`<div style="display:flex;gap:6px;align-items:center">${C.dots.map(d=>`<input type="color" value="${d}" aria-label="Colour" style="width:28px;height:28px;border:1px solid rgba(0,0,0,.15);border-radius:50%;padding:0;background:none"/>`).join('')}</div>`;
const saveRow = (label='Save')=>`<div class="save"><button type="button" class="btn primary">${label}</button><span class="small">The card redraws.</span></div>`;
const dlSet = (t)=>`<div class="dl"><button type="button" class="btn primary">Whole set · Classic (PDF)</button><button type="button" class="btn">Every guest’s pass · Classic</button>${t.tier==='pro'?`<button type="button" class="btn">${pro()} Whole set · ${t.name} (PDF)</button><button type="button" class="btn">${pro()} Every guest’s pass · ${t.name}</button><button type="button" class="btn link">Sample sheet · ${t.name} (JPG)</button>`:''}</div>`;
function edHead(title,size){ return `<p class="ed-h">${title}${size?`<span class="sz">${size}</span>`:''}</p>`; }
const field = (label,value,{type='text',rows=0,placeholder='',tipText=null}={})=>`<div class="tg on" style="border:0"><label class="main" style="min-height:36px;cursor:default"><span class="l">${label}${tipText?' '+tip(label,tipText,true):''}</span></label><div class="sub" style="padding-top:0">${rows?`<textarea class="fld" rows="${rows}" placeholder="${placeholder}">${value}</textarea>`:`<input class="fld" type="${type}" value="${value}" placeholder="${placeholder}"/>`}</div></div>`;
const slider=(label,val)=>`<div class="row" style="min-height:36px"><span class="l" style="font-size:13px">${label}</span><span class="r"><input type="range" min="0" max="100" value="${val}" aria-label="${label}" style="width:140px"/></span></div>`;
function editorHtml(){ const t=T[S.theme], k=S.item, item=ITEM[k]; let inner=''; switch(k){
  case 'march': inner = edHead('Wedding march','walking order') + `<div class="ed-in">${marchPanel()}${saveRow('Save')}</div>`; break;
  case 'logo': inner = edHead('Logo') + `<div class="ed-in"><p class="sect">Layers ${tip('Layers','Top of the stack first — the stack is the drawing order. Select, move up or down, remove.',true)}</p>${[['IC','Text',true],['Ring','Frame',false]].map(([nm,kind,on])=>`<div class="row" style="min-height:40px"><span class="l" style="font-size:13px;${on?'font-weight:600':''}">${nm} <span style="font-size:11px;color:var(--ink-55)">${kind}</span></span><span class="r"><button type="button" class="btn" style="padding:4px 8px" aria-label="Move ${nm} up">↑</button><button type="button" class="btn" style="padding:4px 8px" aria-label="Move ${nm} down">↓</button><button type="button" class="btn" style="padding:4px 8px" aria-label="Remove ${nm}">×</button></span></div>`).join('')}<div class="save" style="padding-top:6px"><button type="button" class="btn">+ Text</button><button type="button" class="btn">+ Image</button><button type="button" class="btn">+ Frame</button></div>
      <p class="sect">Text · IC</p>${field('Name','IC')}${field('Words','IC')}<div class="row"><span class="l">Typeface</span><span class="r"><select class="dd" aria-label="Typeface"><option selected>Cormorant Garamond</option><option>Bodoni Moda</option><option>Great Vibes</option><option>Syne</option></select></span></div><div class="row"><span class="l">Frame</span><span class="r"><select class="dd" aria-label="Frame"><option selected>Ring</option><option>Double ring</option><option>Open ring</option><option>Diamond</option><option>Arch</option><option>Cartouche</option><option>Scallop</option></select></span></div><div class="row"><span class="l">Colour</span><span class="r"><select class="dd" aria-label="Colour"><option selected>Its own</option><option>Ink</option><option>Mood Board colour 1</option><option>Mood Board colour 2</option></select></span></div>
      <p class="sect">Size and place</p>${slider('Size',48)}${slider('Across',50)}${slider('Up and down',50)}<div class="row"><span class="l">How it’s written ${pro()}</span><span class="r"><select class="dd" aria-label="How it’s written"><option selected>Still</option><option>Handwritten</option><option>Fade in</option></select></span></div>${drafted()}</div>`; break;
  case 'hero': inner = edHead('Hero') + `<div class="ed-in"><div class="row"><span class="l">Design</span><span class="r"><select class="dd" data-hero aria-label="Your hero’s design">${HERO_DESIGNS.map(d=>`<option value="${d[0]}"${d[0]===S.heroDesign?' selected':''}>${d[1]}</option>`).join('')}</select></span></div><p class="small" style="margin-top:4px">${HERO_DESIGNS.find(x=>x[0]===S.heroDesign)[2]}</p>
      <p class="sect">Parts ${tip('Parts','Every part is the tap-to-edit element it already is — font, colour, size, In / During / Out. A design lays them out; it never adds one.',true)}</p>${['Eyebrow','Mark','Names','Joiner','Line','Date','Time','Happening-now pill'].map(pt=>`<div class="row" style="min-height:40px"><span class="l" style="font-size:13px">${pt}</span><span class="r"><i class="swatch" style="background:${t.heading}"></i><select class="dd" aria-label="${pt} font" style="min-height:32px;padding:4px 26px 4px 8px"><option>Aa · ${t.fonts.h}</option><option>Aa · ${t.fonts.b}</option>${t.fonts.s?`<option>Aa · ${t.fonts.s}</option>`:''}</select></span></div>`).join('')}<div class="row"><span class="l">Photo behind ${pro()}</span><span class="r"><button type="button" class="btn">Upload media</button></span></div>${drafted()}</div>`; break;
  case 'reveal': inner = edHead('Reveal') + `<div class="ed-in"><div class="row"><span class="l">Reveal ${pro()}</span><span class="r"><select class="dd" data-reveal aria-label="Reveal">${REVEALS.map(r=>`<option value="${r[0]}"${r[0]===S.reveal?' selected':''}>${r[1]}</option>`).join('')}</select></span></div><p class="small" style="margin-top:6px">${t.name} suggests ${REVEALS.find(x=>x[0]==={house:'none',abaca:'two-flap-vertical',galeriya:'veil-sheer',cinderella:'veil-sheer',velvet:'four-flap',vintage:'four-flap',whimsical:'veil-sheer',regency:'four-flap',gatsby:'church-doors',cyber:'two-flap-horizontal'}[t.id])[1]} — your own pick always wins.</p><div class="row"><span class="l">Plays</span><span class="r"><select class="dd" aria-label="When it plays"><option selected>First open only</option><option>Every open</option></select></span></div>${drafted()}</div>`; break;
  case 'rsvp': inner = edHead('RSVP') + `<div class="ed-in">${tg('one_at_a_time','Ask one question at a time',true,{tipText:'On · one question per screen. Off · one scrolling page.'})}<p class="sect">What do you ask your guests?</p>${[['Plus-ones',true],['Meal choice',true],['Dietary needs',true],['Song request',false],['Note to you',true],['Mobile number',false]].map(([l,on])=>tg('ask_'+l,l,on)).join('')}<div class="row" style="margin-top:8px"><span class="l">Who can RSVP? ${tip('Who can RSVP?','Only my Guest List — a guest needs their key. Anyone, I approve — a person without a key may ask to join; you approve each one.',true)}</span><span class="r"><select class="dd" aria-label="Who can RSVP?"><option selected>Only my Guest List</option><option>Anyone, I approve</option></select></span></div>${field('Reply by','2026-11-18',{type:'date'})}${tg('reminders','Reminder emails',true,{tipText:'A nudge to guests who have not replied, a week before Reply by.'})}<div class="row"><span class="l">Requests waiting</span><span class="r"><span class="muted">2</span><button type="button" class="btn">Open</button></span></div>${saveRow('Save')}</div>`; break;
  case 'names': inner = edHead('Names') + `<div class="ed-in">${field('Bride',C.b)}${field('Groom',C.a)}${field('Monogram',C.mono,{tipText:'Two or three letters. Its look is drawn under Logo.'})}${saveRow('Save')}</div>`; break;
  case 'date': inner = edHead('Date') + `<div class="ed-in"><div class="row"><span class="l">Your date</span><span class="r"><select class="dd" data-date-mode aria-label="Your date"><option value="have"${S.dateMode==='have'?' selected':''}>I have a date</option><option value="help"${S.dateMode==='help'?' selected':''}>Help me choose</option></select></span></div>${S.dateMode==='help'?dateFinder('data-set-date'):field('Wedding date',C.dateIso,{type:'date'})}${field('Ceremony time','15:00',{type:'time',tipText:'The Schedule’s ceremony moment — one time, edited here or there.'})}${saveRow('Save')}</div>`; break;
  case 'venues': inner = edHead('Venues') + `<div class="ed-in"><p class="sect">Ceremony</p>${field('Name',C.venue)}${field('Address','Tandang Sora Ave, Quezon City')}<p class="sect">Reception</p>${field('Name','Seda Vertis North')}${field('Address','North Ave cor. EDSA, Quezon City')}${saveRow('Save')}</div>`; break;
  case 'parents': inner = edHead('Parents & hosts') + `<div class="ed-in"><p class="sect">Parents</p>${parentsInl()}<p class="small" style="margin-top:6px">Parents are optional — with none, the card leaves that part out. ${tip('Parents','Also the guests with the role Parents of the Bride or Parents of the Groom on your Guest list — one list.',true)}</p><p class="sect">Hosts</p><div class="row"><span class="l">Claire</span><span class="r"><input class="fld" type="tel" value="0917 ···· ····" style="width:150px" aria-label="Claire’s number"/></span></div><div class="row"><span class="l">Indalecio</span><span class="r"><input class="fld" type="tel" placeholder="Number" style="width:150px" aria-label="Indalecio’s number"/></span></div></div>`; break;

function bar(){ const tools=(a)=>a.map(([i,l,on,hide])=>`<button type="button" class="tool${on?' on':''}${hide?' hide-sm':''}"><i>${i}</i>${l}</button>`).join('');

    <div class="playm" id="playm"><button type="button" class="tool" onclick="event.stopPropagation();document.getElementById('playm').classList.toggle('open')"><i>▷</i>Play</button>
      <div class="menu" role="menu"><button type="button">Play this scene</button><button type="button" onclick="location.href='${location.pathname}?view=preview'">Preview the whole stage</button></div></div>
    ${tools([['+','Add']])}<span class="sep"></span>
    <div class="place" id="place"><button type="button" class="page-pick" onclick="event.stopPropagation();document.getElementById('place').classList.toggle('open')">${here} <span style="font-size:11px">▾</span></button>
      <div class="menu" role="menu">${['Save the Date','Invitation','The Day','Post Event','Details'].map(p=>`<button type="button" class="${p===here?'on':''}" onclick="location.href='${location.pathname}?view=${p==='Details'?'page':'stage'}'">${p}${p===here?'<span style="font-size:11px">✓</span>':''}</button>`).join('')}</div></div>
    ${tools([['▣','Scenes',true],['▭','View',false,true],['⋯','More']])}<button type="button" class="word">Live now</button><button type="button" class="word">↺ Restore</button>
    <button type="button" class="apply" id="apply">Apply<span class="dia" id="apply-dia" ${T[S.theme].tier==='pro'?'':'hidden'}>◆</span></button></header>`; }

function renderPage(){ const seat=S.item==='seating'; document.getElementById('app').innerHTML = `<div class="maker">${bar()}<div class="work">${seat?elementsNav():navHtml()}<main class="body" id="body"><div class="body-in">${bodyHtml()}</div></main>${seat?guestsEditor():editorHtml()}</div></div>`; wire(); if(seat) wireSeating(); }
function wireSeating(){
  const nd=document.getElementById('nav-details'); if(nd) nd.addEventListener('click',()=>{ S.item='parents'; S.sheet=false; renderPage(); });
  const seatAt=(n)=>{ if(S.seatGuest!==null){ const g=GUESTS.find(x=>x.id===S.seatGuest); if(GUESTS.filter(x=>x.table===n).length<TABLES.find(x=>x.n===n).seats) g.table=n; S.seatGuest=null; S.seatTable=n; } else { S.seatTable = S.seatTable===n?null:n; } S.seatEl=null; S.sheet=true; rerender(); };
  document.querySelectorAll('[data-seat-table]').forEach(b=>b.addEventListener('click',()=>seatAt(Number(b.dataset.seatTable))));
  document.querySelectorAll('[data-table]').forEach(g=>g.addEventListener('click',()=>seatAt(Number(g.dataset.table))));
  document.querySelectorAll('[data-seat-el],[data-el]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.seatEl||b.dataset.el; S.seatEl=S.seatEl===k?null:k; S.seatTable=null; rerender(); }));
  document.querySelectorAll('[data-seat-guest]').forEach(b=>b.addEventListener('click',()=>{ const id=Number(b.dataset.seatGuest); S.seatGuest=S.seatGuest===id?null:id; rerender(); }));
  document.querySelectorAll('[data-dock-done]').forEach(b=>b.addEventListener('click',()=>{ S.seatTable=null; S.seatEl=null; S.seatGuest=null; rerender(); }));
  document.querySelectorAll('input[name=sv]').forEach(r=>r.addEventListener('change',()=>{ S.seatView=r.value; rerender(); }));
  const sq=document.getElementById('seat-q'); if(sq) sq.addEventListener('input',()=>{ S.seatQ=sq.value; rerender(); const q2=document.getElementById('seat-q'); if(q2){ q2.focus(); q2.setSelectionRange(q2.value.length,q2.value.length); } });
  const dr=document.getElementById('seat-door'); if(dr) dr.addEventListener('change',()=>{ S.seatOpen=dr.checked; rerender(); });
  document.querySelectorAll('[data-seat-at]').forEach(sel=>sel.addEventListener('change',()=>{ const g=GUESTS.find(x=>x.id===Number(sel.dataset.seatAt)); if(sel.value) g.table=Number(sel.value); S.seatGuest=null; rerender(); }));
  const seatNext=(n)=>{ const g = S.seatGuest!==null ? GUESTS.find(x=>x.id===S.seatGuest) : unseated()[0]; if(g && GUESTS.filter(x=>x.table===n).length<TABLES.find(x=>x.n===n).seats) g.table=n; S.seatGuest=null; rerender(); };
  document.querySelectorAll('[data-empty-seat]').forEach(b=>b.addEventListener('click',()=>seatNext(Number(b.dataset.emptySeat))));
  document.querySelectorAll('[data-next-unseated]').forEach(b=>b.addEventListener('click',()=>seatNext(Number(b.dataset.nextUnseated))));
  const su=document.getElementById('seat-un'); if(su) su.addEventListener('change',()=>{ S.seatOnlyUnseated=su.checked; rerender(); });
  document.addEventListener('click',(e)=>{ if(!e.target.closest('.bm')) document.querySelectorAll('.bm.open').forEach(x=>x.classList.remove('open')); });
}

function rerender(){ S.view='page'; const b=document.getElementById('body'); const y=b?b.scrollTop:0; renderPage(); const nb=document.getElementById('body'); if(nb) nb.scrollTop=y; }
function wire(){
  const wl=document.getElementById('whatsleft'); if(wl) wl.addEventListener('click',()=>{ S.left=!S.left; renderPage(); });
  document.querySelectorAll('[data-item]').forEach(b=>b.addEventListener('click',()=>{ S.item=b.dataset.item; S.sheet=false; renderPage(); const on=document.querySelector('.nav .nb.on'); if(on) on.scrollIntoView({block:'nearest',inline:'center'}); }));
  document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.pick)));
  const dd=document.getElementById('theme-dd'); if(dd) dd.addEventListener('change',()=>pick(dd.value));
  document.querySelectorAll('[data-date-mode]').forEach(sel=>sel.addEventListener('change',()=>{ S.dateMode=sel.value; S.sheet=true; (S.view==='easy'?renderEasy:rerender)(); }));
  document.querySelectorAll('[data-set-date]').forEach(b=>b.addEventListener('click',()=>{ const c=CANDIDATES.find(x=>x.d===b.dataset.setDate); C.dateIso=c.d; C.date=c.label.replace('Fri · ','Friday · ').replace('Sat · ','Saturday · ').replace('Dec ','December ').replace('Jan ','January ').replace('Nov ','November '); C.dateShort=C.date.split(' · ')[1]; S.dateMode='have'; (S.view==='easy'?renderEasy:rerender)(); }));
  const hd=document.querySelector('[data-hero]'); if(hd) hd.addEventListener('change',()=>{ S.heroDesign=hd.value; S.sheet=true; rerender(); });

  document.getElementById('app').innerHTML = `<div class="pv"><a class="back" href="${location.pathname}?view=stage" style="margin:0">← Back to the Maker</a><span class="word">Previewing · Invitation</span></div><div style="display:flex;justify-content:center;background:${t.canvas}"><div style="position:relative;overflow:hidden;width:${Math.round(390*sc)}px;height:${Math.round(1240*sc)}px"><div style="position:absolute;left:0;top:0;width:390px;height:1240px;transform:scale(${sc});transform-origin:0 0">${canvas}</div></div></div>`; }
function renderShell(){
  const items=[['theme','Theme'],['seating','Seat plan'],['logo','Logo'],['hero','Hero'],['reveal','Reveal'],['rsvp','RSVP'],['names','Names'],['date','Date'],['special-message','Special message'],['kindly-reply','Kindly reply'],['love-story','Love Story'],['schedule','Schedule'],['qr','QR code'],['address','Address'],['invitation','The Invitation'],['details','The Finer Details'],['pass','Event pass'],['download','Download the set']];

  const seg=(name,val)=>`<div class="seg">${items.map(([k,l])=>`<label><input type="radio" name="${name}" value="${k}" ${k===val?'checked':''}/><span>${l}</span></label>`).join('')}</div>`;
  document.getElementById('app').innerHTML = `<div class="shell">
    <h1>Details — very easy first, everything in one place underneath</h1>
    <p class="sub">The Maker’s own three-column pattern, now for Details (DECISION_LOG 2026-09-28 “Details is the one fill-in area; stages are look and motion; tap is a shortcut”). <b>Left</b>, a navigator grouped <b>Look</b> (Theme · Logo · Hero · Reveal) · <b>Your event</b> (Names · Date · Venues · Parents &amp; hosts) · <b>Words</b> (Special message · Thank-you · Opening line · Kindly reply) · <b>Story &amp; plans</b> (Love Story · Schedule · RSVP) · <b>Your Event Hub</b> (Address · QR code) · <b>Invitation set</b> (every print piece) · <b>For the day</b> (the free prints) · <b>Download the set</b>. <b>Body</b>, the visual of the picked item — for a fact, the places it appears (the hero, the print it feeds). <b>Right</b>, the fields. On a phone the navigator is the thumbnail strip under the body (the scene navigator’s own shape) and the editor is a bottom sheet — tap its handle. The Theme item shows each theme as a clean template on the sample wedding <b>Maria &amp; Jose</b> (page · The Invitation · The Finer Details · a pass) with <i>Suggested for you</i> on the theme the onboarding feel points at; everything else is the couple’s own (Indalecio &amp; Claire · cale-ice). The page dropdown (tap “Details ▾”) no longer lists Prints &amp; Tickets.</p>
    <div class="frames">
      <div class="frame"><p class="cap">375 · Round 1 · Save the Date — 1 of 7</p><p class="small" style="height:36px;margin-top:8px">One thing per screen. Next · Skip for now · All items.</p><iframe src="${location.pathname}?view=easy&step=1" width="375" height="812" title="easy-1" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Pick a step — any time</p><p class="small" style="height:36px;margin-top:8px">Tap the progress label: all 19 steps by round, ✓ / ○; tap one to jump.</p><iframe src="${location.pathname}?view=easy&step=3&steps=open" width="390" height="844" title="easy-steps" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Round 1 — Pick a look (4 of 7)</p><p class="small" style="height:36px;margin-top:8px">Samples on Maria &amp; Jose; Classic free, ◆ Pro marked.</p><iframe src="${location.pathname}?view=easy&step=4" width="390" height="844" title="easy-4" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Round 1 done — Apply</p><p class="small" style="height:36px;margin-top:8px">“Your Save the Date is ready to send.”</p><iframe src="${location.pathname}?view=easy&step=8" width="390" height="844" title="easy-r1" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Round 2 — Wedding march (2 of 7)</p><p class="small" style="height:36px;margin-top:8px">The shipped order panel: groups, two columns, ↑ ↓.</p><iframe src="${location.pathname}?view=easy&step=10" width="390" height="844" title="easy-march" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Round 2 done — Apply</p><p class="small" style="height:36px;margin-top:8px">“Your invitations are ready to send.”</p><iframe src="${location.pathname}?view=easy&step=16" width="390" height="844" title="easy-r2" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Round 3 — Seat plan (1 of 2)</p><p class="small" style="height:36px;margin-top:8px">The door, then Day-of prints, then Apply.</p><iframe src="${location.pathname}?view=easy&step=17" width="390" height="844" title="easy-r3" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Round 1 — Date &amp; time · Help me choose</p><p class="small" style="height:36px;margin-top:8px">The shipped Find your date, in place; tap a date to set it.</p><iframe src="${location.pathname}?view=easy&step=2&finder=1" width="390" height="844" title="easy-finder" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Guest · the invitation’s entourage, in walking order</p><p class="small" style="height:36px;margin-top:8px">Role beside the name only where the heading can’t say it.</p><iframe src="${location.pathname}?view=guest-march" width="390" height="844" title="guest-march" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Guest · a Principal Sponsor’s own invitation</p><p class="small" style="height:36px;margin-top:8px">“You are …” extended: role, turn, partner, who is before.</p><iframe src="${location.pathname}?view=guest-march&me=1" width="390" height="844" title="guest-march-me" style="margin-top:8px"></iframe></div>
      <div class="frame desk"><p class="cap">Desktop · Details › Wedding march — the aisle + the order list</p><p class="small" style="height:36px;margin-top:8px">Body: the aisle in walking order and the card; right: the order panel.</p><iframe src="${location.pathname}?view=page&item=march" width="1280" height="820" title="march-desk" style="margin-top:8px"></iframe></div>
      <div class="frame desk"><p class="cap">Desktop · Round 1 — Your colours (5 of 7)</p><p class="small" style="height:36px;margin-top:8px">Same flow, one column.</p><iframe src="${location.pathname}?view=easy&step=5" width="1280" height="820" title="easy-desk" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">375 · All items (the full navigator)</p>${seg('p375',cur.p375)}<iframe id="f375" src="${src(cur.p375)}" width="375" height="812" title="375" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · phone · sheet open</p>${seg('p390',cur.p390)}<iframe id="f390" src="${src(cur.p390,true)}" width="390" height="844" title="390" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · the shortcut — a stage, special message tapped</p><p class="small" style="height:36px;margin-top:8px">Same field, opened from the scene.</p><iframe src="${location.pathname}?view=stage" width="390" height="844" title="shortcut" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">375 · What’s left filter on</p><p class="small" style="height:36px;margin-top:8px">Only the not-yet rows.</p><iframe src="${location.pathname}?view=page&item=love-story&left=1" width="375" height="812" title="whats-left" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">375 · Seat plan — elements strip, guests sheet peeking</p><p class="small" style="height:36px;margin-top:8px">Navigator = the place; sheet = the guests.</p><iframe src="${location.pathname}?view=page&item=seating" width="375" height="812" title="seating-375" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Seat plan — Table 2 selected, guests open</p><p class="small" style="height:36px;margin-top:8px">Only that table’s guests + empty seats.</p><iframe src="${location.pathname}?view=page&item=seating&table=2&sheet=open" width="390" height="844" title="seating-390" style="margin-top:8px"></iframe></div>
      <div class="frame desk"><p class="cap">Desktop · Seat plan — three columns, door open</p><p class="small" style="height:36px;margin-top:8px">Elements · floor plan (2D / 3D / List) · guests. Apply stays for the rest of the draft.</p><iframe src="${location.pathname}?view=page&item=seating&table=2&open=1" width="1280" height="820" title="seating-desk" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Apply sheet, opened from Seat plan</p><p class="small" style="height:36px;margin-top:8px">The draft’s changes; the seat plan is not in it, and says so.</p><iframe src="${location.pathname}?view=apply&open=1" width="390" height="844" title="apply" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Guest · Find your seat — before</p><p class="small" style="height:36px;margin-top:8px">Door off: nothing to search.</p><iframe src="${location.pathname}?view=findseat" width="390" height="844" title="findseat-before" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Guest · Find your seat — after</p><p class="small" style="height:36px;margin-top:8px">Door on: the table, the room, live.</p><iframe src="${location.pathname}?view=findseat&open=1" width="390" height="844" title="findseat-after" style="margin-top:8px"></iframe></div>
      <div class="frame"><p class="cap">390 · Play → Preview the whole stage</p><p class="small" style="height:36px;margin-top:8px">One way back, top-left.</p><iframe src="${location.pathname}?view=preview" width="390" height="844" title="preview" style="margin-top:8px"></iframe></div>
      <div class="frame desk"><p class="cap">Desktop · 1280</p>${seg('desk',cur.desk)}<iframe id="fdesk" src="${src(cur.desk)}" width="1280" height="820" title="desktop" style="margin-top:8px"></iframe></div>
    </div>
    <ul class="notes">
      <li><b>The easy path is the default for a new couple</b> (owner 2026-09-29: “it needs to be very easy”; sequence per DECISION_LOG “THE EVENT HUB SEQUENCE, STEP 1 TO FINISH”): three rounds, each ending in <b>Apply</b> with what it unlocks; progress reads <b>Round 1 · 3 of 7</b>. <b>Round 1 · Save the Date</b>: Names → Date &amp; time → Where → Pick a look → Your colours → Your mark → First screen → Apply, “Your Save the Date is ready to send”. <b>Round 2 · Invitations</b>: Parents &amp; hosts → Wedding march (the shipped entourage-order panel: groups in printed order, the invitation’s two columns, Move ↑ ↓, Blank line) → The program → How guests reply → Your words → Love Story (optional) → Check your prints → Apply, “Your invitations are ready to send”. <b>Round 3 · The day</b>: Seat plan (the door) → Day-of prints → Apply. One thing per screen: the item large, its one or two fields, one big <b>Next</b> (to the next <i>unfinished</i> step), a quiet <b>Skip for now</b> (the step stays ○ and in What’s left); <b>any step can be picked any time</b> — tapping the progress label opens all 19 steps by round with ✓ / ○. Each round’s Ready screen ticks its items and ends in its own action: Round 1 → <i>Preview · Share your Save the Date · Apply</i>; Round 2 → <i>Send invitations · Apply</i>; Round 3 → <i>Print · Guests see this now</i>. <b>Wedding march</b> also joined the navigator under Your event, after Parents &amp; hosts. Each screen says in plain words where the thing shows (“Shows on your invitation and every print”) — no stage or scene words. <b>Customise</b> is a fold on the screens that have more (Your mark, Where, Parents &amp; hosts, The program, How guests reply, The date) and opens the full editor in place — medium only when customising. <b>All items</b>, top-right, is the full grouped navigator, one tap away; a couple who has been through once lands there.</li>
      <li><b>The wedding march is on the invitation too</b> (owner: “so they know their role · and how they will be presented”): every guest’s invitation draws the entourage in walking order, the role beside a name only where the heading cannot say it (the shipped rule); a keyed member’s own invitation adds, in the dress-code widget’s “You are …” style, their role, their turn, who they walk with and who is before them — “You are a Principal Sponsor · Ninang · You walk 5th, with Hugo Cruz, after the Maid of Honour &amp; Best Man.” Details › Wedding march shows the aisle in walking order beside The Entourage card; the right panel is the shipped order panel (groups in printed order, two columns, Move ↑ ↓, Blank line).</li>
      <li><b>The date finder lives in Date</b> (owner: “date finder?”): Date &amp; time — in the easy path and in Details — is one choice, <i>I have a date</i> / <i>Help me choose</i>. Help me choose opens the shipped Find your date in place: your candidate dates, your shortlisted suppliers, the top 3 that keep the most of them, each supplier honestly labelled free · booked · no conflict on file, confirm; tapping a date sets it. The Chinese-wedding specialist note sits behind ⓘ.</li>
      <li><b>Option B, maximised for findability</b>: the place menu is <b>Save the Date · Invitation · The Day · Post Event · Details</b> — nothing else; every made-once thing (Logo · Hero · Reveal · RSVP included) is a row in Details. Each row carries a <b>✓ filled in</b> or an <b>○ not yet</b> mark; the selected row (and any row hovered on desktop) shows <i>Used on · …</i> — the stages and prints it feeds. <b>What’s left · N</b> at the top of the navigator filters to the not-yet rows; tap again to see all. No back chip, no link-outs — the place menu is the way between stages and Details.</li>
      <li><b>Play</b> opens a two-item menu — <i>Play this scene</i> · <i>Preview the whole stage</i>; the preview (fourth frame) is the couple’s page with one <b>← Back to the Maker</b> control at the top-left.</li>
      <li><b>Seat plan wears the three columns</b> (Your event → Seat plan): <b>left</b> = the place’s elements — every table with its seat count, then Stage · Dance floor · Buffet · Entrance · Service door · Décor — tap selects it on the plan (‹ Details returns the list); <b>middle</b> = the floor plan with the shipped command bar kept whole — <i>+ Add</i> (New table… 13-type catalog · Entrance · Service door · Dance floor · Cocktail area · Sign · Vendor booth · Room size &amp; scale…), the gold <i>Auto Arrange</i> split (Auto Arrange · Build my seating draft · Fill around N locked · Seating policies: Auto-seating, group spill-over, Walkway width · Seating Guide · Seating Priority), <i>Share &amp; print</i> (Publish &amp; print · Mood-board colours · Blueprint · Caterer meal counts · guest photos Own table only / All guests / No photos · Walkthrough videos), and the <b>2D · 3D · List</b> switch; a selected table opens its dock (Table name · Change shape… · Edit chairs… · seats stepper · Rotate · Delete · Done); <b>right</b> = the guests — Search people…, Only unseated, <b>Unseated · N</b> first, then Bride’s side / Groom’s side / Both, held and locked marks; tap a guest then a table (in the list or on the plan) to seat them; with a table selected only its guests and empty seats show, with Unseat · Seat this whole group here. On a phone the elements are the strip and the guests are the sheet. <b>Not placed</b>: the room-size presets (Intimate … Field) sit inside Room size &amp; scale…; the per-chair delete/restore lives behind Edit chairs…; the mobile ⋯ overflow is unnecessary here because the bar wraps.</li>
      <li><b>How the seat plan meets Apply — one model, the shipped one</b>: the seating tool already saves LIVE through its own actions under a single-editor lock, and the guest’s Find your seat is gated on ONE switch (<code>event_floor_plan.published_at</code> — a door, not a snapshot: once stamped, every later save shows to guests at once). So: <b>the seat plan is the couple’s working plan that saves as they go; guests see it only once the door is open; the door is the plan’s own switch, “Guests see this now” (Saves immediately), which is exactly what today’s Publish &amp; print stamps — printing the signs opens it too. The Maker’s Apply does not count seat-plan edits</b>, and the Apply sheet says so in one line. Why this and not “Apply publishes the seat plan”: that would move ~20 live actions, the editor lock and Undo into the hub draft, and the table signs’ QRs already point at live tables — a rebuild for no gain in clarity, since a couple arranging tables wants to see “guests: yes / not yet” right where they work, not in a sheet two taps away.</li>
      <li><b>Fewer taps to seat a guest</b>: every unseated row carries a <i>Seat at… ▾</i> dropdown (tables with free seats) — one tap, one pick; with a table selected, tapping an empty seat seats the picked guest, or the next unseated one when nobody is picked; <i>+ Seat next unseated</i> fills a table without leaving it. On the plan, tapping a table opens the guests sheet on that table.</li>
      <li><b>Download the set</b> is the last group, on its own — it is the set’s output, after every piece; nothing else in it to edit.</li>
      <li><b>No “go edit it over there” links, anywhere</b>: on The Invitation and The Finer Details each include switch that carries text shows the SAME field inline under the switch, editable in place — an empty one is a field with a placeholder (see Love Story on The Finer Details); parents are editable names; the gift line, the thank-you, the special message, the moments and the colours all sit right there. One value, several places to type it.</li>
      <li><b>The shortcut</b> (third frame): on a stage, tapping the special message opens the same Details field in the sheet — nothing to follow, nowhere else to go.</li>
      <li><b>QR</b>: Shape · Pattern · Colour are dropdowns under the code in the body (it is visual); the right editor keeps the logo line, Saves immediately and Save image.</li>
      <li><b>◆ PRO</b> is information, never a lock: a free couple picks a Pro theme, the draft wears it, Apply gains a ◆ and names it.</li>
      <li><b>Not drawn from real data</b>: the venue addresses, the reply-by date, the Love Story titles and the Schedule moments (placeholders shaped like the real fields), the couple’s Entourage and Menu names (wireframe bars), the sample’s venue and time (its public page shows none), the suggested theme (needs the couple’s onboarding feel), and the invitation’s photo (the theme’s still stands in for the couple’s hero photo; Classic stays paper).</li>
    </ul></div>`;
  document.querySelectorAll('.shell input[type=radio]').forEach(r=>r.addEventListener('change',()=>{ const map={p375:['f375',false],p390:['f390',true],desk:['fdesk',false]}; const [id,sheet]=map[r.name]; document.getElementById(id).src=src(r.value,sheet); }));
}

window.addEventListener('error',(e)=>document.documentElement.setAttribute('data-err',`${e.message} @${e.lineno}:${e.colno}`));
try { if(P.get('view')==='page') renderPage(); else if(P.get('view')==='stage') renderStage(); else if(P.get('view')==='preview') renderPreview(); else if(P.get('view')==='apply') renderApplySheet(); else if(P.get('view')==='easy') renderEasy(); else if(P.get('view')==='guest-march') renderGuestMarch(); else if(P.get('view')==='findseat') renderFindSeat(); else renderShell(); document.documentElement.setAttribute('data-rendered','1'); } catch(e){ document.documentElement.setAttribute('data-err',String(e.stack||e)); }
window.addEventListener('load',()=>{ const d=document.documentElement; d.setAttribute('data-clientw',d.clientWidth); d.setAttribute('data-scrollw',d.scrollWidth); const b=document.getElementById('body'); if(b){ d.setAttribute('data-body-clientw',b.clientWidth); d.setAttribute('data-body-scrollw',b.scrollWidth); } });
