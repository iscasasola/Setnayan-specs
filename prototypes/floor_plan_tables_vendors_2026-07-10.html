<title>Floor plan — tables + vendors</title>
<style>
 :root{--bg:#FDFBF7;--surface:#FDFBF7;--surface2:#FDFBF7;--ink:#2C2A29;--soft:#4F535B;--faint:#4F535B;--line:rgba(30,34,41,.12);--cta:#C24E25;--ctaInk:#FDFBF7;--gold:#A9834B;--goldDeep:#A9834B;--goldWash:rgba(197,160,89,.12);--sky:#3B4E67;--skyFill:#e0f0f7;--skyInk:#2a5f7a;--shadow:0 12px 30px -14px rgba(30,34,41,.4)}
 :root[data-theme="dark"]{--bg:#C24E25;--surface:#C24E25;--surface2:#C24E25;--ink:#FDFBF7;--soft:#B6B9BE;--faint:#B6B9BE;--line:rgba(251,251,250,.14);--cta:#E5794E;--ctaInk:#C24E25;--gold:#CBA766;--goldDeep:#CBA766;--goldWash:rgba(224,204,160,.16);--sky:#3B4E67;--skyFill:rgba(56,120,150,.28);--skyInk:#a9d2e6;--shadow:0 12px 30px -12px rgba(0,0,0,.6)}
 *{box-sizing:border-box}
 body{margin:0}
 #stage{min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
 .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
 .eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--goldDeep)}
 h1{font-family:Georgia,serif;font-size:21px;font-weight:600;margin:0}
 .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
 .btn.primary{background:var(--cta);color:var(--ctaInk);border-color:transparent}
 .seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--line);}
 .seg button{border:0;background:transparent;color:var(--soft);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
 .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
 .legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--soft)}
 .lg{display:inline-flex;align-items:center;gap:6px}.sw{width:14px;height:14px;border-radius:5px}
 main{padding:16px 20px 40px;max-width:1080px;margin:0 auto}
 .canvas{position:relative;width:100%;aspect-ratio:16/10;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;touch-action:none}
 .grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.22;pointer-events:none}
 .stageband{position:absolute;top:0;left:0;right:0;height:9%;background:var(--surface2);border-bottom:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);pointer-events:none}
 .item{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:grab;user-select:none;touch-action:none}
 .item.grab{cursor:grabbing;z-index:10;filter:drop-shadow(0 8px 14px rgba(30,34,41,.28))}
 .table{width:70px;height:70px;border-radius:999px;border:2px solid var(--goldDeep);background:var(--surface);display:grid;place-items:center}
 .table.long{width:92px;height:48px;border-radius:13px}
 .table .tn{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;color:var(--goldDeep)}
 .table .tc{font-family:ui-monospace,Menlo,monospace;font-size:9px;color:var(--faint)}
 .vendor{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:var(--skyFill);border:1px solid var(--sky);border-radius:12px;padding:7px 11px;min-width:74px}
 .vendor .vi{font-size:16px;line-height:1}.vendor .vn{font-size:11px;font-weight:700;color:var(--skyInk)}.vendor .vs{font-size:8px;color:var(--skyInk);opacity:.75;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em}
 .dance{border:1.5px dashed var(--gold);border-radius:14px;background:var(--goldWash);display:grid;place-items:center;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--goldDeep);width:150px;height:110px}
 .lbl{margin-top:4px;font-size:10px;color:var(--soft);white-space:nowrap}
 .pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:200px;max-height:60vh;overflow:auto}
 .pop h6{margin:6px 9px;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
 .pop button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:transparent;border-radius:8px;padding:8px 9px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;align-items:center}
 .pop button:hover{background:var(--goldWash)}
 .pop .s{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--faint);font-weight:500}
 .scrim{position:fixed;inset:0;z-index:55}
 .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:9px 14px;font-size:13px}
 .hint{font-size:12px;color:var(--faint);margin-top:10px;text-align:center}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="stage">
  <div class="bar">
    <div><div class="eyebrow">Isabela &amp; Marco · Floor plan</div><h1>Arrange the room</h1></div>
    <button class="btn primary" data-act="addtable">＋ Table</button>
    <button class="btn" data-act="addvendor">＋ Vendor</button>
    <div class="seg"><button data-act="theme" data-theme="light" aria-pressed="true">Light</button><button data-act="theme" data-theme="dark" aria-pressed="false">Dark</button></div>
    <div class="legend"><span class="lg"><span class="sw" style="border:2px solid var(--goldDeep)"></span>Tables</span><span class="lg"><span class="sw" style="background:var(--skyFill);border:1px solid var(--sky)"></span>Vendors</span></div>
  </div>
  <main>
    <div class="canvas" id="canvas"><div class="grid-bg"></div><div class="stageband">▲ Stage &amp; backdrop ▲</div></div>
    <div class="hint">Drag anything — tables <b>and</b> vendors — to match your real venue. Same room, one plan.</div>
  </main>
</div>

<script>
(function(){
  const TYPES={sweetheart:['Sweetheart',2],round:['Round',8],long:['Long',10],serpentine:['Serpentine',18],kings:['King’s',12]};
  const VENDORS={band:['🎸','Band / DJ','on stage'],buffet:['🍽','Buffet','caterer'],bar:['🍸','Bar','vendor'],cake:['🎂','Cake table','vendor'],papic:['📸','Photo booth','Papic'],entrance:['🚪','Entrance','check-in'],gift:['🎁','Gift table','vendor'],florist:['🌿','Florals','vendor']};
  let items=[
    {id:'d1',kind:'dance',x:50,y:50},
    {id:'t1',kind:'table',type:'sweetheart',num:1,label:'Couple',x:50,y:20},
    {id:'t2',kind:'table',type:'round',num:2,label:'VIP family',x:27,y:40},
    {id:'t3',kind:'table',type:'round',num:3,label:'Wedding party',x:73,y:40},
    {id:'t4',kind:'table',type:'round',num:4,label:'Sponsors',x:24,y:74},
    {id:'t5',kind:'table',type:'long',num:5,label:'College Friends',x:50,y:80},
    {id:'t6',kind:'table',type:'round',num:6,label:'Katropa',x:76,y:74},
    {id:'v1',kind:'vendor',v:'band',x:13,y:14},
    {id:'v2',kind:'vendor',v:'cake',x:87,y:14},
    {id:'v3',kind:'vendor',v:'bar',x:8,y:50},
    {id:'v4',kind:'vendor',v:'buffet',x:92,y:50},
    {id:'v5',kind:'vendor',v:'papic',x:11,y:90},
    {id:'v6',kind:'vendor',v:'entrance',x:89,y:90},
  ];
  let nextT=7, nextId=100;
  const canvas=document.getElementById('canvas');
  function itemHTML(it){
    if(it.kind==='dance') return `<div class="item" data-id="${it.id}" style="left:${it.x}%;top:${it.y}%"><div class="dance">Dance floor</div></div>`;
    if(it.kind==='table'){const[tl,cap]=TYPES[it.type];return `<div class="item" data-id="${it.id}" style="left:${it.x}%;top:${it.y}%"><div class="table ${it.type==='long'||it.type==='sweetheart'||it.type==='kings'?'long':''}"><div><div class="tn">T${it.num}${it.type==='sweetheart'?' ♥':''}</div><div class="tc">${tl} · ${cap}</div></div></div><div class="lbl">${it.label||''}</div></div>`;}
    const[vi,vn,vs]=VENDORS[it.v];return `<div class="item" data-id="${it.id}" style="left:${it.x}%;top:${it.y}%"><div class="vendor"><span class="vi">${vi}</span><span class="vn">${vn}</span><span class="vs">${vs}</span></div></div>`;
  }
  function render(){
    [...canvas.querySelectorAll('.item')].forEach(e=>e.remove());
    items.forEach(it=>canvas.insertAdjacentHTML('beforeend',itemHTML(it)));
  }
  function positionEl(it){const el=canvas.querySelector(`[data-id="${it.id}"]`);if(el){el.style.left=it.x+'%';el.style.top=it.y+'%';}}
  function toast(m){document.querySelectorAll('.toast').forEach(e=>e.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('stage').appendChild(t);clearTimeout(window._t);window._t=setTimeout(()=>t.remove(),2200);}

  // —— free drag (pointer) ——
  let drag=null;
  canvas.addEventListener('pointerdown',e=>{
    const el=e.target.closest('.item'); if(!el)return;
    const it=items.find(x=>x.id===el.dataset.id); if(!it)return;
    const cr=canvas.getBoundingClientRect();
    const cx=cr.left+it.x/100*cr.width, cy=cr.top+it.y/100*cr.height;
    drag={it,gx:e.clientX-cx,gy:e.clientY-cy,el};
    el.classList.add('grab'); try{el.setPointerCapture&&el.setPointerCapture(e.pointerId);}catch(_){}
  });
  window.addEventListener('pointermove',e=>{
    if(!drag)return;
    const cr=canvas.getBoundingClientRect();
    drag.it.x=Math.max(5,Math.min(95,(e.clientX-drag.gx-cr.left)/cr.width*100));
    drag.it.y=Math.max(9,Math.min(94,(e.clientY-drag.gy-cr.top)/cr.height*100));
    positionEl(drag.it);
  });
  window.addEventListener('pointerup',()=>{ if(drag){drag.el.classList.remove('grab');drag=null;} });

  // —— toolbar / add ——
  function pop(anchor,title,entries,onPick){
    closePop();
    const scrim=document.createElement('div');scrim.className='scrim';scrim.dataset.act='closepop';
    const p=document.createElement('div');p.className='pop';
    p.innerHTML=`<h6>${title}</h6>`+entries.map(([k,lbl,sub])=>`<button data-pick="${k}">${lbl}<span class="s">${sub}</span></button>`).join('');
    document.getElementById('stage').append(scrim,p);
    const r=anchor.getBoundingClientRect();p.style.left=Math.min(r.left,innerWidth-220)+'px';p.style.top=(r.bottom+6)+'px';
    p.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{closePop();onPick(b.dataset.pick);}));
  }
  function closePop(){document.querySelectorAll('.pop,.scrim').forEach(e=>e.remove());}

  document.getElementById('stage').addEventListener('click',e=>{
    const a=e.target.closest('[data-act]'); if(!a)return;
    if(a.dataset.act==='theme'){document.documentElement.setAttribute('data-theme',a.dataset.theme);document.querySelectorAll('[data-act="theme"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===a.dataset.theme));return;}
    if(a.dataset.act==='closepop'){closePop();return;}
    if(a.dataset.act==='addtable'){pop(a,'New table',Object.entries(TYPES).map(([k,[l,c]])=>[k,l,c+' seats']),k=>{items.push({id:'t'+(nextId++),kind:'table',type:k,num:nextT,label:'',x:50,y:52});toast(`Added T${nextT} · ${TYPES[k][0]} — drag it into place`);nextT++;render();});return;}
    if(a.dataset.act==='addvendor'){pop(a,'Add a booked vendor',Object.entries(VENDORS).map(([k,[i,n,s]])=>[k,i+' '+n,s]),k=>{items.push({id:'v'+(nextId++),kind:'vendor',v:k,x:50,y:52});toast(`Added ${VENDORS[k][1]} — drag it into place`);render();});return;}
  });

  window._items=items;
  render();
})();
</script>

</body></html>
