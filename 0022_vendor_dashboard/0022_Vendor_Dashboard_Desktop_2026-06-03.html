.services-in,.services-ta,.services-sel{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  font:13.5px system-ui;background:var(--bg);color:var(--ink);outline:none}
.services-in:focus,.services-ta:focus,.services-sel:focus{border-color:var(--gold)}
.services-ta{resize:vertical;min-height:64px;line-height:1.5}
.services-sel{cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);
  background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* pricing-model segmented control (flat / per-pax / custom) */
.services-seg{display:flex;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.services-seg button{flex:1;font:600 11.5px system-ui;border:1px solid transparent;background:none;color:var(--ink-soft);
  border-radius:7px;padding:7px 6px;cursor:pointer;white-space:nowrap}
.services-seg button:hover{color:var(--ink)}
.services-seg button.on{background:var(--card);color:var(--mulberry);border-color:var(--mulberry-line);box-shadow:var(--shadow)}

/* peso input with prefix */
.services-peso{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--bg);overflow:hidden}
.services-peso:focus-within{border-color:var(--gold)}
.services-peso .pfx{padding:9px 0 9px 11px;color:var(--ink-soft);font-weight:700;font-size:14px}
.services-peso input{border:none;background:none;outline:none;font:14px system-ui;color:var(--ink);
  padding:9px 11px 9px 6px;width:100%;font-variant-numeric:tabular-nums}

/* two-up field row */
.services-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* stepper (crew size) */
.services-step{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);overflow:hidden}
.services-step button{width:36px;height:38px;border:none;background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;line-height:1}
.services-step button:hover{background:var(--gold-soft)}
.services-step .v{min-width:42px;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}

/* toggle switch (publish / crew meal) */
.services-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--bg)}
.services-toggle .tt{font-size:13px;font-weight:600}
.services-toggle .ts{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.services-sw{flex:0 0 auto;width:42px;height:24px;border-radius:99px;border:none;cursor:pointer;position:relative;
  background:var(--line);transition:background .15s}
.services-sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.services-sw.on{background:var(--sage)}
.services-sw.on::after{transform:translateX(18px)}

/* live crew-meal preview note */
.services-note{font-size:11.5px;line-height:1.5;color:var(--ink-soft);background:var(--gold-soft);
  border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px;margin-top:8px}
.services-note b{color:#8a6d2f;font-weight:700}

/* section divider label inside the editor */
.services-ed-div{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;
  margin:18px 0 11px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}

/* sticky save/cancel footer */
.services-ed-foot{display:flex;gap:8px;padding:13px 20px;border-top:1px solid var(--line);background:var(--card)}
.services-ed-foot .btn{flex:1}
.services-ed-foot .btn.primary{flex:1.5}

/* "+ inclusion" inline editor row */
.services-incl{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--ink);
  padding:7px 0;border-bottom:1px solid var(--line)}
.services-incl:last-of-type{border-bottom:none}
.services-incl .ck{flex:0 0 auto;color:var(--sage);font-weight:700;margin-top:1px}

/* attributes */
/* ===== ATTRIBUTES surface — scoped extras. Palette vars only; every selector ".attributes-" prefixed. ===== */

/* ---- status strip (mirrors the seating-strip pill row) ---- */
.attributes-strip{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.attributes-spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.attributes-spill.ok{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}
.attributes-spill.warn{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.attributes-spill.muted{color:var(--ink-faint)}

/* ---- 3-column body: completeness rail | editor | live preview.
        Fill-don't-stretch: editor is the flex middle; on ultrawide it
        ADDS a second section column rather than stretching. ---- */
.attributes-wrap{display:grid;grid-template-columns:264px minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(min-width:1700px){.attributes-wrap{grid-template-columns:288px minmax(0,1fr) 360px}}
/* narrower desktop: drop the preview pane, keep rail + editor */
@media(max-width:1320px){
  .attributes-wrap{grid-template-columns:248px minmax(0,1fr)}
  .attributes-preview{display:none}
}

/* ============ LEFT RAIL ============ */
.attributes-rail{display:flex;flex-direction:column}

/* completeness ring (conic-gradient, like the budget donut) */
.attributes-ring-card{text-align:center;margin-bottom:4px}
.attributes-ring{width:124px;height:124px;border-radius:50%;margin:2px auto 12px;display:grid;place-items:center;
  background:conic-gradient(var(--mulberry) 0 var(--p), var(--line) var(--p) 100%)}
.attributes-ring-hole{width:90px;height:90px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.attributes-ring-n{font-family:Georgia,serif;font-size:24px;font-weight:700;line-height:1}
.attributes-ring-l{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.attributes-ring-cap{font-size:12px;font-weight:600;color:var(--ink-soft)}
.attributes-ring-cap.ok{color:var(--sage)}

/* visibility checklist */
.attributes-check{display:flex;flex-direction:column;gap:2px}
.attributes-checkrow{display:flex;align-items:center;gap:9px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink-soft)}
.attributes-checkrow:last-child{border-bottom:none}
.attributes-checkrow small{color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-left:3px}
.attributes-checkrow.done{color:var(--ink)}
.attributes-checkbox{flex:0 0 auto;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700}
.attributes-checkrow.done .attributes-checkbox{background:var(--sage);border-color:var(--sage)}

.attributes-need{margin-top:12px;font-size:11.5px;line-height:1.5;color:var(--mulberry);
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:10px;padding:9px 11px}
.attributes-need b{font-weight:700}
.attributes-need.ok{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}

/* section jump-index */
.attributes-idx{display:flex;flex-direction:column;gap:3px}
.attributes-idx-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;
  background:none;border-radius:10px;padding:7px 9px;cursor:pointer;color:var(--ink)}
.attributes-idx-item:hover{background:var(--gold-soft)}
.attributes-idx-item.on{background:var(--gold-soft);border-color:var(--gold-line)}
.attributes-idx-ico{flex:0 0 auto;width:22px;text-align:center;font-size:15px}
.attributes-idx-body{min-width:0}
.attributes-idx-body b{display:block;font-size:13px;font-weight:600}
.attributes-idx-body small{display:block;font-size:11px;color:var(--ink-soft);margin-top:1px}

.attributes-tip{margin-top:14px;font-size:12px;line-height:1.55;color:var(--ink-soft);
  border-top:1px dashed var(--line);padding-top:13px}
.attributes-tip b{color:var(--ink);font-weight:700}

/* ============ CENTER EDITOR ============ */
.attributes-editor{display:flex;flex-direction:column;gap:16px;min-width:0}
/* ultrawide: two section columns side-by-side (adds a column, no stretch) */
@media(min-width:1700px){.attributes-editor{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}}

.attributes-sec{scroll-margin-top:8px}
.attributes-sec-h{align-items:center}
.attributes-sec-ico{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:var(--gold-soft);border:1px solid var(--gold-line)}
.attributes-sec-head{flex:1;min-width:0}
.attributes-sec-head h3{margin:0}
.attributes-sec-sub{font-size:12px;color:var(--ink-soft)}
.attributes-shared{flex:0 0 auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-soft);background:var(--line);border-radius:99px;padding:3px 9px}

.attributes-secnote{font-size:12px;line-height:1.5;color:var(--ink-soft);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}

/* 2-col field grid; multi-selects span full width */
.attributes-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.attributes-cell{min-width:0}
.attributes-cell.wide{grid-column:1 / -1}
@media(max-width:520px){.attributes-fields{grid-template-columns:1fr}}

.attributes-flabel{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:9px}
.attributes-req{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mulberry);
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:2px 7px}
.attributes-facet{font-size:9.5px;font-weight:700;color:#8a6d2f;background:var(--gold-soft);
  border:1px solid var(--gold-line);border-radius:99px;padding:2px 7px}
.attributes-fhint{font-size:11px;font-weight:500;color:var(--ink-faint)}

/* selectable chips (multi + enum) */
.attributes-chips{display:flex;flex-wrap:wrap;gap:7px}
.attributes-pchip{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:99px;padding:6px 12px;cursor:pointer;transition:border-color .1s,background .1s,color .1s}
.attributes-pchip:hover{border-color:var(--gold-line);color:var(--ink)}
.attributes-pchip.on{background:var(--mulberry-soft);border-color:var(--mulberry-line);color:var(--mulberry)}
.attributes-pchip.seg.on{background:var(--mulberry);border-color:var(--mulberry);color:#fff}

/* int stepper */
.attributes-stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
.attributes-stepbtn{width:38px;height:38px;border:none;background:var(--card);color:var(--ink-soft);font-size:18px;cursor:pointer;line-height:1}
.attributes-stepbtn:hover{background:var(--gold-soft);color:var(--ink)}
.attributes-stepval{min-width:96px;text-align:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;
  border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 12px;line-height:38px}

/* boolean toggle */
.attributes-toggle{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);
  border-radius:99px;padding:5px 14px 5px 5px;cursor:pointer;font:600 13px system-ui;color:var(--ink-soft)}
.attributes-toggle .attributes-knob{flex:0 0 auto;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .14s}
.attributes-knob::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);transition:transform .14s}
.attributes-toggle.on{color:var(--sage);border-color:var(--sage-line);background:var(--sage-soft)}
.attributes-toggle.on .attributes-knob{background:var(--sage)}
.attributes-toggle.on .attributes-knob::after{transform:translateX(16px)}

/* open multi-select (venues) + free text */
.attributes-opentag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.attributes-opentag b{cursor:pointer;color:var(--ink-faint);font-weight:700}
.attributes-opentag b:hover{color:var(--mulberry)}
.attributes-openadd{font-size:12px;font-weight:600;color:var(--gold);border:1px dashed var(--gold-line);
  background:var(--gold-soft);border-radius:99px;padding:5px 12px;cursor:pointer}
.attributes-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:13px system-ui;
  background:var(--bg);color:var(--ink);outline:none}
.attributes-input:focus{border-color:var(--gold-line);background:var(--card)}

/* ============ RIGHT PREVIEW PANE ============ */
.attributes-preview{position:sticky;top:0;overflow:hidden}
.attributes-pv-hero{padding:20px 18px 16px;text-align:center;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--gold-soft),transparent)}
.attributes-pv-logo{width:54px;height:54px;border-radius:14px;margin:0 auto 10px;display:grid;place-items:center;
  font-family:Georgia,serif;font-size:19px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--mulberry),#7a3a55)}
.attributes-pv-name{font-size:17px;font-weight:700}
.attributes-pv-sub{font-size:12px;color:var(--ink-soft);margin:3px 0 10px}

.attributes-pv-b{padding:15px 18px}
.attributes-pv-lead{font-size:11.5px;line-height:1.5;color:var(--ink-soft);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}

.attributes-pv-facet{padding:9px 0;border-bottom:1px dashed var(--line)}
.attributes-pv-facet:last-of-type{border-bottom:none}
.attributes-pv-fk{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:6px}
.attributes-pv-tags{display:flex;flex-wrap:wrap;gap:6px}
.attributes-pv-tag{font-size:11.5px;font-weight:600;color:#8a6d2f;background:var(--gold-soft);
  border:1px solid var(--gold-line);border-radius:99px;padding:3px 10px}

.attributes-pv-meta{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.attributes-pv-mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:7px 0;border-bottom:1px dashed var(--line);color:var(--ink-soft)}
.attributes-pv-mrow:last-child{border-bottom:none}
.attributes-pv-mrow b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.attributes-pv-quote{color:var(--mulberry)}

/* repertoire */
/* ===== REPERTOIRE surface — scoped extras. Palette vars only; every selector ".repertoire-" prefixed
   (the two .pill source variants are additive pill colours, palette-only). ===== */

/* music-vendors-only gate banner */
.repertoire-gate{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:13px 16px;
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:var(--radius)}
.repertoire-gate-ico{flex:0 0 auto;font-size:22px;line-height:1}
.repertoire-gate-body{flex:1;font-size:12.5px;line-height:1.5;color:#7a5f28}
body.dark .repertoire-gate-body{color:var(--gold)}
.repertoire-gate-body b{font-weight:700}
.repertoire-gate .btn{flex:0 0 auto;white-space:nowrap}

/* list-detail body: set rail | track list | requests column.
   Fill-don't-stretch — wide screens REVEAL the requests column + breathe the rail, never stretch one pane. */
.repertoire-wrap{display:grid;grid-template-columns:268px 1fr;gap:16px;align-items:start}
.repertoire-reqcol{display:none}
@media(min-width:1500px){
  .repertoire-wrap{grid-template-columns:288px 1fr 340px}
  .repertoire-reqcol{display:block}
}
@media(min-width:1850px){
  .repertoire-wrap{grid-template-columns:300px 1fr 384px}
}

/* ---- left rail: song sets ---- */
.repertoire-rail{position:sticky;top:0}
.repertoire-setlist{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.repertoire-setrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  border:1px solid transparent;background:none;border-radius:11px;padding:9px 10px;color:var(--ink)}
.repertoire-setrow:hover{background:var(--gold-soft)}
.repertoire-setrow.sel{background:var(--gold-soft);border-color:var(--gold-line)}
.repertoire-setrow.sel .repertoire-seticon{background:var(--card);border-color:var(--gold-line)}
.repertoire-seticon{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:16px;background:var(--bg);border:1px solid var(--line)}
.repertoire-setmeta{flex:1;min-width:0}
.repertoire-setmeta b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repertoire-setmeta small{display:block;font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repertoire-setstat{display:block;font-size:11px;color:var(--ink-soft);margin-top:3px;font-variant-numeric:tabular-nums}
.repertoire-reqdot{color:var(--mulberry);font-weight:600}
.repertoire-setcount{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  background:var(--line);border-radius:99px;padding:2px 9px}
.repertoire-setrow.sel .repertoire-setcount{color:#8a6d2f;background:var(--card);border:1px solid var(--gold-line)}

.repertoire-addset{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;cursor:pointer;
  border:1px dashed var(--gold-line);background:none;color:#8a6d2f;border-radius:11px;padding:10px;font:600 12.5px system-ui}
.repertoire-addset:hover{background:var(--gold-soft)}
.repertoire-addset span{font-size:15px;line-height:1}
.repertoire-addset.off{border-color:var(--line);color:var(--ink-faint);cursor:not-allowed}
.repertoire-addset.off:hover{background:none}

/* ---- center: track list ---- */
.repertoire-detail{overflow:hidden}
.repertoire-dethead{display:flex;align-items:center;gap:13px;padding:15px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--gold-soft),transparent)}
.repertoire-detico{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-size:20px;background:var(--card);border:1px solid var(--gold-line)}
.repertoire-dettitle{flex:1;min-width:0}
.repertoire-dettitle h3{margin:0;font-size:19px;font-weight:700}
.repertoire-detsub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-variant-numeric:tabular-nums}

.repertoire-numcell{color:var(--ink-faint);font-variant-numeric:tabular-nums}
.repertoire-num{font-weight:700;font-size:13px}
.repertoire-track b{font-weight:600;font-size:13.5px}
.repertoire-track small{display:block;color:var(--ink-faint);font-size:11.5px;margin-top:1px}
.repertoire-moment{font-size:12px;color:var(--ink-soft);font-weight:600}

/* additive source pills (palette vars only) */
.pill.rsrc-live{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.pill.rsrc-track{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}
.repertoire-reqtag{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:99px;padding:2px 7px;vertical-align:1px}

/* reorder controls */
.repertoire-ordcell{text-align:center;white-space:nowrap}
.repertoire-ord{width:25px;height:25px;border-radius:7px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);cursor:pointer;font-size:9px;line-height:1;margin:0 1px;padding:0}
.repertoire-ord:hover{border-color:var(--gold-line);color:var(--ink);background:var(--gold-soft)}
.repertoire-ord.off{opacity:.32;cursor:default;pointer-events:none}

/* add-track footer row */
.repertoire-addrow td{color:#8a6d2f;font-weight:600;font-size:12.5px;cursor:pointer;background:var(--alabaster)}
.repertoire-addrow:hover td{background:var(--gold-soft)}
.repertoire-addrow-i{font-size:14px;margin-right:5px}
.repertoire-addrow.off td{color:var(--ink-faint);cursor:not-allowed}
.repertoire-addrow.off:hover td{background:var(--alabaster)}

.repertoire-empty{padding:50px 24px;text-align:center;color:var(--ink-faint)}
.repertoire-empty .bi{font-size:34px;opacity:.5;margin-bottom:8px}

/* ---- right column: couple requests ---- */
.repertoire-reqcol{position:sticky;top:0}
.repertoire-reqbody{display:flex;flex-direction:column;gap:11px;max-height:calc(100vh - 240px);overflow-y:auto}
.repertoire-reqbody::-webkit-scrollbar{width:7px}
.repertoire-reqbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px}
.repertoire-reqitem{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--card)}
.repertoire-reqitem.open{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-soft),transparent)}
.repertoire-reqitem.declined{opacity:.72}
.repertoire-reqhead{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
.repertoire-reqsong{min-width:0}
.repertoire-reqsong b{font-weight:700;font-size:13.5px}
.repertoire-reqsong small{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:1px}
.repertoire-reqfrom{font-size:11.5px;color:var(--ink-faint);margin-top:7px}
.repertoire-reqfrom i{font-style:italic}
.repertoire-reqact{display:flex;gap:7px;margin-top:10px}
.repertoire-reqact .btn{flex:1;padding:7px 6px;text-align:center;font-size:12px}
.repertoire-foot{margin-top:13px;font-size:11px;line-height:1.5;color:var(--ink-faint);
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}

/* messages */
/* ============================================================
   THREADS (vendor side) — scoped extras only.
   The base .messages-* design system ships in the shell <style>;
   this file adds ONLY the vendor-specific pieces. Palette vars
   only — no new brand colors. Every selector ".messages-" prefixed.
   ============================================================ */

/* ---- couple avatar (the OTHER party on the vendor side) ----
   Reuses the shell's .gini circle; we add the messages size variants +
   the presence dot anchor so couple avatars match the logo-mark sizing
   used on the couple shell. */
.messages-couple-av{position:relative;flex:0 0 auto;width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:.01em;
  font-family:Georgia,'Times New Roman',serif}
.messages-couple-av.sm{width:30px;height:30px;font-size:11px}
.messages-couple-av.lg{width:46px;height:46px;font-size:15px}
.messages-couple-av.xl{width:66px;height:66px;font-size:22px;margin:0 auto}

/* ---- thread-row footer: pipeline stage + service line ---- */
.messages-stagepill{padding:2px 8px;font-size:10px;letter-spacing:.02em;text-transform:uppercase}
.messages-row-cat{display:flex;align-items:center;gap:8px}
.messages-row-svc{min-width:0;font-size:11px;color:var(--ink-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- conversation bubble wrapper (hosts the masking byline under my bubble) ----
   Stands in for the bare bubble as the flex sibling of the avatar so the avatar
   keeps sitting at the bubble's bottom edge. */
.messages-bubble-wrap{display:flex;flex-direction:column;min-width:0}
.messages-msg.me .messages-bubble-wrap{align-items:flex-end}

/* ---- masking byline: "Replied by [team_label]" under the company logo (0019 § 3.10) ---- */
.messages-byline{font-size:10px;color:var(--ink-faint);margin-top:4px;padding:0 4px;
  display:flex;align-items:center;gap:4px}
.messages-byline::before{content:"🛡️";font-size:9px;opacity:.7}
.messages-msg.me .messages-byline{justify-content:flex-end}

/* ---- right-rail payout card (real PHP payout — token wallet RETIRED) ---- */
.messages-pay{border:1px solid var(--sage-line);background:var(--sage-soft);
  border-radius:12px;padding:13px 14px}
.messages-pay-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.messages-pay-n{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:700;
  line-height:1;color:var(--sage);font-variant-numeric:tabular-nums}
.messages-pay-l{font-size:11px;color:var(--ink-soft);margin-top:4px}
.messages-pay-pct{font-size:12.5px;font-weight:700;color:var(--sage);
  font-variant-numeric:tabular-nums;flex:0 0 auto}
.messages-pay-bar{height:7px;border-radius:99px;background:var(--card);overflow:hidden;margin:11px 0 10px;
  border:1px solid var(--sage-line)}
.messages-pay-bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--sage),#7c8f57)}
.messages-pay-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12px;color:var(--ink-soft)}
.messages-pay-foot .pill{font-size:9.5px;padding:2px 7px}

/* marketing */
/* ============================================================
   MARKETING surface — scoped extras (palette vars only).
   Boosted Ads + Sponsored Boost manager. Every selector is
   ".marketing-" prefixed; reuses shared .frail/.gtable/.gdetail/
   .stat/.pill/.fchip/.gd-* classes from the house style.
   Fill-don't-stretch: 3 columns (rail | table | editor); on
   ultrawide the table column grows + the editor widens.
   ============================================================ */

/* 3-column list-detail (mirrors .guestwrap): rail | campaign table | editor */
.marketing-wrap{display:grid;grid-template-columns:248px minmax(0,1fr) 348px;gap:16px;align-items:start}
@media(min-width:1700px){.marketing-wrap{grid-template-columns:280px minmax(0,1fr) 392px}}
/* narrower desktop: fold the editor out of the row (it stays reachable on wider screens) */
@media(max-width:1320px){.marketing-wrap{grid-template-columns:236px minmax(0,1fr)}}
@media(max-width:1320px){.marketing-wrap .gdetail{display:none}}

.marketing-mid{min-width:0;display:flex;flex-direction:column;gap:14px}

/* ---- left-rail Pro / verified gate hero ---- */
.marketing-gate{border:1px solid var(--mulberry-line);background:linear-gradient(180deg,var(--mulberry-soft),var(--card));
  border-radius:12px;padding:14px 14px 13px;margin-bottom:4px}
.marketing-gate-row{display:flex;align-items:center;gap:11px}
.marketing-logo{flex:0 0 auto;width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--mulberry),#7a3a55);color:#fff;display:grid;place-items:center;
  font-family:Georgia,serif;font-size:13px;letter-spacing:.02em;font-weight:700}
.marketing-gate-meta{min-width:0}
.marketing-gate-meta b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marketing-gate-meta small{font-size:11.5px;color:var(--ink-soft)}
.marketing-gate-tags{display:flex;gap:6px;margin-top:11px}
.marketing-gate-note{margin-top:11px;font-size:11.5px;line-height:1.5;color:var(--ink-soft)}
.marketing-gate-note b{color:var(--ink);font-weight:700}

/* ---- boost-zone cards in the rail ---- */
.marketing-zones{display:flex;flex-direction:column;gap:7px}
.marketing-zone{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--card)}
.marketing-zone.locked{background:var(--bg);opacity:.85}
.marketing-zone-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.marketing-zone-top b{font-size:12.5px;font-weight:700}
.marketing-zone small{display:block;font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.4}
.marketing-zone-pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  border-radius:99px;padding:2px 8px;color:var(--ink-soft);background:var(--line)}
.marketing-zone-pill.on{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}

/* ---- campaign-type cell icon + tags in the table ---- */
.marketing-kind-ico{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  font-size:13px;font-weight:700}
.marketing-kind-ico.boosted{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
.marketing-kind-ico.sponsored{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.marketing-typetag{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;display:inline-block;white-space:nowrap}
.marketing-typetag.boosted{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
.marketing-typetag.sponsored{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}

/* ---- couple-facing note under the table ---- */
.marketing-couplenote{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--ink-soft);
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:12px;padding:11px 14px}
.marketing-couplenote-ico{flex:0 0 auto;font-size:13px;margin-top:1px;color:#8a6d2f}
.marketing-mini-pill{display:inline-block;font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px;vertical-align:1px}
.marketing-mini-pill.sponsored{color:var(--ink-soft);background:var(--card);border:1px solid var(--line)}
.marketing-mini-pill.featured{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}

/* ---- right-pane detail / editor shared bits ---- */
.marketing-d-ico{width:60px;height:60px;border-radius:15px;margin:0 auto 10px;display:grid;place-items:center;
  font-size:26px;font-weight:700}
.marketing-d-ico.boosted{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
.marketing-d-ico.sponsored{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}

/* mini results triplet in the view detail */
.marketing-results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.marketing-res{border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:11px 8px;text-align:center}
.marketing-res b{display:block;font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--mulberry);line-height:1}
.marketing-res span{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:5px}

/* ---- editor field labels ---- */
.marketing-fld-l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;margin:16px 0 8px}

/* product radio-card picker */
.marketing-picker{display:flex;flex-direction:column;gap:7px}
.marketing-pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px;font:inherit;color:var(--ink)}
.marketing-pick:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.marketing-pick.on{border-color:var(--mulberry);box-shadow:inset 0 0 0 1px var(--mulberry)}
.marketing-pick-ico{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700}
.marketing-pick-ico.boosted{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
.marketing-pick-ico.sponsored{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.marketing-pick-b{flex:1;min-width:0}
.marketing-pick-b b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marketing-pick-b small{font-size:11px;color:var(--ink-soft)}
.marketing-pick-p{flex:0 0 auto;text-align:right;font-family:Georgia,serif;font-size:14px;font-weight:700;color:var(--mulberry);line-height:1.1}
.marketing-pick-p small{display:block;font-family:system-ui;font-size:10px;font-weight:600;color:var(--ink-faint);margin-top:2px}

/* zone toggle chips in editor */
.marketing-zonepick{display:flex;flex-wrap:wrap;gap:7px}
.marketing-zb{font:600 12.5px system-ui;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:99px;padding:6px 12px;cursor:pointer}
.marketing-zb:hover{border-color:var(--gold-line)}
.marketing-zb.on{background:var(--mulberry);color:#fff;border-color:var(--mulberry)}
.marketing-zb.locked{opacity:.45;cursor:not-allowed;text-decoration:line-through}

/* editor inline pieces */
.marketing-datechip{font:600 12.5px system-ui;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:8px;padding:5px 11px;cursor:pointer}

/* live cost summary box */
.marketing-sum{margin-top:16px;border:1px solid var(--gold-line);background:var(--gold-soft);border-radius:12px;padding:12px 14px}
.marketing-sum-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.marketing-sum-row b{font-variant-numeric:tabular-nums;font-weight:700}
.marketing-sum-row.sub{font-size:12px;color:var(--ink-soft)}
.marketing-sum-row.sub b{color:var(--ink);font-weight:600}

.marketing-warn{margin-top:12px;font-size:12px;line-height:1.5;color:var(--mulberry);
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:11px;padding:10px 12px}

/* earnings */
/* ============================================================
   EARNINGS surface — scoped extras. Palette vars only; every selector ".earnings-" prefixed.
   Reuses shared .surfhead / .statstrip+.stat / .card / table / .pill from the shell <style>.
   Layout: top summary strip + a full-width payout table (month → expandable per-booking rows).
   ============================================================ */

/* ---- summary strip footnotes + a coloured top accent per stat ---- */
.earnings-statfoot{font-size:11px;color:var(--ink-faint);margin-top:9px;letter-spacing:.02em}
.earnings-stat-avail{border-top:3px solid var(--sage)}
.earnings-stat-pend{border-top:3px solid var(--gold)}
.earnings-stat-life{border-top:3px solid var(--mulberry)}
.earnings-stat-avail .v{color:var(--sage)}
.earnings-stat-life .v{color:var(--mulberry)}

/* ---- card header trim: count pill + a tiny fee legend ---- */
.earnings-count{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--line);
  border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums}
.earnings-feekey{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--mulberry)}
.earnings-feekey i{width:11px;height:11px;border-radius:3px;background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}

/* ---- numeric columns: right-aligned, tabular, never wrapping ---- */
.earnings-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
thead th.earnings-num{text-align:right}
.earnings-th-mon{width:40%}
.earnings-th-status{width:128px;text-align:left}
thead th.earnings-th-status{text-align:left}

/* ---- month summary row ---- */
.earnings-monrow>td{font-size:13.5px}
.earnings-mon{display:flex;align-items:center;gap:11px}
.earnings-chev{flex:0 0 auto;width:14px;font-size:11px;color:var(--ink-faint);transition:transform .14s ease}
.earnings-monrow.open .earnings-chev{transform:rotate(90deg);color:var(--gold)}
.earnings-mon-meta b{font-weight:700;font-size:14px;display:block}
.earnings-mon-meta small{display:block;color:var(--ink-faint);font-size:11.5px;margin-top:1px}
.earnings-monrow.open{background:var(--gold-soft)}
.earnings-monrow.open>td{border-bottom-color:transparent}

/* fee in mulberry (a deduction), net emphasised in ink, gross quiet */
.earnings-gross{color:var(--ink-soft)}
.earnings-fee{color:var(--mulberry)}
.earnings-netcell{color:var(--ink)}
.earnings-netcell b{font-weight:700}

/* ---- per-booking item rows (revealed on expand) ---- */
.earnings-itemrow{cursor:default;background:var(--bg)}
.earnings-itemrow:hover{background:var(--bg)}            /* item rows aren't clickable — kill the table hover tint */
.earnings-itemrow>td{font-size:13px;padding-top:9px;padding-bottom:9px;border-bottom:1px dashed var(--line)}
.earnings-itemrow.last>td{border-bottom:1px solid var(--line)}
.earnings-item{display:flex;align-items:center;gap:11px;padding-left:2px}
/* an indent spur that ties each item under its month chevron */
.earnings-spur{flex:0 0 auto;width:14px;height:14px;margin-left:0;border-left:1.5px solid var(--gold-line);
  border-bottom:1.5px solid var(--gold-line);border-bottom-left-radius:5px}
.earnings-item-meta b{font-weight:600;font-size:13px;display:block}
.earnings-item-meta small{display:block;color:var(--ink-faint);font-size:11.5px;margin-top:1px}
.earnings-itemtag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);
  background:var(--line);border-radius:99px;padding:2px 8px}
.earnings-itemrow .earnings-gross,.earnings-itemrow .earnings-fee{font-size:12.5px}

/* ---- grand-total footer row ---- */
.earnings-totrow{cursor:default;background:var(--alabaster)}
.earnings-totrow:hover{background:var(--alabaster)}
.earnings-totrow>td{border-top:2px solid var(--line);border-bottom:none;font-size:14px}
.earnings-totrow .earnings-mon-meta b{font-family:Georgia,'Times New Roman',serif;font-weight:700}
.earnings-totrow .earnings-netcell b{color:var(--mulberry);font-size:15px}

/* ---- payout-terms note under the table ---- */
.earnings-foot{padding:13px 18px;font-size:11.5px;line-height:1.55;color:var(--ink-soft);
  border-top:1px solid var(--line);background:var(--alabaster)}

/* ---- fill-don't-stretch: on ultrawide, widen the Month column so booking
   descriptions breathe rather than letting the table sprawl into one stretched block ---- */
@media(min-width:1700px){
  .earnings-th-mon{width:46%}
  .earnings-table{max-width:1500px}
}

/* manpower */
/* ============================================================
   MANPOWER surface — scoped extras. Palette vars only; every
   selector is ".manpower-" prefixed. Reuses the shell's shared
   classes (.frail .gdetail .gd-* .fchip .fstat .btn .count .surfhead).
   Layout: summary rail | fill-don't-stretch card grid | detail pane
   (mirrors .guestwrap / .services-wrap). FILL-DON'T-STRETCH — the
   grid adds columns as width grows; nothing stretches.
   ============================================================ */

/* three-column body */
.manpower-wrap{display:grid;grid-template-columns:248px 1fr 332px;gap:16px;align-items:start}
/* narrower desktop: drop the detail pane out of the row, let the grid breathe */
@media(max-width:1320px){.manpower-wrap{grid-template-columns:236px 1fr}}
@media(max-width:1320px){.manpower-wrap .manpower-detail{display:none}}

/* ---- LEFT rail bits ---- */
.manpower-counts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.manpower-count{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:var(--card)}
.manpower-count-total{grid-column:1 / -1;background:linear-gradient(180deg,var(--mulberry-soft),var(--card));border-color:var(--mulberry-line)}
.manpower-count-n{font-family:Georgia,serif;font-size:24px;line-height:1;font-weight:700}
.manpower-count-total .manpower-count-n{font-size:30px;color:var(--mulberry)}
.manpower-count-avail .manpower-count-n{color:var(--sage)}
.manpower-count-booked .manpower-count-n{color:var(--ink-soft)}
.manpower-count-l{font-size:11px;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em}

.manpower-handshake{margin-top:16px;border-top:1px dashed var(--line);padding-top:13px}
.manpower-hs-h{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.manpower-hs-ico{font-size:14px}
.manpower-handshake p{margin:8px 0 0;font-size:12px;line-height:1.55;color:var(--ink-soft)}
.manpower-handshake p b{color:var(--ink);font-weight:700}

/* ---- CENTER column ---- */
.manpower-mid{min-width:0}
.manpower-sechead{display:flex;align-items:baseline;gap:10px;margin:4px 2px 12px}
.manpower-sechead h2{font-family:Georgia,serif;font-size:17px;margin:0;font-weight:700}
.manpower-sechead-sp{flex:1}
.manpower-sechead .manpower-add{align-self:center}

/* inline add-crew affordance (collapsed; expands via .manpower-open) */
.manpower-addcard{max-height:0;opacity:0;overflow:hidden;transition:max-height .2s ease,opacity .18s ease,margin .2s ease;
  border:1px solid var(--gold-line);border-radius:var(--radius);background:linear-gradient(180deg,var(--gold-soft),var(--card));margin:0 2px}
.manpower-addcard.manpower-open{max-height:280px;opacity:1;margin:0 2px 14px;padding:15px 16px}
.manpower-add-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px}
.manpower-add-grid label{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.manpower-add-grid .fsearch{font-size:13px}
.manpower-add-foot{display:flex;align-items:center;gap:12px;margin-top:13px;padding-top:12px;border-top:1px solid var(--gold-line)}
.manpower-add-foot span{flex:1;font-size:12px;color:var(--ink-soft)}
.manpower-add-foot span b{color:var(--ink);font-weight:700}

/* FILL-not-stretch roster grid */
.manpower-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(236px,1fr));gap:14px}

.manpower-card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px 13px;cursor:pointer;
  transition:box-shadow .12s,transform .06s,border-color .12s;min-height:188px}
.manpower-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--gold-line)}
.manpower-card.sel{border-color:var(--mulberry);box-shadow:inset 0 0 0 1px var(--mulberry),var(--shadow)}
/* subtle left status accent */
.manpower-card.manpower-st-avail{box-shadow:inset 3px 0 0 var(--sage-line),var(--shadow)}
.manpower-card.manpower-st-booked{box-shadow:inset 3px 0 0 var(--line),var(--shadow)}
.manpower-card.manpower-st-tent{box-shadow:inset 3px 0 0 var(--gold-line),var(--shadow)}
.manpower-card.sel.manpower-st-avail,.manpower-card.sel.manpower-st-booked,.manpower-card.sel.manpower-st-tent{box-shadow:inset 0 0 0 1px var(--mulberry),var(--shadow)}

.manpower-c-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.manpower-ava{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.manpower-c-name{font-size:15.5px;font-weight:700;line-height:1.25}
.manpower-c-role{font-size:12.5px;color:var(--gold);font-weight:700;margin-top:3px}
.manpower-c-kit{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:6px;flex:1}

.manpower-c-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.manpower-c-rate{font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--mulberry);line-height:1}
.manpower-c-rate small{display:block;font-family:system-ui;font-size:10.5px;font-weight:600;color:var(--ink-faint);margin-top:3px;letter-spacing:.02em}
.manpower-until{font-size:11px;font-weight:700;color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:99px;padding:3px 9px;white-space:nowrap}

/* status pill on cards */
.manpower-pill{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;display:inline-block}
.manpower-pill-avail{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}
.manpower-pill-booked{color:var(--ink-soft);background:var(--line)}
.manpower-pill-tent{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}

.manpower-empty{grid-column:1 / -1;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:34px;text-align:center;color:var(--ink-faint);font-size:13px}

/* ---- RIGHT detail pane extras ---- */
.manpower-detail{position:sticky;top:0}
.manpower-d-note{font-size:12.5px;line-height:1.6;color:var(--ink-soft);background:var(--bg);
  border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-top:14px}
.manpower-d-act{display:flex;gap:7px;margin-top:14px}
.manpower-d-act .btn{flex:1;padding:9px 6px;text-align:center}
.manpower-d-act .btn.primary{flex:1.5}
.manpower-d-hs{margin-top:11px;font-size:11.5px;line-height:1.5;color:var(--ink-faint);text-align:center}

/* team */
/* ============================================================
   TEAM & SETNAYAN surface — scoped extras. Palette vars only.
   Every selector is ".team-" prefixed. Reuses shell shared classes
   (.card .card-h .card-b .surfhead .btn .pill .count) for everything else.
   ============================================================ */

/* two-column body: team roster | subscription. Fill-don't-stretch:
   on ultrawide the subscription column's plan cards spread to 3 real columns. */
.team-wrap{display:grid;grid-template-columns:minmax(360px,460px) 1fr;gap:18px;align-items:start}
@media(min-width:1700px){.team-wrap{grid-template-columns:480px 1fr}}

/* ---------------- LEFT · team roster ---------------- */
.team-roster{position:sticky;top:0}

.team-mrow{display:grid;grid-template-columns:38px 1fr auto auto 30px;align-items:center;gap:13px;
  padding:13px 18px;border-bottom:1px solid var(--line)}
.team-mrow:hover{background:var(--gold-soft)}
.team-mrow.is-me{background:linear-gradient(90deg,var(--gold-soft),transparent)}
.team-mrow.is-me:hover{background:var(--gold-soft)}

.team-ava{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-weight:700;font-size:13px;color:#fff}
.team-mmeta{min-width:0}
.team-mmeta b{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px}
.team-mmeta small{display:block;color:var(--ink-faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-youtag{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:99px;padding:1px 7px}

.team-rolewrap{flex:0 0 auto}
.pill.team-owner{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}

.team-statwrap{flex:0 0 auto;text-align:right;min-width:96px}
.team-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sage)}
.team-status i{width:7px;height:7px;border-radius:50%;background:var(--sage);flex:0 0 auto}
.team-status.pend{color:#8a6d2f}
.team-status.pend i{background:var(--gold)}
.team-last{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px}

.team-mmore{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:none;
  color:var(--ink-faint);font-size:16px;cursor:pointer;line-height:1}
.team-mmore:hover{border-color:var(--line);background:var(--card);color:var(--ink)}

/* invite affordance pinned at the bottom of the roster */
.team-inviterow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
  padding:15px 18px;border:none;border-top:1px dashed var(--line);background:none;color:var(--ink)}
.team-inviterow:hover{background:var(--gold-soft)}
.team-invico{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:20px;font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px dashed var(--gold-line)}
.team-invmeta{flex:1;min-width:0}
.team-invmeta b{font-weight:700;font-size:13.5px;display:block}
.team-invmeta small{font-size:11.5px;color:var(--ink-soft)}
.team-invgo{flex:0 0 auto;color:var(--gold);font-size:16px;font-weight:700}

/* ---------------- RIGHT · subscription column ---------------- */
.team-subcol{display:flex;flex-direction:column;gap:18px;min-width:0}

/* current-plan banner */
.team-curplan{overflow:hidden;border-color:var(--gold-line)}
.team-curplan-b{display:flex;align-items:center;gap:20px;
  background:linear-gradient(180deg,var(--gold-soft),var(--card));padding:20px 22px}
.team-curleft{flex:1;min-width:0}
.team-cureyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.team-curname{font-size:26px;font-weight:700;margin-top:3px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.team-curprice{font-family:system-ui;font-size:16px;font-weight:700;color:var(--mulberry)}
.team-curprice small{font-size:12px;font-weight:600;color:var(--ink-soft);margin-left:2px}
.team-curnote{font-size:12.5px;line-height:1.5;color:var(--ink-soft);margin-top:9px;max-width:560px}
.team-curnote b{color:var(--ink)}
.team-curright{flex:0 0 auto}
.team-promo{width:86px;height:86px;border-radius:16px;display:grid;place-items:center;text-align:center;
  font-family:Georgia,serif;font-weight:700;font-size:13px;line-height:1.25;letter-spacing:.04em;
  color:#fff;background:linear-gradient(135deg,var(--mulberry),#7a3a55);box-shadow:var(--shadow)}

/* ---- plan cards row ---- */
.team-compare{overflow:hidden}
.team-plans{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:22px}

.team-plan{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
  padding:0 0 16px;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .12s,transform .06s,border-color .12s}
.team-plan:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.team-plan.is-picked{border-color:var(--gold-line);box-shadow:var(--shadow)}
.team-plan.is-current{border-color:var(--mulberry);box-shadow:0 0 0 1px var(--mulberry),var(--shadow)}

.team-phead{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.team-ribbon{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);min-height:14px}
.team-plan.is-current .team-ribbon{color:var(--mulberry)}
.team-plan.tone-pro:not(.is-current) .team-ribbon{color:var(--gold)}
.team-pname{font-size:20px;font-weight:700;margin-top:4px}
.team-pprice{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;font-family:Georgia,serif}
.team-pprice small{font-family:system-ui;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-left:3px}
.team-ptag{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.45}

.team-pfeat{list-style:none;margin:0;padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:9px}
.team-pfeat li{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.4;color:var(--ink)}
.team-pfeat li.off{color:var(--ink-faint)}

.team-pfoot{padding:0 16px}
.team-pcta{width:100%;text-align:center}

  cursor:default;font-weight:700}

.team-max-cta{background:var(--obsidian);color:var(--alabaster);border-color:var(--obsidian)}

/* ---- full comparison matrix ---- */
.team-matrix{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.team-mhead,.team-mline{display:grid;grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(64px,1fr));align-items:center}
.team-mhead{background:var(--alabaster);border-bottom:1px solid var(--line)}
.team-mhead span{padding:10px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:700;color:var(--ink-faint);text-align:center}
.team-mhead span:first-child{text-align:left}
.team-mline{border-bottom:1px solid var(--line)}
.team-mline:last-child{border-bottom:none}
.team-mline:hover{background:var(--gold-soft)}
.team-mlabel{padding:11px 14px;font-size:13px;font-weight:500}
.team-mcell{padding:11px 10px;text-align:center;font-size:12.5px}
.team-mcell.is-current{background:var(--mulberry-soft)}
.team-mline:hover .team-mcell.is-current{background:var(--mulberry-soft)}
.team-ok{font-style:normal;font-weight:700;color:var(--sage)}
.team-no{font-style:normal;color:var(--ink-faint)}
.team-val{font-weight:600;color:var(--ink);font-size:12px}

.team-cmpfoot{margin-top:14px;font-size:11.5px;line-height:1.55;color:var(--ink-faint)}
.team-link{color:var(--gold);font-weight:600;cursor:pointer;text-decoration:none}

/* ---- narrow desktop: stack roster above subscription ---- */

  .team-wrap{grid-template-columns:1fr}
  .team-roster{position:static}
  .team-plans{grid-template-columns:1fr}
}

  </div>

    <span class="es-chev">▾</span>

</aside>

<div id="main">

  <h3>This is the desktop view</h3>
  <p>The vendor dashboard is a wide-screen workspace — booking pipeline, message inbox, calendar. Open it on a laptop or larger.</p>
</div></div>

<script>
/* ===== SETNAYAN Vendor Dashboard — desktop shell (generic chrome + vendor nav) ===== */
let activeSurface='overview';
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const peso=n=>'₱'+n.toLocaleString('en-PH');

const NAV=[
  {key:'home',label:'Home',items:[
    {ico:'📊',label:'Overview',surface:'overview'},
    {ico:'🏬',label:'Profile',surface:'profile'},
  ]},
  {key:'pipeline',label:'Pipeline',items:[
    {ico:'📋',label:'Bookings',surface:'bookings',badge:'4',alert:true},
    {ico:'📄',label:'Contracts',surface:'contracts'},
    {ico:'✦',label:'Services',surface:'services'},
    {ico:'🎛️',label:'Attributes',surface:'attributes'},
    {ico:'🎶',label:'Repertoire',surface:'repertoire'},
  ]},
  {key:'communicate',label:'Communicate',items:[
    {ico:'💬',label:'Messages',surface:'messages',badge:'3',alert:true},
  ]},
  {key:'marketing',label:'Marketing',items:[
    {ico:'📣',label:'Marketing',surface:'marketing'},
    {ico:'✅',label:'Verify',surface:'verify'},
    {ico:'⭐',label:'Reviews',surface:'reviews'},
    {ico:'🖼️',label:'Moodboard library',surface:'moodboardlibrary'},
  ]},
  {key:'money',label:'Money',items:[
    {ico:'💸',label:'Earnings',surface:'earnings'},
    {ico:'🪙',label:'Tokens',surface:'tokens'},
    {ico:'👷',label:'Manpower',surface:'manpower'},
    {ico:'🎟️',label:'Redeem code',surface:'redeemcode'},
  ]},
  {key:'team',label:'Team',items:[
    {ico:'👪',label:'Team & Setnayan',surface:'team'},
  ]},
];

function renderNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  NAV.forEach(group=>{
    const wrap=el('div','navgroup');
    const lbl=el('button','grouplabel'+(group.collapsed?' collapsed':''));
    lbl.innerHTML='<span class="gl-chev">▶</span><span>'+group.label+'</span><span class="gl-sp"></span>';
    const box=el('div');box.style.display=group.collapsed?'none':'block';
    lbl.onclick=()=>{const c=lbl.classList.toggle('collapsed');box.style.display=c?'none':'block';};
    wrap.appendChild(lbl);
    group.items.forEach(it=>{
      const a=el('div','navitem'+(((it.surface||slug(it.label))===activeSurface)?' active':''));
      a.innerHTML='<span class="ni-ico">'+it.ico+'</span><span class="ni-label">'+it.label+'</span>'+
        (it.badge?'<span class="ni-badge'+(it.alert?' alert':'')+'">'+it.badge+'</span>':'');
      a.onclick=()=>go(it);
      box.appendChild(a);
    });
    wrap.appendChild(box);nav.appendChild(wrap);
  });
}
function go(it){
  activeSurface=it.surface||slug(it.label);
  document.getElementById('crumbSurface').textContent=it.label;
  renderNav();renderContent(it);
}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'');}
const PANELS={overview:overviewPanel,profile:profilePanel,bookings:bookingsPanel,contracts:contractsPanel,services:servicesPanel,attributes:attributesPanel,repertoire:repertoirePanel,messages:messagesPanel,marketing:marketingPanel,verify:verifyPanel,reviews:reviewsPanel,moodboardlibrary:moodboardlibraryPanel,earnings:earningsPanel,manpower:manpowerPanel,team:teamPanel};
function renderContent(it){const c=document.getElementById('content');c.scrollTop=0;const key=it.surface||slug(it.label);const fn=PANELS[key];c.replaceChildren(fn?fn():stubPanel(it.label,it.ico));}


/* ===== overview ===== */
/* ============================================================
   OVERVIEW — Vendor home dashboard (La Pascual Photo & Video)
   Pattern: dashboard grid (welcome header + banners + stat grid
   + upcoming-events strip | activity feed + quick-actions rail).
   Fill-don't-stretch: wide screens ADD a 3rd column, never stretch.
   Reuses shared classes (.card .card-h .card-b .stack .surfhead
   .btn .pill .statstrip .stat .feed .qa). New CSS is ".overview-".
   No wallet/token UI — real ops metrics only (order-and-pay).
============================================================ */

let overview_profileDismissed = false;

/* ---- fixtures (vendor-side ops, mirrors La Pascual roster) ---- */
const overview_stats = [
  ['2',   'Upcoming · next 14 days', 'meet',  'Aira & Boy prenup + Tina tasting'],
  ['3',   'Open inquiries',          'pay',   '1 awaiting your reply'],
  ['8',   'Confirmed bookings',      'meet',  'Across all services'],
  ['4',   'Active services',         'meet',  'Documentary + 3 add-ons'],
  ['47',  'Completed events',        'meet',  'Public count'],
  ['96%', 'Response rate',           'meet',  'Avg reply · under 4 hrs'],
];

const overview_upcoming = [
  {d:'05',m:'Sep',t:'Pre-nup shoot · Aira & Boy', s:'9:00 AM · Tagaytay Highlands', cls:'meet', tag:'Booked'},
  {d:'12',m:'Sep',t:'Discovery call · Tina & Marco', s:'2:00 PM · Google Meet', cls:'meet', tag:'Inquiry'},
  {d:'20',m:'Sep',t:'Wedding · Aira & Boy', s:'Whole day · Tagaytay', cls:'meet', tag:'Booked'},
  {d:'28',m:'Sep',t:'Final balance · Aira & Boy', s:'₱40,000 due', cls:'pay', tag:'Payment'},
];

const overview_feed = [
  ['💬','<b>Tina &amp; Marco</b> sent a new inquiry for a Documentary package','12m ago','alert'],
  ['✅','<b>Aira &amp; Boy</b> accepted your proposal — ₱85,000','2h ago',''],
  ['💵','Reservation payout of <b>₱17,000</b> cleared to your account','Yesterday',''],
  ['👀','<b>2 NCR couples</b> viewed your profile but haven\'t messaged','Yesterday',''],
  ['📄','<b>Aira &amp; Boy</b> e-signed the coverage contract (RA 8792)','2 days ago',''],
];

/* progress-bar widths per stat tile (visual only) */
const overview_bars = [40, 33, 100, 80, 94, 96];

function overview_rerender(){
  const c = document.getElementById('content');
  if(c) c.replaceChildren(overviewPanel());
}

function overviewPanel(){
  const p = el('section','panel show');

  /* ---------- welcome header: company name + Verified chip ---------- */
  const head = el('div','overview-welcome');
  head.innerHTML =
    '<div class="overview-brand">'+
      '<div class="overview-logo">LP</div>'+
      '<div class="overview-whead">'+
        '<div class="overview-wrow">'+
          '<h1 class="serif">La Pascual Photo &amp; Video</h1>'+
          '<span class="overview-verified">✓ Verified</span>'+
        '</div>'+
        '<p>Documentary · Tagaytay · 8 bookings in your pipeline · here\'s your day at a glance.</p>'+
      '</div>'+
    '</div>'+
    '<div class="overview-bigcount"><div class="n">2</div><div class="l">events · next 14 days</div></div>';
  p.appendChild(head);

  /* ---------- banners row: hybrid anonymity + profile nudge ---------- */
  const banners = el('div','overview-banners');

  const anon = el('div','overview-banner');
  anon.innerHTML =
    '<span class="overview-bn-ico">🕶️</span>'+
    '<div class="overview-bn-body">'+
      '<b>Your business name is hidden in browse until your first chat reply.</b>'+
      '<span>Couples currently see you as <i>“Tagaytay Wedding Photographer.”</i> Reply to one inquiry and <b>La Pascual Photo &amp; Video</b> reveals everywhere — for good.</span>'+
    '</div>'+
    '<button class="overview-bn-cta">Open inquiries</button>';
  banners.appendChild(anon);

  if(!overview_profileDismissed){
    const nudge = el('div','overview-banner gold');
    nudge.innerHTML =
      '<span class="overview-bn-ico">📋</span>'+
      '<div class="overview-bn-body">'+
        '<b>Your profile is 80% complete.</b>'+
        '<span>Add 2 gallery videos &amp; your travel area to rank higher in marketplace search.</span>'+
        '<div class="overview-prog"><i style="width:80%"></i></div>'+
      '</div>'+
      '<div class="overview-bn-acts">'+
        '<button class="overview-bn-cta">Finish profile</button>'+
        '<button class="overview-bn-x" id="overview-dismiss" title="Dismiss">✕</button>'+
      '</div>';
    banners.appendChild(nudge);
  }
  p.appendChild(banners);

  /* ---------- 6-tile stat grid (ops metrics, not wallet) ---------- */
  const stats = el('div','statstrip overview-stats');
  overview_stats.forEach((row,i)=>{
    const [v,k,cls,sub] = row;
    const card = el('div','stat overview-stat');
    card.innerHTML =
      '<div class="v">'+v+'</div>'+
      '<div class="k">'+k+'</div>'+
      '<div class="overview-sub '+cls+'">'+sub+'</div>'+
      '<div class="bar"><i style="width:'+overview_bars[i]+'%"></i></div>';
    stats.appendChild(card);
  });
  p.appendChild(stats);

  /* ---------- dashboard body: upcoming strip | activity + actions rail ---------- */
  const grid = el('div','overview-grid');

  /* upcoming events strip (main column) */
  const up = el('div','card overview-upcoming');
  up.appendChild(el('div','card-h','<h3>Upcoming events</h3><span class="more">Open calendar →</span>'));
  const ub = el('div','card-b');
  overview_upcoming.forEach(ev=>{
    const r = el('div','deadline');
    r.innerHTML =
      '<div class="dl-date"><div class="d">'+ev.d+'</div><div class="m">'+ev.m+'</div></div>'+
      '<div class="dl-body"><div class="t">'+ev.t+'</div><div class="s">'+ev.s+'</div></div>'+
      '<span class="dl-tag '+ev.cls+'">'+ev.tag+'</span>';
    ub.appendChild(r);
  });
  up.appendChild(ub);
  grid.appendChild(up);

  /* right rail: activity feed + quick actions */
  const rail = el('div','stack overview-rail');

  const act = el('div','card');
  act.appendChild(el('div','card-h','<h3>Recent activity</h3><span class="more">See all →</span>'));
  const ab = el('div','card-b feed');
  overview_feed.forEach(([i,b,t,alert])=>{
    const item = el('div','feeditem');
    item.innerHTML =
      '<span class="fdot'+(alert?' overview-fdot-alert':'')+'">'+i+'</span>'+
      '<div class="fi-b">'+b+'<div class="fi-t">'+t+'</div></div>';
    ab.appendChild(item);
  });
  act.appendChild(ab);
  rail.appendChild(act);

  const qa = el('div','card');
  qa.appendChild(el('div','card-h','<h3>Quick actions</h3>'));
  const qb = el('div','card-b qa');
  [['✦','Author a new service'],['📨','Send a proposal'],['📅','Block a date'],['💬','Reply to inquiries']]
    .forEach(([i,t])=>{
      const b = el('button','qabtn','<span>'+i+'</span>'+t);
      qb.appendChild(b);
    });
  qa.appendChild(qb);
  rail.appendChild(qa);

  grid.appendChild(rail);
  p.appendChild(grid);

  /* ---- wire the dismissable profile nudge (classList/rerender only) ---- */
  const x = p.querySelector('#overview-dismiss');
  if(x) x.onclick = ()=>{ overview_profileDismissed = true; overview_rerender(); };

  return p;
}

/* ===== profile ===== */
/* ============================================================
   PROFILE — vendor profile editor (desktop 2-col, fill-don't-stretch)
   LEFT  = sticky section anchor-nav (Business info · Logo · Photos ·
           Description · Service areas · Ceremony types) + completion meter.
   RIGHT = the stacked form sections (one .card each).
   ULTRAWIDE adds a 3rd column — a live "How couples see you" preview card
   (the marketplace listing tile) — instead of a stretched 2-col.
   Logo upload is MANDATORY (highlighted card) per § 2.1b. Hybrid anonymity
   (Free+Verified name hidden until first reply) + chat masking toggle
   (show_team_labels_in_chat, 0019) shown. Vendor = La Pascual Photo & Video,
   Documentary, Verified. Only global el()/peso() + shared/.profile- classes.
   ============================================================ */

/* ---- the vendor's own profile record (mirrors § 2.1 columns) ---- */
const profile_v = {
  business_name: 'La Pascual Photo & Video',
  category_primary: 'Photo & Video — Documentary',
  category_secondary: ['Prenup / Engagement', 'Same-Day Edit'],
  city: 'Tagaytay City, Cavite',
  years_operating: 9,
  public_visibility: 'verified',            // coming_soon | verified | hidden | archived
  logo_initials: 'LP',                      // brand mark = company logo
  logo_is_placeholder: false,
  hero_set: true,
  gallery_count: 7,
  description: 'A documentary photo & video studio in the Tagaytay highlands. We shoot the day as it unfolds — no stiff posing, just the real laughter, the quiet glances, the loud dance floor. Nine years, 400+ weddings, and a same-day edit that plays before the night ends.',
  travel_primary: 'Cavite · Tagaytay · Batangas',
  base_travel_fee: 3500,
  ceremony_types: ['Catholic', 'Civil', 'Garden / Outdoor', 'Christian'],
  show_team_labels: true,
  team_label: 'Booking team',
};
/* the six anchor sections — id drives both the nav link and the section card */
const profile_sections = [
  { id: 'biz',     ico: '🏬', label: 'Business info', sub: 'Name · category · location' },
  { id: 'logo',    ico: '🪪', label: 'Logo',          sub: 'Required · your brand mark', required: true },
  { id: 'photos',  ico: '🖼️', label: 'Photos',        sub: 'Hero + gallery' },
  { id: 'desc',    ico: '✍️', label: 'Description',   sub: 'How you introduce yourself' },
  { id: 'areas',   ico: '📍', label: 'Service areas', sub: 'Where you travel + fee' },
  { id: 'ceremony',ico: '💍', label: 'Ceremony types',sub: 'What you shoot' },
];
let profile_active = 'biz';   // which left link is highlighted

/* per-section completion (drives the meter + the per-link state dot) */
function profile_done(id){
  const v = profile_v;
  if (id === 'biz')     return !!(v.business_name && v.category_primary && v.city && v.years_operating);
  if (id === 'logo')    return !!v.logo_initials && !v.logo_is_placeholder;   // placeholder counts as incomplete
  if (id === 'photos')  return v.hero_set && v.gallery_count >= 3;
  if (id === 'desc')    return (v.description || '').length >= 80;
  if (id === 'areas')   return !!v.travel_primary;
  if (id === 'ceremony')return v.ceremony_types.length > 0;
  return false;
}
function profile_pct(){
  const done = profile_sections.filter(s => profile_done(s.id)).length;
  return Math.round(done / profile_sections.length * 100);
}

function profile_rerender(){
  const c = document.getElementById('content');
  if (c) c.replaceChildren(profilePanel());
}
/* click a left link → highlight its section + scroll the right column to it */
function profile_goto(id){
  profile_active = id;
  document.querySelectorAll('.profile-link').forEach(a => a.classList.toggle('on', a.dataset.sec === id));
  document.querySelectorAll('.profile-sec').forEach(s => s.classList.toggle('focus', s.dataset.sec === id));
  const sec = document.getElementById('profile-sec-' + id);
  if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------------------------------------------------------------- */
function profilePanel(){
  const p = el('section', 'panel show profile-panel');
  const v = profile_v;

  /* header — surfhead pattern */
  p.appendChild(el('div', 'surfhead',
    '<div><h1>Your profile</h1><p>This is how couples meet you across Setnayan — your marketplace card, your landing page, and every chat bubble.</p></div>' +
    '<div style="display:flex;gap:8px">' +
      '<button class="btn">Preview public page ↗</button>' +
      '<button class="btn primary">Save changes</button>' +
    '</div>'));

  /* status strip — visibility + verification + masking */
  const strip = el('div', 'profile-strip');
  strip.appendChild(el('span', 'profile-spill ok', '✅ Verified vendor'));
  strip.appendChild(el('span', 'profile-spill', '🌐 Live on the marketplace'));
  strip.appendChild(el('span', 'profile-spill', '🔗 setnayan.com/v/la-pascual'));
  strip.appendChild(el('span', 'profile-spill', (v.category_primary)));
  p.appendChild(strip);

  /* 2-col (3 on ultrawide): anchor-nav rail · form · live preview */
  const wrap = el('div', 'profile-wrap');
  wrap.appendChild(profile_navRail());
  wrap.appendChild(profile_form());
  wrap.appendChild(profile_previewRail());
  p.appendChild(wrap);
  return p;
}

/* ---------------- LEFT: anchor-nav + completion meter (frail) ---------------- */
function profile_navRail(){
  const r = el('div', 'frail profile-rail');
  const pct = profile_pct();

  /* completion meter */
  const meter = el('div', 'profile-meter');
  meter.innerHTML =
    '<div class="profile-meter-top"><span class="profile-meter-n">' + pct + '%</span>' +
      '<span class="profile-meter-l">profile<br>complete</span></div>' +
    '<div class="profile-meter-bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="profile-meter-hint">' +
      (pct === 100 ? 'All set — your profile is fully built.' : 'A complete profile gets ~2× more couple inquiries.') +
    '</div>';
  r.appendChild(meter);

  /* section links */
  r.appendChild(el('h4', null, 'Sections'));
  const list = el('div', 'profile-links');
  profile_sections.forEach(s => {
    const done = profile_done(s.id);
    const a = el('button', 'profile-link' + (s.id === profile_active ? ' on' : '') + (s.required ? ' req' : ''));
    a.dataset.sec = s.id;
    a.innerHTML =
      '<span class="profile-link-ico">' + s.ico + '</span>' +
      '<span class="profile-link-body"><b>' + s.label +
        (s.required ? ' <span class="profile-reqdot">required</span>' : '') +
        '</b><small>' + s.sub + '</small></span>' +
      '<span class="profile-link-state ' + (done ? 'done' : 'todo') + '">' + (done ? '✓' : '○') + '</span>';
    a.onclick = () => profile_goto(s.id);
    list.appendChild(a);
  });
  r.appendChild(list);

  /* tip footer */
  r.appendChild(el('div', 'profile-railnote',

  accepted:{l:'Accepted',c:'pending'}, active:{l:'Active',c:'yes'}, completed:{l:'Completed',c:'yes'},

function bookings_count(tab){return bookings_rows.filter(r=>r.bucket===tab).length;}

    if(r.bucket!==bookings_tab)return false;
    if(bookings_q&&!(r.couple+' '+r.service).toLowerCase().includes(bookings_q))return false;
    return true;
  });

function bookings_initials(n){return n.replace(/&/g,' ').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();}

    acts.append(bookings_actBtn('primary','Mark confirmed',r),bookings_actBtn('','Edit quote',r),bookings_actBtn('ghost','Follow up',r));
  }else if(r.stage==='accepted'){
    acts.append(bookings_actBtn('primary','Mark active',r),bookings_actBtn('','Send payment link',r));
  }else if(r.stage==='active'){
    acts.append(bookings_actBtn('primary','Mark completed',r),bookings_actBtn('','Add prep item',r));
  }else{
    acts.append(bookings_actBtn('primary','Request a review',r),bookings_actBtn('','View gallery',r));
  }
  b.appendChild(acts);

  d.appendChild(b);
  return d;
}
function bookings_actBtn(kind,label,r){
  const b=el('button','btn'+(kind==='primary'?' primary':kind==='ghost'?' bookings-ghost':''),label);
  b.onclick=()=>{
    if(label==='Send quote'){r.stage='proposal_sent';r.bucket='progress';if(!r.budget)r.budget=79000;}
    else if(label==='Mark confirmed'){r.stage='accepted';r.bucket='progress';}
    else if(label==='Mark active'){r.stage='active';r.bucket='confirmed';if(!r.paid)r.paid=Math.round(r.budget/2);}
    else if(label==='Mark completed'){r.stage='completed';r.bucket='confirmed';r.paid=r.budget;}
    else if(label==='Decline'){r.bucket='stale';}
    bookings_rerender();
  };
  return b;
}

/* ---------------- RIGHT (ultrawide): at-a-glance rail ---------------- */
function bookings_glancePane(){
  const rail=el('div','bookings-glance stack');

  // this week's prep (open items across active/confirmed-soon bookings)
  const prep=el('div','card');
  prep.appendChild(el('div','card-h','<h3>Prep this week</h3>'));
  const prb=el('div','card-b bookings-glance-prep');
  const open=[];
  bookings_rows.filter(r=>r.daysOut>=-7&&r.daysOut<=45).forEach(r=>{
    r.prep.filter(([,s])=>s==='todo').slice(0,2).forEach(([label])=>open.push([r,label]));
  });
  if(!open.length){
    prb.appendChild(el('div','bookings-glance-clear','✓ Nothing due — you\'re all caught up.'));
  }else{
    open.slice(0,5).forEach(([r,label])=>{
      prb.appendChild(el('div','bookings-task',
        '<span class="bookings-taskdot"></span>'+
        '<div class="bookings-taskb"><b>'+label+'</b><small>'+r.couple+' · '+r.dateShort+'</small></div>'));
    });
  }
  prep.appendChild(prb);
  rail.appendChild(prep);

  // payouts at a glance (real PHP — no token wallet)
  const money=el('div','card');
  money.appendChild(el('div','card-h','<h3>Booked value</h3>'));
  const mb=el('div','card-b');
  const committed=bookings_rows.filter(r=>['accepted','active','completed'].includes(r.stage)).reduce((s,r)=>s+r.budget,0);
  const collected=bookings_rows.reduce((s,r)=>s+r.paid,0);
  mb.appendChild(el('div','bookings-money',
    '<div class="bookings-moneyn">'+peso(committed)+'</div><div class="bookings-moneyl">committed across confirmed bookings</div>'));
  mb.appendChild(el('div','bookings-money2',
    '<span>Collected to date</span><b>'+peso(collected)+'</b>'));
  mb.appendChild(el('div','bookings-money2',
    '<span>Outstanding balance</span><b>'+peso(committed-collected)+'</b>'));
  money.appendChild(mb);
  rail.appendChild(money);

  return rail;
}

/* status → label + pill class (pill.yes / .pending / .no) + rail subtitle.
   "Needs you" = the vendor's own action is outstanding. */
function contracts_statusMeta(s){
  if(s==='draft')       return {pill:'no',      label:'Draft',          rail:'Not sent yet'};
  if(s==='sent')        return {pill:'pending', label:'Sent',           rail:'Awaiting couple'};
  if(s==='countersign') return {pill:'pending', label:'Sign to finish', rail:'Your signature needed'};

  if(s==='expired')     return {pill:'no',      label:'Expired',        rail:'Expired'};
  return {pill:'no', label:s, rail:s};

function contracts_complianceMeta(c){

/* the price line — shows the final agreed price big, with the negotiated delta vs the catalog start */
function contracts_priceTerm(c){
  let sub='';
  if(c.catalog && c.catalog!==c.total){
    const up = c.total>c.catalog;
    sub='<div class="contracts-pricedelta '+(up?'up':'down')+'">'+
        (up?'▲ ':'▼ ')+peso(Math.abs(c.total-c.catalog))+' '+(up?'above':'below')+' your ₱'+c.catalog.toLocaleString('en-PH')+' catalog start</div>';
  } else if(c.catalog){
    sub='<div class="contracts-pricedelta">= your catalog starting price</div>';
  }
  const lock = c.status==='both_signed' ? ' · 🔒 locked at signing' : '';
  return el('div','contracts-term emph',
    '<div class="contracts-tk">Final agreed price'+lock+'</div>'+
    '<div class="contracts-tv">'+peso(c.total)+'</div>'+sub);
}

function contracts_term(k,v,emph){
  return el('div','contracts-term'+(emph?' emph':''),
    '<div class="contracts-tk">'+k+'</div><div class="contracts-tv">'+v+'</div>');
}

/* a single signature line in the ladder */
function contracts_sigRow(who, name, sig, pendingThem, pendingYou){
  const row=el('div','contracts-sigrow');
  let state, dot, detail;
  if(sig){
    state='done'; dot='✓';
    detail='<div class="contracts-signed serif">'+sig.by+'</div>'+
      '<div class="contracts-sigmeta">'+sig.method+' · '+sig.when+' · verified IP + device</div>';
  } else if(pendingYou){
    state='you'; dot='✎';
    detail='<div class="contracts-sigwait">Your signature needed</div>'+
      '<div class="contracts-sigmeta">Sign by signature pad, typed name, or drawn</div>';
  } else if(pendingThem){
    state='wait'; dot='…';
    detail='<div class="contracts-sigwait">Awaiting the couple</div>'+
      '<div class="contracts-sigmeta">Sent · they sign from their dashboard</div>';
  } else {
    state='wait'; dot='…';
    detail='<div class="contracts-sigwait">Not yet signed</div>'+
      '<div class="contracts-sigmeta">Will open once this contract is sent</div>';
  }
  row.className='contracts-sigrow '+state;
  row.innerHTML='<span class="contracts-sigdot">'+dot+'</span>'+
    '<div class="contracts-sigbody"><div class="contracts-sigwho">'+who+' · '+name+'</div>'+detail+'</div>';
  return row;
}

/* context banner under the hero — vendor-side wording */
function contracts_banner(c){
  let cls='wait', txt='', ico='⏳';
  if(c.status==='sent'){
    cls='wait'; ico='📤';
    txt='Sent to '+c.client+' — waiting for them to sign'+(c.expiresIn!=null?'. Expires in '+c.expiresIn+' days if unsigned.':'.');
  } else if(c.status==='countersign'){
    cls='you'; ico='✎';
    txt=c.client+' signed first. Add your countersignature to make this binding.';
  } else if(c.status==='both_signed'){
    cls='done'; ico='✓';
    txt='Signed by both parties. This is your binding record — the agreed price is now locked.';
  } else if(c.status==='draft'){
    cls='draft'; ico='✏️';
    txt='Draft — only you can see this. Finish the terms, then sign and send it to '+c.client+'.';

/* full content re-render (mirrors the shell's *_rerender pattern) */
function services_rerender() {
  const c = document.getElementById('content');
  if (c) c.replaceChildren(servicesPanel());
}
function services_select(id) { services_sel = id; services_rerender(); }
function services_setFilter(v) { services_stateFilter = v; services_rerender(); }

/* mutators — flip flags then re-render (interactivity via state, no RNG/clock) */
function services_togglePublish(s) { s.published = !s.published; services_rerender(); }
function services_toggleMeal(s) { s.crewMeal = !s.crewMeal; services_rerender(); }
function services_bumpCrew(s, d) { s.crewSize = Math.max(1, Math.min(20, s.crewSize + d)); services_rerender(); }
function services_setModel(s, m) { s.pricingModel = m; services_rerender(); }

function services_visible() {
  return services_catalog.filter(s =>
    services_stateFilter === 'all' ? true :
    services_stateFilter === 'published' ? s.published : !s.published);
}

/* card price line varies by pricing model */
function services_priceLine(s) {
  if (s.pricingModel === 'flat') return peso(s.flat) + '<small>flat package</small>';
