<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SETNAYAN · Vendor Dashboard — Desktop (prototype)</title>
<style>
  :root{
    --alabaster:#FBFBFA; --obsidian:#1E2229; --gold:#C5A059; --mulberry:#5C2542;
    --ink:#1E2229; --ink-soft:#6b7079; --ink-faint:#9a9ea6; --line:#e8e6e1; --card:#ffffff; --bg:#f4f2ee;
    --gold-soft:#f5edda; --gold-line:#e3d2ab; --mulberry-soft:#f4ebef; --mulberry-line:#e3cdd6;
    --sage:#5b6b3d; --sage-soft:#eef3e3; --sage-line:#d8e3c2; --rose:#a4506b;
    --shadow:0 1px 2px rgba(30,34,41,.04),0 4px 14px rgba(30,34,41,.05);
    --shadow-lg:0 18px 50px rgba(30,34,41,.16);
    --radius:14px; --sbw:264px;
  }
  body.dark{
    --alabaster:#1E2229; --bg:#171a20; --ink:#FBFBFA; --ink-soft:#a7adb6; --ink-faint:#6b7079;
    --line:#2c313a; --card:#23272f; --gold:#E0CCA0; --gold-soft:#33301f; --gold-line:#4a432c;
    --mulberry:#B8889C; --mulberry-soft:#33222a; --mulberry-line:#4a3540; --sage-soft:#26301d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .serif{font-family:Georgia,'Times New Roman',serif}

  /* ---------------- sidebar ---------------- */
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sbw);background:var(--alabaster);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;transition:width .16s;z-index:20}
  .sb-brand{padding:18px 20px 12px;flex:0 0 auto}
  .wordmark{font-family:Georgia,serif;font-weight:700;letter-spacing:.16em;font-size:15px}
  .wordmark b{color:var(--gold)}
  .eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px}
  .eventswitch{margin:4px 14px 8px;display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;box-shadow:var(--shadow)}
  .eventswitch:hover{border-color:var(--gold-line)}
  .mono{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mulberry),#7a3a55);color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:13px;letter-spacing:.02em}
  .es-meta{flex:1;min-width:0}
  .es-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .es-date{font-size:11px;color:var(--ink-soft)}
  .es-chev{color:var(--ink-faint);font-size:11px}

  .sb-scroll{flex:1;overflow-y:auto;padding:6px 10px 16px}
  .sb-scroll::-webkit-scrollbar{width:8px} .sb-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .navgroup{margin-bottom:6px}
  .grouplabel{display:flex;align-items:center;gap:6px;width:100%;border:none;background:none;color:var(--ink-faint);
    font:700 10.5px system-ui;letter-spacing:.13em;text-transform:uppercase;padding:10px 10px 5px;cursor:pointer}
  .grouplabel .gl-chev{font-size:8px;transition:transform .15s} .grouplabel.collapsed .gl-chev{transform:rotate(-90deg)}
  .grouplabel .gl-sp{flex:1}
  .navitem{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:10px;color:var(--ink);cursor:pointer;
    font-size:13.5px;font-weight:500;position:relative;border:1px solid transparent}
  .navitem:hover{background:var(--gold-soft)}
  .navitem.active{background:var(--gold-soft);border-color:var(--gold-line);color:#8a6d2f;font-weight:600}
  .navitem.active::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gold)}
  .ni-ico{flex:0 0 auto;width:20px;text-align:center;font-size:15px;opacity:.92}
  .ni-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ni-badge{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--ink-soft);background:var(--line);border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
  .ni-badge.alert{color:#fff;background:var(--mulberry)}

  /* collapsed sidebar */
  body.sb-collapsed{--sbw:68px}
  body.sb-collapsed .sb-brand .eyebrow,body.sb-collapsed .es-meta,body.sb-collapsed .es-chev,
  body.sb-collapsed .grouplabel span:not(.gl-chev),body.sb-collapsed .ni-label,body.sb-collapsed .ni-badge,
  body.sb-collapsed .wordmark{display:none}
  body.sb-collapsed .eventswitch{justify-content:center;padding:8px} body.sb-collapsed .navitem{justify-content:center}
  body.sb-collapsed .grouplabel{justify-content:center;padding:8px 0 4px}

  /* ---------------- main ---------------- */
  #main{position:fixed;top:0;left:var(--sbw);right:0;bottom:0;display:flex;flex-direction:column;transition:left .16s}
  #topbar{flex:0 0 auto;height:62px;background:rgba(251,251,250,.86);backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;z-index:10}
  body.dark #topbar{background:rgba(30,34,41,.84)}
  .collapse-btn{border:1px solid var(--line);background:var(--card);width:30px;height:30px;border-radius:9px;cursor:pointer;color:var(--ink-soft);font-size:14px;flex:0 0 auto}
  .collapse-btn:hover{border-color:var(--gold-line)}
  .crumb{font-size:12.5px;color:var(--ink-soft)} .crumb b{color:var(--ink)}
  .tb-title{font-family:Georgia,serif;font-size:18px;font-weight:700}
  .tb-sp{flex:1}
  .countpill{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:5px 12px}
  .tb-search{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-width:200px}
  .tb-search input{border:none;outline:none;background:none;font:13px system-ui;color:var(--ink);flex:1}
  .iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink-soft);font-size:15px;flex:0 0 auto;display:grid;place-items:center}
  .iconbtn:hover{border-color:var(--gold-line);color:var(--ink)}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#d8b878);color:#3a2f12;display:grid;place-items:center;font-weight:700;font-size:13px;cursor:pointer;flex:0 0 auto}

  #content{flex:1;overflow-y:auto;padding:26px 28px 60px}
  .panel{display:none;max-width:3200px;margin:0 auto}  /* fills ultrawide; sanity-caps a 49" panel */
  .panel.show{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------------- home dashboard ---------------- */
  .greet{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
  .greet h1{font-family:Georgia,serif;font-size:30px;margin:0 0 3px;font-weight:700}
  .greet p{margin:0;color:var(--ink-soft);font-size:14.5px}
  .bigcount{text-align:right;flex:0 0 auto}
  .bigcount .n{font-family:Georgia,serif;font-size:40px;line-height:1;color:var(--mulberry)}
  .bigcount .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}

  .statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .stat .v{font-family:Georgia,serif;font-size:24px;font-weight:700} .stat .v small{font-size:14px;color:var(--ink-faint);font-family:system-ui}
  .stat .k{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .stat .bar{height:5px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
  .stat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#d8b878)}

  .homegrid{display:grid;gap:18px;align-items:start;grid-template-columns:1fr 360px;
    grid-template-areas:"planner rail" "upcoming rail"}
  .home-planner{grid-area:planner} .home-upcoming{grid-area:upcoming} .home-rail{grid-area:rail}
  /* ultrawide: 3 real columns — planner | upcoming | activity rail — instead of a stretched 2-col */
  @media(min-width:1700px){.homegrid{grid-template-columns:1.45fr 1fr 372px;grid-template-areas:"planner upcoming rail"}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card-h{display:flex;align-items:center;gap:10px;padding:15px 18px 12px;border-bottom:1px solid var(--line)}
  .card-h h3{font-family:Georgia,serif;font-size:16px;margin:0;font-weight:700;flex:1}
  .card-h .more{font-size:12.5px;color:var(--gold);font-weight:600;cursor:pointer}
  .card-b{padding:16px 18px}
  .stack{display:flex;flex-direction:column;gap:14px}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .chip{font-size:11.5px;font-weight:600;border:1px solid var(--gold-line);background:var(--gold-soft);color:#8a6d2f;border-radius:99px;padding:4px 11px}
  .reclist{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}  /* more cards per row as width grows */
  .rec{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer;transition:box-shadow .12s,transform .06s}
  .rec:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
  .rec .ph{height:74px;background:linear-gradient(135deg,#e9dcc4,#d8c6a4);display:grid;place-items:center;font-size:24px}
  .rec .rb{padding:9px 11px}
  .rec .rt{font-weight:700;font-size:13px} .rec .rs{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .rec .rp{font-size:12px;color:var(--gold);font-weight:700;margin-top:6px}

  .deadline{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
  .deadline:last-child{border-bottom:none}
  .dl-date{flex:0 0 auto;width:46px;text-align:center}
  .dl-date .d{font-family:Georgia,serif;font-size:19px;line-height:1} .dl-date .m{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint)}
  .dl-body{flex:1} .dl-body .t{font-weight:600;font-size:13.5px} .dl-body .s{font-size:12px;color:var(--ink-soft)}
  .dl-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:99px}
  .dl-tag.pay{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
  .dl-tag.meet{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}

  .feed{display:flex;flex-direction:column}
  .feeditem{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .feeditem:last-child{border-bottom:none}
  .fdot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--gold-soft);border:1px solid var(--gold-line)}
  .fi-b{flex:1;font-size:13px} .fi-b b{font-weight:700} .fi-t{font-size:11px;color:var(--ink-faint);margin-top:2px}
  .qa{display:flex;flex-direction:column;gap:9px}
  .qabtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px 13px;font:600 13px system-ui;color:var(--ink);cursor:pointer;text-align:left}
  .qabtn:hover{border-color:var(--gold);background:var(--gold-soft)}

  /* ---------------- guests list-detail ---------------- */
  .surfhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
  .surfhead h1{font-family:Georgia,serif;font-size:25px;margin:0 0 2px}
  .surfhead p{margin:0;color:var(--ink-soft);font-size:13.5px}
  .btn{font:600 13px system-ui;border-radius:10px;padding:9px 15px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .btn:hover{border-color:var(--gold-line)}
  .btn.primary{background:var(--mulberry);color:#fff;border-color:var(--mulberry)} .btn.primary:hover{filter:brightness(1.08)}

  .guestwrap{display:grid;grid-template-columns:230px 1fr 336px;gap:16px;align-items:start}
  .frail{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;position:sticky;top:0}
  .frail h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:16px 0 8px;font-weight:700}
  .frail h4:first-child{margin-top:0}
  .fsearch{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:13px system-ui;background:var(--bg);color:var(--ink)}
  .fchips{display:flex;flex-wrap:wrap;gap:6px}
  .fchip{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:99px;padding:5px 11px;cursor:pointer}
  .fchip.on{background:var(--mulberry-soft);border-color:var(--mulberry-line);color:var(--mulberry)}
  .fstat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .fstat:last-child{border-bottom:none} .fstat b{font-variant-numeric:tabular-nums}

  .gtable{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;
    padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;background:var(--alabaster)}
  thead th:hover{color:var(--ink)} thead th .ar{font-size:9px;opacity:.6}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--gold-soft)}
  tbody tr.sel{background:var(--gold-soft)} tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
  tbody tr:last-child td{border-bottom:none}
  .gname{display:flex;align-items:center;gap:10px}
  .gini{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#fff}
  .gn-meta b{font-weight:600} .gn-meta small{display:block;color:var(--ink-faint);font-size:11px}
  .pill{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;display:inline-block}
  .pill.yes{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}
  .pill.pending{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
  .pill.no{color:var(--rose);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
  .side-b{color:var(--mulberry)} .side-g{color:#3a6ea5}
  .tabletag{font-variant-numeric:tabular-nums;color:var(--ink-soft)}

  .gdetail{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:0;overflow:hidden}
  .gd-empty{padding:50px 24px;text-align:center;color:var(--ink-faint)}
  .gd-empty .bi{font-size:34px;opacity:.5;margin-bottom:8px}
  .gd-hero{padding:22px 20px 16px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--gold-soft),transparent)}
  .gd-ini{width:62px;height:62px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff}
  .gd-name{font-family:Georgia,serif;font-size:20px;font-weight:700}
  .gd-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  .gd-b{padding:16px 20px}
  .gd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .gd-row:last-child{border-bottom:none}
  .gd-row .k{color:var(--ink-soft)}
  .gd-seg{display:flex;gap:5px}
  .gd-seg button{font:600 11.5px system-ui;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:8px;padding:5px 9px;cursor:pointer}
  .gd-seg button.on{background:var(--mulberry);color:#fff;border-color:var(--mulberry)}
  .gd-plus{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-top:8px;font-size:12.5px}

  /* ---------------- budget ---------------- */
  .budgrid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
  .donut{width:150px;height:150px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;
    background:conic-gradient(var(--mulberry) 0 51%,var(--gold) 51% 89%,var(--line) 89% 100%)}
  .donut .hole{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
  .donut .hole .n{font-family:Georgia,serif;font-size:20px;font-weight:700} .donut .hole .l{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em}
  .leg{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0}
  .leg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .leg .sp{flex:1} .leg b{font-variant-numeric:tabular-nums}
  .vrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
  .vrow:last-child{border-bottom:none}
  .vlogo{width:40px;height:40px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font-size:16px;background:var(--gold-soft);border:1px solid var(--gold-line)}
  .vmeta{flex:1} .vmeta b{font-weight:700;font-size:14px} .vmeta small{display:block;color:var(--ink-soft);font-size:12px}
  .vnums{text-align:right;flex:0 0 auto;min-width:130px}
  .vnums .tot{font-weight:700;font-variant-numeric:tabular-nums} .vnums .bal{font-size:12px;color:var(--ink-soft)}

  /* placeholder */
  .ph-surface{display:grid;place-items:center;min-height:60vh}
  .ph-card{max-width:440px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:var(--shadow)}
  .ph-card .bi{font-size:40px;margin-bottom:10px}
  .ph-card h2{font-family:Georgia,serif;margin:0 0 8px;font-size:21px}
  .ph-card p{color:var(--ink-soft);margin:0;font-size:13.5px}
  .ph-card .tag{display:inline-block;margin-top:14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:99px;padding:5px 12px}

  /* narrow-screen note */
  #narrow{display:none}
  @media(max-width:1023px){
    #sidebar,#main{display:none!important}
    #narrow{display:grid;place-items:center;position:fixed;inset:0;padding:30px;text-align:center;background:var(--bg)}
    #narrow .c{max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
    #narrow .bi{font-size:34px;margin-bottom:8px} #narrow h3{font-family:Georgia,serif;margin:0 0 6px}
    #narrow p{color:var(--ink-soft);margin:0;font-size:13.5px}
  }

/* seating */
/* ===== SEATING surface — scoped extras. Palette vars only; every selector ".seating-" prefixed. ===== */

/* status strip */
.seating-strip{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.seating-spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.seating-spill.warn{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.seating-spill.draft{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.seating-draft{color:#8a6d2f;font-weight:600}

/* three-column body: table rail | canvas | detail. Fills wide screens by GROWING the canvas + widening detail. */
.seating-wrap{display:grid;grid-template-columns:248px 1fr 320px;gap:16px;align-items:start}
@media(min-width:1700px){.seating-wrap{grid-template-columns:280px 1fr 372px}}

/* ---- left rail ---- */
.seating-rail{display:flex;flex-direction:column}
.seating-unseat{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);margin-bottom:4px}
.seating-unseat-n{font-family:Georgia,serif;font-size:30px;line-height:1;color:var(--mulberry);font-weight:700}
.seating-unseat-l{font-size:11.5px;line-height:1.35;color:var(--mulberry);font-weight:600}

.seating-tlist{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.seating-tlist::-webkit-scrollbar{width:7px}.seating-tlist::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px}
.seating-trow{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;cursor:pointer;
  border:1px solid transparent;--t:var(--ink-soft)}
.seating-trow:hover{background:var(--gold-soft)}
.seating-trow.sel{background:var(--gold-soft);border-color:var(--gold-line)}
.seating-tdot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--t)}
.seating-tmeta{flex:1;min-width:0}
.seating-tmeta b{font-weight:600;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seating-tmeta small{font-size:11px;color:var(--ink-faint)}
.seating-fill{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
.seating-fill i{display:block;height:100%;background:var(--t);border-radius:99px}
.seating-fill.big{height:8px;margin-top:0}
.seating-tcount{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  background:var(--line);border-radius:99px;padding:2px 8px}
.seating-tcount.full{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}

.seating-leg{display:flex;flex-direction:column;gap:7px}
.seating-legrow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-soft)}
.seating-legsw{width:11px;height:11px;border-radius:50%;flex:0 0 auto}

/* ---- center canvas card ---- */
.seating-canvas-card{position:sticky;top:0}
.seating-canvas-tools{display:flex;gap:6px;margin-left:auto}
.seating-tool{font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--card);
  border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.seating-tool.on{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.seating-stage{padding:14px;background:
  radial-gradient(circle at 50% 30%, rgba(197,160,89,.05), transparent 60%), var(--gold-soft)}
body.dark .seating-stage{background:radial-gradient(circle at 50% 30%, rgba(224,204,160,.05), transparent 60%), var(--bg)}
.seating-svg{display:block;width:100%;height:auto;max-height:calc(100vh - 230px);
  background:var(--alabaster);border:1px solid var(--gold-line);border-radius:12px}

/* room + venue elements */
.seating-room{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:2 6}
.seating-door{fill:var(--gold)}
.seating-elem{fill:var(--obsidian);stroke:none}
.seating-elem.band{fill:var(--ink-soft)}
.seating-elem-l{fill:var(--alabaster);font:700 16px Georgia,serif;letter-spacing:.16em}
.seating-floor{fill:none;stroke:var(--gold-line);stroke-width:2;stroke-dasharray:5 5}
.seating-floor-l{fill:var(--ink-faint);font:600 13px system-ui;letter-spacing:.22em}
.seating-svg-cap{fill:var(--ink-faint);font:600 12px system-ui;letter-spacing:.06em}

/* tables */
.seating-table{cursor:pointer;--t:var(--ink-soft)}
.seating-body{fill:var(--card);stroke:var(--t);stroke-width:2.5;transition:filter .12s}
.seating-table:hover .seating-body{filter:brightness(.985)}
.seating-table.sel .seating-body{stroke-width:4;filter:drop-shadow(0 0 0 6px color-mix(in srgb, var(--t) 16%, transparent))}
.seating-tbl-l{fill:var(--ink);font:700 16px Georgia,serif;pointer-events:none}
.seating-tbl-c{fill:var(--ink-soft);font:600 13px system-ui;pointer-events:none;font-variant-numeric:tabular-nums}
.seating-table.sel .seating-tbl-l{fill:var(--t)}

/* seat dots */
.seating-seat{stroke-width:2;pointer-events:none}
.seating-seat.f{fill:var(--t);stroke:var(--alabaster)}
.seating-seat.e{fill:var(--card);stroke:var(--ink-faint);stroke-dasharray:2 3}
.seating-table.sel .seating-seat.e{stroke:var(--gold);stroke-dasharray:none}

/* ---- right detail ---- */
.seating-detail{position:sticky;top:0}
.seating-dhero{text-align:center}
.seating-dring{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;
  border:3px solid;font-family:Georgia,serif;font-size:24px;font-weight:700;background:var(--card)}
.seating-dring small{font-size:13px;color:var(--ink-faint);font-family:system-ui;font-weight:600}
.seating-seatlist{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.seating-seatchip{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);font-size:12px;min-width:0}
.seating-seatchip .gini{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-weight:700;font-size:10px;color:#fff}
.seating-seatname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.seating-seatchip.empty{border-style:dashed;color:var(--ink-faint)}
.seating-seatchip.empty .seating-seatname{font-weight:500;color:var(--ink-faint)}
.seating-eseat{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  border:1px dashed var(--ink-faint);color:var(--ink-faint);font-weight:700}
.seating-dact{display:flex;gap:7px;margin-top:14px}
.seating-dact .btn{flex:1;padding:9px 6px;text-align:center}
.seating-dact .btn.primary{flex:1.4}

/* schedule */
/* ============================================================ SCHEDULE surface — scoped extras (palette vars only) ============================================================ */

/* segmented toggle in the surface header */
.schedule-seg{display:flex;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;flex:0 0 auto}
.schedule-seg button{font:600 13px system-ui;border:1px solid transparent;background:none;color:var(--ink-soft);border-radius:9px;padding:8px 16px;cursor:pointer;white-space:nowrap}
.schedule-seg button:hover{color:var(--ink)}
.schedule-seg button.on{background:var(--card);color:var(--mulberry);border-color:var(--mulberry-line);box-shadow:var(--shadow)}

/* shared rail + wide column layout (fill-don't-stretch: index rail + timeline column) */
.schedule-wrap{display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
.schedule-rail{position:sticky;top:0}
.schedule-col{display:flex;flex-direction:column;gap:18px;min-width:0}

/* left index list (months / phases) */
.schedule-idx{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.schedule-idx-item{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:8px 9px;cursor:pointer;color:var(--ink)}
.schedule-idx-item:hover{background:var(--gold-soft)}
.schedule-idx-item.on{background:var(--gold-soft);border-color:var(--gold-line)}
.schedule-idx-item .si-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--line);border:2px solid var(--card);box-shadow:0 0 0 1px var(--gold-line)}
.schedule-idx-item.on .si-dot{background:var(--gold)}
.schedule-idx-item .si-body{min-width:0}
.schedule-idx-item .si-body b{display:block;font-size:13px;font-weight:600}
.schedule-idx-item .si-body small{display:block;font-size:11px;color:var(--ink-soft);margin-top:1px}

.schedule-note{margin-top:14px;font-size:11.5px;line-height:1.5;color:var(--ink-soft);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px}

/* visibility legend in the day-view rail */
.schedule-vis-leg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--line)}
.schedule-vis-leg:last-of-type{border-bottom:none}
.schedule-vis-leg b{font-variant-numeric:tabular-nums;margin-left:auto;font-size:13px}
.schedule-vis-leg small{flex:1 0 100%;font-size:11px;color:var(--ink-faint);margin-top:-2px}

/* visibility chip (also a clickable button on timeline blocks) */
.schedule-vchip{display:inline-flex;align-items:center;gap:5px;font:700 11px system-ui;border-radius:99px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button.schedule-vchip{line-height:1}
.sd-vis-all{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}
.sd-vis-fam{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
.sd-vis-priv{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
button.schedule-vchip:hover{filter:brightness(.97)}

/* ---- PREP agenda ---- */
.schedule-mcard{scroll-margin-top:8px}
.schedule-ven{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:1px 8px;vertical-align:1px}
.schedule-wedrow{background:linear-gradient(90deg,var(--gold-soft),transparent);margin:0 -18px;padding-left:18px;padding-right:18px;border-radius:10px}
.schedule-wedrow .t{color:#8a6d2f}
/* ultrawide: two months side-by-side instead of one stretched column */
@media(min-width:1700px){
  .schedule-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .schedule-dayhead,.schedule-phase{grid-column:1 / -1}
}

/* ---- EVENT-DAY header banner ---- */
.schedule-dayhead{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 22px;background:linear-gradient(180deg,var(--gold-soft),var(--card))}
.sd-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.sd-date{font-size:26px;font-weight:700;margin-top:2px}
.sd-meta{font-size:13px;color:var(--ink-soft);margin-top:5px}
.sd-hd-r{text-align:right;flex:0 0 auto}
.sd-bign{font-size:38px;line-height:1;color:var(--mulberry);font-weight:700}
.sd-bigl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}

/* ---- phase + vertical timeline ---- */
.schedule-phase{scroll-margin-top:8px}
.schedule-phase-h{display:flex;align-items:center;gap:10px;margin:4px 2px 10px}
.schedule-phase-h .sp-rule{width:18px;height:2px;background:var(--gold);border-radius:2px;flex:0 0 auto}
.schedule-phase-h b{font-family:Georgia,serif;font-size:14px;letter-spacing:.02em}
.schedule-phase-h .sp-sub{font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase}

.schedule-tl{display:flex;flex-direction:column}
.schedule-tlitem{display:grid;grid-template-columns:78px 24px 1fr;gap:0;align-items:stretch}
.stl-time{text-align:right;padding:14px 12px 14px 0}
.stl-time .stl-t{font-size:15px;font-weight:700;white-space:nowrap}
.stl-time .stl-dur{font-size:11px;color:var(--ink-faint);margin-top:2px}
.stl-line{position:relative;display:flex;justify-content:center}
.stl-line::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.schedule-tlitem:first-child .stl-line::before{top:18px}
.schedule-tlitem:last-child .stl-line::before{bottom:auto;height:18px}
.stl-node{position:relative;width:12px;height:12px;border-radius:50%;margin-top:16px;background:var(--card);border:2px solid var(--gold);z-index:1}
.stl-node.is-anchor{background:var(--mulberry);border-color:var(--mulberry);box-shadow:0 0 0 4px var(--mulberry-soft)}
.stl-card{flex:1;margin:7px 0 7px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.stl-card.is-anchor{border-color:var(--mulberry-line);background:linear-gradient(180deg,var(--mulberry-soft),var(--card))}
.stl-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.stl-title{font-size:15px;font-weight:700;line-height:1.25}
.stl-loc{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.stl-vtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.schedule-vtag{font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 9px}

/* services */
/* ===== Services surface — scoped, palette-vars only ===== */

/* list-detail: summary rail | card grid | detail pane (mirrors .guestwrap) */
.services-wrap{display:grid;grid-template-columns:236px 1fr 332px;gap:16px;align-items:start}
/* narrower desktop: drop the detail pane into the grid column flow */
@media(max-width:1320px){.services-wrap{grid-template-columns:236px 1fr}}
@media(max-width:1320px){.services-wrap .gdetail{display:none}}

/* ---- left rail apparatus hero ---- */
.services-apparatus{border:1px solid var(--gold-line);background:linear-gradient(180deg,var(--gold-soft),var(--card));
  border-radius:12px;padding:16px 15px;text-align:center;margin-bottom:4px}
.services-app-ico{width:42px;height:42px;border-radius:11px;margin:0 auto 9px;display:grid;place-items:center;
  font-size:19px;color:#fff;background:linear-gradient(135deg,var(--mulberry),#7a3a55)}
.services-app-l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.services-app-n{font-family:Georgia,serif;font-size:26px;font-weight:700;margin-top:3px;color:var(--mulberry)}
.services-app-s{font-size:12px;color:var(--ink-soft);margin-top:6px}

.services-tip{margin-top:16px;font-size:12px;line-height:1.55;color:var(--ink-soft);
  border-top:1px dashed var(--line);padding-top:13px}
.services-tip b{color:var(--ink);font-weight:700}

/* ---- center column ---- */
.services-mid{min-width:0}
.services-sechead{display:flex;align-items:baseline;gap:10px;margin:4px 2px 12px}
.services-sechead:not(:first-child){margin-top:22px}
.services-sechead h2{font-size:17px;margin:0;font-weight:700}
.services-sechead .count{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--line);
  border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums}

/* the FILL-not-stretch grid: more columns as width grows */
.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:14px}

.services-card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px 13px;cursor:pointer;
  transition:box-shadow .12s,transform .06s,border-color .12s;min-height:184px}
.services-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--gold-line)}
.services-card.is-active{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-soft),var(--card))}
.services-card.sel{border-color:var(--mulberry);box-shadow:inset 0 0 0 1px var(--mulberry),var(--shadow)}

.services-c-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.services-c-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:21px;
  background:var(--bg);border:1px solid var(--line)}
.services-card.is-active .services-c-ico{background:var(--card);border-color:var(--gold-line)}
.services-c-state{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  border-radius:99px;padding:3px 9px;color:var(--ink-soft);background:var(--line)}
.services-c-state.on{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}

.services-c-name{font-size:15.5px;font-weight:700;line-height:1.25}
.services-c-one{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:5px;flex:1}

.services-c-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.services-c-price{font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--mulberry);line-height:1}
.services-c-price small{display:block;font-family:system-ui;font-size:10.5px;font-weight:600;
  color:var(--ink-faint);margin-top:3px;letter-spacing:.02em}
.services-c-cta{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}

.services-empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:34px;text-align:center;color:var(--ink-faint);font-size:13px}

/* ---- right detail pane ---- */
.services-d-ico{width:60px;height:60px;border-radius:15px;margin:0 auto 10px;display:grid;place-items:center;
  font-size:28px;background:var(--card);border:1px solid var(--gold-line)}
.services-d-desc{font-size:12.5px;line-height:1.6;color:var(--ink-soft);background:var(--bg);
  border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-top:14px}
.services-d-link{display:block;width:100%;margin-top:9px;background:none;border:none;cursor:pointer;
  font:600 12.5px system-ui;color:var(--gold);padding:6px}
.services-d-link:hover{text-decoration:underline}

/* findyourdate */
/* ============================================================
   FIND YOUR DATE — scoped styles (palette vars only)
   Layout: calendar (main) + side intelligence; ultrawide adds a
   third "compare weekends" column. Fill-don't-stretch.
   ============================================================ */

.findyourdate-grid{
  display:grid;gap:18px;align-items:start;
  grid-template-columns:minmax(0,1.55fr) 372px;
  grid-template-areas:"cal side";
}
.findyourdate-cal{grid-area:cal}
.findyourdate-side{grid-area:side}
.findyourdate-shortlist{grid-area:short;display:none}
/* ultrawide: promote the shortlist into a real third column */
@media(min-width:1700px){
  .findyourdate-grid{
    grid-template-columns:minmax(0,1.45fr) 360px 340px;
    grid-template-areas:"cal side short";
  }
  .findyourdate-shortlist{display:block}
}

/* ---------- calendar ---------- */
.findyourdate-navwk{display:flex;gap:7px}
.findyourdate-navbtn{width:30px;height:30px;font-size:15px;line-height:1}

.findyourdate-legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.findyourdate-lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);font-weight:600}
.findyourdate-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--ink-faint)}
.findyourdate-dot.best{background:var(--mulberry)}
.findyourdate-dot.good{background:var(--sage)}
.findyourdate-dot.ok{background:var(--gold)}
.findyourdate-dot.busy{background:var(--rose)}

.findyourdate-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.findyourdate-dowh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;text-align:center;padding:2px 0}
.findyourdate-dowh.wknd{color:var(--mulberry)}

.findyourdate-cells{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.findyourdate-cell{
  position:relative;border:1px solid var(--line);border-radius:11px;background:var(--card);
  min-height:74px;padding:9px 10px;display:flex;flex-direction:column;justify-content:space-between;
  transition:box-shadow .12s,transform .06s,border-color .12s;
}
.findyourdate-cell.pad{border:none;background:transparent;min-height:0}
.findyourdate-cell.wknd{background:var(--bg)}
.findyourdate-cell.hasinfo{cursor:pointer}
.findyourdate-cell.hasinfo:hover{border-color:var(--gold-line);box-shadow:var(--shadow);transform:translateY(-1px)}
.findyourdate-num{font-family:Georgia,serif;font-size:18px;font-weight:700;line-height:1}
.findyourdate-cell.wknd .findyourdate-num{color:var(--mulberry)}

.findyourdate-mini{display:flex;align-items:center;gap:5px}
.findyourdate-minig{font-size:11px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* selected / best emphasis */
.findyourdate-cell.best{background:var(--gold-soft);border-color:var(--gold-line)}
.findyourdate-cell.sel{border-color:var(--mulberry);box-shadow:inset 0 0 0 1px var(--mulberry),var(--shadow)}
.findyourdate-cell.sel .findyourdate-num{color:var(--mulberry)}
.findyourdate-cell.best.sel{background:var(--gold-soft)}

.findyourdate-calfoot{margin-top:14px;font-size:11.5px;color:var(--ink-faint);line-height:1.45}

/* ---------- side: recommendation banner ---------- */
.findyourdate-rec{
  background:linear-gradient(150deg,var(--mulberry),#7a3a55);color:#fff;border-color:var(--mulberry);
  padding:18px 20px;
}
body.dark .findyourdate-rec{background:linear-gradient(150deg,#5C2542,#3f1a2e)}
.findyourdate-recflag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.82;font-weight:700}
.findyourdate-recdate{display:flex;align-items:baseline;gap:11px;margin:6px 0 12px}
.findyourdate-recd{font-size:36px;font-weight:700;line-height:1}
.findyourdate-recwk{font-size:13px;opacity:.85}
.findyourdate-recline{font-size:13.5px;line-height:1.5;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
.findyourdate-recline b{font-weight:700}
.findyourdate-recnote{font-size:12.5px;opacity:.84;margin-top:7px;line-height:1.5}

/* ---------- guest availability ---------- */
.findyourdate-availtop{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.findyourdate-bign{font-size:30px;font-weight:700;line-height:1;flex:0 0 auto;color:var(--mulberry)}
.findyourdate-bign small{font-size:15px;color:var(--ink-faint);font-family:system-ui}
.findyourdate-availk{font-size:12px;color:var(--ink-soft);line-height:1.4}
.findyourdate-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.findyourdate-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),#7a8f52)}
.findyourdate-split{display:flex;flex-direction:column;gap:2px}
.findyourdate-leg{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.findyourdate-sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.findyourdate-sp{flex:1;color:var(--ink-soft)}
.findyourdate-leg b{font-variant-numeric:tabular-nums}

/* ---------- vendor calendars ---------- */
.findyourdate-vrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.findyourdate-vrow:last-child{border-bottom:none}
.findyourdate-vmeta{flex:1;min-width:0}
.findyourdate-vmeta b{font-weight:700;font-size:13.5px}
.findyourdate-vmeta small{display:block;color:var(--ink-soft);font-size:11.5px}

/* ---------- markers ---------- */
.findyourdate-mk{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.findyourdate-mk:last-child{border-bottom:none}
.findyourdate-mkico{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;
  background:var(--gold-soft);border:1px solid var(--gold-line)}
.findyourdate-mkico.mulberry{background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.findyourdate-mkico.sage{background:var(--sage-soft);border-color:var(--sage-line)}
.findyourdate-mkb{flex:1}
.findyourdate-mkb b{font-weight:700;font-size:13px}
.findyourdate-mkb small{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:1px;line-height:1.4}

/* ---------- compare weekends (ultrawide column) ---------- */
.findyourdate-cmp{display:flex;flex-direction:column;gap:8px}
.findyourdate-cmprow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;font:inherit;color:var(--ink)}
.findyourdate-cmprow:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.findyourdate-cmprow.on{border-color:var(--mulberry);box-shadow:inset 0 0 0 1px var(--mulberry)}
.findyourdate-cmpdate{flex:0 0 auto;width:38px;text-align:center}
.findyourdate-cmpd{display:block;font-size:19px;font-weight:700;line-height:1}
.findyourdate-cmpw{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.findyourdate-cmpmeta{flex:1;min-width:0}
.findyourdate-cmptag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 8px;border-radius:99px;color:var(--ink-soft);background:var(--line)}
.findyourdate-cmptag.best{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.findyourdate-cmptag.good{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}
.findyourdate-cmptag.ok{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
.findyourdate-cmptag.busy{color:var(--rose);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.findyourdate-cmpstats{display:block;font-size:12px;color:var(--ink-soft);margin-top:4px}
.findyourdate-cmpstats b{font-variant-numeric:tabular-nums;color:var(--ink)}
.findyourdate-cmpfoot{padding:14px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-faint);line-height:1.45}
.findyourdate-cmpfk{color:var(--ink-soft)}

/* messages */
/* ============ MESSAGES — 3-pane list-detail (threads · conversation · context) ============ */
/* Fill-don't-stretch: fixed thread + context rails, the CONVERSATION takes the flex middle.
   On ultrawide the middle widens (1.6fr) instead of any column being stretched alone. */
.messages-wrap{display:grid;grid-template-columns:312px minmax(0,1fr) 290px;gap:16px;align-items:stretch;
  height:calc(100vh - 62px - 26px - 60px - 86px)}
@media(min-width:1700px){.messages-wrap{grid-template-columns:340px minmax(0,1.6fr) 320px}}

/* ---- shared logo mark (company logo stand-in — never a personal photo) ---- */
.messages-logo{position:relative;flex:0 0 auto;width:42px;height:42px;border-radius:11px;
  background:linear-gradient(135deg,var(--mulberry),#7a3a55);color:#fff;display:grid;place-items:center;
  font-family:Georgia,serif;font-size:14px;letter-spacing:.02em;font-weight:700}
.messages-logo.sm{width:30px;height:30px;border-radius:9px;font-size:11px}
.messages-logo.lg{width:46px;height:46px;border-radius:12px;font-size:15px}
.messages-logo.xl{width:66px;height:66px;border-radius:16px;font-size:22px;margin:0 auto}
.messages-dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--card)}

/* ---- LEFT: thread list ---- */
.messages-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.messages-list-h{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.messages-list-title{font-size:16px;font-weight:700}
.messages-search{display:flex;align-items:center;gap:7px;margin:11px 14px 4px;background:var(--bg);
  border:1px solid var(--line);border-radius:99px;padding:7px 12px}
.messages-search input{border:none;outline:none;background:none;font:13px system-ui;color:var(--ink);flex:1}
.messages-list-scroll{flex:1;overflow-y:auto;padding:6px 8px 10px}
.messages-list-scroll::-webkit-scrollbar{width:8px}
.messages-list-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.messages-row{display:flex;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;align-items:flex-start}
.messages-row:hover{background:var(--gold-soft)}
.messages-row.sel{background:var(--gold-soft);border-color:var(--gold-line)}
.messages-row-b{flex:1;min-width:0}
.messages-row-top{display:flex;align-items:baseline;gap:8px}
.messages-vname{font-size:13.5px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.messages-when{flex:0 0 auto;font-size:11px;color:var(--ink-faint)}
.messages-row-bot{display:flex;align-items:center;gap:8px;margin-top:2px}
.messages-preview{flex:1;min-width:0;font-size:12.5px;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.messages-unread{flex:0 0 auto;font-size:10.5px;font-weight:700;color:#fff;background:var(--mulberry);
  border-radius:99px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.messages-row-cat{font-size:11px;color:var(--ink-faint);margin-top:4px}

/* ---- CENTER: conversation ---- */
.messages-convo{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.messages-convo-h{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);
  background:rgba(251,251,250,.5)}
body.dark .messages-convo-h{background:rgba(255,255,255,.02)}
.messages-convo-id{display:flex;flex-direction:column;min-width:0}
.messages-convo-id b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.messages-pres{font-size:11.5px;margin-top:1px}
.messages-convo-h .iconbtn{width:32px;height:32px;font-size:14px}

.messages-stream{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px;
  background:var(--bg)}
.messages-stream::-webkit-scrollbar{width:8px}
.messages-stream::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* pinned non-dismissible privacy notice — no avatar, no sender label */
.messages-notice{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.45;color:var(--ink-soft);
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:12px;padding:11px 14px;margin-bottom:2px}
.messages-notice-ico{flex:0 0 auto;font-size:13px;margin-top:1px}
.messages-daysep{text-align:center;font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em;margin:4px 0}
.messages-daysep span{background:var(--bg);padding:0 12px;position:relative}

.messages-msg{display:flex;gap:9px;max-width:74%;align-items:flex-end}
.messages-msg.them{align-self:flex-start}
.messages-msg.me{align-self:flex-end;flex-direction:row-reverse}
.messages-bubble{position:relative;font-size:13.5px;line-height:1.45;padding:10px 13px 18px;border-radius:15px;
  box-shadow:var(--shadow)}
.messages-msg.them .messages-bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--ink)}
.messages-msg.me .messages-bubble{background:var(--mulberry);color:#fff;border-bottom-right-radius:5px}
.messages-time{font-size:9.5px;margin-top:5px;opacity:.6;position:absolute;bottom:5px;left:13px;right:13px;
  white-space:nowrap}
.messages-msg.me .messages-time{text-align:right;color:rgba(255,255,255,.85)}
.messages-react{position:absolute;bottom:-9px;right:8px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;font-size:11px;padding:1px 5px;box-shadow:var(--shadow)}

/* file / image bubble */
.messages-bubble.file{display:flex;align-items:center;gap:11px;padding:11px 13px 20px;min-width:210px}
.messages-file-ico{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;
  background:var(--gold-soft);border:1px solid var(--gold-line)}
.messages-msg.me .messages-file-ico{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28)}
.messages-file-ico.sm{width:30px;height:30px;font-size:14px}
.messages-file-b{flex:1;min-width:0}
.messages-file-b b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.messages-file-b small{font-size:11px;opacity:.7}
.messages-file-dl{flex:0 0 auto;font-size:15px;opacity:.7;cursor:pointer}

/* composer */
.messages-composer{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:12px 16px;border-top:1px solid var(--line)}
.messages-composer .iconbtn{width:34px;height:34px;font-size:16px}
.messages-input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:9px 15px}
.messages-input input{width:100%;border:none;outline:none;background:none;font:13.5px system-ui;color:var(--ink)}
.messages-send{padding:9px 18px}

/* ---- RIGHT: context rail ---- */
.messages-ctx{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.messages-ctx-hero{padding:22px 18px 16px;text-align:center;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--mulberry-soft),transparent)}
.messages-ctx-name{font-size:17px;font-weight:700;margin-top:11px}
.messages-ctx-sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.messages-ctx-actions{display:flex;gap:8px;margin-top:14px}
.messages-ctx-actions .btn{flex:1;padding:8px 10px;font-size:12px}
.messages-ctx-b{flex:1;overflow-y:auto;padding:14px 18px 18px}
.messages-ctx-b::-webkit-scrollbar{width:8px}
.messages-ctx-b::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.messages-ctx-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;margin:18px 0 9px}
.messages-ctx-lbl:first-child{margin-top:0}
.messages-ctx-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.messages-ctx-row:last-child{border-bottom:none}
.messages-ctx-row .k{color:var(--ink-soft)}
.messages-ctx-files{display:flex;flex-direction:column;gap:8px}
.messages-ctx-file{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:11px;cursor:pointer}
.messages-ctx-file:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.messages-ctx-empty{font-size:12.5px;color:var(--ink-faint);padding:6px 2px}
.messages-ctx-coord{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px dashed var(--line);
  border-radius:12px;font-size:12.5px}
.messages-ctx-coord b{display:block;font-weight:600;font-size:13px}
.messages-ctx-coord small{color:var(--ink-soft);font-size:11.5px;line-height:1.4}

/* contracts */
/* ===== Contracts surface (couple sign-side · 0032) — scoped extras only, palette vars only ===== */

/* list-detail: list column | detail. On ultrawide the detail's own inner grid adds the column,
   so we widen the list a touch but never stretch a lone pane. */
.contracts-wrap{display:grid;grid-template-columns:392px 1fr;gap:18px;align-items:start}
@media(min-width:1700px){.contracts-wrap{grid-template-columns:432px 1fr}}

/* ---- LEFT column ---- */
.contracts-list{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.contracts-chips{margin-bottom:0}
.contracts-chipn{font-variant-numeric:tabular-nums;opacity:.7;margin-left:3px}

.contracts-sumcard .card-b{padding:14px 16px}
.contracts-sumtop{display:flex;align-items:center;justify-content:space-between;gap:14px}
.contracts-sumn{font-size:26px;font-weight:700;line-height:1;color:var(--sage)}
.contracts-sumn span{font-size:15px;color:var(--ink-faint)}
.contracts-suml{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.contracts-sumring{width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center}
.contracts-sumring span{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;
  font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.contracts-sumbar{height:6px;border-radius:99px;background:var(--line);margin-top:12px;overflow:hidden}
.contracts-sumbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),#7c8f57)}

.contracts-rowsbox .card-b{padding:0}
.contracts-rows{display:flex;flex-direction:column;max-height:calc(100vh - 360px);overflow-y:auto}
.contracts-rows::-webkit-scrollbar{width:8px}
.contracts-rows::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.contracts-empty{padding:28px 16px;text-align:center;color:var(--ink-faint);font-size:13px}

.contracts-row{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;
  position:relative;border-left:3px solid transparent}
.contracts-row:last-child{border-bottom:none}
.contracts-row:hover{background:var(--gold-soft)}
.contracts-row.sel{background:var(--gold-soft);border-left-color:var(--gold)}
.contracts-vlogo{width:42px;height:42px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  font-size:18px;border:1px solid var(--gold-line)}
.contracts-rmeta{flex:1;min-width:0}
.contracts-rtitle{font-weight:700;font-size:13.5px;line-height:1.3}
.contracts-rvendor{font-size:11.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contracts-rfoot{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.contracts-exp{font-size:10.5px;font-weight:700;color:var(--mulberry)}
.contracts-rwhen{font-size:11px;color:var(--ink-faint);margin-left:auto}

/* ---- RIGHT detail ---- */
.contracts-detail{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;position:sticky;top:0}

.contracts-dhero{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--gold-soft),transparent)}
.contracts-dlogo{width:52px;height:52px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  font-size:24px;border:1px solid var(--gold-line)}
.contracts-dhmeta{flex:1;min-width:0}
.contracts-dtitle{font-size:19px;font-weight:700;line-height:1.2}
.contracts-dsub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.contracts-dpill{flex:0 0 auto;align-self:flex-start}

.contracts-banner{display:flex;align-items:center;gap:10px;margin:16px 22px 0;padding:11px 14px;
  border-radius:11px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--bg)}
.contracts-bnico{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--card)}
.contracts-banner.you{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.contracts-banner.you .contracts-bnico{background:var(--card);color:var(--gold)}
.contracts-banner.done{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}
.contracts-banner.wait{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.contracts-banner.draft{color:var(--ink-soft)}

/* inner two-column body — this is the "add a column" move on the detail pane */
.contracts-dgrid{display:grid;grid-template-columns:1fr;gap:0;padding:16px 22px 4px}
@media(min-width:1240px){.contracts-dgrid{grid-template-columns:1fr 320px;gap:24px}}
@media(min-width:1700px){.contracts-dgrid{grid-template-columns:1fr 360px}}
.contracts-dcol{min-width:0;display:flex;flex-direction:column;gap:18px}

.contracts-block{}
.contracts-blockh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;margin-bottom:10px}

.contracts-party{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.contracts-party:last-child{border-bottom:none}
.contracts-pwho{flex:0 0 54px;font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
.contracts-pname{font-size:13.5px;font-weight:600}

.contracts-terms{display:flex;flex-direction:column;gap:1px}
.contracts-term{padding:10px 0;border-bottom:1px solid var(--line)}
.contracts-term:last-child{border-bottom:none}
.contracts-tk{font-size:11.5px;color:var(--ink-soft);margin-bottom:3px}
.contracts-tv{font-size:13px;line-height:1.45}
.contracts-term.emph .contracts-tv{font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:700;
  color:var(--mulberry);font-variant-numeric:tabular-nums}

.contracts-compliance{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:11px;border:1px solid var(--line)}
.contracts-compliance small{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:3px;font-weight:400}
.contracts-compliance b{font-size:13px}
.contracts-compico{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.contracts-compliance.sage{background:var(--sage-soft);border-color:var(--sage-line);color:var(--sage)}
.contracts-compliance.sage .contracts-compico{background:var(--sage)}
.contracts-compliance.gold{background:var(--gold-soft);border-color:var(--gold-line);color:#8a6d2f}
.contracts-compliance.gold .contracts-compico{background:var(--gold)}

/* document-preview placeholder — a faux page sheet */
.contracts-preview{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.contracts-page{margin:14px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:16px 16px 12px;box-shadow:var(--shadow);aspect-ratio:1/1.18;display:flex;flex-direction:column}
.contracts-pagehdr{font-family:Georgia,serif;font-size:12.5px;font-weight:700;padding-bottom:10px;
  border-bottom:1px solid var(--line);color:var(--ink)}
.contracts-pagelines{flex:1;display:flex;flex-direction:column;gap:9px;padding-top:14px}
.contracts-pagelines i{display:block;height:7px;border-radius:99px;background:var(--line)}
.contracts-pagefoot{font-size:8.5px;color:var(--ink-faint);text-align:center;padding-top:8px;border-top:1px dashed var(--line)}
.contracts-prevcap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;font-size:12px;color:var(--ink-soft)}
.contracts-viewbtn{padding:6px 11px;font-size:12px}

/* signature ladder */
.contracts-ladder{display:flex;flex-direction:column;gap:10px}
.contracts-sigrow{display:flex;gap:11px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--bg)}
.contracts-sigdot{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink-faint)}
.contracts-sigrow.done{background:var(--sage-soft);border-color:var(--sage-line)}
.contracts-sigrow.done .contracts-sigdot{background:var(--sage);border-color:var(--sage);color:#fff}
.contracts-sigrow.you{background:var(--gold-soft);border-color:var(--gold-line)}
.contracts-sigrow.you .contracts-sigdot{background:var(--gold);border-color:var(--gold);color:#fff}
.contracts-sigbody{flex:1;min-width:0}
.contracts-sigwho{font-size:11px;color:var(--ink-soft);font-weight:600}
.contracts-signed{font-size:17px;font-weight:700;line-height:1.2;margin-top:2px}
.contracts-sigwait{font-size:13.5px;font-weight:700;margin-top:2px}
.contracts-sigrow.you .contracts-sigwait{color:#8a6d2f}
.contracts-sigmeta{font-size:11px;color:var(--ink-faint);margin-top:3px}

/* action bar */
.contracts-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 22px;
  margin-top:6px;border-top:1px solid var(--line);background:var(--alabaster)}
.contracts-actnote{flex:1;min-width:160px;font-size:12px;color:var(--ink-soft)}
.contracts-actright{display:flex;gap:8px;flex-wrap:wrap}

/* website */
/* ============================================================
   WEBSITE surface — landing-page studio (preview + controls)
   Scoped under .website- · palette vars only.
   ============================================================ */

/* 2-col: device preview (fluid) | controls (fixed). FILL-DON'T-STRETCH:
   on ultrawide the preview grows and the control column splits into 2. */
.website-grid{display:grid;gap:20px;align-items:start;grid-template-columns:minmax(0,1fr) 360px}
.website-ctrl{display:flex;flex-direction:column;gap:16px}
@media(min-width:1700px){
  .website-grid{grid-template-columns:minmax(0,1fr) 760px}
  .website-ctrl{display:grid;grid-template-columns:1fr 1fr;align-content:start}
}

/* ---- stage (left) ---- */
.website-stage{position:sticky;top:0}
.website-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.website-seg{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.website-seg button{font:600 12.5px system-ui;border:none;background:none;color:var(--ink-soft);border-radius:7px;padding:6px 12px;cursor:pointer}
.website-seg button.on{background:var(--mulberry);color:#fff}
.website-phasepill{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line);border-radius:99px;padding:5px 12px;white-space:nowrap}
.website-cap{margin-top:14px;font-size:12.5px;color:var(--ink-soft);max-width:640px;line-height:1.55}

/* ---- browser frame ---- */
.website-browser{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow-lg)}
.website-browser.is-draft{opacity:.97}
.website-chrome{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--alabaster);border-bottom:1px solid var(--line)}
.website-dots{display:flex;gap:6px}
.website-dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.website-omni{flex:1;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.website-lock{font-size:10px}
.website-chev{color:var(--ink-faint);font-size:13px}
.website-viewport{position:relative;height:560px;overflow-y:auto;background:var(--bg)}
.website-viewport::-webkit-scrollbar{width:9px}
.website-viewport::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

/* ---- phone frame ---- */
.website-phonewrap{display:grid;place-items:start center;padding-top:4px}
.website-phone{position:relative;width:300px;border:9px solid var(--obsidian);border-radius:42px;overflow:hidden;background:var(--obsidian);box-shadow:var(--shadow-lg)}
.website-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:22px;background:var(--obsidian);border-radius:0 0 14px 14px;z-index:3}
.website-vp-phone{height:600px;border-radius:32px}

/* ---- draft veil ---- */
.website-veil{position:absolute;inset:0;background:color-mix(in srgb,var(--obsidian) 38%,transparent);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:4}
.website-veil-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px;text-align:center;box-shadow:var(--shadow-lg);max-width:240px}
.website-veil-card .bi{font-size:26px;margin-bottom:6px}
.website-veil-card b{display:block;font-family:Georgia,serif;font-size:16px}
.website-veil-card span{display:block;font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.5}

/* ---- the rendered invitation site ---- */
.website-site{--w-accent:var(--gold);--w-soft:var(--gold-soft);--w-line:var(--gold-line);
  background:var(--card);min-height:100%}
.website-hero{padding:42px 26px 22px;text-align:center;background:linear-gradient(180deg,var(--w-soft),var(--card))}
.website-eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px}
.website-mono{width:62px;height:62px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
  font-family:Georgia,serif;font-size:18px;color:var(--w-accent);background:var(--card);border:2px solid var(--w-accent)}
.website-couple{font-size:40px;font-weight:700;line-height:1.04;color:var(--ink)}
.website-couple span{color:var(--w-accent);font-style:italic;font-weight:400}
.website-rule{width:46px;height:2px;background:var(--w-accent);margin:16px auto 12px;opacity:.7}
.website-when{font-size:11px;letter-spacing:.18em;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.website-count{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:4px 26px 26px;background:linear-gradient(180deg,var(--w-soft),var(--card))}
.website-cbox{border:1px solid var(--w-line);background:var(--card);border-radius:10px;padding:11px 4px;text-align:center}
.website-cbox b{display:block;font-size:22px;color:var(--mulberry)}
.website-cbox span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px;display:block}

.website-sec{padding:24px 26px;border-top:1px solid var(--line);text-align:center}
.website-sec-tint{background:var(--w-soft)}
.website-sec-eye{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--w-accent);font-weight:700;margin-bottom:6px}
.website-sec h4{font-size:20px;font-weight:700;margin:0 0 10px;color:var(--ink)}
.website-sec p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.6;max-width:380px;margin-inline:auto}

/* schedule */
.website-sched{display:flex;flex-direction:column;text-align:left;max-width:360px;margin:6px auto 0}
.website-srow{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line)}
.website-srow:last-child{border-bottom:none}
.website-stime{flex:0 0 auto;width:40px;font-family:Georgia,serif;font-size:14px;color:var(--w-accent);font-variant-numeric:tabular-nums}
.website-sbody b{display:block;font-size:13.5px;color:var(--ink)}
.website-sbody small{font-size:11.5px;color:var(--ink-soft)}

/* rsvp */
.website-rsvp{background:linear-gradient(180deg,var(--w-soft),var(--card));border-top:1px solid var(--w-line)}
.website-rsvp-btns{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:4px auto 0}
.website-rbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.website-rbtn.on{background:var(--mulberry);color:#fff;border-color:var(--mulberry)}
.website-rsvp-meta{font-size:11.5px;color:var(--ink-faint);margin-top:11px}

/* gallery */
.website-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:6px auto 0}
.website-tile{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--w-soft),var(--card));border:1px solid var(--w-line)}
.website-galnote{font-size:11.5px;color:var(--ink-soft);margin-top:12px;max-width:300px;margin-inline:auto}

.website-foot{padding:18px;text-align:center;font-family:Georgia,serif;font-size:11px;letter-spacing:.18em;
  color:var(--ink-faint);border-top:1px solid var(--line)}

/* ============================================================ controls (right) ============================================================ */
.website-card{overflow:visible}

/* publish row */
.website-pubrow{display:flex;align-items:center;gap:12px}
.website-statedot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:var(--ink-faint);box-shadow:0 0 0 4px var(--line)}
.website-statedot.live{background:var(--sage);box-shadow:0 0 0 4px var(--sage-soft)}
.website-pubmeta{flex:1}
.website-pubmeta b{font-size:14px;font-weight:700}
.website-pubmeta small{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.45}

/* toggle switch (shared by publish + section rows) */
.website-switch{flex:0 0 auto;width:42px;height:24px;border-radius:99px;border:1px solid var(--line);background:var(--bg);
  cursor:pointer;padding:0;position:relative;transition:background .15s,border-color .15s}
.website-switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--card);
  box-shadow:var(--shadow);transition:left .15s}
.website-switch.on{background:var(--mulberry);border-color:var(--mulberry)}
.website-switch.on i{left:20px}
.website-switch.sm{width:38px;height:22px}
.website-switch.sm i{width:16px;height:16px}
.website-switch.sm.on i{left:18px}

/* slug box */
.website-slugbox{display:flex;align-items:center;gap:1px;border:1px solid var(--line);border-radius:11px;
  background:var(--bg);padding:10px 12px;font-size:13.5px}
.website-slug-pre{color:var(--ink-faint)}
.website-slug-val{color:var(--ink);font-weight:700}
.website-slug-edit{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:12px}
.website-slug-edit:hover{border-color:var(--gold-line);color:var(--ink)}
.website-slug-ok{font-size:11.5px;color:var(--sage);margin-top:7px}

/* share row + QR */
.website-share{display:flex;gap:13px;align-items:flex-start;margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}
.website-qr{flex:0 0 auto;width:76px;height:76px;border:1px solid var(--line);border-radius:11px;padding:5px;background:var(--card)}
.website-share-b{flex:1;min-width:0}
.website-share-b b{font-size:13px;font-weight:700}
.website-share-b small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.45}
.website-sharechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.website-sharechip{font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:99px;padding:4px 10px;cursor:pointer}
.website-sharechip:hover{border-color:var(--gold-line);background:var(--gold-soft);color:#8a6d2f}

/* section toggle list */
.website-seclist{display:flex;flex-direction:column;gap:2px;padding-top:6px;padding-bottom:6px}
.website-secrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.website-secrow:last-child{border-bottom:none}
.website-secrow.off{opacity:.62}
.website-sec-ico{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  background:var(--gold-soft);border:1px solid var(--gold-line)}
.website-secrow.off .website-sec-ico{background:var(--bg);border-color:var(--line);filter:grayscale(.5)}
.website-sec-meta{flex:1;min-width:0}
.website-sec-meta b{font-size:13.5px;font-weight:600}
.website-sec-meta small{display:block;font-size:11.5px;color:var(--ink-soft)}
.website-sec-lock{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:99px;padding:4px 9px}

/* theme swatches */
.website-swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.website-swatch{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card);
  border-radius:11px;padding:10px 12px;cursor:pointer;text-align:left}
.website-swatch:hover{border-color:var(--gold-line)}
.website-swatch.on{border-color:var(--mulberry);background:var(--mulberry-soft)}
.website-sw-dot{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.website-sw-name{font-size:13px;font-weight:600}
.website-themehint{font-size:11.5px;color:var(--ink-soft);margin-top:11px;line-height:1.5}

/* addons */
/* ============ ADD-ONS surface — scoped extras (palette vars only) ============ */

/* two-pane: summary rail | apparatus cards. On wide screens the rail stays fixed
   and the cards fill into more columns (fill-don't-stretch). */
.addons-grid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media(max-width:1180px){.addons-grid{grid-template-columns:1fr}}

.addons-rail{position:sticky;top:0}

/* ---- summary rail ---- */
.addons-total{text-align:center;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.addons-total .n{font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--mulberry);line-height:1}
.addons-total .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px}
.addons-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.addons-mstat{text-align:center;border:1px solid var(--line);border-radius:11px;padding:9px 4px;background:var(--bg)}
.addons-mstat .v{font-family:Georgia,serif;font-size:19px;font-weight:700}
.addons-mstat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-top:1px}

.addons-jump{display:flex;flex-direction:column;gap:4px}
.addons-jrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;
  background:none;border-radius:11px;padding:8px 9px;cursor:pointer;color:var(--ink);transition:background .12s,border-color .12s}
.addons-jrow:hover{background:var(--gold-soft)}
.addons-jrow.on{background:var(--gold-soft);border-color:var(--gold-line)}
.addons-jico{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px}
.addons-jmeta{flex:1;min-width:0}
.addons-jmeta b{font-weight:600;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addons-jmeta small{font-size:11px;color:var(--ink-soft)}
.addons-jbar{flex:0 0 auto;width:46px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.addons-jbar i{display:block;height:100%}

/* ---- main column ---- */
.addons-mainhead{margin:2px 0 14px}
.addons-mainhead h2{font-size:18px;font-weight:700;margin:0}
.addons-hint{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:3px}

/* cards fill into more columns as width grows — never one stretched column */
.addons-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;align-items:start}

.addons-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 17px;cursor:pointer;transition:box-shadow .12s,transform .06s,border-color .12s;display:flex;flex-direction:column}
.addons-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.addons-card.spot{border-color:var(--gold-line);box-shadow:var(--shadow-lg)}
.addons-card.spot::before{content:"";position:absolute}

.addons-ctop{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.addons-cico{flex:0 0 auto;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.addons-ctitle{flex:1;min-width:0}
.addons-ctitle b{font-family:Georgia,serif;font-weight:700;font-size:15px;display:block;line-height:1.2}
.addons-ctitle small{font-size:11.5px;color:var(--ink-soft)}

.addons-cnote{margin:0 0 13px;font-size:12.5px;color:var(--ink-soft);line-height:1.45}

.addons-meter{margin-bottom:14px}
.addons-mtop{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:6px}
.addons-mtop b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.addons-mbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.addons-mbar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.addons-mbar i.done{opacity:.92}

.addons-cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;
  padding-top:13px;border-top:1px solid var(--line)}
.addons-cprice b{font-family:Georgia,serif;font-weight:700;font-size:15px}
.addons-cprice span{font-size:11px;color:var(--ink-faint);margin-left:5px;letter-spacing:.04em;text-transform:uppercase}
.addons-cacts{display:flex;gap:7px}
.addons-mini-btn{padding:6px 11px;font-size:12px}

/* "ready to render" pill — sage family (reuses palette, no new colors) */
.pill.addons-ready{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}

/* ---- explore strip ---- */
.addons-explore{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:linear-gradient(135deg,var(--gold-soft),transparent);border:1px solid var(--gold-line);
  border-radius:var(--radius);padding:16px 18px}
.addons-exhead{display:flex;align-items:center;gap:13px}
.addons-exico{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-size:22px;font-weight:700;background:var(--card);border:1px solid var(--gold-line);color:var(--gold)}
.addons-exhead b{font-family:Georgia,serif;font-size:15px;font-weight:700;display:block}
.addons-exhead small{font-size:12.5px;color:var(--ink-soft)}
.addons-explore .btn{flex:0 0 auto}

/* ---- tone helpers — map each apparatus to an existing palette accent ---- */
.tone-mulberry{color:var(--mulberry)}
.addons-jico.tone-mulberry,.addons-cico.tone-mulberry{background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.addons-jbar i.tone-mulberry,.addons-mbar i.tone-mulberry{background:var(--mulberry)}

.tone-gold{color:#8a6d2f}
.addons-jico.tone-gold,.addons-cico.tone-gold{background:var(--gold-soft);border:1px solid var(--gold-line)}
.addons-jbar i.tone-gold,.addons-mbar i.tone-gold{background:linear-gradient(90deg,var(--gold),#d8b878)}

.tone-sage{color:var(--sage)}
