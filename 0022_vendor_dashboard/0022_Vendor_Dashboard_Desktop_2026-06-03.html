/* ---------- value helpers ---------- */
function attributes_isFilled(f){
  const v = attributes_data[f.k];
  if(f.type==='multi'||f.type==='open') return Array.isArray(v) && v.length>0;
  if(f.type==='bool') return true;                 // a toggle always has a value
  if(f.type==='text') return !!(v && String(v).trim());
  if(f.type==='enum') return !!v;
  if(f.type==='int')  return v!=null && v!=='' && Number(v)>0;
  return v!=null;
}
function attributes_allFields(){ return attributes_schema.flatMap(s=>s.fields); }

/* completeness 0-100 across every authored field (the per-category
   completeness_score the vendor sees in 0044 § onboarding). */
function attributes_completeness(){
  const all = attributes_allFields();
  const done = all.filter(attributes_isFilled).length;
  return Math.round(done/all.length*100);
}
/* the visibility gate: required fields filled + upload minimums met. */
function attributes_missingRequired(){
  const all = attributes_allFields();
  return attributes_requiredFields
    .map(k=>all.find(f=>f.k===k))
    .filter(f=>f && !attributes_isFilled(f));
}
function attributes_missingUploads(){ return attributes_uploadReqs.filter(u=>u.have<u.need); }
function attributes_isVisible(){ return attributes_missingRequired().length===0 && attributes_missingUploads().length===0; }

/* facet count = how many marketplace filters her answers populate. */
function attributes_facetCount(){
  return attributes_allFields().filter(f=>f.facet && attributes_isFilled(f)).length;
}

function attributes_rerender(){
  const c = document.getElementById('content');
  if(c) c.replaceChildren(attributesPanel());
}

/* ---------- mutators (classList/rerender model, deterministic) ---------- */
function attributes_toggleMulti(key,val){
  const arr = attributes_data[key] || (attributes_data[key]=[]);
  const i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  attributes_rerender();
}
function attributes_setEnum(key,val){ attributes_data[key]=val; attributes_rerender(); }
function attributes_toggleBool(key){ attributes_data[key]=!attributes_data[key]; attributes_rerender(); }
function attributes_step(key,d,min,max){
  let v = Number(attributes_data[key]||0)+d;
  if(v<min)v=min; if(v>max)v=max;
  attributes_data[key]=v; attributes_rerender();
}
function attributes_removeOpen(key,val){
  const arr = attributes_data[key]||[];
  const i = arr.indexOf(val); if(i>=0)arr.splice(i,1);
  attributes_rerender();
}

/* ---------------- LEFT: completeness ring + visibility checklist + index ---------------- */
function attributes_rail(pct,visible){

  r.appendChild(hero);

  /* visibility checklist — the real "fill these N fields + uploads" gate */
  r.appendChild(el('h4',null,'To appear in search'));
  const miss = attributes_missingRequired();
  const missU = attributes_missingUploads();
  const list = el('div','attributes-check');

  attributes_requiredFields.forEach(k=>{
    const f = attributes_allFields().find(x=>x.k===k);
    const done = attributes_isFilled(f);
    list.appendChild(el('div','attributes-checkrow'+(done?' done':''),
      '<span class="attributes-checkbox">'+(done?'✓':'')+'</span><span>'+f.label+'</span>'));
  });
  attributes_uploadReqs.forEach(u=>{
    const done = u.have>=u.need;
    list.appendChild(el('div','attributes-checkrow'+(done?' done':''),

      '<span>'+u.label+' <small>'+u.have+'/'+u.need+'</small></span>'));
  });
  r.appendChild(list);

  if(miss.length||missU.length){
    const need = el('div','attributes-need');
    const bits=[];
    if(miss.length) bits.push('fill <b>'+miss.map(f=>f.label).join('</b>, <b>')+'</b>');
    if(missU.length) bits.push('add <b>'+missU.map(u=>(u.need-u.have)+' '+u.label.toLowerCase()).join('</b>, <b>')+'</b>');
    need.innerHTML = 'Almost there — '+bits.join(' and ')+' to go live.';
    r.appendChild(need);
  } else {
    r.appendChild(el('div','attributes-need ok','Your Documentary listing meets every marketplace requirement. Couples can find you in search and filters.'));
  }

      '<small>'+done+'/'+s.fields.length+' filled'+(s.shared?' · shared':'')+'</small></span>';
    idx.appendChild(btn);

  const tip = el('div','attributes-tip',
    '<b>Shared fields carry over.</b> Where you work, credentials &amp; pricing fill once and copy to every service you author — edit per service anytime.');
  r.appendChild(tip);
  return r;

/* one labelled field → its control, sized by type (multi-selects span
   the full 2-col width; steppers/toggles sit one-per-cell) */
function attributes_field(f){
  const wide = (f.type==='multi'||f.type==='open');
  const cell = el('div','attributes-cell'+(wide?' wide':''));

  const lab = el('div','attributes-flabel');
  lab.innerHTML = f.label +
    (f.req?'<span class="attributes-req">required</span>':'') +
    (f.facet?'<span class="attributes-facet" title="Couples can filter by this">🔎 filter</span>':'') +
    (f.hint?'<span class="attributes-fhint">'+f.hint+'</span>':'');
  cell.appendChild(lab);

  if(f.type==='multi'){
    const chips = el('div','attributes-chips');
    f.opts.forEach(([val,lbl])=>{
      const on = (attributes_data[f.k]||[]).includes(val);
      const c = el('button','attributes-pchip'+(on?' on':''),(on?'✓ ':'')+lbl);
      c.onclick=()=>attributes_toggleMulti(f.k,val);
      chips.appendChild(c);
    });
    cell.appendChild(chips);

  } else if(f.type==='enum'){
    const chips = el('div','attributes-chips');
    f.opts.forEach(([val,lbl])=>{
      const on = attributes_data[f.k]===val;
      const c = el('button','attributes-pchip seg'+(on?' on':''),lbl);
      c.onclick=()=>attributes_setEnum(f.k,val);
      chips.appendChild(c);
    });
    cell.appendChild(chips);

  } else if(f.type==='int'){
    const step = f.step||1;
    const v = Number(attributes_data[f.k]||0);
    const disp = (f.unit==='₱') ? peso(v) : (v + (f.unit?(' '+f.unit):''));
    const box = el('div','attributes-stepper');
    const minus = el('button','attributes-stepbtn','–');
    const val = el('div','attributes-stepval',disp);
    const plus = el('button','attributes-stepbtn','+');
    minus.onclick=()=>attributes_step(f.k,-step,f.min,f.max);
    plus.onclick =()=>attributes_step(f.k, step,f.min,f.max);
    box.append(minus,val,plus);
    cell.appendChild(box);

  } else if(f.type==='bool'){
    const on = !!attributes_data[f.k];
    const tog = el('button','attributes-toggle'+(on?' on':''));
    tog.innerHTML='<span class="attributes-knob"></span><span class="attributes-toglbl">'+(on?'Yes':'No')+'</span>';
    tog.onclick=()=>attributes_toggleBool(f.k);
    cell.appendChild(tog);

  } else if(f.type==='open'){
    const chips = el('div','attributes-chips');
    (attributes_data[f.k]||[]).forEach(v=>{
      const c = el('span','attributes-opentag',v+' <b>✕</b>');
      c.querySelector('b').onclick=()=>attributes_removeOpen(f.k,v);
      chips.appendChild(c);
    });
    const add = el('span','attributes-openadd','+ add venue');
    chips.appendChild(add);
    cell.appendChild(chips);

  } else if(f.type==='text'){
    const inp = el('input','attributes-input');
    inp.value = attributes_data[f.k]||'';
    inp.placeholder = 'e.g. add a few names';
    inp.oninput=()=>{ attributes_data[f.k]=inp.value; };   // no rerender on keystroke
    cell.appendChild(inp);
  }
  return cell;
}

      '<span class="repertoire-setmeta">'+

          (reqs?(' · <span class="repertoire-reqdot">'+reqs+' requested</span>'):'')+'</span>'+
      '</span>'+
      '<span class="repertoire-setcount">'+set.tracks.length+'</span>';
    list.appendChild(row);
  });

  const add = el('button','repertoire-addset'+(repertoire_isMusicVendor?'':' off'));
  add.innerHTML = '<span>＋</span> Add a song set';

  /* at-a-glance */
  r.appendChild(el('h4',null,'At a glance'));
  const totalTracks = repertoire_sets.reduce((a,s)=>a+s.tracks.length,0);
  const liveCount = repertoire_sets.reduce((a,s)=>a+s.tracks.filter(t=>t.src==='live').length,0);
  const openReq = repertoire_requests.filter(r=>r.state==='open').length;
  [['Song sets',repertoire_sets.length],['Total tracks',totalTracks],['Live performances',liveCount],['Open requests',openReq]]
    .forEach(([k,v])=>r.appendChild(el('div','fstat','<span>'+k+'</span><b>'+v+'</b>')));

/* ---------------- center: selected set track list ---------------- */
function repertoire_detail(){

  if(!set){
    box.appendChild(el('div','repertoire-empty','<div class="bi">🎵</div><div>Select a song set to see and reorder its track list.</div>'));
    return box;
  }

  /* set header band */

  hd.innerHTML =
    '<span class="repertoire-detico">'+set.ico+'</span>'+
    '<div class="repertoire-dettitle">'+
      '<h3 class="serif">'+set.name+'</h3>'+
      '<div class="repertoire-detsub">'+set.tracks.length+' tracks · '+repertoire_fmt(repertoire_runtime(set))+' total · '+set.sub+'</div>'+
    '</div>'+
    '<button class="btn'+(repertoire_isMusicVendor?' primary':'')+'"'+(repertoire_isMusicVendor?'':' disabled')+'>+ Add track</button>';
  box.appendChild(hd);

  /* track table */
  const tbl = el('table');
  const thead = el('thead');
  thead.innerHTML = '<tr><th style="width:42px">#</th><th>Track</th><th>Moment</th><th>Source</th><th style="text-align:right">Length</th><th style="width:78px;text-align:center">Order</th></tr>';
  tbl.appendChild(thead);

  const tb = el('tbody');
  set.tracks.forEach((t,i)=>{
    const tr = el('tr','repertoire-trow');
    const [sLabel,sCls] = repertoire_srcMeta[t.src] || repertoire_srcMeta.track;
    const reqBadge = t.req ? '<span class="repertoire-reqtag">couple request</span>' : '';
    tr.innerHTML =
      '<td class="repertoire-numcell"><span class="repertoire-num">'+(i+1)+'</span></td>'+
      '<td><div class="repertoire-track"><b>'+t.t+'</b><small>'+t.a+'</small></div></td>'+
      '<td><span class="repertoire-moment">'+t.moment+'</span></td>'+
      '<td><span class="pill '+sCls+'">'+sLabel+'</span>'+reqBadge+'</td>'+
      '<td class="tabletag" style="text-align:right">'+repertoire_fmt(t.d)+'</td>';

    /* reorder controls */
    const ord = el('td','repertoire-ordcell');
    const up = el('button','repertoire-ord'+(i===0?' off':''),'▲');
    const dn = el('button','repertoire-ord'+(i===set.tracks.length-1?' off':''),'▼');
    if(repertoire_isMusicVendor){
      if(i>0) up.onclick = ()=>repertoire_move(set.id,i,-1);
      if(i<set.tracks.length-1) dn.onclick = ()=>repertoire_move(set.id,i,1);
    }else{
      up.disabled = true; dn.disabled = true;
      up.classList.add('off'); dn.classList.add('off');
    }
    ord.append(up,dn);
    tr.appendChild(ord);
    tb.appendChild(tr);
  });

  /* footer add-row affordance */
  const foot = el('tr','repertoire-addrow'+(repertoire_isMusicVendor?'':' off'));
  foot.innerHTML = '<td colspan="6"><span class="repertoire-addrow-i">＋</span> Add a track to '+set.name+'</td>';
  if(repertoire_isMusicVendor) foot.onclick = ()=>repertoire_rerender();
  tb.appendChild(foot);

  tbl.appendChild(tb);
  box.appendChild(tbl);
  return box;
}

/* ---------------- right column: couple song requests (fill-don't-stretch on ultrawide) ---------------- */
function repertoire_requestsCol(){
  const c = el('div','repertoire-reqcol');

  const card = el('div','card');
  card.appendChild(el('div','card-h','<h3>Couple requests</h3><span class="count">'+repertoire_requests.filter(r=>r.state==='open').length+' open</span>'));
  const b = el('div','card-b repertoire-reqbody');

  repertoire_requests.forEach(rq=>{
    const item = el('div','repertoire-reqitem repertoire-'+rq.state);
    let stateChip;
    if(rq.state==='added')   stateChip = '<span class="pill yes">In '+rq.set+'</span>';
    else if(rq.state==='declined') stateChip = '<span class="pill no">Declined</span>';
    else stateChip = '<span class="pill pending">Wants '+rq.set+'</span>';

    item.innerHTML =
      '<div class="repertoire-reqhead">'+

      '</div>'+
      '<div class="repertoire-reqfrom">'+rq.couple+' · '+rq.date+(rq.note?(' · <i>'+rq.note+'</i>'):'')+'</div>';

    if(rq.state==='open'){

  card.appendChild(b);

  c.appendChild(el('div','repertoire-foot',
    'Requests sync from the couple\'s Mood Board + chat. Final set lists are confirmed in the signed booking (RA 8792 e-signature).'));
  return c;

function marketing_filtered(){
  return marketing_campaigns.filter(c=> marketing_statusFilter==='all' || c.status===marketing_statusFilter);
}
function marketing_weeklyRun(){
  /* effective weekly spend across ACTIVE campaigns (annual/quarterly amortized) */
  return marketing_campaigns.filter(c=>c.status==='active').reduce((s,c)=>{
    const p=marketing_product(c.productKey);
    if(p.term==='weekly') return s+p.price;
    if(p.term==='12-month commit') return s+Math.round(p.price/52);
    if(p.term==='3-month commit')  return s+Math.round(p.price/13);
    return s;
  },0);
}

    const zopen=marketing_pinOpen(pn.id);
    const on = pn.id===marketing_draft.pinId;

  b.appendChild(zsel);

  /* start date + auto-renew rows */
  const dRow=el('div','gd-row');
  dRow.innerHTML='<span class="k">Start date</span>';
  const dchip=el('span','marketing-datechip','Jun 02, 2026 ▾');

    const bt=el('button',(marketing_draft.auto===(v==='on'))?'on':'',l);

    aseg.appendChild(bt);
  });
  aRow.appendChild(aseg); b.appendChild(aRow);

  /* live cost summary */

    b.appendChild(el('div','marketing-warn',
      '⚠ '+pin.label+' has '+pin.density+' Documentary vendors in 20km — below the '+MARKETING_DENSITY_GATE+'-vendor gate. Pick an open zone to launch.'));

    marketing_rerender();
  };
  b.appendChild(launch);

  const cancel=el('button','services-d-link','Cancel');
  cancel.onclick=()=>{ marketing_mode='view'; marketing_draft={productKey:'boost10', pinId:1, auto:true}; marketing_rerender(); };
  b.appendChild(cancel);

  d.appendChild(b);
  return d;

let verify_sel = 'addr';   // doc whose detail panel is open (a doc still in review)
let verify_filter = 'all'; // all · action · verified

const VERIFY_ST = {
  verified:  { pill:'yes',     label:'Verified',     dot:'var(--sage)',     verb:'Verified' },
  review:    { pill:'pending', label:'In review',    dot:'var(--gold)',     verb:'In review' },
  attention: { pill:'no',      label:'Needs a fix',  dot:'var(--rose)',     verb:'Needs attention' },
  todo:      { pill:'',        label:'Not uploaded', dot:'var(--ink-faint)',verb:'Not uploaded' },
};

function verify_rerender(){
  document.getElementById('content').replaceChildren(verifyPanel());
}
function verify_pick(id){ verify_sel = id; verify_rerender(); }
function verify_setFilter(f){ verify_filter = f; verify_rerender(); }

/* mutate a doc's state (stand-in for the real upload / re-upload flow) */
function verify_act(id, st, file){
  const d = verify_docs.find(x => x.id === id);
  if (!d) return;
  d.st = st;
  if (file !== undefined) d.file = file;
  d.when = st === 'review' ? 'In review · just now'
         : st === 'todo'   ? 'Not uploaded'
         : d.when;
  verify_rerender();
}

function verify_counts(){
  const c = { verified:0, review:0, attention:0, todo:0, reqDone:0, reqTotal:0 };
  verify_docs.forEach(d => {
    c[d.st]++;
    if (d.req){ c.reqTotal++; if (d.st === 'verified') c.reqDone++; }
  });
  c.action = c.attention + c.todo;
  c.pct = Math.round((c.verified / verify_docs.length) * 100);
  return c;
}

/* ============================================================ PANEL ============================================================ */
function verifyPanel(){
  const c = verify_counts();
  const p = el('section','panel show');

  p.appendChild(el('div','surfhead',
    '<div><h1>Verification</h1><p>La Pascual Photo &amp; Video · Documentary · '+verify_docs.length+'-document checklist · '+c.verified+' verified · '+c.action+' need action</p></div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn">Download all (.zip)</button>'+
      '<button class="btn primary">+ Upload document</button>'+
    '</div>'));

  const wrap = el('div','verify-wrap');
  wrap.appendChild(verify_checklist(c));
  wrap.appendChild(verify_statusRail(c));
  p.appendChild(wrap);
  return p;
}

/* -------- LEFT: the checklist form (fills width) -------- */
function verify_checklist(c){
  const col = el('div','verify-col');

  // filter strip
  const strip = el('div','verify-filterbar');
  [['all','All documents',verify_docs.length],
   ['action','Need action',c.action],
   ['verified','Verified',c.verified]]
   .forEach(([f,lbl,n])=>{
     const b = el('button','verify-fbtn'+(verify_filter===f?' on':''),
       lbl+' <span class="count">'+n+'</span>');
     b.onclick = () => verify_setFilter(f);
     strip.appendChild(b);
   });
  col.appendChild(strip);

  // the list of document rows
  const list = el('div','verify-list');
  const rows = verify_docs.filter(d =>
    verify_filter === 'all'      ? true :
    verify_filter === 'verified' ? d.st === 'verified' :
    /* action */                   (d.st === 'todo' || d.st === 'attention'));

  rows.forEach(d => list.appendChild(verify_row(d)));
  if (!rows.length)
    list.appendChild(el('div','verify-empty','Nothing here — every document in this view is sorted.'));
  col.appendChild(list);
  return col;
}

function verify_row(d){
  const s = VERIFY_ST[d.st];
  const row = el('div','verify-doc'+(verify_sel===d.id?' sel':'')+(d.st==='attention'?' warn':''));
  row.onclick = () => verify_pick(d.id);

  // icon tile
  const ico = el('div','verify-doc-ico'+(d.st==='verified'?' done':''), d.ico);

  // body: name + requirement tag + note + filename
  const body = el('div','verify-doc-b');
  body.innerHTML =
    '<div class="verify-doc-top">'+
      '<b>'+d.name+'</b>'+
      (d.req ? '<span class="verify-tag req">Required</span>'
             : '<span class="verify-tag opt">Optional</span>')+
    '</div>'+
    '<div class="verify-doc-note">'+d.note+'</div>'+
    (d.file
      ? '<div class="verify-doc-file"><span class="verify-file-ico">'+(d.st==='attention'?'⚠️':'📎')+'</span>'+d.file+' · <span class="verify-when">'+d.when+'</span></div>'
      : '<div class="verify-doc-file none">'+d.when+'</div>');

  // right: status pill + action button
  const right = el('div','verify-doc-r');
  right.appendChild(el('span','pill '+s.pill, s.label));

  const act = el('button','verify-rowbtn'+(d.st==='todo'?' primary':''),
    d.st==='verified' ? 'Replace' :
    d.st==='review'   ? 'View' :
    d.st==='attention'? 'Re-upload' : 'Upload');
  act.onclick = (e) => {
    e.stopPropagation();
    if (d.st === 'todo')      verify_act(d.id, 'review', d.file || 'uploaded-file');
    else if (d.st==='attention') verify_act(d.id, 'review');
    else                      verify_pick(d.id);
  };
  right.appendChild(act);

  row.append(ico, body, right);
  return row;
}

/* -------- RIGHT: sticky status sidebar -------- */
function verify_statusRail(c){
  const rail = el('div','verify-rail');

  // 1 — overall status banner (VERIFIED)
  const allReq = c.reqDone === c.reqTotal;
  const banner = el('div','verify-banner'+(allReq?' ok':''));
  banner.innerHTML =
    '<div class="verify-banner-badge">'+(allReq?'✓':'…')+'</div>'+
    '<div class="verify-banner-b">'+
      '<div class="verify-banner-state">'+(allReq?'Verified vendor':'Verification in progress')+'</div>'+
      '<div class="verify-banner-sub">'+
        (allReq
          ? 'Your profile is live and bookable across the marketplace.'
          : c.reqDone+' of '+c.reqTotal+' required documents approved.')+
      '</div>'+
    '</div>';
  rail.appendChild(banner);

  // 2 — progress card: ring + required-doc tally
  const prog = el('div','card');
  prog.appendChild(el('div','card-h','<h3>Checklist progress</h3>'));
  const pb = el('div','card-b');
  // conic ring driven by verified percentage (no RNG, deterministic)
  const ring = el('div','verify-ring');
  ring.style.background =
    'conic-gradient(var(--sage) 0 '+c.pct+'%, var(--line) '+c.pct+'% 100%)';
  ring.innerHTML = '<div class="verify-ring-hole"><div class="n">'+c.pct+'%</div><div class="l">verified</div></div>';
  pb.appendChild(ring);

  [['var(--sage)','Verified',c.verified],
   ['var(--gold)','In review',c.review],
   ['var(--rose)','Needs a fix',c.attention],
   ['var(--ink-faint)','Not uploaded',c.todo]]
   .forEach(([col,lbl,n])=>pb.appendChild(
     el('div','leg','<span class="sw" style="background:'+col+'"></span><span class="sp">'+lbl+'</span><b>'+n+'</b>')));

  pb.appendChild(el('div','verify-reqline',
    '<b>'+c.reqDone+' / '+c.reqTotal+'</b> required documents approved'));
  prog.appendChild(pb);
  rail.appendChild(prog);

  // 3 — selected-doc detail (what's happening with this one)
  rail.appendChild(verify_detailCard());

  // 4 — what verification unlocks
  const unlock = el('div','card');
  unlock.appendChild(el('div','card-h','<h3>What verification unlocks</h3>'));
  const ub = el('div','card-b');
  [['🟢','Verified badge','Live & bookable across all marketplace surfaces.'],
   ['💷','Setnayan Pay payouts','Certified-only — couples can route payment through Setnayan.'],
   ['⚡','Pro Weekly eligibility','₱499/wk Pro tier is verified-vendors-only.'],
   ['📣','Boosted Ads & Sponsored Boost','Paid promotion unlocks once you\'re verified.']]
   .forEach(([i,t,s])=>ub.appendChild(
     el('div','verify-unlock','<span class="verify-unlock-ico">'+i+'</span><div class="verify-unlock-b"><b>'+t+'</b><small>'+s+'</small></div>')));
  unlock.appendChild(ub);
  rail.appendChild(unlock);

  // footer note — annual renewal + privacy
  rail.appendChild(el('div','verify-note',
    'Documents are stored privately on Setnayan R2 — never shown to couples. '+
    'The Setnayan Team reviews uploads within a 24-hour SLA. '+
    'Verification renews annually with your permits.'));

  return rail;
}

function verify_detailCard(){
  const d = verify_docs.find(x => x.id === verify_sel) || verify_docs[0];
  const s = VERIFY_ST[d.st];
  const card = el('div','card');
  card.appendChild(el('div','card-h','<h3>Document detail</h3><span class="more">'+s.verb+'</span>'));
  const b = el('div','card-b');

  b.appendChild(el('div','verify-d-hero',
    '<div class="verify-d-ico" style="border-color:'+s.dot+'">'+d.ico+'</div>'+
    '<div class="verify-d-name">'+d.name+'</div>'+
    '<div class="verify-d-sub"><span class="pill '+s.pill+'">'+s.label+'</span>'+
      (d.req?' · Required':' · Optional')+'</div>'));

  b.appendChild(el('div','verify-d-desc', d.note));

  // status-specific line
  const lines = {
    verified:  'Approved by the Setnayan Team. No action needed until annual renewal.',
    review:    'Uploaded and queued. Reviewed within 24 hours — we\'ll notify you here.',
    attention: 'This file needs a fix before it can be approved. Re-upload a current version.',
    todo:      'Not uploaded yet. Add this to strengthen your profile / unlock payouts.',
  };
  b.appendChild(el('div','verify-d-status '+d.st, lines[d.st]));

  if (d.file)
    b.appendChild(el('div','verify-d-file','<span class="verify-file-ico">📎</span><span class="verify-d-fname">'+d.file+'</span><span class="verify-when">'+d.when+'</span>'));

  // contextual actions
  const acts = el('div','verify-d-acts');
  if (d.st === 'todo'){
    const up = el('button','btn primary','Upload file');
    up.onclick = () => verify_act(d.id, 'review', 'uploaded-file');
    acts.append(up);
  } else if (d.st === 'attention'){
    const re = el('button','btn primary','Re-upload');
    re.onclick = () => verify_act(d.id, 'review');
    const rm = el('button','btn','Remove');
    rm.onclick = () => verify_act(d.id, 'todo', null);
    acts.append(re, rm);
  } else {
    const view = el('button','btn','View file');
    const rep = el('button','btn','Replace');
    rep.onclick = () => verify_act(d.id, 'review');
    acts.append(view, rep);
  }
  b.appendChild(acts);

  card.appendChild(b);
  return card;
}

/* ---- view state (no RNG / clock at top level) ---- */
let reviews_filter = 'all';        // 'all' | '5' | '4' | '3' | 'unanswered'
let reviews_composing = null;      // review id whose reply composer is open

function reviews_rerender(){
  const c = document.getElementById('content');
  if (c) c.replaceChildren(reviewsPanel());
}
function reviews_setFilter(f){ reviews_filter = f; reviews_composing = null; reviews_rerender(); }

const reviews_ini = n => n.split('&').map(w => w.trim()[0]).slice(0, 2).join('');
const reviews_round1 = n => Math.round(n * 10) / 10;

/* ★ row builder — filled vs empty stars, scaled by class */
function reviews_stars(n, cls){
  const wrap = el('span', 'reviews-stars' + (cls ? ' ' + cls : ''));
  for (let i = 1; i <= 5; i++) wrap.appendChild(el('span', 'reviews-star' + (i <= n ? ' on' : ''), '★'));
  return wrap;
}

function reviews_avg(){
  const t = reviews_DATA.reduce((s, r) => s + r.overall, 0);
  return reviews_round1(t / reviews_DATA.length);
}
/* per-dimension averages across all reviews */
function reviews_dimAvg(key){
  const t = reviews_DATA.reduce((s, r) => s + r.dims[key], 0);
  return reviews_round1(t / reviews_DATA.length);
}
/* count of reviews at a given star value */
function reviews_countAt(star){ return reviews_DATA.filter(r => r.overall === star).length; }

function reviews_filtered(){
  return reviews_DATA.filter(r => {
    if (reviews_filter === 'all') return true;
    if (reviews_filter === 'unanswered') return !r.reply;
    return r.overall === parseInt(reviews_filter, 10);
  });
}

/* ============================== PANEL ============================== */
function reviewsPanel(){
  const p = el('section', 'panel show reviews-panel');

  const avg = reviews_avg();
  const total = reviews_DATA.length;
  const answered = reviews_DATA.filter(r => r.reply).length;

  p.appendChild(el('div', 'surfhead',
    '<div><h1>Reviews</h1><p>' + total + ' verified couple reviews · ' + avg.toFixed(1) +
      ' average · ' + answered + ' of ' + total + ' answered</p></div>' +
    '<div style="display:flex;gap:8px;align-items:center">' +
      '<span class="reviews-freebadge">Free on every plan</span>' +
      '<button class="btn">Share my page</button>' +
    '</div>'));

  const wrap = el('div', 'reviews-wrap');
  wrap.appendChild(reviews_rail(avg, total, answered));
  wrap.appendChild(reviews_listCol());
  p.appendChild(wrap);
  return p;
}

/* ----------------------- LEFT: summary rail ----------------------- */
function reviews_rail(avg, total, answered){
  const rail = el('div', 'reviews-rail stack');

  /* hero average */
  const hero = el('div', 'card');
  const hb = el('div', 'card-b reviews-hero');
  hb.innerHTML =
    '<div class="reviews-avgnum">' + avg.toFixed(1) + '<small>/5</small></div>';
  hb.appendChild(reviews_stars(Math.round(avg), 'lg'));
  hb.appendChild(el('div', 'reviews-avgsub', 'Based on <b>' + total + '</b> verified reviews'));
  hero.appendChild(hb);
  rail.appendChild(hero);

  /* star distribution + 5-dimension breakdown */
  const sum = el('div', 'card');
  sum.appendChild(el('div', 'card-h', '<h3>Rating breakdown</h3>'));
  const sb = el('div', 'card-b');

  sb.appendChild(el('div', 'reviews-subhd', 'By stars'));
  [5, 4, 3, 2, 1].forEach(star => {
    const n = reviews_countAt(star);
    const pc = total ? Math.round((n / total) * 100) : 0;
    const row = el('button', 'reviews-distrow' + (reviews_filter === String(star) ? ' on' : ''));
    row.innerHTML =
      '<span class="reviews-distk">' + star + ' ★</span>' +
      '<span class="reviews-distbar"><i style="width:' + pc + '%"></i></span>' +
      '<span class="reviews-distn">' + n + '</span>';
    row.onclick = () => reviews_setFilter(reviews_filter === String(star) ? 'all' : String(star));
    sb.appendChild(row);
  });

  sb.appendChild(el('div', 'reviews-subhd', 'By dimension'));
  reviews_DIMS.forEach(([key, label]) => {
    const v = reviews_dimAvg(key);
    const row = el('div', 'reviews-dimrow');
    row.innerHTML =
      '<span class="reviews-diml">' + label + '</span>' +
      '<span class="reviews-dimbar"><i style="width:' + (v / 5 * 100) + '%"></i></span>' +
      '<span class="reviews-dimv">' + v.toFixed(1) + '</span>';
    sb.appendChild(row);
  });
  sum.appendChild(sb);
  rail.appendChild(sum);

  /* response rate stat + filter chips */
  const resp = el('div', 'card');
  resp.appendChild(el('div', 'card-h', '<h3>Your responses</h3>'));
  const rb = el('div', 'card-b');
  const pct = total ? Math.round((answered / total) * 100) : 0;
  rb.appendChild(el('div', 'reviews-resp',
    '<div class="reviews-respn">' + pct + '%</div>' +
    '<div class="reviews-respk">' + answered + ' of ' + total + ' reviews answered. A public reply shows your logo, never a personal photo.</div>'));
  rb.appendChild(el('div', 'reviews-bar', '<i style="width:' + pct + '%"></i>'));

  rb.appendChild(el('div', 'reviews-subhd', 'Filter'));
  const chips = el('div', 'reviews-fchips');
  [['all', 'All'], ['5', '5 ★'], ['4', '4 ★'], ['3', '3 ★ & below'], ['unanswered', 'Needs reply']]
    .forEach(([val, lbl]) => {
      const c = el('button', 'reviews-fchip' + (reviews_filter === val ? ' on' : ''), lbl);
      c.onclick = () => reviews_setFilter(val);
      chips.appendChild(c);
    });
  rb.appendChild(chips);
  resp.appendChild(rb);
  rail.appendChild(resp);

  return rail;

/* --------------------- RIGHT: review card list -------------------- */
function reviews_listCol(){
  const col = el('div', 'reviews-listcol');

  const head = el('div', 'reviews-listhd');
  const rows = reviews_filtered();
  const label = reviews_filter === 'all' ? 'All reviews'
    : reviews_filter === 'unanswered' ? 'Awaiting your reply'
    : reviews_filter + '-star reviews';
  head.innerHTML = '<h2>' + label + '</h2><span class="count">' + rows.length + '</span>';
  col.appendChild(head);

  if (!rows.length){
    col.appendChild(el('div', 'reviews-empty', 'No reviews match this filter.'));
    return col;
  }

  const grid = el('div', 'reviews-grid');
  rows.forEach(r => grid.appendChild(reviews_card(r)));
  col.appendChild(grid);
  return col;
}

function reviews_card(r){
  const card = el('div', 'reviews-card');

  /* header: couple + stars + meta */
  const top = el('div', 'reviews-c-top');
  top.innerHTML =
    '<span class="reviews-c-ini" style="background:hsl(' + r.hue + ',42%,55%)">' + reviews_ini(r.couple) + '</span>' +

      '<small>' + r.service + ' · ' + r.when + '</small>' +
    '</div>';
  const sc = el('div', 'reviews-c-score');
  sc.appendChild(reviews_stars(r.overall));
  if (r.photos > 0) sc.appendChild(el('span', 'reviews-c-photos', '📷 ' + r.photos));
  top.appendChild(sc);
  card.appendChild(top);

  /* dimension chips */
  const chips = el('div', 'reviews-c-dims');
  reviews_DIMS.forEach(([key, label]) => {
    const v = r.dims[key];
    const tone = v >= 5 ? ' hi' : v <= 3 ? ' lo' : '';
    chips.appendChild(el('span', 'reviews-dchip' + tone, label + ' <b>' + v + '</b>'));
  });
  card.appendChild(chips);

  /* review text */
  card.appendChild(el('p', 'reviews-c-text', '“' + r.text + '”'));

  /* photo strip (placeholder tiles — gallery thumbs) */
  if (r.photos > 0){
    const strip = el('div', 'reviews-c-strip');
    for (let i = 0; i < r.photos; i++) strip.appendChild(el('span', 'reviews-thumb', '🖼'));
    card.appendChild(strip);
  }

  /* footer: existing public reply, OR respond affordance + inline composer */
  card.appendChild(reviews_replyZone(r));

}

function reviews_replyZone(r){
  const zone = el('div', 'reviews-reply');

  if (r.reply){
    const box = el('div', 'reviews-replybox');
    box.innerHTML =
      '<div class="reviews-replyhd">' +
        '<span class="reviews-replylogo">LP</span>' +
        '<span class="reviews-replywho">La Pascual Photo &amp; Video <em>· public reply · ' + r.repliedWhen + '</em></span>' +
      '</div>' +
      '<div class="reviews-replytext">' + r.reply + '</div>';
    zone.appendChild(box);
    return zone;
  }

  /* composer toggles via state (classList path on rerender — no inline DOM hacks) */
  if (reviews_composing === r.id){
    const comp = el('div', 'reviews-composer');
    comp.innerHTML =
      '<div class="reviews-comphd"><span class="reviews-replylogo sm">LP</span> Replying publicly as <b>La Pascual</b></div>';
    const ta = el('textarea', 'reviews-ta');
    ta.placeholder = 'Thank ' + r.couple + ' and share a warm, on-brand note. This reply is public on your marketplace page.';
    comp.appendChild(ta);
    const actions = el('div', 'reviews-compact');
    const cancel = el('button', 'btn', 'Cancel');
    cancel.onclick = () => { reviews_composing = null; reviews_rerender(); };
    const post = el('button', 'btn primary', 'Post reply');
    post.onclick = () => { reviews_composing = null; reviews_rerender(); };
    actions.append(cancel, post);
    comp.appendChild(actions);
    zone.appendChild(comp);
    return zone;
  }

  const prompt = el('div', 'reviews-respondbar');
  prompt.innerHTML = '<span class="reviews-respondhint">No public reply yet</span>';
  const btn = el('button', 'btn primary', '✍ Respond');
  btn.onclick = () => { reviews_composing = r.id; reviews_rerender(); };
  prompt.appendChild(btn);
  zone.appendChild(prompt);
  return zone;
}

/* ===== earnings ===== */
/* ============================================================
   EARNINGS — La Pascual Photo & Video (vendor dashboard surface)
   Desktop-native: top summary strip (available · pending · lifetime, real PHP)
   + a full-width payout TABLE by month (month · gross · Setnayan Pay 5% fee · net).
   A month row EXPANDS to per-booking item rows (couple · service · gross · fee · net).
   Real PHP payouts — NOT a token wallet. Setnayan Pay fee is 5%.
   Uses only global el()/peso() + shared classes (.surfhead .statstrip/.stat .card
   .card-h .card-b .btn .pill table/thead/tbody). New selectors all ".earnings-" prefixed.
   ============================================================ */

/* ---- fixture: this vendor's completed payouts, newest month first ----
   Each booking carries gross PHP (charm-priced); fee = round(gross * 0.05); net = gross - fee.
   `paid` months are settled to the bank; the current month is still `pending` (in escrow). */
const earnings_FEE_RATE = 0.05;

const earnings_months = [
  { key:'2026-06', label:'June 2026', status:'pending', bookings:[
      { couple:'Aira & Boy',  service:'Wedding Day Coverage · 10 hrs', gross:64999 },
      { couple:'Tina & Marco', service:'Pre-nup Shoot · half-day',      gross:18999 },
    ]},
  { key:'2026-05', label:'May 2026', status:'paid', bookings:[
      { couple:'Aira & Boy',  service:'Engagement Session',            gross:14999 },
      { couple:'Tina & Marco', service:'Save-the-Date Film',            gross:9999  },
      { couple:'Tina & Marco', service:'Same-Day Edit add-on',          gross:11999 },
    ]},
  { key:'2026-04', label:'April 2026', status:'paid', bookings:[
      { couple:'Aira & Boy',  service:'Booking Reservation · 50%',     gross:32499 },
    ]},
];

/* a booking row's computed fee + net */
function earnings_fee(gross){ return Math.round(gross * earnings_FEE_RATE); }
function earnings_net(gross){ return gross - earnings_fee(gross); }

/* a month's totals (memo-free; cheap to recompute on each render) */
function earnings_monthTotals(m){
  let gross=0, fee=0, net=0;
  m.bookings.forEach(b=>{ const f=earnings_fee(b.gross); gross+=b.gross; fee+=f; net+=b.gross-f; });
  return { gross, fee, net, count:m.bookings.length };
}

/* roll-ups across every month */
function earnings_rollup(){
  let lifetimeNet=0, available=0, pending=0;
  earnings_months.forEach(m=>{
    const t=earnings_monthTotals(m);
    lifetimeNet+=t.net;
    if(m.status==='paid') available+=t.net;   // already settled is withdraw-able / settled balance
    else pending+=t.net;                       // current month still in escrow
  });
  return { lifetimeNet, available, pending };
}

/* which month keys are expanded — default: the pending (current) month is open */
const earnings_open = new Set(['2026-06']);

function earnings_toggle(key){
  if(earnings_open.has(key)) earnings_open.delete(key); else earnings_open.add(key);
  earnings_rerender();
}

function earnings_rerender(){
  const p=document.querySelector('#content .panel');
  if(p) p.replaceWith(earningsPanel());
}

/* ---- the surface ---- */
function earningsPanel(){
  const p=el('section','panel show');
  const roll=earnings_rollup();

  p.appendChild(el('div','surfhead',
    '<div><h1>Earnings</h1><p>La Pascual Photo &amp; Video · payouts in PHP · Setnayan Pay fee 5% per booking</p></div>'+
    '<div style="display:flex;gap:8px"><button class="btn">Statement</button><button class="btn">Export CSV</button><button class="btn primary">Withdraw '+peso(roll.available)+'</button></div>'));

  /* top summary strip — real PHP, never tokens */
  const strip=el('div','statstrip');
  const lifetimeBookings=earnings_months.reduce((s,m)=>s+m.bookings.length,0);
  [
    { v:peso(roll.available), k:'Available to withdraw', tag:'settled', cls:'earnings-stat-avail' },
    { v:peso(roll.pending),   k:'Pending · in escrow',   tag:'June 2026', cls:'earnings-stat-pend' },
    { v:peso(roll.lifetimeNet), k:'Lifetime net earnings', tag:lifetimeBookings+' bookings', cls:'earnings-stat-life' },
    { v:peso(roll.lifetimeNet+earnings_months.reduce((s,m)=>s+earnings_monthTotals(m).fee,0)), k:'Lifetime gross billed', tag:'before 5% fee', cls:'' },
  ].forEach(s=>{
    const c=el('div','stat '+s.cls);
    c.innerHTML='<div class="v">'+s.v+'</div><div class="k">'+s.k+'</div>'+
      '<div class="earnings-statfoot">'+s.tag+'</div>';
    strip.appendChild(c);
  });
  p.appendChild(strip);

  /* the wide payout table */
  const card=el('div','card');
  const totGross=earnings_months.reduce((s,m)=>s+earnings_monthTotals(m).gross,0);
  card.appendChild(el('div','card-h',
    '<h3>Payout history</h3>'+
    '<span class="earnings-count">'+earnings_months.length+' months</span>'+
    '<span style="flex:1"></span>'+
    '<span class="earnings-feekey"><i></i> Setnayan Pay 5%</span>'));

  const tbl=el('table','earnings-table');

  const thead=el('thead');
  thead.innerHTML='<tr>'+
    '<th class="earnings-th-mon">Month</th>'+
    '<th class="earnings-num">Gross</th>'+
    '<th class="earnings-num">Setnayan Pay 5%</th>'+
    '<th class="earnings-num">Net payout</th>'+
    '<th class="earnings-th-status">Status</th>'+
  '</tr>';
  tbl.appendChild(thead);

  const tb=el('tbody');
  earnings_months.forEach(m=>{
    const t=earnings_monthTotals(m);
    const isOpen=earnings_open.has(m.key);

    /* month summary row (clickable → expands per-booking item rows) */
    const mr=el('tr','earnings-monrow'+(isOpen?' open':''));
    mr.onclick=()=>earnings_toggle(m.key);
    mr.innerHTML=
      '<td><div class="earnings-mon">'+
        '<span class="earnings-chev">▸</span>'+
        '<span class="earnings-mon-meta"><b>'+m.label+'</b>'+
          '<small>'+t.count+' booking'+(t.count===1?'':'s')+'</small></span>'+
      '</div></td>'+
      '<td class="earnings-num earnings-gross">'+peso(t.gross)+'</td>'+
      '<td class="earnings-num earnings-fee">−'+peso(t.fee)+'</td>'+
      '<td class="earnings-num earnings-netcell"><b>'+peso(t.net)+'</b></td>'+
      '<td class="earnings-th-status">'+earnings_statusPill(m.status)+'</td>';
    tb.appendChild(mr);

    /* per-booking item rows — only rendered when the month is expanded */
    if(isOpen){
      m.bookings.forEach((b,i)=>{
        const f=earnings_fee(b.gross), n=b.gross-f;
        const ir=el('tr','earnings-itemrow'+(i===m.bookings.length-1?' last':''));
        ir.innerHTML=
          '<td><div class="earnings-item">'+
            '<span class="earnings-spur"></span>'+
            '<span class="earnings-item-meta"><b>'+b.couple+'</b>'+
              '<small>'+b.service+'</small></span>'+
          '</div></td>'+
          '<td class="earnings-num earnings-gross">'+peso(b.gross)+'</td>'+
          '<td class="earnings-num earnings-fee">−'+peso(f)+'</td>'+
          '<td class="earnings-num earnings-netcell">'+peso(n)+'</td>'+
          '<td class="earnings-th-status"><span class="earnings-itemtag">booking</span></td>';
        tb.appendChild(ir);
      });
    }
  });

  /* grand-total footer row */
  const totFee=earnings_months.reduce((s,m)=>s+earnings_monthTotals(m).fee,0);
  const tfr=el('tr','earnings-totrow');
  tfr.innerHTML=
    '<td><div class="earnings-mon"><span class="earnings-chev" style="visibility:hidden">▸</span>'+
      '<span class="earnings-mon-meta"><b>All time</b><small>net of Setnayan Pay fee</small></span></div></td>'+
    '<td class="earnings-num earnings-gross">'+peso(totGross)+'</td>'+
    '<td class="earnings-num earnings-fee">−'+peso(totFee)+'</td>'+
    '<td class="earnings-num earnings-netcell"><b>'+peso(totGross-totFee)+'</b></td>'+
    '<td class="earnings-th-status"></td>';
  tb.appendChild(tfr);

  tbl.appendChild(tb);
  card.appendChild(tbl);

  /* a quiet payout-terms note under the table */
  card.appendChild(el('div','earnings-foot',
    'Net payouts land in your registered bank account 3–5 banking days after the wedding date. '+
    'Setnayan Pay collects a flat 5% per booking — you receive the full amount on direct GCash / BDO transfers (no fee).'));

  p.appendChild(card);
  return p;
}

function earnings_statusPill(status){
  if(status==='paid')    return '<span class="pill yes">Paid out</span>';
  if(status==='pending') return '<span class="pill pending">In escrow</span>';
  return '<span class="pill no">'+status+'</span>';
}

var manpower_filter = 'all';        // all | available | booked | tentative
var manpower_selected = null;       // crew id

/* small self-contained helpers (kept prefixed; shell's el()/peso() reused) */
function manpower_initials(n){ return n.split(' ').map(function(w){return w[0];}).slice(0,2).join(''); }
function manpower_hue(s){ return s.split('').reduce(function(h,c){return (h*31+c.charCodeAt(0))%360;}, 7); }
function manpower_statusMeta(s){
  if(s==='available') return {l:'Available', cls:'avail'};
  if(s==='booked')    return {l:'Booked',    cls:'booked'};
  return {l:'Tentative', cls:'tent'};
}

function manpower_visible(){
  return manpower_crew.filter(function(c){
    return manpower_filter==='all' ? true : c.status===manpower_filter;
  });
}

function manpower_rerender(){
  var p = document.querySelector('#content .panel');
  if(p) p.replaceWith(manpowerPanel());
}

/* ---- LEFT summary rail: counts + day-rate range + handshake note + filters ---- */
function manpower_rail(){
  var r = el('div','frail');

  var total = manpower_crew.length;
  var avail = manpower_crew.filter(function(c){return c.status==='available';}).length;
  var booked = manpower_crew.filter(function(c){return c.status==='booked';}).length;
  var tent = manpower_crew.filter(function(c){return c.status==='tentative';}).length;

  // big counts strip
  var counts = el('div','manpower-counts');
  [['n',total,'Total crew','total'],['a',avail,'Available','avail'],['b',booked,'Booked','booked']]
    .forEach(function(row){
      var c = el('div','manpower-count manpower-count-'+row[3]);
      c.innerHTML = '<div class="manpower-count-n">'+row[1]+'</div><div class="manpower-count-l">'+row[2]+'</div>';
      counts.appendChild(c);
    });
  r.appendChild(counts);

  // day-rate range
  var rates = manpower_crew.map(function(c){return c.rate;});
  var lo = Math.min.apply(null, rates), hi = Math.max.apply(null, rates);
  r.appendChild(el('h4',null,'Day rates'));
  r.appendChild(el('div','fstat','<span>Lowest</span><b>'+peso(lo)+'</b>'));
  r.appendChild(el('div','fstat','<span>Highest</span><b>'+peso(hi)+'</b>'));
  r.appendChild(el('div','fstat','<span>Tentative holds</span><b>'+tent+'</b>'));

  // status filter chips
  r.appendChild(el('h4',null,'Filter by status'));
  var chips = el('div','fchips');
  [['all','All'],['available','Available'],['booked','Booked'],['tentative','Tentative']]
    .forEach(function(opt){
      var c = el('button','fchip'+(manpower_filter===opt[0]?' on':''), opt[1]);
      c.onclick = function(){ manpower_filter = opt[0]; manpower_rerender(); };
      chips.appendChild(c);
    });
  r.appendChild(chips);

  // offline confirmation handshake note
  var note = el('div','manpower-handshake');
  note.innerHTML =
    '<div class="manpower-hs-h"><span class="manpower-hs-ico">🤝</span> Offline confirmation</div>'+
    '<p>Booking a crew member sends an <b>email invite with a confirmation code</b>. They reply or tap the code to lock the date — no app login needed. Until they confirm, the hold stays <b>tentative</b> and the date is never double-promised.</p>';
  r.appendChild(note);

  return r;
}

/* ---- CENTER: fill-don't-stretch roster card grid ---- */
function manpower_grid(){
  var mid = el('div','manpower-mid');

  // section header + add affordance
  var head = el('div','manpower-sechead');
  head.innerHTML =
    '<h2>Crew for hire</h2>'+
    '<span class="count">'+manpower_visible().length+'</span>'+
    '<span class="manpower-sechead-sp"></span>'+
    '<button class="btn primary manpower-add">+ Add crew</button>';
  head.querySelector('.manpower-add').onclick = function(){
    var open = head.parentNode.querySelector('.manpower-addcard');
    if(open) open.classList.toggle('manpower-open');
  };
  mid.appendChild(head);

  // inline "add crew" affordance (collapsed by default; pure classList toggle)
  var add = el('div','manpower-addcard');
  add.innerHTML =
    '<div class="manpower-add-grid">'+
      '<label>Name<input class="fsearch" placeholder="e.g. Reggie Salonga"></label>'+
      '<label>Role<input class="fsearch" placeholder="Second shooter · Editor · Assistant"></label>'+
      '<label>Day rate (₱)<input class="fsearch" placeholder="3499"></label>'+
    '</div>'+
    '<div class="manpower-add-foot"><span>New crew start as <b>Available</b>. You can book them onto any event from their card.</span>'+
    '<button class="btn primary">Save to bench</button></div>';
  mid.appendChild(add);

  // the grid
  var grid = el('div','manpower-grid');
  var rows = manpower_visible();
  if(!rows.length){
    grid.appendChild(el('div','manpower-empty','No crew match this filter.'));
  } else {
    rows.forEach(function(c){
      var sm = manpower_statusMeta(c.status);
      var h = manpower_hue(c.n);
      var card = el('div','manpower-card manpower-st-'+sm.cls+(manpower_selected===c.id?' sel':''));
      var until = c.until ? '<span class="manpower-until">until '+c.until+'</span>' : '';
      card.innerHTML =
        '<div class="manpower-c-top">'+
          '<span class="manpower-ava" style="background:hsl('+h+',42%,55%)">'+manpower_initials(c.n)+'</span>'+
          '<span class="manpower-pill manpower-pill-'+sm.cls+'">'+sm.l+'</span>'+
        '</div>'+
        '<div class="manpower-c-name">'+c.n+'</div>'+
        '<div class="manpower-c-role">'+c.role+'</div>'+
        '<div class="manpower-c-kit">'+c.kit+'</div>'+
        '<div class="manpower-c-foot">'+
          '<div class="manpower-c-rate">'+peso(c.rate)+'<small>per day</small></div>'+
          until+
        '</div>';
      card.onclick = function(){ manpower_selected = c.id; manpower_rerender(); };
      grid.appendChild(card);
    });
  }
  mid.appendChild(grid);
  return mid;
}

/* ---- RIGHT: selected crew detail pane ---- */
function manpower_detail(){
  var d = el('div','gdetail manpower-detail');
  if(manpower_selected===null){
    d.appendChild(el('div','gd-empty','<div class="bi">👥</div><div>Select a crew member to see their kit, day rate, track record, and booking status — and send an offline confirmation invite, side by side.</div>'));
    return d;
  }
  var c = manpower_crew[manpower_selected];
  var sm = manpower_statusMeta(c.status);
  var h = manpower_hue(c.n);

  var hero = el('div','gd-hero');
  hero.innerHTML =
    '<div class="gd-ini" style="background:hsl('+h+',42%,55%)">'+manpower_initials(c.n)+'</div>'+
    '<div class="gd-name">'+c.n+'</div>'+
    '<div class="gd-sub">'+c.role+' · '+c.tag+'</div>';
  d.appendChild(hero);

  var b = el('div','gd-b');

  // status segmented control (classList-driven rerender)
  var sRow = el('div','gd-row'); sRow.innerHTML='<span class="k">Status</span>';
  var seg = el('div','gd-seg');
  [['available','Available'],['tentative','Tentative'],['booked','Booked']].forEach(function(opt){
    var btn = el('button', c.status===opt[0]?'on':'', opt[1]);
    btn.onclick = function(){ c.status=opt[0]; if(opt[0]==='available') delete c.until; manpower_rerender(); };
    seg.appendChild(btn);
  });
  sRow.appendChild(seg); b.appendChild(sRow);

  // facts
  b.appendChild(el('div','gd-row','<span class="k">Day rate</span><span><b>'+peso(c.rate)+'</b></span>'));
  b.appendChild(el('div','gd-row','<span class="k">Experience</span><span>'+c.exp+'</span>'));
  if(c.shoots>0) b.appendChild(el('div','gd-row','<span class="k">Weddings shot</span><span>'+c.shoots+'</span>'));
  b.appendChild(el('div','gd-row','<span class="k">Kit / craft</span><span style="text-align:right;max-width:60%">'+c.kit+'</span>'));
  if(c.until) b.appendChild(el('div','gd-row','<span class="k">Held until</span><span>'+c.until+'</span>'));

  // note
  var noteRow = el('div','manpower-d-note', c.note);
  b.appendChild(noteRow);

  // booking actions — reflects the offline handshake, no payment/wallet UI
  var act = el('div','manpower-d-act');
  if(c.status==='available'){
    var invite = el('button','btn primary',' Send confirmation invite');
    invite.onclick = function(){ c.status='tentative'; c.until='date TBC'; manpower_rerender(); };
    act.appendChild(invite);
  } else if(c.status==='tentative'){
    var confirm = el('button','btn primary',' Mark confirmed');
    confirm.onclick = function(){ c.status='booked'; manpower_rerender(); };
    var release = el('button','btn',' Release hold');
    release.onclick = function(){ c.status='available'; delete c.until; manpower_rerender(); };
    act.appendChild(confirm); act.appendChild(release);
  } else {
    var freeUp = el('button','btn',' Free up crew');
    freeUp.onclick = function(){ c.status='available'; delete c.until; manpower_rerender(); };
    act.appendChild(freeUp);
  }
  b.appendChild(act);

  var hs = el('div','manpower-d-hs','🤝 Confirmation is email-based — no app login required of your crew.');
  b.appendChild(hs);

  d.appendChild(b);
  return d;
}

/* ---- panel root ---- */
function manpowerPanel(){
  var p = el('section','panel show');

  var avail = manpower_crew.filter(function(c){return c.status==='available';}).length;
  var booked = manpower_crew.filter(function(c){return c.status==='booked';}).length;

  p.appendChild(el('div','surfhead',
    '<div><h1>Manpower</h1><p>'+manpower_crew.length+' crew on your bench · '+avail+' available · '+booked+' booked</p></div>'+
    '<div style="display:flex;gap:8px"><button class="btn">Export roster</button><button class="btn primary">+ Add crew</button></div>'));

  var wrap = el('div','manpower-wrap');
  wrap.appendChild(manpower_rail());
  wrap.appendChild(manpower_grid());
  wrap.appendChild(manpower_detail());
  p.appendChild(wrap);

  // surfhead "+ Add crew" scrolls to / opens the inline add affordance
  var topAdd = p.querySelector('.surfhead .btn.primary');
  if(topAdd) topAdd.onclick = function(){
    var add = p.querySelector('.manpower-addcard');
    if(add){ add.classList.add('manpower-open'); add.scrollIntoView({block:'nearest'}); }
  };

  return p;
}

/* one comparison-table cell — highlights the current plan's column */
function team_cell(v, key){
  const cur = key===team_currentPlan ? ' is-current' : '';
  let inner;
  if(v===true)       inner = '<i class="team-ok">✓</i>';
  else if(v===false) inner = '<i class="team-no">—</i>';
  else               inner = '<span class="team-val">'+v+'</span>';
  return '<span class="team-mcell'+cur+'">'+inner+'</span>';
}

    '<p>Desktop layout for this surface — a list-detail pipeline, a 2-pane inbox, or a card grid as fits the work, using the full width instead of a narrow column.</p>'+

  return p;
}

document.getElementById('collapse').onclick=()=>document.body.classList.toggle('sb-collapsed');
document.getElementById('themeBtn').onclick=()=>document.body.classList.toggle('dark');

</script>
