<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=393,initial-scale=1">
<style>
:root{--m-paper:#FBFBFA;--m-ink:#1E2229;--m-line:rgba(30,34,41,.1)}
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}
body{background:var(--m-paper)}
/* fake SidebarShell topBar — has the shell-topbar class (sticky top:0 z-20) */
.shell-topbar{position:sticky;top:0;z-index:20;height:56px;background:#fff;border-bottom:1px solid var(--m-line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600}
/* the page's injected global rule (verbatim from the component) */
.shell-topbar{display:none}
.main{padding:24px 16px}
:root{--paper:#FBFBFA;--ink:#1E2229;--gold:#C5A059;--gold-deep:#8C6932;--mulberry:#5C2542;--ink-soft:#5C6660;--line:rgba(30,34,41,.1);--topbar-h:62px;--head-h:38px;--ease:cubic-bezier(.2,.7,.2,1);--serif:'Cormorant Garamond',Georgia,serif;--mono:ui-monospace,monospace}
.pba{position:relative;margin-top:-24px;background:var(--paper);color:var(--ink)}
.pba .topbar{position:sticky;top:0;z-index:60;min-height:var(--topbar-h);background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
.pba .topbar .figv{font-family:var(--serif);font-style:italic;font-size:19px;font-weight:600}
.pba .topbar .figk{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.pba .body{max-width:760px;margin:0 auto;padding:0 0 120px}
.pba .intro{display:flex;flex-direction:column;gap:14px;padding:26px 22px 88px;min-height:calc(100svh - var(--topbar-h));background:var(--paper)}
.pba .intro-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);animation:pba-rise .5s var(--ease) both}
.pba .intro-h{font-family:var(--serif);font-style:italic;font-size:29px;line-height:1.05;color:var(--ink);margin:2px 0 4px;animation:pba-rise .55s var(--ease) .07s both}
.pba .intro-grid{display:flex;flex-direction:column;gap:10px;animation:pba-rise .6s var(--ease) .14s both}
.pba .irow3{display:flex;gap:10px}.pba .ibox{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 15px}
.pba .ik{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft)}
.pba .iv{font-family:var(--serif);font-style:italic;font-weight:600;font-size:19px;color:var(--ink);margin-top:3px}
.pba .dlbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 15px}
.pba .dl-tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.pba .dl-row{display:flex;justify-content:space-between;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.pba .dl-row:first-of-type{border-top:0}
.pba .dl-name{font-family:var(--serif);font-style:italic;font-weight:600;font-size:15px;color:var(--ink)}
.pba .dl-when{font-family:var(--mono);font-size:8px;text-transform:uppercase;color:var(--gold-deep)}
.pba .intro-cta{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);animation:pba-rise .6s var(--ease) .24s both}
.pba .intro-cta .chev{font-size:18px;animation:pba-bob 1.5s var(--ease) infinite}
@keyframes pba-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pba-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.pba .cat-head{position:sticky;height:var(--head-h);background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}
.pba .cat-head .nm{font-family:var(--serif);font-style:italic;font-size:18px;font-weight:600}
.pba .cat-head .amt{font-family:var(--serif);font-style:italic;font-size:13px;color:#667}
.pba .cat-body{padding:14px 18px 22px}
.pba .card{height:150px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#efe9df,#e4dccd);margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:#8C6932}
</style></head><body>
<div class="shell-topbar"><span>↩ Maria & Juan</span><span>Marketplace · ⌄ · I</span></div>
<div class="main"><div class="pba">
  <div class="topbar"><div><div class="figk">Chosen</div><div class="figv">₱180k</div></div><div class="figv" style="font-size:14px">of ₱600k</div></div>
  <div class="meter" style="height:3px;background:rgba(30,34,41,.1);margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)"></div>
  <div class="body">
    <div class="intro">
      <div class="intro-eyebrow">Your budget &amp; plan</div>
      <div class="intro-h">Where your day stands</div>
      <div class="intro-grid">
        <div class="irow3"><div class="ibox"><div class="ik">Estimated budget</div><div class="iv">₱600k</div></div><div class="ibox"><div class="ik">Budget chosen</div><div class="iv">₱180k</div></div></div>
        <div class="ibox"><div class="ik">Your plan could land between</div><div class="iv">₱520k – ₱840k</div></div>
        <div class="dlbox"><div class="dl-tag">What to lock next</div>
          <div class="dl-row"><span class="dl-name">Photographer</span><span class="dl-when">lock in 12 days</span></div>
          <div class="dl-row"><span class="dl-name">Caterer</span><span class="dl-when">3 options in play</span></div>
          <div class="dl-row"><span class="dl-name">Florist</span><span class="dl-when">lock in 20 days</span></div>
        </div>
      </div>
      <div class="intro-cta"><span>Scroll up to begin</span><span class="chev">⌃</span></div>
    </div>
    <div class="cats" id="cats"></div>
  </div>
</div></div>
<script>
var F=["Venue","Planning","Feast","Design","Program","Documentary","Look","Booths","Prints","Transport"],T=62,H=38,c=document.getElementById('cats');
F.forEach(function(n,i){var h=document.createElement('div');h.className='cat-head';h.style.top='calc('+T+'px + '+i+'*'+H+'px)';h.style.zIndex=40-i;h.innerHTML='<span class="nm">'+n+'</span><span class="amt">'+(i<3?'₱'+(60-i*10)+'k':'Not started')+'</span>';c.appendChild(h);var b=document.createElement('div');b.className='cat-body';b.innerHTML='<div class="card">'+n+' A</div><div class="card">'+n+' B</div>';c.appendChild(b);});
</script>
</body></html>
