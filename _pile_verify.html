<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=393,initial-scale=1">
<style>
  :root{--paper:#FBFBFA;--ink:#1E2229;--gold:#C5A059;--mulberry:#5C2542;--line:rgba(30,34,41,.1);--topbar-h:62px;--head-h:38px}
  *{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}
  body{background:var(--paper);color:var(--ink)}
  /* fake app nav — mirrors SidebarShell topBar: sticky top:0 z-20 */
  .nav{position:sticky;top:0;z-index:20;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600}
  /* page inner main: px-4 py-6 */
  .main{padding:24px 16px}
  .pba{position:relative;margin-top:-24px}
  /* BLACK BAR — persistent, covers nav, full-bleed on mobile */
  .topbar{position:sticky;top:0;z-index:60;min-height:var(--topbar-h);background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
  .topbar .figv{font-style:italic;font-size:19px;font-weight:600}
  .topbar .figk{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
  .body{max-width:760px;margin:0 auto;padding:0 0 120px}
  .intro{padding:26px 18px;background:var(--paper)}
  .intro h2{font-style:italic;font-size:28px}
  /* CATS — ONE shared container; heads pile via progressive sticky top */
  .cat-head{position:sticky;height:var(--head-h);background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}
  .cat-head .nm{font-style:italic;font-size:18px;font-weight:600}
  .cat-head .amt{font-style:italic;font-size:13px;color:#667}
  .cat-body{padding:14px 18px 22px;background:var(--paper)}
  .card{height:150px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#efe9df,#e4dccd);margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-style:italic;color:#8C6932}
  .end-spacer{padding:30px 18px 0}
  .endcard{background:var(--mulberry);color:#fff;border-radius:22px;padding:24px;text-align:center}
  .endcard h3{font-style:italic;font-size:22px}
</style></head><body>
<div class="nav"><span>↩ Maria & Juan</span><span>Marketplace · ⌄ · I</span></div>
<div class="main"><div class="pba">
  <div class="topbar"><div><div class="figk">Chosen</div><div class="figv">₱180k</div></div><div class="figv" style="font-size:14px">of ₱600k</div></div>
  <div class="body">
    <div class="intro"><h2>Where your day stands</h2><p>Scroll up — categories pile under the black bar.</p></div>
    <div class="cats" id="cats"></div>
    <div class="end-spacer"><div class="endcard"><h3>Look how far you've come</h3><p>~12 hours saved · 5 finalized</p></div></div>
  </div>
</div></div>
<script>
  var FOLDERS=["Venue","Planning","Feast","Design","Program","Documentary","Look","Booths","Prints","Transport"];
  var TOPBAR=62,HEAD=38;
  var c=document.getElementById('cats');
  FOLDERS.forEach(function(name,i){
    var h=document.createElement('div');h.className='cat-head';
    h.style.top='calc('+TOPBAR+'px + '+i+' * '+HEAD+'px)';
    h.style.zIndex=(40-i);
    h.innerHTML='<span class="nm">'+name+'</span><span class="amt">'+(i<3?'₱'+(60-i*10)+'k':'Not started')+'</span>';
    c.appendChild(h);
    var b=document.createElement('div');b.className='cat-body';
    b.innerHTML='<div class="card">'+name+' option A</div><div class="card">'+name+' option B</div>';
    c.appendChild(b);
  });
</script>
</body></html>
