<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Setnayan · Plan Builder — 5-Page Prototype (2026-06-09)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --alabaster:#FBFBFA;
    --ink:#1E2229;
    --gold:#C5A059;
    --gold-soft:#F4ECDD;
    --mulberry:#5C2542;
    --mulberry-soft:#F2E9EC;
    --muted:#8C8C86;
    --muted-2:#A8A8A2;
    --line:#ECECE7;
    --line-2:#E2E2DC;
    --card:#FFFFFF;
    --ok:#2E7D5B;
    --warn:#B6892F;
    --warn-soft:#FBF4E4;
    --danger:#B23A48;
    --shadow:0 1px 2px rgba(30,34,41,.04),0 8px 24px rgba(30,34,41,.06);
    --serif:'Playfair Display',Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#E9E9E4;font-family:var(--sans);color:var(--ink)}
  body{display:flex;justify-content:center;min-height:100vh;padding:18px 0 40px}

  /* ---------- phone frame ---------- */
  .phone{
    width:100%;max-width:430px;background:var(--alabaster);
    border-radius:0;min-height:100vh;position:relative;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)
  }
  @media(min-width:480px){
    body{align-items:flex-start}
    .phone{margin-top:6px;border-radius:30px;min-height:880px;height:880px;border:1px solid #d9d9d2}
  }

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;position:relative;z-index:5}
  .xbtn{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;color:#55554f;flex:0 0 auto}
  .xbtn svg{width:16px;height:16px}
  .topbar .tb-meta{display:flex;flex-direction:column;line-height:1.1}
  .tb-meta .ev{font-weight:600;font-size:14px}
  .tb-meta .sub{font-size:11px;color:var(--muted);letter-spacing:.04em}
  .proto-tag{margin-left:auto;font-size:9.5px;letter-spacing:.14em;font-weight:600;color:var(--gold);
    border:1px solid var(--gold);border-radius:999px;padding:4px 8px;background:#fff}

  /* ---------- scroll area ---------- */
  .scroll{flex:1 1 auto;overflow-y:auto;padding:6px 16px 8px;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{width:0}

  /* ---------- typography helpers ---------- */
  .eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:2px 0 6px}
  .eyebrow.ink{color:var(--muted)}
  h1.disp{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.08;margin:0 0 4px;letter-spacing:-.01em}
  h2.disp{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.12;margin:0}
  .lead{font-size:13.5px;color:var(--muted);line-height:1.45;margin:0 0 14px}
  .serif-i{font-family:var(--serif);font-style:italic;font-weight:500}

  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .pad{padding:16px}
  .mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt18{margin-top:18px}.mt24{margin-top:24px}

  /* ---------- summary stat tiles ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center;box-shadow:var(--shadow)}
  .stat .n{font-family:var(--serif);font-size:23px;line-height:1;font-weight:500}
  .stat .l{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:7px;font-weight:600}
  .stat.gold .n{color:var(--gold)}
  .stat.mul .n{color:var(--mulberry)}

  /* where-your-day-stands cover */
  .cover{display:flex;justify-content:space-between;align-items:flex-start}
  .cover .big{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1}
  .cover .pill{font-size:11px;color:var(--muted)}
  .range-bar{height:8px;border-radius:6px;background:linear-gradient(90deg,var(--gold-soft),var(--gold));margin-top:12px}
  .range-meta{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--muted)}

  /* todo list */
  .todo{display:flex;align-items:flex-start;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .todo:last-child{border-bottom:0}
  .todo .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 auto}
  .todo .t{font-size:13.5px;font-weight:500}
  .todo .d{font-size:11.5px;color:var(--muted);margin-top:2px}
  .todo .due{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--warn);white-space:nowrap;padding-top:2px}

  /* AI toggle */
  .ai-card{display:flex;align-items:center;gap:13px;padding:15px 16px}
  .ai-card .ic{width:40px;height:40px;border-radius:12px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:0 0 auto}
  .ai-card .ic svg{width:20px;height:20px}
  .ai-card .tt{font-weight:600;font-size:14.5px}
  .ai-card .ss{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .switch{margin-left:auto;width:50px;height:30px;border-radius:999px;background:#DADAD3;position:relative;flex:0 0 auto;transition:background .2s;cursor:pointer}
  .switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
  .switch.on{background:var(--gold)}
  .switch.on i{left:23px}

  /* ---------- shortlist accordion ---------- */
  .acc-parent{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:11px;overflow:hidden;box-shadow:var(--shadow)}
  .p-head{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
  .p-ava{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;font-weight:600;color:#fff;flex:0 0 auto}
  .p-name{font-weight:600;font-size:15px}
  .p-sub{font-size:11px;color:var(--muted);margin-top:1px}
  .p-count{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .chev{width:16px;height:16px;color:var(--muted-2);transition:transform .2s}
  .chev.open{transform:rotate(90deg)}
  .p-body{border-top:1px solid var(--line);display:none;padding:6px 12px 12px}
  .p-body.open{display:block}

  .leaf{border-bottom:1px solid var(--line)}
  .leaf:last-child{border-bottom:0}
  .l-head{display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer}
  .l-name{font-weight:500;font-size:13.5px}
  .l-count{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .l-badge{background:var(--mulberry-soft);color:var(--mulberry);border-radius:999px;font-size:10px;font-weight:600;padding:2px 8px}
  .l-body{display:none;padding:2px 0 12px}
  .l-body.open{display:block}

  /* service card */
  .svc{border:1px solid var(--line);border-radius:13px;padding:0;margin-bottom:9px;background:#fff;overflow:hidden}
  .svc.inbuild{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .svc-hero{position:relative;height:158px;background:#e7e5e0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:34px;font-weight:600;color:#fff}
  .svc-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .svc-hero-price{position:absolute;right:10px;bottom:10px;z-index:1;background:rgba(20,22,26,.82);color:#fff;font-family:var(--serif);font-weight:600;font-size:15px;padding:5px 11px;border-radius:9px;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
  .svc-hero-match{position:absolute;left:10px;top:10px;z-index:1;background:rgba(255,255,255,.92);color:var(--mulberry);font-weight:600;font-size:10.5px;padding:3px 9px;border-radius:999px;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
  .svc-body{padding:13px}
  .svc-top{display:flex;gap:11px}
  .svc-thumb{width:46px;height:46px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;color:#fff;font-size:16px;position:relative;overflow:hidden}
  .svc-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .br-thumb{width:44px;height:44px;border-radius:10px;flex:0 0 auto;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;color:#fff;font-size:15px}
  .br-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .svc-name{font-weight:600;font-size:14px;line-height:1.15}
  .svc-tag{font-size:11.5px;color:var(--muted);margin-top:2px}
  .svc-meta{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
  .match{font-size:10px;font-weight:600;color:var(--mulberry);background:var(--mulberry-soft);border-radius:999px;padding:2px 7px}
  .src{font-size:10px;font-weight:600;color:var(--muted);background:#F2F2EE;border-radius:999px;padding:2px 7px}
  .svc-price{margin-left:auto;font-family:var(--serif);font-size:16px;font-weight:600;text-align:right}
  .svc-actions{display:flex;gap:8px;margin-top:11px}
  .ref-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .ref-chips span{font-size:10px;color:#6b6b64;background:#F6F6F2;border:1px solid var(--line);border-radius:6px;padding:2px 7px}

  /* service carousel (swipe) */
  .svc-carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    padding:2px 2px 4px;margin:0 -2px;scrollbar-width:none}
  .svc-carousel::-webkit-scrollbar{display:none}
  .svc-carousel .svc{flex:0 0 87%;scroll-snap-align:center;margin-bottom:2px}
  .svc-carousel.single .svc{flex:0 0 100%}
  .carousel-bar{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 6px}
  .carousel-bar .ct{font-size:10.5px;letter-spacing:.04em;color:var(--muted-2);display:flex;align-items:center;gap:5px}
  .carousel-bar .ct svg{width:13px;height:13px}
  .dots{display:flex;gap:5px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:.2s}
  .dots i.on{background:var(--gold);width:15px;border-radius:99px}

  /* end marker + find/add */
  .end-marker{display:flex;align-items:center;gap:9px;margin:4px 2px 10px;color:var(--muted-2)}
  .end-marker .ln{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 11px)}
  .end-marker .tx{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .leaf-cta{display:flex;gap:8px}
  .empty-leaf{padding:10px 2px 6px}
  .empty-note{font-size:12px;color:var(--muted);margin-bottom:9px;font-style:italic;font-family:var(--serif)}

  /* ---------- buttons ---------- */
  .btn{border:1px solid var(--line-2);background:#fff;color:var(--ink);border-radius:10px;font-size:12.5px;font-weight:600;
    padding:9px 13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .btn svg{width:14px;height:14px}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
  .btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.mul{background:var(--mulberry);border-color:var(--mulberry);color:#fff}
  .btn.ghost{background:#fff}
  .btn.sm{padding:7px 11px;font-size:11.5px;border-radius:9px}
  .btn.full{flex:1}
  .btn.danger{color:var(--danger);border-color:#E7CDD0}
  .btn:active{transform:translateY(1px)}

  /* ---------- build ---------- */
  .build-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow)}
  .fp{display:flex;gap:5px;flex:0 0 auto}
  .fp button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--muted-2);cursor:pointer}
  .fp button svg{width:14px;height:14px}
  .fp button.act-flag.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
  .fp button.act-pin.on{background:var(--mulberry-soft);border-color:var(--mulberry);color:var(--mulberry)}
  .fp.locked-fp button{opacity:.4;cursor:default}
  .br-lock{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:#F1F1ED;color:var(--muted);
    display:flex;align-items:center;justify-content:center}
  .br-lock svg{width:15px;height:15px}
  .br-main{flex:1;min-width:0}
  .br-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .br-value{font-weight:600;font-size:14px;margin-top:2px;display:flex;align-items:center;gap:7px}
  .br-value.empty{color:var(--muted-2);font-style:italic;font-weight:500;font-family:var(--serif)}
  .br-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .br-price{font-family:var(--serif);font-size:15px;font-weight:600;flex:0 0 auto;text-align:right;min-width:74px}
  .ai-flag{font-size:9.5px;font-weight:600;color:var(--gold);letter-spacing:.04em;display:inline-flex;align-items:center;gap:3px}
  .ai-flag svg{width:11px;height:11px}
  .lockchip{font-size:9.5px;font-weight:600;color:var(--muted);background:#F1F1ED;border-radius:999px;padding:2px 7px;display:inline-flex;align-items:center;gap:3px}
  .lockchip svg{width:10px;height:10px}
  .build-row.locked{background:#FAFAF7;border-style:dashed}
  .build-row.flagged-empty{border-style:dashed;border-color:var(--gold)}
  .row-divider{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);font-weight:600;margin:16px 2px 9px}

  /* totals footer (persistent) */
  .totals{background:var(--ink);color:#fff;border-radius:14px;padding:13px 15px;margin-top:4px}
  .tt-line{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
  .tt-line .k{font-size:11.5px;color:#B9BBC0;letter-spacing:.03em}
  .tt-line .v{font-family:var(--serif);font-size:15px}
  .tt-line.grand{border-top:1px solid #34383F;margin-top:5px;padding-top:9px}
  .tt-line.grand .k{color:#fff;font-weight:600;font-size:12.5px}
  .tt-line.grand .v{font-size:20px;color:var(--gold)}
  .tt-budget{font-size:11px;color:#9aa;margin-top:6px;text-align:right}
  .tt-budget.over{color:#F0A8A8}
  .tt-budget.under{color:#9BD6B5}

  /* action bar */
  .actionbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .actionbar .btn{width:100%}

  /* ---------- compare ---------- */
  .cmp-head{display:grid;gap:8px;margin-bottom:14px}
  .cmp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
  .cmp-c{border:1px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center;background:#fff;cursor:pointer;box-shadow:var(--shadow)}
  .cmp-c.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .cmp-c .nm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .cmp-c .tot{font-family:var(--serif);font-size:18px;font-weight:600;margin-top:5px}
  .cmp-c .delta{font-size:10.5px;margin-top:3px;font-weight:600}
  .cmp-c .delta.ok{color:var(--ok)}.cmp-c .delta.over{color:var(--danger)}
  .cmp-table{width:100%;border-collapse:collapse;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .cmp-table th,.cmp-table td{padding:11px 9px;font-size:12px;text-align:right;border-bottom:1px solid var(--line)}
  .cmp-table th{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:#FAFAF7}
  .cmp-table td.cat,.cmp-table th.cat{text-align:left;font-weight:500;color:var(--ink)}
  .cmp-table td.cat{cursor:pointer}
  .cmp-table td.best{font-weight:700}
  .cmp-table td.blank{color:var(--muted-2)}
  .cmp-table tr.incl td{background:#FAFAF7;font-size:10.5px;color:var(--muted);text-align:left;padding:7px 9px}
  .col-sel{color:var(--gold) !important}

  /* ---------- lock ---------- */
  .lock-hero{text-align:center;padding:20px 0 6px}
  .lock-hero .ring{width:64px;height:64px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold);margin:0 auto 14px}
  .lock-hero .ring svg{width:26px;height:26px}
  .lock-empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.5;padding:0 30px}
  .lock-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .lock-kv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
  .lock-kv .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .lock-kv .v{font-family:var(--serif);font-size:17px;font-weight:600;margin-top:4px}
  .lock-item{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;box-shadow:var(--shadow)}
  .lock-item .ck{width:24px;height:24px;border-radius:50%;background:var(--mulberry-soft);color:var(--mulberry);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .lock-item .ck svg{width:13px;height:13px}
  .lock-item .li-cat{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .lock-item .li-name{font-weight:600;font-size:13.5px;margin-top:1px}
  .lock-item .li-price{margin-left:auto;font-family:var(--serif);font-weight:600;font-size:15px}

  /* ---------- bottom nav ---------- */
  .botnav{display:flex;border-top:1px solid var(--line);background:rgba(251,251,250,.96);backdrop-filter:blur(8px);
    padding:9px 6px calc(9px + env(safe-area-inset-bottom));flex:0 0 auto}
  .nav-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted-2);cursor:pointer;padding:3px 0}
  .nav-i svg{width:21px;height:21px}
  .nav-i span{font-size:10px;font-weight:500}
  .nav-i.act{color:var(--gold)}
  .nav-i.act span{font-weight:600}

  /* ---------- modal / sheet ---------- */
  .scrim{position:absolute;inset:0;background:rgba(20,22,26,.42);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .scrim.show{display:flex}
  .sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:rise .22s ease}
  @keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet .grip{width:40px;height:4px;border-radius:99px;background:#E2E2DC;margin:0 auto 14px}
  .sheet h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 4px}
  .sheet p.s{font-size:13px;color:var(--muted);line-height:1.45;margin:0 0 14px}
  .sheet .row-btns{display:flex;gap:9px;margin-top:8px}
  .qr{width:150px;height:150px;margin:6px auto 14px;border-radius:14px;border:1px solid var(--line-2);background:
    conic-gradient(#1E2229 0 25%,#fff 0 50%,#1E2229 0 75%,#fff 0)0 0/22px 22px;position:relative}
  .qr::after{content:"";position:absolute;inset:42% 42%;background:#fff;border:3px solid var(--ink);border-radius:6px;width:16%;height:16%}
  .field{width:100%;border:1px solid var(--line-2);border-radius:11px;padding:12px 13px;font-size:14px;font-family:var(--sans);margin-bottom:10px;color:var(--ink)}
  .field:focus{outline:2px solid var(--gold-soft);border-color:var(--gold)}
  .choose-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}

<script>
/* =========================================================================

   ========================================================================= */

const peso = n => '₱' + Math.round(n).toLocaleString('en-PH');
const avatarColors = ['#5C2542','#1E2229','#9A6A2F','#3B5249','#6E4B6E','#864A2E'];
// placeholder service photo (stable per service id) — colored initial shows if the image fails to load
const photoUrl = s => `https://picsum.photos/seed/stn-${s.id}/240/240`;

/* ---- catalog: the live 10-parent / ~54-tile wedding taxonomy (Vendor_Taxonomy_Shrink_2026-05-30) ----
   Parent order locked: Venue → Planning → Feast → Design → Program → Documentary → Look → Booths → Prints → Transport. */
const CATALOG = [
  {id:'venue', name:'Venue', sub:'Where the day happens', leaves:[
     {id:'reception', name:'Reception', area:'Tagaytay'},
     {id:'ceremony',  name:'Ceremony', area:'Tagaytay'},

/* leaf lookup */

const ORDER = Object.keys(LEAF);

/* ---- seeded shortlist (services the couple is interested in) ---- */
const S = (id,leaf,name,tag,price,match,src,refs,incl,avail)=>({id,leaf,name,tag,price,match,src,refs,incl,avail});
// avail = the candidate wedding dates this service can do (undefined = available on all)
let shortlist = {

    S('rc3','reception','Lakeview Pavilion','Lakeside · 180 pax',36500,86,'platform',['Lakeside','Sunset','Up to 200'],['Venue 7h','Open-air pavilion','Generator']),
  ],
  catering:[
    S('ct1','catering','Mesa & Co.','Plated · Filipino-modern',129068,91,'platform',['Plated','Halal-option','220 pax'],['4-course plated','Service staff','Mobile bar']),
    S('ct2','catering','Lakbay Feast','Buffet · regional',112000,85,'platform',['Buffet','Regional','220 pax'],['3-station buffet','Lechon','Dessert table']),
  ],
  photo:[
    S('ph1','photo','Lumière Studios','Editorial · same-day edit',39918,96,'platform',['Editorial','SDE','2 shooters'],['8h coverage','Same-day edit','300 edited photos'],['2026-12-12','2027-02-20']),
    S('ph2','photo','North & Bloom','Documentary style',30000,90,'platform',['Documentary','1 shooter'],['6h coverage','200 edited photos']),
  ],
  hmua:[
    S('hm1','hmua','Glow by Marë','Airbrush · bridal party',6653,89,'platform',['Airbrush','Bridal+4'],['Bride trial','Bride + 4','Touch-up kit']),
  ],
  coordinator:[
    S('co1','coordinator','Aria Events','On-the-day + 1 month',22177,92,'platform',['OTD','1-month','Team of 4'],['1-month coord','Run-of-show','Team of 4']),

};

/* ---- build (working plan) ---- */
let build = {
  date:     {mode:'pin', value:'2026-12-12', locked:false},
  budget:   {mode:'pin', value:360000,       locked:false},
  location: {mode:'pin', value:'Tagaytay',   locked:false},
  rows: {} // leafId -> {mode:'flag'|'pin'|'none', serviceId, locked, inBuild}
};
// inBuild = this category is on the Build canvas (Build shows only these, not all 54 tiles)
ORDER.forEach(id=> build.rows[id]={mode:'flag', serviceId:null, locked:false, inBuild:false});
// seed an illustrative starting plan
build.rows.reception.mode='pin';  build.rows.reception.serviceId='rc1'; build.rows.reception.inBuild=true;
build.rows.coordinator.mode='pin';build.rows.coordinator.serviceId='co1'; build.rows.coordinator.inBuild=true;
build.rows.photo.mode='pin';      build.rows.photo.serviceId='ph1'; build.rows.photo.locked=true; build.rows.photo.inBuild=true; // pre-locked demo
build.rows.catering.mode='flag';  build.rows.catering.inBuild=true;
build.rows.hmua.mode='flag';      build.rows.hmua.inBuild=true;
build.rows.photobooth.mode='flag';build.rows.photobooth.inBuild=true; // empty shortlist → "no compatible" demo on compute

/* ---- saved builds (for Compare) ---- */
let savedBuilds = [
  {name:'The Fits', date:'2026-12-12', budget:360000,
    picks:{reception:'rc1', catering:'ct1', photo:'ph1', hmua:'hm1', coordinator:'co1'}},
  {name:'Lean Day', date:'2027-02-20', budget:300000,
    picks:{reception:'rc3', catering:'ct2', photo:'ph2', hmua:'hm1', coordinator:'co1'}},
];

/* ---- locked (final) ---- */
let locked = { date:null, budget:null, location:null, items:[] };

/* ---- ui state ---- */
let state = {
  tab:'summary',
  aiEnabled:true,
  openParents:new Set(['venue']),
  openLeaves:new Set(['reception']),
  cmpExpanded:new Set(),
  cmpSel:0,
};

/* ============================ helpers ============================ */
const svcById = (leaf,id)=> (shortlist[leaf]||[]).find(s=>s.id===id);
const fmtDate = v => v ? new Date(v+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : null;

/* ---- the couple's chosen anchors (from onboarding / date aligner) ---- */
const COUPLE_DATES     = ['2026-12-12','2027-01-30','2027-02-20']; // dates they shortlisted
const COUPLE_LOCATIONS = ['Tagaytay','Metro Manila'];             // their two chosen areas
const CHOSEN_BUDGET    = 360000;                                  // their estimated budget

/* typical per-category price ranges → median used for budget suggestion + auto-find */
const CATRANGE = {
  reception:[32333,97000], ceremony:[15000,60000], catering:[242500,388000], cake:[12000,45000], stations:[20000,70000],
  photo:[30000,120000], editorial:[8000,30000], livestream:[15000,50000], coordinator:[22177,80000],
  hmua:[6653,25000], grooming:[3000,12000], photobooth:[15000,45000], mobile_bar:[15000,40000], florist:[18000,60000],
};
const catRange  = id => CATRANGE[id] || [10000,50000];
const catMedian = id => { const r=catRange(id); return (r[0]+r[1])/2; };

/* services that constrain the date = pinned or locked picks on the canvas */
function constrainingServices(){
  return ORDER.filter(id=>{const r=build.rows[id]; return r.inBuild && r.serviceId && (r.mode==='pin'||r.locked);})
    .map(id=>({leaf:id, s:svcById(id,build.rows[id].serviceId)}));
}
const dateBlockers = d => constrainingServices().filter(({s})=> s.avail && !s.avail.includes(d));
const allowedDates = ()  => COUPLE_DATES.filter(d=>dateBlockers(d).length===0);

/* budget suggestion: chosen estimate, OR median of pinned(actual)+flagged(category-median) if already exceeded */
function suggestedBudget(){
  if(totals().grand <= CHOSEN_BUDGET) return CHOSEN_BUDGET;
  let sum=0;
  ORDER.forEach(id=>{ const r=build.rows[id]; if(!r.inBuild) return;
    if(r.serviceId) sum+=svcById(id,r.serviceId).price;          // pinned / locked → actual
    else if(r.mode==='flag') sum+=catMedian(id);                 // flagged → category median
  });
  return Math.round(sum);
}

/* auto-find a compatible vendor for an empty category → ADD it to the shortlist (within budget/date/location + AI) */
let autoId=1;
const AUTO_NAMES={ceremony:'Capilla de Tagaytay',cake:'Tier & Co.',stations:'Live Station Co.',photobooth:'Mirror Booth MNL',
  grooming:'The Groom Room',florist:'Bloom & Vine',hmua:'Blush Studio',mobile_bar:'Tipsy Cart',livestream:'StreamPH',dj:'Spin Co.'};
function autoFindForCategory(leaf){
  const recep = build.rows.reception.serviceId? svcById('reception',build.rows.reception.serviceId):null;
  const nm  = AUTO_NAMES[leaf] || ('Best match · '+LEAF[leaf].name);
  const tag = (state.aiEnabled && recep)? 'AI · near '+recep.name : 'AI-matched to budget';
  const refs= ['AI match', (state.aiEnabled&&recep)?'Near reception':'In budget', build.location.value||'In area'];
  const s = S('af'+(autoId++),leaf,nm,tag,Math.round(catMedian(leaf)),93,'platform',refs,['Curated to your plan'], allowedDates());
  shortlist[leaf]=shortlist[leaf]||[]; shortlist[leaf].push(s);
  return s;
}

function totals(){
  let lockedT=0, buildT=0;
  ORDER.forEach(id=>{
    const r=build.rows[id]; if(!r.inBuild || !r.serviceId) return;
    const s=svcById(id,r.serviceId); if(!s) return;
    if(r.locked) lockedT+=s.price; else buildT+=s.price;
  });
  return {lockedT, buildT, grand:lockedT+buildT};
}
function shortlistCount(){ return ORDER.reduce((n,id)=>n+(shortlist[id]?.length||0),0); }
function builtCount(){ return ORDER.filter(id=>build.rows[id].inBuild && build.rows[id].serviceId).length; }
function lockedCount(){ return ORDER.filter(id=>build.rows[id].locked).length; }

const I = {

/* ============================ RENDER: SUMMARY ============================ */

      <div class="p-head" data-action="toggleParent" data-id="${p.id}">

        <div><div class="p-name">${p.name}</div><div class="p-sub">${p.sub}</div></div>
        <div class="p-count">${pCount} saved ${I.chev.replace('class="chev"',`class="chev ${pOpen?'open':''}"`)}</div>
      </div>
      <div class="p-body ${pOpen?'open':''}">
        ${p.leaves.map(l=>renderLeaf(l,color)).join('')}
      </div>
    </div>`;
  });
  return html;
}

function renderLeaf(l, color){
  const items = shortlist[l.id]||[];
  const lOpen = state.openLeaves.has(l.id);
  const findBtn = `<button class="btn ghost sm full" data-action="find" data-leaf="${l.id}">${I.plus} Find ${l.name.toLowerCase()}</button>`;
  const addBtn  = `<button class="btn ghost sm full" data-action="addManual" data-leaf="${l.id}">${I.qr} Add manually</button>`;

  let body='';
  if(items.length===0){
    body = `<div class="empty-leaf">
      <div class="empty-note">No ${l.name.toLowerCase()} yet — start one.</div>
      <div class="leaf-cta">${findBtn}${addBtn}</div>
    </div>`;
  } else {
    const single = items.length===1;
    const carousel = `
      <div class="carousel-bar">
        <span class="ct">${I.swipe} ${items.length} shortlisted${single?'':' · swipe'}</span>
        ${single?'':`<span class="dots">${items.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</span>`}
      </div>
      <div class="svc-carousel ${single?'single':''}" data-carousel="${l.id}" data-count="${items.length}">
        ${items.map(s=>renderSvcCard(s)).join('')}
      </div>`;
    body = carousel
      + `<div class="end-marker"><span class="ln"></span><span class="tx">End of ${l.name}</span><span class="ln"></span></div>`
      + `<div class="leaf-cta">${findBtn}${addBtn}</div>`;
  }

  return `
  <div class="leaf">
    <div class="l-head" data-action="toggleLeaf" data-id="${l.id}">
      <div class="l-name">${l.name}</div>
      <div class="l-count">${items.length?`<span class="l-badge">${items.length}</span>`:'<span style="color:var(--muted-2)">empty</span>'} ${I.chev.replace('class="chev"',`class="chev ${lOpen?'open':''}"`)}</div>
    </div>
    <div class="l-body ${lOpen?'open':''}">${body}</div>
  </div>`;
}

function renderSvcCard(s){
  const inBuild = build.rows[s.leaf]?.serviceId===s.id;
  const color = LEAF[s.leaf].color;
  return `
  <div class="svc ${inBuild?'inbuild':''}">
    <div class="svc-hero" style="background:${color}">
      ${s.name[0]}<img src="${photoUrl(s)}" alt="" loading="lazy">
      <span class="svc-hero-match">${s.match}% match</span>
      <span class="svc-hero-price">${peso(s.price)}</span>
    </div>
    <div class="svc-body">
      <div class="svc-name">${s.name}</div>
      <div class="svc-tag">${s.tag}</div>
      <div class="svc-meta">
        <span class="src">${s.src==='manual'?'Your vendor':'Setnayan'}</span>
      </div>
      <div class="ref-chips">${s.refs.map(r=>`<span>${r}</span>`).join('')}</div>
      <div class="svc-actions">
        <button class="btn ${inBuild?'ghost':'gold'} sm full" data-action="addToBuild" data-leaf="${s.leaf}" data-sid="${s.id}">

/* ============================ RENDER: BUILD ============================ */
function renderBuild(){
  const t=totals();
  const budget = build.budget.mode==='pin' ? build.budget.value : null;
  const remaining = budget!=null ? budget - t.grand : null;

  let html = `
  <div class="eyebrow">Compose the day</div>
  <h1 class="disp">Build</h1>
  <p class="lead"><span class="serif-i">Pin</span> what’s fixed, <span class="serif-i">Flag</span> what Setnayan should fill. Compute fills every flag from your shortlist within the pinned budget &amp; date.</p>`;

  // anchors: date + budget
  html += `<div class="row-divider">Anchors</div>`;
  html += buildAnchorRow('date','Wedding date', build.date,
     build.date.value? fmtDate(build.date.value):null);
  html += buildAnchorRow('budget','Total budget', build.budget,
     build.budget.value? peso(build.budget.value):null);
  html += buildAnchorRow('location','Location', build.location,
     build.location.value || null);

  // categories — only those on the build canvas (not all 54 tiles)
  const inPlay = ORDER.filter(id=>build.rows[id].inBuild);
  html += `<div class="row-divider">Categories</div>`;
  inPlay.forEach(id=> html += buildCatRow(id));
  html += `<button class="btn ghost full" data-action="addCategory" style="margin-top:2px">${I.plus} Add a category to plan</button>`;

  // persistent totals
  const overcls = remaining==null?'' : (remaining<0?'over':'under');
  html += `
  <div class="totals">
    <div class="tt-line"><span class="k">Already locked (held separately)</span><span class="v">${peso(t.lockedT)}</span></div>
    <div class="tt-line"><span class="k">This build (chosen services)</span><span class="v">${peso(t.buildT)}</span></div>
    <div class="tt-line grand"><span class="k">Total commitment</span><span class="v">${peso(t.grand)}</span></div>
    ${budget!=null?`<div class="tt-budget ${overcls}">${remaining>=0?peso(remaining)+' under your '+peso(budget)+' budget':peso(-remaining)+' over your '+peso(budget)+' budget'}</div>`:''}
  </div>

  <div class="actionbar">
    <button class="btn ghost" data-action="reset">${I.reset} Reset</button>
    <button class="btn ghost" data-action="saveBuild">${I.save} Save build</button>
    <button class="btn ink" data-action="compute">${I.calc} Compute</button>
    <button class="btn gold" data-action="lockBuild">${I.lock} Lock</button>
  </div>
  <div class="hint">Compute fills flagged rows · locked rows show but don’t count toward this build’s budget.</div>`;
  return html;
}

function fpButtons(kind, obj){
  if(obj.locked) return `<div class="fp locked-fp">
    <button class="act-flag ${obj.mode==='flag'?'on':''}" disabled>${I.flag}</button>
    <button class="act-pin ${obj.mode==='pin'?'on':''}" disabled>${I.pin}</button>
  </div>`;
  return `<div class="fp">
    <button class="act-flag ${obj.mode==='flag'?'on':''}" data-action="setMode" data-target="${kind}" data-mode="flag" title="Flag — Setnayan fills this (tap again to clear)">${I.flag}</button>
    <button class="act-pin ${obj.mode==='pin'?'on':''}" data-action="setMode" data-target="${kind}" data-mode="pin" title="Pin — I decide this (tap again to clear)">${I.pin}</button>
  </div>`;
}

function buildAnchorRow(kind, label, obj, valueText){
  const flagged = obj.mode==='flag' && !valueText;
  const empty = obj.mode==='flag' && !valueText;
  return `
  <div class="build-row ${empty?'flagged-empty':''} ${obj.locked?'locked':''}">
    ${fpButtons(kind,obj)}
    <div class="br-main">
      <div class="br-label">${label}</div>
      ${valueText
        ? `<div class="br-value">${valueText} ${obj.mode==='flag'?'<span class="ai-flag">'+I.spark+' AI-set</span>':''}</div>`
        : `<div class="br-value empty">${obj.mode==='flag'?'Flagged — AI will suggest':(obj.mode==='pin'?'Pin a value':'Not set — flag or pin')}</div>`}
    </div>
    ${obj.locked
      ? `<div class="br-lock" title="Locked">${I.lock}</div>`
      : (obj.mode==='pin' ? `<button class="btn ghost sm" data-action="choosePin" data-target="${kind}">${valueText?'Edit':'Set'}</button>`:'')}
  </div>`;
}

function buildCatRow(id){
  const r=build.rows[id], leaf=LEAF[id];
  const s = r.serviceId? svcById(id,r.serviceId):null;
  const aiNote = (r.mode==='flag' && s)
    ? `<span class="ai-flag">${I.spark} ${state.aiEnabled? (id!=='reception' && build.rows.reception.serviceId? 'AI · near your reception':'AI matched'):'Best in budget'}</span>` : '';
  let valHtml;
  if(s){
    valHtml = `<div class="br-value">${s.name} ${aiNote}</div><div class="br-sub">${s.tag} · ${s.match}% match</div>`;
  } else if(r.mode==='flag'){
    valHtml = `<div class="br-value empty">Flagged — Compute will fill this</div>`;
  } else if(r.mode==='pin'){
    valHtml = `<div class="br-value empty">Pin a pick from your shortlist</div>`;
  } else {
    valHtml = `<div class="br-value empty">Not set — flag or pin</div>`;
  }
  return `
  <div class="build-row ${(r.mode==='flag'&&!s)?'flagged-empty':''} ${r.locked?'locked':''}">
    ${fpButtons(id,r)}
    ${s? `<div class="br-thumb" style="background:${leaf.color}">${s.name[0]}<img src="${photoUrl(s)}" alt="" loading="lazy"></div>`:''}
    <div class="br-main">
      <div class="br-label">${leaf.name}${r.locked?' · locked':''}</div>
      ${valHtml}
    </div>
    ${s? `<div class="br-price">${peso(s.price)}</div>`:''}
    ${r.locked
      ? `<div class="br-lock" title="Locked — can’t be edited">${I.lock}</div>`
      : (r.mode==='pin' ? `<button class="btn ghost sm" data-action="choosePin" data-target="${id}">${s?'Swap':'Pick'}</button>`:'')}
  </div>`;
}

/* ============================ RENDER: COMPARE ============================ */
function renderCompare(){
  if(savedBuilds.length===0){
    return `<div class="eyebrow">Weigh your options</div><h1 class="disp">Compare</h1>
      <p class="lead">Save a build to compare it here side by side.</p>
      <div class="lock-empty mt24">No saved builds yet.<br>Go to <span class="serif-i">Build</span> and tap Save build.</div>`;
  }
  const budget = build.budget.value;
  const totalsOf = b => ORDER.reduce((sum,id)=>{ const sid=b.picks[id]; const s=sid&&svcById(id,sid); return sum+(s?s.price:0);},0);

  let html = `
  <div class="eyebrow">Weigh your options</div>
  <h1 class="disp">Compare</h1>
  <p class="lead">Your saved builds, side by side against your ${peso(budget)} budget. Tap a column to act on it; tap a category to expand inclusions.</p>
  <div class="cmp-cards">`;
  savedBuilds.forEach((b,i)=>{
    const tot=totalsOf(b); const d=budget-tot;
    html += `<div class="cmp-c ${state.cmpSel===i?'sel':''}" data-action="cmpSel" data-i="${i}">
      <div class="nm">${b.name}</div>
      <div class="tot">${peso(tot)}</div>
      <div class="delta ${d>=0?'ok':'over'}">${d>=0?peso(d)+' to spare':peso(-d)+' over'}</div>
    </div>`;
  });
  html += `</div>`;

  // table
  html += `<table class="cmp-table"><thead><tr><th class="cat">Category</th>${savedBuilds.map((b,i)=>`<th class="${state.cmpSel===i?'col-sel':''}">${b.name}</th>`).join('')}</tr></thead><tbody>`;
  ORDER.forEach(id=>{
    const leaf=LEAF[id];
    // find cheapest non-blank to mark best
    const vals = savedBuilds.map(b=>{ const sid=b.picks[id]; const s=sid&&svcById(id,sid); return s?s.price:null;});
    const present = vals.filter(v=>v!=null);
    const min = present.length?Math.min(...present):null;
    const anyPresent = present.length>0;
    if(!anyPresent) return; // skip categories nobody picked
    const exp = state.cmpExpanded.has(id);
    html += `<tr><td class="cat" data-action="cmpExpand" data-id="${id}">${exp?'▾':'▸'} ${leaf.name}</td>`;
    vals.forEach((v,i)=>{
      if(v==null) html += `<td class="blank ${state.cmpSel===i?'col-sel':''}">—</td>`;
      else html += `<td class="${v===min?'best':''} ${state.cmpSel===i?'col-sel':''}">${peso(v)}</td>`;
    });
    html += `</tr>`;
    if(exp){
      html += `<tr class="incl"><td colspan="${savedBuilds.length+1}">${
        savedBuilds.map(b=>{const sid=b.picks[id];const s=sid&&svcById(id,sid);
          return `<b style="color:var(--ink)">${b.name}:</b> ${s? s.name+' — '+s.incl.join(', ') : '<i>not included</i>'}`;}).join('<br>')
      }</td></tr>`;
    }
  });
  // totals row
  html += `<tr><td class="cat" style="font-weight:700">Total</td>${savedBuilds.map((b,i)=>`<td style="font-weight:700" class="${state.cmpSel===i?'col-sel':''}">${peso(totalsOf(b))}</td>`).join('')}</tr>`;
  html += `</tbody></table>`;

  const sel = savedBuilds[state.cmpSel];
  html += `
  <div class="actionbar" style="grid-template-columns:1fr 1fr 1fr">
    <button class="btn danger" data-action="cmpDelete">${I.trash} Delete</button>
    <button class="btn ghost" data-action="cmpModify">${I.build} Modify</button>
    <button class="btn gold" data-action="cmpLock">${I.lock} Lock</button>
  </div>
  <div class="hint">Acting on <span class="serif-i">${sel.name}</span> · Modify reopens it in Build.</div>`;
  return html;
}

const TABS = [
  {id:'summary',  label:'Summary',  icon:I.gauge},
  {id:'shortlist',label:'Shortlist',icon:I.bookmark},
  {id:'build',    label:'Build',    icon:I.hammer},
  {id:'compare',  label:'Compare',  icon:I.scales},
  {id:'lock',     label:'Lock',     icon:I.lock},
];
function renderNav(){
  document.getElementById('botnav').innerHTML = TABS.map(t=>`
    <div class="nav-i ${state.tab===t.id?'act':''}" data-action="tab" data-tab="${t.id}">
      ${t.icon}<span>${t.label}</span>
    </div>`).join('');
}
function render(){
  const map={summary:renderSummary,shortlist:renderShortlist,build:renderBuild,compare:renderCompare,lock:renderLock};
  document.getElementById('scroll').innerHTML = map[state.tab]();
  renderNav();
  if(state.tab==='shortlist') attachCarousels();
}
function attachCarousels(){
  document.querySelectorAll('.svc-carousel[data-carousel]').forEach(c=>{
    const count=+c.dataset.count; if(count<2) return;
    const bar=c.previousElementSibling, dots=bar && bar.querySelector('.dots');
    c.onscroll=()=>{
      const slide=c.querySelector('.svc'); const w=slide?slide.offsetWidth+10:c.clientWidth;
      const idx=Math.min(count-1, Math.round(c.scrollLeft/w));
      if(dots)[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===idx));
    };
  });
}

/* ============================ MODALS / SHEETS ============================ */
function showSheet(html){
  document.getElementById('sheet-host').innerHTML = `<div class="sheet"><div class="grip"></div>${html}</div>`;
  document.getElementById('scrim').classList.add('show');
}
function closeModal(){ document.getElementById('scrim').classList.remove('show'); document.getElementById('sheet-host').innerHTML=''; }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2100); }

/* ---- Add to build (with replace popup) ---- */
function addToBuild(leaf, sid){
  const r=build.rows[leaf];
  if(r.locked){ toast('This category is locked.'); return; }
  if(r.serviceId && r.serviceId!==sid){
    const cur=svcById(leaf,r.serviceId), nw=svcById(leaf,sid);
    showSheet(`
      <h3>Replace on your build?</h3>
      <p class="s">Your build already has <b>${cur.name}</b> for ${LEAF[leaf].name}. What should happen with <b>${nw.name}</b>?</p>
      <div class="choose-item"><div><div class="nm">${cur.name}</div><div class="svc-tag">currently in build</div></div><div class="pr">${peso(cur.price)}</div></div>
      <div class="choose-item"><div><div class="nm">${nw.name}</div><div class="svc-tag">new pick</div></div><div class="pr">${peso(nw.price)}</div></div>
      <div class="row-btns">
        <button class="btn ghost full" data-action="closeModal">Cancel</button>
        <button class="btn ghost full" data-action="addBoth" data-leaf="${leaf}" data-sid="${sid}">Add both</button>
        <button class="btn gold full" data-action="replacePick" data-leaf="${leaf}" data-sid="${sid}">Replace</button>
      </div>
      <div class="hint">“Add both” keeps two options under ${LEAF[leaf].name} so you can compare in Build.</div>`);
    return;
  }
  r.mode='pin'; r.serviceId=sid; r.inBuild=true; render(); toast('Added to your build →');
}

/* ---- choose pin value ---- */
function choosePin(target){
  if(target==='date'){
    showSheet(`<h3>Pick your wedding date</h3><p class="s">Only the dates you shortlisted that <b>all your pinned services</b> can do. Flag the date instead to let Setnayan choose.</p>
      ${COUPLE_DATES.map(d=>{
        const bl=dateBlockers(d), ok=bl.length===0, sel=build.date.value===d;
        return `<div class="choose-item ${ok?'':'disabled'}" ${ok?`data-action="savePickDate" data-val="${d}"`:''}>
          <div style="flex:1"><div class="nm">${fmtDate(d)}</div>
          <div class="svc-tag">${ok?'All pinned services available':'Unavailable — '+bl.map(b=>b.s.name).join(', ')}</div></div>
          <div class="pr">${sel?I.check:(ok?'<span class="pick-tag">Pick</span>':I.ban)}</div>
        </div>`;}).join('')}
      <button class="btn ghost full" data-action="closeModal" style="margin-top:6px">Cancel</button>`);
    return;
  }
  if(target==='budget'){
    const over = totals().grand>CHOSEN_BUDGET, sugg=suggestedBudget();
    showSheet(`<h3>Set your total budget</h3>
      <p class="s">${over
        ? `Your picks exceed your ₱${CHOSEN_BUDGET.toLocaleString('en-PH')} estimate — starting from the <b>median</b> of your pinned + flagged categories.`
        : `Starts from your chosen estimate. A pinned budget caps what Compute can spend across flagged categories.`}</p>
      <input class="field" type="number" id="pinBudget" value="${Math.round(sugg)}" placeholder="${CHOSEN_BUDGET}">
      <div class="row-btns"><button class="btn ghost full" data-action="closeModal">Cancel</button><button class="btn gold full" data-action="savePinBudget">Pin budget</button></div>`);
    return;
  }
  if(target==='location'){
    showSheet(`<h3>Pick your location</h3><p class="s">One of your two shortlisted locations only. Flag it to let Setnayan choose between them.</p>
      ${COUPLE_LOCATIONS.map(loc=>{const sel=build.location.value===loc;
        return `<div class="choose-item" data-action="savePickLoc" data-val="${loc}">
          <div style="flex:1"><div class="nm">${loc}</div></div>
          <div class="pr">${sel?I.check:'<span class="pick-tag">Pick</span>'}</div></div>`;}).join('')}
      <button class="btn ghost full" data-action="closeModal" style="margin-top:6px">Cancel</button>`);
    return;
  }
  // category → choose from shortlist; if NOTHING shortlisted, auto-find + add to shortlist + pin (no dead-end)
  const items = shortlist[target]||[];
  if(items.length===0){
    const s=autoFindForCategory(target);
    const r=build.rows[target]; r.inBuild=true; r.mode='pin'; r.serviceId=s.id;
    render(); toast(`Found ${s.name} · added to your shortlist & pinned`);
    return;
  }
  showSheet(`<h3>Pin a ${LEAF[target].name.toLowerCase()}</h3><p class="s">Choose one of your shortlisted picks to pin into the build.</p>
    ${items.map(s=>`<div class="choose-item" data-action="pinService" data-leaf="${target}" data-sid="${s.id}">
      <div class="svc-thumb" style="width:38px;height:38px;font-size:14px;background:${LEAF[target].color}">${s.name[0]}<img src="${photoUrl(s)}" alt="" loading="lazy"></div>
      <div><div class="nm">${s.name}</div><div class="svc-tag">${s.match}% match · ${s.tag}</div></div>
      <div class="pr">${peso(s.price)}</div></div>`).join('')}
    <button class="btn ghost full" data-action="closeModal" style="margin-top:4px">Cancel</button>`);
}

/* ---- compute (auto-fill flagged; empty categories auto-find + add to shortlist) ---- */
function compute(){
  let autoFound=0;
  ORDER.forEach(id=>{
    const r=build.rows[id];
    if(!r.inBuild || r.locked) return;
    if(r.mode==='flag'){
      const items=(shortlist[id]||[]).slice().sort((a,b)=>b.match-a.match);
      if(items.length){ r.serviceId=items[0].id; }
      else { const s=autoFindForCategory(id); r.serviceId=s.id; autoFound++; }  // no choice → find more & add to shortlist
    }
  });
  // flagged anchors resolve to the couple's chosen values
  if(build.date.mode==='flag'     && !build.date.value)     { const a=allowedDates(); build.date.value=a[0]||COUPLE_DATES[0]; }
  if(build.budget.mode==='flag'   && !build.budget.value)   build.budget.value=suggestedBudget();
  if(build.location.mode==='flag' && !build.location.value) build.location.value=COUPLE_LOCATIONS[0];
  render();
  toast(autoFound
    ? `Computed — ${autoFound} categor${autoFound>1?'ies':'y'} auto-matched & added to your shortlist`
    : 'Computed — flagged categories filled');
}

/* ---- save build ---- */
function saveBuild(){
  showSheet(`<h3>Save this build</h3><p class="s">Name it to compare later — or overwrite an existing build.</p>
    <input class="field" id="buildName" placeholder="e.g. Garden Dream" />
    <button class="btn gold full" data-action="commitSave" style="margin-bottom:14px">${I.save} Save as new</button>
    ${savedBuilds.length?`<div class="eyebrow ink" style="margin-bottom:8px">Or overwrite</div>`:''}
    ${savedBuilds.map((b,i)=>`<div class="build-name-row" data-action="overwrite" data-i="${i}"><span>${b.name}</span><span class="ow">Overwrite</span></div>`).join('')}
    <button class="btn ghost full" data-action="closeModal" style="margin-top:6px">Cancel</button>`);
}
function snapshotBuild(name){
  const picks={};
  ORDER.forEach(id=>{ if(build.rows[id].serviceId) picks[id]=build.rows[id].serviceId; });
  return {name, date:build.date.value, budget:build.budget.value, picks};
}
function commitSave(){
  const name=(document.getElementById('buildName').value||'').trim()||('Build '+(savedBuilds.length+1));
  savedBuilds.push(snapshotBuild(name)); closeModal(); toast('“'+name+'” saved — see Compare'); render();
}
function overwrite(i){ const name=savedBuilds[i].name; savedBuilds[i]=snapshotBuild(name); closeModal(); toast('“'+name+'” updated'); render(); }

/* ---- lock ---- */
function lockBuild(){
  const t=totals();
  showSheet(`<h3>Lock this build?</h3><p class="s">This commits your date, budget, location and chosen services. You can still reopen it from Compare → Modify.</p>
    <div class="choose-item" style="cursor:default"><div><div class="nm">${builtCount()} services · ${peso(t.grand)}</div><div class="svc-tag">${build.date.value?fmtDate(build.date.value):'no date'} · ${build.budget.value?peso(build.budget.value)+' budget':''}</div></div></div>
    <div class="row-btns"><button class="btn ghost full" data-action="closeModal">Not yet</button><button class="btn gold full" data-action="commitLock">${I.lock} Lock it in</button></div>`);
}
function commitLock(){
  locked.date=build.date.value; locked.budget=build.budget.value;
  locked.location = build.location.value || (build.rows.reception.serviceId? LEAF.reception.area : null);
  locked.items=[];
  ORDER.forEach(id=>{ const r=build.rows[id]; if(r.inBuild && r.serviceId){ const s=svcById(id,r.serviceId); locked.items.push({leaf:id,name:s.name,price:s.price}); r.locked=true; }});
  closeModal(); state.tab='lock'; render(); toast('Locked — your day is set');
}

/* ---- compare actions ---- */
function cmpModify(){
  const b=savedBuilds[state.cmpSel];
  build.date.value=b.date; build.date.mode='pin';
  build.budget.value=b.budget; build.budget.mode='pin';
  ORDER.forEach(id=>{ build.rows[id].serviceId=b.picks[id]||null; build.rows[id].mode=b.picks[id]?'pin':'flag'; build.rows[id].locked=false; build.rows[id].inBuild=!!b.picks[id]; });
  state.tab='build'; render(); toast('“'+b.name+'” reopened in Build');
}
function cmpDelete(){
  const nm=savedBuilds[state.cmpSel].name;
  savedBuilds.splice(state.cmpSel,1); state.cmpSel=Math.max(0,state.cmpSel-1); render(); toast('“'+nm+'” deleted');
}
function cmpLock(){
  const b=savedBuilds[state.cmpSel];
  locked.date=b.date; locked.budget=b.budget; locked.location=b.picks.reception?LEAF.reception.area:null;
  locked.items=[]; ORDER.forEach(id=>{ const sid=b.picks[id]; const s=sid&&svcById(id,sid); if(s) locked.items.push({leaf:id,name:s.name,price:s.price}); });
  state.tab='lock'; render(); toast('“'+b.name+'” locked in');
}

/* ============================ EVENT DELEGATION ============================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action;
  const leaf=el.dataset.leaf, sid=el.dataset.sid, id=el.dataset.id, target=el.dataset.target, val=el.dataset.val;
  switch(a){
    case 'tab': state.tab=el.dataset.tab; render(); break;
    case 'toggleAI': state.aiEnabled=!state.aiEnabled; render(); toast('Setnayan AI '+(state.aiEnabled?'on':'off')); break;
    case 'toggleParent': {
      const opening = !state.openParents.has(id);
      state.openParents.clear();                 // single-open accordion: collapse the others
      if(opening) state.openParents.add(id);
      render();
      if(opening){ const h=document.querySelector(`[data-action="toggleParent"][data-id="${id}"]`); h && h.scrollIntoView({behavior:'smooth',block:'start'}); }
      break;
    }
    case 'toggleLeaf': state.openLeaves.has(id)?state.openLeaves.delete(id):state.openLeaves.add(id); render(); break;
    case 'addToBuild': addToBuild(leaf,sid); break;
    case 'replacePick': build.rows[leaf].mode='pin'; build.rows[leaf].serviceId=sid; build.rows[leaf].inBuild=true; closeModal(); render(); toast('Replaced in build'); break;
    case 'addBoth': /* both already in shortlist; pin the new one, keep old shortlisted */ build.rows[leaf].mode='pin'; build.rows[leaf].serviceId=sid; build.rows[leaf].inBuild=true; closeModal(); render(); toast('Both kept in shortlist · new pick in build'); break;
    case 'find': toast('Opening marketplace for '+LEAF[leaf].name+'…'); break;
    case 'addManual': addManual(leaf); break;
    case 'manualDemo': manualDemo(leaf); break;
    case 'setMode': setMode(target, el.dataset.mode); break;
    case 'choosePin': choosePin(target); break;
    case 'savePickDate': build.date.value=val; build.date.mode='pin'; closeModal(); render(); toast('Wedding date set'); break;
    case 'savePinBudget': build.budget.value=parseInt(document.getElementById('pinBudget').value||'0',10); build.budget.mode='pin'; closeModal(); render(); break;
    case 'savePickLoc': build.location.value=val; build.location.mode='pin'; closeModal(); render(); toast('Location set'); break;
    case 'pinService': build.rows[leaf].mode='pin'; build.rows[leaf].serviceId=sid; closeModal(); render(); toast('Pinned to build'); break;
    case 'goShortlist': closeModal(); state.tab='shortlist'; state.openLeaves.add(leaf); CATALOG.forEach(p=>{if(p.leaves.some(l=>l.id===leaf))state.openParents.add(p.id);}); render(); break;
    case 'compute': compute(); break;
    case 'addCategory': addCategory(); break;
    case 'addCatPick': addCatPick(leaf); break;
    case 'reset': resetBuild(); break;
    case 'saveBuild': saveBuild(); break;
    case 'commitSave': commitSave(); break;
    case 'overwrite': overwrite(+el.dataset.i); break;
    case 'lockBuild': lockBuild(); break;
    case 'commitLock': commitLock(); break;
    case 'cmpSel': state.cmpSel=+el.dataset.i; render(); break;
    case 'cmpExpand': state.cmpExpanded.has(id)?state.cmpExpanded.delete(id):state.cmpExpanded.add(id); render(); break;
    case 'cmpModify': cmpModify(); break;
    case 'cmpDelete': cmpDelete(); break;
    case 'cmpLock': cmpLock(); break;
    case 'closeModal': closeModal(); break;
  }
});

function setMode(target, mode){
  const anchors={date:1,budget:1,location:1};
  const isAnchor = !!anchors[target];
  const obj = isAnchor ? build[target] : build.rows[target];
  // mutually exclusive + deselectable: tapping the active mode clears it back to neutral
  obj.mode = (obj.mode===mode) ? 'none' : mode;
  // only a PIN keeps a value/pick; flag and none are empty (flag gets filled by Compute)
  if(obj.mode!=='pin'){ if(isAnchor) obj.value=null; else obj.serviceId=null; }
  render();
}
function resetBuild(){
  showSheet(`<h3>Reset the build?</h3><p class="s">This clears every pick, date and budget back to flagged defaults. Locked items stay locked.</p>
    <div class="row-btns"><button class="btn ghost full" data-action="closeModal">Cancel</button><button class="btn danger full" data-action="doReset">${I.reset} Reset all</button></div>`);
}
document.addEventListener('click',e=>{ if(e.target.closest('[data-action="doReset"]')){
  ORDER.forEach(id=>{ if(!build.rows[id].locked){ build.rows[id].mode='flag'; build.rows[id].serviceId=null; build.rows[id].inBuild=false; }});
  build.date={mode:'flag',value:null,locked:false}; build.budget={mode:'flag',value:null,locked:false}; build.location={mode:'flag',value:null,locked:false};
  closeModal(); render(); toast('Build reset — locked picks kept');
}});

/* ---- add a category to the build canvas ---- */
function addCategory(){
  const avail = CATALOG.map(p=>({p, leaves:p.leaves.filter(l=>!build.rows[l.id].inBuild)})).filter(g=>g.leaves.length);
  if(!avail.length){ toast('Every category is already in your build'); return; }
  showSheet(`<h3>Add a category</h3><p class="s">Add a category to the build canvas. It starts flagged — Compute fills it, or pin a shortlisted pick.</p>
    <div style="max-height:46vh;overflow:auto;margin:0 -4px;padding:0 4px">
    ${avail.map(g=>`<div class="eyebrow ink" style="margin:10px 0 6px">${g.p.name}</div>
      ${g.leaves.map(l=>`<div class="choose-item" data-action="addCatPick" data-leaf="${l.id}">
        <div class="svc-thumb" style="width:30px;height:30px;font-size:12px;background:${LEAF[l.id].color}">${g.p.name[0]}</div>
        <div class="nm">${l.name}</div>
        <div class="pr" style="font-size:11px;color:var(--muted);font-family:var(--sans);font-weight:600">${shortlist[l.id]?.length? shortlist[l.id].length+' saved':'flag'}</div>
      </div>`).join('')}`).join('')}
    </div>
    <button class="btn ghost full" data-action="closeModal" style="margin-top:8px">Cancel</button>`);
}
function addCatPick(leaf){ build.rows[leaf].inBuild=true; build.rows[leaf].mode='flag'; closeModal(); render(); toast(LEAF[leaf].name+' added — flag it or pin a pick'); }

/* ============================ BOOT ============================ */
render();
</script>
</body>
