<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Veil 3 — Curtain · same A&J background</title>
<style>:root{--font-sans:system-ui,-apple-system,Arial,sans-serif;--font-mono:ui-monospace,Menlo,monospace;--font-serif:Georgia,serif;--color-text-primary:#e7dcc7;--color-text-secondary:#c9bda9;--color-text-tertiary:#8c8174;--color-background-primary:#1b1713;--color-background-secondary:#241e18;--color-border-tertiary:#ffffff22;--border-radius-md:8px;--border-radius-lg:12px;--border-radius-xl:16px;}
html,body{margin:0;background:#14110f;min-height:100vh}body{display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);padding:16px}.wrap{width:min(760px,96vw)}</style></head><body><div class="wrap">
<div style="background:#14110f;border-radius:var(--border-radius-lg);overflow:hidden;position:relative">
  <div id="vc-stage" style="position:relative;width:100%;height:440px;background:radial-gradient(120% 90% at 50% 40%, #1a140d 0%, #0f0b06 72%)"></div>
  <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px 14px;background:#1b1713">
    <div style="display:flex;align-items:center;gap:8px;flex:1 1 180px">
      <label style="font-size:12px;color:#c9bda9;min-width:42px">Open</label>
      <input id="vc-open" type="range" min="0" max="100" value="100" step="1" style="flex:1"/>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex:1 1 150px">
      <label style="font-size:12px;color:#c9bda9;min-width:54px">S depth</label>
      <input id="vc-s" type="range" min="0" max="100" value="100" step="1" style="flex:1"/>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex:1 1 130px">
      <label style="font-size:12px;color:#c9bda9;min-width:34px">Wind</label>
      <input id="vc-wind" type="range" min="0" max="100" value="40" step="1" style="flex:1"/>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex:1 1 140px">
      <label style="font-size:12px;color:#c9bda9;min-width:62px">Thread gap</label>
      <input id="vc-gap" type="range" min="6" max="22" value="11" step="1" style="flex:1"/>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:12px;color:#c9bda9">Colour</label>
      <input id="vc-col" type="color" value="#f3ece1" style="width:34px;height:28px;border:none;background:none;padding:0;cursor:pointer"/>
      <button id="vc-p1" title="Ivory" style="width:22px;height:22px;border-radius:50%;border:1px solid #00000033;background:#f3ece1;cursor:pointer;padding:0"></button>
      <button id="vc-p2" title="Champagne" style="width:22px;height:22px;border-radius:50%;border:1px solid #00000033;background:#e8d6b0;cursor:pointer;padding:0"></button>
      <button id="vc-p3" title="Blush" style="width:22px;height:22px;border-radius:50%;border:1px solid #00000033;background:#e9cdcb;cursor:pointer;padding:0"></button>
      <button id="vc-p4" title="Mulberry" style="width:22px;height:22px;border-radius:50%;border:1px solid #00000033;background:#7a3b52;cursor:pointer;padding:0"></button>
    </div>
  </div>
  <div style="padding:8px 14px 12px;font-size:11px;color:#8c8174;background:#1b1713">Loads <b style="color:#c9bda9;font-weight:500">fully open</b> — all the fabric is swept into the locked edge band at the two corners, centre fully clear. Drag the stage down to draw it closed. <span style="color:#7a6f60">Procedural lace + flat monogram — true scanned-lace PBR in the build.</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var stage=document.getElementById('vc-stage');
  var W=stage.clientWidth||680, H=440;
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(W,H); renderer.outputEncoding=THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement); renderer.domElement.style.display='block';

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(45, W/H, 0.1, 100);
  camera.position.set(0,0,4.2);
  scene.add(new THREE.HemisphereLight(0xfff6e8,0x241c16,0.55));
  var key=new THREE.SpotLight(0xfff3e0,1.5,40,Math.PI/5,0.6,1.0); key.position.set(2.2,3.0,4.5); scene.add(key);
  var rim=new THREE.DirectionalLight(0xffe9c6,0.5); rim.position.set(-3,1,2); scene.add(rim);

  function monogramTex(){
    var c=document.createElement('canvas'); c.width=1024; c.height=1024; var x=c.getContext('2d');
    x.fillStyle='#16110b'; x.fillRect(0,0,1024,1024);
    var cw=560, ch=780, cx0=(1024-cw)/2, cy0=(1024-ch)/2;
    x.fillStyle='#e8ddc6'; x.fillRect(cx0,cy0,cw,ch);
    var im=x.getImageData(cx0,cy0,cw,ch),dd=im.data,ii; for(ii=0;ii<dd.length;ii+=4){var n=(Math.random()-0.5)*8;dd[ii]+=n;dd[ii+1]+=n;dd[ii+2]+=n;} x.putImageData(im,cx0,cy0);
    x.strokeStyle='rgba(203,158,75,0.6)'; x.lineWidth=2; x.strokeRect(cx0+26,cy0+26,cw-52,ch-52);
    x.strokeStyle='rgba(203,158,75,0.3)'; x.lineWidth=1; x.strokeRect(cx0+36,cy0+36,cw-72,ch-72);
    x.textAlign='center'; x.textBaseline='middle'; var mid=512;
    x.fillStyle='#b8923f'; x.font='27px Georgia, serif'; x.fillText('S A V E   T H E   D A T E', mid, cy0+120);
    x.fillStyle='#cb9e4b'; x.font='italic 180px Georgia, serif'; x.shadowColor='rgba(203,158,75,0.4)'; x.shadowBlur=18; x.fillText('A', mid-115, cy0+360); x.fillText('J', mid+115, cy0+360); x.shadowBlur=0;
    x.font='italic 92px Georgia, serif'; x.fillStyle='#b8923f'; x.fillText('&', mid, cy0+378);
    x.fillStyle='#6b5a3f'; x.font='30px Georgia, serif'; x.fillText('14 · 12 · 2026', mid, cy0+560);
    x.fillStyle='#8a7757'; x.font='20px Georgia, serif'; x.fillText('Tagaytay, Philippines', mid, cy0+612);
    var t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
  }
  var back=new THREE.Mesh(new THREE.PlaneGeometry(6.4,6.4), new THREE.MeshBasicMaterial({map:monogramTex()}));
  back.position.z=-0.6; scene.add(back);

  function netTex(gap){
    var c=document.createElement('canvas'); c.width=256; c.height=256; var x=c.getContext('2d'); x.clearRect(0,0,256,256);
    x.strokeStyle='rgba(255,255,255,0.55)'; x.lineWidth=1.1;
    for(var i=0;i<=256;i+=gap){ x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.stroke(); x.beginPath();x.moveTo(0,i);x.lineTo(256,i);x.stroke(); }
    x.fillStyle='rgba(255,255,255,0.5)';
    for(var k=0;k<40;k++){var px=((k*53)%256),py=((k*97)%256);x.beginPath();x.arc(px,py,1.6,0,6.28);x.fill();}
    var t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,9); t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t;
  }
  var mat=new THREE.MeshStandardMaterial({ color:new THREE.Color('#f3ece1'), roughness:0.82, metalness:0.0, alphaMap:netTex(11), transparent:true, opacity:0.93, side:THREE.DoubleSide, depthWrite:false });
  mat.onBeforeCompile=function(sh){
    sh.vertexShader='varying vec3 vWP;varying vec3 vNN;\n'+sh.vertexShader
      .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;vNN=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader='varying vec3 vWP;varying vec3 vNN;\n'+sh.fragmentShader
      .replace('#include <dithering_fragment>','#include <dithering_fragment>\nvec3 V=normalize(cameraPosition-vWP);float fr=pow(1.0-abs(dot(V,normalize(vNN))),2.2);gl_FragColor.rgb+=fr*0.5;gl_FragColor.a=clamp(gl_FragColor.a+fr*0.32,0.0,1.0);');
  };

  // rails just past the screen corner; fat centre overlap; shape-match keeps it covered
  var edgeX=2.5, ov=1.05, topY=3.0, frontZ=0.82, clothH=9.0;
  var cols=26, rows=26, span=edgeX+ov;

  function buildPanel(sign){
    var geo=new THREE.PlaneGeometry(1,1,cols-1,rows-1);
    var n=cols*rows;
    var pos=new Float32Array(n*3), old=new Float32Array(n*3);
    var rest=new Float32Array(n*2), gath=new Float32Array(n*2);
    var lock=new Uint8Array(n), phase=new Float32Array(cols), fade=new Float32Array(cols);
    for(var c=0;c<cols;c++){ var u=c/(cols-1); phase[c]=c*0.82; fade[c]=Math.min(1,u/0.10)*Math.min(1,(1-u)/0.16); }
    for(var r=0;r<rows;r++){
      for(var c2=0;c2<cols;c2++){
        var i=r*cols+c2, u2=c2/(cols-1), v=r/(rows-1);
        var railOuter=sign*edgeX;
        var restX=railOuter+(-sign)*(u2*span);                              // closed: rail past centre
        var gathX=railOuter+(-sign)*(0.02*span)+(-sign)*(u2*0.07*span);     // OPEN: pile into the locked edge band
        var y=topY - v*clothH;
        rest[i*2]=restX; rest[i*2+1]=y; gath[i*2]=gathX; gath[i*2+1]=y;
        lock[i]=(u2<0.05)?1:0;
        pos[i*3]=restX; pos[i*3+1]=y; pos[i*3+2]=frontZ; old[i*3]=restX; old[i*3+1]=y; old[i*3+2]=frontZ;
      }
    }
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    var mesh=new THREE.Mesh(geo,mat); scene.add(mesh);
    return {mesh:mesh,pos:pos,old:old,rest:rest,gath:gath,lock:lock,phase:phase,fade:fade,sign:sign};
  }
  var L=buildPanel(-1), R=buildPanel(1), panels=[L,R];

  var openE=0, openTarget=1.0, sDepth=1.0, windAmt=0.40, t0=0;
  function ease(p){return p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}

  function simulate(P,time,e){
    var pos=P.pos, old=P.old, damp=0.86;
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var i=r*cols+c;
        var fz = sDepth*0.62*Math.sin(P.phase[c])*P.fade[c];
        var wv = windAmt*0.10*Math.sin(time*1.5 + P.rest[i*2+1]*0.6 + c*0.35)*(r/rows);
        var oe = P.lock[i]? 0 : e;
        var tx = P.rest[i*2] + (P.gath[i*2]-P.rest[i*2])*oe;
        var ty = P.rest[i*2+1];
        if(r===0){
          pos[i*3]=tx; pos[i*3+1]=ty+0.015*Math.sin(time*1.2+c); pos[i*3+2]= P.lock[i]?frontZ:(frontZ+fz);
          old[i*3]=pos[i*3]; old[i*3+1]=pos[i*3+1]; old[i*3+2]=pos[i*3+2]; continue;
        }
        var vx=(pos[i*3]-old[i*3])*damp, vy=(pos[i*3+1]-old[i*3+1])*damp, vz=(pos[i*3+2]-old[i*3+2])*damp;
        old[i*3]=pos[i*3]; old[i*3+1]=pos[i*3+1]; old[i*3+2]=pos[i*3+2];
        pos[i*3]   += vx + (tx - pos[i*3])*0.14 + wv*0.4;
        pos[i*3+1] += vy + (ty - pos[i*3+1])*0.12 - 0.0006;
        pos[i*3+2] += vz + (frontZ + (P.lock[i]?0:fz) + wv - pos[i*3+2])*0.16;
      }
    }
    P.mesh.geometry.attributes.position.needsUpdate=true; P.mesh.geometry.computeVertexNormals();
  }

  function frame(ts){
    if(!t0)t0=ts; var time=(ts-t0)/1000;
    openE += (openTarget-openE)*0.06;
    var e=ease(Math.min(1,openE));
    simulate(L,time,e); simulate(R,time,e);
    renderer.render(scene,camera); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  var openS=document.getElementById('vc-open'), acc=100;
  function setOpen(v){ openTarget=v/100; if(openS.value!=v)openS.value=v; }
  openS.addEventListener('input',function(){ openTarget=this.value/100; acc=+this.value; });
  document.getElementById('vc-s').addEventListener('input',function(){ sDepth=this.value/100; });
  document.getElementById('vc-wind').addEventListener('input',function(){ windAmt=this.value/100; });
  document.getElementById('vc-gap').addEventListener('input',function(){ mat.alphaMap=netTex(parseInt(this.value,10)); mat.needsUpdate=true; });
  function setCol(hex){ mat.color.set(hex); document.getElementById('vc-col').value=hex; }
  document.getElementById('vc-col').addEventListener('input',function(){ mat.color.set(this.value); });
  document.getElementById('vc-p1').onclick=function(){setCol('#f3ece1');};
  document.getElementById('vc-p2').onclick=function(){setCol('#e8d6b0');};
  document.getElementById('vc-p3').onclick=function(){setCol('#e9cdcb');};
  document.getElementById('vc-p4').onclick=function(){setCol('#7a3b52');};

  stage.addEventListener('wheel',function(ev){ ev.preventDefault(); acc=Math.max(0,Math.min(100,acc-ev.deltaY*0.18)); setOpen(acc); },{passive:false});
  var dragging=false,sy=0,sv=0;
  stage.addEventListener('pointerdown',function(ev){dragging=true;sy=ev.clientY;sv=acc;stage.setPointerCapture(ev.pointerId);});
  stage.addEventListener('pointermove',function(ev){ if(!dragging)return; acc=Math.max(0,Math.min(100,sv-(ev.clientY-sy)*0.35)); setOpen(acc); });
  stage.addEventListener('pointerup',function(){dragging=false;});
  window.addEventListener('resize',function(){ var nw=stage.clientWidth||680; renderer.setSize(nw,H); camera.aspect=nw/H; camera.updateProjectionMatrix(); });
})();
</script>
</div></body></html>
