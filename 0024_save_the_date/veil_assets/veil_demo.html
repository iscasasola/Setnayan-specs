<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Setnayan Veil — net body + 5% lace trim</title>
<style>
  html,body{margin:0;height:100%;background:#14110f;font-family:Georgia,serif;overflow:hidden}
  #stage{position:fixed;inset:0;background:radial-gradient(120% 95% at 50% 34%, #2c241d 0%, #14110f 72%)}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:14px;align-items:center;
       padding:12px 18px;background:rgba(27,23,19,.82);backdrop-filter:blur(6px);font-family:system-ui,Arial,sans-serif}
  label{font-size:13px;color:#c9bda9}
  .sw{width:26px;height:26px;border-radius:50%;border:1px solid #00000033;cursor:pointer;padding:0}
  #hint{margin-left:auto;font-size:12px;color:#8c8174}
  input[type=color]{width:38px;height:30px;border:none;background:none;padding:0;cursor:pointer}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <label>Veil colour</label>
  <input id="col" type="color" value="#f3ece1"/>
  <button class="sw" data-c="#f3ece1" title="Ivory" style="background:#f3ece1"></button>
  <button class="sw" data-c="#e8d6b0" title="Champagne" style="background:#e8d6b0"></button>
  <button class="sw" data-c="#e9cdcb" title="Blush" style="background:#e9cdcb"></button>
  <button class="sw" data-c="#cfd9d2" title="Sage" style="background:#cfd9d2"></button>
  <button class="sw" data-c="#7a3b52" title="Mulberry" style="background:#7a3b52"></button>
  <span id="hint">drag up / scroll to lift the veil &nbsp;·&nbsp; net body + 5% lace trim + gold Setnayan accent</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var stage=document.getElementById('stage');
  function size(){return [window.innerWidth, window.innerHeight-58];}
  var W,H; [W,H]=size();
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(W,H); renderer.outputEncoding=THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement); renderer.domElement.style.display='block';

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(45, W/H, 0.1, 100); camera.position.set(0,0,4.4);
  scene.add(new THREE.HemisphereLight(0xfff6e8,0x241c16,0.6));
  var key=new THREE.SpotLight(0xfff3e0,1.6,40,Math.PI/5,0.6,1.0); key.position.set(2.0,3.2,4.8); scene.add(key);
  var dir=new THREE.DirectionalLight(0xffe9c6,0.5); dir.position.set(-3,1,2); scene.add(dir);

  function monoTex(){
    var c=document.createElement('canvas'); c.width=512; c.height=512; var x=c.getContext('2d');
    var g=x.createRadialGradient(256,220,30,256,256,360); g.addColorStop(0,'#3a2f26'); g.addColorStop(1,'#17110c'); x.fillStyle=g; x.fillRect(0,0,512,512);
    x.fillStyle='rgba(224,196,138,0.92)'; x.textAlign='center'; x.textBaseline='middle';
    x.font='italic 210px Georgia, serif'; x.shadowColor='rgba(232,210,150,0.5)'; x.shadowBlur=22; x.fillText('S',256,238); x.shadowBlur=0;
    x.font='27px Georgia, serif'; x.fillStyle='rgba(224,196,138,0.7)'; x.fillText('A  &  M',256,360);
    x.font='15px Georgia, serif'; x.fillStyle='rgba(224,196,138,0.5)'; x.fillText('SAVE THE DATE',256,398);
    var t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
  }
  var back=new THREE.Mesh(new THREE.PlaneGeometry(7.6,7.6), new THREE.MeshBasicMaterial({map:monoTex()})); back.position.z=-0.8; scene.add(back);

  var GOLD='#cb9e4b';
  var markPath="M 1859.526,3749.781 C 1458.028,3717.757 1065.454,3548.554 758.3406,3241.44 451.2286,2934.328 282.2397,2541.742 250.2195,2140.255 l 1326.8215,1.536 V 661.7647 C 1368.543,727.4195 1172.067,841.5416 1006.804,1006.804 768.3191,1245.29 633.8543,1548.261 602.7217,1859.526 H 250 C 282.024,1458.028 451.2265,1065.455 758.3406,758.3406 1065.453,451.2287 1458.039,282.2396 1859.526,250.2195 V 2422.739 H 661.7647 c 65.6549,208.498 179.7773,404.975 345.0393,570.237 238.486,238.486 541.457,372.95 852.722,404.083 z m 280.948,0 1.537,-1609.307 h 280.948 v 1197.761 c 208.498,-65.655 404.974,-179.776 570.237,-345.039 238.485,-238.486 372.95,-541.457 404.082,-852.722 H 3750 c -32.024,401.498 -201.226,794.071 -508.341,1101.185 -307.112,307.112 -699.697,476.101 -1101.185,508.122 z m 0,-1890.255 c 32.025,-401.498 201.227,-794.073 508.341,-1101.1854 0.658,-0.6584 1.316,-1.3173 1.975,-1.9754 -80.395,-42.041 -163.892,-76.0428 -249.331,-101.7389 -85.439,-25.696 -172.821,-43.0864 -260.985,-51.9046 V 250.2195 c 401.497,32.0253 794.073,201.0094 1101.185,508.1211 307.114,307.1134 476.317,699.6874 508.341,1101.1854 h -352.722 c -31.132,-311.265 -165.597,-614.236 -404.082,-852.722 -15.719,-15.7189 -32.464,-29.741 -48.727,-44.5564 -15.975,14.4789 -31.774,29.1397 -47.191,44.5564 -238.485,238.486 -372.95,541.457 -404.082,852.722 z";
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5333.3335 5333.3335" width="160" height="160"><path d="'+markPath+'" fill="'+GOLD+'" fill-rule="nonzero" transform="matrix(1.3333333,0,0,-1.3333333,0,5333.3333)"/></svg>';
  var markURL='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);

  function teardrop(cx,cy,L,Wd,ang){ var p=[],n=20; for(var i=0;i<=n;i++){ var t=i/n*6.2832, r=(1-Math.cos(t))/2, x=Wd*Math.sin(t)*Math.pow(r,0.8), y=-L*r; p.push([cx+x*Math.cos(ang)-y*Math.sin(ang), cy+x*Math.sin(ang)+y*Math.cos(ang)]); } return p; }
  function star(g,cx,cy,R){ g.strokeStyle='rgba(255,255,255,0.92)'; g.lineWidth=1.1; for(var k=0;k<8;k++){ var a=k/8*6.2832, p=teardrop(cx,cy,R,R*0.42,a); g.beginPath(); g.moveTo(p[0][0],p[0][1]); for(var i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]); g.closePath(); g.stroke(); } g.fillStyle='rgba(255,255,255,0.95)'; for(var b=0;b<6;b++){ var aa=b/6*6.2832; g.beginPath(); g.arc(cx+Math.cos(aa)*R*0.2,cy+Math.sin(aa)*R*0.2,1.2,0,6.2832); g.fill(); } }

  var Cw=1024, Ch=1280;
  var mat=new THREE.MeshStandardMaterial({ color:new THREE.Color('#f3ece1'), roughness:0.84, metalness:0.0, transparent:true, opacity:0.92, side:THREE.DoubleSide, depthWrite:false, emissive:new THREE.Color(GOLD), emissiveIntensity:0.85 });
  mat.onBeforeCompile=function(sh){
    sh.vertexShader='varying vec3 vWP;varying vec3 vNN;\n'+sh.vertexShader.replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;vNN=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader='varying vec3 vWP;varying vec3 vNN;\n'+sh.fragmentShader.replace('#include <dithering_fragment>','#include <dithering_fragment>\nvec3 V=normalize(cameraPosition-vWP);float fr=pow(1.0-abs(dot(V,normalize(vNN))),1.7);gl_FragColor.rgb+=fr*0.85;gl_FragColor.a=clamp(gl_FragColor.a+fr*0.6,0.0,1.0);');
  };
  function buildTextures(markImg){
    var mw=document.createElement('canvas'); mw.width=mw.height=140; var mc=mw.getContext('2d');
    if(markImg){ mc.drawImage(markImg,0,0,140,140); mc.globalCompositeOperation='source-in'; mc.fillStyle='#fff'; mc.fillRect(0,0,140,140); mc.globalCompositeOperation='source-over'; }
    var a=document.createElement('canvas'); a.width=Cw; a.height=Ch; var g=a.getContext('2d');
    var e=document.createElement('canvas'); e.width=Cw; e.height=Ch; var ge=e.getContext('2d');
    g.fillStyle='#000'; g.fillRect(0,0,Cw,Ch); ge.fillStyle='#000'; ge.fillRect(0,0,Cw,Ch);
    g.strokeStyle='rgba(255,255,255,0.42)'; g.lineWidth=1;
    for(var d=-Ch; d<Cw+Ch; d+=11){ g.beginPath(); g.moveTo(d,0); g.lineTo(d+Ch,Ch); g.stroke(); g.beginPath(); g.moveTo(d,Ch); g.lineTo(d+Ch,0); g.stroke(); }
    var laceTop=Ch*0.95, ms=40;
    if(markImg){ for(var r=0;r<7;r++) for(var c=0;c<6;c++){ if((r+c)%2) continue; var off=(r%2)?Cw/12:0; var px=70+c*(Cw/6)+off, py=120+r*((laceTop-160)/6); if(px>Cw-30||py>laceTop-40) continue; g.globalAlpha=0.5; g.drawImage(mw,px-ms/2,py-ms/2,ms,ms); g.globalAlpha=1; ge.drawImage(mw,px-ms/2,py-ms/2,ms,ms); } }
    var units=24, period=Cw/units, rscal=period*0.46, baseE=Ch-3, topE=baseE-rscal, topTrim=topE-rscal*1.5;
    g.save(); g.beginPath(); g.rect(0,topTrim,Cw,topE-topTrim);
    for(var u=0;u<units;u++){ var cxs=period*(u+0.5); g.moveTo(cxs+rscal,topE); g.arc(cxs,topE,rscal,0,Math.PI,false); }
    g.clip();
    g.strokeStyle='rgba(255,255,255,0.34)'; g.lineWidth=1;
    for(var d2=-Ch; d2<Cw+Ch; d2+=6){ g.beginPath(); g.moveTo(d2,topTrim); g.lineTo(d2+Ch,Ch); g.stroke(); g.beginPath(); g.moveTo(d2,Ch); g.lineTo(d2+Ch,topTrim); g.stroke(); }
    g.restore();
    for(var u2=0;u2<units;u2++){ var cx2=period*(u2+0.5); star(g,cx2,topE-2,period*0.30); g.fillStyle='rgba(255,255,255,0.85)'; g.beginPath(); g.arc(period*u2,topE,2.0,0,6.2832); g.fill(); }
    g.strokeStyle='rgba(255,255,255,0.85)'; g.lineWidth=1.5;
    for(var u3=0;u3<units;u3++){ var cx3=period*(u3+0.5); g.beginPath(); g.arc(cx3,topE,rscal,0,Math.PI,false); g.stroke(); for(var aa=12;aa<170;aa+=18){ var ar=aa*Math.PI/180, ox=cx3+Math.cos(ar)*(rscal+4), oy=topE+Math.sin(ar)*(rscal+4); g.fillStyle='rgba(255,255,255,0.9)'; g.beginPath(); g.arc(ox,oy,1.6,0,6.2832); g.fill(); } }
    var aT=new THREE.CanvasTexture(a); aT.anisotropy=renderer.capabilities.getMaxAnisotropy();
    var eT=new THREE.CanvasTexture(e); eT.anisotropy=renderer.capabilities.getMaxAnisotropy(); eT.encoding=THREE.sRGBEncoding;
    mat.alphaMap=aT; mat.emissiveMap=eT; mat.needsUpdate=true;
  }
  var img=new Image(); img.onload=function(){ buildTextures(img); }; img.onerror=function(){ buildTextures(null); }; img.src=markURL;

  var cols=46, rows=52, topY=2.5, botY=-1.62, halfW=2.9, frontZ=0.7, Sdepth=0.62, Wind=0.40;
  var geo=new THREE.PlaneGeometry(1,1,cols-1,rows-1);
  var n=cols*rows, pos=new Float32Array(n*3), old=new Float32Array(n*3), rx=new Float32Array(n), ry=new Float32Array(n);
  for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){ var i=r*cols+c,u=c/(cols-1),v=r/(rows-1); var X=(u*2-1)*halfW, Y=topY+(botY-topY)*v; rx[i]=X; ry[i]=Y; pos[i*3]=X; pos[i*3+1]=Y; pos[i*3+2]=frontZ; old[i*3]=X; old[i*3+1]=Y; old[i*3+2]=frontZ; }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var veil=new THREE.Mesh(geo,mat); scene.add(veil);

  // FOLD parameters — deep gathered folds cascading from the crown, whiter where fabric folds (fresnel)
  var FOLDFREQ=1.7, FOLDAMP=1.5, PLEAT=0.30, GATHER=0.90;
  var lift=0, liftTarget=0, t0=0;
  function frame(ts){
    if(!t0)t0=ts; var time=(ts-t0)/1000; lift+=(liftTarget-lift)*0.06; var damp=0.9;
    for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
      var i=r*cols+c, v=r/(rows-1);
      var foldD=0.30+0.70*v;                                  // folds open up toward the hem
      var ph=rx[i]*FOLDFREQ;
      // gather fabric INTO the folds (x bunches near fold cores) — this is what makes it "fold"
      var tx=rx[i] + PLEAT*Math.sin(ph)*(0.45+0.55*v);
      var ty=ry[i]+lift*5.2;
      // 3D fold: main fold + finer secondary fold, deepening down the drape
      var zf=FOLDAMP*Math.sin(ph)*foldD + 0.34*Math.sin(rx[i]*4.0+1.0)*foldD;
      var zw=Wind*(0.12+v*0.5)*Math.sin(rx[i]*1.3+time*1.05)*Math.sin(ry[i]*0.8-time*0.7);
      var tz=frontZ+zf+zw;
      if(r===0){ // gathered, pleated crown
        pos[i*3]=rx[i]*GATHER + PLEAT*Math.sin(ph);
        pos[i*3+1]=ty+0.02*Math.sin(time*1.0+c);
        pos[i*3+2]=frontZ+FOLDAMP*Math.sin(ph)*0.30;
        old[i*3]=pos[i*3]; old[i*3+1]=pos[i*3+1]; old[i*3+2]=pos[i*3+2]; continue;
      }
      var vx=(pos[i*3]-old[i*3])*damp, vy=(pos[i*3+1]-old[i*3+1])*damp, vz=(pos[i*3+2]-old[i*3+2])*damp;
      old[i*3]=pos[i*3]; old[i*3+1]=pos[i*3+1]; old[i*3+2]=pos[i*3+2];
      pos[i*3]+=vx+(tx-pos[i*3])*0.13; pos[i*3+1]+=vy+(ty-pos[i*3+1])*0.12-0.0006*(1-v); pos[i*3+2]+=vz+(tz-pos[i*3+2])*0.15;
    }
    geo.attributes.position.needsUpdate=true; geo.computeVertexNormals();
    renderer.render(scene,camera); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function setCol(hex){ mat.color.set(hex); document.getElementById('col').value=hex; }
  document.getElementById('col').addEventListener('input',function(){ mat.color.set(this.value); });
  Array.prototype.forEach.call(document.querySelectorAll('.sw'),function(b){ b.onclick=function(){ setCol(b.getAttribute('data-c')); }; });
  var acc=0;
  window.addEventListener('wheel',function(ev){ acc=Math.max(0,Math.min(1,acc+ev.deltaY*0.0016)); liftTarget=acc; },{passive:true});
  var drag=false,sy=0,sv=0;
  stage.addEventListener('pointerdown',function(ev){drag=true;sy=ev.clientY;sv=acc;});
  window.addEventListener('pointermove',function(ev){ if(!drag)return; acc=Math.max(0,Math.min(1,sv+(sy-ev.clientY)*0.004)); liftTarget=acc; });
  window.addEventListener('pointerup',function(){drag=false;});
  window.addEventListener('resize',function(){ var s=size(); W=s[0]; H=s[1]; renderer.setSize(W,H); camera.aspect=W/H; camera.updateProjectionMatrix(); });
})();
</script>
</body>
</html>
