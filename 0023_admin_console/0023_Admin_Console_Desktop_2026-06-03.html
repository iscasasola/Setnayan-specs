.website-dp{margin:0;font-size:13px;line-height:1.5;color:var(--ink)}

/* locked config rows */
.website-cfg{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px}
.website-cfgrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.website-ck{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-soft)}
.website-cv{font-size:12.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.website-cfg-empty{font-size:12.5px;color:var(--ink-faint);font-style:italic}

/* audit log preview */
.website-log{display:flex;flex-direction:column}
.website-logrow{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.website-logrow:last-child{border-bottom:none}
.website-logdot{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;
  background:var(--gold-soft);border:1px solid var(--gold-line);color:#8a6d2f}
.website-logbody{flex:1;font-size:12.5px;line-height:1.45;color:var(--ink)}
.website-act{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mulberry);
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:5px;padding:1px 6px}
.website-logbody small{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px}

/* ads */
/* ===== Ads surface (admin · Boosted Ads + Sponsored Boost) — scoped extras =====
   Mirrors the .guestwrap 3-pane desktop split (filter rail | table | detail).
   Fill-don't-stretch: ultrawide WIDENS the rail/detail + the in-detail performance
   grid gains a 3rd column — the table never just stretches. Palette vars only. */

.ads-wrap{display:grid;grid-template-columns:236px 1fr 360px;gap:16px;align-items:start}
@media(min-width:1700px){.ads-wrap{grid-template-columns:264px 1fr 408px}}
@media(max-width:1180px){.ads-wrap{grid-template-columns:220px 1fr}}
@media(max-width:1180px){.ads-wrap .gdetail{display:none}}

/* rail footnote */
.ads-note{margin-top:14px;font-size:11.5px;line-height:1.5;color:var(--ink-soft);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px}
.ads-note b{color:#8a6d2f}

/* stat strip numerals match Georgia .v */
.statstrip .ads-num{font-family:Georgia,serif}

/* type badges */
.ads-type{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;display:inline-block;white-space:nowrap}
.ads-boost{color:#3a6ea5;background:#eaf1f8;border:1px solid #cfe0f0}
body.dark .ads-boost{color:#9cc0e6;background:#1d2733;border-color:#2c3a4a}
.ads-sponsored{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.ads-cert{color:var(--gold);font-size:11px}

/* money cell */
.ads-money{font-variant-numeric:tabular-nums;font-weight:600}
.ads-money small{color:var(--ink-faint);font-weight:600;font-size:11px}
.ads-ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.04em;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px}

/* detail hero tag row */
.ads-herotags{display:flex;gap:7px;justify-content:center;margin-top:9px}

/* performance block — grid adds a 3rd column on ultrawide */
.ads-perfhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:16px 0 9px}
.ads-perf{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(min-width:1700px){.ads-perf{grid-template-columns:1fr 1fr 1fr}}
.ads-pcell{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.ads-pcell .pv{font-family:Georgia,serif;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.ads-pcell .pk{font-size:11px;color:var(--ink-soft);margin-top:3px}

/* action footer */
.ads-act{margin-top:16px}
.ads-actrow{display:flex;gap:8px}
.ads-actrow .btn{flex:1;text-align:center}
.ads-gate{font-size:12px;line-height:1.45;color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px;margin-bottom:10px}
.ads-gate-done{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}

/* operationshiring */
/* ============================================================
   OPERATIONS & HIRING — scoped extras (palette vars only).
   Every selector ".operationshiring-" prefixed. Reuses the
   shared .card/.card-h/.card-b/.stat/.statstrip/.pill/.count
   system; adds only the cockpit-specific pieces.
   FILL-DON'T-STRETCH: the cockpit is a 3-column grid that
   GROWS to 4 columns on ultrawide rather than stretching.
   ============================================================ */

/* NOW stat strip: append a sub-line under each shared .stat */
.operationshiring-strip .stat{display:flex;flex-direction:column}
.operationshiring-stat-sub{font-size:11px;color:var(--ink-faint);margin-top:8px;line-height:1.35}

/* ---- unacknowledged alerts banner (rose-50 top bar) ---- */
.operationshiring-banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:var(--radius);
  padding:13px 16px;margin-bottom:18px}
.operationshiring-banner-lead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.operationshiring-banner-ico{font-size:16px}
.operationshiring-banner-lead b{font-size:14px;color:var(--mulberry)}
.operationshiring-banner-sub{font-size:11.5px;color:var(--ink-soft)}
.operationshiring-banner-chips{display:flex;flex-wrap:wrap;gap:7px;margin-left:auto}
.operationshiring-alertchip{font-size:11.5px;font-weight:600;border-radius:99px;padding:4px 11px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);max-width:340px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.operationshiring-alertchip.a-red{color:var(--mulberry);background:var(--card);border-color:var(--mulberry-line)}
.operationshiring-alertchip.a-warn{color:#8a6d2f;background:var(--card);border-color:var(--gold-line)}
.operationshiring-alertchip.a-info{color:var(--sage);background:var(--card);border-color:var(--sage-line)}

/* ---- cockpit grid ---- */
.operationshiring-grid{display:grid;gap:18px;align-items:start;
  grid-template-columns:minmax(0,1.6fr) 340px 320px;
  grid-template-areas:"main road rail"}
.operationshiring-main{grid-area:main;min-width:0}
.operationshiring-road{grid-area:road}
.operationshiring-rail{grid-area:rail}
/* ultrawide: split the main column's two cards into their own columns
   (signals | forecasts | roadmap | rail) — ADD a column, don't stretch */
@media(min-width:1700px){
  .operationshiring-grid{
    grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 340px 320px;
    grid-template-areas:"main fc road rail"}
  .operationshiring-main{display:contents}
  .operationshiring-main > .card:first-child{grid-area:main}
  .operationshiring-main > .card:last-child{grid-area:fc}
}
/* narrower desktop: drop the alert rail under the others */
@media(max-width:1320px){
  .operationshiring-grid{grid-template-columns:minmax(0,1.5fr) 320px;
    grid-template-areas:"main road" "rail rail"}
}

/* ---- bottleneck signal cards (traffic-light KPI tiles) ---- */
.operationshiring-siggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:13px}
.operationshiring-sig{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--card);
  position:relative;overflow:hidden}
.operationshiring-sig::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.operationshiring-sig.is-green::before{background:var(--sage)}
.operationshiring-sig.is-yellow::before{background:var(--gold)}
.operationshiring-sig.is-red::before{background:var(--mulberry)}
.operationshiring-sig.is-green{background:linear-gradient(180deg,var(--sage-soft),var(--card))}
.operationshiring-sig.is-yellow{background:linear-gradient(180deg,var(--gold-soft),var(--card))}
.operationshiring-sig.is-red{background:linear-gradient(180deg,var(--mulberry-soft),var(--card))}

.operationshiring-sig-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.operationshiring-sig-ico{font-size:16px}
.operationshiring-sig-light{width:10px;height:10px;border-radius:50%;background:var(--ink-faint);margin-left:auto;
  box-shadow:0 0 0 3px var(--bg)}
.operationshiring-sig.is-green .operationshiring-sig-light{background:var(--sage);box-shadow:0 0 0 3px var(--sage-soft)}
.operationshiring-sig.is-yellow .operationshiring-sig-light{background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.operationshiring-sig.is-red .operationshiring-sig-light{background:var(--mulberry);box-shadow:0 0 0 3px var(--mulberry-soft)}
.operationshiring-sig-state{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.operationshiring-sig.is-green .operationshiring-sig-state{color:var(--sage)}
.operationshiring-sig.is-yellow .operationshiring-sig-state{color:#8a6d2f}
.operationshiring-sig.is-red .operationshiring-sig-state{color:var(--mulberry)}

.operationshiring-sig-label{font-size:12px;color:var(--ink-soft);font-weight:600}
.operationshiring-sig-val{font-family:Georgia,serif;font-size:26px;font-weight:700;line-height:1.1;margin-top:3px}
.operationshiring-sig-val small{font-size:13px;font-family:system-ui;color:var(--ink-faint);font-weight:600}
.operationshiring-sig-detail{font-size:11.5px;color:var(--ink-soft);line-height:1.45;margin-top:7px;min-height:33px}
.operationshiring-sig-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.operationshiring-sig-thresh{font-size:10px;color:var(--ink-faint);line-height:1.35}
.operationshiring-sig-src{flex:0 0 auto;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-faint);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 7px}

/* ---- milestone forecast tiles ---- */
.operationshiring-fcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.operationshiring-fc{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--card)}
.operationshiring-fc.hit{border-color:var(--sage-line);background:linear-gradient(180deg,var(--sage-soft),var(--card))}
.operationshiring-fc-top{display:flex;align-items:baseline;gap:8px}
.operationshiring-fc-target{font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--mulberry);line-height:1}
.operationshiring-fc-label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em}
.operationshiring-fc-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:11px 0 9px}
.operationshiring-fc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#d8b878)}
.operationshiring-fc-date{font-size:14px;font-weight:700}
.operationshiring-fc-date small{font-size:11.5px;font-weight:400;color:var(--ink-soft)}
.operationshiring-fc-note{font-size:11px;color:var(--ink-soft);line-height:1.45;margin-top:6px}

/* ---- hiring roadmap rows ---- */
.operationshiring-roadrow{padding:13px 0;border-bottom:1px solid var(--line)}
.operationshiring-roadrow:first-child{padding-top:0}
.operationshiring-roadrow:last-child{border-bottom:none;padding-bottom:0}
.operationshiring-roadrow.soon{margin:0 -18px;padding-left:18px;padding-right:18px;
  background:linear-gradient(90deg,var(--mulberry-soft),transparent)}
.operationshiring-road-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.operationshiring-road-id{min-width:0}
.operationshiring-road-id b{font-size:14px;font-weight:700;display:block}
.operationshiring-road-id small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.operationshiring-road-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.operationshiring-road-by{font-size:12.5px;color:var(--ink-soft)}
.operationshiring-road-by b{color:var(--ink);font-weight:700}
.operationshiring-road-cd{font-size:12px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.operationshiring-road-cd.soon{color:var(--rose);background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.operationshiring-steps{display:flex;gap:5px;margin-top:10px}
.operationshiring-step{flex:1;height:4px;border-radius:99px;background:var(--line)}
.operationshiring-step.on{background:var(--gold)}
.operationshiring-roadrow.soon .operationshiring-step.on{background:var(--mulberry)}
.operationshiring-road-foot{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:11px;color:var(--ink-faint);line-height:1.5}

/* ---- alert rail rows ---- */
.operationshiring-alertrow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.operationshiring-alertrow:first-child{padding-top:0}

<script>
/* ===== SETNAYAN Admin Console — desktop shell (generic chrome + admin nav) ===== */
let activeSurface='overview';
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const peso=n=>'₱'+n.toLocaleString('en-PH');

const NAV=[
  {key:'home',label:'Home',items:[

];

function renderNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  NAV.forEach(group=>{
    const wrap=el('div','navgroup');
    const lbl=el('button','grouplabel'+(group.collapsed?' collapsed':''));
    lbl.innerHTML='<span class="gl-chev">▶</span><span>'+group.label+'</span><span class="gl-sp"></span>';
    const box=el('div');box.style.display=group.collapsed?'none':'block';
    lbl.onclick=()=>{const c=lbl.classList.toggle('collapsed');box.style.display=c?'none':'block';};
    wrap.appendChild(lbl);
    group.items.forEach(it=>{
      const a=el('div','navitem'+(((it.surface||slug(it.label))===activeSurface)?' active':''));
      a.innerHTML='<span class="ni-ico">'+it.ico+'</span><span class="ni-label">'+it.label+'</span>'+
        (it.badge?'<span class="ni-badge'+(it.alert?' alert':'')+'">'+it.badge+'</span>':'');
      a.onclick=()=>go(it);
      box.appendChild(a);
    });
    wrap.appendChild(box);nav.appendChild(wrap);
  });
}
function go(it){
  activeSurface=it.surface||slug(it.label);
  document.getElementById('crumbSurface').textContent=it.label;
  renderNav();renderContent(it);
}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'');}
const PANELS={overview:overviewPanel,payments:paymentsPanel,verify:verifyPanel,disputes:disputesPanel,forcemajeure:forcemajeurePanel,reviews:reviewsPanel,help:helpPanel,conciergeabuse:conciergeabusePanel,users:usersPanel,vendors:vendorsPanel,demovendors:demovendorsPanel,events:eventsPanel,venues:venuesPanel,pricing:pricingPanel,discountcodes:discountcodesPanel,addons:addonsPanel,payouts:payoutsPanel,receipts:receiptsPanel,paymentmethods:paymentmethodsPanel,brain:brainPanel,moodboardlibrary:moodboardlibraryPanel,taxonomy:taxonomyPanel,songs:songsPanel,website:websitePanel,ads:adsPanel,operationshiring:operationshiringPanel,settings:settingsPanel};
function renderContent(it){const c=document.getElementById('content');c.scrollTop=0;const key=it.surface||slug(it.label);const fn=PANELS[key];c.replaceChildren(fn?fn():stubPanel(it.label,it.ico));}

];

/* ---- 8-tile platform stat grid ---- */

/* status pill class + label mapping (reuses shared .pill.yes/.pending/.no) */
const PAYMENTS_STATUS={
  pending_payment:{pill:'pending', label:'Pending payment'},
  proof_submitted:{pill:'pending', label:'Proof submitted'},
  paid:{pill:'yes', label:'Paid'},
  failed:{pill:'no', label:'Rejected'},
  refunded:{pill:'no', label:'Refunded'},
};
const PAYMENTS_METHOD={bdo:{l:'BDO',i:'🏦'}, gcash:{l:'GCash',i:'📱'}};
/* matcher confidence → visual treatment */
const PAYMENTS_CONF={
  exact:{l:'Exact match', tone:'sage', ico:'🎯'},
  high:{l:'High confidence', tone:'gold', ico:'≈'},
  medium:{l:'Medium — review', tone:'gold', ico:'~'},
  none:{l:'No match', tone:'rose', ico:'∅'},
};

/* ---- view state (all ".payments_"-prefixed) ---- */
let payments_sel=0;                  // selected row index (defaults to oldest pending — Aira)
let payments_filter='pending';       // 'pending' | 'all' | 'needsquote'
let payments_method='all';           // 'all' | 'bdo' | 'gcash'
let payments_showComp=false;         // self-comp orders toggle (default off, per spec)
let payments_q='';                   // search query

function payments_initials(n){return n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function payments_hue(s){return s.split('').reduce((h,c)=>(h*31+c.charCodeAt(0))%360,7);}
function payments_slaTone(h){return h>=20?'red':h>=12?'amber':'green';}
function payments_isPendingState(r){return r.status==='pending_payment'||r.status==='proof_submitted';}

function payments_visible(){
  return payments_rows.filter(r=>{
    if(r.flag==='comp' && !payments_showComp) return false;
    if(payments_filter==='pending' && !payments_isPendingState(r)) return false;
    if(payments_filter==='needsquote' && r.match.conf!=='none') return false;   // unmatched / needs-quote queue
    if(payments_method!=='all' && r.method!==payments_method) return false;
    if(payments_q){
      const hay=(r.cust+' '+r.vendor+' '+r.sku+' SET-'+r.ref).toLowerCase();
      if(!hay.includes(payments_q)) return false;
    }
    return true;
  });
}

    ['pending','Pending'],['all','All'],['needsquote','Needs quote'],
  ],'filter'));

  r.appendChild(el('h4',null,'Method'));
  r.appendChild(payments_chipRow([
    ['all','All'],['bdo','BDO'],['gcash','GCash'],
  ],'method'));

  // self-comp toggle (default off per spec § 3.3)
  r.appendChild(el('h4',null,'Dual-role'));
  const compRow=el('div','fchips');
  const compChip=el('button','fchip'+(payments_showComp?' on':''),'🟢 Self-comp orders');
  compChip.onclick=()=>{payments_showComp=!payments_showComp;payments_rerender();};
  compRow.appendChild(compChip);
  r.appendChild(compRow);

  // SLA at-a-glance
  r.appendChild(el('h4',null,'At a glance'));
  const pend=payments_rows.filter(payments_isPendingState);
  const green=pend.filter(r=>r.slaH<12 && r.status==='proof_submitted').length;
  const amber=pend.filter(r=>r.slaH>=12 && r.slaH<20).length;
  const red=pend.filter(r=>r.slaH>=20 && r.status==='proof_submitted').length;
  const awaiting=pend.filter(r=>r.status==='pending_payment').length;
  [['Proof submitted',pend.filter(r=>r.status==='proof_submitted').length],
   ['Awaiting proof',awaiting],
   ['Within SLA (<12h)',green],
   ['Nearing SLA (12–20h)',amber],
   ['Over SLA (>20h)',red],
   ['Showing',payments_visible().length]]
   .forEach(([k,v])=>r.appendChild(el('div','fstat','<span>'+k+'</span><b id="'+(k==='Showing'?'payments-showing':'')+'">'+v+'</b>')));

  // single-admin note
  const note=el('div','payments-railnote',
    '<span>🔑</span><div>Approve &amp; reject are <b>single-admin</b> authority. Receiving-account changes are the only two-admin gate.</div>');
  r.appendChild(note);
  return r;
}
function payments_chipRow(opts,key){
  const row=el('div','fchips');
  const cur=key==='filter'?payments_filter:payments_method;
  opts.forEach(([val,lbl])=>{
    const c=el('button','fchip'+(cur===val?' on':''),lbl);
    c.onclick=()=>{
      if(key==='filter')payments_filter=val; else payments_method=val;
      // keep selection valid against the new filter
      const vis=payments_visible();
      if(vis.length && !vis.includes(payments_rows[payments_sel])) payments_sel=payments_rows.indexOf(vis[0]);
      payments_rerender();
    };
    row.appendChild(c);
  });
  return row;
}
function payments_syncShowing(){const b=document.getElementById('payments-showing');if(b)b.textContent=payments_visible().length;}

/* ---------------- CENTER — wide payment table ---------------- */
function payments_table(){
  const box=el('div','gtable');
  const tbl=el('table');

    '<th>Customer</th><th>Vendor / SKU</th><th style="text-align:right">Amount</th><th>Status</th><th>Reference</th><th>SLA</th>'));

function payments_fillBody(tb){
  tb.innerHTML='';
  const vis=payments_visible();
  vis.forEach(r=>{
    const idx=payments_rows.indexOf(r);
    const tr=el('tr',payments_sel===idx?'sel':'');
    tr.onclick=()=>{payments_sel=idx;payments_rerender();};
    const h=payments_hue(r.cust);
    const st=PAYMENTS_STATUS[r.status];
    const m=PAYMENTS_METHOD[r.method];

    // SLA cell — only meaningful while proof_submitted
    let sla='<span class="payments-slaq">—</span>';
    if(r.status==='proof_submitted'){
      const tone=payments_slaTone(r.slaH);
      sla='<span class="payments-sla '+tone+'"><span class="payments-sladot"></span>'+r.slaH.toFixed(1)+'h</span>';
    }else if(r.status==='pending_payment'){
      sla='<span class="payments-slaq">awaiting</span>';
    }

    const flag = r.flag==='self' ? '<span class="payments-flag self" title="Vendor self-purchase">🟡</span>'
               : r.flag==='comp' ? '<span class="payments-flag comp" title="Vendor self-comp">🟢</span>' : '';

    tr.innerHTML=
      '<td><div class="gname"><span class="gini" style="background:hsl('+h+',42%,55%)">'+payments_initials(r.cust)+'</span>'+
        '<span class="gn-meta"><b>'+r.cust+flag+'</b><small>'+r.email+'</small></span></div></td>'+
      '<td><div class="payments-vend"><b>'+r.vendor+(r.sn?' <span style="color:var(--gold)">✦</span>':'')+'</b><small>'+r.sku+'</small></div></td>'+
      '<td class="payments-amt">'+peso(r.amount)+(r.fee?'<small>incl. ₱'+r.fee.toLocaleString('en-PH')+' fee</small>':'')+'</td>'+
      '<td><span class="pill '+st.pill+'">'+st.label+'</span></td>'+
      '<td><span class="payments-ref">SET-'+r.ref+'</span><small class="payments-meth">'+m.i+' '+m.l+'</small></td>'+
      '<td>'+sla+'</td>';
    tb.appendChild(tr);
  });
  if(!vis.length){
    tb.appendChild(el('tr',null,'<td colspan="6" style="text-align:center;color:var(--ink-faint);padding:34px">No payments match this filter. Try “All” or clear the search.</td>'));
  }
}

/* ---------------- RIGHT — selected payment detail ---------------- */
function payments_detail(){
  const d=el('div','gdetail');
  const r=payments_rows[payments_sel];
  if(!r || !payments_visible().includes(r)){
    d.appendChild(el('div','gd-empty','<div class="bi">🧾</div><div>Select a payment to reconcile it — order, amount, reference, the uploaded screenshot, and the fuzzy-matcher verdict appear here, side by side with the Approve / Reject actions.</div>'));
    return d;
  }
  const st=PAYMENTS_STATUS[r.status];
  const m=PAYMENTS_METHOD[r.method];
  const settled=(r.status==='paid'||r.status==='failed'||r.status==='refunded');
  const awaiting=(r.status==='pending_payment');

  // hero — reference + status
  const hero=el('div','gd-hero payments-hero');
  hero.innerHTML=
    '<div class="payments-refbig">SET-'+r.ref+'</div>'+
    '<div class="gd-name">'+peso(r.amount)+'</div>'+
    '<div class="gd-sub">'+r.cust+' → '+r.vendor+(r.sn?' ✦':'')+'</div>'+
    '<div class="payments-herotags"><span class="pill '+st.pill+'">'+st.label+'</span>'+
      '<span class="payments-methtag">'+m.i+' '+m.l+'</span>'+
      (r.flag==='self'?'<span class="payments-methtag">🟡 Self-purchase</span>':'')+
      (r.flag==='comp'?'<span class="payments-methtag">🟢 Self-comp</span>':'')+'</div>';
  d.appendChild(hero);

  const b=el('div','gd-b');

  // order summary rows
  b.appendChild(el('div','gd-row','<span class="k">Order</span><span style="text-align:right;max-width:62%">'+r.sku+'</span>'));
  b.appendChild(el('div','gd-row','<span class="k">Order total</span><span class="payments-amt2">'+peso(r.amount)+'</span>'));
  if(r.fee) b.appendChild(el('div','gd-row','<span class="k">Setnayan Pay fee (3%)</span><span>'+peso(r.fee)+'</span>'));
  b.appendChild(el('div','gd-row','<span class="k">Reference code</span><span class="payments-mono">SET-'+r.ref+'</span>'));
  b.appendChild(el('div','gd-row','<span class="k">Method</span><span>'+m.i+' '+m.l+'</span>'));
  if(r.typedAmt!=null){
    const ok=r.typedAmt===r.amount;
    b.appendChild(el('div','gd-row','<span class="k">Customer-typed amount</span><span class="'+(ok?'payments-ok':'payments-warn')+'">'+peso(r.typedAmt)+(ok?' ✓':' ⚠')+'</span>'));
  }
  b.appendChild(el('div','gd-row','<span class="k">Prior orders</span><span class="payments-prior">'+
    '<b class="payments-ok">'+r.prior.paid+'</b> paid · <b>'+r.prior.pend+'</b> pending · <b class="payments-warn">'+r.prior.rej+'</b> rejected</span>'));

  // screenshot placeholder
  b.appendChild(el('div','payments-sectlbl',awaiting?'Payment screenshot':'Customer submission'));
  const shot=el('div','payments-shot'+(awaiting?' empty':''));
  if(awaiting){
    shot.innerHTML='<div class="payments-shoticon">🕓</div><div class="payments-shottxt">No proof uploaded yet</div>'+
      '<div class="payments-shotsub">Order is in <b>pending_payment</b> — nothing to verify until the customer submits a screenshot.</div>';
  }else{
    shot.innerHTML='<div class="payments-shotbadge">'+m.i+' '+m.l+' · R2 signed URL · 1-hr TTL</div>'+
      '<div class="payments-shoticon">🧾</div>'+
      '<div class="payments-shottxt">'+m.l+' transfer · '+peso(r.amount)+'</div>'+
      '<div class="payments-shotsub">Ref in note: <b>SET-'+r.ref+'</b>'+(r.match.sender?(' · Sender: <b>'+r.match.sender+'</b>'):'')+'</div>'+
      '<button class="payments-shotzoom">⤢ View full size</button>';
  }
  b.appendChild(shot);

  // 4-tier fuzzy matcher suggestion
  const cf=PAYMENTS_CONF[r.match.conf];
  b.appendChild(el('div','payments-sectlbl','4-tier fuzzy matcher'));
  const matchBox=el('div','payments-match '+cf.tone);
  const tier = r.match.method==='reference_code' ? 'Tier 1 · exact reference code'
             : r.match.method==='amount_plus_sender' ? (r.match.conf==='high'?'Tier 2 · amount + sender name':'Tier 3 · amount-only')
             : r.match.method==='amount_only' ? 'Tier 3 · amount-only'
             : r.match.method==='self_comp' ? 'No payment — self-comp'
             : 'Tier 4 · unmatched inbox';
  matchBox.innerHTML=
    '<div class="payments-matchhead"><span class="payments-matchico">'+cf.ico+'</span>'+
      '<div class="payments-matchhd"><b>'+cf.l+'</b><small>'+tier+'</small></div></div>'+
    '<div class="payments-matchnote">'+r.match.note+'</div>'+
    (r.match.sender?('<div class="payments-matchrow"><span>Bank-reported sender</span><b>'+r.match.sender+'</b></div>'):'')+
    '<div class="payments-matchrow"><span>Amount lines up</span><b class="'+(r.match.conf==='none'?'payments-warn':'payments-ok')+'">'+(r.match.conf==='none'?'unconfirmed':'within ₱1')+'</b></div>';
  b.appendChild(matchBox);

  // reconciliation tools (right column of spec § 4.2)
  b.appendChild(el('div','payments-sectlbl','Reconciliation tools'));
  const tools=el('div','payments-tools');
  [['🏦','Open BDO online banking'],['📱','Open GCash merchant dashboard'],['🔎','Search inbox for SET-'+r.ref]]
    .forEach(([i,t])=>{const a=el('button','payments-tool','<span>'+i+'</span>'+t);tools.appendChild(a);});
  b.appendChild(tools);

  // ----- action bar -----
  const acts=el('div','payments-actions');
  if(settled){
    acts.appendChild(el('div','payments-settled',
      '<span>'+(r.status==='paid'?'✅':r.status==='refunded'?'↩':'⛔')+'</span> '+
      (r.status==='paid'?'Approved — Official Receipt issued · service activated.'
       :r.status==='refunded'?'Refunded via external transfer · logged for audit.'
       :'Rejected permanently · customer must start a new order.')));
  }else if(awaiting){
    acts.appendChild(el('div','payments-settled muted','<span>🕓</span> Waiting on the customer’s payment proof — no action available yet.'));
  }else{
    const approve=el('button','btn primary','✓ Approve &amp; activate');
    approve.onclick=()=>{r.status='paid';payments_rerender();};
    const more=el('button','btn','↺ Needs more proof');
    more.onclick=()=>{r.status='pending_payment';payments_rerender();};
    const reject=el('button','btn payments-danger','✕ Reject permanently');
    reject.onclick=()=>{r.status='failed';payments_rerender();};
    acts.append(approve,more,reject);
  }
  b.appendChild(acts);

  d.appendChild(b);
  return d;
}

/* ---- helpers ---- */
function verify_kindMeta(k){
  if(k==='identity') return { label:'Identity', icon:'🛡', q:'identity' };
  if(k==='service')  return { label:'Service',  icon:'✦',  q:'service' };
  return                     { label:'Category', icon:'🏷', q:'category' };
}
/* application-type tag → pill class + label (initial FREE · renewal ₱1,499 · post-demotion ₱2,499) */
function verify_typeMeta(t){
  if(t==='initial')  return { pill:'yes',     label:'Initial · Free' };
  if(t==='renewal')  return { pill:'pending', label:'Renewal · ₱1,499' };
  if(t==='demotion') return { pill:'no',      label:'Post-demotion · ₱2,499' };
  if(t==='service')  return { pill:'pending', label:'Service approval' };
  return                    { pill:'pending', label:'Custom category' };
}
/* doc state → check chip */
function verify_docMeta(s){
  if(s==='in')      return { cls:'in',      mark:'✓', label:'In' };
  if(s==='review')  return { cls:'review',  mark:'!', label:'Review' };
  if(s==='pending') return { cls:'pending', mark:'·', label:'Pending' };
  return                   { cls:'na',      mark:'–', label:'N/A' };
}

function verify_list(){
  if(verify_queue==='all') return VERIFY_APPS;
  return VERIFY_APPS.filter(a=>a.kind===verify_queue);
}
function verify_current(){
  const ls=verify_list();
  return ls.find(a=>a.id===verify_sel) || ls[0] || null;
}

function verify_rerender(){
  document.getElementById('content').replaceChildren(verifyPanel());
}
function verify_setTab(t){ verify_tab=t; verify_rerender(); }
function verify_setQueue(q){
  verify_queue=q;
  const ls=verify_list();
  if(!ls.some(a=>a.id===verify_sel)) verify_sel = ls.length?ls[0].id:null;
  verify_rerender();
}
function verify_select(id){ verify_sel=id; verify_rerender(); }

/* ============================================================ PANEL ============================================================ */
function verifyPanel(){
  const p=el('section','panel show');

  const idCount  = VERIFY_APPS.filter(a=>a.kind==='identity').length;
  const svcCount = VERIFY_APPS.filter(a=>a.kind==='service').length;
  const catCount = VERIFY_APPS.filter(a=>a.kind==='category').length;
  const overdue  = VERIFY_APPS.filter(a=>/overdue/.test(a.sla||'')).length;

  /* header — surfhead pattern. The escalate / two-admin context lives in the detail action bar. */
  p.appendChild(el('div','surfhead',
    '<div><h1>Verification</h1><p>'+VERIFY_APPS.length+' in queue · '+idCount+' identity · '+svcCount+' service · '+catCount+' custom category'+
      (overdue? ' · <b style="color:var(--rose)">'+overdue+' past SLA</b>':'')+'</p></div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn">R2 audit trail</button>'+
      '<button class="btn">Export queue</button>'+
    '</div>'));

  /* top tabs — Applications / Visibility (schedule-seg shape) */
  const tabs=el('div','verify-tabs');
  [['applications','Applications', VERIFY_APPS.length],['visibility','Visibility', VERIFY_VIS.length]].forEach(([k,l,n])=>{
    const b=el('button',verify_tab===k?'on':'', l+' <span class="count">'+n+'</span>');
    b.onclick=()=>verify_setTab(k);
    tabs.appendChild(b);
  });
  p.appendChild(tabs);

  if(verify_tab==='visibility'){ p.appendChild(verify_visibilityView()); return p; }

  /* applications: 3-pane list-detail */
  const wrap=el('div','verify-wrap');
  wrap.appendChild(verify_rail(idCount,svcCount,catCount));
  wrap.appendChild(verify_listCol());
  wrap.appendChild(verify_detail());
  p.appendChild(wrap);
  return p;
}

/* ---------------- LEFT rail: queue filter + SLA snapshot ---------------- */
function verify_rail(idCount,svcCount,catCount){
  const r=el('div','frail');

  // SLA pulse card
  const overdue=VERIFY_APPS.filter(a=>/overdue/.test(a.sla||'')).length;
  const pulse=el('div','verify-pulse'+(overdue?' warn':''));
  if(overdue){
    pulse.innerHTML='<div class="vp-ico">⏰</div><div class="vp-t">'+overdue+' past SLA</div>'+
      '<div class="vp-s">3–5 business-day target · auto-paged at 96h.</div>';
  }else{
    pulse.innerHTML='<div class="vp-ico">🛡</div><div class="vp-t">Queue on track</div>'+
      '<div class="vp-s">3–5 business-day SLA · auto-page at 96h.</div>';
  }
  r.appendChild(pulse);

  r.appendChild(el('h4',null,'Queue'));
  const chips=el('div','fchips');
  [['all','All',VERIFY_APPS.length],['identity','Identity',idCount],['service','Service',svcCount],['category','Custom category',catCount]]
    .forEach(([val,lbl,n])=>{
      const c=el('button','fchip'+(verify_queue===val?' on':''),lbl+' <span class="count" style="opacity:.7">'+n+'</span>');
      c.onclick=()=>verify_setQueue(val);
      chips.appendChild(c);
    });
  r.appendChild(chips);

  r.appendChild(el('h4',null,'Application types'));
  const init=VERIFY_APPS.filter(a=>a.appType==='initial').length;
  const ren =VERIFY_APPS.filter(a=>a.appType==='renewal').length;
  const dem =VERIFY_APPS.filter(a=>a.appType==='demotion').length;
  [['Initial · Free',init],['Renewal · ₱1,499',ren],['Post-demotion · ₱2,499',dem]]
    .forEach(([k,v])=>r.appendChild(el('div','fstat','<span>'+k+'</span><b>'+v+'</b>')));

  r.appendChild(el('h4',null,'Where docs land'));
  r.appendChild(el('div','verify-note',
    'Raw uploads in <b>setnayan-vendor-verification</b> (R2) — 90-day rolling · 7-year audit retention per BIR § 235.'));

  return r;
}

      const total=VERIFY_DOCS.filter(d=>a.docs[d.id]!=='na').length;
      const inn=VERIFY_DOCS.filter(d=>a.docs[d.id]==='in').length;
      sub='<span class="vi-prog">'+inn+'/'+total+' docs in</span>';
    }else if(a.kind==='service'){
      sub='<span class="vi-prog">'+a.service+' · '+peso(a.price)+'</span>';
    }else{
      sub='<span class="vi-prog">“'+a.proposed+'”</span>';
    }

    card.innerHTML=
      '<div class="vi-top">'+
        '<span class="vlogo">'+a.ico+'</span>'+
        '<div class="vi-meta"><b>'+a.vendor+'</b><small>'+km.icon+' '+km.label+' · '+a.cat+'</small></div>'+
        '<span class="pill '+tm.pill+'">'+tm.label+'</span>'+
      '</div>'+
      '<div class="vi-body">'+sub+'</div>'+

        '<span class="vi-ref">'+a.ref+'</span>'+
        '<span class="vi-sep">·</span>'+
        '<span class="vi-sla'+(overdue?' over':'')+'">'+a.sla+'</span>'+
        '<span class="vi-sep">·</span>'+
        '<span class="vi-city">'+a.city+'</span>'+
      '</div>';
    col.appendChild(card);
  });
  return col;
}

/* ---------------- RIGHT: detail — 12-doc checklist + decision actions ---------------- */
function verify_detail(){

      const ok = (v==='pass'||v==='clear'||v==='clean');
      const warn = (v==='review');
      const cls = ok?'ok':warn?'warn':'bad';
      const txt = v==='pass'?'Pass':v==='clear'?'Clear':v==='clean'?'Clean':v==='review'?'Review':v;
      scr.appendChild(el('div','verify-scr '+cls,'<small>'+lbl+'</small><b>'+txt+'</b>'));
    });
    b.appendChild(scr);

    // the 12-document checklist
    b.appendChild(el('div','verify-checkhead','12-document checklist'));
    const list=el('div','verify-checklist');
    VERIFY_DOCS.forEach(doc=>{
      const st=a.docs[doc.id]||'pending';
      const m=verify_docMeta(st);
      const row=el('div','verify-check '+m.cls);
      row.innerHTML=
        '<span class="vc-mark">'+m.mark+'</span>'+
        '<div class="vc-body"><b>'+doc.label+'</b><small>'+doc.hint+'</small></div>'+
        '<span class="vc-state">'+m.label+'</span>';
      list.appendChild(row);
    });
    b.appendChild(list);

  } else if(a.kind==='service'){
    b.appendChild(el('div','gd-row','<span class="k">Service</span><span style="font-weight:600">'+a.service+'</span>'));
    b.appendChild(el('div','gd-row','<span class="k">Price</span><span class="vd-amt">'+peso(a.price)+'</span>'));
    b.appendChild(el('div','gd-row','<span class="k">Why it\'s here</span><span style="text-align:right;max-width:210px">'+a.scope+'</span>'));

    b.appendChild(el('div','verify-checkhead','Curation checks'));
    const list=el('div','verify-checklist');
    VERIFY_SVC_CHECKS.forEach(ch=>{
      const st=a.checks[ch.id]||'pending';
      const m=verify_docMeta(st);
      const row=el('div','verify-check '+m.cls);
      row.innerHTML='<span class="vc-mark">'+m.mark+'</span>'+
        '<div class="vc-body"><b>'+ch.label+'</b><small>'+ch.hint+'</small></div>'+
        '<span class="vc-state">'+m.label+'</span>';
      list.appendChild(row);
    });
    b.appendChild(list);

  } else {
    // custom category — the 4-outcome review
    b.appendChild(el('div','gd-row','<span class="k">Proposed node</span><span style="font-weight:600;text-align:right;max-width:210px">'+a.proposed+'</span>'));
    b.appendChild(el('div','gd-row','<span class="k">Grain</span><span style="text-align:right;max-width:210px">'+a.grain+'</span>'));
    b.appendChild(el('div','gd-row','<span class="k">Status</span><span style="text-align:right;max-width:210px">'+a.publish+'</span>'));
    b.appendChild(el('div','gd-row','<span class="k">Merge demand</span><span class="vd-amt">'+a.mergeCount+' prior'+(a.mergeCount===1?'':'')+'</span>'));

    b.appendChild(el('div','verify-checkhead','Four outcomes'));
    const outs=el('div','verify-outcomes');
    [['↪','Map to existing','Re-point onto a canonical · scope=merged'],
     ['⤴','Promote to global','New node · first-vendor credit'],
     ['🔒','Keep private','Valid but niche · vendor-only'],
     ['✕','Reject','Mis-scoped · with reason']]
      .forEach(([ic,t,s])=>outs.appendChild(el('button','verify-outcome','<span class="vo-ic">'+ic+'</span><div class="vo-b"><b>'+t+'</b><small>'+s+'</small></div>')));
    b.appendChild(outs);
  }

  // reviewer note
  if(a.note){
    b.appendChild(el('div','verify-revnote','<span class="vrn-ic">📝</span><div><b>Reviewer note</b><small>'+a.note+'</small></div>'));
  }

  // decision action bar — Approve · Reject · Escalate to two-admin
  const bar=el('div','verify-actions');
  const approve=el('button','btn primary',(a.kind==='category'?'Apply outcome':'Approve'));
  approve.style.flex='1';
  bar.appendChild(approve);
  bar.appendChild(el('button','btn','Reject'));
  bar.appendChild(el('button','btn','Request info'));
  b.appendChild(bar);

  // escalate (two-admin) — quiet secondary row, per §3.2/§4 escalation
  const esc=el('button','verify-escalate','⚖ Escalate to two-admin approval');
  b.appendChild(esc);

  d.appendChild(b);
  return d;
}

/* ============================================================ VISIBILITY tab — vendor tier + perk overview (§ 3.5g) ============================================================ */
function verify_stateMeta(s){
  if(s==='verified')    return { pill:'yes',     dot:'verified',    label:'Verified' };
  if(s==='coming_soon') return { pill:'pending', dot:'coming',      label:'Coming soon' };
  return                       { pill:'no',      dot:'demoted',     label:'Demoted' };
}

function verify_visibilityView(){
  const box=el('section','verify-vis');

  // stat strip
  const verified=VERIFY_VIS.filter(v=>v.state==='verified').length;
  const coming  =VERIFY_VIS.filter(v=>v.state==='coming_soon').length;
  const demoted =VERIFY_VIS.filter(v=>v.state==='demoted').length;
  const payOn   =VERIFY_VIS.filter(v=>v.perks.pay).length;

  const strip=el('div','statstrip verify-visstrip');
  [['<b style="color:var(--sage)">'+verified+'</b>','Verified'],
   ['<b style="color:#8a6d2f">'+coming+'</b>','Coming soon'],
   ['<b style="color:var(--rose)">'+demoted+'</b>','Demoted'],
   [payOn+'<small>/'+VERIFY_VIS.length+'</small>','Setnayan Pay live']]
   .forEach(([v,k])=>strip.appendChild(el('div','stat','<div class="v">'+v+'</div><div class="k">'+k+'</div>')));
  box.appendChild(strip);

  // table: vendor · state · perks · two-admin-gated actions
  const card=el('div','gtable verify-vistable');
  const tbl=el('table');
  const thead=el('thead');
  thead.innerHTML='<tr>'+
    '<th>Vendor</th><th>State</th><th>Last verified</th><th>Renewal</th><th>Disputes 30d</th>'+
    '<th>Setnayan Pay</th><th>Pro Weekly</th><th>Boosted</th><th>Tier</th></tr>';
  tbl.appendChild(thead);
  const tb=el('tbody');

  VERIFY_VIS.forEach(v=>{
    const m=verify_stateMeta(v.state);
    const tr=el('tr');
    const perkCell=on=>'<span class="verify-perk'+(on?' on':'')+'">'+(on?'On':'Off')+'</span>';
    // tier action: demotion is single-admin; promotion outside the queue is two-admin gated
    const tierBtn = v.state==='verified'
      ? '<button class="verify-tierbtn demote">Demote</button>'
      : '<button class="verify-tierbtn promote">Force verify <span class="verify-2a">2-admin</span></button>';
    tr.innerHTML=
      '<td><div class="gname"><span class="vlogo" style="width:30px;height:30px;font-size:14px">'+v.ico+'</span>'+
        '<span class="gn-meta"><b>'+v.vendor+'</b><small>'+v.cat+'</small></span></div></td>'+
      '<td><span class="pill '+m.pill+'"><i class="verify-sdot '+m.dot+'"></i>'+m.label+'</span></td>'+
      '<td class="tabletag">'+v.lastVerified+'</td>'+
      '<td class="tabletag">'+v.renewal+'</td>'+
      '<td class="tabletag"'+(v.disputes>=3?' style="color:var(--rose);font-weight:700"':'')+'>'+v.disputes+'</td>'+
      '<td>'+perkCell(v.perks.pay)+'</td>'+
      '<td>'+perkCell(v.perks.pro)+'</td>'+
      '<td>'+perkCell(v.perks.boost)+'</td>'+
      '<td>'+tierBtn+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  card.appendChild(tbl);
  box.appendChild(card);

  box.appendChild(el('div','verify-visfoot',
    'Demotion (verified → coming soon) is single-admin. Forcing a vendor verified <b>outside</b> the queue is two-admin gated per § 9.1 — a bypass-approval safeguard. Individual perks can be revoked without a full demotion (borderline dispute patterns).'));

  return box;
}

function disputes_select(id){ disputes_sel = id; disputes_rerender(); }
function disputes_setFilter(v){
  disputes_filter = v;

  if (!rows.some(d => d.id === disputes_sel)) disputes_sel = rows.length ? rows[0].id : null;

  const ev = el('div', 'disputes-block');
  ev.appendChild(el('div', 'disputes-blockh', 'Evidence · ' + c.evidence.length + ' items'));
  const grid = el('div', 'disputes-evgrid');
  c.evidence.forEach(e => grid.appendChild(el('button', 'disputes-ev',
    '<span class="de-ic">' + e.ic + '</span><div class="de-meta"><b>' + e.t + '</b><small>' + e.s + '</small></div>')));
  ev.appendChild(grid);
  b.appendChild(ev);

  // vendor response
  b.appendChild(disputes_section('Vendor response', '🏢 ' + c.vendor,
    '<p class="disputes-narr disputes-narr-v">' + c.vendorResp + '</p>'));

  // recommended refund
  const rec = el('div', 'disputes-rec');
  rec.innerHTML =
    '<div class="dr-head"><span class="dr-eyebrow">Recommended refund</span>' +
      '<span class="dr-amt">' + peso(c.recPhp) + '</span></div>' +
    '<p class="dr-body">' + c.rec + '</p>';
  b.appendChild(rec);

  // two-admin gate (only when high-value + not resolved)
  if (highValue && !resolved) {
    const armed = !!disputes_twoAdmin[c.id];
    const gate = el('div', 'disputes-twoadmin' + (armed ? ' armed' : ''));
    gate.innerHTML =
      '<div class="dt-row"><span class="dt-ico">⚖︎</span>' +
        '<div class="dt-txt"><b>Two-admin approval required</b><small>Refunds over ' + peso(20000) +
          ' need a second admin to co-sign before they process.</small></div></div>';
    const btn = el('button', 'btn' + (armed ? ' primary' : ''), armed ? '✓ Co-signed by Cara Aquino — ready to process' : '+ Request second-admin co-sign');
    btn.style.cssText = 'width:100%;margin-top:11px';
    btn.onclick = () => { disputes_twoAdmin[c.id] = !armed; disputes_rerender(); };
    gate.appendChild(btn);
    b.appendChild(gate);
  }

  // resolution actions
  if (resolved) {
    b.appendChild(el('div', 'disputes-closed', '<span>✓</span><div><b>Case closed</b><small>' + c.sla + ' · logged to dispute_resolutions + admin_audit_log.</small></div>'));
  } else {
    const blocked = highValue && !disputes_twoAdmin[c.id];
    const acts = el('div', 'disputes-actions');
    acts.appendChild(el('div', 'disputes-actionh', 'Resolve' + (blocked ? ' · blocked until second admin co-signs' : '')));
    const primary = el('button', 'btn primary' + (blocked ? ' disputes-disabled' : ''), 'Refund couple · ' + peso(c.recPhp));
    primary.style.cssText = 'width:100%';
    const grid2 = el('div', 'disputes-actgrid');
    [['🔁', 'Find replacement vendor'], ['🏢', 'Vendor wins dispute'], ['⚖︎', 'Mutual resolution']]
      .forEach(([ic, lbl]) => grid2.appendChild(el('button', 'btn', '<span style="margin-right:6px">' + ic + '</span>' + lbl)));
    acts.appendChild(primary);
    acts.appendChild(grid2);
    acts.appendChild(el('div', 'disputes-lognote', 'All decisions log to <b>dispute_resolutions</b> + <b>admin_audit_log</b> with admin attribution.'));
    b.appendChild(acts);
  }

  d.appendChild(b);
  return d;
}

function disputes_section(label, who, inner){
  const s = el('div', 'disputes-block');
  s.appendChild(el('div', 'disputes-blockh', label + '<span class="db-who">' + who + '</span>'));
  s.insertAdjacentHTML('beforeend', inner);
  return s;
}

/* outcome labels + descriptions for the 4 FM resolution options (0023 § 3.6b) */
const FORCEMAJEURE_OUTCOMES = {
  reschedule:  {ico:'📅', label:'Reschedule', desc:'Move all bookings to a new agreed date; paid amounts held as credit.'},
  replacement: {ico:'🔁', label:'Find replacement', desc:'Setnayan sources a same-city replacement vendor; original is released.'},

  refund:      {ico:'💸', label:'Full refund', desc:'Release all paid amounts back to the couple; booking cancelled.'},
};

const FORCEMAJEURE_STATUS = {
  escalated:{lbl:'Escalated', cls:'no'},
  review:   {lbl:'In review', cls:'pending'},
  resolved: {lbl:'Resolved', cls:'yes'},
};

/* two-admin threshold per § 9.1 */
const FORCEMAJEURE_TWO_ADMIN_PHP = 25000;

/* ---- state ---- */
let forcemajeure_sel = 0;
let forcemajeure_q = '';
let forcemajeure_statusFilter = 'all';
let forcemajeure_decision = null; // chosen outcome key in the decision dock

function forcemajeure_rerender(){
  forcemajeure_decision = null;
  document.getElementById('content').replaceChildren(forcemajeurePanel());
}

function forcemajeure_filtered(){
  return FORCEMAJEURE_FLAGS.filter(f=>{
    if(forcemajeure_statusFilter!=='all' && f.status!==forcemajeure_statusFilter) return false;
    if(forcemajeure_q){
      const hay=(f.event+' '+f.trigger+' '+f.region+' '+f.headline+' '+f.id).toLowerCase();
      if(!hay.includes(forcemajeure_q)) return false;
    }
    return true;
  });
}
function forcemajeure_initials(n){return n.split(/\s*[&]\s*|\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();}

function forcemajeurePanel(){
  const p = el('section','panel show');
  const open = FORCEMAJEURE_FLAGS.filter(f=>f.status!=='resolved').length;

  p.appendChild(el('div','surfhead',
    '<div><h1 class="serif">Force majeure</h1><p>'+open+' open escalations · couple ↔ vendor date / venue change flows · auto-escalates after 7 days unresolved</p></div>'+
    '<div style="display:flex;gap:8px"><button class="btn">Policy guide</button><button class="btn">Export queue</button></div>'));

  const wrap = el('div','forcemajeure-wrap');
  wrap.appendChild(forcemajeure_rail());
  wrap.appendChild(forcemajeure_detail());
  wrap.appendChild(forcemajeure_aside());
  p.appendChild(wrap);
  return p;
}

/* ---- LEFT rail: flag list + filters + glance (reuses .frail / .fsearch / .fchips / .fstat) ---- */
function forcemajeure_rail(){
  const r = el('div','frail');

  const s = el('input','fsearch'); s.placeholder='Search flags…'; s.value=forcemajeure_q;
  s.oninput=()=>{forcemajeure_q=s.value.toLowerCase();forcemajeure_rerender();};
  r.appendChild(s);

  r.appendChild(el('h4',null,'Status'));
  const chips = el('div','fchips');
  [['all','All'],['escalated','Escalated'],['review','In review'],['resolved','Resolved']].forEach(([v,l])=>{
    const c=el('button','fchip'+(forcemajeure_statusFilter===v?' on':''),l);
    c.onclick=()=>{forcemajeure_statusFilter=v;forcemajeure_sel=0;forcemajeure_rerender();};
    chips.appendChild(c);
  });
  r.appendChild(chips);

  r.appendChild(el('h4',null,'Flags'));
  const list = el('div','forcemajeure-flaglist');
  const rows = forcemajeure_filtered();
  if(!rows.length){
    list.appendChild(el('div','forcemajeure-noflag','No flags match this filter.'));
  }
  rows.forEach((f,i)=>{
    const st = FORCEMAJEURE_STATUS[f.status];
    const card = el('button','forcemajeure-flagcard'+(forcemajeure_sel===i?' sel':''));
    card.onclick=()=>{forcemajeure_sel=i;forcemajeure_decision=null;forcemajeure_rerender();};
    card.innerHTML =
      '<div class="forcemajeure-flagtop">'+
        '<span class="forcemajeure-trig" title="'+f.trigger+'">'+f.triggerIco+'</span>'+
        '<span class="forcemajeure-flagmeta"><b>'+f.event+'</b><small>'+f.trigger+' · '+f.region.split(',')[0]+'</small></span>'+
        '<span class="pill '+st.cls+'">'+st.lbl+'</span>'+
      '</div>'+
      '<div class="forcemajeure-flagfoot">'+
        '<span class="forcemajeure-flagid">'+f.id+'</span>'+
        '<span class="forcemajeure-age'+(f.ageDays>=7?' hot':'')+'">'+f.ageDays+'d open</span>'+
      '</div>';
    list.appendChild(card);
  });
  r.appendChild(list);

  r.appendChild(el('h4',null,'At a glance'));
  const esc = FORCEMAJEURE_FLAGS.filter(f=>f.status==='escalated').length;
  const rev = FORCEMAJEURE_FLAGS.filter(f=>f.status==='review').length;
  const aged = FORCEMAJEURE_FLAGS.filter(f=>f.ageDays>=7).length;
  const exposed = FORCEMAJEURE_FLAGS.reduce((s,f)=>s+f.bookings.reduce((a,b)=>a+b.paid,0),0);
  [['Open escalations',esc],['In review',rev],['Past 7-day SLA',aged],['Paid at risk',peso(exposed)]]
    .forEach(([k,v])=>r.appendChild(el('div','fstat','<span>'+k+'</span><b>'+v+'</b>')));

  return r;
}

/* ---- CENTER: selected flag detail ---- */

        '<span>'+f.id+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="forcemajeure-banright"><span class="pill '+st.cls+'">'+st.lbl+'</span>'+
      '<span class="forcemajeure-agetag'+(f.ageDays>=7?' hot':'')+'">Raised '+f.raised+' · '+f.ageDays+'d open</span></div>';
  d.appendChild(banner);

  // affected bookings table
  const totalPaid = f.bookings.reduce((a,b)=>a+b.paid,0);

  const card = el('div','card');
  card.appendChild(el('div','card-h','<h3 class="serif">Affected bookings</h3><span class="more">'+f.bookings.length+' vendor'+(f.bookings.length>1?'s':'')+' · '+peso(totalPaid)+' paid of '+peso(totalAmt)+'</span>'));
  const box = el('div','forcemajeure-tablebox');
  const tbl = el('table');
  tbl.innerHTML='<thead><tr><th>Vendor</th><th>Stage at disruption</th><th>Booking</th><th>Paid</th><th>Ref</th></tr></thead>';
  const tb = el('tbody');
  f.bookings.forEach(b=>{
    const bal = b.amt - b.paid;
    const tr = el('tr');
    tr.innerHTML =
      '<td><div class="forcemajeure-vend"><span class="forcemajeure-vlogo">'+b.ico+'</span>'+
        '<span class="gn-meta"><b>'+b.vendor+'</b><small>'+b.cat+'</small></span></div></td>'+
      '<td class="forcemajeure-stage">'+b.stage+'</td>'+
      '<td class="tabletag">'+peso(b.amt)+'</td>'+
      '<td><b class="forcemajeure-paid">'+peso(b.paid)+'</b>'+(bal>0?'<small class="forcemajeure-bal">'+peso(bal)+' unpaid</small>':'<small class="forcemajeure-full">fully paid</small>')+'</td>'+
      '<td><span class="forcemajeure-ref">'+b.ref+'</span></td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  box.appendChild(tbl);
  card.appendChild(box);
  d.appendChild(card);

  // mediation: the 4 outcomes + what each party preferred
  const med = el('div','card');
  med.appendChild(el('div','card-h','<h3 class="serif">Resolution options</h3><span class="more">What each party proposed</span>'));
  const mb = el('div','card-b');
  const grid = el('div','forcemajeure-outgrid');
  Object.keys(FORCEMAJEURE_OUTCOMES).forEach(k=>{
    const o = FORCEMAJEURE_OUTCOMES[k];
    const couple = f.outcomes.couple===k;
    const vendor = f.outcomes.vendor===k;
    const policy = f.policy===k;
    const chosen = forcemajeure_decision===k;
    const tile = el('button','forcemajeure-outcard'+(chosen?' chosen':'')+((couple||vendor)?' proposed':''));
    tile.onclick=()=>{forcemajeure_decision=(forcemajeure_decision===k?null:k);forcemajeure_rerender();};
    let tags='';
    if(couple) tags+='<span class="forcemajeure-party couple">Couple</span>';
    if(vendor) tags+='<span class="forcemajeure-party vendor">Vendor</span>';
    if(policy) tags+='<span class="forcemajeure-party policy">Policy default</span>';
    tile.innerHTML =
      '<div class="forcemajeure-outhead"><span class="forcemajeure-outico">'+o.ico+'</span><b>'+o.label+'</b>'+(chosen?'<span class="forcemajeure-check">✓</span>':'')+'</div>'+
      '<div class="forcemajeure-outdesc">'+o.desc+'</div>'+
      (tags?'<div class="forcemajeure-outtags">'+tags+'</div>':'<div class="forcemajeure-outtags forcemajeure-none">Not proposed</div>');
    grid.appendChild(tile);
  });
  mb.appendChild(grid);
  med.appendChild(mb);
  d.appendChild(med);

  // chat history (last 10)
  const chat = el('div','card');
  chat.appendChild(el('div','card-h','<h3 class="serif">Chat history</h3><span class="more">last '+f.chat.length+' messages · 0019 thread</span>'));
  const cb = el('div','card-b forcemajeure-chat');
  f.chat.forEach(m=>{
    const row = el('div','forcemajeure-msg '+m.side);
    const h = m.side==='couple' ? 'var(--mulberry)' : 'var(--sage)';
    row.innerHTML =
      '<span class="forcemajeure-msgini" style="background:'+h+'">'+forcemajeure_initials(m.who)+'</span>'+
      '<div class="forcemajeure-bubble">'+
        '<div class="forcemajeure-msgtop"><b>'+m.who+'</b><span class="forcemajeure-msgtime">'+m.t+'</span></div>'+
        '<div class="forcemajeure-msgbody">'+m.body+'</div>'+
      '</div>';
    cb.appendChild(row);
  });
  chat.appendChild(cb);
  d.appendChild(chat);

  // decision dock
  d.appendChild(forcemajeure_dock(f, totalPaid));
  return d;
}

/* ---- decision dock: approve outcome · custom · reject + two-admin gate ---- */
function forcemajeure_dock(f, totalPaid){
  const dock = el('div','card forcemajeure-dock');
  dock.appendChild(el('div','card-h','<h3 class="serif">Disputes Handler decision</h3><span class="more">logged with admin attribution</span>'));
  const db = el('div','card-b');

  const chosen = forcemajeure_decision;
  const refundsExposed = chosen==='refund' || chosen==='partial';
  const needsTwoAdmin = refundsExposed && totalPaid > FORCEMAJEURE_TWO_ADMIN_PHP;

  let line;
  if(!chosen){
    line = 'Pick one of the four resolution options above to auto-apply it, or choose a custom path below.';
  }else{
    const o = FORCEMAJEURE_OUTCOMES[chosen];
    line = 'Selected outcome: <b>'+o.ico+' '+o.label+'</b> — '+o.desc;
  }
  db.appendChild(el('div','forcemajeure-dockline',line));

  if(needsTwoAdmin){
    db.appendChild(el('div','forcemajeure-gate',
      '<span>🔐</span><div><b>Two-admin approval required.</b> '+peso(totalPaid)+' paid exceeds the '+peso(FORCEMAJEURE_TWO_ADMIN_PHP)+' refund threshold (§ 9.1) — a second admin must approve before funds move.</div>'));
  }

  const actions = el('div','forcemajeure-dockact');
  const approve = el('button','btn primary', chosen ? (needsTwoAdmin?'Request approval to apply':'Apply '+FORCEMAJEURE_OUTCOMES[chosen].label) : 'Approve selected outcome');
  if(!chosen) approve.disabled=true;
  const custom = el('button','btn','✎ Custom resolution');
  const reject = el('button','btn forcemajeure-reject','Reject FM claim');
  actions.append(approve, custom, reject);
  db.appendChild(actions);

  db.appendChild(el('div','forcemajeure-dockhint','Reject means the disruption is not deemed valid force majeure — the booking proceeds as originally agreed.'));

  dock.appendChild(db);
  return dock;
}

/* ---- RIGHT aside (fills wide screens): policy default · escalation timeline · two-admin note ---- */
function forcemajeure_aside(){
  const wrap = el('div','stack forcemajeure-aside');
  const rows = forcemajeure_filtered();
  const f = rows[forcemajeure_sel];
  if(!f) return wrap;

  // policy default
  const pol = el('div','card');
  pol.appendChild(el('div','card-h','<h3 class="serif">Suggested outcome</h3>'));
  const pb = el('div','card-b');
  const o = FORCEMAJEURE_OUTCOMES[f.policy];
  pb.appendChild(el('div','forcemajeure-polhead','<span class="forcemajeure-outico">'+o.ico+'</span><div><b>'+o.label+'</b><small>Setnayan policy default for '+f.trigger.toLowerCase()+'</small></div>'));
  pb.appendChild(el('p','forcemajeure-polnote',f.suggestion));
  pol.appendChild(pb);
  wrap.appendChild(pol);

  // escalation timeline
  const tl = el('div','card');
  tl.appendChild(el('div','card-h','<h3 class="serif">Escalation</h3>'));
  const tb = el('div','card-b');
  const steps = [
    {ico:'⚑', t:'Flag raised', s:f.raised, done:true},
    {ico:'💬', t:'Parties negotiating', s:f.chat.length+' messages in thread', done:true},
    {ico:'⏱', t:'7-day auto-escalation', s:f.ageDays>=7?'Crossed — landed in queue':'In '+(7-f.ageDays)+' day(s)', done:f.ageDays>=7},
    {ico:'✅', t:'Handler decision', s:f.status==='resolved'?'Resolved':'Pending review', done:f.status==='resolved'},
  ];
  steps.forEach((x,i)=>{
    const row = el('div','forcemajeure-tlrow'+(x.done?' done':'')+(i===steps.length-1?' last':''));
    row.innerHTML='<span class="forcemajeure-tlico">'+x.ico+'</span><div class="forcemajeure-tlbody"><b>'+x.t+'</b><small>'+x.s+'</small></div>';
    tb.appendChild(row);
  });
  tl.appendChild(tb);
  wrap.appendChild(tl);

  // evidence
  const ev = el('div','card');
  ev.appendChild(el('div','card-h','<h3 class="serif">Evidence</h3><span class="more">'+f.evidence.length+' attached</span>'));
  const eb = el('div','card-b forcemajeure-evlist');
  f.evidence.forEach(a=>{
    eb.appendChild(el('div','forcemajeure-evrow','<span class="forcemajeure-evico">'+a.ico+'</span><div class="forcemajeure-evmeta"><b>'+a.label+'</b><small>'+a.meta+'</small></div><span class="forcemajeure-evdl">↗</span>'));
  });
  ev.appendChild(eb);
  wrap.appendChild(ev);

  return wrap;
}

let reviews_queue = 'all';   // all | flag | appeal
let reviews_q = '';
let reviews_sel = 0;
const reviews_resolved = {};  // id -> { decision, label, tone }

function reviews_rerender() {
  const c = document.getElementById('content');
  if (c) c.replaceChildren(reviewsPanel());
}
function reviews_select(id) { reviews_sel = id; reviews_rerender(); }

const reviews_stars = n => '★★★★★☆☆☆☆☆'.slice(5 - n, 10 - n);
const reviews_initials = n => n.split(' ').map(w => w[0]).slice(0, 2).join('');
const reviews_hue = n => { let h = 0; for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360; return h; };

function reviews_filtered() {
  return REVIEWS_DATA.filter(r => {
    if (reviews_queue !== 'all' && r.kind !== reviews_queue) return false;
    if (reviews_q) {
      const hay = (r.vendor + ' ' + r.reviewer + ' ' + r.couple + ' ' + r.ref + ' ' + r.body).toLowerCase();
      if (!hay.includes(reviews_q)) return false;
    }
    return true;
  });
}

function reviewsPanel() {
  const p = el('section', 'panel show');

  const pending = REVIEWS_DATA.filter(r => !reviews_resolved[r.id]).length;
  const flags = REVIEWS_DATA.filter(r => r.kind === 'flag' && !reviews_resolved[r.id]).length;
  const appeals = REVIEWS_DATA.filter(r => r.kind === 'appeal' && !reviews_resolved[r.id]).length;

  p.appendChild(el('div', 'surfhead',
    '<div><h1>Reviews</h1><p>' + pending + ' awaiting a decision · ' + flags + ' flagged · ' + appeals + ' self-review appeals · single-admin authority</p></div>' +
    '<div style="display:flex;gap:8px;align-items:center"><span class="reviews-sla">⏱ 48-hr SLA</span><button class="btn">Audit log</button></div>'));

  const wrap = el('div', 'reviews-wrap');
  wrap.appendChild(reviews_rail(pending, flags, appeals));
  wrap.appendChild(reviews_table());
  wrap.appendChild(reviews_detail());
  p.appendChild(wrap);
  return p;
}

/* ---------------- left rail: search + queue chips + at-a-glance ---------------- */
function reviews_rail(pending, flags, appeals) {
  const r = el('div', 'frail');

  const s = el('input', 'fsearch');
  s.placeholder = 'Search vendor, couple, ref…'; s.value = reviews_q;
  s.oninput = () => { reviews_q = s.value.toLowerCase(); reviews_refreshTable(); };
  r.appendChild(s);

  r.appendChild(el('h4', null, 'Queue'));
  const chips = el('div', 'fchips');
  [['all', 'All open'], ['flag', 'Flagged'], ['appeal', 'Self-review appeals']].forEach(([val, lbl]) => {
    const c = el('button', 'fchip' + (reviews_queue === val ? ' on' : ''), lbl);
    c.onclick = () => { reviews_queue = val; reviews_rerender(); };
    chips.appendChild(c);
  });
  r.appendChild(chips);

  r.appendChild(el('h4', null, 'At a glance'));
  [['Awaiting decision', pending], ['Flagged reviews', flags], ['Self-review appeals', appeals],
   ['Resolved today', Object.keys(reviews_resolved).length], ['Showing', reviews_filtered().length]]
    .forEach(([k, v]) => r.appendChild(el('div', 'fstat', '<span>' + k + '</span><b>' + v + '</b>')));

  r.appendChild(el('h4', null, 'How appeals work'));
  r.appendChild(el('div', 'reviews-note',
    '~5% of reviews hit the self-review gate; ~80% are legit (couples sharing a GCash with an unrelated vendor). ' +
    'Override-publish bypasses the related-account gate only — the <b>owner / team-member</b> gate is never overridable.'));

}

/* ---------------- center: review queue table ---------------- */
function reviews_table() {
  const box = el('div', 'gtable');
  const tbl = el('table');
  const thead = el('thead');
  const tr = el('tr');
  ['Review', 'Queue', 'Vendor', 'Rating', 'Status'].forEach(h => tr.appendChild(el('th', null, h)));
  thead.appendChild(tr); tbl.appendChild(thead);
  const tb = el('tbody'); tb.id = 'reviews-body';
  tbl.appendChild(tb); box.appendChild(tbl);
  reviews_fillBody(tb);
  return box;
}
function reviews_fillBody(tb) {
  tb.innerHTML = '';
  reviews_filtered().forEach(r => {
    const tr = el('tr', reviews_sel === r.id ? 'sel' : '');
    tr.onclick = () => reviews_select(r.id);
    const h = reviews_hue(r.reviewer);
    const done = reviews_resolved[r.id];
    const qpill = r.kind === 'flag'
      ? '<span class="pill no">⚑ Flagged</span>'
      : '<span class="pill pending">⚖ Appeal</span>';
    const statusCell = done
      ? '<span class="pill ' + done.tone + '">' + done.label + '</span>'
      : '<span class="reviews-open">Awaiting</span>';
    tr.innerHTML =
      '<td><div class="gname"><span class="gini" style="background:hsl(' + h + ',42%,55%)">' + reviews_initials(r.reviewer) + '</span>' +
        '<span class="gn-meta"><b>' + r.reviewer + '</b><small>' + r.ref + ' · ' + r.couple + '</small></span></div></td>' +
      '<td>' + qpill + '</td>' +
      '<td><b style="font-weight:600">' + r.vendor + '</b><br><small style="color:var(--ink-faint)">' + r.vendorCat + '</small></td>' +
      '<td class="reviews-ratecell"><span class="reviews-stars">' + reviews_stars(r.rating.overall) + '</span> <span class="reviews-ratenum">' + r.rating.overall.toFixed(1) + '</span></td>' +
      '<td>' + statusCell + '</td>';
    tb.appendChild(tr);
  });
  if (!tb.children.length)
    tb.appendChild(el('tr', null, '<td colspan="5" style="text-align:center;color:var(--ink-faint);padding:30px">No reviews match this queue.</td>'));
}
function reviews_refreshTable() {
  const tb = document.getElementById('reviews-body');
  if (tb) reviews_fillBody(tb);
  const showing = document.querySelector('.frail .fstat:last-child b');
  if (showing) showing.textContent = reviews_filtered().length;
}

/* ---------------- right: detail pane (review body + 5-dimension breakdown + context + actions) ---------------- */
function reviews_detail() {
  const d = el('div', 'gdetail reviews-detail');
  const r = REVIEWS_DATA.find(x => x.id === reviews_sel);
  if (!r) {
    d.appendChild(el('div', 'gd-empty', '<div class="bi">⚖</div><div>Select a review to read the full body, its five-dimension breakdown, the flag or appeal context, and the moderation actions — side by side.</div>'));
    return d;
  }
  const h = reviews_hue(r.reviewer);
  const done = reviews_resolved[r.id];

  // hero
  const hero = el('div', 'gd-hero');
  const heroPill = r.kind === 'flag' ? '<span class="pill no">⚑ Flagged review</span>' : '<span class="pill pending">⚖ Self-review appeal</span>';
  hero.innerHTML =
    '<div class="gd-ini" style="background:hsl(' + h + ',42%,55%)">' + reviews_initials(r.reviewer) + '</div>' +
    '<div class="gd-name">' + r.reviewer + '</div>' +
    '<div class="gd-sub">' + r.reviewerType + ' · ' + r.couple + ' · <a class="reviews-link">view account →</a></div>' +
    '<div class="reviews-heropills">' + heroPill + ' <span class="reviews-ref">' + r.ref + '</span></div>';
  d.appendChild(hero);

  const b = el('div', 'gd-b');

  // the body is split into two stacked columns on ultrawide via .reviews-detail (CSS grid)
  const main = el('div', 'reviews-main');

  // ----- the review body -----
  main.appendChild(el('div', 'reviews-seclabel', 'The review'));
  const stars = el('div', 'reviews-bigstars');
  stars.innerHTML = '<span class="reviews-stars lg">' + reviews_stars(r.rating.overall) + '</span><span class="reviews-bignum">' + r.rating.overall.toFixed(1) + '<small>/5</small></span>';
  main.appendChild(stars);
  main.appendChild(el('blockquote', 'reviews-body', '“' + r.body + '”'));

  // ----- 5-dimension breakdown -----
  main.appendChild(el('div', 'reviews-seclabel', 'Five-dimension breakdown'));
  const dims = el('div', 'reviews-dims');
  REVIEWS_DIMS.forEach(([k, lbl]) => {
    const v = r.rating[k];
    const row = el('div', 'reviews-dimrow');
    row.innerHTML =
      '<span class="reviews-dimk">' + lbl + '</span>' +
      '<span class="reviews-dimbar"><i style="width:' + (v / 5 * 100) + '%"></i></span>' +
      '<span class="reviews-dimstars">' + reviews_stars(v) + '</span>' +
      '<span class="reviews-dimn">' + v.toFixed(1) + '</span>';
    dims.appendChild(row);
  });
  main.appendChild(dims);
  b.appendChild(main);

  // ----- context column (flag reason OR appeal/matched-signal) -----
  const ctx = el('div', 'reviews-ctx');
  ctx.appendChild(el('div', 'reviews-seclabel', 'Booking'));
  [['Vendor', r.vendor + ' · ' + r.vendorOwner], ['Service', r.service], ['Event', r.booking], ['Amount paid', peso(r.amount)]]
    .forEach(([k, v]) => ctx.appendChild(el('div', 'gd-row', '<span class="k">' + k + '</span><span style="text-align:right">' + v + '</span>')));

  if (r.kind === 'flag') {
    ctx.appendChild(el('div', 'reviews-seclabel', 'Flag context'));
    ctx.appendChild(el('div', 'gd-row', '<span class="k">Flagged by</span><span>' + r.flaggedBy + '</span>'));
    ctx.appendChild(el('div', 'gd-row', '<span class="k">Submitted</span><span>' + r.submitted + '</span>'));
    ctx.appendChild(el('div', 'reviews-callout flag', '<b>Reason</b>' + r.flagReason));
  } else {
    const sig = REVIEWS_SIGNALS[r.signal];
    ctx.appendChild(el('div', 'reviews-seclabel', 'Why it was blocked'));
    const sigRow = el('div', 'gd-row'); sigRow.innerHTML = '<span class="k">Matched signal</span>';
    sigRow.appendChild(el('span', 'pill ' + sig.tone, sig.label));
    ctx.appendChild(sigRow);
    ctx.appendChild(el('div', 'gd-row', '<span class="k">Submitted</span><span>' + r.submitted + '</span>'));
    ctx.appendChild(el('div', 'reviews-callout match', '<b>Match details</b>' + r.matchDetail));
    ctx.appendChild(el('div', 'reviews-callout appeal', '<b>Reviewer’s appeal</b>“' + r.appealReason + '”'));
    if (r.signal === 'owner_self' || r.signal === 'team_member')
      ctx.appendChild(el('div', 'reviews-lock', '🔒 Owner / team-member gate — this one is never overridable. Reject or escalate only.'));
  }
  b.appendChild(ctx);

  // ----- actions -----
  const actions = el('div', 'reviews-actions');
  if (done) {
    actions.appendChild(el('div', 'reviews-resolved', '<span class="pill ' + done.tone + '">' + done.label + '</span> Decision recorded to the audit log.'));
    const undo = el('button', 'btn', '↺ Reopen');
    undo.onclick = () => { delete reviews_resolved[r.id]; reviews_rerender(); };
    actions.appendChild(undo);
  } else if (r.kind === 'flag') {
    actions.appendChild(reviews_actBtn('✓ Unflag & publish', 'yes', () => reviews_resolve(r.id, 'Published', 'yes')));
    actions.appendChild(reviews_actBtn('Keep flagged (hidden)', 'pending', () => reviews_resolve(r.id, 'Kept hidden', 'pending')));
    actions.appendChild(reviews_actBtn('Permanently strike', 'no danger', () => reviews_resolve(r.id, 'Struck', 'no')));
  } else {
    const lockedGate = r.signal === 'owner_self' || r.signal === 'team_member';
    const ovr = reviews_actBtn('Override-publish', 'yes', () => reviews_resolve(r.id, 'Override-published', 'yes'));
    if (lockedGate) { ovr.disabled = true; ovr.title = 'Owner / team-member gate is never overridable.'; }
    actions.appendChild(ovr);
    actions.appendChild(reviews_actBtn('Reject appeal', 'no', () => reviews_resolve(r.id, 'Appeal rejected', 'no')));
    actions.appendChild(reviews_actBtn('Escalate to two-admin', 'pending', () => reviews_resolve(r.id, 'Escalated', 'pending')));
  }
  b.appendChild(actions);

  d.appendChild(b);
  return d;
}

function reviews_actBtn(label, kind, fn) {
  const btn = el('button', 'reviews-act ' + kind, label);
  btn.onclick = () => { if (!btn.disabled) fn(); };
  return btn;
}
function reviews_resolve(id, label, tone) {
  reviews_resolved[id] = { decision: label, label, tone };
  reviews_rerender();
}
