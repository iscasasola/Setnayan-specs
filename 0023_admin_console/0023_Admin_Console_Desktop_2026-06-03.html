/* ---- derived helpers (pure; no clock/RNG) ---- */
function receipts_gross(r){ return r.items.reduce((s,[,q,u])=>s+q*u,0); }
function receipts_methodLabel(k){ return (receipts_METHODS[k]||{label:k}).label; }
function receipts_methodIco(k){ return (receipts_METHODS[k]||{ico:'•'}).ico; }
function receipts_forLine(r){ const first=r.items[0][0]; return r.items.length>1 ? first+' +'+(r.items.length-1) : first; }
function receipts_pesoC(c){ return peso(c/100); }   // fixture amounts are in centavos → reuse global peso()

function receipts_filtered(){
  let rows = receipts_ROWS.filter(r=>{
    if(receipts_filter.method!=='all' && r.method!==receipts_filter.method) return false;
    if(receipts_filter.status==='issued' && r.void) return false;
    if(receipts_filter.status==='void' && !r.void) return false;
    if(receipts_filter.q){
      const hay=(r.no+' '+r.cust+' '+r.email+' '+r.ref+' '+r.items.map(i=>i[0]).join(' ')).toLowerCase();
      if(!hay.includes(receipts_filter.q)) return false;
    }
    return true;
  });
  const k=receipts_sort.k;
  rows.sort((a,b)=>{
    let x,y;
    if(k==='gross'){ x=receipts_gross(a); y=receipts_gross(b); }
    else if(k==='method'){ x=receipts_methodLabel(a.method).toLowerCase(); y=receipts_methodLabel(b.method).toLowerCase(); }
    else { x=(''+a[k]).toLowerCase(); y=(''+b[k]).toLowerCase(); }
    return (x>y?1:x<y?-1:0)*receipts_sort.dir;
  });
  return rows;
}

/* ---------------- CENTER: Official Receipts table ---------------- */
function receipts_table(){
  const box = el('div','gtable');
  const cols = [['no','OR No.'],['cust','Received from'],['for','For'],['method','Method'],['tax','Tax'],['gross','Total'],['issued','Issued']];
  const tbl = el('table');
  const thead = el('thead'); const tr = el('tr');
  cols.forEach(([k,lbl])=>{
    const sortable = (k!=='for' && k!=='tax');
    const th = el('th',null,lbl+(sortable&&receipts_sort.k===k?' <span class="ar">'+(receipts_sort.dir>0?'▲':'▼')+'</span>':''));
    if(sortable) th.onclick=()=>receipts_setSort(k); else th.style.cursor='default';
    tr.appendChild(th);
  });
  thead.appendChild(tr); tbl.appendChild(thead);
  const tb = el('tbody'); tb.id='receipts-body';
  tbl.appendChild(tb); box.appendChild(tbl);
  receipts_fillBody(tb);
  return box;
}
function receipts_fillBody(tb){
  tb.innerHTML='';
  const rows = receipts_filtered();
  rows.forEach(r=>{
    const idx = receipts_ROWS.indexOf(r);
    const tr = el('tr', receipts_sel===idx?'sel':'');
    tr.onclick=()=>receipts_select(idx);
    const corp = r.biz ? '<small>'+r.biz+' · TIN '+r.tin+'</small>' : '<small>'+r.email+'</small>';
    tr.innerHTML =
      '<td><span class="receipts-no'+(r.void?' void':'')+'">'+r.no+'</span></td>'+
      '<td><div class="gn-meta"><b>'+r.cust+'</b>'+corp+'</div></td>'+
      '<td class="receipts-for">'+receipts_forLine(r)+'</td>'+
      '<td><span class="receipts-method"><span class="receipts-mico">'+receipts_methodIco(r.method)+'</span>'+receipts_methodLabel(r.method)+'</span></td>'+
      '<td><span class="receipts-tax">NON-VAT</span></td>'+
      '<td class="receipts-amt">'+receipts_pesoC(receipts_gross(r))+'</td>'+
      '<td class="tabletag">'+r.issued.split(' · ')[0]+
        (r.void?' <span class="pill no">Voided</span>':'')+'</td>';
    tb.appendChild(tr);
  });
  if(!tb.children.length) tb.appendChild(el('tr',null,'<td colspan="7" style="text-align:center;color:var(--ink-faint);padding:30px">No receipts match these filters.</td>'));
}

/* ---------------- RIGHT: Official Receipt preview (the actual BIR document) ---------------- */
function receipts_detail(){
  const d = el('div','gdetail');
  if(receipts_sel===null || !receipts_ROWS[receipts_sel]){
    d.appendChild(el('div','gd-empty','<div class="bi">🧾</div><div>Select a receipt to preview the BIR-compliant Official Receipt — parties, line items, the non-VAT footer — and download or void it, side by side.</div>'));
    return d;
  }
  const r = receipts_ROWS[receipts_sel];
  const gross = receipts_gross(r);

  /* hero — OR number + status, mirrors gd-hero */
  const hero = el('div','gd-hero'+(r.void?' receipts-hero-void':''));
  hero.innerHTML =
    '<div class="receipts-stamp">'+(r.void?'VOID':'OR')+'</div>'+
    '<div class="gd-name">No. '+r.no+'</div>'+
    '<div class="gd-sub">'+(r.void
        ? '<span class="pill no">Voided</span> Replaced by '+r.repl
        : '<span class="pill yes">Valid</span> Issued '+r.issued+' PHT')+'</div>';
  d.appendChild(hero);

  /* the receipt document itself — faithful to the § 4.5 non-VAT template */
  const doc = el('div','receipts-doc'+(r.void?' voided':''));
  doc.innerHTML =
    '<div class="receipts-doc-head">'+
      '<div class="receipts-biz">'+receipts_CONFIG.business+'</div>'+
      '<div class="receipts-meta">'+receipts_CONFIG.address+'</div>'+
      '<div class="receipts-meta">TIN '+receipts_CONFIG.tin+' · BIR Permit '+receipts_CONFIG.permit+'</div>'+
      '<div class="receipts-nonvat">'+receipts_CONFIG.taxLabel+'</div>'+
    '</div>'+
    '<div class="receipts-doc-title">OFFICIAL RECEIPT</div>';

  // Received-from block
  const corpLines = r.biz
    ? '<div class="receipts-rf-line">'+r.biz+'</div><div class="receipts-rf-line">TIN '+r.tin+'</div>'
    : '<div class="receipts-rf-line">TIN: (not provided)</div>';
  doc.innerHTML +=
    '<div class="receipts-block"><div class="receipts-block-k">Received from</div>'+
      '<div class="receipts-rf-name">'+r.cust+'</div>'+
      '<div class="receipts-rf-line">'+r.email+'</div>'+
      corpLines+
    '</div>';

  // line items table
  let lines='';
  r.items.forEach(([desc,qty,unitC])=>{
    lines += '<tr><td>'+desc+'</td><td class="receipts-num">'+qty+'</td>'+
      '<td class="receipts-num">'+receipts_pesoC(unitC)+'</td>'+
      '<td class="receipts-num">'+receipts_pesoC(qty*unitC)+'</td></tr>';
  });
  doc.innerHTML +=
    '<table class="receipts-items"><thead><tr>'+
      '<th>Description</th><th class="receipts-num">Qty</th><th class="receipts-num">Unit</th><th class="receipts-num">Total</th>'+
    '</tr></thead><tbody>'+lines+'</tbody></table>';

  // totals
  doc.innerHTML +=
    '<div class="receipts-totals">'+
      '<div class="receipts-trow"><span>Subtotal</span><b>'+receipts_pesoC(gross)+'</b></div>'+
      '<div class="receipts-trow"><span>VAT (12%)</span><b>₱0.00 <sup>*</sup></b></div>'+
      '<div class="receipts-trow grand"><span>TOTAL</span><b>'+receipts_pesoC(gross)+'</b></div>'+
    '</div>'+
    '<div class="receipts-disclaimer">* Issued by a non-VAT registered entity. '+
      '<b>THIS DOCUMENT IS NOT VALID FOR CLAIM OF INPUT TAX.</b></div>'+
    '<div class="receipts-pay">Paid via <b>'+receipts_methodLabel(r.method)+'</b> · Ref '+r.ref+'</div>'+
    '<div class="receipts-sig"><span>[ BIR Permit Stamp ]</span><span>[ Authorized Signature ]</span></div>';

  d.appendChild(doc);

  /* void banner (if applicable) */
  if(r.void){
    const vb = el('div','receipts-voidbox');
    vb.innerHTML = '<b>Void reason</b>'+r.voidReason+
      '<div class="receipts-void-meta">Number retained for the BIR audit trail · replacement OR '+r.repl+' issued.</div>';
    d.appendChild(vb);
  }

  /* actions */
  const act = el('div','receipts-act');
  const dl = el('button','btn primary','⬇ Download PDF'); dl.style.flex='1.4';
  const view = el('button','btn','Customer copy'); view.style.flex='1';
  act.append(dl,view);
  d.appendChild(act);

  if(!r.void){
    const voidBtn = el('button','btn receipts-voidbtn','Void this receipt');
    voidBtn.title='Void requires a ≥20-char reason + audit log. Two-admin approval if the refund exceeds ₱25K (§ 4.6).';
    d.appendChild(voidBtn);
    const gate = el('div','receipts-gatehint','Void needs a reason + audit entry. Refund-and-reissue is preferred over voids — BIR auditors scrutinise void rates (§ 4.6).');
    d.appendChild(gate);
  }

  return d;
}

  f.appendChild(act);

  return f;
}

/* ---- derived helpers (no clock/RNG at top level) ---- */
function brain_chunksFor(fileId){ return BRAIN_CHUNKS.filter(c=>c.file===fileId); }
function brain_hitsTotal(){ return BRAIN_CHUNKS.reduce((s,c)=>s+c.hits,0); }
function brain_staleTotal(){ return BRAIN_CHUNKS.filter(c=>c.stale).length; }
function brain_paidTotal(){ return BRAIN_CHUNKS.filter(c=>c.paid).length; }
function brain_staleIn(fileId){ return brain_chunksFor(fileId).filter(c=>c.stale).length; }

/* ---- selection state + re-render ---- */
let brain_file = 0;     // selected topic-file id
let brain_chunk = null; // selected chunk index into BRAIN_CHUNKS (or null)

function brain_rerender(){
  const c = document.getElementById('content');
  if (c) c.replaceChildren(brainPanel());
}
function brain_pickFile(id){ brain_file = id; brain_chunk = null; brain_rerender(); }
function brain_pickChunk(idx){ brain_chunk = idx; brain_rerender(); }

/* tiny tier-dot trio (DIY · Trial · Active) */
function brain_tierDots(t){
  const dots = [['D',t.diy],['T',t.trial],['A',t.active]]
    .map(([l,on])=>'<span class="brain-tdot'+(on?' on':'')+'" title="'+(l==='D'?'DIY':l==='T'?'Trial':'Active')+(on?' — visible':' — hidden')+'">'+l+'</span>').join('');
  return '<span class="brain-tiers">'+dots+'</span>';
}

/* ============================================================ PANEL ============================================================ */
function brainPanel(){
  const p = el('section', 'panel show brain-panel');
  const totalChunks = BRAIN_CHUNKS.length;

  /* header — matches the guests/budget surfhead pattern */
  p.appendChild(el('div', 'surfhead',
    '<div><h1>Concierge brain</h1><p>'+totalChunks+' curated chunks across '+BRAIN_FILES.length+' topic files · '+
      brain_hitsTotal().toLocaleString('en-PH')+' retrievals in 30 days · '+
      '<span class="brain-ro">Read-only browse · V1</span></p></div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn" disabled style="opacity:.5;cursor:default">Export .md archive</button>'+
      '<button class="btn" disabled style="opacity:.5;cursor:default">Regenerate stale</button>'+
    '</div>'));

  /* pilot banner (0023 nav row 23 — exact copy) */
  p.appendChild(el('div','brain-pilot',
    '<span class="brain-pilot-ico">⏸</span>'+
    '<div><b>Concierge is OFF for pilot.</b> Content authoring lands ahead of post-pilot launch — '+
    'this surface is read-only in V1. Editing, the Unanswered-Questions queue, Cost Watch and the '+
    'Cowork sync lane arrive V1.x.</div>'));

  /* three-column body: topic-file rail | chunk list | chunk detail */
  const wrap = el('div', 'brain-wrap');
  wrap.appendChild(brain_fileRail());
  wrap.appendChild(brain_chunkList());
  wrap.appendChild(brain_detail());
  p.appendChild(wrap);
  return p;
}

/* ---- LEFT: topic-file nav rail ---- */
function brain_fileRail(){
  const r = el('div', 'frail brain-rail');
  r.appendChild(el('h4', null, 'Topic files'));
  const list = el('div', 'brain-flist');
  BRAIN_FILES.forEach(f=>{
    const n = brain_chunksFor(f.id).length;
    const stale = brain_staleIn(f.id);
    const row = el('button', 'brain-frow'+(brain_file===f.id?' sel':''));
    row.onclick = ()=>brain_pickFile(f.id);
    row.innerHTML =
      '<span class="brain-fico">'+f.ico+'</span>'+
      '<span class="brain-fmeta"><b>'+f.name+'</b><small>'+f.file+'</small></span>'+
      (stale?'<span class="brain-fstale" title="'+stale+' stale embedding'+(stale>1?'s':'')+'">⚠ '+stale+'</span>':'')+
      '<span class="brain-fcount">'+n+'</span>';
    list.appendChild(row);
  });
  r.appendChild(list);

  /* at-a-glance — mirrors the guests .fstat block */
  r.appendChild(el('h4', null, 'At a glance'));
  [['Topic files', BRAIN_FILES.length],
   ['Total chunks', BRAIN_CHUNKS.length],
   ['Paid-tier only', brain_paidTotal()],
   ['Stale embeddings', brain_staleTotal()],
   ['Retrievals · 30d', brain_hitsTotal().toLocaleString('en-PH')]]
   .forEach(([k,v])=>r.appendChild(el('div','fstat','<span>'+k+'</span><b>'+v+'</b>')));

  /* embedding legend */
  r.appendChild(el('h4', null, 'Embedding'));
  const leg = el('div','brain-leg');
  leg.innerHTML =
    '<div class="brain-legrow"><span class="brain-emb ok">✅</span> Current — in sync</div>'+
    '<div class="brain-legrow"><span class="brain-emb stale">⚠</span> Stale — flagged to regenerate</div>'+
    '<div class="brain-legrow"><span class="brain-lock">🔒</span> Paid-tier-only chunk</div>';
  r.appendChild(leg);
  return r;
}

/* ---- CENTER: the chunk list for the selected topic file ---- */
function brain_chunkList(){
  const box = el('div', 'brain-mid');
  const f = BRAIN_FILES[brain_file];
  const rows = brain_chunksFor(brain_file);

  /* section head */
  const head = el('div','brain-sechead');
  head.innerHTML =
    '<span class="brain-sec-ico">'+f.ico+'</span>'+
    '<div class="brain-sec-meta"><h2>'+f.name+'</h2><div class="brain-sec-file">'+f.file+'</div></div>'+
    '<span class="count">'+rows.length+' chunk'+(rows.length===1?'':'s')+'</span>';
  box.appendChild(head);

  if(!rows.length){
    box.appendChild(el('div','brain-empty','No chunks in this topic file yet. Authoring lands ahead of post-pilot launch.'));
    return box;
  }

  /* the chunk cards (fill-don't-stretch: a single readable column of rich rows) */
  const listEl = el('div','brain-clist');
  rows.forEach(c=>{
    const idx = BRAIN_CHUNKS.indexOf(c);
    const card = el('div','brain-ccard'+(brain_chunk===idx?' sel':''));
    card.onclick = ()=>brain_pickChunk(idx);

    const tags = c.tags.map(t=>'<span class="brain-tag">'+t+'</span>').join('');
    const emb = c.stale
      ? '<span class="brain-emb stale" title="Embedding stale — flagged to regenerate">⚠ stale</span>'
      : '<span class="brain-emb ok" title="Embedding current">✅ current</span>';

    card.innerHTML =
      '<div class="brain-c-top">'+
        '<div class="brain-c-title">'+(c.paid?'<span class="brain-lock" title="Paid-tier only">🔒</span> ':'')+c.title+'</div>'+
        emb+
      '</div>'+
      '<div class="brain-c-chips">'+tags+'</div>'+
      '<div class="brain-c-foot">'+
        '<span class="brain-c-applies">'+c.applies+'</span>'+
        brain_tierDots(c.tiers)+
        '<span class="brain-c-hits" title="Retrievals in last 30 days">'+c.hits.toLocaleString('en-PH')+' hits · 30d</span>'+
        '<span class="brain-c-ver">verified '+c.verified.date+' · '+c.verified.by+'</span>'+
      '</div>';
    listEl.appendChild(card);
  });
  box.appendChild(listEl);
  return box;
}

/* ---- RIGHT: the selected chunk detail pane ---- */
function brain_detail(){
  const d = el('div', 'gdetail brain-detail');

  if(brain_chunk===null){
    d.appendChild(el('div','gd-empty',
      '<div class="bi">🧠</div><div>Select a chunk to read the exact markdown the Concierge sees when it retrieves this knowledge — body, tags, tier visibility, retrieval count and source citation.</div>'));
    return d;
  }

  const c = BRAIN_CHUNKS[brain_chunk];
  const f = BRAIN_FILES[c.file];

  /* hero */
  const hero = el('div','gd-hero');
  hero.innerHTML =
    '<div class="brain-d-ico">'+f.ico+'</div>'+
    '<div class="gd-name">'+c.title+'</div>'+
    '<div class="gd-sub">'+f.name+' · '+f.file+'</div>'+
    '<div class="brain-d-state">'+
      (c.paid?'<span class="brain-d-pill lock">🔒 Paid-tier only</span>':'<span class="brain-d-pill free">Free · all tiers</span>')+
      (c.stale?'<span class="brain-d-pill stale">⚠ Embedding stale</span>':'<span class="brain-d-pill ok">✅ Embedding current</span>')+
    '</div>';
  d.appendChild(hero);

  const b = el('div','gd-b');

  /* the body preview — "exactly as the LLM sees it" (0023 § 3.13a tab 1) */
  b.appendChild(el('div','brain-bodylabel','Chunk body — as retrieved'));
  b.appendChild(el('div','brain-body', brain_md(c.body)));

  /* metadata rows */
  b.appendChild(el('div','gd-row','<span class="k">Applies to</span><span>'+c.applies+'</span>'));

  const tierRow = el('div','gd-row');
  tierRow.innerHTML = '<span class="k">Tier visibility</span>'+brain_tierDots(c.tiers);
  b.appendChild(tierRow);

  b.appendChild(el('div','gd-row','<span class="k">Retrievals · 30d</span><span><b>'+c.hits.toLocaleString('en-PH')+'</b></span>'));
  b.appendChild(el('div','gd-row','<span class="k">Last verified</span><span>'+c.verified.date+' · '+c.verified.by+'</span>'));

  /* tags */
  const tagRow = el('div','gd-row brain-d-tagrow');
  tagRow.innerHTML = '<span class="k">Tags</span><span class="brain-c-chips">'+c.tags.map(t=>'<span class="brain-tag">'+t+'</span>').join('')+'</span>';
  b.appendChild(tagRow);

  /* source citation — required, "no anonymous common knowledge" */
  b.appendChild(el('div','brain-srclabel','Source citation'));
  b.appendChild(el('div','brain-src', c.source));

  /* read-only footnote (matches V1 scope) */
  b.appendChild(el('div','brain-rofoot','Editing, embedding regeneration and the audit log are disabled while Concierge is OFF for pilot.'));

  d.appendChild(b);
  return d;
}

/* tiny, safe markdown-ish renderer for the body preview (bold + bullets + paragraphs).
   Input fixtures are trusted/static; this only handles **bold**, "- " bullets and blank-line paragraphs. */
function brain_md(src){
  const blocks = src.split('\n');
  let out = '', inList = false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  blocks.forEach(line=>{
    const t = line.trim();
    if(/^[-•]\s+/.test(t)){
      if(!inList){ out += '<ul class="brain-md-ul">'; inList = true; }
      out += '<li>'+inline(t.replace(/^[-•]\s+/, ''))+'</li>';
    } else {
      if(inList){ out += '</ul>'; inList = false; }
      if(/^\d+\.\s+/.test(t)){ out += '<div class="brain-md-num">'+inline(t)+'</div>'; }
      else if(t){ out += '<p class="brain-md-p">'+inline(t)+'</p>'; }
    }
  });
  if(inList) out += '</ul>';
  return out;
}

/* ---- tiny deterministic color-name + hex helpers (no RNG) ---- */
function moodboardlibrary_colorName(h, s, l){
  if (s < 12) return l > 80 ? 'Soft Alabaster' : l < 25 ? 'Deep Obsidian' : 'Warm Greige';
  const fam = h < 18 ? 'Rose' : h < 42 ? 'Champagne' : h < 70 ? 'Marigold'
    : h < 160 ? 'Sage' : h < 200 ? 'Eucalyptus' : h < 255 ? 'Cornflower'
    : h < 300 ? 'Mulberry' : h < 340 ? 'Plum' : 'Rose';
  const tone = l > 78 ? 'Pale ' : l > 58 ? 'Light ' : l > 38 ? '' : 'Deep ';
  return tone + fam;
}
function moodboardlibrary_hslHex(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const aa = s * Math.min(l, 1 - l);
  const f = n => l - aa * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return ('#' + to(f(0)) + to(f(8)) + to(f(4))).toUpperCase();
}

/* ---- derived helpers (no clock / no RNG at module load) ---- */

function taxonomy_pendingForFamily(label){
  return TAXONOMY_PENDING.filter(g => g.parent === label || g.parent.indexOf(label + ' ›') === 0);

function taxonomy_totals(){

  TAXONOMY_DATA.forEach(p => { tiles += p.tiles.length; vendors += taxonomy_familyVendors(p); });

  return flags.map(f => '<span class="taxonomy-flag'+(f==='sn'?' sn':'')+'">'+(TAXONOMY_FLAG_TXT[f]||f)+'</span>').join('');

/* ---- one parent-family card: header (icon · counts · pending badge ·
   collapse) + a tidy grid of its child tiles. Tiles fill wide screens
   by adding columns, never stretching one column. ---- */
function taxonomy_familyCard(fam){
  const collapsed = !!taxonomy_collapsed[fam.key];
  const vendors = taxonomy_familyVendors(fam);
  const pendN = taxonomy_pendingForFamily(fam.label).length;

  const card = el('div','taxonomy-fam'+(collapsed?' collapsed':''));

  const head = el('button','taxonomy-famhead');
  head.innerHTML =
    '<span class="taxonomy-famchev">▾</span>'+
    '<span class="taxonomy-famico">'+fam.icon+'</span>'+
    '<span class="taxonomy-famname serif">'+fam.label+'</span>'+
    '<span class="taxonomy-famcounts">'+fam.tiles.length+' tiles · '+vendors.toLocaleString('en-PH')+' vendors</span>'+
    (pendN ? '<span class="taxonomy-fampend">▣ '+pendN+' pending</span>' : '');
  head.onclick = () => taxonomy_toggleFamily(fam.key);
  card.appendChild(head);

  const tiles = el('div','taxonomy-tiles');
  fam.tiles.forEach(t => {
    const isBranch = !!t.branch;
    const tile = el('div','taxonomy-tile'+(isBranch?' branch':'')+((t.flags&&t.flags.indexOf('sn')>-1)?' sn':''));
    tile.innerHTML =
      '<div class="taxonomy-tilehead">'+
        '<span class="taxonomy-tilename">'+t.label+(isBranch?' <span class="taxonomy-branchtag">branch</span>':'')+'</span>'+
        '<span class="count taxonomy-tilecount">'+taxonomy_tileVendors(t)+'</span>'+
      '</div>'+
      ((t.flags&&t.flags.length)||t.note ?
        '<div class="taxonomy-tilemeta">'+taxonomy_flagPills(t.flags)+
          (t.note?'<span class="taxonomy-tilenote">'+t.note+'</span>':'')+'</div>' : '');
    tiles.appendChild(tile);
  });
  card.appendChild(tiles);

  return card;
}

/* ---- filter + sort state (one module-level object, like gFilter/gSort) ---- */
let songs_sel = 0;                                   // selected order id
let songs_filter = { tier: 'all', phase: 'all', q: '' };
let songs_sort = { k: 'days', dir: 1 };
let songs_lyricOpen = true;                          // detail: lyrics expanded?

/* ============================================================ helpers ============================================================ */
const SONGS_HUE = s => s.split('').reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 11);
const songs_initials = n => n.replace(/[^A-Za-z& ]/g, '').split(/[ &]+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('');

function songs_rerender() {
  const c = document.getElementById('content');
  if (c) { c.scrollTop = 0; c.replaceChildren(songsPanel()); }
}
function songs_select(id) { songs_sel = id; songs_rerender(); }

function songs_filtered() {
  let rows = songs_rows.filter(r => {
    if (songs_filter.tier !== 'all' && r.tier !== songs_filter.tier) return false;
    if (songs_filter.phase !== 'all') {
      if (songs_filter.phase === 'action') { // "Needs me" = any owner-action phase
        if (SONGS_NEXT[r.phase].kind !== 'do') return false;
      } else if (r.phase !== songs_filter.phase) return false;
    }
    if (songs_filter.q && !((r.title + ' ' + r.couple + ' ' + r.pk + ' ' + r.ref).toLowerCase().includes(songs_filter.q))) return false;
    return true;
  });
  const k = songs_sort.k;
  rows.sort((a, b) => {
    let x = a[k], y = b[k];
    if (k === 'phase') { x = songs_phaseIndex(x); y = songs_phaseIndex(y); }
    if (k === 'tier')  { x = SONGS_TIERS[x].php;   y = SONGS_TIERS[y].php; }
    if (typeof x === 'string') { x = x.toLowerCase(); y = y.toLowerCase(); }
    return (x > y ? 1 : x < y ? -1 : 0) * songs_sort.dir;
  });
  return rows;
}

/* ---- top status strip (reuse .statstrip / .stat) ---- */
function songs_strip() {
  const strip = el('div', 'statstrip songs-strip');
  const total = songs_rows.length;
  const briefLate = songs_rows.filter(r => r.phase === 'brief_received_pending').length;
  const withCouple = songs_rows.filter(r => r.phase === 'samples_ready' || r.phase === 'sample_chosen').length;
  const action = songs_rows.filter(r => SONGS_NEXT[r.phase].kind === 'do').length;
  const delivered = songs_rows.filter(r => r.phase === 'delivered').length;
  [
    [String(action), 'Need owner action', Math.round(action / total * 100), 'var(--mulberry)'],
    [String(withCouple), 'With the couple', Math.round(withCouple / total * 100), 'var(--gold)'],
    [String(briefLate), 'Brief not in', Math.round(briefLate / total * 100), 'var(--rose)'],
    [String(delivered), 'Delivered', Math.round(delivered / total * 100), 'var(--sage)'],
  ].forEach(([v, k, pc, col]) => {
    const s = el('div', 'stat');
    s.innerHTML = '<div class="v" style="color:' + col + '">' + v + '</div><div class="k">' + k + '</div>' +
      '<div class="bar"><i style="width:' + pc + '%;background:' + col + '"></i></div>';
    strip.appendChild(s);
  });
  return strip;
}

/* ---- left filter rail (reuse .frail) ---- */
function songs_rail() {
  const r = el('div', 'frail');
  const s = el('input', 'fsearch');
  s.placeholder = 'Search title, couple, ref…';
  s.value = songs_filter.q;
  s.oninput = () => { songs_filter.q = s.value.toLowerCase(); songs_refreshBody(); };
  r.appendChild(s);

  r.appendChild(el('h4', null, 'Tier'));
  r.appendChild(songs_chipRow([['all', 'All'], ['basic', 'Basic'], ['premium', 'Premium'], ['suite', 'Suite']], 'tier'));

  r.appendChild(el('h4', null, 'Stage'));
  r.appendChild(songs_chipRow([
    ['all', 'All'], ['action', 'Needs me'], ['samples_ready', 'With couple'],
    ['locked_in', 'Mastering'], ['delivered', 'Delivered'],
  ], 'phase'));

  r.appendChild(el('h4', null, 'Queue health'));
  const total = songs_rows.length;
  const action = songs_rows.filter(r => SONGS_NEXT[r.phase].kind === 'do').length;
  const late = songs_rows.filter(r => r.phase === 'brief_received_pending').length;
  const rev = songs_rows.reduce((sum, r) => sum + SONGS_TIERS[r.tier].php, 0);
  [['In flight', songs_rows.filter(r => r.phase !== 'delivered').length], ['Need action', action],
   ['Brief late', late], ['Queue value', peso(rev)], ['Showing', songs_filtered().length]]
    .forEach(([k, v]) => r.appendChild(el('div', 'fstat', '<span>' + k + '</span><b>' + v + '</b>')));

function songs_chipRow(opts, key) {
  const row = el('div', 'fchips');
  opts.forEach(([val, lbl]) => {
    const c = el('button', 'fchip' + (songs_filter[key] === val ? ' on' : ''), lbl);
    c.onclick = () => { songs_filter[key] = val; songs_rerender(); };
    row.appendChild(c);
  });
  return row;
}

/* ---- middle song-order table (reuse .gtable/table) ---- */
function songs_table() {
  const box = el('div', 'gtable');
  const cols = [['title', 'Song'], ['couple', 'Couple'], ['tier', 'Tier'], ['phase', 'Stage'], ['bpm', 'Key / BPM'], ['days', 'SLA']];
  const tbl = el('table');
  const thead = el('thead'); const tr = el('tr');
  cols.forEach(([k, lbl]) => {
    const th = el('th', null, lbl + (songs_sort.k === k ? ' <span class="ar">' + (songs_sort.dir > 0 ? '▲' : '▼') + '</span>' : ''));
    th.onclick = () => { if (songs_sort.k === k) songs_sort.dir *= -1; else { songs_sort.k = k; songs_sort.dir = 1; } songs_rerender(); };
    tr.appendChild(th);
  });
  thead.appendChild(tr); tbl.appendChild(thead);
  const tb = el('tbody'); tb.id = 'songs-body';
  tbl.appendChild(tb); box.appendChild(tbl);
  songs_fillBody(tb);

}
function songs_fillBody(tb) {
  tb.innerHTML = '';
  songs_filtered().forEach(r => {
    const tr = el('tr', songs_sel === r.id ? 'sel' : '');
    tr.onclick = () => songs_select(r.id);
    const h = SONGS_HUE(r.title);
    const t = SONGS_TIERS[r.tier];
    const keyBpm = r.bpm ? (r.musKey + ' · ' + r.bpm) : '—';
    tr.innerHTML =
      '<td><div class="gname"><span class="gini songs-disc" style="background:hsl(' + h + ',44%,52%)">♪</span>' +

      '<td>' + r.couple + '</td>' +
      '<td><span class="songs-tier songs-tier-' + r.tier + '">' + t.label + '</span></td>' +
      '<td><span class="pill ' + songs_pillClass(r.phase) + '">' + songs_phaseLabel(r.phase) + '</span></td>' +
      '<td class="tabletag">' + keyBpm + '</td>' +

/* ---- right workflow rail — phase ladder + the owner's next action ---- */
function songs_workflow() {
  const w = el('div', 'songs-flow');
  const r = songs_rows[songs_sel];
  if (!r) {
    w.appendChild(el('div', 'gd-empty', '<div class="bi">☰</div><div>The Suno workflow ladder and the next owner action appear here once a song is selected.</div>'));
    return w;
  }
  const cur = songs_phaseIndex(r.phase);
  const next = SONGS_NEXT[r.phase];

  w.appendChild(el('div', 'songs-flowhead', '<h4>Workflow</h4><span class="songs-flowstep">Step ' + (cur + 1) + ' of ' + SONGS_PHASES.length + '</span>'));

  const ladder = el('div', 'songs-ladder');
  SONGS_PHASES.forEach((ph, i) => {
    const state = i < cur ? 'done' : i === cur ? 'now' : 'todo';
    const node = el('div', 'songs-step songs-step-' + state);
    node.innerHTML =
      '<span class="songs-node">' + (state === 'done' ? '✓' : (i + 1)) + '</span>' +
      '<span class="songs-steptx"><b>' + ph.label + '</b><small>' + ph.short + '</small></span>';
    ladder.appendChild(node);
  });
  w.appendChild(ladder);

  // next-action card
  const card = el('div', 'songs-next songs-next-' + next.kind);
  card.innerHTML =
    '<div class="songs-nextlbl">' + (next.kind === 'do' ? 'NEXT — YOUR MOVE' : next.kind === 'done' ? 'COMPLETE' : 'WAITING ON COUPLE') + '</div>' +
    '<div class="songs-nextnote">' + next.note + '</div>';
  const btn = el('button', 'btn' + (next.kind === 'do' ? ' primary' : ''), next.cta);
  btn.style.cssText = 'width:100%;margin-top:12px';
  if (next.kind === 'wait') btn.disabled = false; // nudge still actionable
  card.appendChild(btn);
  w.appendChild(card);

  // two-admin note for the high-value tier (mirrors the §9.1 major-decision gate vibe)
  if (r.tier === 'suite') {
    w.appendChild(el('div', 'songs-gate', '⚠ Wedding Suite · ' + peso(SONGS_TIERS.suite.php) + ' — refunds &amp; cancellations need second-admin sign-off (§9.1).'));
  }

  // secondary actions
  const acts = el('div', 'songs-acts');
  [['✎', 'Owner notes'], ['↻', 'Re-render'], ['✉', 'Message couple']].forEach(([ico, lbl]) => {
    acts.appendChild(el('button', 'btn songs-act', '<span>' + ico + '</span> ' + lbl));
  });
  w.appendChild(acts);
  return w;
}

let website_page = 0;   // index into WEBSITE_PAGES
let website_widget = 0; // index of selected widget within the current page

function website_cur() { return WEBSITE_PAGES[website_page]; }
function website_gateLabel(g) { return g === 'count' ? 'Count-gated' : g === 'per_tile' ? 'Per-tile' : null; }

function website_rerender() {
  const c = document.getElementById('content');
  if (c) c.replaceChildren(websitePanel());
}

/* select a page → reset widget selection to its first widget */
function website_selPage(i) { website_page = i; website_widget = 0; website_rerender(); }
function website_selWidget(i) { website_widget = i; website_rerender(); }
function website_toggle(i) {
  const w = website_cur().widgets[i];
  w.on = !w.on;
  website_widget = i;
  website_rerender();
}
/* move a widget up/down within its page (reorder affordance — no real DnD needed) */
function website_move(i, dir) {
  const list = website_cur().widgets;
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  const t = list[i]; list[i] = list[j]; list[j] = t;
  website_widget = j; // selection follows the moved widget
  website_rerender();
}

function websitePanel() {
  const p = el('section', 'panel show website-panel');
  const page = website_cur();

  // ---- surface header ----
  p.appendChild(el('div', 'surfhead',
    '<div><h1>Website editor</h1><p>Marketing-site widget layout · ' + page.route +
      ' · <span class="website-auth">single-admin · reversible</span></p></div>' +
    '<div style="display:flex;gap:8px">' +
      '<button class="btn">View audit log</button>' +
      '<button class="btn primary">↗ Preview site</button>' +
    '</div>'));

  // ---- stat strip (across all pages) ----
  const pages = WEBSITE_PAGES.length;
  const allW = WEBSITE_PAGES.reduce((s, pg) => s + pg.widgets.length, 0);
  const enabled = WEBSITE_PAGES.reduce((s, pg) => s + pg.widgets.filter(w => w.on).length, 0);
  const gated = WEBSITE_PAGES.reduce((s, pg) => s + pg.widgets.filter(w => w.gate).length, 0);
  const strip = el('div', 'statstrip');
  [
    [pages, 'Marketing pages', 100],
    [allW + '<small>/' + allW + '</small>', 'Widgets in registry', 100],
    [enabled + '<small>/' + allW + '</small>', 'Enabled site-wide', Math.round(enabled / allW * 100)],
    [gated, 'Gated (count / per-tile)', Math.round(gated / allW * 100)],
  ].forEach(([v, k, pc]) => strip.appendChild(
    el('div', 'stat', '<div class="v">' + v + '</div><div class="k">' + k + '</div><div class="bar"><i style="width:' + pc + '%"></i></div>')));
  p.appendChild(strip);

  // ---- 3-column body: page rail | widget list | detail ----
  const wrap = el('div', 'website-wrap');
  wrap.appendChild(website_pageRail());
  wrap.appendChild(website_widgetList());
  wrap.appendChild(website_detail());
  p.appendChild(wrap);
  return p;
}

/* ---------- CENTER: ordered reorderable widget list ---------- */
function website_widgetList() {
  const page = website_cur();
  const box = el('div', 'card website-listcard');
  const enabledN = page.widgets.filter(w => w.on).length;
  box.appendChild(el('div', 'card-h website-listhead',
    '<h3>' + page.label + ' layout</h3>' +
    '<span class="website-ordernote">Drag to reorder · ' + enabledN + ' of ' + page.widgets.length + ' live</span>'));

  const body = el('div', 'website-rows');
  page.widgets.forEach((w, i) => {
    const row = el('div', 'website-row' + (i === website_widget ? ' sel' : '') + (w.on ? '' : ' off'));
    row.onclick = () => website_selWidget(i);

    // drag handle (affordance only) + move controls
    const handle = el('div', 'website-handle');
    handle.title = 'Drag to reorder';
    handle.innerHTML = '<span class="website-grip">⋮⋮</span>';
    const up = el('button', 'website-arrow' + (i === 0 ? ' dis' : ''), '▲');
    up.title = 'Move up';
    up.onclick = (e) => { e.stopPropagation(); website_move(i, -1); };
    const dn = el('button', 'website-arrow' + (i === page.widgets.length - 1 ? ' dis' : ''), '▼');
    dn.title = 'Move down';
    dn.onclick = (e) => { e.stopPropagation(); website_move(i, 1); };
    const moves = el('div', 'website-moves');
    moves.append(up, dn);
    handle.appendChild(moves);
    row.appendChild(handle);

    // order number
    row.appendChild(el('div', 'website-ord', String(i + 1)));

    // label + id + note
    const meta = el('div', 'website-rmeta');
    meta.innerHTML =
      '<b>' + w.label + '</b>' +
      '<code class="website-wid">' + w.id + '</code>' +
      '<small>' + w.note + '</small>';
    row.appendChild(meta);

    // gate badge
    const badgeCell = el('div', 'website-badges');
    const gl = website_gateLabel(w.gate);
    if (gl) badgeCell.appendChild(el('span', 'website-gate ' + (w.gate === 'count' ? 'count' : 'tile'), gl));
    row.appendChild(badgeCell);

    // enable toggle + status pill
    const ctrl = el('div', 'website-ctrl');
    ctrl.appendChild(el('span', 'pill ' + (w.on ? 'yes' : 'no'), w.on ? 'Enabled' : 'Disabled'));
    const sw = el('button', 'website-toggle' + (w.on ? ' on' : ''));
    sw.title = w.on ? 'Disable widget' : 'Enable widget';
    sw.setAttribute('role', 'switch');
    sw.setAttribute('aria-checked', w.on ? 'true' : 'false');
    sw.innerHTML = '<span class="website-knob"></span>';
    sw.onclick = (e) => { e.stopPropagation(); website_toggle(i); };
    ctrl.appendChild(sw);
    row.appendChild(ctrl);

    body.appendChild(row);
  });
  box.appendChild(body);
  return box;
}

  [

    [w.on ? '◉' : '○', 'site_widgets_toggle', 'set is_enabled → ' + w.on, 'Mara R. · admin', '2h ago'],
    ['↕', 'site_widgets_reorder', 'home_chaos reordered', 'Dado L. · admin', 'Yesterday'],
  ].forEach(([ic, act, det, who, t]) => {

      '<div class="website-logbody"><code class="website-act">' + act + '</code> ' + det +

  });
  b.appendChild(log);

  d.appendChild(b);
  return d;

/* ============================================================ ADS (Boosted Ads + Sponsored Boost — list-detail) ============================================================

  { id:8, vendor:'Petal & Vine',            cat:'Florist',      ico:'🌿', city:'Tagaytay', cert:true,  type:'sponsored', tier:'Annual',    radius:30, weekly:1499, status:'paused', ref:'1B5XR2MC', start:'Apr 02', end:'Jul 02', impr:26512, clicks:889,  inq:96,  spend:14990 },
];

const ADS_TYPE = { boost:'Boosted Ads', sponsored:'Sponsored Boost' };
const ADS_STATUS = { live:'Live', review:'Pending review', paused:'Paused', ended:'Ended' };
const ADS_PILL = { live:'yes', review:'pending', paused:'pending', ended:'no' };

let ads_sel = 0;
let ads_filter = { type:'all', status:'all', q:'' };
let ads_sort = { k:'weekly', dir:-1 };

function ads_hue(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; }
function ads_ini(n){ return n.split(' ').map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase(); }

function ads_filtered(){
  let rows = ADS_CAMPAIGNS.filter(c=>{
    if(ads_filter.type!=='all' && c.type!==ads_filter.type) return false;
    if(ads_filter.status!=='all' && c.status!==ads_filter.status) return false;
    if(ads_filter.q && !(c.vendor+' '+c.cat+' '+c.city+' '+c.ref).toLowerCase().includes(ads_filter.q)) return false;
    return true;
  });
  const k = ads_sort.k;
  rows.sort((a,b)=>{ let x=a[k], y=b[k]; if(typeof x==='string'){ x=x.toLowerCase(); y=y.toLowerCase(); } return (x>y?1:x<y?-1:0)*ads_sort.dir; });
  return rows;
}

function ads_rerender(){ document.getElementById('content').replaceChildren(adsPanel()); }
function ads_select(id){ ads_sel = id; ads_rerender(); }

function adsPanel(){
  const p = el('section','panel show');

  // ---- surface head ----
  p.appendChild(el('div','surfhead',
    '<div><h1>Ads</h1><p>Boosted Ads &amp; Sponsored Boost · vendor marketing spend on the Setnayan marketplace</p></div>'+
    '<div style="display:flex;gap:8px"><button class="btn">Geographic radii</button><button class="btn">Export ledger</button><button class="btn primary">+ New campaign</button></div>'));

  // ---- stat strip ----
  const live = ADS_CAMPAIGNS.filter(c=>c.status==='live');
  const review = ADS_CAMPAIGNS.filter(c=>c.status==='review');
  const weeklyRev = live.reduce((s,c)=>s+c.weekly,0);
  const totImpr = ADS_CAMPAIGNS.reduce((s,c)=>s+c.impr,0);
  const totClicks = ADS_CAMPAIGNS.reduce((s,c)=>s+c.clicks,0);
  const ctr = totImpr ? (totClicks/totImpr*100) : 0;
  const stats = el('div','statstrip');
  [
    ['<span class="ads-num">'+live.length+'</span><small>/'+ADS_CAMPAIGNS.length+'</small>','Campaigns live', Math.round(live.length/ADS_CAMPAIGNS.length*100)],
    [peso(weeklyRev)+'<small>/wk</small>','Recurring ad revenue', 76],
    [ctr.toFixed(1)+'<small>%</small>','Blended click-through', Math.min(100,Math.round(ctr*22))],
    ['<span class="ads-num">'+review.length+'</span>','Pending review · two-admin', review.length?40:0],
  ].forEach(([v,k,pc])=>stats.appendChild(el('div','stat','<div class="v">'+v+'</div><div class="k">'+k+'</div><div class="bar"><i style="width:'+pc+'%"></i></div>')));
  p.appendChild(stats);

  // ---- 3-pane body ----
  const wrap = el('div','ads-wrap');
  wrap.appendChild(ads_rail());
  wrap.appendChild(ads_table());
  wrap.appendChild(ads_detail());
  p.appendChild(wrap);
  return p;
}

/* ---- LEFT: filter + spend rail ---- */
function ads_rail(){
  const r = el('div','frail');
  const s = el('input','fsearch'); s.placeholder='Search vendor · city · ref…'; s.value=ads_filter.q;
  s.oninput = ()=>{ ads_filter.q = s.value.toLowerCase(); ads_rerender(); };
  r.appendChild(s);

  r.appendChild(el('h4',null,'Ad type'));
  r.appendChild(ads_chipRow([['all','All'],['boost','Boosted Ads'],['sponsored','Sponsored Boost']],'type'));

  r.appendChild(el('h4',null,'Status'));
  r.appendChild(ads_chipRow([['all','All'],['live','Live'],['review','Review'],['paused','Paused'],['ended','Ended']],'status'));

  r.appendChild(el('h4',null,'Spend at a glance'));
  const live = ADS_CAMPAIGNS.filter(c=>c.status==='live');
  const weeklyRev = live.reduce((s,c)=>s+c.weekly,0);
  const boostRev = live.filter(c=>c.type==='boost').reduce((s,c)=>s+c.weekly,0);
  const spRev = live.filter(c=>c.type==='sponsored').reduce((s,c)=>s+c.weekly,0);
  const billed = ADS_CAMPAIGNS.reduce((s,c)=>s+c.spend,0);
  [['Boosted Ads / wk', peso(boostRev)],['Sponsored Boost / wk', peso(spRev)],['Total recurring / wk', peso(weeklyRev)],['Billed to date', peso(billed)],['Showing', ads_filtered().length]]
   .forEach(([k,v])=>r.appendChild(el('div','fstat','<span>'+k+'</span><b>'+v+'</b>')));

  r.appendChild(el('div','ads-note','<b>Sponsored Boost</b> is certified-vendors-only. Boosted Ads density is gated at 20 km per § geographic radii.'));
  return r;
}
function ads_chipRow(opts,key){
  const row = el('div','fchips');
  opts.forEach(([val,lbl])=>{
    const c = el('button','fchip'+(ads_filter[key]===val?' on':''),lbl);
    c.onclick = ()=>{ ads_filter[key]=val; ads_rerender(); };
    row.appendChild(c);
  });
  return row;
}

/* ---- CENTER: campaign table ---- */
function ads_table(){
  const box = el('div','gtable');
  const cols = [['vendor','Vendor'],['type','Type'],['radius','Placement'],['status','Status'],['weekly','Weekly']];
  const tbl = el('table');
  const thead = el('thead'); const tr = el('tr');
  cols.forEach(([k,lbl])=>{
    const th = el('th',null,lbl+(ads_sort.k===k?' <span class="ar">'+(ads_sort.dir>0?'▲':'▼')+'</span>':''));
    th.onclick = ()=>{ if(ads_sort.k===k) ads_sort.dir*=-1; else { ads_sort.k=k; ads_sort.dir=1; } ads_rerender(); };
    tr.appendChild(th);
  });
  thead.appendChild(tr); tbl.appendChild(thead);
  const tb = el('tbody');
  ads_filtered().forEach(c=>{
    const row = el('tr', ads_sel===c.id?'sel':'');
    row.onclick = ()=>ads_select(c.id);
    const h = ads_hue(c.vendor);
    const place = c.type==='sponsored' ? ('Featured · '+c.tier) : (c.tier+' radius');
    row.innerHTML =
      '<td><div class="gname"><span class="gini" style="background:hsl('+h+',42%,52%)">'+ads_ini(c.vendor)+'</span>'+
        '<span class="gn-meta"><b>'+c.vendor+(c.cert?' <span class="ads-cert" title="Certified vendor">✦</span>':'')+'</b><small>'+c.cat+' · '+c.city+'</small></span></div></td>'+
      '<td><span class="ads-type ads-'+c.type+'">'+ADS_TYPE[c.type]+'</span></td>'+
      '<td class="tabletag">'+place+'</td>'+
      '<td><span class="pill '+ADS_PILL[c.status]+'">'+ADS_STATUS[c.status]+'</span></td>'+
      '<td class="ads-money">'+peso(c.weekly)+'<small>/wk</small></td>';
    tb.appendChild(row);
  });
  if(!tb.children.length) tb.appendChild(el('tr',null,'<td colspan="5" style="text-align:center;color:var(--ink-faint);padding:30px">No campaigns match these filters.</td>'));
  tbl.appendChild(tb); box.appendChild(tbl);
  return box;
}

/* ---- RIGHT: campaign detail ---- */
function ads_detail(){
  const d = el('div','gdetail');
  const c = ADS_CAMPAIGNS.find(x=>x.id===ads_sel);
  if(!c){
    d.appendChild(el('div','gd-empty','<div class="bi">📣</div><div>Select a campaign to see its placement, budget, run dates and live performance — side by side.</div>'));
    return d;
  }
  const h = ads_hue(c.vendor);

  // hero
  const hero = el('div','gd-hero');
  hero.innerHTML =
    '<div class="gd-ini" style="background:hsl('+h+',42%,52%)">'+ads_ini(c.vendor)+'</div>'+
    '<div class="gd-name">'+c.vendor+'</div>'+
    '<div class="gd-sub">'+c.cat+' · '+c.city+(c.cert?' · <span style="color:var(--gold)">Certified ✦</span>':'')+'</div>'+
    '<div class="ads-herotags"><span class="ads-type ads-'+c.type+'">'+ADS_TYPE[c.type]+'</span><span class="pill '+ADS_PILL[c.status]+'">'+ADS_STATUS[c.status]+'</span></div>';
  d.appendChild(hero);

  const b = el('div','gd-b');

  // placement / budget rows
  const place = c.type==='sponsored' ? ('Featured slot · '+c.tier) : ('Marketplace boost · '+c.tier);
  [
    ['Placement', place],
    ['Reach radius', c.radius+' km'],
    ['Weekly spend', peso(c.weekly)],
    ['Billing cycle', c.type==='sponsored' ? c.tier : 'Weekly'],
    ['Run dates', c.start+' → '+c.end],
    ['Reference', '<span class="ads-ref">'+c.ref+'</span>'],
  ].forEach(([k,v])=>b.appendChild(el('div','gd-row','<span class="k">'+k+'</span><span>'+v+'</span>')));

  // performance block (ADDED COLUMN on wide screens via .ads-perf grid)
  b.appendChild(el('div','ads-perfhead','Performance'));
  const perf = el('div','ads-perf');
  const ctr = c.impr ? (c.clicks/c.impr*100).toFixed(1)+'%' : '—';
  const conv = c.clicks ? (c.inq/c.clicks*100).toFixed(1)+'%' : '—';
  [
    ['Impressions', c.impr ? c.impr.toLocaleString('en-PH') : '—'],
    ['Clicks', c.clicks ? c.clicks.toLocaleString('en-PH') : '—'],
    ['Click-through', ctr],
    ['Inquiries', c.inq ? c.inq.toLocaleString('en-PH') : '—'],
    ['Inquiry rate', conv],
    ['Billed to date', c.spend ? peso(c.spend) : '—'],
  ].forEach(([k,v])=>perf.appendChild(el('div','ads-pcell','<div class="pv">'+v+'</div><div class="pk">'+k+'</div>')));
  b.appendChild(perf);

  // actions — status-aware
  const act = el('div','ads-act');
  if(c.status==='review'){
    act.appendChild(el('div','ads-gate','⚖ Two-admin gate · awaiting second approval before this slot goes live.'));
    const ap = el('button','btn primary','Approve & launch'); ap.style.flex='1.4';
    const rj = el('button','btn','Reject');
    ap.onclick = rj.onclick = ()=>{}; // prototype no-op
    const acts = el('div','ads-actrow'); acts.append(ap,rj); act.appendChild(acts);
  } else if(c.status==='live'){
    const acts = el('div','ads-actrow');
    const pause = el('button','btn','Pause campaign'); const end = el('button','btn','End early');
    acts.append(pause,end); act.appendChild(acts);
  } else if(c.status==='paused'){
    const acts = el('div','ads-actrow');
    const res = el('button','btn primary','Resume'); res.style.flex='1.4'; const end = el('button','btn','End');
    acts.append(res,end); act.appendChild(acts);
  } else {
    act.appendChild(el('div','ads-gate ads-gate-done','✓ Campaign ended '+c.end+' · '+peso(c.spend)+' billed.'));
    const re = el('button','btn','Duplicate as new'); re.style.width='100%'; act.appendChild(re);
  }
  b.appendChild(act);

  d.appendChild(b);
  return d;
}

      '<div class="settings-flagmeta"><b>'+name+(gated?' <span class="settings-gate sm">🔒 Two-admin</span>':'')+'</b><small>'+desc+'</small></div>'+
      '<span class="pill '+(on?'yes':'no')+'">'+(on?'Enabled':'Disabled')+'</span>';
    const t = settings_toggle(on, ()=>{ settings_flags[i][3] = !settings_flags[i][3]; settings_rerender(); });
    row.appendChild(t);
    list.appendChild(row);
  });
  b.appendChild(list);
  c.appendChild(b);
  return c;
}

        '<button class="btn primary">Approve</button>'+
        '<button class="btn">Reject</button>'+
        '<button class="btn settings-ghost">Request changes</button>'+
      '</div>';
    row.querySelector('.btn.primary').onclick = ()=>{ settings_approvals.splice(i,1); settings_rerender(); };

  return frag;
