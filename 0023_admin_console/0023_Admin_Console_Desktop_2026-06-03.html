/* ---- state ---- */
let help_sel = 0;            // selected ticket id
let help_filter = 'active'; // active | overdue | mine | resolved | all
let help_roleFilter = 'all';// all | customer | vendor

function help_rerender(){
  const c = document.getElementById('content');
  if (c) c.replaceChildren(helpPanel());
}
function help_select(id){ help_sel = id; help_rerender(); }
function help_setFilter(f){ help_filter = f; if (!help_visible().some(t => t.id === help_sel)) help_sel = (help_visible()[0] || {id:null}).id; help_rerender(); }
function help_setRole(r){ help_roleFilter = r; if (!help_visible().some(t => t.id === help_sel)) help_sel = (help_visible()[0] || {id:null}).id; help_rerender(); }
function help_setStatus(id, st){ const t = HELP_TICKETS.find(x => x.id === id); if (t){ t.status = st; t.slaTxt = (st === 'resolved') ? 'Resolved · within SLA' : (st === 'closed') ? 'Closed · within SLA' : t.slaTxt; } help_rerender(); }
function help_initials(n){ return n.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join(''); }

/* SLA flag tier from signed hours-left (no live clock) */
function help_slaTier(t){
  if (t.status === 'resolved' || t.status === 'closed') return 'done';
  if (t.slaHrs <= 0) return 'red';
  if (t.slaHrs <= 6) return 'amber';
  return 'green';
}

function help_visible(){
  return HELP_TICKETS.filter(t => {
    if (help_roleFilter !== 'all' && t.role !== help_roleFilter) return false;
    if (help_filter === 'active')   return t.status !== 'resolved' && t.status !== 'closed';
    if (help_filter === 'overdue')  return t.status === 'overdue' || (t.slaHrs <= 0 && t.status !== 'resolved' && t.status !== 'closed');
    if (help_filter === 'mine')     return t.assigned === HELP_ME && t.status !== 'resolved' && t.status !== 'closed';
    if (help_filter === 'resolved') return t.status === 'resolved' || t.status === 'closed';
    return true; // all
  }).sort((a, b) => a.slaHrs - b.slaHrs); // most urgent first (0029 § 7.1)
}

/* ============================================================ PANEL ============================================================ */
function helpPanel(){
  const p = el('section', 'panel show');

  const openCount = HELP_TICKETS.filter(t => t.status !== 'resolved' && t.status !== 'closed').length;
  const overdue   = HELP_TICKETS.filter(t => help_slaTier(t) === 'red').length;
  const mine      = HELP_TICKETS.filter(t => t.assigned === HELP_ME && t.status !== 'resolved' && t.status !== 'closed').length;

  p.appendChild(el('div', 'surfhead',
    '<div><h1>Help inbox</h1><p>' + openCount + ' open · ' + overdue + ' breaching the 24-hr SLA · customer &amp; vendor support tickets, topic-routed</p></div>' +
    '<div style="display:flex;gap:8px">' +
      '<button class="btn">Routing rules</button>' +
      '<button class="btn">Canned responses</button>' +
    '</div>'));

  /* SLA status strip — green/amber/red framing per 0029 § 7.1 */
  const strip = el('div', 'help-strip');
  strip.appendChild(el('span', 'help-spill', '🛟 ' + HELP_TICKETS.length + ' tickets'));
  strip.appendChild(el('span', 'help-spill green', '✓ 24-hr first-response SLA'));
  strip.appendChild(el('span', 'help-spill' + (overdue ? ' red' : ''), (overdue ? '⚠ ' + overdue + ' overdue' : '✓ none overdue')));
  strip.appendChild(el('span', 'help-spill amber', '◷ ' + mine + ' assigned to you'));
  p.appendChild(strip);

  const wrap = el('div', 'help-wrap');
  wrap.appendChild(help_queue());
  wrap.appendChild(help_thread());
  wrap.appendChild(help_context());
  p.appendChild(wrap);
  return p;
}

/* ---- LEFT: ticket queue ---- */
function help_queue(){
  const box = el('div', 'help-list');

  const head = el('div', 'help-list-h');
  head.appendChild(el('div', 'help-list-title serif', 'Tickets'));
  const fchips = el('div', 'help-fchips');
  [['active', 'Active'], ['overdue', 'Overdue'], ['mine', 'Mine'], ['resolved', 'Resolved'], ['all', 'All']].forEach(([v, l]) => {
    const c = el('button', 'help-fchip' + (help_filter === v ? ' on' : ''), l);
    c.onclick = () => help_setFilter(v);
    fchips.appendChild(c);
  });
  head.appendChild(fchips);
  const rchips = el('div', 'help-fchips help-rchips');
  [['all', 'All roles'], ['customer', 'Customer'], ['vendor', 'Vendor']].forEach(([v, l]) => {
    const c = el('button', 'help-rchip' + (help_roleFilter === v ? ' on' : ''), l);
    c.onclick = () => help_setRole(v);
    rchips.appendChild(c);
  });
  head.appendChild(rchips);
  box.appendChild(head);

  const scroll = el('div', 'help-list-scroll');
  const rows = help_visible();
  if (!rows.length){
    scroll.appendChild(el('div', 'help-empty', 'No tickets match this filter.'));
  } else {
    rows.forEach(t => {
      const tier = help_slaTier(t);
      const st = HELP_STATUS[t.status];
      const row = el('div', 'help-row' + (t.id === help_sel ? ' sel' : '') + ' sla-' + tier);
      row.innerHTML =
        '<span class="help-rico" style="background:hsl(' + t.hue + ',38%,52%)">' + t.ico + '</span>' +
        '<div class="help-rb">' +
          '<div class="help-rtop">' +
            '<span class="help-rolechip ' + t.role + '">' + (t.role === 'vendor' ? 'Vendor' : 'Customer') + '</span>' +
            '<span class="help-rnum">#' + t.num + '</span>' +
            '<span class="help-when">' + t.when + '</span>' +
          '</div>' +
          '<div class="help-rsub">' + t.sub + '</div>' +
          '<div class="help-rbot">' +
            '<span class="help-rcat">' + t.cat + ' · ' + t.who + '</span>' +
            '<span class="help-sla ' + tier + '">' + (tier === 'red' ? '⚑ ' : tier === 'amber' ? '◷ ' : '') + t.slaTxt + '</span>' +
          '</div>' +
        '</div>';
      row.onclick = () => help_select(t.id);
      scroll.appendChild(row);
    });
  }
  box.appendChild(scroll);
  return box;
}

/* ---- CENTER: open ticket thread + composer + actions ---- */
function help_thread(){
  const box = el('div', 'help-convo');
  const t = HELP_TICKETS.find(x => x.id === help_sel);

  if (!t){
    box.appendChild(el('div', 'help-convo-empty',
      '<div class="bi">🛟</div><div>Select a ticket to read the thread, reply, and assign or resolve it — side by side, with the requester’s account and linked records on the right.</div>'));
    return box;
  }

  const st = HELP_STATUS[t.status];
  const tier = help_slaTier(t);
  const adm = HELP_ADMINS[t.assigned];

  /* conversation header — subject · ref · role · status · SLA */
  const ch = el('div', 'help-convo-h');
  ch.innerHTML =
    '<span class="help-rico lg" style="background:hsl(' + t.hue + ',38%,52%)">' + t.ico + '</span>' +
    '<div class="help-convo-id">' +
      '<b class="serif">' + t.sub + '</b>' +
      '<span class="help-convo-meta">#' + t.num + ' · ' + t.cat + ' › ' + (t.subcat || '—') +
        ' · <span class="help-rolechip ' + t.role + '">' + (t.role === 'vendor' ? 'Vendor' : 'Customer') + '</span></span>' +
    '</div>' +
    '<span class="tb-sp"></span>' +
    '<span class="help-sla ' + tier + ' big">' + (tier === 'red' ? '⚑ ' : tier === 'amber' ? '◷ ' : tier === 'done' ? '✓ ' : '') + t.slaTxt + '</span>' +
    '<span class="pill ' + st.pill + '">' + st.label + '</span>';
  box.appendChild(ch);

  /* status stepper + assignment bar */
  const bar = el('div', 'help-actionbar');
  const stepper = el('div', 'help-stepper');
  [['open', 'Open'], ['in_progress', 'In progress'], ['waiting_user', 'Waiting'], ['resolved', 'Resolved'], ['closed', 'Closed']].forEach(([v, l]) => {
    const on = t.status === v || (t.status === 'overdue' && v === 'open');
    const b = el('button', 'help-step' + (on ? ' on' : ''), l);
    b.onclick = () => help_setStatus(t.id, v);
    stepper.appendChild(b);
  });
  bar.appendChild(stepper);
  const asg = el('div', 'help-assign');
  asg.innerHTML =
    '<span class="help-assign-k">Assigned</span>' +
    '<span class="help-assign-v"><span class="help-aini">' + adm.ini + '</span>' + adm.name + '</span>' +
    (HELP_ME === 'ops' ? '<button class="btn help-reassign">Reassign ▾</button>' : '');
  bar.appendChild(asg);
  box.appendChild(bar);

  /* message stream */
  const stream = el('div', 'help-stream');
  stream.appendChild(el('div', 'help-notice',
    '<span class="help-notice-ico">🛟</span><span>24-hr first-response SLA. Replies and status changes are single-admin (reversible · § 4.3). A resolution that issues a refund over ' + peso(25000) + ' needs a second-admin approval.</span>'));
  stream.appendChild(el('div', 'help-daysep', '<span>Ticket #' + t.num + ' · opened ' + t.when + '</span>'));

  t.msgs.forEach(m => {
    if (m.who === 'note'){
      stream.appendChild(el('div', 'help-internal',
        '<span class="help-internal-ico">🔒</span><div class="help-internal-b"><b>Internal note · not visible to user</b>' +
        '<div class="help-internal-t">' + m.body + '</div><div class="help-msgtime">' + m.at + '</div></div>'));
      return;
    }
    const mine = m.who === 'admin';
    const row = el('div', 'help-msg ' + (mine ? 'me' : 'them'));
    const senderName = mine ? (HELP_ADMINS[m.role] ? HELP_ADMINS[m.role].name : 'Setnayan Team') : t.who;
    const ini = mine ? (HELP_ADMINS[m.role] ? HELP_ADMINS[m.role].ini : 'SN') : help_initials(t.who);
    const av = '<span class="help-msg-av" ' + (mine ? '' : 'style="background:hsl(' + t.hue + ',38%,52%)"') + '>' + ini + '</span>';
    let bub = '<div class="help-bubble">' +
      '<div class="help-bubble-who">' + senderName + '</div>' +
      '<div class="help-bubble-t">' + m.body + '</div>';
    if (m.file){
      bub += '<div class="help-file"><span class="help-file-ico">' +
        (/\.(png|jpe?g)$/i.test(m.file.name) ? '🖼' : /\.mp4$/i.test(m.file.name) ? '🎞' : '📄') + '</span>' +
        '<div class="help-file-b"><b>' + m.file.name + '</b><small>' + m.file.meta + '</small></div>' +
        '<span class="help-file-dl">↓</span></div>';
    }
    bub += '<div class="help-msgtime">' + m.at + '</div></div>';
    row.innerHTML = mine ? (bub + av) : (av + bub);
    stream.appendChild(row);
  });
  box.appendChild(stream);

  /* composer — canned chips + textarea + internal-note toggle + send/resolve */
  const comp = el('div', 'help-composer');
  const canned = el('div', 'help-canned');
  canned.appendChild(el('span', 'help-canned-l', 'Canned'));
  HELP_CANNED.filter(c => c.cat === t.assigned || c.cat === 'ops').slice(0, 3).forEach(c => {
    canned.appendChild(el('button', 'help-cannedchip', c.t));
  });
  if (!HELP_CANNED.some(c => c.cat === t.assigned)){
    canned.appendChild(el('button', 'help-cannedchip', 'Acknowledge — looking into it'));
  }
  comp.appendChild(canned);

  const inputRow = el('div', 'help-input-row');
  const ta = el('textarea', 'help-input');
  ta.setAttribute('placeholder', 'Reply to ' + t.who + '… (markdown · 250-char minimum on the user’s side)');
  ta.setAttribute('rows', '3');
  inputRow.appendChild(ta);
  comp.appendChild(inputRow);

  const foot = el('div', 'help-composer-foot');
  foot.appendChild(el('label', 'help-noteswitch',
    '<input type="checkbox"><span>Internal note only</span>'));
  const fr = el('div', 'help-foot-r');
  fr.innerHTML = '<button class="iconbtn" title="Attach a file">＋</button>';
  if (t.refund > 25000){
    fr.appendChild(el('span', 'help-twoadmin', '⚖️ Resolution needs 2nd-admin approval'));
  }
  const resolveBtn = el('button', 'btn', 'Send &amp; resolve');
  resolveBtn.onclick = () => help_setStatus(t.id, 'resolved');
  fr.appendChild(resolveBtn);
  fr.appendChild(el('button', 'btn primary help-send', 'Send reply'));
  foot.appendChild(fr);
  comp.appendChild(foot);
  box.appendChild(comp);

  return box;
}

  const t = HELP_TICKETS.find(x => x.id === help_sel);
  if (!t){
    box.appendChild(el('div', 'help-ctx-empty', 'No ticket selected.'));
    return box;
  }
  const tier = help_slaTier(t);

  const hero = el('div', 'help-ctx-hero');
  hero.innerHTML =
    '<span class="help-ctx-av" style="background:hsl(' + t.hue + ',38%,52%)">' + help_initials(t.who) + '</span>' +
    '<div class="help-ctx-name serif">' + t.who + '</div>' +
    '<div class="help-ctx-sub"><span class="help-rolechip ' + t.role + '">' + (t.role === 'vendor' ? 'Vendor' : 'Customer') + '</span> · ticket #' + t.num + '</div>' +
    '<div class="help-ctx-actions"><button class="btn">View account</button><button class="btn">View as user</button></div>';
  box.appendChild(hero);

  const b = el('div', 'help-ctx-b');

  /* SLA timer block */
  b.appendChild(el('div', 'help-ctx-lbl', 'Service level'));
  const slaBox = el('div', 'help-ctx-sla ' + tier);
  slaBox.innerHTML =
    '<div class="help-ctx-slan">' + (tier === 'done' ? '✓' : t.slaTxt.replace(/ (left|overdue|·.*)$/, '')) + '</div>' +
    '<div class="help-ctx-slal">' +
      (tier === 'red' ? 'Past the 24-hr first response' :
       tier === 'amber' ? 'Inside the 24-hr SLA window' :
       tier === 'done' ? 'Closed within SLA' : 'On track for 24-hr response') + '</div>';
  b.appendChild(slaBox);

  /* linked record (0029 § 7.2) */
  if (t.link.kind !== 'none'){
    b.appendChild(el('div', 'help-ctx-lbl', 'Linked record'));
    const lr = el('button', 'help-ctx-link');
    lr.innerHTML =
      '<span class="help-ctx-link-ico">' + t.link.ico + '</span>' +

    b.appendChild(lr);
  }

  b.appendChild(el('div', 'help-ctx-lbl', 'Ticket'));

  /* attachments */
  const files = t.msgs.filter(m => m.file).map(m => m.file);
  b.appendChild(el('div', 'help-ctx-lbl', 'Attachments'));
  if (files.length){
    const fbox = el('div', 'help-ctx-files');
    files.forEach(f => fbox.appendChild(el('div', 'help-ctx-file',
      '<span class="help-file-ico sm">' + (/\.(png|jpe?g)$/i.test(f.name) ? '🖼' : /\.mp4$/i.test(f.name) ? '🎞' : '📄') + '</span>' +
      '<div class="help-file-b"><b>' + f.name + '</b><small>' + f.meta + '</small></div>')));
    b.appendChild(fbox);
  } else {
    b.appendChild(el('div', 'help-ctx-fempty', 'No attachments on this ticket.'));
  }

  box.appendChild(b);
  return box;
}

function conciergeabuse_rerender(){
  const p = document.querySelector('#content .panel');
  if(p) p.replaceWith(conciergeabusePanel());
}

function conciergeabuse_scoreMeta(s){
  if(s >= 0.85) return { band: 'red',   word: 'High confidence' };
  if(s >= 0.70) return { band: 'amber', word: 'Above block threshold' };
  return                 { band: 'green', word: 'Below threshold (0.70)' };
}

function conciergeabuse_list(){
  // V1 fixture is all pending_review; filter is illustrative + keeps the count chips honest.
  if(conciergeabuse_filter === 'all') return CONCIERGEABUSE_FLAGS;
  if(conciergeabuse_filter === 'pending') return CONCIERGEABUSE_FLAGS.filter(f => f.status === 'pending_review');
  if(conciergeabuse_filter === 'confirmed_7d') return CONCIERGEABUSE_FLAGS.filter(f => f.status === 'confirmed_abuse');
  if(conciergeabuse_filter === 'cleared_7d') return CONCIERGEABUSE_FLAGS.filter(f => f.status === 'cleared');
  return CONCIERGEABUSE_FLAGS;
}

function conciergeabuse_signalChips(sig, max){
  const keys = Object.keys(sig);
  const shown = (max && keys.length > max) ? keys.slice(0, max) : keys;
  let h = '';
  shown.forEach(k => {
    const s = CONCIERGEABUSE_SIGNALS[k]; if(!s) return;
    h += '<span class="conciergeabuse-sig'+(s.crit?' crit':'')+'" title="'+s.label+'">'+s.ico+' '+s.label+'</span>';
  });
  if(max && keys.length > max) h += '<span class="conciergeabuse-sig more">+'+(keys.length - max)+'</span>';
  return h;
}

function conciergeabuse_nextLevelLabel(level){
  if(level === 'none')         return CONCIERGEABUSE_TIERS.warning.short + ' (1 strike)';

}
function conciergeabuse_confirmLabel(level){
  if(level === 'none')    return 'Confirm → Warn';
  if(level === 'warning') return 'Confirm → Trial ban';
  return 'Confirm → Full ban';
}

/* mini SVG link-graph: flagged account center, matched accounts radial, edges = shared critical/signal weight */
function conciergeabuse_graph(f){
  const wrap = el('div','conciergeabuse-graph');
  const n = f.matches.length;
  const cx = 230, cy = 96, R = 70;
  let edges = '', nodes = '';
  f.matches.forEach((m, i) => {
    const ang = (Math.PI * (i + 1)) / (n + 1); // fan across the top arc
    const mx = cx + Math.cos(Math.PI - ang) * (R + 86);
    const my = cy + Math.sin(ang) * R + (i % 2 ? 18 : -2);
    // shared-signal weight: critical signals make the edge red + thicker
    const sharedCrit = (f.signals.same_phone && m.phone === f.phone) || (f.signals.same_payment && m.payment === f.payment);
    const stroke = sharedCrit ? 'var(--rose)' : 'var(--gold-line)';
    const sw = sharedCrit ? 2.6 : 1.6;
    edges += '<line x1="'+cx+'" y1="'+cy+'" x2="'+mx+'" y2="'+my+'" stroke="'+stroke+'" stroke-width="'+sw+'" stroke-dasharray="'+(sharedCrit?'':'3 4')+'"/>';
    nodes += '<g class="conciergeabuse-gnode">'+
      '<circle cx="'+mx+'" cy="'+my+'" r="17" fill="hsl('+HUE(m.name+m.acct)+',38%,52%)"/>'+
      '<text x="'+mx+'" y="'+(my+4)+'" text-anchor="middle" class="conciergeabuse-gini">'+initials(m.name)+'</text>'+
      '<text x="'+mx+'" y="'+(my+32)+'" text-anchor="middle" class="conciergeabuse-glbl">'+m.acct.slice(0,9)+'</text>'+
      '</g>';
  });
  wrap.innerHTML =
    '<svg viewBox="0 0 460 200" class="conciergeabuse-gsvg">'+
      edges +
      '<g><circle cx="'+cx+'" cy="'+cy+'" r="24" fill="hsl('+HUE(f.user)+',42%,55%)" stroke="var(--mulberry)" stroke-width="3"/>'+
        '<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" class="conciergeabuse-gini big">'+initials(f.user)+'</text>'+
        '<text x="'+cx+'" y="'+(cy+44)+'" text-anchor="middle" class="conciergeabuse-glbl strong">flagged</text></g>'+
      nodes +
    '</svg>'+
    '<div class="conciergeabuse-glegend"><span><i style="background:var(--rose)"></i> shared phone / payment</span>'+
      '<span><i style="background:var(--gold-line)"></i> other shared signal</span></div>';
  return wrap;
}

/* side-by-side signal comparison for one matched account (§ 3.11.2) */
function conciergeabuse_matchTable(f, m){
  const box = el('div','conciergeabuse-match');
  box.innerHTML =
    '<div class="conciergeabuse-mhead">'+
      '<span class="conciergeabuse-av" style="background:hsl('+HUE(m.name+m.acct)+',38%,52%);position:static;margin:0">'+initials(m.name)+'</span>'+
      '<div class="cm-meta"><b>'+m.name+'</b><small>'+m.acct+' · '+m.email+'</small></div>'+
      '<span class="conciergeabuse-trialused">'+m.trial+'</span>'+
    '</div>'+
    '<div class="conciergeabuse-mnote">'+m.note+'</div>';

  const rows = [
    ['Wedding date', f.weddingDate, m.date, m.date === f.weddingDate],
    ['Venue',        f.venue,       m.venue, m.venue === f.venue],
    ['Address',      f.address,     m.address, m.address === f.address],
    ['Phone',        f.phone,       m.phone, m.phone === f.phone, true],
    ['Payment',      f.payment,     m.payment, m.payment === f.payment, true],
    ['IP / device',  f.ip,          m.ip, m.ip === f.ip],
  ];
  const tbl = el('div','conciergeabuse-cmptable');
  tbl.innerHTML = '<div class="cmp-r cmp-head"><span>Signal</span><span>This account</span><span>Matched</span></div>';
  rows.forEach(([k, a, vb, match, crit]) => {
    tbl.innerHTML += '<div class="cmp-r'+(match?(' match'+(crit?' crit':'')):'')+'">'+
      '<span class="cmp-k">'+k+'</span>'+
      '<span class="cmp-v">'+a+'</span>'+
      '<span class="cmp-v">'+vb+(match?' <i class="cmp-tick">✓</i>':'')+'</span>'+
    '</div>';
  });
  box.appendChild(tbl);
  return box;
}

/* action handler — fixture-only: mutate state, toast-style inline confirm via re-render */
function conciergeabuse_act(f, kind){
  if(kind === 'clear'){
    f.status = 'cleared';
  } else if(kind === 'confirm'){
    f.status = 'confirmed_abuse';
    f.level = f.level === 'none' ? 'warning' : f.level === 'warning' ? 'trial_banned' : 'full_banned';
  } else if(kind === 'lift'){
    f.level = f.level === 'full_banned' ? 'trial_banned' : f.level === 'trial_banned' ? 'warning' : 'none';
    if(f.appeal) f.appeal.state = 'resolved';
  }
  // defer = no-op (stays pending_review)
  const ls = conciergeabuse_list();
  if(!ls.some(x => x.id === f.id)) conciergeabuse_sel = ls.length ? ls[0].id : null;
  conciergeabuse_rerender();
}

    log.appendChild(el('div', 'users-logrow',

  });
  b.appendChild(log);

  /* actions */
  b.appendChild(el('div', 'users-sec', 'Actions'));
  const acts = el('div', 'users-acts');
  [['Reset password', ''], ['View as user', ''], ['Send broadcast', '']].forEach(([t]) => {

  });

  /* destructive row */
  const danger = el('div', 'users-danger');
  const susp = el('button', 'btn', 'Suspend');
  susp.innerHTML = 'Suspend <span class="users-twoadmin">2-admin</span>';
  const del = el('button', 'btn', '🗑 Delete');

  return d;
}

/* ---- panel state (all "vendors_" prefixed, collision-free) ---- */
let vendors_sel = 0;
let vendors_filter = { cat: 'all', tier: 'all', q: '' };
let vendors_sort = { k: 'n', dir: 1 };
let vendors_twoAdminFor = null; // vendor id whose promote action is awaiting the 2nd-admin gate

function vendors_rerender() {
  const c = document.getElementById('content');
  if (c) c.replaceChildren(vendorsPanel());
}

function vendors_filtered() {
  let rows = vendors_DATA.filter(v => {
    if (vendors_filter.cat !== 'all' && v.cat !== vendors_filter.cat) return false;
    if (vendors_filter.tier !== 'all' && v.tier !== vendors_filter.tier) return false;
    if (vendors_filter.q && !(v.n + ' ' + v.cat + ' ' + v.city + ' ' + v.id + ' ' + v.owner).toLowerCase().includes(vendors_filter.q)) return false;
    return true;
  });
  const k = vendors_sort.k;
  rows.sort((a, b) => { let x = a[k], y = b[k]; if (typeof x === 'string') { x = x.toLowerCase(); y = y.toLowerCase(); } return (x > y ? 1 : x < y ? -1 : 0) * vendors_sort.dir; });
  return rows;
}

/* ============================================================ PANEL ============================================================ */
function vendorsPanel() {
  const p = el('section', 'panel show');
  const total = vendors_DATA.length;
  const ver = vendors_DATA.filter(v => v.tier === 'verified').length;

function vendors_fillBody(tb) {

/* ---- LEFT rail: search · status filter · at-a-glance · account list ---- */
function demovendors_rail(){
  const r = el('div','frail demovendors-rail');

  const s = el('input','fsearch'); s.placeholder='Search demo vendors…'; s.value=demovendors_filter.q;

  [['all','All'],['verified','Certified'],['coming_soon','Coming soon']].forEach(([v,l])=>{

    c.onclick = ()=>{ demovendors_filter.tier = v; demovendors_rerender(); };
    chips.appendChild(c);
  });
  r.appendChild(chips);

  r.appendChild(el('h4',null,'At a glance'));
  const total = demovendors_accounts.length;
  const certed = demovendors_accounts.filter(a=>a.tier==='verified').length;
  const soon = demovendors_accounts.filter(a=>a.tier==='coming_soon').length;
  const awaiting = demovendors_inquiries.filter(q=>q.status==='awaiting').length;
  [['Seeded accounts',total],['Certified',certed],['Coming soon',soon],['Awaiting reply',awaiting],['Showing',demovendors_list().length]]
    .forEach(([k,v])=>r.appendChild(el('div','fstat','<span>'+k+'</span><b>'+v+'</b>')));

  r.appendChild(el('h4',null,'Accounts'));
  const list = el('div','demovendors-acclist');
  const rows = demovendors_list();
  rows.forEach(a=>{
    const t = demovendors_TIERS[a.tier];

    const row = el('div','demovendors-accrow'+(demovendors_sel===a.id?' sel':''));
    row.onclick = ()=>demovendors_select(a.id);

      '<span class="gini" style="background:hsl('+a.hue+',42%,52%)">'+demovendors_ini(a.n)+'</span>'+
      '<span class="demovendors-accmeta"><b>'+a.n+(a.founder?' <span class="demovendors-star" title="Founder dogfooding account">★</span>':'')+'</b>'+
        '<small>'+a.cat+'</small></span>'+
      '<span class="demovendors-accright"><span class="demovendors-tdot" style="background:'+t.dot+'"></span>'+

/* ---- RIGHT rail: canned-responder inbox (pilot inquiries) ---- */
function demovendors_responder(){
  const r = el('div','demovendors-inbox');
  const a = demovendors_accounts.find(x=>x.id===demovendors_sel) || demovendors_list()[0];

  r.appendChild(el('div','card-h demovendors-inbhead',
    '<h3>Inquiry responder</h3>'+
    (a?'<span class="more">'+a.n.split(' ')[0]+'</span>':'')));

  const body = el('div','demovendors-inbbody');
  if(!a){
    body.appendChild(el('div','gd-empty','<div class="bi">💬</div><div>Pick a demo vendor to see its pilot inquiries.</div>'));
    r.appendChild(body); return r;
  }
  const qs = demovendors_inqFor(a.id);
  if(!qs.length){
    body.appendChild(el('div','demovendors-inbempty','No pilot inquiries for this demo vendor yet.'));
  }
  qs.forEach(q=>{
    const card = el('div','demovendors-inq'+(q.status==='replied'?' done':''));
    card.innerHTML =
      '<div class="demovendors-inqtop"><b>'+q.couple+'</b><span class="demovendors-inqwhen">'+q.when+'</span></div>'+
      '<div class="demovendors-inqask">"'+q.ask+'"</div>';
    if(q.status==='replied'){
      card.appendChild(el('div','demovendors-inqreply',
        '<span class="demovendors-replytag">Auto-replied</span>'+
        '<span class="demovendors-replytxt">'+(demovendors_scripts[a.id]||'')+'</span>'));
    } else {
      const send = el('button','btn primary demovendors-sendbtn','Send canned auto-reply');
      send.onclick = ()=>{ q.status='replied'; demovendors_rerender(); };
      card.appendChild(send);
    }
    body.appendChild(card);
  });
  r.appendChild(body);

  /* footer summary */
  const wait = qs.filter(q=>q.status==='awaiting').length;
  const done = qs.filter(q=>q.status==='replied').length;
  r.appendChild(el('div','demovendors-inbfoot',
    '<span><b>'+wait+'</b> awaiting</span><span><b>'+done+'</b> auto-replied</span>'));
  return r;
}

/* selection + filter state */
let events_sel = 'S89E-7K2M9PQ4XB';
let events_filter = { stage: 'all', q: '' };
let events_sort = { k: 'date', dir: 1 };

function events_rerender() {
  const c = document.getElementById('content');
  if (c) c.replaceChildren(eventsPanel());
}
function events_select(id) { events_sel = id; events_rerender(); }

function events_filtered() {
  let rows = events_DATA.filter(e => {
    if (events_filter.stage !== 'all' && e.stage !== events_filter.stage) return false;
    if (events_filter.q && !(e.couple + ' ' + e.surname + ' ' + e.venue + ' ' + e.city + ' ' + e.id)
      .toLowerCase().includes(events_filter.q)) return false;
    return true;
  });
  const k = events_sort.k;
  rows.sort((a, b) => {
    let x = a[k], y = b[k];
    if (k === 'vendors') { x = a.vendors.length; y = b.vendors.length; }
    if (typeof x === 'string') { x = x.toLowerCase(); y = y.toLowerCase(); }
    return (x > y ? 1 : x < y ? -1 : 0) * events_sort.dir;
  });
  return rows;
}

function events_fmtDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m - 1];
  return { d: String(d), m: mon, y: String(y), full: mon + ' ' + d + ', ' + y };
}

function eventsPanel() {
  const p = el('section', 'panel show events-panel');

  /* surfhead — matches guests/budget/seating pattern */
  const total = events_DATA.length;
  const live = events_DATA.filter(e => e.stage === 'live').length;
  const flagged = events_DATA.filter(e => e.flags.length).length;
  p.appendChild(el('div', 'surfhead',
    '<div><h1>Events</h1><p>' + total + ' events across the platform · ' + live + ' live now · ' +
      flagged + ' need attention</p></div>' +
    '<div style="display:flex;gap:8px">' +
      '<button class="btn">Export CSV</button>' +
      '<button class="btn">Lifecycle audit</button>' +
    '</div>'));

  /* status strip — platform-wide stage counts as quick pills */
  const strip = el('div', 'events-strip');
  strip.appendChild(el('span', 'events-spill', '🗂 ' + total + ' total'));
  events_STAGE_ORDER.forEach(s => {
    const n = events_DATA.filter(e => e.stage === s).length;
    if (!n) return;
    const sp = el('span', 'events-spill');
    sp.innerHTML = '<i class="events-dot" style="background:' + events_STAGES[s].dot + '"></i>' +
      events_STAGES[s].label + ' · ' + n;
    strip.appendChild(sp);
  });
  if (flagged) strip.appendChild(el('span', 'events-spill warn', '⚠ ' + flagged + ' flagged'));
  p.appendChild(strip);

  /* three-column body: filter rail | events table | event detail.
     Fills wide screens via the ".events-wrap" grid widening (no stretched single column). */
  const wrap = el('div', 'events-wrap');
  wrap.appendChild(events_rail());
  wrap.appendChild(events_table());
  wrap.appendChild(events_detail());
  p.appendChild(wrap);
  return p;
}

/* ---- LEFT rail: search + stage filter + at-a-glance ---- */
function events_rail() {
  const r = el('div', 'frail');
  const s = el('input', 'fsearch');
  s.placeholder = 'Search couple, venue, ID…';
  s.value = events_filter.q;
  s.oninput = () => { events_filter.q = s.value.toLowerCase(); events_rerender(); };
  r.appendChild(s);

  r.appendChild(el('h4', null, 'Lifecycle stage'));
  const chips = el('div', 'fchips');
  const opts = [['all', 'All']].concat(events_STAGE_ORDER.map(s => [s, events_STAGES[s].label]));
  opts.forEach(([val, lbl]) => {
    const c = el('button', 'fchip' + (events_filter.stage === val ? ' on' : ''), lbl);
    c.onclick = () => { events_filter.stage = val; events_rerender(); };
    chips.appendChild(c);
  });
  r.appendChild(chips);

  r.appendChild(el('h4', null, 'At a glance'));
  const committed = events_DATA.reduce((a, e) => a + e.committed, 0);
  const paid = events_DATA.reduce((a, e) => a + e.paid, 0);
  const concierge = events_DATA.filter(e => e.concierge).length;
  [
    ['Total events', events_DATA.length],
    ['Concierge active', concierge],
    ['Committed', peso(committed)],
    ['Collected', peso(paid)],
    ['Showing', events_filtered().length],
  ].forEach(([k, v]) => r.appendChild(el('div', 'fstat', '<span>' + k + '</span><b>' + v + '</b>')));

  r.appendChild(el('div', 'events-railnote',
    'Lifecycle auto-advances per 0031 (coming soon → live → archive). Admin override is logged + reversible.'));
  return r;
}

/* ---- CENTER: events directory table ---- */
function events_table() {
  const box = el('div', 'gtable');
  const cols = [['couple', 'Event'], ['date', 'Date'], ['stage', 'Stage'], ['vendors', 'Vendors'], ['committed', 'Committed']];
  const tbl = el('table');
  const thead = el('thead');
  const tr = el('tr');
  cols.forEach(([k, lbl]) => {
    const th = el('th', null, lbl + (events_sort.k === k ? ' <span class="ar">' + (events_sort.dir > 0 ? '▲' : '▼') + '</span>' : ''));
    th.onclick = () => {
      if (events_sort.k === k) events_sort.dir *= -1; else { events_sort.k = k; events_sort.dir = 1; }
      events_rerender();
    };
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  tbl.appendChild(thead);

  const tb = el('tbody');
  events_filtered().forEach(e => {
    const row = el('tr', events_sel === e.id ? 'sel' : '');
    row.onclick = () => events_select(e.id);
    const st = events_STAGES[e.stage];
    const dt = events_fmtDate(e.date);
    const bal = e.committed - e.paid;
    row.innerHTML =
      '<td><div class="gname">' +
        '<span class="events-mono">' + e.surname.slice(0, 2).toUpperCase() + '</span>' +
        '<span class="gn-meta"><b>' + e.couple + (e.flags.length ? ' <span class="events-flag">⚠</span>' : '') +
          '</b><small>' + e.venue + ' · ' + e.city + '</small></span></div></td>' +
      '<td><div class="events-date"><b>' + dt.m + ' ' + dt.d + '</b><small>' + dt.y + '</small></div></td>' +
      '<td><span class="pill ' + st.cls + '"><i class="events-dot" style="background:' + st.dot + '"></i>' + st.label + '</span></td>' +
      '<td class="tabletag">' + e.vendors.length + (e.concierge ? ' <span class="events-cc" title="Concierge">✦</span>' : '') + '</td>' +
      '<td class="events-num"><b>' + peso(e.committed) + '</b>' +
        (bal > 0 ? '<small>' + peso(bal) + ' due</small>' : '<small class="events-clear">fully paid</small>') + '</td>';
    tb.appendChild(row);
  });
  if (!tb.children.length) {
    tb.appendChild(el('tr', null, '<td colspan="5" style="text-align:center;color:var(--ink-faint);padding:34px">No events match these filters.</td>'));
  }
  tbl.appendChild(tb);
  box.appendChild(tbl);
  return box;
}

/* ---- RIGHT: selected-event detail (lifecycle · vendors · orders) + admin actions ---- */
function events_detail() {
  const d = el('div', 'gdetail events-detail');
  const e = events_DATA.find(x => x.id === events_sel);
  if (!e) {
    d.appendChild(el('div', 'gd-empty',
      '<div class="bi">🗂</div><div>Select an event to see its lifecycle, booked vendors, and in-app orders — plus admin actions — side by side.</div>'));
    return d;
  }
  const st = events_STAGES[e.stage];
  const dt = events_fmtDate(e.date);

  /* hero */
  const hero = el('div', 'gd-hero');
  hero.innerHTML =
    '<div class="gd-ini events-hero-mono">' + e.surname.slice(0, 2).toUpperCase() + '</div>' +
    '<div class="gd-name">' + e.couple + '</div>' +
    '<div class="gd-sub">' + e.type + ' · ' + e.venue + ' · ' + e.city + '</div>' +
    '<div class="events-id">' + e.id + '</div>';
  d.appendChild(hero);

  const b = el('div', 'gd-b');

  /* key facts */
  [
    ['Date', dt.full],
    ['Stage', '<span class="pill ' + st.cls + '" style="vertical-align:-2px"><i class="events-dot" style="background:' + st.dot + '"></i>' + st.label + '</span>'],
    ['Guests', e.confirmed + ' confirmed · ' + e.guests + ' invited'],
    ['Concierge', e.concierge ? '<span style="color:var(--gold);font-weight:700">✦ Active</span>' : 'DIY (free)'],
    ['Owner', e.owner],
    ['Committed', peso(e.committed) + ' · ' + peso(e.paid) + ' collected'],
  ].forEach(([k, v]) => b.appendChild(el('div', 'gd-row', '<span class="k">' + k + '</span><span>' + v + '</span>')));

  /* attention flags */
  if (e.flags.length) {
    e.flags.forEach(f => {
      const tag = f.k === 'force_majeure' ? 'Force majeure' : 'Abuse review';
      b.appendChild(el('div', 'events-alert',
        '<b>⚠ ' + tag + '</b><span>' + f.t + '</span>'));
    });
  }

  /* lifecycle timeline — the 5 modes with the current one marked */
  b.appendChild(el('div', 'events-sect', 'Lifecycle'));
  const tl = el('div', 'events-life');
  const curIdx = events_STAGE_ORDER.indexOf(e.stage);
  events_STAGE_ORDER.forEach((s, i) => {
    const reached = e.stage !== 'force_ended' && i <= curIdx;
    const isCur = s === e.stage;
    const node = el('div', 'events-lifenode' + (reached ? ' reached' : '') + (isCur ? ' cur' : ''));
    node.innerHTML = '<i class="events-lifedot"></i><span>' + events_STAGES[s].label + '</span>';
    tl.appendChild(node);
  });
  b.appendChild(tl);
  if (e.stage === 'force_ended') {
    b.appendChild(el('div', 'events-alert', '<b>⚠ Force-ended</b><span>Admin terminated this event’s live window.</span>'));
  }

  /* booked vendors */
  b.appendChild(el('div', 'events-sect', 'Booked vendors · ' + e.vendors.length));
  const vlist = el('div', 'events-vlist');
  e.vendors.forEach(v => {
    const stCls = v.status === 'paid' ? 'yes' : v.status === 'partial' ? 'pending' : 'no';
    const stLbl = v.status === 'paid' ? 'Paid' : v.status === 'partial' ? 'Partial' : 'Unpaid';
    const row = el('div', 'events-vrow');
    row.innerHTML =
      '<span class="events-vico">' + v.ico + '</span>' +
      '<div class="events-vmeta"><b>' + v.n + (v.sn ? ' <span style="color:var(--gold)">✦</span>' : '') +
        '</b><small>' + v.cat + '</small></div>' +
      '<div class="events-vamt">' + peso(v.amt) + '<span class="pill ' + stCls + '">' + stLbl + '</span></div>';
    vlist.appendChild(row);
  });
  b.appendChild(vlist);

  /* in-app orders */
  b.appendChild(el('div', 'events-sect', 'In-app orders · ' + e.orders.length));
  if (e.orders.length) {
    const olist = el('div', 'events-olist');
    e.orders.forEach(o => {
      const paid = o.status === 'paid';
      const row = el('div', 'events-orow');
      row.innerHTML =
        '<div class="events-ometa"><b>' + o.sku + '</b><code>' + o.ref + '</code></div>' +
        '<div class="events-oamt">' + peso(o.amt) +
          '<span class="pill ' + (paid ? 'yes' : 'pending') + '">' + (paid ? 'Paid' : 'Pending') + '</span></div>';
      olist.appendChild(row);
    });
    b.appendChild(olist);
  } else {
    b.appendChild(el('div', 'events-empty-mini', 'No in-app purchases on this event yet.'));
  }

  /* admin actions */
  b.appendChild(el('div', 'events-sect', 'Admin actions'));
  const actNote = el('div', 'events-actnote',
    'Lifecycle override supersedes the auto-advance default and is logged to the audit trail.');
  b.appendChild(actNote);

  const ovRow = el('div', 'gd-row');
  ovRow.innerHTML = '<span class="k">Override stage</span>';
  const seg = el('div', 'events-stageseg');
  events_STAGE_ORDER.forEach(s => {
    const btn = el('button', e.stage === s ? 'on' : '', events_STAGES[s].label);
    btn.onclick = () => { e.stage = s; events_rerender(); };
    seg.appendChild(btn);
  });
  ovRow.appendChild(seg);
  b.appendChild(ovRow);

  const acts = el('div', 'events-acts');
  const forceEnd = el('button', 'btn', '◼ Force-end live');
  forceEnd.disabled = e.stage !== 'live';
  if (e.stage !== 'live') forceEnd.style.cssText = 'opacity:.5;cursor:default';
  forceEnd.onclick = () => { if (e.stage === 'live') { e.stage = 'force_ended'; events_rerender(); } };

  const archive = el('button', 'btn', '🗄 Archive');
  archive.onclick = () => { e.stage = 'archive'; events_rerender(); };

  const del = el('button', 'btn events-danger', '🗑 Delete event');

  acts.append(forceEnd, archive, del);
  b.appendChild(acts);
  b.appendChild(el('div', 'events-gate', '🔒 Delete requires two-admin approval (§ 9.1).'));

  d.appendChild(b);
  return d;
}

    ['<span class="serif">'+review+'</span>', 'In review · 48-hr SLA', inReviewBar],
    ['<span class="serif">'+linked+'</span>', 'Events linked to a venue', Math.min(100, linked*5)],

  wrap.appendChild(venues_eventsColEl());   // ultrawide-only 4th column (CSS-hidden < 1700px)

  return p;
}

/* ---- LEFT: filter rail ---- */
function venues_railEl(){
  const r = el('div','frail');

  const s = el('input','fsearch'); s.placeholder='Search name · region · ID…'; s.value = venues_filter.q;
  s.oninput = ()=>{ venues_filter.q = s.value.toLowerCase(); venues_rerender(); };
  r.appendChild(s);

  r.appendChild(el('h4',null,'Region'));
  const regionOpts = [['all','All']].concat(VENUES_REGIONS.map(rg=>[rg,rg]));
  r.appendChild(venues_chipRow(regionOpts,'region'));

  r.appendChild(el('h4',null,'Type'));
  const typeOpts = [['all','All']].concat(Object.keys(VENUES_TYPES).map(k=>[k,VENUES_TYPES[k].label]));
  r.appendChild(venues_chipRow(typeOpts,'type'));

  r.appendChild(el('h4',null,'Status'));
  r.appendChild(venues_chipRow([['all','All'],['active','Active'],['review','In review'],['archived','Archived']],'status'));

  r.appendChild(el('h4',null,'At a glance'));
  const byRegion = {};
  venues_data.forEach(v=>{ byRegion[v.region] = (byRegion[v.region]||0)+1; });
  const topRegions = Object.entries(byRegion).sort((a,b)=>b[1]-a[1]).slice(0,4);

  return r;
}
function venues_chipRow(opts,key){
  const row = el('div','fchips');
  opts.forEach(([val,lbl])=>{

    c.onclick = ()=>{ venues_filter[key]=val; venues_rerender(); };
    row.appendChild(c);
  });
  return row;
}

/* ---- CENTER: sortable table ---- */

/* The shared form body — drives both the edit (existing v) and create (draft) flows.
   `isNew` toggles the footer CTA + which status controls show. */
function venues_formBody(v, isNew){
  const b = el('div','gd-b');

  // status segmented control (edit mode only — a new venue is forced to "review")
  if(!isNew){
    const sRow = el('div','gd-row'); sRow.innerHTML = '<span class="k">Status</span>';
    const seg = el('div','gd-seg');
    [['active','Active'],['review','Review'],['archived','Archived']].forEach(([val,lbl])=>{
      const btn = el('button', v.status===val ? 'on':'', lbl);
      btn.onclick = ()=>{ v.status = val; venues_rerender(); };
      seg.appendChild(btn);
    });
    sRow.appendChild(seg); b.appendChild(sRow);
  }

  // editable name
  b.appendChild(venues_fieldText('Venue name', v, 'n', 'e.g. Hillcreek Gardens'));

  // region select (segmented-style chip list inside a field)
  const rRow = el('div','venues-field');
  rRow.appendChild(el('label','venues-flabel','Region'));
  const rSel = el('div','venues-selrow');
  VENUES_REGIONS.forEach(rg=>{
    const c = el('button','venues-selchip'+(v.region===rg?' on':''),rg);
    c.onclick = ()=>{ v.region = rg; venues_rerender(); };
    rSel.appendChild(c);
  });
  rRow.appendChild(rSel); b.appendChild(rRow);

  // type select
  const tRow = el('div','venues-field');
  tRow.appendChild(el('label','venues-flabel','Type'));
  const tSel = el('div','venues-selrow');
  Object.keys(VENUES_TYPES).forEach(k=>{
    const ty = VENUES_TYPES[k];
    const c = el('button','venues-selchip'+(v.type===k?' on':''), ty.ico+' '+ty.label);
    c.onclick = ()=>{ v.type = k; venues_rerender(); };
    tSel.appendChild(c);
  });
  tRow.appendChild(tSel); b.appendChild(tRow);

  // capacity stepper
  const capRow = el('div','gd-row'); capRow.innerHTML = '<span class="k">Capacity</span>';
  const capSeg = el('div','gd-seg');
  const minus = el('button',null,'–');
  const lbl   = el('span',null, v.cap.toLocaleString('en-PH')+' pax');
  lbl.style.cssText = 'font-size:12.5px;font-weight:600;align-self:center;min-width:78px;text-align:center;font-variant-numeric:tabular-nums';
  const plus  = el('button',null,'+');
  minus.onclick = ()=>{ v.cap = Math.max(20, v.cap-10); venues_rerender(); };
  plus.onclick  = ()=>{ v.cap = Math.min(2000, v.cap+10); venues_rerender(); };
  capSeg.append(minus, lbl, plus); capRow.appendChild(capSeg); b.appendChild(capRow);

  // address + contact text fields
  b.appendChild(venues_fieldText('Address', v, 'addr', 'Barangay, City / Municipality, Province'));
  b.appendChild(venues_fieldText('Contact person', v, 'contact', 'On-site coordinator'));

  const twoCol = el('div','venues-2col');
  twoCol.appendChild(venues_fieldText('Phone', v, 'phone', '0917 …'));
  twoCol.appendChild(venues_fieldText('Email', v, 'email', 'events@venue.ph'));
  b.appendChild(twoCol);

  // indicative rate (PHP, charm-priced display via peso())
  const rateRow = el('div','venues-field');
  rateRow.appendChild(el('label','venues-flabel','Indicative venue rate (PHP)'));
  const rateInput = el('input','venues-input');
  rateInput.type='text'; rateInput.value = v.rate ? peso(v.rate) : '—'; rateInput.placeholder='₱0';
  rateInput.oninput = ()=>{ const num = parseInt(rateInput.value.replace(/[^0-9]/g,''),10); v.rate = isNaN(num)?0:num; };
  rateRow.appendChild(rateInput);
  rateRow.appendChild(el('div','venues-fhint', v.rate ? ('Shown to couples as '+peso(v.rate)+' · ceremony/reception fee, excludes catering') : 'Leave blank for ceremony-only / no-fee venues'));
  b.appendChild(rateRow);

  // notes textarea
  const nRow = el('div','venues-field');
  nRow.appendChild(el('label','venues-flabel','Admin notes'));
  const ta = el('textarea','venues-input venues-textarea');
  ta.value = v.notes || ''; ta.placeholder='Verification notes · generator · WiFi for Panood · parking · catering policy…';
  ta.oninput = ()=>{ v.notes = ta.value; };
  nRow.appendChild(ta); b.appendChild(nRow);

  // read-only meta on existing records
  if(!isNew){
    b.appendChild(el('div','gd-row','<span class="k">Linked events</span><span>'+(v.events||0)+'</span>'));
    b.appendChild(el('div','gd-row','<span class="k">In directory since</span><span>'+v.since+'</span>'));
    b.appendChild(el('div','gd-row','<span class="k">Venue ID</span><span class="venues-mono">'+v.id+'</span>'));
  }

  // footer actions
  const foot = el('div','venues-foot');
  if(isNew){
    const cancel = el('button','btn','Cancel');
    cancel.onclick = ()=>{ venues_creating=false; venues_draft=null; venues_rerender(); };
    const save = el('button','btn primary','Add to directory');
    save.onclick = ()=>{
      const draft = venues_draft;
      const newId = 'S89V-' + venues_makeRef();
      venues_data.push({ id:newId, n:draft.n||'Untitled venue', region:draft.region, type:draft.type, cap:draft.cap, addr:draft.addr, contact:draft.contact, phone:draft.phone, email:draft.email, status:'review', events:0, since:'2026-06-03', rate:draft.rate||0, notes:draft.notes });
      venues_creating=false; venues_draft=null; venues_sel=newId;
      venues_rerender();
    };
    foot.append(cancel, save);
  } else {
    const archive = el('button','btn', v.status==='archived' ? 'Restore' : 'Archive');
    archive.onclick = ()=>{ v.status = v.status==='archived' ? 'active' : 'archived'; venues_rerender(); };
    const saved = el('button','btn primary','Save changes');
    saved.onclick = ()=>{ saved.textContent='Saved ✓'; saved.classList.add('venues-saved'); };
    foot.append(archive, saved);
  }
  b.appendChild(foot);
  return b;
}

/* a labelled text field bound to obj[key] */
function venues_fieldText(label, obj, key, placeholder){
  const f = el('div','venues-field');
  f.appendChild(el('label','venues-flabel',label));
  const i = el('input','venues-input');
  i.type='text'; i.value = obj[key]||''; i.placeholder = placeholder||'';
  i.oninput = ()=>{ obj[key] = i.value; };
  f.appendChild(i);
  return f;
}

/* deterministic-at-call-time 8-char Crockford ref. Not invoked at top level, so no RNG runs on load. */
function venues_makeRef(){
  const A='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  let s='';
  for(let i=0;i<4;i++) s += A[Math.floor(Math.random()*A.length)];
  return s;
}

const pricing_recLabel   = v => (PRICING_REC_OPTS.find(o=>o[0]===v)||['','—'])[1];
const pricing_scopeLabel = v => (PRICING_SCOPE_OPTS.find(o=>o[0]===v)||['','—'])[1];

function pricing_rerender(){
  const c = document.getElementById('content');
  if (c) c.replaceChildren(pricingPanel());
}
/* refresh the table body + the "Showing" stat without losing the open drawer / focus */
function pricing_refreshTable(){
  const tb = document.getElementById('pricing-body');
  if (tb) pricing_fillBody(tb);
  const stat = document.querySelector('.frail .pricing-showing b');
  if (stat) stat.textContent = pricing_filtered().length;
}
function pricing_select(id){
  pricing_sel = id;
  pricing_draft = Object.assign({}, PRICING_SKUS[id]);   // fresh editable copy
  pricing_rerender();
}

function pricing_filtered(){
  let rows = PRICING_SKUS.filter(s=>{
    if (pricing_filter.cat   !== 'all' && s.cat !== pricing_filter.cat) return false;
    if (pricing_filter.rec   !== 'all' && s.rec !== pricing_filter.rec) return false;
    if (pricing_filter.status === 'active'   && !s.active) return false;
    if (pricing_filter.status === 'inactive' &&  s.active) return false;
    if (pricing_filter.q && !(s.name+' '+s.code).toLowerCase().includes(pricing_filter.q)) return false;
    return true;
  });
  const k = pricing_sort.k;
  rows.sort((a,b)=>{
    let x=a[k], y=b[k];
    if (typeof x==='string'){x=x.toLowerCase(); y=y.toLowerCase();}
    return (x>y?1:x<y?-1:0)*pricing_sort.dir;
  });
  return rows;
}

function pricing_selectRow(label,key,opts,dr){
  const row = el('div','gd-row'); row.innerHTML='<span class="k">'+label+'</span>';

  row.appendChild(sel); return row;
}
function pricing_toggleRow(label,key,dr){
  const row = el('div','gd-row'); row.innerHTML='<span class="k">'+label+'</span>';
  const tog = el('button','pricing-toggle'+(dr[key]?' on':''));
  tog.innerHTML='<span class="pricing-knob"></span>';
  tog.onclick = ()=>{ dr[key]=!dr[key]; tog.classList.toggle('on',dr[key]); };
  row.appendChild(tog); return row;
}

/* compute the gate state: price delta >₱500 OR any recurrence/scope change */
function pricing_gateState(orig,dr){
  const delta = Math.abs((dr.price||0)-orig.price);
  const priceGate = delta>500;
  const recChange = dr.rec!==orig.rec;
  const scopeChange = dr.scope!==orig.scope;
  const freqGate = recChange||scopeChange;
  return {delta,priceGate,recChange,scopeChange,freqGate,gated:priceGate||freqGate};
}
function pricing_gateNote(orig,dr){
  const wrap = el('div','pricing-gate'); wrap.id='pricing-gate';
  wrap.innerHTML = pricing_gateInner(orig,dr);
  return wrap;
}
function pricing_gateInner(orig,dr){
  const g = pricing_gateState(orig,dr);
  if (!g.gated){
    return '<div class="pricing-gate-card ok">'+
      '<span class="pricing-gate-ico">✓</span>'+
      '<div><b>Single-admin change</b><div class="pricing-gate-s">Within thresholds — saves directly after the 24-hour rollback window.</div></div></div>';
  }
  const reasons = [];
  if (g.priceGate) reasons.push('Price change of <b>'+peso(g.delta)+'</b> exceeds the <b>₱500</b> threshold.');
  if (g.recChange) reasons.push('Recurrence: <b>'+pricing_recLabel(orig.rec)+'</b> → <b>'+pricing_recLabel(dr.rec)+'</b>.');
  if (g.scopeChange) reasons.push('Scope: <b>'+pricing_scopeLabel(orig.scope)+'</b> → <b>'+pricing_scopeLabel(dr.scope)+'</b>.');
  return '<div class="pricing-gate-card warn">'+
    '<span class="pricing-gate-ico">⚖</span>'+
    '<div><b>Two-admin approval required</b>'+
      '<ul class="pricing-gate-list"><li>'+reasons.join('</li><li>')+'</li></ul>'+
      '<div class="pricing-gate-s">A second admin must approve per § 9.1. Existing subscriptions keep their old terms until natural expiry.</div>'+
    '</div></div>';
}
/* live-update the gate note + save-button label without full rerender (keeps input focus) */
function pricing_refreshGate(){
  const orig = PRICING_SKUS[pricing_sel]; if(!orig||!pricing_draft) return;
  const node = document.getElementById('pricing-gate');
  if (node) node.innerHTML = pricing_gateInner(orig,pricing_draft);
  const btn = document.getElementById('pricing-savebtn');
  if (btn) btn.textContent = pricing_gateState(orig,pricing_draft).gated ? 'Request two-admin approval' : 'Save · 24-hr delay';
  // keep hero mark in sync with the price field
  const mark = document.querySelector('.pricing-drawer .pricing-dmark');
  if (mark) mark.textContent = peso(pricing_draft.price||0);
}

/* derived status: active+window+remaining → status keyword */
const discountcodes_TODAY = '2026-06-03';
function discountcodes_status(r){
  if(!r.active) return r.expires < discountcodes_TODAY ? 'expired' : 'paused';
  if(r.starts > discountcodes_TODAY) return 'scheduled';
  if(r.expires < discountcodes_TODAY) return 'expired';
  if(r.max>0 && r.used>=r.max) return 'exhausted';
  return 'live';
}
const discountcodes_STATUSMETA = {
  live:      { lbl:'Live',      cls:'yes' },
  scheduled: { lbl:'Scheduled', cls:'pending' },
  paused:    { lbl:'Paused',    cls:'pending' },
  exhausted: { lbl:'Exhausted', cls:'no' },
  expired:   { lbl:'Expired',   cls:'no' },
};
function discountcodes_valueText(r){ return r.type==='pct' ? r.value+'% off' : peso(r.value)+' off'; }
function discountcodes_limitText(r){ return r.max>0 ? (r.used+' / '+r.max) : (r.used+' / ∞'); }
function discountcodes_dateText(d){
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p=d.split('-'); return M[+p[1]-1]+' '+(+p[2])+', '+p[0];
}

/* ---- view state ---- */
let discountcodes_sel = 0;                                  // selected row id (LAUNCH50)
let discountcodes_filter = { status:'all', type:'all', q:'' };
let discountcodes_sort = { k:'used', dir:-1 };              // default: most-redeemed first

function discountcodes_rerender(){
  const c = document.getElementById('content');
  if (c) c.replaceChildren(discountcodesPanel());
}
function discountcodes_select(id){ discountcodes_sel = id; discountcodes_rerender(); }

function discountcodes_filtered(){
  let rows = discountcodes_ROWS.filter(r=>{
    if(discountcodes_filter.status!=='all' && discountcodes_status(r)!==discountcodes_filter.status) return false;
    if(discountcodes_filter.type!=='all' && r.type!==discountcodes_filter.type) return false;
    if(discountcodes_filter.q && !(r.code+' '+r.sku+' '+r.ref).toLowerCase().includes(discountcodes_filter.q)) return false;
    return true;
  });
  const k = discountcodes_sort.k, dir = discountcodes_sort.dir;
  rows.sort((a,b)=>{
    let x,y;
    if(k==='value'){ x=a.value; y=b.value; }
    else if(k==='status'){ x=discountcodes_status(a); y=discountcodes_status(b); }
    else { x=a[k]; y=b[k]; }
    if(typeof x==='string'){ x=x.toLowerCase(); y=y.toLowerCase(); }
    return (x>y?1:x<y?-1:0)*dir;
  });
  return rows;
}

  const wrap = el('div','discountcodes-wrap');
  wrap.appendChild(discountcodes_rail());
  wrap.appendChild(discountcodes_table());
  wrap.appendChild(discountcodes_detail());
  p.appendChild(wrap);
  return p;
}

/* ---- left filter rail ---- */
function discountcodes_rail(){
  const r = el('div','frail');
  const s = el('input','fsearch'); s.placeholder='Search code, SKU, ref…'; s.value=discountcodes_filter.q;
  s.oninput = ()=>{ discountcodes_filter.q = s.value.toLowerCase(); discountcodes_rerender(); };
  r.appendChild(s);

  r.appendChild(el('h4',null,'Status'));
  r.appendChild(discountcodes_chipRow([
    ['all','All'],['live','Live'],['scheduled','Scheduled'],['paused','Paused'],['exhausted','Exhausted'],['expired','Expired']
  ],'status'));

  r.appendChild(el('h4',null,'Discount type'));
  r.appendChild(discountcodes_chipRow([['all','All'],['pct','Percent'],['flat','Flat ₱']],'type'));

  r.appendChild(el('h4',null,'At a glance'));
  const liveN = discountcodes_ROWS.filter(x=>discountcodes_status(x)==='live').length;
  const exhausted = discountcodes_ROWS.filter(x=>discountcodes_status(x)==='exhausted').length;
  const redeemed = discountcodes_ROWS.reduce((a,x)=>a+x.used,0);
  [
    ['Total codes', discountcodes_ROWS.length],
    ['Live', liveN],
    ['Exhausted', exhausted],
    ['Redemptions', redeemed.toLocaleString('en-PH')],
    ['Showing', discountcodes_filtered().length],
  ].forEach(([k,v])=>r.appendChild(el('div','fstat','<span>'+k+'</span><b>'+v+'</b>')));

  // help note (admin context — house pattern: dashed top rule + soft tip)
  r.appendChild(el('div','discountcodes-note',
    'A code stops applying when it hits its <b>use limit</b> or passes its <b>expiry</b> — whichever comes first. ∞ = unlimited uses.'));
  return r;
}
function discountcodes_chipRow(opts,key){
  const row = el('div','fchips');
  opts.forEach(([val,lbl])=>{
    const c = el('button','fchip'+(discountcodes_filter[key]===val?' on':''),lbl);
    c.onclick = ()=>{ discountcodes_filter[key]=val; discountcodes_rerender(); };
    row.appendChild(c);
  });
  return row;
}

/* ---- center table ---- */
function discountcodes_table(){
  const box = el('div','gtable');
  const cols = [
    ['code','Code'],['type','Type'],['value','Value'],['sku','Applies to'],
    ['used','Redemptions'],['expires','Expires'],['status','Status']
  ];
  const tbl = el('table');
  const thead = el('thead'); const tr = el('tr');
  cols.forEach(([k,lbl])=>{
    const th = el('th',null,lbl+(discountcodes_sort.k===k?' <span class="ar">'+(discountcodes_sort.dir>0?'▲':'▼')+'</span>':''));
    th.onclick = ()=>{ if(discountcodes_sort.k===k) discountcodes_sort.dir*=-1; else { discountcodes_sort.k=k; discountcodes_sort.dir=1; } discountcodes_rerender(); };
    tr.appendChild(th);
  });
  thead.appendChild(tr); tbl.appendChild(thead);

  const tb = el('tbody');
  const rows = discountcodes_filtered();
  rows.forEach(r=>{
    const st = discountcodes_status(r);
    const meta = discountcodes_STATUSMETA[st];
    const trr = el('tr', discountcodes_sel===r.id?'sel':'');
    trr.onclick = ()=>discountcodes_select(r.id);
    const pct = r.max>0 ? Math.min(100,Math.round(r.used/r.max*100)) : 0;
    const barCol = r.max>0 && r.used>=r.max ? 'var(--rose)' : 'var(--gold)';
    trr.innerHTML =
      '<td><span class="discountcodes-code">'+r.code+'</span></td>'+
      '<td><span class="discountcodes-type '+(r.type==='pct'?'pct':'flat')+'">'+(r.type==='pct'?'%':'₱')+'</span></td>'+
      '<td><b style="font-variant-numeric:tabular-nums">'+discountcodes_valueText(r)+'</b></td>'+
      '<td><span class="discountcodes-applies">'+r.sku+'</span></td>'+
      '<td class="tabletag"><div class="discountcodes-redeem">'+
        '<span class="discountcodes-redeem-n">'+discountcodes_limitText(r)+'</span>'+
        (r.max>0
          ? '<span class="discountcodes-redeem-bar"><i style="width:'+pct+'%;background:'+barCol+'"></i></span>'
          : '<span class="discountcodes-redeem-inf">unlimited</span>')+
      '</div></td>'+
      '<td class="tabletag">'+discountcodes_dateText(r.expires)+'</td>'+
      '<td><span class="pill '+meta.cls+'">'+meta.lbl+'</span></td>';
    tb.appendChild(trr);
  });
  if(!rows.length){
    tb.appendChild(el('tr',null,'<td colspan="7" style="text-align:center;color:var(--ink-faint);padding:34px">No codes match these filters.</td>'));
  }
  tbl.appendChild(tb); box.appendChild(tbl);
  return box;
}

/* ---- right detail pane ---- */
function discountcodes_detail(){
  const d = el('div','gdetail');

  // empty state
  const visible = discountcodes_filtered();
  const selRow = discountcodes_ROWS[discountcodes_sel];
  const selVisible = selRow && visible.some(r=>r.id===selRow.id);
  if(!selRow || !selVisible){
    d.appendChild(el('div','gd-empty',
      '<div class="bi">🎟️</div><div>Select a code to review its discount, redemption progress and audit trail — then pause, edit, or end it here.</div>'));
    return d;
  }

  const r = selRow;
  const st = discountcodes_status(r);
  const meta = discountcodes_STATUSMETA[st];

  // hero
  const hero = el('div','gd-hero');
  hero.innerHTML =
    '<div class="discountcodes-d-code">'+r.code+'</div>'+
    '<div class="gd-sub"><span class="discountcodes-bigval">'+discountcodes_valueText(r)+'</span> · '+r.sku+'</div>'+
    '<div style="margin-top:9px"><span class="pill '+meta.cls+'">'+meta.lbl+'</span></div>';
  d.appendChild(hero);

  const b = el('div','gd-b');

  // redemption progress block
  const pct = r.max>0 ? Math.min(100,Math.round(r.used/r.max*100)) : 0;
  const prog = el('div','discountcodes-prog');
  if(r.max>0){
    const barCol = r.used>=r.max ? 'var(--rose)' : 'var(--gold)';
    prog.innerHTML =
      '<div class="discountcodes-prog-top"><span>'+r.used.toLocaleString('en-PH')+' redeemed</span>'+
        '<b>'+Math.max(0,r.max-r.used).toLocaleString('en-PH')+' left</b></div>'+
      '<div class="discountcodes-prog-bar"><i style="width:'+pct+'%;background:'+barCol+'"></i></div>'+
      '<div class="discountcodes-prog-cap">'+pct+'% of '+r.max.toLocaleString('en-PH')+'-use limit</div>';
  } else {
    prog.innerHTML =
      '<div class="discountcodes-prog-top"><span>'+r.used.toLocaleString('en-PH')+' redeemed</span><b>∞ unlimited</b></div>'+
      '<div class="discountcodes-prog-bar"><i style="width:100%;background:var(--gold)"></i></div>'+
      '<div class="discountcodes-prog-cap">No use limit set</div>';
  }
  b.appendChild(prog);

  // config readout rows
  [
    ['Discount', discountcodes_valueText(r)],
    ['Applies to', r.sku+' ('+r.skuShort+')'],
    ['Use limit', r.max>0 ? r.max.toLocaleString('en-PH')+' redemptions' : 'Unlimited'],
    ['Starts', discountcodes_dateText(r.starts)],
    ['Expires', discountcodes_dateText(r.expires)],
    ['Reference', r.ref],
    ['Created by', r.by],
  ].forEach(([k,v])=>{
    b.appendChild(el('div','gd-row','<span class="k">'+k+'</span><span style="font-weight:600">'+v+'</span>'));
  });

  // audit trail (admin-actions-logged-everywhere per § 2)
  b.appendChild(el('h4','discountcodes-d-h','Audit trail'));
  const audit = el('div','discountcodes-audit');
  const deactivated = !r.active;
  const feed = [
    ['🎟️','Code created by <b>'+r.by+'</b>', discountcodes_dateText(r.starts)],
    (r.used>0 ? ['✅','First redemption · <b>Aira &amp; Boy</b>', discountcodes_dateText(r.starts)] : null),
    (deactivated ? ['⏸','Deactivated by <b>'+r.by+'</b>', discountcodes_dateText(r.expires)] : null),
    (st==='exhausted' ? ['🔴','Use limit reached — code stopped applying', discountcodes_dateText(r.expires)] : null),
  ].filter(Boolean);
  feed.forEach(([i,t,when])=>audit.appendChild(el('div','discountcodes-aud',
    '<span class="discountcodes-aud-ico">'+i+'</span><div class="discountcodes-aud-b">'+t+'<div class="discountcodes-aud-t">'+when+'</div></div>')));
  b.appendChild(audit);

  // actions
  const act = el('div','discountcodes-dact');
  if(r.active){
    const pause = el('button','btn','Pause');
    pause.onclick = ()=>{ r.active=false; discountcodes_rerender(); };
    const edit = el('button','btn','Edit');
    const end = el('button','btn primary','End now');
    end.onclick = ()=>{ r.active=false; r.expires=discountcodes_TODAY; discountcodes_rerender(); };
    act.append(edit,pause,end);
  } else {
    const reactivate = el('button','btn primary','Reactivate');
    reactivate.onclick = ()=>{ r.active=true; if(r.expires<discountcodes_TODAY) r.expires='2026-12-31'; discountcodes_rerender(); };
    const edit = el('button','btn','Edit');
    act.append(edit,reactivate);
  }
  b.appendChild(act);

  d.appendChild(b);
  return d;
}

/* ---- helpers ---- */
function addons_rerender(){ document.getElementById('content').replaceChildren(addonsPanel()); }
function addons_items(){ return addons_tab==='customer' ? addons_customer : addons_vendor; }
function addons_get(k){ return addons_items().find(x=>x.key===k) || addons_items()[0]; }
function addons_filtered(){
  const q = addons_q.trim().toLowerCase();
  let rows = addons_items();
  if(q) rows = rows.filter(a=>(a.name+' '+a.sku).toLowerCase().includes(q));
  return rows;
}
function addons_recLabel(r){ return r.charAt(0).toUpperCase()+r.slice(1); }
function addons_healthMeta(h){
  if(h==='g') return {cls:'g', dot:'🟢', label:'Healthy'};
  if(h==='y') return {cls:'y', dot:'🟡', label:'Watch'};
  if(h==='r') return {cls:'r', dot:'🔴', label:'At risk'};
  return null;
}
/* eligibility dot — reuses palette accents, never new colors */
function addons_dot(state, tip){
  const cls = state==='on' ? 'on' : state==='soon' ? 'soon' : 'off';
  const glyph = state==='on' ? '🟢' : state==='soon' ? '⚫' : '⚫';
  return '<span class="addons-dot '+cls+'" title="'+tip+'">'+glyph+'</span>';
}
function addons_typeLabel(t){ return t==='couple' ? 'Couple' : t==='cert' ? 'Certified vendor' : 'Vendor'; }

/* ============================================================ panel ============================================================ */
function addonsPanel(){
  const p = el('section','panel show');
  const cust = addons_customer, vend = addons_vendor;
  const liveCount = cust.filter(a=>!a.admin).length + vend.length;
  const adminCount = cust.filter(a=>a.admin).length;
  const lifeRev = cust.concat(vend).reduce((s,a)=>s+a.rev.lifetime,0);
  const totalBuys = cust.concat(vend).reduce((s,a)=>s+a.buys,0);
  const watch = cust.concat(vend).filter(a=>a.health==='y'||a.health==='r').length;

  /* ---- surface header ---- */
  p.appendChild(el('div','surfhead',
    '<div><h1>Add-ons</h1><p>'+(liveCount+adminCount)+' configurable SKUs · '+
      cust.length+' customer · '+vend.length+' vendor · reads <code>service_catalog</code> + <code>feature_policy</code></p></div>'+
    '<div style="display:flex;gap:8px">'+
      '<button class="btn">Open § 3.5 catalog grid</button>'+
      '<button class="btn primary">Generate Pricing Report</button></div>'));

  /* ---- statstrip (shared .statstrip/.stat) ---- */
  const stats = el('div','statstrip');
  [[String(liveCount+adminCount),'Active SKUs',100],
   [peso(Math.round(lifeRev/100)),'Lifetime revenue',88],
   [totalBuys.toLocaleString('en-PH'),'Lifetime purchases',76],
   [watch+'<small> SKUs</small>','Cost Watch flags',watch?34:6]]
    .forEach(([v,k,pc])=>stats.appendChild(el('div','stat','<div class="v">'+v+'</div><div class="k">'+k+'</div><div class="bar"><i style="width:'+pc+'%"></i></div>')));
  p.appendChild(stats);

  /* ---- tab + search toolbar ---- */
  const bar = el('div','addons-bar');
  const tabs = el('div','addons-tabs');
  [['customer','Customer Add-ons',cust.length],['vendor','Vendor Add-ons',vend.length]].forEach(([val,lbl,n])=>{
    const b = el('button','addons-tab'+(addons_tab===val?' on':''),lbl+' <span class="addons-tn">'+n+'</span>');
    b.onclick = ()=>{ if(addons_tab!==val){ addons_tab=val; addons_sel=addons_items()[0].key; addons_dtab='elig'; addons_rerender(); } };
    tabs.appendChild(b);
  });
  bar.appendChild(tabs);
  const search = el('div','addons-search');
  search.innerHTML = '<span>🔍</span>';
  const inp = el('input'); inp.placeholder='Search SKU name or code…'; inp.value=addons_q;
  inp.oninput = ()=>{ addons_q=inp.value; addons_refreshGrid(); };
  search.appendChild(inp);
  bar.appendChild(search);
  p.appendChild(bar);

  /* ---- main layout: card grid (fills wide) | sticky detail/editor ---- */
  const wrap = el('div','addons-wrap');

  /* === card grid === */
  const gridCol = el('div','addons-gridcol');
  gridCol.id = 'addonsGridCol';
  addons_fillGrid(gridCol);
  wrap.appendChild(gridCol);

  /* === right detail / editor pane === */
  wrap.appendChild(addons_detail());

  p.appendChild(wrap);
  return p;
}

/* rebuild only the grid column on search (keeps detail pane steady) */
function addons_refreshGrid(){ const c=document.getElementById('addonsGridCol'); if(c) addons_fillGrid(c); }

function addons_fillGrid(col){
  col.innerHTML='';
  const rows = addons_filtered();
  const live = rows.filter(a=>!a.admin);
  const admin = rows.filter(a=>a.admin);

  if(!rows.length){
    col.appendChild(el('div','addons-empty','<div class="bi">🔍</div><div>No SKU matches “'+addons_q+'”.</div>'));
    return;
  }

  col.appendChild(addons_cardSet(live));
  if(admin.length){
    const div = el('div','addons-subhead');
    div.innerHTML = '<span class="addons-rule"></span><b>Admin-only · hidden from customer grid</b>'+
      '<small>'+admin.length+' SKUs not shown on the customer surface — kept here for parity</small>';
    col.appendChild(div);
    col.appendChild(addons_cardSet(admin));
  }
}

/* one auto-fit card grid for a set of SKUs */
function addons_cardSet(set){
  const cards = el('div','addons-cards');
  set.forEach(a=>{
    const card = el('div','addons-card'+(addons_sel===a.key?' spot':'')+(a.admin?' admin':''));
    card.onclick = ()=>{ addons_sel=a.key; addons_dtab='elig'; addons_rerender(); };

    const top = el('div','addons-ctop');
    top.innerHTML = '<span class="addons-cico tone-'+a.tone+'">'+a.ico+'</span>'+
      '<div class="addons-ctitle"><b>'+a.name+'</b><small>'+a.sku+'</small></div>';
    const hm = addons_healthMeta(a.health);
    if(hm) top.innerHTML += '<span class="addons-health '+hm.cls+'" title="Cost Watch · '+hm.label+' · ratio '+a.ratio+'">'+hm.dot+'</span>';
    card.appendChild(top);

    /* price + 2D billing chip */
    const price = el('div','addons-cprice');
    price.innerHTML = '<b>'+peso(Math.round(a.price/100))+'</b>'+
      '<span class="addons-bill">'+addons_recLabel(a.rec)+' · '+a.scope+'</span>';
    card.appendChild(price);

    card.appendChild(el('p','addons-cnote',a.note));

    /* eligibility dots */
    const elig = el('div','addons-celig');
    if(a.elig.couples!=null) elig.innerHTML += addons_dot(a.elig.couples,'Couples · '+(a.elig.couples==='on'?'enabled':'disabled'))+'<span>Couples</span>';
    if(a.elig.cert!=null)    elig.innerHTML += addons_dot(a.elig.cert,'Certified vendors · '+(a.elig.cert==='on'?'enabled':a.elig.cert==='soon'?'coming soon':'disabled'))+'<span>Certified</span>';
    if(a.elig.soon!=null)    elig.innerHTML += addons_dot(a.elig.soon,'Vendors · '+(a.elig.soon==='on'?'enabled':a.elig.soon==='soon'?'coming soon':'disabled'))+'<span>Vendors</span>';
    card.appendChild(elig);

    /* footer — lifetime purchases + active subs */
    const foot = el('div','addons-cfoot');
    foot.innerHTML = '<span class="addons-buys"><b>'+a.buys.toLocaleString('en-PH')+'</b> lifetime'+
      (a.subs!=null?' · <b>'+a.subs+'</b> active':'')+'</span>'+
      '<span class="addons-open">Configure →</span>';
    card.appendChild(foot);

    cards.appendChild(card);
  });
  return cards;
}

/* ============================================================ right detail / editor (the § 3.12.2 drawer, inline) ============================================================ */
function addons_detail(){
  const d = el('div','addons-detail');
  const a = addons_get(addons_sel);
  const hm = addons_healthMeta(a.health);

  /* hero */
  const hero = el('div','addons-dhero');
  hero.innerHTML =
    '<div class="addons-dico tone-'+a.tone+'">'+a.ico+'</div>'+
    '<div class="addons-dname">'+a.name+'</div>'+
    '<div class="addons-dsku">'+a.sku+(a.admin?' · <span class="addons-tag">Admin-only</span>':'')+'</div>'+
    '<div class="addons-dprice">'+peso(Math.round(a.price/100))+' <span>'+addons_recLabel(a.rec)+' · '+a.scope+'</span></div>';
  d.appendChild(hero);

  /* drawer tabs */
  const tabs = el('div','addons-dtabs');
  [['elig','Eligibility'],['price','Pricing'],['users','Users'],['stats','Statistics']].forEach(([val,lbl])=>{
    const b = el('button','addons-dtab'+(addons_dtab===val?' on':''),lbl);
    b.onclick = ()=>{ addons_dtab=val; addons_rerender(); };
    tabs.appendChild(b);
  });
  d.appendChild(tabs);

  const body = el('div','addons-dbody');
  if(addons_dtab==='elig')  addons_tabElig(body,a);
  if(addons_dtab==='price') addons_tabPrice(body,a,hm);
  if(addons_dtab==='users') addons_tabUsers(body,a);
  if(addons_dtab==='stats') addons_tabStats(body,a,hm);
  d.appendChild(body);
  return d;
}

/* Tab 1 · Eligibility — per-account-type toggles + per-event override table */
function addons_tabElig(body,a){
  body.appendChild(el('div','addons-dsec','Account-type eligibility'));
  const rows = [
    ['couples','Couples', a.elig.couples],
    ['cert','Certified vendors', a.elig.cert],
    ['soon','Vendors (uncertified)', a.elig.soon],
  ];
  rows.forEach(([k,lbl,state])=>{
    if(state==null){
      body.appendChild(el('div','addons-toggle na','<span class="k">'+lbl+'</span><span class="addons-naflag">N/A</span>'));
      return;
    }
    const r = el('div','addons-toggle');
    const on = state==='on';
    r.innerHTML = '<span class="k">'+lbl+'</span>';
    const sw = el('button','addons-sw'+(on?' on':'')+(state==='soon'?' soon':''));
    sw.innerHTML = '<i></i><em>'+(on?'Enabled':state==='soon'?'Coming soon':'Disabled')+'</em>';
    sw.onclick = ()=>{ a.elig[k] = on ? 'off' : 'on'; addons_rerender(); };
    r.appendChild(sw);
    body.appendChild(r);
    if(!on){
      const br = el('div','addons-blockreason');
      br.innerHTML = '<label>Block reason (shown as disabled-CTA tooltip)</label>';
      const ta = el('textarea'); ta.value = state==='soon' ? 'Coming soon for vendors — launching alongside the certified-vendor rollout.' : 'Not available for this account type.';
      br.appendChild(ta);
      body.appendChild(br);
    }
  });

  body.appendChild(el('div','addons-dsec','Per-event overrides'));
  const ovr = el('div','addons-ovr');
  const ovrRows = a.admin
    ? [['S89E-7K2M4QPX9A','off','Concierge abuse review · trial cycling','Maria Santos','May 30']]
    : a.key==='papic5'
      ? [['S89E-3B9R7TLM2C','on','Contractual comp — launch-partner wedding','Diego Ramos','May 24'],
         ['S89E-1F5N8WJK6D','off','Dispute hold — pending reconciliation','Maria Santos','May 21']]
      : [];
  if(!ovrRows.length){
    ovr.appendChild(el('div','addons-ovr-empty','No per-event overrides. Add one for dispute / abuse-review / contractual exceptions.'));
  } else {
    ovrRows.forEach(([ev,en,reason,by,at])=>{
      const row = el('div','addons-ovr-row');
      row.innerHTML = '<span class="pill '+(en==='on'?'yes':'no')+'">'+(en==='on'?'Enabled':'Disabled')+'</span>'+
        '<div class="addons-ovr-meta"><b>'+ev+'</b><small>'+reason+'</small><small class="addons-ovr-by">'+by+' · '+at+'</small></div>'+
        '<button class="addons-ovr-x" title="Remove override">✕</button>';
      ovr.appendChild(row);
    });
  }
  body.appendChild(ovr);
  const add = el('button','btn','+ Add per-event override'); add.style.cssText='width:100%;margin-top:10px';
  body.appendChild(add);

  body.appendChild(el('div','addons-note','Saving writes a new <code>admin_audit_log</code> row with before / after state per § 2.'));
  const save = el('button','btn primary','Save eligibility'); save.style.cssText='width:100%;margin-top:12px';
  body.appendChild(save);
}

/* Tab 2 · Pricing — read-only summary + edit + price history */
function addons_tabPrice(body,a,hm){
  body.appendChild(el('div','addons-dsec','Current pricing'));
  const kv = el('div','addons-kv');
  [['SKU code',a.sku],
   ['Current price',peso(Math.round(a.price/100))],
   ['Recurrence',addons_recLabel(a.rec)],
   ['Event scope',a.scope],
   ['Effective from',a.eff],
   ['Last edited',a.editor]].forEach(([k,v])=>kv.appendChild(el('div','addons-kvrow','<span class="k">'+k+'</span><b>'+v+'</b>')));
  body.appendChild(kv);

  const editBtn = el('button','btn','Edit price'); editBtn.style.cssText='width:100%;margin:12px 0 4px';
  body.appendChild(editBtn);
  body.appendChild(el('div','addons-note','Delta &gt; ₱500 or any recurrence / scope change routes to the <b>two-admin approval queue</b> (§ 4). Active subscriptions keep the old frequency until natural expiry.'));

  body.appendChild(el('div','addons-dsec','Price history'));
  const tbl = el('div','addons-histtbl');
  const head = el('div','addons-histrow head');
  head.innerHTML = '<span>Prior</span><span>New</span><span>Freq</span><span>Admin · reason</span><span>When</span>';
  tbl.appendChild(head);
  a.hist.forEach(([pp,np,pf,nf,admin,reason,when])=>{
    const r = el('div','addons-histrow');
    r.innerHTML = '<span class="addons-hp">'+pp+'</span><span class="addons-hn">'+np+'</span>'+
      '<span class="addons-hf">'+pf+(pf!==nf?' → '+nf:'')+'</span>'+
      '<span class="addons-hr"><b>'+admin+'</b><small>'+reason+'</small></span>'+
      '<span class="addons-hw">'+when+'</span>';
    tbl.appendChild(r);
  });
  body.appendChild(tbl);
}

/* Tab 3 · Current users — active orders for this SKU */
function addons_tabUsers(body,a){
  const recurring = a.rec!=='one_time';
  body.appendChild(el('div','addons-dsec',(recurring?'Active subscriptions':'Lifetime purchases')+' · '+(recurring?(a.subs||0):a.buys)));

  /* filter chips */
  const chips = el('div','addons-uchips');
  ['All','Couples','Vendors'].forEach((lbl,i)=>chips.appendChild(el('span','addons-uchip'+(i===0?' on':''),lbl)));
  body.appendChild(chips);

  const usearch = el('div','addons-usearch','<span>🔍</span><input placeholder="event_id · user_id · email">');
  body.appendChild(usearch);

  /* sample of accounts — filter the shared pool to types this SKU serves */
  const serves = a.elig.couples==='on' ? ['couple','cert'] : ['cert','vendor'];
  const pool = addons_userpool.filter(u=>serves.includes(u.type)).slice(0, a.admin?3:6);
  const list = el('div','addons-ulist');
  pool.forEach(u=>{
    const row = el('div','addons-urow');
    const sub = recurring
      ? '<span class="pill yes">'+(u.state==='active'?'Active':'Paused')+'</span> · '+(40+u.n.length)+'d left'
      : '<span class="pill '+(u.state==='fulfilled'?'yes':'pending')+'">'+(u.state==='fulfilled'?'Fulfilled':'Paid')+'</span>';
    row.innerHTML = '<span class="addons-uico">'+u.ico+'</span>'+
      '<div class="addons-umeta"><b>'+u.n+'</b><small>'+addons_typeLabel(u.type)+' · '+u.ref+' · '+u.date+'</small></div>'+
      '<div class="addons-ustate">'+sub+'</div>';
    list.appendChild(row);
  });
  body.appendChild(list);
  body.appendChild(el('div','addons-note','Each row opens the account detail page in § 3.4. Recurring SKUs show active subscriptions only; lifetime count tracked separately.'));
}

/* Tab 4 · Statistics — usage + revenue + Cost Watch */
function addons_tabStats(body,a,hm){
  body.appendChild(el('div','addons-dsec','Revenue'));
  const rev = el('div','addons-mini');
  [[peso(Math.round(a.rev.month/100)),'This month'],
   [peso(Math.round(a.rev.qtr/100)),'This quarter'],
   [peso(Math.round(a.rev.lifetime/100)),'Lifetime']]
    .forEach(([v,k])=>rev.appendChild(el('div','addons-mstat','<div class="v">'+v+'</div><div class="k">'+k+'</div>')));
  body.appendChild(rev);

  body.appendChild(el('div','addons-dsec','Usage'));
  const kv = el('div','addons-kv');
  const rows = [
    ['Total purchases (lifetime)', a.buys.toLocaleString('en-PH')],
    a.subs!=null ? ['Active subscriptions', String(a.subs)] : null,
    ['Distinct events', a.events.toLocaleString('en-PH')],
    ['Conversion rate', a.conv==='—' ? 'Not enough data yet' : a.conv],
  ].filter(Boolean);
  rows.forEach(([k,v])=>kv.appendChild(el('div','addons-kvrow','<span class="k">'+k+'</span><b>'+v+'</b>')));
  body.appendChild(kv);

  /* mini purchases-per-week bar chart (12 weeks, deterministic from buys) */
  body.appendChild(el('div','addons-dsec','Purchases · last 12 weeks'));
  const chart = el('div','addons-chart');
  const base = Math.max(1, Math.round(a.buys/26));
  for(let i=0;i<12;i++){
    const seq = [62,48,70,55,80,66,90,74,58,84,72,96];
    const h = Math.max(8, Math.round((base * seq[i] / 60)));
    const cap = Math.min(100, h*2);
    const bar = el('div','addons-cbar tone-'+a.tone); bar.style.height = cap+'%';
    bar.title = 'Week '+(i+1)+' · ~'+h+' purchases';
    chart.appendChild(bar);
  }
  body.appendChild(chart);

  body.appendChild(el('div','addons-dsec','Cost Watch'));
  if(hm){
    const flag = el('div','addons-watch '+hm.cls);
    flag.innerHTML = '<span class="addons-wdot">'+hm.dot+'</span>'+
      '<div class="addons-wmeta"><b>'+hm.label+' · cost-to-price '+a.ratio+'</b>'+
      '<small>Highest '+a.cost.hi+' · avg '+a.cost.avg+' · p95 '+a.cost.p95+'</small></div>'+
      '<button class="addons-wlink">Breakdown →</button>';
    body.appendChild(flag);
  } else {
    body.appendChild(el('div','addons-note','Not enough render volume yet for Cost Watch metrics.'));
  }
}

const payouts_net = r => r.gross - Math.round(r.gross * r.ewtBps / 10000) - r.gw;
const payouts_ewt = r => Math.round(r.gross * r.ewtBps / 10000);

const PAYOUTS_HUE = s => s.split('').reduce((h,c)=>(h*31+c.charCodeAt(0))%360,7);
const payouts_statusLabel = s => s==='sent' ? 'Sent' : s==='hold' ? 'On hold' : 'Pending';
const payouts_statusPill   = s => s==='sent' ? 'yes' : s==='hold' ? 'no' : 'pending';

function payouts_filtered(){
  return PAYOUTS_ROWS.filter(r=>{
    if (payouts_filter.status!=='all' && r.status!==payouts_filter.status) return false;
    if (payouts_filter.tier!=='all'   && r.tier!==payouts_filter.tier)     return false;
    if (payouts_filter.q && !(r.vendor+' '+r.couple+' '+r.ref+' '+r.cat).toLowerCase().includes(payouts_filter.q)) return false;
    return true;
  });
}
