.addons-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.addons-tabs{display:flex;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.addons-tab{font:600 13px system-ui;border:1px solid transparent;background:none;color:var(--ink-soft);border-radius:9px;padding:8px 15px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.addons-tab:hover{color:var(--ink)}
.addons-tab.on{background:var(--card);color:var(--mulberry);border-color:var(--mulberry-line);box-shadow:var(--shadow)}
.addons-tn{font:700 11px system-ui;color:var(--ink-faint);background:var(--line);border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.addons-tab.on .addons-tn{color:var(--mulberry);background:var(--mulberry-soft)}
.addons-search{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 13px;min-width:240px;margin-left:auto}
.addons-search span{font-size:13px;opacity:.7}
.addons-search input{border:none;outline:none;background:none;font:13px system-ui;color:var(--ink);flex:1}

/* ---- main split: card grid | fixed-width detail pane (fill-don't-stretch) ---- */
.addons-wrap{display:grid;grid-template-columns:1fr 420px;gap:18px;align-items:start}
@media(min-width:1700px){.addons-wrap{grid-template-columns:1fr 460px}}
@media(max-width:1180px){.addons-wrap{grid-template-columns:1fr}}

/* ---- card grid — auto-fit ADDS columns as width grows, never one stretched card ---- */
.addons-gridcol{min-width:0}
.addons-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:stretch}

.addons-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 17px;cursor:pointer;transition:box-shadow .12s,transform .06s,border-color .12s;display:flex;flex-direction:column}
.addons-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.addons-card.spot{border-color:var(--gold-line);box-shadow:var(--shadow-lg)}
.addons-card.spot::after{content:"";position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;box-shadow:inset 0 0 0 1px var(--gold-line)}
.addons-card{position:relative}
.addons-card.admin{background:linear-gradient(180deg,var(--mulberry-soft),var(--card))}

.addons-ctop{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.addons-cico{flex:0 0 auto;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.addons-ctitle{flex:1;min-width:0}
.addons-ctitle b{font-family:Georgia,serif;font-weight:700;font-size:14.5px;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addons-ctitle small{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.addons-health{flex:0 0 auto;font-size:11px;line-height:1}
.addons-health.y{filter:none}

.addons-cprice{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.addons-cprice b{font-family:Georgia,serif;font-weight:700;font-size:19px;color:var(--mulberry)}
.addons-bill{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums}

.addons-cnote{margin:0 0 13px;font-size:12.5px;color:var(--ink-soft);line-height:1.45}

.addons-celig{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:13px}
.addons-celig span{font-size:11px;font-weight:600;color:var(--ink-soft);margin-right:8px}
.addons-dot{font-size:9px;line-height:1;margin-right:1px}
.addons-dot.off{filter:grayscale(1) opacity(.55)}
.addons-dot.soon{filter:grayscale(.4) opacity(.7)}

.addons-cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.addons-buys{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.addons-buys b{color:var(--ink);font-weight:700}
.addons-open{font-size:12px;font-weight:600;color:var(--gold)}
.addons-card:hover .addons-open{color:#8a6d2f}

/* ---- admin-only sub-section divider ---- */
.addons-subhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
.addons-rule{flex:0 0 auto;width:18px;height:2px;background:var(--mulberry);border-radius:2px}
.addons-subhead b{font-family:Georgia,serif;font-size:14px;font-weight:700}
.addons-subhead small{flex:1 0 100%;font-size:11.5px;color:var(--ink-faint);margin-top:-2px;padding-left:28px}

/* ---- empty state ---- */
.addons-empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:50px 24px;text-align:center;color:var(--ink-faint)}
.addons-empty .bi{font-size:32px;opacity:.5;margin-bottom:8px}

/* ============================================================ right detail / editor pane ============================================================ */
.addons-detail{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:0;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 92px)}

.addons-dhero{padding:20px 20px 16px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--gold-soft),transparent);flex:0 0 auto}
.addons-dico{width:54px;height:54px;border-radius:14px;margin:0 auto 10px;display:grid;place-items:center;font-size:24px}
.addons-dname{font-family:Georgia,serif;font-size:19px;font-weight:700;line-height:1.2}
.addons-dsku{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-top:3px}
.addons-tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:1px 7px}
.addons-dprice{margin-top:9px;font-family:Georgia,serif;font-size:21px;font-weight:700;color:var(--mulberry)}
.addons-dprice span{font-family:system-ui;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 9px;vertical-align:3px;margin-left:6px}

/* drawer tabs */
.addons-dtabs{display:flex;gap:3px;padding:10px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--alabaster)}
.addons-dtab{flex:1;font:600 12px system-ui;border:1px solid transparent;background:none;color:var(--ink-soft);border-radius:9px;padding:7px 4px;cursor:pointer;white-space:nowrap}
.addons-dtab:hover{color:var(--ink);background:var(--gold-soft)}
.addons-dtab.on{background:var(--mulberry);color:#fff;border-color:var(--mulberry)}

.addons-dbody{padding:16px 18px 20px;overflow-y:auto;flex:1}
.addons-dbody::-webkit-scrollbar{width:8px}.addons-dbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.addons-dsec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:18px 0 9px}
.addons-dsec:first-child{margin-top:0}
.addons-note{font-size:11.5px;line-height:1.5;color:var(--ink-soft);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px;margin-top:12px}
.addons-note code{font-size:11px;background:var(--card);border:1px solid var(--gold-line);border-radius:5px;padding:0 4px}

/* eligibility toggles */
.addons-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.addons-toggle .k{font-size:13.5px;font-weight:600}
.addons-toggle.na .k{color:var(--ink-faint);font-weight:500}
.addons-naflag{font-size:11px;font-weight:700;color:var(--ink-faint);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.addons-sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px 4px 4px;cursor:pointer;font:600 12px system-ui;color:var(--ink-soft)}
.addons-sw i{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:0 0 auto}
.addons-sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);transition:left .15s}
.addons-sw.on{color:var(--sage);border-color:var(--sage-line);background:var(--sage-soft)}
.addons-sw.on i{background:var(--sage)} .addons-sw.on i::after{left:14px}
.addons-sw.soon{color:#8a6d2f;border-color:var(--gold-line);background:var(--gold-soft)}
.addons-sw.soon i{background:var(--gold)} .addons-sw.soon i::after{left:8px}
.addons-blockreason{padding:10px 0 4px}
.addons-blockreason label{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:5px}
.addons-blockreason textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:12.5px/1.45 system-ui;color:var(--ink);background:var(--bg);resize:vertical;min-height:46px}

/* per-event override list */
.addons-ovr{display:flex;flex-direction:column;gap:8px}
.addons-ovr-empty{font-size:12.5px;color:var(--ink-faint);padding:12px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.addons-ovr-row{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.addons-ovr-meta{flex:1;min-width:0}
.addons-ovr-meta b{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.addons-ovr-meta small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.addons-ovr-by{color:var(--ink-faint)!important;font-size:10.5px!important}
.addons-ovr-x{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink-faint);cursor:pointer;font-size:11px}
.addons-ovr-x:hover{border-color:var(--mulberry-line);color:var(--mulberry)}

/* pricing key-value + history */
.addons-kv{display:flex;flex-direction:column}
.addons-kvrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.addons-kvrow:last-child{border-bottom:none}
.addons-kvrow .k{color:var(--ink-soft)}
.addons-kvrow b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.addons-histtbl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.addons-histrow{display:grid;grid-template-columns:.7fr .7fr .8fr 1.6fr .7fr;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12px;align-items:center}
.addons-histrow:last-child{border-bottom:none}
.addons-histrow.head{background:var(--alabaster);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.addons-hp{color:var(--ink-faint);text-decoration:line-through;font-variant-numeric:tabular-nums}
.addons-hn{font-weight:700;color:var(--mulberry);font-variant-numeric:tabular-nums}
.addons-hf{color:var(--ink-soft);font-size:11px}
.addons-hr b{display:block;font-size:11.5px;font-weight:700}
.addons-hr small{display:block;font-size:11px;color:var(--ink-soft);line-height:1.35}
.addons-hw{color:var(--ink-faint);font-size:11px;font-variant-numeric:tabular-nums}

/* current-users tab */
.addons-uchips{display:flex;gap:6px;margin-bottom:10px}
.addons-uchip{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:99px;padding:5px 12px;cursor:pointer}
.addons-uchip.on{background:var(--mulberry-soft);border-color:var(--mulberry-line);color:var(--mulberry)}
.addons-usearch{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px;margin-bottom:12px}
.addons-usearch span{font-size:12px;opacity:.7}
.addons-usearch input{border:none;outline:none;background:none;font:12.5px system-ui;color:var(--ink);flex:1}
.addons-ulist{display:flex;flex-direction:column;gap:7px}
.addons-urow{display:flex;align-items:center;gap:11px;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer}
.addons-urow:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.addons-uico{flex:0 0 auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--gold-soft);border:1px solid var(--gold-line)}
.addons-umeta{flex:1;min-width:0}
.addons-umeta b{font-size:13px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addons-umeta small{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.addons-ustate{flex:0 0 auto;text-align:right;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* statistics — mini stats reused from couple addons + a bar chart */
.addons-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.addons-mstat{text-align:center;border:1px solid var(--line);border-radius:11px;padding:10px 4px;background:var(--bg)}
.addons-mstat .v{font-family:Georgia,serif;font-size:16px;font-weight:700;line-height:1.1}
.addons-mstat .k{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px}
.addons-chart{display:flex;align-items:flex-end;gap:5px;height:80px;padding:8px 4px;background:var(--bg);border:1px solid var(--line);border-radius:11px}
.addons-cbar{flex:1;border-radius:4px 4px 0 0;min-height:8px;transition:height .3s}

/* cost-watch flag */
.addons-watch{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--bg)}
.addons-watch.g{background:var(--sage-soft);border-color:var(--sage-line)}
.addons-watch.y{background:var(--gold-soft);border-color:var(--gold-line)}
.addons-watch.r{background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.addons-wdot{font-size:14px;line-height:1}
.addons-wmeta{flex:1;min-width:0}
.addons-wmeta b{font-size:12.5px;font-weight:700;display:block}
.addons-wmeta small{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.addons-wlink{flex:0 0 auto;font:600 11.5px system-ui;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:8px;padding:6px 10px;cursor:pointer}
.addons-wlink:hover{border-color:var(--gold-line);color:var(--ink)}

/* ---- tone helpers — map each SKU icon/bar to a palette accent (no new colors) ---- */
.tone-mulberry.addons-cico,.tone-mulberry.addons-dico{background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.tone-gold.addons-cico,.tone-gold.addons-dico{background:var(--gold-soft);border:1px solid var(--gold-line)}
.tone-sage.addons-cico,.tone-sage.addons-dico{background:var(--sage-soft);border:1px solid var(--sage-line)}
.addons-cbar.tone-mulberry{background:var(--mulberry)}
.addons-cbar.tone-gold{background:linear-gradient(180deg,#d8b878,var(--gold))}
.addons-cbar.tone-sage{background:var(--sage)}

/* payouts */
/* ===== PAYOUTS surface — scoped extras. Palette vars only; every selector ".payouts-" prefixed. ===== */

/* status strip (mirrors the seating status strip) */
.payouts-strip{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.payouts-spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.payouts-spill.ok{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}
.payouts-spill.ewt{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.payouts-spill.warn{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}

/* three-column body: filter rail | queue | detail. Fills wide screens by GROWING the queue + widening detail. */
.payouts-wrap{display:grid;grid-template-columns:236px 1fr 360px;gap:16px;align-items:start}
@media(min-width:1700px){.payouts-wrap{grid-template-columns:264px 1fr 408px}}

.payouts-note{margin-top:14px;font-size:11.5px;line-height:1.5;color:var(--ink-soft);
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px}
.payouts-note b{color:#8a6d2f}

/* ---- queue table cells ---- */
.payouts-for b{font-weight:600}
.payouts-ref{display:block;font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;letter-spacing:.04em;margin-top:1px}
.payouts-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.payouts-net{font-weight:700;color:var(--mulberry)}
.payouts-ewt-cell{color:var(--ink-soft)}
.payouts-ewt-cell small{display:block;font-size:10px;color:var(--ink-faint);font-weight:600}
.payouts-wrap thead th:nth-child(3),.payouts-wrap thead th:nth-child(4),.payouts-wrap thead th:nth-child(5){text-align:right}

/* ---- detail hero extras ---- */
.payouts-status-wrap{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:11px}
.payouts-ref-pill{font:700 11px system-ui;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--ink-soft);
  background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px}

/* section header inside the detail pane */
.payouts-sech{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;
  margin:18px 0 9px}
.payouts-sech:first-child{margin-top:0}

/* disbursement calc block */
.payouts-calc{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--bg)}
.payouts-crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;font-size:13px;
  border-bottom:1px solid var(--line)}
.payouts-crow:last-child{border-bottom:none}
.payouts-crow .k{color:var(--ink-soft)}
.payouts-crow .v{font-variant-numeric:tabular-nums;font-weight:600}
.payouts-crow.neg .v{color:var(--rose)}
.payouts-crow.tot{background:var(--mulberry-soft)}
.payouts-crow.tot .k{color:var(--mulberry);font-weight:700}
.payouts-crow.tot .v{color:var(--mulberry);font-weight:700;font-size:15px}

.payouts-fyi{font-size:11.5px;line-height:1.5;color:var(--ink-soft);margin-top:9px}

/* Form 2307 mini-block reuses .gd-row; nothing extra needed but keep a hook */
.payouts-2307{border:1px solid var(--line);border-radius:11px;padding:2px 13px;background:var(--card)}
.payouts-2307 .gd-row{padding:8px 0}

/* milestone tracker */
.payouts-track{display:flex;flex-direction:column;gap:0}
.payouts-step{display:flex;align-items:flex-start;gap:11px;padding:10px 0;position:relative}
.payouts-step:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:-2px;width:2px;background:var(--line)}
.payouts-step.done:not(:last-child)::before{background:var(--sage-line)}
.payouts-dot{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font:700 12px system-ui;border:2px solid var(--line);background:var(--card);color:var(--ink-faint);z-index:1}
.payouts-step.done .payouts-dot{background:var(--sage-soft);border-color:var(--sage-line);color:var(--sage)}
.payouts-step.now .payouts-dot{background:var(--mulberry);border-color:var(--mulberry);color:#fff}
.payouts-step-b{flex:1;min-width:0}
.payouts-step-b b{display:block;font-size:13px;font-weight:600}
.payouts-step.todo .payouts-step-b b{color:var(--ink-faint)}
.payouts-step-b small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.payouts-step-tag{flex:0 0 auto;align-self:center;font:700 10px system-ui;letter-spacing:.04em;text-transform:uppercase;
  color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:2px 8px}

.payouts-certified{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.5;color:var(--sage);
  background:var(--sage-soft);border:1px solid var(--sage-line);border-radius:11px;padding:11px 13px}
.payouts-certified span{font-weight:800}

/* status banners */
.payouts-hold{font-size:12.5px;line-height:1.5;color:var(--mulberry);background:var(--mulberry-soft);
  border:1px solid var(--mulberry-line);border-radius:11px;padding:11px 13px;margin-top:14px}
.payouts-sent{font-size:12.5px;line-height:1.5;color:var(--sage);background:var(--sage-soft);
  border:1px solid var(--sage-line);border-radius:11px;padding:11px 13px;margin-top:14px}

/* dispatch action row */
.payouts-act{display:flex;gap:8px;margin-top:16px}
.payouts-act .btn{flex:1;text-align:center}
.payouts-act .btn.primary{flex:2}

/* receipts */
/* ===== RECEIPTS surface — scoped extras. Palette vars only; every selector ".receipts-" prefixed. ===== */

/* status strip (non-VAT framing + series state) — same idiom as the seating spill row */
.receipts-strip{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.receipts-spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.receipts-spill.ok{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}
.receipts-spill.warn{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}

/* three-column body: filter rail | OR table | OR preview. Fills wide screens by GROWING the table + widening the preview. */
.receipts-wrap{display:grid;grid-template-columns:232px 1fr 372px;gap:16px;align-items:start}
@media(min-width:1700px){.receipts-wrap{grid-template-columns:264px 1fr 420px}}

/* left-rail tax-type explainer */
.receipts-note{font-size:11.5px;line-height:1.5;color:var(--ink-soft);background:var(--gold-soft);
  border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px}
.receipts-note b{color:#8a6d2f}

/* ---- table cells ---- */
.receipts-no{font-family:Georgia,serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em;color:var(--ink)}
.receipts-no.void{color:var(--ink-faint);text-decoration:line-through}
.receipts-for{color:var(--ink-soft)}
.receipts-method{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.receipts-mico{font-size:14px}
.receipts-tax{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--sage);
  background:var(--sage-soft);border:1px solid var(--sage-line);border-radius:99px;padding:2px 8px}
.receipts-amt{font-family:Georgia,serif;font-weight:700;font-variant-numeric:tabular-nums}

/* ---- detail: hero stamp ---- */
.receipts-hero-void{background:linear-gradient(180deg,var(--mulberry-soft),transparent)}
.receipts-stamp{width:54px;height:54px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;
  font-family:Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.04em;
  color:var(--gold);background:var(--card);border:2px solid var(--gold-line)}
.receipts-hero-void .receipts-stamp{color:var(--mulberry);border-color:var(--mulberry-line)}

/* ---- the Official Receipt document preview (faithful to § 4.5 non-VAT template) ---- */
.receipts-doc{position:relative;margin:0 20px;padding:18px 18px 16px;background:var(--alabaster);
  border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--ink);overflow:hidden}
.receipts-doc.voided{opacity:.62}
.receipts-doc.voided::after{content:"VOID";position:absolute;inset:0;display:grid;place-items:center;
  font-family:Georgia,serif;font-weight:700;font-size:64px;letter-spacing:.1em;color:var(--mulberry);
  opacity:.12;transform:rotate(-18deg);pointer-events:none}
.receipts-doc-head{text-align:center;border-bottom:1px dashed var(--line);padding-bottom:11px}
.receipts-biz{font-family:Georgia,serif;font-weight:700;font-size:14px;letter-spacing:.05em}
.receipts-meta{font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35}
.receipts-nonvat{display:inline-block;margin-top:7px;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line);border-radius:99px;padding:2px 9px}
.receipts-doc-title{text-align:center;font-family:Georgia,serif;font-weight:700;font-size:15px;
  letter-spacing:.18em;margin:11px 0 4px}

.receipts-block{padding:10px 0;border-bottom:1px dashed var(--line)}
.receipts-block-k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:3px}
.receipts-rf-name{font-weight:700;font-size:13px}
.receipts-rf-line{color:var(--ink-soft);font-size:11px;line-height:1.45}

.receipts-items{width:100%;border-collapse:collapse;margin:11px 0 4px}
.receipts-items thead th{padding:0 0 6px;border-bottom:1px solid var(--line);background:none;
  font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;cursor:default}
.receipts-items tbody td{padding:6px 0;border-bottom:1px dashed var(--line);font-size:11.5px;vertical-align:top}
.receipts-items tbody tr:last-child td{border-bottom:none}
.receipts-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.receipts-items thead th.receipts-num{text-align:right}

.receipts-totals{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.receipts-trow{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;padding:3px 0;color:var(--ink-soft)}
.receipts-trow b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.receipts-trow sup{color:var(--ink-faint)}
.receipts-trow.grand{margin-top:5px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
.receipts-trow.grand span{font-family:Georgia,serif;font-weight:700;letter-spacing:.04em}
.receipts-trow.grand b{font-family:Georgia,serif;font-size:16px;font-weight:700;color:var(--mulberry)}

.receipts-disclaimer{margin-top:11px;font-size:10px;line-height:1.5;color:var(--ink-soft);
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:8px;padding:7px 9px}
.receipts-disclaimer b{color:var(--mulberry);letter-spacing:.02em}
.receipts-pay{margin-top:9px;font-size:11px;color:var(--ink-soft)}
.receipts-pay b{color:var(--ink)}
.receipts-sig{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:11px;
  border-top:1px dashed var(--line);font-size:9.5px;letter-spacing:.04em;color:var(--ink-faint)}

/* ---- void explainer box ---- */
.receipts-voidbox{margin:14px 20px 0;font-size:12px;line-height:1.5;color:var(--mulberry);
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:10px;padding:10px 12px}
.receipts-voidbox b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.receipts-void-meta{margin-top:6px;font-size:11px;color:var(--ink-soft)}

/* ---- actions ---- */
.receipts-act{display:flex;gap:7px;margin:16px 20px 0}
.receipts-voidbtn{display:block;width:calc(100% - 40px);margin:9px 20px 0;
  color:var(--mulberry);border-color:var(--mulberry-line);background:var(--mulberry-soft)}
.receipts-voidbtn:hover{border-color:var(--mulberry);filter:brightness(.98)}
.receipts-gatehint{margin:8px 20px 18px;font-size:10.5px;line-height:1.5;color:var(--ink-faint)}

/* paymentmethods */
/* ============================================================
   PAYMENT METHODS surface — scoped extras (palette vars only).
   Every selector ".paymentmethods-" prefixed. Reuses shared
   .surfhead .card .btn .pill .pill.yes/.pending classes.
   ============================================================ */

/* ---- shared method badge (BDO / GCash / Maya) ---- */
.paymentmethods-badge{flex:0 0 auto;display:grid;place-items:center;min-width:56px;height:34px;padding:0 12px;
  border-radius:10px;border:1px solid;font:700 13px Georgia,serif;letter-spacing:.04em}

/* ---- two-admin-gate banner ---- */
.paymentmethods-gate{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;margin-bottom:18px;
  border:1px solid var(--mulberry-line);background:linear-gradient(180deg,var(--mulberry-soft),var(--card));
  border-radius:var(--radius);box-shadow:var(--shadow)}
.paymentmethods-gate-ico{flex:0 0 auto;font-size:22px;line-height:1.1}
.paymentmethods-gate-body{flex:1;min-width:0}
.paymentmethods-gate-body b{font-size:14px;color:var(--mulberry)}
.paymentmethods-gate-body p{margin:5px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink-soft)}
.paymentmethods-gate-tag{flex:0 0 auto;align-self:flex-start;font:700 10.5px system-ui;letter-spacing:.06em;
  text-transform:uppercase;color:var(--mulberry);background:var(--card);border:1px solid var(--mulberry-line);
  border-radius:99px;padding:5px 11px;white-space:nowrap}

/* ---- pending two-admin approval card ---- */
.paymentmethods-pending{background:var(--card);border:1px solid var(--gold-line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.paymentmethods-pending-h{display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--gold-soft),transparent)}
.paymentmethods-pending-ttl{flex:1;min-width:0}
.paymentmethods-pending-ttl b{font-family:Georgia,serif;font-size:15px;font-weight:700;display:block}
.paymentmethods-pending-ttl small{font-size:12px;color:var(--ink-soft)}
.paymentmethods-pending-b{padding:16px 18px}

.paymentmethods-diff{display:flex;align-items:stretch;gap:14px;flex-wrap:wrap}
.paymentmethods-diff-col{flex:1;min-width:200px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--bg)}
.paymentmethods-diff-k{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:5px}
.paymentmethods-diff-old{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--rose)}
.paymentmethods-diff-new{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mulberry)}
.paymentmethods-diff-arrow{align-self:center;font-size:18px;color:var(--gold);font-weight:700}

.paymentmethods-pending-why{margin-top:14px;font-size:12.5px;line-height:1.55;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.paymentmethods-why-k{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:5px}

.paymentmethods-pending-act{display:flex;align-items:center;gap:10px;margin-top:16px}
.paymentmethods-pending-note{flex:1;font-size:11.5px;color:var(--ink-faint);line-height:1.45}

/* ---- account-card GRID (fill-don't-stretch: ADD columns) ---- */
.paymentmethods-grid{display:grid;gap:18px;align-items:start;
  grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:1500px){.paymentmethods-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1100px){.paymentmethods-grid{grid-template-columns:minmax(0,1fr)}}

/* ---- one account card ---- */
.paymentmethods-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.paymentmethods-card.is-draft{border-style:dashed;opacity:.96}

.paymentmethods-card-h{display:flex;align-items:center;gap:11px;padding:15px 16px 13px;border-bottom:1px solid var(--line)}
.paymentmethods-card-ttl{flex:1;min-width:0}
.paymentmethods-card-ttl b{font-family:Georgia,serif;font-size:16px;font-weight:700;display:block}
.paymentmethods-card-ttl small{font-size:11.5px;color:var(--ink-soft);display:block;margin-top:1px}

.paymentmethods-card-b{display:flex;gap:14px;padding:15px 16px;align-items:flex-start}
.paymentmethods-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.paymentmethods-field{display:flex;flex-direction:column;gap:2px}
.paymentmethods-field-k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.paymentmethods-field-v{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.paymentmethods-field.is-number .paymentmethods-field-v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}
.paymentmethods-field-note .paymentmethods-field-v{font-size:12px;font-weight:500;color:var(--ink-soft);line-height:1.5}
.paymentmethods-lock{font:700 10px system-ui;letter-spacing:.03em;color:var(--mulberry);background:var(--mulberry-soft);
  border:1px solid var(--mulberry-line);border-radius:99px;padding:2px 8px;white-space:nowrap}

/* QR placeholder */
.paymentmethods-qrwrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.paymentmethods-qr{width:104px;height:104px;border-radius:12px;background:var(--alabaster);border:1px solid var(--gold-line);
  display:grid;place-items:center;position:relative;padding:9px}
.paymentmethods-qr-svg{width:100%;height:100%;fill:currentColor}
.paymentmethods-qr-hole{fill:var(--alabaster)}
.paymentmethods-qr-id{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font:700 9px ui-monospace,Menlo,monospace;
  letter-spacing:.04em;color:var(--ink-faint);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:1px 7px;white-space:nowrap}
.paymentmethods-qr-acts{display:flex;gap:6px}
.paymentmethods-qrlink{font:600 11.5px system-ui;color:var(--gold);background:none;border:none;cursor:pointer;padding:2px 4px}
.paymentmethods-qrlink:hover{color:#8a6d2f;text-decoration:underline}

/* audit footer */
.paymentmethods-card-foot{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line);background:var(--alabaster)}
body.dark .paymentmethods-card-foot{background:var(--bg)}
.paymentmethods-audit{flex:1;font-size:11.5px;color:var(--ink-soft);line-height:1.5}
.paymentmethods-audit b{color:var(--ink);font-weight:600}
.paymentmethods-audit-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sage);margin-right:7px;vertical-align:1px}
.paymentmethods-twochip{font:700 9.5px system-ui;letter-spacing:.03em;color:var(--sage);background:var(--sage-soft);
  border:1px solid var(--sage-line);border-radius:99px;padding:1px 7px;white-space:nowrap}
.paymentmethods-histbtn{flex:0 0 auto;font:600 11.5px system-ui;color:var(--ink-soft);background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.paymentmethods-histbtn:hover{border-color:var(--gold-line);color:var(--ink)}
.paymentmethods-histbtn.on{background:var(--gold-soft);border-color:var(--gold-line);color:#8a6d2f}

/* expandable audit history */
.paymentmethods-hist{padding:6px 16px 14px;background:var(--alabaster);border-top:1px dashed var(--line)}
body.dark .paymentmethods-hist{background:var(--bg)}
.paymentmethods-hist-row{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
.paymentmethods-hist-row:last-child{border-bottom:none}
.paymentmethods-hist-when{flex:0 0 auto;width:74px;font:600 11px ui-monospace,Menlo,monospace;color:var(--ink-faint);padding-top:2px}
.paymentmethods-hist-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:4px;background:var(--ink-faint);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.paymentmethods-hist-dot.gate{background:var(--mulberry);box-shadow:0 0 0 1px var(--mulberry-line)}
.paymentmethods-hist-dot.light{background:var(--gold);box-shadow:0 0 0 1px var(--gold-line)}
.paymentmethods-hist-body{flex:1;min-width:0}
.paymentmethods-hist-body b{font-size:12.5px;font-weight:600;display:block}
.paymentmethods-hist-body small{font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:1px}

/* action bar */
.paymentmethods-card-bar{display:flex;gap:8px;padding:13px 16px;border-top:1px solid var(--line);margin-top:auto}

/* ---- inline change form ---- */
.paymentmethods-form{padding:15px 16px 16px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,var(--mulberry-soft),transparent);animation:paymentmethods-slide .18s ease}
@keyframes paymentmethods-slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.paymentmethods-form-note{font-size:12px;line-height:1.55;color:var(--ink);background:var(--card);
  border:1px solid var(--mulberry-line);border-radius:11px;padding:10px 12px;margin-bottom:13px}
.paymentmethods-form-note b{color:var(--mulberry)}

.paymentmethods-drop{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;cursor:pointer;
  border:2px dashed var(--gold-line);border-radius:12px;padding:18px 14px;background:var(--card);margin-bottom:13px}
.paymentmethods-drop:hover{border-color:var(--gold);background:var(--gold-soft)}
.paymentmethods-drop-ico{font-size:22px;color:var(--gold);line-height:1}
.paymentmethods-drop b{font-size:13px}
.paymentmethods-drop small{font-size:11px;color:var(--ink-soft)}

.paymentmethods-form-fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.paymentmethods-form-row{display:flex;flex-direction:column;gap:5px;min-width:0}
.paymentmethods-form-row-wide{grid-column:1 / -1}
.paymentmethods-form-lbl{font:700 10.5px system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
  display:flex;align-items:center;gap:7px}
.paymentmethods-light{font-size:9.5px;font-weight:700;letter-spacing:.03em;color:var(--ink-soft);background:var(--line);border-radius:99px;padding:1px 7px}
.paymentmethods-req{font-size:9.5px;font-weight:700;letter-spacing:.03em;color:var(--rose);background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:1px 7px}
.paymentmethods-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:13px system-ui;
  background:var(--card);color:var(--ink);outline:none}
.paymentmethods-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.paymentmethods-field.is-number+.paymentmethods-field .paymentmethods-input,
.paymentmethods-form-row .paymentmethods-input{font-variant-numeric:tabular-nums}
.paymentmethods-textarea{resize:vertical;min-height:54px;line-height:1.5}

.paymentmethods-form-act{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

/* ---- add-method ghost card ---- */
.paymentmethods-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;
  min-height:180px;border:2px dashed var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer;
  color:var(--ink-soft);padding:20px}
.paymentmethods-add:hover{border-color:var(--gold);background:var(--gold-soft);color:#8a6d2f}
.paymentmethods-add-plus{font-size:30px;line-height:1;color:var(--gold)}
.paymentmethods-add b{font-family:Georgia,serif;font-size:15px;color:var(--ink)}
.paymentmethods-add small{font-size:11.5px;color:var(--ink-faint)}

/* brain */
/* ============================================================
   CONCIERGE BRAIN surface — scoped extras (palette vars only).
   Every selector ".brain-" prefixed. Reuses .frail / .gdetail / .gd-* /
   .surfhead / .count / .pill shells from the shared design system.
   Layout: topic-file rail | chunk list | chunk detail (mirrors .guestwrap /
   .services-wrap). Fills wide screens by WIDENING the detail pane, never by
   stretching the readable chunk column.
   ============================================================ */

/* read-only / pilot affordances in the header */
.brain-ro{color:var(--ink-faint);font-weight:600}

/* pilot banner */
.brain-pilot{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;padding:13px 16px;
  background:linear-gradient(180deg,var(--gold-soft),var(--card));border:1px solid var(--gold-line);
  border-radius:var(--radius);box-shadow:var(--shadow);font-size:13px;line-height:1.5;color:var(--ink-soft)}
.brain-pilot b{color:var(--ink);font-weight:700}
.brain-pilot-ico{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;color:#8a6d2f;background:var(--card);border:1px solid var(--gold-line)}

/* three-column body */
.brain-wrap{display:grid;grid-template-columns:264px minmax(0,1fr) 348px;gap:16px;align-items:start}
/* ultrawide: widen rail + detail (the FILL move) instead of stretching the chunk column */
@media(min-width:1700px){.brain-wrap{grid-template-columns:300px minmax(0,1fr) 400px}}
/* narrower desktop: drop the detail pane out of the grid flow */
@media(max-width:1320px){.brain-wrap{grid-template-columns:248px minmax(0,1fr)}}
@media(max-width:1320px){.brain-wrap .brain-detail{display:none}}

/* ---------- LEFT: topic-file rail ---------- */
.brain-flist{display:flex;flex-direction:column;gap:4px;margin:0 -4px;padding:0 4px}
.brain-frow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  border:1px solid transparent;background:none;border-radius:10px;padding:9px 9px;color:var(--ink);font:inherit}
.brain-frow:hover{background:var(--gold-soft)}
.brain-frow.sel{background:var(--gold-soft);border-color:var(--gold-line)}
.brain-frow.sel .brain-fmeta b{color:#8a6d2f}
.brain-fico{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:var(--bg);border:1px solid var(--line)}
.brain-frow.sel .brain-fico{background:var(--card);border-color:var(--gold-line)}
.brain-fmeta{flex:1;min-width:0}
.brain-fmeta b{font-weight:600;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.brain-fmeta small{font-size:10.5px;color:var(--ink-faint);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brain-fcount{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  background:var(--line);border-radius:99px;padding:2px 8px;min-width:24px;text-align:center}
.brain-frow.sel .brain-fcount{color:#8a6d2f;background:var(--card);border:1px solid var(--gold-line)}
.brain-fstale{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--mulberry);background:var(--mulberry-soft);
  border:1px solid var(--mulberry-line);border-radius:99px;padding:2px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* embedding legend */
.brain-leg{display:flex;flex-direction:column;gap:8px}
.brain-legrow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-soft)}
.brain-emb{flex:0 0 auto;font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px;white-space:nowrap;line-height:1.3}
.brain-emb.ok{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}
.brain-emb.stale{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.brain-lock{flex:0 0 auto;font-size:12px}

/* ---------- CENTER: chunk list ---------- */
.brain-mid{min-width:0}
.brain-sechead{display:flex;align-items:center;gap:11px;margin:2px 2px 14px}
.brain-sec-ico{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:var(--gold-soft);border:1px solid var(--gold-line)}
.brain-sec-meta{flex:1;min-width:0}
.brain-sec-meta h2{font-family:Georgia,serif;font-size:18px;margin:0;font-weight:700;line-height:1.2}
.brain-sec-file{font-size:11.5px;color:var(--ink-faint);margin-top:2px}

.brain-clist{display:flex;flex-direction:column;gap:12px}
.brain-ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 16px 12px;cursor:pointer;transition:box-shadow .12s,transform .06s,border-color .12s}
.brain-ccard:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);border-color:var(--gold-line)}
.brain-ccard.sel{border-color:var(--mulberry);box-shadow:inset 0 0 0 1px var(--mulberry),var(--shadow)}

.brain-c-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:9px}
.brain-c-title{font-size:15px;font-weight:700;line-height:1.3;color:var(--ink)}
.brain-c-title .brain-lock{margin-right:2px}

.brain-c-chips{display:flex;flex-wrap:wrap;gap:6px}
.brain-tag{font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);
  border-radius:99px;padding:3px 9px;letter-spacing:.01em}

.brain-c-foot{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.brain-c-applies{font-size:11.5px;font-weight:700;color:var(--mulberry);background:var(--mulberry-soft);
  border:1px solid var(--mulberry-line);border-radius:99px;padding:3px 9px}
.brain-c-hits{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:600}
.brain-c-ver{font-size:11.5px;color:var(--ink-faint);margin-left:auto;white-space:nowrap}

/* tier-dot trio (DIY · Trial · Active) — used in list foot + detail */
.brain-tiers{display:inline-flex;gap:4px}
.brain-tdot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;
  color:var(--ink-faint);background:var(--bg);border:1px solid var(--line);font-variant-numeric:normal}
.brain-tdot.on{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}

.brain-empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:34px;text-align:center;color:var(--ink-faint);font-size:13px}

/* ---------- RIGHT: chunk detail ---------- */
.brain-d-ico{width:58px;height:58px;border-radius:15px;margin:0 auto 10px;display:grid;place-items:center;font-size:26px;
  background:var(--card);border:1px solid var(--gold-line)}
.brain-d-state{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:11px}
.brain-d-pill{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.brain-d-pill.free{color:var(--ink-soft);background:var(--card);border:1px solid var(--line)}
.brain-d-pill.lock{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
.brain-d-pill.ok{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}
.brain-d-pill.stale{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}

.brain-bodylabel,.brain-srclabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;margin:2px 0 7px}
.brain-srclabel{margin-top:16px}
.brain-body{font-size:12.5px;line-height:1.6;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:13px 14px;max-height:300px;overflow-y:auto}
.brain-body::-webkit-scrollbar{width:7px}.brain-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px}
.brain-md-p{margin:0 0 9px}.brain-md-p:last-child{margin-bottom:0}
.brain-md-num{font-weight:700;margin:0 0 6px;color:var(--ink)}
.brain-md-ul{margin:0 0 9px;padding-left:18px}.brain-md-ul li{margin-bottom:3px}
.brain-body b{font-weight:700;color:var(--mulberry)}

.brain-d-tagrow{align-items:flex-start}
.brain-d-tagrow .k{padding-top:3px}

.brain-src{font-size:12px;line-height:1.5;color:var(--ink-soft);background:var(--gold-soft);border:1px solid var(--gold-line);
  border-radius:10px;padding:10px 12px;font-style:italic}

.brain-rofoot{margin-top:14px;font-size:11.5px;line-height:1.5;color:var(--ink-faint);
  border-top:1px dashed var(--line);padding-top:12px}

/* moodboardlibrary */
/* ============================================================
   MOODBOARD LIBRARY — scoped extras (palette vars only).
   Every selector ".moodboardlibrary-" prefixed.
   Layout: facet rail | gallery (fill-don't-stretch) | Color Range Manipulator.
   Wide screens ADD gallery columns; the rail + manipulator stay fixed-width.
   ============================================================ */

/* ---- status strip ---- */
.moodboardlibrary-strip{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.moodboardlibrary-spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.moodboardlibrary-spill.ok{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}
.moodboardlibrary-spill.warn{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.moodboardlibrary-spill.draft{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}

/* ---- three-zone body ---- */
.moodboardlibrary-wrap{display:grid;grid-template-columns:248px 1fr 336px;gap:16px;align-items:start}
/* ultrawide: widen the two rails a touch; gallery keeps absorbing columns */
@media(min-width:1700px){.moodboardlibrary-wrap{grid-template-columns:276px 1fr 372px}}
/* narrower desktop: drop the manipulator below the gallery rather than squeezing it */
@media(max-width:1320px){.moodboardlibrary-wrap{grid-template-columns:236px 1fr}}
@media(max-width:1320px){.moodboardlibrary-crm{grid-column:1 / -1;position:static!important}}

/* ---- LEFT facet rail ---- */
.moodboardlibrary-rail{position:sticky;top:0}
.moodboardlibrary-treats{display:flex;flex-direction:column;gap:4px}
.moodboardlibrary-treat{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  border:1px solid transparent;background:none;border-radius:10px;padding:8px 9px;cursor:pointer;color:var(--ink)}
.moodboardlibrary-treat:hover{background:var(--gold-soft)}
.moodboardlibrary-treat.on{background:var(--gold-soft);border-color:var(--gold-line)}
.moodboardlibrary-tico{flex:0 0 auto;width:22px;height:22px;display:grid;place-items:center;font-size:14px;
  border-radius:7px;background:var(--bg);border:1px solid var(--line);margin-top:1px}
.moodboardlibrary-treat.on .moodboardlibrary-tico{background:var(--card);border-color:var(--gold-line)}
.moodboardlibrary-tlabel{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.3}
.moodboardlibrary-tlabel small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-faint);
  margin-top:2px;line-height:1.35;white-space:normal}
.moodboardlibrary-tcount{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;background:var(--line);border-radius:99px;padding:2px 8px;margin-top:1px}
.moodboardlibrary-treat.on .moodboardlibrary-tcount{color:#8a6d2f;background:var(--card);border:1px solid var(--gold-line)}

/* ---- CENTER gallery ---- */
.moodboardlibrary-mid{min-width:0}
.moodboardlibrary-sechead{display:flex;align-items:baseline;gap:10px;margin:2px 2px 12px}
.moodboardlibrary-sechead h2{font-size:17px;margin:0;font-weight:700}
.moodboardlibrary-sechead .count{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--line);
  border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums}

/* the FILL-not-stretch grid: 3–4 cols on desktop, more as width grows */
.moodboardlibrary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:16px}

.moodboardlibrary-tile{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
  transition:box-shadow .12s,transform .06s,border-color .12s}
.moodboardlibrary-tile:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--gold-line)}
.moodboardlibrary-tile.sel{border-color:var(--mulberry);box-shadow:inset 0 0 0 1px var(--mulberry),var(--shadow)}

.moodboardlibrary-art{position:relative;height:138px;display:grid;place-items:center}
.moodboardlibrary-glyph{font-size:38px;filter:drop-shadow(0 2px 6px rgba(30,34,41,.22))}
.moodboardlibrary-statedot{position:absolute;top:10px;left:10px;width:9px;height:9px;border-radius:50%;
  box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.moodboardlibrary-statedot.live{background:var(--sage)}
.moodboardlibrary-statedot.review{background:var(--gold)}
.moodboardlibrary-statedot.draft{background:var(--ink-faint)}
.moodboardlibrary-treatbadge{position:absolute;top:9px;right:9px;font-size:10px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.86);
  border-radius:99px;padding:3px 9px;backdrop-filter:blur(4px)}
body.dark .moodboardlibrary-treatbadge{color:var(--obsidian)}
.moodboardlibrary-tileramp{position:absolute;left:10px;bottom:10px;display:flex;gap:0;border-radius:6px;
  overflow:hidden;box-shadow:0 1px 4px rgba(30,34,41,.25);border:1.5px solid rgba(255,255,255,.7)}
.moodboardlibrary-tileramp i{display:block;width:18px;height:14px}

.moodboardlibrary-tmeta{padding:11px 13px 12px}
.moodboardlibrary-tname{font-size:14px;font-weight:700;line-height:1.25}
.moodboardlibrary-tsub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moodboardlibrary-tfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.moodboardlibrary-tref{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;
  color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.moodboardlibrary-tuse{font-size:11px;font-weight:600;color:var(--gold)}

.moodboardlibrary-empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:40px 34px;text-align:center;color:var(--ink-faint);font-size:13px}

/* ---- RIGHT: Color Range Manipulator ---- */
.moodboardlibrary-crm{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);position:sticky;top:0;overflow:hidden}
.moodboardlibrary-crm-hero{padding:16px 18px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--mulberry-soft),transparent)}
.moodboardlibrary-crm-eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mulberry);font-weight:700}
.moodboardlibrary-crm-title{font-family:Georgia,serif;font-size:18px;font-weight:700;margin-top:5px;line-height:1.2}
.moodboardlibrary-crm-sub{font-size:12px;color:var(--ink-soft);margin-top:4px}

/* applied-palette ribbon */
.moodboardlibrary-ribbon{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:0}
.moodboardlibrary-ribbon-cell{height:58px;display:flex;align-items:flex-end;justify-content:center;padding:6px 4px}
.moodboardlibrary-ribbon-cell span{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(30,34,41,.45)}

/* sliders */
.moodboardlibrary-sliders{padding:16px 18px 6px;display:flex;flex-direction:column;gap:15px}
.moodboardlibrary-slider{display:flex;flex-direction:column;gap:8px}
.moodboardlibrary-slabel{display:flex;align-items:center;justify-content:space-between;font-size:12.5px}
.moodboardlibrary-slabel span{color:var(--ink-soft);font-weight:600}
.moodboardlibrary-slabel b{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.moodboardlibrary-track{position:relative;border-radius:99px}
.moodboardlibrary-track.hue{background:linear-gradient(90deg,
  hsl(0,70%,55%),hsl(60,70%,55%),hsl(120,70%,55%),hsl(180,70%,55%),hsl(240,70%,55%),hsl(300,70%,55%),hsl(360,70%,55%));
  padding:0;height:8px;margin:5px 0}
.moodboardlibrary-range{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;
  background:var(--line);outline:none;cursor:pointer;margin:0}
.moodboardlibrary-track.hue .moodboardlibrary-range{background:transparent;position:absolute;inset:0;height:8px}
.moodboardlibrary-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--card);border:2px solid var(--mulberry);
  box-shadow:var(--shadow);cursor:pointer;margin-top:0}
.moodboardlibrary-range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--card);
  border:2px solid var(--mulberry);box-shadow:var(--shadow);cursor:pointer}

/* color-name readout */
.moodboardlibrary-readout{display:flex;align-items:center;gap:11px;margin:8px 18px 0;padding:11px 12px;
  background:var(--bg);border:1px solid var(--line);border-radius:11px}
.moodboardlibrary-readswatch{width:38px;height:38px;border-radius:9px;flex:0 0 auto;
  border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.moodboardlibrary-readmeta{flex:1;min-width:0}
.moodboardlibrary-readmeta b{font-size:13.5px;font-weight:700}
.moodboardlibrary-readmeta small{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px;
  font-variant-numeric:tabular-nums}
.moodboardlibrary-hex{font:700 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:7px;padding:4px 8px;flex:0 0 auto}

/* asset facts */
.moodboardlibrary-facts{padding:14px 18px 4px}
.moodboardlibrary-fact{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.moodboardlibrary-fact:last-child{border-bottom:none}
.moodboardlibrary-fact .k{color:var(--ink-soft)}

/* actions + note */
.moodboardlibrary-act{display:flex;gap:8px;padding:6px 18px 0}
.moodboardlibrary-act .btn{flex:1;text-align:center}
.moodboardlibrary-act .btn.primary{flex:1.4}
.moodboardlibrary-note{margin:13px 18px 18px;font-size:11.5px;line-height:1.55;color:var(--ink-soft);
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px}

/* taxonomy */
/* ============================================================
   TAXONOMY surface — scoped extras (palette vars only).
   Every selector is ".taxonomy-" prefixed; reuses the shared
   .card/.card-h/.card-b/.stack/.statstrip/.stat/.count/.btn/.serif.
   COMPACT read summary: a condensed family tree + a gold editor
   handoff rail + a pending-requests list. FILL-DON'T-STRETCH —
   wide screens add tile columns + widen the rail, never stretch
   a single column.
   ============================================================ */

/* pending chip in the surface header (mulberry, matches .countpill family) */
.taxonomy-pendchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line);
  border-radius:99px;padding:6px 13px;font-variant-numeric:tabular-nums}

/* stat-strip sub-line under each .stat .v/.k */
.taxonomy-statsub{font-size:11px;color:var(--ink-faint);margin-top:6px;line-height:1.35}

/* two-column body: family tree | rail. Wide screens widen the rail (fill, not stretch). */
.taxonomy-wrap{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media(min-width:1700px){.taxonomy-wrap{grid-template-columns:1fr 412px}}

.taxonomy-treecard{overflow:hidden}
.taxonomy-treebody{display:flex;flex-direction:column;gap:12px;padding:14px 16px 18px}

/* "show pending only" filter toggle in the tree header */
.taxonomy-filter{font:600 12px system-ui;color:var(--ink-soft);background:var(--card);
  border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.taxonomy-filter:hover{border-color:var(--gold-line);color:var(--ink)}
.taxonomy-filter.on{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}

.taxonomy-empty{padding:36px 18px;text-align:center;color:var(--ink-faint);font-size:13px}
.taxonomy-empty .bi{font-size:30px;opacity:.5;margin-bottom:8px}

/* ---- parent-family card ---- */
.taxonomy-fam{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.taxonomy-fam:hover{border-color:var(--gold-line)}
.taxonomy-famhead{display:flex;align-items:center;gap:11px;width:100%;border:none;background:var(--alabaster);
  cursor:pointer;padding:11px 14px;text-align:left;color:var(--ink);border-bottom:1px solid var(--line)}
.taxonomy-famhead:hover{background:var(--gold-soft)}
.taxonomy-fam.collapsed .taxonomy-famhead{border-bottom-color:transparent}
.taxonomy-famchev{flex:0 0 auto;font-size:10px;color:var(--ink-faint);transition:transform .15s;width:12px;text-align:center}
.taxonomy-fam.collapsed .taxonomy-famchev{transform:rotate(-90deg)}
.taxonomy-famico{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:15px;background:var(--gold-soft);border:1px solid var(--gold-line)}
.taxonomy-famname{flex:0 0 auto;font-size:15.5px;font-weight:700;letter-spacing:.01em}
.taxonomy-famcounts{flex:1;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taxonomy-fampend{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--mulberry);background:var(--mulberry-soft);
  border:1px solid var(--mulberry-line);border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums}

/* tile grid inside a family — adds columns as the card widens */
.taxonomy-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:8px;padding:12px 14px 14px}
.taxonomy-fam.collapsed .taxonomy-tiles{display:none}

.taxonomy-tile{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 11px;min-width:0}
.taxonomy-tile.branch{border-style:dashed}
.taxonomy-tile.sn{background:var(--gold-soft);border-color:var(--gold-line)}
.taxonomy-tilehead{display:flex;align-items:center;gap:8px}
.taxonomy-tilename{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taxonomy-branchtag{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);
  background:var(--card);border:1px solid var(--gold-line);border-radius:99px;padding:1px 6px;margin-left:2px}
/* reuse shared .count chip, just keep the digits tabular + right-aligned */
.taxonomy-tilecount{flex:0 0 auto;font-variant-numeric:tabular-nums}
.taxonomy-tilemeta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}
.taxonomy-flag{font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);background:var(--bg);
  border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.taxonomy-flag.sn{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.taxonomy-tilenote{font-size:11px;color:var(--ink-faint);line-height:1.35;flex:1 1 100%}

/* ---- right rail: gold editor handoff card (the headline CTA) ---- */
.taxonomy-rail{position:sticky;top:0}
.taxonomy-editorcard{background:linear-gradient(180deg,var(--gold-soft),var(--card));
  border:1px solid var(--gold-line);border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow);text-align:center}
.taxonomy-edglyph{font-size:34px;line-height:1;margin-bottom:8px}
.taxonomy-editorcard h3{margin:0 0 8px;font-size:19px;font-weight:700}
.taxonomy-editorcard p{margin:0 0 16px;font-size:13px;color:var(--ink-soft);line-height:1.55;text-align:left}
.taxonomy-editorcard p b{color:var(--ink);font-weight:700}
.taxonomy-edbtn{width:100%;justify-content:center}
.taxonomy-edfile{margin-top:12px;font-size:11px;color:var(--ink-faint)}
.taxonomy-edfile code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:7px;padding:3px 7px;display:inline-block;word-break:break-all}
.taxonomy-edgate{margin-top:14px;padding-top:13px;border-top:1px dashed var(--gold-line);
  font-size:11.5px;color:var(--ink-soft);line-height:1.5;text-align:left}
.taxonomy-edgate b{color:var(--mulberry);font-weight:700}

/* ---- pending requests list in the rail ---- */
.taxonomy-pendlist{display:flex;flex-direction:column;padding:6px 0}
.taxonomy-pendrow{display:flex;align-items:flex-start;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line)}
.taxonomy-pendrow:last-child{border-bottom:none}
.taxonomy-pengrain{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.03em;border-radius:99px;padding:3px 8px;white-space:nowrap}
.taxonomy-pengrain.tile{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}
.taxonomy-pengrain.detail{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
.taxonomy-penmeta{flex:1;min-width:0}
.taxonomy-penmeta b{font-weight:700;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taxonomy-penmeta small{display:block;font-size:11px;color:var(--ink-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taxonomy-ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em}
.taxonomy-penact{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.taxonomy-mini{font:600 10.5px system-ui;text-align:center;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);border-radius:7px;padding:3px 8px;white-space:nowrap}
.taxonomy-mini.new{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}
.taxonomy-mini.no{color:var(--rose);background:var(--mulberry-soft);border-color:var(--mulberry-line)}

/* stack vertically on the narrowest desktop width so neither column is starved */
@media(max-width:1180px){
  .taxonomy-wrap{grid-template-columns:1fr}
  .taxonomy-rail{position:static}
}

/* songs */
/* ============================================================
   SONGS surface — Pakanta song-catalog list-detail (admin).
   Scoped extras only. Palette vars only — no new brand colors.
   Every selector ".songs-" prefixed. Reuses the shared design
   system (.frail .gtable .gdetail .pill .stat .btn …); this file
   adds only the song-specific chrome (4-col layout, player bar,
   musical-DNA grid, lyric block, workflow ladder).
   ============================================================ */

/* status strip — tighten to read as a queue health bar */
.songs-strip{margin-bottom:16px}

/* ---- four-column body: filter rail | order table | detail | workflow ----
   FILL-DON'T-STRETCH: on wide screens the table column GROWS and the
   detail + workflow rails WIDEN; we never stretch a single column. */
.songs-wrap{display:grid;grid-template-columns:212px minmax(380px,1fr) 340px 268px;gap:16px;align-items:start}
@media(min-width:1700px){.songs-wrap{grid-template-columns:236px minmax(440px,1.2fr) 384px 300px}}
/* mid-wide: drop the 4th rail under nothing — fold workflow into the page flow below by spanning */
@media(max-width:1320px){
  .songs-wrap{grid-template-columns:212px minmax(340px,1fr) 320px}
  .songs-flow{grid-column:1 / -1;margin-top:2px}
  .songs-ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}

/* ---- table cells ---- */
.songs-disc{font-size:14px}                                  /* the ♪ disc avatar */
.songs-sla{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.songs-sla.late{color:var(--rose);font-weight:700}

/* tier badges — gold/mulberry/sage spectrum, no new colors */
.songs-tier{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;display:inline-block;border:1px solid}
.songs-tier-basic{color:var(--ink-soft);background:var(--bg);border-color:var(--line)}
.songs-tier-premium{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.songs-tier-suite{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}

/* ---- detail: hero cover ---- */
.songs-hero{background:linear-gradient(180deg,var(--mulberry-soft),transparent)}
.songs-cover{font-size:24px;color:#fff;box-shadow:var(--shadow)}

/* ---- player-bar placeholder ---- */
.songs-player{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--gold-soft),transparent)}
body.dark .songs-player{background:linear-gradient(180deg,var(--bg),transparent)}
.songs-play{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--mulberry);
  background:var(--mulberry);color:#fff;font-size:14px;cursor:pointer;display:grid;place-items:center}
.songs-play:hover{filter:brightness(1.08)}
.songs-play:disabled{background:var(--line);border-color:var(--line);color:var(--ink-faint);cursor:not-allowed;filter:none}
.songs-pwrap{flex:1;min-width:0}
.songs-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.songs-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--mulberry))}
.songs-ptime{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);
  margin-top:5px;font-variant-numeric:tabular-nums}
.songs-pico{flex:0 0 auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-soft);font-size:14px;cursor:pointer}
.songs-pico:hover{border-color:var(--gold-line);color:var(--ink)}
.songs-pico:disabled{color:var(--ink-faint);cursor:not-allowed;opacity:.6}

/* ---- musical-DNA grid (key · BPM · vocal · renders) ---- */
.songs-dna{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.songs-dnacell{text-align:center;border:1px solid var(--line);border-radius:11px;padding:10px 6px;background:var(--bg)}
.songs-dnav{font-family:Georgia,serif;font-size:15px;font-weight:700;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songs-dnak{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px}

/* ---- lyric block ---- */
.songs-lyrhead{display:flex;align-items:center;gap:9px;margin-bottom:8px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.songs-lyrhead>span:first-child{flex:0 0 auto}
.songs-lyrtag{flex:1;font-size:10px;letter-spacing:.04em;color:var(--sage);background:var(--sage-soft);
  border:1px solid var(--sage-line);border-radius:99px;padding:2px 9px;text-transform:none}
.songs-lyrtog{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:8px;padding:3px 10px;font:700 10px system-ui;letter-spacing:.04em;cursor:pointer;text-transform:uppercase}
.songs-lyrtog:hover{border-color:var(--gold-line);color:var(--ink)}
.songs-lyrics{margin:0 0 16px;padding:13px 15px;border:1px solid var(--gold-line);border-radius:11px;
  background:var(--gold-soft);color:var(--ink);font:13px/1.7 Georgia,serif;white-space:pre-wrap;
  max-height:188px;overflow-y:auto}
body.dark .songs-lyrics{background:var(--card)}
.songs-lyrics::-webkit-scrollbar{width:7px}.songs-lyrics::-webkit-scrollbar-thumb{background:var(--gold-line);border-radius:7px}

/* ---- workflow rail ---- */
.songs-flow{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);position:sticky;top:0;padding:16px 16px 18px}
.songs-flow .gd-empty{padding:36px 16px}
.songs-flowhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.songs-flowhead h4{margin:0;font-family:Georgia,serif;font-size:16px;font-weight:700}
.songs-flowstep{font-size:11px;color:var(--ink-faint);font-weight:600;white-space:nowrap}

/* phase ladder */
.songs-ladder{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.songs-step{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:10px;position:relative}
.songs-node{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font:700 11px system-ui;border:1px solid var(--line);background:var(--card);color:var(--ink-faint);font-variant-numeric:tabular-nums}
.songs-steptx{flex:1;min-width:0;line-height:1.25}
.songs-steptx b{font-weight:600;font-size:13px}
.songs-steptx small{display:block;font-size:11px;color:var(--ink-faint)}
/* connector line between nodes */
.songs-step::before{content:"";position:absolute;left:19px;top:-2px;height:9px;width:2px;background:var(--line)}
.songs-step:first-child::before{display:none}
.songs-step-done .songs-node{background:var(--sage);border-color:var(--sage);color:#fff}
.songs-step-done::before{background:var(--sage-line)}
.songs-step-done .songs-steptx b{color:var(--ink-soft)}
.songs-step-now{background:var(--mulberry-soft)}
.songs-step-now .songs-node{background:var(--mulberry);border-color:var(--mulberry);color:#fff;
  box-shadow:0 0 0 4px var(--mulberry-soft)}
.songs-step-now .songs-steptx b{color:var(--mulberry)}
.songs-step-todo .songs-steptx b{color:var(--ink-soft)}

/* next-action card */
.songs-next{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--bg)}
.songs-next-do{border-color:var(--mulberry-line);background:var(--mulberry-soft)}
.songs-next-done{border-color:var(--sage-line);background:var(--sage-soft)}
.songs-nextlbl{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink-faint)}
.songs-next-do .songs-nextlbl{color:var(--mulberry)}
.songs-next-done .songs-nextlbl{color:var(--sage)}
.songs-nextnote{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.45}

/* two-admin gate note for high-value tier */
.songs-gate{margin-top:12px;font-size:11.5px;line-height:1.45;color:#8a6d2f;background:var(--gold-soft);
  border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px}

/* secondary actions */
.songs-acts{display:flex;gap:7px;margin-top:13px}
.songs-act{flex:1;padding:8px 4px;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.songs-act span{font-size:13px}

/* website */
/* ============================================================
   WEBSITE editor — scoped extras. Palette vars only; every selector ".website-" prefixed.
   Desktop-native 3-column: page rail | reorderable widget list | locked-config detail.
   Fill-don't-stretch: ultrawide WIDENS the rail + detail, never stretches the list column alone.
============================================================ */

/* inline auth tag in the surface subtitle */
.website-auth{color:var(--mulberry);font-weight:600}

/* three-column body */
.website-wrap{display:grid;grid-template-columns:260px 1fr 360px;gap:16px;align-items:start}
@media(min-width:1700px){.website-wrap{grid-template-columns:300px 1fr 412px}}

/* ---------------- LEFT: page picker rail ---------------- */
.website-rail{position:sticky;top:0}
.website-pglist{display:flex;flex-direction:column;gap:4px}
.website-pgrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  border:1px solid transparent;background:none;border-radius:11px;padding:9px 10px;color:var(--ink)}
.website-pgrow:hover{background:var(--gold-soft)}
.website-pgrow.sel{background:var(--gold-soft);border-color:var(--gold-line)}
.website-pgico{flex:0 0 auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px;
  background:var(--card);border:1px solid var(--line)}
.website-pgrow.sel .website-pgico{border-color:var(--gold-line)}
.website-pgmeta{flex:1;min-width:0}
.website-pgmeta b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.website-pgmeta small{display:block;font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* gate-type legend */
.website-leg{display:flex;flex-direction:column;gap:9px}
.website-legrow{display:flex;align-items:flex-start;gap:9px}
.website-legsw{flex:0 0 auto;width:11px;height:11px;border-radius:50%;margin-top:3px}
.website-legbody b{display:block;font-size:12.5px;font-weight:600}
.website-legbody small{display:block;font-size:11px;color:var(--ink-soft);line-height:1.4;margin-top:1px}

/* ---------------- CENTER: ordered widget list ---------------- */
.website-listcard{overflow:hidden}
.website-listhead .website-ordernote{font-size:12px;color:var(--ink-soft);font-weight:600}
.website-rows{display:flex;flex-direction:column}

.website-row{display:grid;grid-template-columns:auto 30px 1fr auto auto;align-items:center;gap:14px;
  padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.website-row:last-child{border-bottom:none}
.website-row:hover{background:var(--gold-soft)}
.website-row.sel{background:var(--gold-soft);border-left-color:var(--gold)}
.website-row.off{background:repeating-linear-gradient(135deg,transparent 0 9px,var(--bg) 9px 10px)}
.website-row.off:hover{background:var(--gold-soft)}
.website-row.off .website-rmeta b{color:var(--ink-soft)}

/* drag handle + move arrows */
.website-handle{display:flex;align-items:center;gap:6px;cursor:grab;color:var(--ink-faint)}
.website-handle:active{cursor:grabbing}
.website-grip{font-size:15px;letter-spacing:-3px;line-height:1;user-select:none}
.website-moves{display:flex;flex-direction:column;gap:2px}
.website-arrow{width:20px;height:16px;border:1px solid var(--line);background:var(--card);border-radius:5px;
  cursor:pointer;color:var(--ink-soft);font-size:8px;line-height:1;display:grid;place-items:center;padding:0}
.website-arrow:hover{border-color:var(--gold-line);color:var(--ink);background:var(--gold-soft)}
.website-arrow.dis{opacity:.32;pointer-events:none}

/* order number */
.website-ord{font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--mulberry);text-align:center;
  font-variant-numeric:tabular-nums}
.website-row.off .website-ord{color:var(--ink-faint)}

/* label + id + note */
.website-rmeta{min-width:0}
.website-rmeta b{display:block;font-size:14px;font-weight:600}
.website-wid{display:inline-block;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-soft);
  background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:3px 0 2px}
.website-rmeta small{display:block;font-size:11.5px;color:var(--ink-soft);line-height:1.4}

/* gate badges column */
.website-badges{display:flex;justify-content:flex-end;min-width:78px}
.website-gate{font-size:10.5px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap;letter-spacing:.02em}
.website-gate.count{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
.website-gate.tile{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.website-gate.plain{color:var(--ink-soft);background:var(--bg);border:1px solid var(--line)}

/* enable toggle + status */
.website-ctrl{display:flex;align-items:center;gap:10px;justify-self:end}
.website-toggle{position:relative;width:40px;height:23px;border-radius:99px;border:1px solid var(--line);
  background:var(--bg);cursor:pointer;padding:0;transition:background .14s,border-color .14s;flex:0 0 auto}
.website-toggle.on{background:var(--sage);border-color:var(--sage)}
.website-knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;
  box-shadow:var(--shadow);transition:left .14s}
.website-toggle.on .website-knob{left:19px}

/* ---------------- RIGHT: detail pane ---------------- */
.website-detail{position:sticky;top:0}
.website-detico{width:54px;height:54px;border-radius:14px;margin:0 auto 10px;display:grid;place-items:center;
  font-size:24px;background:var(--card);border:1px solid var(--gold-line)}
.website-detpills{display:flex;justify-content:center;gap:7px;margin-top:10px}

.website-hint{font-size:11.5px;line-height:1.5;color:var(--ink-soft);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:10px 0 4px}

.website-dh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  margin:18px 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
.website-lock{margin-left:auto;font-size:10px;letter-spacing:.02em;text-transform:none;font-weight:600;
  color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
