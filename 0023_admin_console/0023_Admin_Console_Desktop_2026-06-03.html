.addons-jico.tone-sage,.addons-cico.tone-sage{background:var(--sage-soft);border:1px solid var(--sage-line)}
.addons-jbar i.tone-sage,.addons-mbar i.tone-sage{background:var(--sage)}

/* moodboard */
/* ============================================================
   MOOD BOARD — scoped extras (palette vars only · prefixed .moodboard-)
   ============================================================ */

/* two-pane desktop layout: styling brain (left) | inspiration board (right).
   FILL-DON'T-STRETCH — the board grid adds columns as width grows; the brain
   column stays a calm fixed rail. On ultrawide the brain widens a touch. */
.moodboard-wrap{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
@media(min-width:1700px){.moodboard-wrap{grid-template-columns:412px 1fr}}

.moodboard-brain{display:flex;flex-direction:column;gap:18px;position:sticky;top:0}
.moodboard-boardcol{min-width:0}

/* ---- feel / Setnayan Guide ---- */
.moodboard-guide{display:flex;align-items:center;gap:11px;border:1px solid var(--sage-line);
  background:var(--sage-soft);border-radius:12px;padding:11px 13px}
.moodboard-guidedot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--sage);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--sage) 18%,transparent)}
.moodboard-guidetx{flex:1;line-height:1.35}
.moodboard-guidetx b{font-size:13px} .moodboard-guidetx small{display:block;color:var(--ink-soft);font-size:11.5px}
.moodboard-guidetoggle{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--sage);
  background:var(--card);border:1px solid var(--sage-line);border-radius:99px;padding:3px 11px}

.moodboard-warn{margin-top:12px;border:1px solid var(--gold-line);background:var(--gold-soft);
  border-radius:12px;padding:12px 13px;font-size:12.5px;color:#7a5f28;line-height:1.45}
.moodboard-warn-h{font-weight:700;font-size:12.5px;color:#8a6d2f;margin-bottom:3px}
.moodboard-sugg{display:flex;align-items:center;gap:7px;margin-top:9px}
.moodboard-sugg-sw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(30,34,41,.12);cursor:pointer}
.moodboard-sugg-sw:hover{outline:2px solid var(--gold);outline-offset:1px}
.moodboard-arr{color:var(--ink-faint);font-size:12px}

/* ---- master palette ---- */
.moodboard-masterb{padding-top:8px;padding-bottom:10px}
.moodboard-mrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.moodboard-mbig{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:1px solid rgba(30,34,41,.1)}
.moodboard-mmeta{flex:1;min-width:0}
.moodboard-mmeta b{font-weight:600;font-size:13.5px}
.moodboard-mmeta small{display:block;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.moodboard-mused{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--ink-soft);
  background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-variant-numeric:tabular-nums}
.moodboard-mhint{font-size:11.5px;color:var(--ink-soft);padding-top:11px;line-height:1.45}

/* ---- palette list (role + venue) ---- */
.moodboard-pals{padding-top:8px;display:flex;flex-direction:column;gap:9px}
.moodboard-grphead{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);margin:8px 0 1px}
.moodboard-grphead:first-child{margin-top:0}
.moodboard-pal{border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;
  transition:border-color .12s,box-shadow .12s,transform .06s;background:var(--card)}
.moodboard-pal:hover{border-color:var(--gold-line);box-shadow:var(--shadow);transform:translateY(-1px)}
.moodboard-pal.sel{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold),var(--shadow)}
.moodboard-pal-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.moodboard-pal-ini{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  font-family:Georgia,serif;font-size:11.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--mulberry),#7a3a55)}
.moodboard-pal-meta{flex:1;min-width:0}
.moodboard-pal-meta b{font-weight:600;font-size:13.5px}
.moodboard-pal-meta small{display:block;color:var(--ink-soft);font-size:11.5px}
.moodboard-domtag{flex:0 0 auto;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:2px 7px}
.moodboard-oktag{flex:0 0 auto;color:var(--sage);font-size:12px;font-weight:700}
.moodboard-warntag{flex:0 0 auto;color:#8a6d2f;font-size:12px}

/* shared swatch row (palette cards + master + board captions) */
.moodboard-swrow{display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.moodboard-sw{flex:1;height:26px;min-width:0}
.moodboard-swrow.mini .moodboard-sw{height:20px}

/* ---- inspiration board ---- */
.moodboard-boardhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.moodboard-boardhead h3{font-size:18px;margin:0;font-weight:700}
.moodboard-boardhead p{margin:3px 0 0;color:var(--ink-soft);font-size:13px;max-width:46ch}
.moodboard-segwrap{display:flex;gap:5px;flex:0 0 auto}
.moodboard-seg{font:600 12px system-ui;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:9px;padding:7px 12px;cursor:pointer}
.moodboard-seg:hover{border-color:var(--gold-line)}
.moodboard-seg.on{background:var(--mulberry);color:#fff;border-color:var(--mulberry)}

/* masonry-ish grid: adds columns as width grows; big/tall tiles span.
   dense packing keeps the editorial board tight without manual gaps. */
.moodboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
  grid-auto-rows:10px;gap:16px;grid-auto-flow:row dense}
.moodboard-tile{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);
  box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .14s,transform .07s;
  display:flex;flex-direction:column;grid-row:span 21}
.moodboard-tile:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.moodboard-tile.big{grid-column:span 2;grid-row:span 25}
.moodboard-tile.tall{grid-row:span 27}

.moodboard-tph{position:relative;flex:1;min-height:128px;display:grid;place-items:center}
.moodboard-tile.big .moodboard-tph{min-height:188px}
.moodboard-tico{font-size:38px;filter:drop-shadow(0 2px 6px rgba(30,34,41,.25))}
.moodboard-tile.big .moodboard-tico{font-size:50px}
.moodboard-pillar{position:absolute;top:9px;left:9px;font-size:9.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:#fff;background:rgba(30,34,41,.42);border-radius:99px;padding:3px 9px;backdrop-filter:blur(3px)}
.moodboard-locked{position:absolute;top:9px;right:9px;font-size:9.5px;font-weight:700;letter-spacing:.05em;
  color:#3a2f12;background:var(--gold);border-radius:99px;padding:3px 9px}
.moodboard-concept{position:absolute;bottom:8px;left:9px;font-size:10px;font-weight:600;color:#fff;
  background:rgba(30,34,41,.36);border-radius:6px;padding:2px 7px;backdrop-filter:blur(3px)}
.moodboard-tcap{padding:11px 12px;border-top:1px solid var(--line)}
.moodboard-tname{font-family:Georgia,serif;font-size:14.5px;font-weight:700;margin-bottom:8px}

/* add-a-scene affordance tile */
.moodboard-addtile{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:5px;padding:20px;border-style:dashed;background:var(--bg);box-shadow:none;grid-row:span 21}
.moodboard-addtile:hover{border-color:var(--gold);box-shadow:none;transform:none}
.moodboard-addico{font-size:26px;color:var(--gold);line-height:1}
.moodboard-addtx{font-weight:700;font-size:13.5px}
.moodboard-addtile small{color:var(--ink-soft);font-size:11.5px;max-width:22ch;line-height:1.4}

/* stack to single column when the shell gets tight (still ≥1024 desktop) */
@media(max-width:1180px){
  .moodboard-wrap{grid-template-columns:1fr}
  .moodboard-brain{position:static}
}

/* activity */
/* ===== Activity surface — desktop list/feed layout. Palette vars only. ===== */
/* three columns: filter rail | day-grouped feed | aside. Fills width by adding the aside,
   never stretching the feed. Collapses to 2 cols, then 1, on narrower desktops. */
.activity-wrap{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(max-width:1340px){.activity-wrap{grid-template-columns:220px minmax(0,1fr)}.activity-aside{display:none}}
@media(max-width:1120px){.activity-wrap{grid-template-columns:1fr}.activity-wrap .frail{position:static}}
/* ultrawide: widen the aside into two stacked cards but keep the feed readable */
@media(min-width:1800px){.activity-wrap{grid-template-columns:248px minmax(0,1fr) 360px}}

/* ----- main feed column ----- */
.activity-main{display:flex;flex-direction:column;gap:18px}
.activity-group{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.activity-daylabel{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);
  background:var(--alabaster);font:700 11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.activity-daylabel span:first-child{flex:1;color:var(--ink-soft)}
.activity-daycount{font-variant-numeric:tabular-nums;color:var(--ink-faint);background:var(--line);border-radius:99px;padding:1px 8px;letter-spacing:0}
.activity-list{padding:4px 18px}

.activity-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);position:relative}
.activity-item:last-child{border-bottom:none}
/* left accent bar tinted per actor */
.activity-item::before{content:"";position:absolute;left:-18px;top:13px;bottom:13px;width:3px;border-radius:3px;background:var(--gold)}
.activity-item.actor-couple::before{background:var(--mulberry)}
.activity-item.actor-vendor::before{background:var(--gold)}
.activity-item.actor-setnayan::before{background:var(--sage)}
.activity-item.actor-guest::before{background:var(--rose)}
.activity-item .fdot{align-self:flex-start;margin-top:1px}
.activity-body{flex:1;min-width:0}
.activity-text{font-size:13.5px;line-height:1.5}
.activity-text b{font-weight:700}
.activity-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:5px;font-size:11.5px;color:var(--ink-faint)}
.activity-who{color:var(--ink-soft);font-weight:600}
.activity-sep{opacity:.5}
.activity-time{font-variant-numeric:tabular-nums}

/* per-type tag pill */
.activity-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink-soft)}
.activity-tag.t-rsvp{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}
.activity-tag.t-payment{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.activity-tag.t-message{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.activity-tag.t-booking{color:var(--rose);background:var(--mulberry-soft);border-color:var(--mulberry-line)}

/* empty state */
.activity-empty{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:50px 28px;text-align:center;color:var(--ink-faint);max-width:520px}
.activity-empty .bi{font-size:34px;opacity:.55;margin-bottom:8px}

/* ----- aside ----- */
.activity-aside{position:sticky;top:0}
.activity-srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.activity-srow:last-child{border-bottom:none}
.activity-sico{flex:0 0 auto;width:22px;text-align:center;font-size:15px}
.activity-slbl{flex:0 0 84px;font-size:13px;font-weight:600}
.activity-sbar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.activity-sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#d8b878)}
.activity-sn{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:13px;min-width:18px;text-align:right}

/* disputes */
/* ============================================================
   DISPUTES — couple-side list-detail issue tracker
   Mirrors the .guestwrap 3-pane desktop split (filter rail | list | detail).
   Palette vars only · all selectors prefixed .disputes- or scoped under it.
   ============================================================ */

/* 3-pane shell — same shape as .guestwrap; on ultrawide the list column
   widens (FILL-DON'T-STRETCH: it's the column that grows, panes stay sticky). */
.disputes-wrap{display:grid;grid-template-columns:236px 1fr 372px;gap:16px;align-items:start}
@media(min-width:1700px){.disputes-wrap{grid-template-columns:260px 1.1fr 420px}}

/* ---- left rail extras ---- */
.disputes-peace{border:1px solid var(--sage-line);background:var(--sage-soft);border-radius:12px;padding:14px;text-align:center;margin-bottom:6px}
.disputes-peace .dp-ico{font-size:24px;line-height:1}
.disputes-peace .dp-t{font-family:Georgia,serif;font-weight:700;font-size:15px;margin-top:6px;color:var(--sage)}
.disputes-peace .dp-s{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4}

.disputes-how{display:flex;flex-direction:column;gap:9px}
.disputes-how .dh-step{display:flex;gap:9px;font-size:12px;color:var(--ink-soft);line-height:1.4}
.disputes-how .dh-n{flex:0 0 auto;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}

/* ---- middle list column ---- */
.disputes-listcol{display:flex;flex-direction:column;gap:12px}
.disputes-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 16px;cursor:pointer;transition:box-shadow .12s,transform .06s,border-color .12s;position:relative}
.disputes-item:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.disputes-item.sel{border-color:var(--gold-line);background:var(--gold-soft)}
.disputes-item.sel::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--gold)}

.disputes-item .di-top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.disputes-item .di-meta{flex:1;min-width:0}
.disputes-item .di-meta b{font-weight:700;font-size:14px;display:block}
.disputes-item .di-meta small{display:block;color:var(--ink-faint);font-size:11.5px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disputes-item .di-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:9px}
.disputes-item .di-foot{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.disputes-item .di-amt{font-weight:700;color:var(--mulberry);font-variant-numeric:tabular-nums}
.disputes-item .di-sep{color:var(--ink-faint)}
.disputes-item .di-last{flex-basis:100%;color:var(--ink-faint);font-style:italic;font-size:11.5px;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* status dot rides inside the shared .pill */
.di-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.di-dot.open{background:var(--rose)}
.di-dot.review{background:var(--gold)}
.di-dot.resolved{background:var(--sage)}

.disputes-emptylist{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:46px 24px;text-align:center;color:var(--ink-faint)}
.disputes-emptylist .bi{font-size:32px;opacity:.6;margin-bottom:8px}

/* ---- right detail pane (extends shared .gdetail) ---- */
.disputes-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.disputes-hero.resolved{background:linear-gradient(180deg,var(--sage-soft),transparent)}
.disputes-hero.review{background:linear-gradient(180deg,var(--gold-soft),transparent)}
.disputes-hero.open{background:linear-gradient(180deg,var(--mulberry-soft),transparent)}
.disputes-hero .dd-vendor{display:flex;align-items:center;gap:11px}
.disputes-hero .vlogo{width:44px;height:44px;font-size:18px}
.disputes-hero .gd-name{font-size:18px}
.disputes-hero .gd-sub{margin-top:1px}
.disputes-herostatus{align-self:flex-start;white-space:nowrap}

.disputes-issue{padding:2px 0 6px}
.disputes-issue .dd-title{font-family:Georgia,serif;font-size:16px;font-weight:700;line-height:1.3}
.disputes-issue p{margin:7px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.5}

.disputes-detail .dd-mono{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.disputes-detail .dd-amt{font-weight:700;color:var(--mulberry);font-variant-numeric:tabular-nums}

.disputes-resolution{display:flex;align-items:flex-start;gap:11px;border-radius:11px;padding:12px 13px;margin:14px 0 4px}
.disputes-resolution .dr-ico{font-size:18px;line-height:1.2;flex:0 0 auto}
.disputes-resolution b{display:block;font-size:13px;font-weight:700}
.disputes-resolution small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.disputes-resolution.resolved{background:var(--sage-soft);border:1px solid var(--sage-line)}
.disputes-resolution.resolved b{color:var(--sage)}
.disputes-resolution.review{background:var(--gold-soft);border:1px solid var(--gold-line)}
.disputes-resolution.review b{color:#8a6d2f}
.disputes-resolution.open{background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.disputes-resolution.open b{color:var(--mulberry)}

/* ---- timeline ---- */
.disputes-tl-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:18px 0 10px}
.disputes-tl{display:flex;flex-direction:column}
.dt-row{display:flex;gap:12px;position:relative}
.dt-row .dt-rail{flex:0 0 auto;width:30px;display:flex;justify-content:center;position:relative}
/* connector line through the rail */
.dt-row .dt-rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--line);transform:translateX(-50%)}
.dt-row:first-child .dt-rail::before{top:14px}
.dt-row.last .dt-rail::before{bottom:auto;height:14px}
.dt-row .dt-dot{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;background:var(--card);border:1px solid var(--gold-line)}
.dt-row.sys .dt-dot{background:var(--bg);border-color:var(--line)}
.dt-row.vendor .dt-dot{background:var(--gold-soft);border-color:var(--gold-line)}
.dt-row.you .dt-dot,.dt-row.flag .dt-dot{background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.dt-row .dt-body{flex:1;padding-bottom:16px}
.dt-row.last .dt-body{padding-bottom:2px}
.dt-row .dt-t{font-size:13px;font-weight:700}
.dt-row .dt-s{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin-top:2px}
.dt-row .dt-when{font-size:11px;color:var(--ink-faint);margin-top:4px;font-variant-numeric:tabular-nums}

/* ---- action bar ---- */
.disputes-actions{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

/* eventqr */
/* ============================================================ EVENT QR — scoped extras (palette vars only) ============================================================ */
/* 2-col: QR card (sized) | registered crew devices (fills remaining width).
   Wider screens widen the device pane rather than stretching the QR. */
.eventqr-grid{display:grid;gap:18px;align-items:start;grid-template-columns:minmax(360px,420px) 1fr}
@media(max-width:1200px){.eventqr-grid{grid-template-columns:1fr}}

/* ---- left QR card ---- */
.eventqr-qcard{position:sticky;top:0}
.eventqr-qb{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 22px 20px}
.eventqr-stage{width:100%;max-width:300px;aspect-ratio:1/1;border-radius:16px;padding:18px;
  background:linear-gradient(180deg,var(--gold-soft),var(--card));border:1px solid var(--gold-line);box-shadow:var(--shadow)}
.eventqr-qr{position:relative;width:100%;height:100%;display:grid;gap:0;background:var(--card);border-radius:6px;overflow:hidden}
.eventqr-mod{width:100%;height:100%;background:transparent}
.eventqr-mod.on{background:var(--obsidian)}
body.dark .eventqr-mod.on{background:var(--ink)}
.eventqr-mono{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:30%;height:30%;display:grid;place-items:center;border-radius:11px;
  background:linear-gradient(135deg,var(--mulberry),#7a3a55);color:#fff;
  font-size:clamp(14px,4.4vw,22px);font-weight:700;letter-spacing:.02em;
  box-shadow:0 0 0 6px var(--card),var(--shadow)}

.eventqr-cta{text-align:center}
.eventqr-cta-t{font-size:18px;font-weight:700}
.eventqr-cta-s{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45}

.eventqr-roles{width:100%;display:flex;flex-direction:column;gap:8px}
.eventqr-role{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.eventqr-role-ic{flex:0 0 auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--gold-soft);border:1px solid var(--gold-line)}
.eventqr-role-m{flex:1;min-width:0}
.eventqr-role-m b{font-weight:700;font-size:13px} .eventqr-role-m small{display:block;color:var(--ink-soft);font-size:11.5px}
.eventqr-role-tag{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:3px 9px;text-transform:lowercase}

.eventqr-link{width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.eventqr-link-ic{flex:0 0 auto}
.eventqr-link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--ink);font-family:'SF Mono',ui-monospace,Menlo,monospace}
.eventqr-copy{flex:0 0 auto;font:600 11.5px system-ui;border:1px solid var(--gold-line);background:var(--gold-soft);color:#8a6d2f;border-radius:8px;padding:5px 10px;cursor:pointer}
.eventqr-copy:hover{filter:brightness(1.03)}

/* ---- right device pane ---- */
.eventqr-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--line)}
.eventqr-count{padding:14px 16px;text-align:center;border-right:1px solid var(--line)}
.eventqr-count:last-child{border-right:none}
.eventqr-count .v{font-size:22px;font-weight:700;color:var(--mulberry);font-variant-numeric:tabular-nums}
.eventqr-count .k{font-size:11.5px;color:var(--ink-soft);margin-top:2px}

.eventqr-devlist{padding:6px 18px 10px}
.eventqr-dev{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.eventqr-dev:last-child{border-bottom:none}
.eventqr-dev.off{opacity:.66}
.eventqr-ini{width:38px;height:38px;font-size:13px}
.eventqr-dm{flex:1;min-width:0}
.eventqr-dm b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.eventqr-dm small{display:block;color:var(--ink-faint);font-size:11.5px;margin-top:1px}
.eventqr-rolepill{flex:0 0 auto}
.eventqr-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--ink-faint);opacity:.5}
.eventqr-dot.live{background:var(--sage);opacity:1;box-shadow:0 0 0 3px var(--sage-soft)}

.eventqr-open{display:flex;align-items:center;gap:12px;padding:12px;margin-top:10px;border:1px dashed var(--gold-line);border-radius:12px;background:var(--gold-soft)}
.eventqr-open-ic{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#8a6d2f;background:var(--card);border:1px solid var(--gold-line)}
.eventqr-open .eventqr-dm b{color:#8a6d2f}
.eventqr-open-btn{flex:0 0 auto}

/* personalization */
/* ============================================================
   PERSONALIZATION — scoped extras (palette vars only)
   2-col setting-card grid; on wide screens it ADDS columns
   (auto-fit), never stretches a single column.
   ============================================================ */

/* fill-don't-stretch: more cards per row as width grows */
.personalization-grid{
  display:grid;gap:18px;align-items:start;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
}
/* the wide card (notification topics) spans two tracks when room allows */
@media(min-width:1040px){ .personalization-wide{grid-column:span 2} }
@media(min-width:1700px){ .personalization-grid{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))} }

.personalization-set .card-h{gap:9px}
.personalization-cico{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;font-size:15px;
  background:var(--gold-soft);border:1px solid var(--gold-line)}
.personalization-csub{margin:0 0 13px;font-size:12.5px;color:var(--ink-soft)}

/* segmented control — fills the card width, splits evenly */
.personalization-seg{display:flex;gap:8px}
.personalization-segbtn{
  flex:1;min-width:0;cursor:pointer;text-align:left;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:11px;padding:11px 13px;transition:border-color .12s,background .12s}
.personalization-segbtn:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.personalization-segbtn .ps-l{display:block;font:600 13.5px system-ui}
.personalization-segbtn .ps-s{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.personalization-segbtn.on{
  background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.personalization-segbtn.on .ps-l{color:var(--mulberry)}
.personalization-segbtn.on .ps-s{color:var(--mulberry);opacity:.78}

/* sublabel divider used inside cards */
.personalization-sublabel{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;margin:15px 0 9px}

/* explanatory note line under a control */
.personalization-note{
  margin-top:11px;font-size:12.5px;line-height:1.5;color:var(--ink-soft);
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.personalization-pin{
  display:inline-block;font:700 11px system-ui;color:var(--gold);
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:99px;
  padding:1px 8px;margin-right:5px;vertical-align:baseline}

/* theme look swatches */
.personalization-themes{display:flex;flex-wrap:wrap;gap:9px}
.personalization-look{
  display:flex;align-items:center;gap:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:11px;padding:8px 12px 8px 8px}
.personalization-look:hover{border-color:var(--gold-line)}
.personalization-look.on{border-color:var(--gold);background:var(--gold-soft)}
.personalization-look .pl-sw{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(30,34,41,.08)}
.personalization-look .pl-n{font:600 12.5px system-ui}
.personalization-look.on .pl-n{color:#8a6d2f}

/* date-format preview chip */
.personalization-fmt{
  font:600 13px Georgia,serif;color:var(--ink);font-variant-numeric:tabular-nums;
  background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:9px 12px}

/* secondary controls block (reminders sub-area) */
.personalization-sub{margin-top:4px}

/* notification topic rows */
.personalization-notif{display:flex;flex-direction:column}
.personalization-nrow{
  display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.personalization-nrow:last-child{border-bottom:none}
.personalization-nrow .pn-ico{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;font-size:15px;
  background:var(--bg);border:1px solid var(--line)}
.personalization-nrow .pn-meta{flex:1;min-width:0}
.personalization-nrow .pn-meta b{font-weight:700;font-size:13.5px}
.personalization-nrow .pn-meta small{display:block;color:var(--ink-soft);font-size:12px;margin-top:1px}

/* iOS-style switch */
.personalization-switch{
  flex:0 0 auto;width:42px;height:24px;border-radius:99px;background:var(--line);
  position:relative;cursor:pointer;transition:background .15s}
.personalization-switch i{
  position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(30,34,41,.25);transition:left .15s}
.personalization-switch.on{background:var(--mulberry)}
.personalization-switch.on i{left:20px}

/* quiet-hours row */
.personalization-qh{
  display:flex;align-items:center;gap:12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.personalization-qh span{flex:1}
.personalization-qh b{font-weight:700;font-size:13px}
.personalization-qh small{display:block;color:var(--ink-soft);font-size:12px;margin-top:1px}

/* disabled / off state — greyed, non-interactive (master toggle off) */
.personalization-off{opacity:.45}
.personalization-off .personalization-segbtn{cursor:default;pointer-events:none}
.personalization-dim{cursor:default;opacity:.7}

/* hosts */
/* ============================================================ HOSTS surface — scoped extras (palette vars only) ============================================================ */

/* three real columns; fill-don't-stretch on ultrawide */
.hosts-grid{display:grid;grid-template-columns:248px 1fr 332px;gap:16px;align-items:start}
@media(min-width:1700px){.hosts-grid{grid-template-columns:288px 1fr 372px}}

/* tone helpers — reuse existing brand vars only */
.hosts-mulberry{background:linear-gradient(135deg,var(--mulberry),#7a3a55);color:#fff}
.hosts-gold{background:linear-gradient(135deg,var(--gold),#d8b878);color:#3a2f12}
.hosts-sage{background:linear-gradient(135deg,var(--sage),#7c8f55);color:#fff}
.hosts-ghost{background:var(--line);color:var(--ink-faint)}

/* ---- left rail ---- */
.hosts-rail .hosts-legend{display:flex;align-items:flex-start;gap:10px;padding:7px 0}
.hosts-dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;margin-top:4px}
.hosts-leg-b b{font-weight:700;font-size:13px;display:block}
.hosts-leg-b small{color:var(--ink-soft);font-size:11.5px}

.hosts-invite{margin-top:18px;text-align:center;border:1px dashed var(--gold-line);background:var(--gold-soft);
  border-radius:13px;padding:18px 15px}
.hosts-inv-ico{font-size:26px}
.hosts-inv-t{font-family:Georgia,serif;font-weight:700;font-size:15px;margin-top:6px}
.hosts-inv-s{font-size:12px;color:var(--ink-soft);margin:5px 0 13px;line-height:1.45}
.hosts-inv-btn{width:100%}
.hosts-inv-link{font-size:12px;font-weight:600;color:var(--gold);margin-top:11px;cursor:pointer}

/* ---- center people list ---- */
.hosts-people{display:flex;flex-direction:column;gap:12px}
.hosts-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;
  transition:box-shadow .12s,transform .06s,border-color .12s}
.hosts-card:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.hosts-card.sel{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold),var(--shadow)}
.hosts-ava{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:15px}
.hosts-card-b{flex:1;min-width:0}
.hosts-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hosts-name{font-weight:700;font-size:15px}
.hosts-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hosts-sub-2{font-size:11.5px;color:var(--ink-faint);margin-top:3px}

.hosts-chip-owner{border-color:var(--mulberry-line);background:var(--mulberry-soft);color:var(--mulberry)}
.hosts-chip-host{border-color:var(--gold-line);background:var(--gold-soft);color:#8a6d2f}
.hosts-chip-coord{border-color:var(--sage-line);background:var(--sage-soft);color:var(--sage)}

.hosts-mini{display:flex;gap:5px;margin-top:9px}
.hosts-pchip{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;
  background:var(--bg);border:1px solid var(--line);filter:grayscale(1);opacity:.4}
.hosts-pchip.on{background:var(--sage-soft);border-color:var(--sage-line);filter:none;opacity:1}

.hosts-right{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:78px}
.hosts-count{font-family:Georgia,serif;font-size:20px;font-weight:700;line-height:1;color:var(--mulberry)}
.hosts-count small{font-size:12px;color:var(--ink-faint);font-family:system-ui}
.hosts-count-l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.hosts-last{font-size:11px;color:var(--ink-faint);margin-top:4px}

.hosts-pend{border-style:dashed;background:var(--bg)}
.hosts-pend-act{flex-direction:row;align-items:center;gap:7px}
.hosts-sm{padding:6px 11px;font-size:12px}
.hosts-revoke{color:var(--rose);border-color:var(--mulberry-line)}
.hosts-revoke:hover{background:var(--mulberry-soft);border-color:var(--rose)}

/* ---- right detail ---- */
.hosts-detail .gd-ini{font-size:22px}
.hosts-hero-chip{margin-top:9px}
.hosts-perm-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;margin:16px 0 4px}
.hosts-perm-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.hosts-perm-ic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:14px;background:var(--gold-soft);border:1px solid var(--gold-line)}
.hosts-perm-meta{flex:1;min-width:0}
.hosts-perm-meta b{font-weight:600;font-size:13.5px}
.hosts-perm-meta small{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:1px}
.hosts-toggle{flex:0 0 auto;width:40px;height:23px;border-radius:99px;background:var(--line);
  position:relative;cursor:pointer;transition:background .14s}
.hosts-toggle i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(30,34,41,.25);transition:left .14s}
.hosts-toggle.on{background:var(--sage)}
.hosts-toggle.on i{left:19px}
.hosts-toggle.lock{cursor:default;opacity:.7}

.hosts-note{margin-top:15px;font-size:12px;color:var(--ink-soft);background:var(--mulberry-soft);
  border:1px solid var(--mulberry-line);border-radius:11px;padding:12px 13px;line-height:1.5}
.hosts-detail-act{display:flex;gap:9px;margin-top:16px}
.hosts-detail-act .btn{flex:1}

/* profile */
/* ===== Profile / settings surface — scoped, palette vars only ===== */

/* desktop 2-col: sticky left section-nav + right content column. fills wide screens
   by adding a 3rd column of breathing room rather than stretching the form. */
.profile-wrap{display:grid;grid-template-columns:248px minmax(0,720px);gap:22px;align-items:start;justify-content:start}
@media(min-width:1500px){.profile-wrap{grid-template-columns:264px minmax(0,820px)}}

/* ---- left section-nav ---- */
.profile-nav{position:sticky;top:0;display:flex;flex-direction:column;gap:4px}
.profile-idcard{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px;margin-bottom:8px}
.profile-bigavatar{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-family:Georgia,serif;font-weight:700;font-size:19px;color:#3a2f12;background:linear-gradient(135deg,var(--gold),#d8b878)}
.profile-idmeta{min-width:0}
.profile-idmeta b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-idmeta small{display:block;color:var(--ink-soft);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-navlist{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:7px}
.profile-navlink{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid transparent;
  background:none;color:var(--ink);font:600 13.5px system-ui;border-radius:10px;padding:9px 11px;cursor:pointer;position:relative}
.profile-navlink:hover{background:var(--gold-soft)}
.profile-navlink.on{background:var(--gold-soft);border-color:var(--gold-line);color:#8a6d2f}
.profile-navlink.on::before{content:"";position:absolute;left:-7px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gold)}
.profile-ni-ico{flex:0 0 auto;width:20px;text-align:center;font-size:15px;opacity:.92}

/* ---- right content column ---- */
.profile-col{display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.profile-col .card{scroll-margin-top:14px}
.profile-secsub{font-size:12px;color:var(--ink-faint)}

/* fields */
.profile-fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.profile-field{margin-bottom:14px}
.profile-field:last-child{margin-bottom:0}
.profile-fgrid .profile-field{margin-bottom:0}
.profile-lbl{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:6px}
.profile-in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:13.5px system-ui;
  background:var(--bg);color:var(--ink);outline:none}
.profile-in:focus{border-color:var(--gold);background:var(--card)}
.profile-inrow{display:flex;align-items:center;gap:10px}
.profile-inrow .profile-in{flex:1}
.profile-hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.45}

/* password rule chips */
.profile-rules{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.profile-rule{font-size:11.5px;font-weight:600;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 11px}

/* notifications grid */
.profile-notif-head{display:grid;grid-template-columns:1fr 64px 64px;gap:10px;align-items:center;
  padding:0 2px 8px;border-bottom:1px solid var(--line)}
.profile-nh-cat{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.profile-nh-ch{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;text-align:center}
.profile-notif-row{display:grid;grid-template-columns:1fr 64px 64px;gap:10px;align-items:center;
  padding:13px 2px;border-bottom:1px solid var(--line)}
.profile-notif-row:last-child{border-bottom:none}
.profile-nm b{font-weight:700;font-size:13.5px}
.profile-nm small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px}

/* quiet hours strip */
.profile-quiet{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:12px}
.profile-qh-ico{flex:0 0 auto;font-size:16px}
.profile-qh-meta{flex:1}.profile-qh-meta b{font-size:13.5px;font-weight:700;color:#8a6d2f}
.profile-qh-meta small{display:block;color:var(--ink-soft);font-size:12px;margin-top:1px}
.profile-qh-time{flex:0 0 auto;font:600 12.5px system-ui;color:#8a6d2f;font-variant-numeric:tabular-nums}

/* privacy rows */
.profile-prow{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.profile-prow:last-child{border-bottom:none}
.profile-prmeta{flex:1}.profile-prmeta b{font-weight:700;font-size:13.5px}
.profile-prmeta small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px;line-height:1.45}
.profile-exp-note{font-size:12.5px;color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line);
  border-radius:11px;padding:11px 13px;line-height:1.5}

/* danger zone */
.profile-danger{border:1px solid var(--mulberry-line);background:var(--mulberry-soft);border-radius:13px;padding:15px 16px;margin-top:4px}
.profile-dg-h{font-family:Georgia,serif;font-size:15px;font-weight:700;color:var(--mulberry)}
.profile-dg-p{margin:5px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.profile-dg-block{margin-top:11px;font-size:12.5px;font-weight:600;color:var(--mulberry);background:var(--card);
  border:1px dashed var(--mulberry-line);border-radius:10px;padding:10px 12px;line-height:1.5}

/* DPO block */
.profile-dpo{border-top:1px dashed var(--line);padding-top:15px}
.profile-dpo b{font-family:Georgia,serif;font-size:14px;font-weight:700}
.profile-dpo p{margin:5px 0 8px;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.profile-dpolink{color:var(--gold);font-weight:600;font-size:12.5px;cursor:pointer}
.profile-dpolink:hover{text-decoration:underline}

/* read-only account values */
.profile-ro{font-weight:600;font-variant-numeric:tabular-nums}

/* toggle switch */
.profile-sw{justify-self:center;width:42px;height:24px;border-radius:99px;border:1px solid var(--line);
  background:var(--bg);cursor:pointer;padding:0;position:relative;transition:background .15s,border-color .15s}
.profile-sw .profile-sw-dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--card);box-shadow:var(--shadow);transition:left .15s}
.profile-sw.on{background:var(--mulberry);border-color:var(--mulberry)}
.profile-sw.on .profile-sw-dot{left:20px}


/* overview */
/* ============================================================
   OVERVIEW surface — scoped extras. Palette vars only; every
   selector ".overview-" prefixed. Dashboard grid, fill-don't-
   stretch (wide screens add columns, never stretch one).
   ============================================================ */

/* section headings used between bands */
.overview-sech{font-family:Georgia,serif;font-size:18px;margin:0 0 2px;font-weight:700}
.overview-subhead{font-family:Georgia,serif;font-size:18px;font-weight:700;margin:22px 0 12px}

/* ---- action-queue banner: routed count tiles ---- */
.overview-qrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:6px}
.overview-qtile{display:grid;grid-template-columns:auto auto 1fr;grid-template-rows:auto auto;align-items:center;
  column-gap:13px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:15px 16px;cursor:pointer;font:inherit;color:var(--ink);
  transition:box-shadow .12s,transform .06s,border-color .12s}
.overview-qtile:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);border-color:var(--gold-line)}
.overview-qico{grid-row:1 / 3;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.overview-qn{font-family:Georgia,serif;font-size:30px;line-height:1;font-weight:700}
.overview-qmeta{grid-column:3;grid-row:1 / 3;min-width:0}
.overview-qmeta b{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overview-qmeta small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overview-qgo{grid-column:2;grid-row:2;font-size:11px;font-weight:700;color:var(--ink-faint);white-space:nowrap}
.overview-qtile:hover .overview-qgo{color:var(--gold)}
/* tone variants — palette vars only */
.overview-qtile.q-mulberry .overview-qico{background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.overview-qtile.q-mulberry .overview-qn{color:var(--mulberry)}
.overview-qtile.q-gold .overview-qico{background:var(--gold-soft);border:1px solid var(--gold-line)}
.overview-qtile.q-gold .overview-qn{color:#8a6d2f}
.overview-qtile.q-sage .overview-qico{background:var(--sage-soft);border:1px solid var(--sage-line)}
.overview-qtile.q-sage .overview-qn{color:var(--sage)}

/* ---- 8-tile platform stat grid ---- */
.overview-statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:4px}
@media(min-width:1700px){.overview-statgrid{grid-template-columns:repeat(8,1fr)}}
.overview-stat{padding:14px 15px}
.overview-stat-top{display:flex;align-items:center;gap:9px}
.overview-stat-ico{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  font-size:14px;background:var(--gold-soft);border:1px solid var(--gold-line)}
.overview-stat .v{font-family:Georgia,serif;font-size:22px;font-weight:700}
.overview-stat .k{font-size:12.5px;color:var(--ink-soft);margin-top:7px;font-weight:600}
.overview-stat-d{font-size:11px;color:var(--ink-faint);margin-top:2px}

/* ---- main grid: activity | approvals+pool | KPI rail ---- */
.overview-grid{display:grid;gap:18px;align-items:start;margin-top:18px;
  grid-template-columns:1fr 360px;
  grid-template-areas:"act mid" "rail rail"}
.overview-c-act{grid-area:act}.overview-c-mid{grid-area:mid}.overview-c-rail{grid-area:rail}
/* wide: 3 real columns — activity | approvals+pool | KPI rail */
@media(min-width:1700px){
  .overview-grid{grid-template-columns:1.5fr 1fr 360px;
    grid-template-areas:"act mid rail"}
}

/* activity feed dot tones */
.overview-fdot.t-mulberry{background:var(--mulberry-soft);border-color:var(--mulberry-line);color:var(--mulberry)}
.overview-fdot.t-gold{background:var(--gold-soft);border-color:var(--gold-line);color:#8a6d2f}
.overview-fdot.t-sage{background:var(--sage-soft);border-color:var(--sage-line);color:var(--sage)}

/* two-admin approvals */
.overview-cp{padding:4px 11px;font-size:11.5px}
.overview-apb{display:flex;flex-direction:column;gap:0}
.overview-approw{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.overview-appico{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font-size:15px;
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.overview-appmeta{flex:1;min-width:0}
.overview-appmeta b{font-weight:700;font-size:13px}
.overview-appmeta small{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:1px}
.overview-apptag{flex:0 0 auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.overview-appact{padding-top:13px}
.overview-appact .btn{width:100%}

/* team pool widget */
.overview-poolmo{font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
.overview-poolnums{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:11px}
.overview-poolbig{font-family:Georgia,serif;font-size:30px;line-height:1;font-weight:700;color:var(--sage)}
.overview-poolbig small{display:block;font-family:system-ui;font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-faint);font-weight:700;margin-top:5px}
.overview-poolside{display:flex;flex-direction:column;gap:7px;text-align:right}
.overview-poolside>div{display:flex;flex-direction:column;line-height:1.25}
.overview-pk{font-size:11px;color:var(--ink-faint)}
.overview-poolside b{font-size:13px;font-variant-numeric:tabular-nums}
.overview-poolbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.overview-poolbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),#7c8f54)}
.overview-poolnote{font-size:11px;color:var(--ink-faint);margin-top:9px}
.overview-poolh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;margin:15px 0 6px;padding-top:13px;border-top:1px dashed var(--line)}
.overview-poolrow{display:flex;align-items:baseline;gap:10px;padding:6px 0;font-size:12.5px}
.overview-poolname{font-weight:600;flex:0 0 auto}
.overview-poolsku{color:var(--ink-soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overview-poolamt{flex:0 0 auto;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:11.5px}

/* KPI rail cards */
.overview-kpis{display:flex;flex-direction:column;gap:16px}
.overview-kpi+.overview-kpi{padding-top:16px;border-top:1px solid var(--line)}
.overview-kpi-v{font-family:Georgia,serif;font-size:26px;font-weight:700;line-height:1}
.overview-kpi-k{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:4px}
.overview-kpi-d{font-size:11px;color:var(--ink-faint);margin-top:2px}
.overview-kpi .bar{height:5px;border-radius:99px;background:var(--line);margin-top:9px;overflow:hidden}
.overview-kpi .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#d8b878)}

/* platform health rows */
.overview-health{display:flex;flex-direction:column}
.overview-hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.overview-hrow:last-child{border-bottom:none}
.overview-hdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.overview-hdot.ok{background:var(--sage)}
.overview-hdot.warn{background:var(--gold)}
.overview-hs{flex:1}
.overview-hv{font-size:12px;font-weight:600}
.overview-hv.ok{color:var(--sage)}
.overview-hv.warn{color:#8a6d2f}

/* payments */
/* ============================================================
   PAYMENTS surface — scoped extras (palette vars only).
   Every selector is ".payments-" prefixed. Reuses the shared design
   system (.frail / .gtable / .gdetail / .pill / .btn / .statstrip).
   ============================================================ */

/* 3-pane body — same shape as .guestwrap (filter rail | table | detail).
   FILL-DON'T-STRETCH: on ultrawide the TABLE column grows + the detail widens;
   the rail + detail stay sticky, nothing is stretched. */
.payments-wrap{display:grid;grid-template-columns:236px 1fr 392px;gap:16px;align-items:start}
@media(min-width:1700px){.payments-wrap{grid-template-columns:264px 1.2fr 440px}}

.payments-wrap .frail,.payments-wrap .gdetail{position:sticky;top:0}

/* ---- left rail note ---- */
.payments-railnote{display:flex;gap:9px;margin-top:16px;padding:11px 12px;border-radius:11px;
  background:var(--gold-soft);border:1px solid var(--gold-line);font-size:11.5px;line-height:1.45;color:#8a6d2f}
.payments-railnote span{flex:0 0 auto;font-size:14px;line-height:1.2}
.payments-railnote b{font-weight:700}

/* ---- center table cells ---- */
.payments-vend b{font-weight:600;font-size:13.5px}
.payments-vend small{display:block;color:var(--ink-faint);font-size:11px;max-width:30ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.payments-amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.payments-amt small{display:block;font-weight:500;color:var(--ink-faint);font-size:10.5px}

.payments-ref{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em;font-size:13px;
  font-family:Georgia,serif;color:var(--ink)}
.payments-meth{display:block;color:var(--ink-faint);font-size:10.5px;margin-top:1px}

.payments-flag{margin-left:5px;font-size:11px;vertical-align:1px}

/* SLA chip — green/amber/red dot against the 24-hr SLA */
.payments-sla{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;border-radius:99px;padding:3px 9px;border:1px solid var(--line);white-space:nowrap}
.payments-sladot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.payments-sla.green{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}
.payments-sla.green .payments-sladot{background:var(--sage)}
.payments-sla.amber{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.payments-sla.amber .payments-sladot{background:var(--gold)}
.payments-sla.red{color:var(--rose);background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.payments-sla.red .payments-sladot{background:var(--rose)}
.payments-slaq{color:var(--ink-faint);font-size:11.5px;font-style:italic}

/* ---- right detail hero ---- */
.payments-hero{text-align:center;background:linear-gradient(180deg,var(--mulberry-soft),transparent)}
.payments-refbig{font-family:Georgia,serif;font-size:13px;letter-spacing:.12em;font-weight:700;
  color:var(--mulberry);font-variant-numeric:tabular-nums;margin-bottom:2px}
.payments-hero .gd-name{font-size:26px}
.payments-herotags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.payments-methtag{font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--card);
  border:1px solid var(--line);border-radius:99px;padding:3px 9px}

/* detail value helpers */
.payments-amt2{font-weight:700;font-variant-numeric:tabular-nums}
.payments-mono{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 9px;letter-spacing:.02em}
.payments-ok{color:var(--sage);font-weight:700}
.payments-warn{color:var(--rose);font-weight:700}
.payments-prior{font-size:12.5px;color:var(--ink-soft)}
.payments-prior b{font-variant-numeric:tabular-nums}

/* section labels inside the detail body */
.payments-sectlbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;margin:18px 0 9px}

/* screenshot placeholder */
.payments-shot{border:1px solid var(--line);border-radius:12px;padding:18px 16px;text-align:center;
  background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 11px,var(--card) 11px,var(--card) 22px)}
.payments-shot.empty{background:var(--bg);border-style:dashed}
.payments-shotbadge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin-bottom:12px}
.payments-shoticon{font-size:34px;line-height:1;opacity:.9}
.payments-shottxt{font-weight:700;font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
.payments-shotsub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.payments-shotzoom{margin-top:13px;font:600 12px system-ui;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);border-radius:9px;padding:7px 14px;cursor:pointer}
.payments-shotzoom:hover{border-color:var(--gold-line);color:var(--ink)}

/* 4-tier fuzzy matcher card — tone driven by confidence */
.payments-match{border-radius:12px;padding:13px 14px;border:1px solid var(--line);background:var(--card)}
.payments-match.sage{background:var(--sage-soft);border-color:var(--sage-line)}
.payments-match.gold{background:var(--gold-soft);border-color:var(--gold-line)}
.payments-match.rose{background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.payments-matchhead{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.payments-matchico{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:16px;background:var(--card);border:1px solid var(--line)}
.payments-match.sage .payments-matchico{color:var(--sage)}
.payments-match.rose .payments-matchico{color:var(--rose)}
.payments-matchhd b{display:block;font-size:13.5px;font-weight:700}
.payments-match.sage .payments-matchhd b{color:var(--sage)}
.payments-match.gold .payments-matchhd b{color:#8a6d2f}
.payments-match.rose .payments-matchhd b{color:var(--mulberry)}
.payments-matchhd small{display:block;font-size:11px;color:var(--ink-soft);margin-top:1px;font-variant-numeric:tabular-nums}
.payments-matchnote{font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
.payments-matchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.payments-matchrow span{color:var(--ink-soft)}
.payments-matchrow b{font-weight:700}

/* reconciliation quick-link tools */
.payments-tools{display:flex;flex-direction:column;gap:8px}
.payments-tool{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:10px 12px;font:600 12.5px system-ui;color:var(--ink);cursor:pointer;text-align:left}
.payments-tool span{flex:0 0 auto}
.payments-tool:hover{border-color:var(--gold-line);background:var(--gold-soft)}

/* action bar — Approve / Needs more proof / Reject permanently */
.payments-actions{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.payments-actions .btn{flex:1;min-width:0;text-align:center;padding:10px 8px;white-space:nowrap}
.payments-actions .btn.primary{flex:1.3}
.payments-danger{color:var(--rose);border-color:var(--mulberry-line);background:var(--mulberry-soft)}
.payments-danger:hover{border-color:var(--rose);color:var(--rose);filter:brightness(.99)}

.payments-settled{flex:1;display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.45;
  color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line);border-radius:11px;padding:12px 13px;font-weight:600}
.payments-settled span{flex:0 0 auto;font-size:15px;line-height:1.2}
.payments-settled.muted{color:var(--ink-soft);background:var(--bg);border-color:var(--line)}

/* verify */
/* ============================================================
   VERIFY surface — scoped extras. Palette vars only.
   Every selector ".verify-" prefixed. Reuses the shared design system
   (.surfhead .btn .pill .frail .gtable .gdetail .gd-row .gd-hero .fchips
   .fchip .fstat .count .statstrip .stat .vlogo .gname .gn-meta .tabletag).
   ============================================================ */

/* ---- top tabs (Applications / Visibility) — schedule-seg shape ---- */
.verify-tabs{display:flex;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;
  width:fit-content;margin-bottom:18px}
.verify-tabs button{font:600 13px system-ui;border:1px solid transparent;background:none;color:var(--ink-soft);
  border-radius:9px;padding:8px 16px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.verify-tabs button:hover{color:var(--ink)}
.verify-tabs button.on{background:var(--card);color:var(--mulberry);border-color:var(--mulberry-line);box-shadow:var(--shadow)}
.verify-tabs .count{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--line);border-radius:99px;
  padding:1px 7px;font-variant-numeric:tabular-nums}
.verify-tabs button.on .count{color:var(--mulberry);background:var(--mulberry-soft)}

/* ---- 3-pane shell — same shape as .guestwrap; FILL-DON'T-STRETCH: the list column grows on ultrawide, panes stay sticky ---- */
.verify-wrap{display:grid;grid-template-columns:240px 1fr 396px;gap:16px;align-items:start}
@media(min-width:1700px){.verify-wrap{grid-template-columns:264px 1.1fr 440px}}

/* ---- left rail extras ---- */
.verify-pulse{border:1px solid var(--sage-line);background:var(--sage-soft);border-radius:12px;padding:14px;text-align:center;margin-bottom:6px}
.verify-pulse .vp-ico{font-size:24px;line-height:1}
.verify-pulse .vp-t{font-family:Georgia,serif;font-weight:700;font-size:15px;margin-top:6px;color:var(--sage)}
.verify-pulse .vp-s{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4}
.verify-pulse.warn{border-color:var(--mulberry-line);background:var(--mulberry-soft)}
.verify-pulse.warn .vp-t{color:var(--mulberry)}

.verify-note{font-size:11.5px;line-height:1.5;color:var(--ink-soft);background:var(--gold-soft);
  border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px}
.verify-note b{color:#8a6d2f;font-variant-numeric:tabular-nums}

/* ---- middle list column (cards) ---- */
.verify-listcol{display:flex;flex-direction:column;gap:12px}
.verify-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 16px;cursor:pointer;transition:box-shadow .12s,transform .06s,border-color .12s;position:relative}
.verify-item:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.verify-item.sel{border-color:var(--gold-line);background:var(--gold-soft)}
.verify-item.sel::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--gold)}

.verify-item .vi-top{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.verify-item .vi-meta{flex:1;min-width:0}
.verify-item .vi-meta b{font-weight:700;font-size:14px;display:block}
.verify-item .vi-meta small{display:block;color:var(--ink-faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verify-item .vi-body{font-size:13px;color:var(--ink);margin-bottom:9px}
.verify-item .vi-prog{font-weight:600;color:var(--mulberry);font-variant-numeric:tabular-nums}
.verify-item .vi-foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap}
.verify-item .vi-ref{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-soft)}
.verify-item .vi-sep{color:var(--ink-faint)}
.verify-item .vi-sla.over{color:var(--rose);font-weight:700}
.verify-item .vi-city{color:var(--ink-faint)}

.verify-emptylist{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:46px 24px;text-align:center;color:var(--ink-faint)}
.verify-emptylist .bi{font-size:32px;opacity:.6;margin-bottom:8px}

/* ---- right detail pane (extends shared .gdetail) ---- */
.verify-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
  background:linear-gradient(180deg,var(--gold-soft),transparent)}
.verify-hero .vd-vendor{display:flex;align-items:center;gap:11px}
.verify-hero .vlogo{width:44px;height:44px;font-size:18px}
.verify-hero .gd-name{font-size:18px}
.verify-hero .gd-sub{margin-top:1px}
.verify-herotype{align-self:flex-start;white-space:nowrap}

.verify-detail .vd-mono{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
.verify-detail .vd-amt{font-weight:700;color:var(--mulberry);font-variant-numeric:tabular-nums}

/* screening strip (Persona / AMLC / reverse-image) */
.verify-screen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.verify-scr{border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:center;background:var(--card)}
.verify-scr small{display:block;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
.verify-scr b{display:block;font-size:13px;font-weight:700;margin-top:3px}
.verify-scr.ok{background:var(--sage-soft);border-color:var(--sage-line)} .verify-scr.ok b{color:var(--sage)}
.verify-scr.warn{background:var(--gold-soft);border-color:var(--gold-line)} .verify-scr.warn b{color:#8a6d2f}
.verify-scr.bad{background:var(--mulberry-soft);border-color:var(--mulberry-line)} .verify-scr.bad b{color:var(--mulberry)}

/* checklist head */
.verify-checkhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:18px 0 10px}

/* the 12-document checklist */
.verify-checklist{display:flex;flex-direction:column;gap:6px}
.verify-check{display:flex;align-items:center;gap:11px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.verify-check .vc-mark{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--line);color:var(--ink-soft)}
.verify-check .vc-body{flex:1;min-width:0}
.verify-check .vc-body b{display:block;font-size:13px;font-weight:600}
.verify-check .vc-body small{display:block;font-size:11px;color:var(--ink-faint)}
.verify-check .vc-state{flex:0 0 auto;font-size:11px;font-weight:700}
.verify-check.in{border-color:var(--sage-line);background:var(--sage-soft)}
.verify-check.in .vc-mark{background:var(--sage);color:#fff} .verify-check.in .vc-state{color:var(--sage)}
.verify-check.review{border-color:var(--gold-line);background:var(--gold-soft)}
.verify-check.review .vc-mark{background:var(--gold);color:#3a2f12} .verify-check.review .vc-state{color:#8a6d2f}
.verify-check.pending .vc-mark{background:var(--line);color:var(--ink-faint)} .verify-check.pending .vc-state{color:var(--ink-soft)}
.verify-check.na{opacity:.6} .verify-check.na .vc-state{color:var(--ink-faint)}

/* custom-category 4 outcomes */
.verify-outcomes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.verify-outcome{display:flex;align-items:flex-start;gap:9px;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:11px;padding:10px 11px;cursor:pointer;transition:border-color .12s,background .12s}
.verify-outcome:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.verify-outcome .vo-ic{flex:0 0 auto;font-size:16px;line-height:1.2}
.verify-outcome .vo-b b{display:block;font-size:12.5px;font-weight:700}
.verify-outcome .vo-b small{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35}

/* reviewer note */
.verify-revnote{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line);background:var(--bg);
  border-radius:11px;padding:12px 13px;margin:16px 0 4px}
.verify-revnote .vrn-ic{font-size:16px;line-height:1.2;flex:0 0 auto}
.verify-revnote b{display:block;font-size:12.5px;font-weight:700}
.verify-revnote small{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.5}

/* decision action bar */
.verify-actions{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.verify-escalate{width:100%;margin-top:9px;border:1px dashed var(--mulberry-line);background:var(--mulberry-soft);
  color:var(--mulberry);font:600 12.5px system-ui;border-radius:10px;padding:9px 12px;cursor:pointer}
.verify-escalate:hover{filter:brightness(.98)}

/* ============================================================ VISIBILITY tab ============================================================ */
.verify-vis{display:block}
.verify-visstrip{grid-template-columns:repeat(4,1fr);margin-bottom:18px}

.verify-vistable{overflow:hidden}
.verify-vistable tbody td{vertical-align:middle}
.verify-sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.verify-sdot.verified{background:var(--sage)}
.verify-sdot.coming{background:var(--gold)}
.verify-sdot.demoted{background:var(--rose)}

.verify-perk{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 10px;
  color:var(--ink-faint);background:var(--bg);border:1px solid var(--line)}
.verify-perk.on{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}

.verify-tierbtn{font:600 11.5px system-ui;border-radius:9px;padding:6px 10px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.verify-tierbtn:hover{border-color:var(--gold-line);color:var(--ink)}
.verify-tierbtn.promote{color:var(--mulberry);border-color:var(--mulberry-line);background:var(--mulberry-soft)}
.verify-2a{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;
  background:var(--mulberry);border-radius:99px;padding:1px 6px}

.verify-visfoot{margin-top:14px;font-size:12px;line-height:1.55;color:var(--ink-soft);
  background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.verify-visfoot b{color:var(--ink)}

/* disputes */
/* ===== DISPUTES surface — scoped extras. Palette vars only; every selector ".disputes-" prefixed. ===== */

/* three-column list-detail: status/stats rail | disputes table | case file. Fills wide screens by widening the case pane. */
.disputes-wrap{display:grid;grid-template-columns:236px 1fr 412px;gap:16px;align-items:start}
@media(min-width:1700px){.disputes-wrap{grid-template-columns:264px 1fr 480px}}
/* narrower desktop: drop the case pane into the column flow */
@media(max-width:1320px){.disputes-wrap{grid-template-columns:236px 1fr}}

/* ---- left rail extras ---- */
.disputes-exposure{background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:12px;padding:12px 14px}
.disputes-exposure .de-n{font-family:Georgia,serif;font-size:23px;font-weight:700;color:var(--mulberry);line-height:1;font-variant-numeric:tabular-nums}
.disputes-exposure .de-l{font-size:11.5px;color:var(--mulberry);margin-top:4px}
.disputes-gate{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 12px;border:1px solid var(--gold-line);background:var(--gold-soft);border-radius:11px}
.disputes-gate .dg-ico{font-size:16px;line-height:1.3;flex:0 0 auto;color:#8a6d2f}
.disputes-gate b{display:block;font-size:12.5px;color:#8a6d2f}
.disputes-gate small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}

/* ---- table cell extras ---- */
.disputes-ref{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.04em;color:var(--ink-soft)}
.disputes-fmtag{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:5px;padding:1px 5px;vertical-align:1px}
.disputes-hv{color:#8a6d2f;font-size:12px;cursor:help}

/* ---- right case file ---- */
.disputes-case{display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
.disputes-case .gd-b{overflow-y:auto}
.disputes-case .gd-b::-webkit-scrollbar{width:8px}
.disputes-case .gd-b::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.disputes-herometa{font-size:11.5px;color:var(--ink-soft);margin-top:8px}
.disputes-slaok{color:var(--sage);font-weight:600}
.disputes-slabad{color:var(--rose);font-weight:600}

/* facts strip */
.disputes-facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.disputes-facts .df-cell{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.disputes-facts .df-cell:nth-child(3){grid-column:1 / -1}
.disputes-facts .df-k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.disputes-facts .df-v{font-family:Georgia,serif;font-size:16px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.disputes-facts .df-v.df-small{font-family:system-ui;font-size:12.5px;font-weight:600;color:var(--ink)}

/* force-majeure banner */
.disputes-fmbanner{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:11px 13px;border:1px solid var(--mulberry-line);background:var(--mulberry-soft);border-radius:12px}
.disputes-fmbanner span{font-size:18px;line-height:1.2;flex:0 0 auto}
.disputes-fmbanner b{display:block;font-size:13px;color:var(--mulberry)}
.disputes-fmbanner small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}

/* content blocks (claim · evidence · vendor response) */
.disputes-block{margin-top:18px}
.disputes-blockh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:9px}
.disputes-blockh .db-who{font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--ink-soft);font-weight:600}
.disputes-narr{margin:0;font-size:13px;line-height:1.6;color:var(--ink);border-left:3px solid var(--gold-line);padding:2px 0 2px 13px}
.disputes-narr-v{border-left-color:var(--line);color:var(--ink-soft)}

/* evidence thumbnails */
.disputes-evgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.disputes-ev{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px;cursor:pointer;min-width:0}
.disputes-ev:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.disputes-ev .de-ic{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--gold-soft);border:1px solid var(--gold-line)}
.disputes-ev .de-meta{min-width:0}
.disputes-ev .de-meta b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disputes-ev .de-meta small{display:block;font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* recommended-refund callout */
.disputes-rec{margin-top:18px;border:1px solid var(--gold-line);background:linear-gradient(180deg,var(--gold-soft),transparent);border-radius:13px;padding:14px 16px}
.disputes-rec .dr-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.disputes-rec .dr-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a6d2f;font-weight:700}
.disputes-rec .dr-amt{font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--mulberry);font-variant-numeric:tabular-nums}
.disputes-rec .dr-body{margin:9px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink-soft)}

/* two-admin gate */
.disputes-twoadmin{margin-top:14px;border:1px dashed var(--mulberry-line);background:var(--mulberry-soft);border-radius:12px;padding:13px 14px}
.disputes-twoadmin.armed{border-style:solid;border-color:var(--sage-line);background:var(--sage-soft)}
.disputes-twoadmin .dt-row{display:flex;gap:11px;align-items:flex-start}
.disputes-twoadmin .dt-ico{font-size:16px;line-height:1.3;flex:0 0 auto;color:var(--mulberry)}
.disputes-twoadmin.armed .dt-ico{color:var(--sage)}
.disputes-twoadmin .dt-txt b{display:block;font-size:13px;color:var(--mulberry)}
.disputes-twoadmin.armed .dt-txt b{color:var(--sage)}
.disputes-twoadmin .dt-txt small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}

/* resolution actions */
.disputes-actions{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:9px}
.disputes-actionh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.disputes-actgrid{display:grid;grid-template-columns:1fr;gap:8px}
.disputes-disabled{opacity:.45;pointer-events:none;filter:grayscale(.3)}
.disputes-lognote{font-size:11px;color:var(--ink-faint);line-height:1.5;margin-top:3px}
.disputes-lognote b{color:var(--ink-soft);font-weight:600;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10.5px}

/* closed-case footer */
.disputes-closed{display:flex;gap:11px;align-items:flex-start;margin-top:18px;padding:12px 14px;border:1px solid var(--sage-line);background:var(--sage-soft);border-radius:12px}
.disputes-closed span{font-size:16px;color:var(--sage);flex:0 0 auto;line-height:1.3}
.disputes-closed b{display:block;font-size:13px;color:var(--sage)}
.disputes-closed small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}

/* forcemajeure */
/* ===== FORCE MAJEURE surface — scoped extras. Palette vars only; every selector ".forcemajeure-" prefixed. ===== */

/* three-column body: flag rail | mediation detail | policy aside.
   Fills wide screens by ADDING the aside column + widening the rail; the center never stretches. */
.forcemajeure-wrap{display:grid;grid-template-columns:264px 1fr 0;gap:16px;align-items:start}
.forcemajeure-aside{display:none}
@media(min-width:1280px){
  .forcemajeure-wrap{grid-template-columns:272px 1fr 320px}
  .forcemajeure-aside{display:flex}
}
@media(min-width:1700px){
  .forcemajeure-wrap{grid-template-columns:300px 1fr 372px}
}

/* ---- LEFT rail: flag cards ---- */
.forcemajeure-flaglist{display:flex;flex-direction:column;gap:8px;margin:0 -4px 4px;padding:0 4px;max-height:420px;overflow-y:auto}
.forcemajeure-flaglist::-webkit-scrollbar{width:7px}
.forcemajeure-flaglist::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px}
.forcemajeure-noflag{font-size:12.5px;color:var(--ink-faint);padding:14px 4px}

.forcemajeure-flagcard{display:block;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;transition:border-color .12s,box-shadow .12s}
.forcemajeure-flagcard:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.forcemajeure-flagcard.sel{border-color:var(--mulberry-line);background:var(--mulberry-soft);box-shadow:var(--shadow)}
.forcemajeure-flagtop{display:flex;align-items:flex-start;gap:9px}
.forcemajeure-trig{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;
  background:var(--alabaster);border:1px solid var(--line)}
.forcemajeure-flagcard.sel .forcemajeure-trig{background:var(--card);border-color:var(--mulberry-line)}
.forcemajeure-flagmeta{flex:1;min-width:0}
.forcemajeure-flagmeta b{font-weight:700;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.forcemajeure-flagmeta small{font-size:11px;color:var(--ink-soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.forcemajeure-flagtop .pill{flex:0 0 auto;align-self:flex-start}
.forcemajeure-flagfoot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.forcemajeure-flagid{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.forcemajeure-age{font-size:11px;font-weight:600;color:var(--ink-soft)}
.forcemajeure-age.hot{color:var(--mulberry)}

/* ---- CENTER detail ---- */
.forcemajeure-detail{display:flex;flex-direction:column;gap:16px;min-width:0}

/* disruption banner */
.forcemajeure-banner{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;
  border:1px solid var(--mulberry-line);border-radius:var(--radius);background:var(--mulberry-soft);box-shadow:var(--shadow)}
.forcemajeure-bantrig{flex:0 0 auto;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;
  background:var(--card);border:1px solid var(--mulberry-line)}
.forcemajeure-baninfo{flex:1;min-width:0}
.forcemajeure-bantitle{font-family:Georgia,serif;font-size:16.5px;font-weight:700;line-height:1.35;color:var(--ink)}
.forcemajeure-banmeta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:5px;font-size:12.5px;color:var(--ink-soft)}
.forcemajeure-banmeta b{color:var(--mulberry)}
.forcemajeure-dot{color:var(--ink-faint)}
.forcemajeure-banright{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.forcemajeure-agetag{font-size:11px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.forcemajeure-agetag.hot{color:var(--mulberry);font-weight:700}

/* affected-bookings table — reuses global table/thead/tbody styling */
.forcemajeure-tablebox{overflow:hidden;border-radius:0 0 var(--radius) var(--radius)}
.forcemajeure-vend{display:flex;align-items:center;gap:10px}
.forcemajeure-vlogo{flex:0 0 auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:var(--gold-soft);border:1px solid var(--gold-line)}
.forcemajeure-stage{color:var(--ink-soft);font-size:12.5px;max-width:220px}
.forcemajeure-paid{font-variant-numeric:tabular-nums}
.forcemajeure-bal{display:block;color:var(--ink-soft);font-size:11px}
.forcemajeure-full{display:block;color:var(--sage);font-size:11px}
.forcemajeure-ref{font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 7px}

/* resolution options grid */
.forcemajeure-outgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px}
.forcemajeure-outcard{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;transition:border-color .12s,box-shadow .12s,background .12s}
.forcemajeure-outcard:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.forcemajeure-outcard.proposed{border-color:var(--gold-line)}
.forcemajeure-outcard.chosen{border-color:var(--mulberry);background:var(--mulberry-soft);box-shadow:var(--shadow)}
.forcemajeure-outhead{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700}
