.forcemajeure-outico{flex:0 0 auto;font-size:17px}
.forcemajeure-check{margin-left:auto;color:var(--mulberry);font-weight:700}
.forcemajeure-outdesc{font-size:12px;color:var(--ink-soft);line-height:1.45}
.forcemajeure-outtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.forcemajeure-outtags.forcemajeure-none{font-size:11px;color:var(--ink-faint);font-style:italic}
.forcemajeure-party{font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 8px;letter-spacing:.02em}
.forcemajeure-party.couple{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.forcemajeure-party.vendor{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}
.forcemajeure-party.policy{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}

/* chat history */
.forcemajeure-chat{display:flex;flex-direction:column;gap:12px;max-height:340px;overflow-y:auto}
.forcemajeure-chat::-webkit-scrollbar{width:8px}
.forcemajeure-chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.forcemajeure-msg{display:flex;gap:10px;align-items:flex-start}
.forcemajeure-msg.vendor{flex-direction:row-reverse}
.forcemajeure-msgini{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff}
.forcemajeure-bubble{flex:1;min-width:0;max-width:84%;border:1px solid var(--line);border-radius:13px;padding:9px 12px;background:var(--bg)}
.forcemajeure-msg.couple .forcemajeure-bubble{background:var(--mulberry-soft);border-color:var(--mulberry-line);border-top-left-radius:4px}
.forcemajeure-msg.vendor .forcemajeure-bubble{background:var(--sage-soft);border-color:var(--sage-line);border-top-right-radius:4px}
.forcemajeure-msgtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:3px}
.forcemajeure-msgtop b{font-size:12.5px;font-weight:700}
.forcemajeure-msgtime{font-size:11px;color:var(--ink-faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.forcemajeure-msgbody{font-size:13px;line-height:1.5;color:var(--ink)}

/* decision dock */
.forcemajeure-dock{border-color:var(--gold-line)}
.forcemajeure-dockline{font-size:13px;color:var(--ink);line-height:1.5;padding:2px 0 12px}
.forcemajeure-dockline b{font-weight:700}
.forcemajeure-gate{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.5;color:var(--mulberry);
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:11px;padding:11px 13px;margin-bottom:13px}
.forcemajeure-gate span{font-size:15px;flex:0 0 auto}
.forcemajeure-gate b{font-weight:700}
.forcemajeure-dockact{display:flex;flex-wrap:wrap;gap:9px}
.forcemajeure-dockact .btn{flex:0 0 auto}
.forcemajeure-dockact .btn.primary{flex:1;min-width:200px}
.forcemajeure-dockact .btn[disabled]{opacity:.5;cursor:not-allowed}
.forcemajeure-reject{color:var(--rose);border-color:var(--mulberry-line)}
.forcemajeure-reject:hover{background:var(--mulberry-soft);border-color:var(--rose)}
.forcemajeure-dockhint{font-size:11.5px;color:var(--ink-faint);line-height:1.45;margin-top:11px}

/* ---- RIGHT aside ---- */
.forcemajeure-polhead{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.forcemajeure-polhead .forcemajeure-outico{font-size:22px;width:40px;height:40px;display:grid;place-items:center;border-radius:11px;
  background:var(--gold-soft);border:1px solid var(--gold-line)}
.forcemajeure-polhead b{font-weight:700;font-size:14px;display:block}
.forcemajeure-polhead small{font-size:11.5px;color:var(--ink-soft);text-transform:capitalize}
.forcemajeure-polnote{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-soft)}

/* escalation timeline */
.forcemajeure-tlrow{display:flex;gap:11px;align-items:flex-start;padding-bottom:14px;position:relative}
.forcemajeure-tlrow::before{content:"";position:absolute;left:14px;top:28px;bottom:-2px;width:2px;background:var(--line)}
.forcemajeure-tlrow.last::before{display:none}
.forcemajeure-tlrow.done::before{background:var(--sage-line)}
.forcemajeure-tlico{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;
  background:var(--bg);border:1px solid var(--line);color:var(--ink-faint);z-index:1}
.forcemajeure-tlrow.done .forcemajeure-tlico{background:var(--sage-soft);border-color:var(--sage-line)}
.forcemajeure-tlbody b{font-size:13px;font-weight:600;display:block}
.forcemajeure-tlbody small{font-size:11.5px;color:var(--ink-soft)}

/* evidence list */
.forcemajeure-evlist{display:flex;flex-direction:column;gap:8px}
.forcemajeure-evrow{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);cursor:pointer;transition:border-color .12s}
.forcemajeure-evrow:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.forcemajeure-evico{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:var(--alabaster);border:1px solid var(--line)}
.forcemajeure-evmeta{flex:1;min-width:0}
.forcemajeure-evmeta b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.forcemajeure-evmeta small{font-size:11px;color:var(--ink-soft)}
.forcemajeure-evdl{flex:0 0 auto;color:var(--ink-faint);font-size:14px}

/* reviews */
/* ===== REVIEWS surface — scoped extras. Palette vars only; every selector ".reviews-" prefixed. ===== */

/* three-column list-detail: filter rail | queue table | detail. Fills wide screens by widening the detail
   (which itself splits into review-body + context columns) — never stretches one column. */
.reviews-wrap{display:grid;grid-template-columns:236px 1fr 392px;gap:16px;align-items:start}
@media(min-width:1700px){.reviews-wrap{grid-template-columns:264px 1.05fr 720px}}

/* surfhead extras */
.reviews-sla{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mulberry);
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:5px 12px}

/* left rail note */
.reviews-note{font-size:12px;line-height:1.5;color:var(--ink-soft);background:var(--bg);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px}
.reviews-note b{color:var(--ink);font-weight:700}

/* table rating cell */
.reviews-stars{color:var(--gold);letter-spacing:.06em;font-size:13px}
.reviews-stars.lg{font-size:22px;letter-spacing:.08em}
.reviews-ratecell{white-space:nowrap}
.reviews-ratenum{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-soft);font-size:12.5px}
.reviews-open{font-size:12px;font-weight:600;color:var(--ink-faint)}

/* ---- detail pane ---- */
.reviews-detail{position:sticky;top:0}
.reviews-heropills{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.reviews-ref{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.reviews-link{color:var(--gold);font-weight:600;cursor:pointer}

/* the gd-b becomes a 2-col grid on ultrawide so review-body + context sit side by side (FILL-DON'T-STRETCH) */
@media(min-width:1700px){
  .reviews-detail .gd-b{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
  .reviews-main{padding-right:22px;border-right:1px solid var(--line)}
  .reviews-actions{grid-column:1 / -1}
}

.reviews-seclabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:16px 0 9px}
.reviews-main .reviews-seclabel:first-child,.reviews-ctx .reviews-seclabel:first-child{margin-top:0}

/* big overall rating */
.reviews-bigstars{display:flex;align-items:baseline;gap:11px;margin-bottom:11px}
.reviews-bignum{font-family:Georgia,serif;font-size:26px;font-weight:700;line-height:1}
.reviews-bignum small{font-size:13px;color:var(--ink-faint);font-family:system-ui;font-weight:600}

/* review body quote */
.reviews-body{margin:0;font-family:Georgia,serif;font-size:15px;line-height:1.6;color:var(--ink);
  border-left:3px solid var(--gold-line);background:var(--gold-soft);border-radius:0 11px 11px 0;padding:13px 16px}
body.dark .reviews-body{background:var(--gold-soft)}

/* 5-dimension breakdown */
.reviews-dims{display:flex;flex-direction:column;gap:9px}
.reviews-dimrow{display:grid;grid-template-columns:108px 1fr auto auto;align-items:center;gap:10px;font-size:13px}
.reviews-dimk{color:var(--ink-soft)}
.reviews-dimbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.reviews-dimbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#d8b878)}
.reviews-dimstars{color:var(--gold);letter-spacing:.04em;font-size:12px}
.reviews-dimn{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-soft);min-width:24px;text-align:right}

/* context callouts */
.reviews-callout{font-size:12.5px;line-height:1.5;border-radius:11px;padding:11px 13px;margin-top:9px;border:1px solid var(--line);background:var(--bg)}
.reviews-callout b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.reviews-callout.flag{background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.reviews-callout.flag b{color:var(--mulberry)}
.reviews-callout.match{background:var(--gold-soft);border-color:var(--gold-line)}
.reviews-callout.match b{color:#8a6d2f}
.reviews-callout.appeal{background:var(--sage-soft);border-color:var(--sage-line);font-style:italic}
.reviews-callout.appeal b{color:var(--sage);font-style:normal}
.reviews-lock{font-size:12px;font-weight:600;color:var(--rose);background:var(--mulberry-soft);
  border:1px solid var(--mulberry-line);border-radius:10px;padding:9px 11px;margin-top:10px}

/* actions */
.reviews-actions{display:flex;flex-direction:column;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.reviews-act{font:600 13px system-ui;border-radius:10px;padding:11px 14px;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--ink);text-align:left;transition:filter .12s,border-color .12s}
.reviews-act:hover{border-color:var(--gold-line)}
.reviews-act.yes{background:var(--mulberry);color:#fff;border-color:var(--mulberry)}
.reviews-act.yes:hover{filter:brightness(1.08)}
.reviews-act.pending{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.reviews-act.no{color:var(--rose);background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.reviews-act.no.danger{color:#fff;background:var(--rose);border-color:var(--rose)}
.reviews-act:disabled{opacity:.45;cursor:not-allowed}
.reviews-act:disabled:hover{border-color:var(--line);filter:none}
.reviews-resolved{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:9px}

/* help */
/* ============================================================
   HELP — Support-inbox surface (admin console · 0023 § Help inbox · 0029 § 7)
   Scoped extras only. Palette vars only — every selector is ".help-" prefixed.
   3-pane list-detail (queue · thread · context) that mirrors the house
   .messages-* / .guestwrap patterns. Fill-don't-stretch: fixed queue +
   context rails, the THREAD takes the flex middle; ultrawide widens the
   middle (1.7fr) + the rails, never stretching one lone column.
   ============================================================ */

/* SLA status strip (mirrors .seating-strip) */
.help-strip{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.help-spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.help-spill.green{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}
.help-spill.amber{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.help-spill.red{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}

/* 3-pane grid */
.help-wrap{display:grid;grid-template-columns:340px minmax(0,1fr) 312px;gap:16px;align-items:stretch;
  height:calc(100vh - 62px - 26px - 60px - 118px)}
@media(min-width:1700px){.help-wrap{grid-template-columns:372px minmax(0,1.7fr) 344px}}

/* ---- shared role chip ---- */
.help-rolechip{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  border-radius:99px;padding:2px 8px;vertical-align:1px}
.help-rolechip.customer{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.help-rolechip.vendor{color:#3a6ea5;background:#eaf1f8;border:1px solid #cdddee}
body.dark .help-rolechip.vendor{color:#9ec3e6;background:#22303d;border-color:#33485a}

/* shared ticket icon mark */
.help-rico{flex:0 0 auto;width:38px;height:38px;border-radius:11px;color:#fff;display:grid;place-items:center;
  font-size:17px}
.help-rico.lg{width:46px;height:46px;border-radius:12px;font-size:20px}

/* shared SLA flag (queue rows · header · context) */
.help-sla{font-size:11px;font-weight:700;white-space:nowrap}
.help-sla.green{color:var(--sage)}
.help-sla.amber{color:#8a6d2f}
.help-sla.red{color:var(--mulberry)}
.help-sla.done{color:var(--ink-faint)}
.help-sla.big{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.help-sla.big.red{background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.help-sla.big.amber{background:var(--gold-soft);border-color:var(--gold-line)}
.help-sla.big.done{background:var(--sage-soft);border-color:var(--sage-line);color:var(--sage)}

/* shared file row (bubble + context) */
.help-file{display:flex;align-items:center;gap:11px;margin-top:9px;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg)}
.help-file-ico{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;
  background:var(--gold-soft);border:1px solid var(--gold-line)}
.help-file-ico.sm{width:30px;height:30px;font-size:14px}
.help-file-b{flex:1;min-width:0}
.help-file-b b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.help-file-b small{font-size:11px;color:var(--ink-soft)}
.help-file-dl{flex:0 0 auto;font-size:15px;color:var(--ink-soft);cursor:pointer}

/* ============================================================ LEFT: queue ============================================================ */
.help-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.help-list-h{padding:14px 16px 11px;border-bottom:1px solid var(--line)}
.help-list-title{font-size:16px;font-weight:700;margin-bottom:11px}
.help-fchips{display:flex;flex-wrap:wrap;gap:6px}
.help-rchips{margin-top:7px}
.help-fchip,.help-rchip{font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);border-radius:99px;padding:5px 11px;cursor:pointer}
.help-fchip:hover,.help-rchip:hover{border-color:var(--gold-line)}
.help-fchip.on{background:var(--gold-soft);border-color:var(--gold-line);color:#8a6d2f}
.help-rchip.on{background:var(--mulberry-soft);border-color:var(--mulberry-line);color:var(--mulberry)}

.help-list-scroll{flex:1;overflow-y:auto;padding:6px 8px 10px}
.help-list-scroll::-webkit-scrollbar{width:8px}
.help-list-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.help-empty{padding:34px 16px;text-align:center;color:var(--ink-faint);font-size:13px}

.help-row{display:flex;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;
  align-items:flex-start;position:relative;border-left:3px solid transparent}
.help-row:hover{background:var(--gold-soft)}
.help-row.sel{background:var(--gold-soft);border-color:var(--gold-line)}
/* SLA accent down the left edge of each queue row */
.help-row.sla-red{border-left-color:var(--mulberry)}
.help-row.sla-amber{border-left-color:var(--gold)}
.help-row.sla-green{border-left-color:var(--sage-line)}
.help-row.sla-done{border-left-color:var(--line)}
.help-rb{flex:1;min-width:0}
.help-rtop{display:flex;align-items:center;gap:7px}
.help-rnum{font-size:11px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.help-when{flex:0 0 auto;margin-left:auto;font-size:11px;color:var(--ink-faint)}
.help-rsub{font-size:13.5px;font-weight:600;line-height:1.3;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.help-rbot{display:flex;align-items:center;gap:8px;margin-top:6px}
.help-rcat{flex:1;min-width:0;font-size:11.5px;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================================ CENTER: thread ============================================================ */
.help-convo{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;min-width:0}
.help-convo-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--ink-faint);padding:50px 34px}
.help-convo-empty .bi{font-size:34px;opacity:.5;margin-bottom:10px}
.help-convo-empty div:last-child{max-width:380px;font-size:13.5px;line-height:1.55}

.help-convo-h{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);
  background:rgba(251,251,250,.5)}
body.dark .help-convo-h{background:rgba(255,255,255,.02)}
.help-convo-id{display:flex;flex-direction:column;min-width:0}
.help-convo-id b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.help-convo-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* status stepper + assignment bar */
.help-actionbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 18px;border-bottom:1px solid var(--line);
  background:var(--bg)}
.help-stepper{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
.help-step{font:600 11.5px system-ui;border:1px solid transparent;background:none;color:var(--ink-soft);
  border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.help-step:hover{color:var(--ink)}
.help-step.on{background:var(--mulberry);color:#fff;border-color:var(--mulberry)}
.help-assign{display:flex;align-items:center;gap:9px;margin-left:auto;flex-wrap:wrap}
.help-assign-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.help-assign-v{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.help-aini{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:10px;
  font-weight:700;color:#fff;background:linear-gradient(135deg,var(--gold),#d8b878)}
.help-reassign{padding:6px 11px;font-size:12px}

/* message stream */
.help-stream{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.help-stream::-webkit-scrollbar{width:8px}
.help-stream::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

.help-notice{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.45;color:var(--ink-soft);
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:12px;padding:11px 14px}
.help-notice-ico{flex:0 0 auto;font-size:13px;margin-top:1px}
.help-daysep{text-align:center;font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em}
.help-daysep span{background:var(--bg);padding:0 12px}

.help-msg{display:flex;gap:10px;max-width:80%;align-items:flex-start}
.help-msg.them{align-self:flex-start}
.help-msg.me{align-self:flex-end;flex-direction:row-reverse}
.help-msg-av{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--gold),#d8b878);margin-top:2px}
.help-bubble{position:relative;font-size:13.5px;line-height:1.5;padding:11px 14px 7px;border-radius:14px;
  box-shadow:var(--shadow);min-width:0}
.help-msg.them .help-bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:5px;color:var(--ink)}
.help-msg.me .help-bubble{background:var(--mulberry);color:#fff;border-top-right-radius:5px}
.help-bubble-who{font-size:11px;font-weight:700;opacity:.78;margin-bottom:4px}
.help-bubble-t{white-space:pre-line}
.help-msgtime{font-size:9.5px;margin-top:6px;opacity:.62}
.help-msg.me .help-msgtime{text-align:right}
.help-msg.me .help-file{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.26)}
.help-msg.me .help-file-ico{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28)}
.help-msg.me .help-file-dl{color:rgba(255,255,255,.85)}

/* internal note — full-width, dashed, no bubble side */
.help-internal{display:flex;gap:10px;align-items:flex-start;align-self:stretch;font-size:12.5px;line-height:1.45;
  background:var(--card);border:1px dashed var(--gold-line);border-radius:12px;padding:11px 14px}
.help-internal-ico{flex:0 0 auto;font-size:13px;margin-top:1px;color:#8a6d2f}
.help-internal-b{flex:1;min-width:0}
.help-internal-b>b{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#8a6d2f;font-weight:700}
.help-internal-t{margin-top:4px;color:var(--ink-soft)}

/* composer */
.help-composer{flex:0 0 auto;border-top:1px solid var(--line);padding:11px 16px 13px;background:var(--card)}
.help-canned{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.help-canned-l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.help-cannedchip{font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);
  border-radius:99px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.help-cannedchip:hover{border-color:var(--gold-line);background:var(--gold-soft);color:#8a6d2f}
.help-input-row{display:flex}
.help-input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 13px;
  font:13.5px/1.5 system-ui;color:var(--ink);resize:none;outline:none}
.help-input:focus{border-color:var(--gold-line)}
.help-composer-foot{display:flex;align-items:center;gap:12px;margin-top:10px}
.help-noteswitch{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.help-noteswitch input{accent-color:var(--mulberry);width:14px;height:14px}
.help-foot-r{display:flex;align-items:center;gap:9px;margin-left:auto}
.help-foot-r .iconbtn{width:34px;height:34px;font-size:16px}
.help-twoadmin{font-size:11px;font-weight:700;color:var(--mulberry);background:var(--mulberry-soft);
  border:1px solid var(--mulberry-line);border-radius:99px;padding:5px 11px}
.help-send{padding:9px 18px}

/* ============================================================ RIGHT: context rail ============================================================ */
.help-ctx{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.help-ctx-empty{padding:34px 18px;text-align:center;color:var(--ink-faint);font-size:13px}
.help-ctx-hero{padding:20px 18px 16px;text-align:center;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--mulberry-soft),transparent)}
.help-ctx-av{width:60px;height:60px;border-radius:50%;margin:0 auto 11px;display:grid;place-items:center;
  font-size:21px;font-weight:700;color:#fff}
.help-ctx-name{font-size:17px;font-weight:700}
.help-ctx-sub{font-size:12px;color:var(--ink-soft);margin-top:5px}
.help-ctx-actions{display:flex;gap:8px;margin-top:14px}
.help-ctx-actions .btn{flex:1;padding:8px 10px;font-size:12px}

.help-ctx-b{flex:1;overflow-y:auto;padding:14px 18px 18px}
.help-ctx-b::-webkit-scrollbar{width:8px}
.help-ctx-b::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.help-ctx-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:18px 0 9px}
.help-ctx-lbl:first-child{margin-top:0}

/* SLA timer block */
.help-ctx-sla{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--bg)}
.help-ctx-sla.red{background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.help-ctx-sla.amber{background:var(--gold-soft);border-color:var(--gold-line)}
.help-ctx-sla.green{background:var(--sage-soft);border-color:var(--sage-line)}
.help-ctx-sla.done{background:var(--sage-soft);border-color:var(--sage-line)}
.help-ctx-slan{font-family:Georgia,serif;font-size:22px;font-weight:700;line-height:1}
.help-ctx-sla.red .help-ctx-slan{color:var(--mulberry)}
.help-ctx-sla.amber .help-ctx-slan{color:#8a6d2f}
.help-ctx-sla.green .help-ctx-slan,.help-ctx-sla.done .help-ctx-slan{color:var(--sage)}
.help-ctx-slal{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.4}

/* linked record button */
.help-ctx-link{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}
.help-ctx-link:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.help-ctx-link-ico{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:var(--gold-soft);border:1px solid var(--gold-line)}
.help-ctx-link-b{flex:1;min-width:0}
.help-ctx-link-b b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.help-ctx-link-b small{font-size:11px;color:var(--ink-soft);line-height:1.4}
.help-ctx-link-go{flex:0 0 auto;color:var(--gold);font-weight:700}

.help-ctx-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.help-ctx-row:last-child{border-bottom:none}
.help-ctx-row .k{color:var(--ink-soft)}
.help-ctx-row span:last-child{text-align:right;font-variant-numeric:tabular-nums}

.help-ctx-files{display:flex;flex-direction:column;gap:8px}
.help-ctx-file{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;cursor:pointer}
.help-ctx-file:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.help-ctx-fempty{font-size:12.5px;color:var(--ink-faint);padding:4px 2px}

/* conciergeabuse */
/* ============================================================ CONCIERGE ABUSE surface — scoped extras (palette vars only).
   Every selector is ".conciergeabuse-" prefixed. Reuses shared .frail/.gdetail/.gd-*/.pill/.btn/.gini/.count/.bi. ============================================================ */

/* metric chips under the surface head (clickable; double as filter) */
.conciergeabuse-strip{display:flex;gap:12px;margin-bottom:16px}
.conciergeabuse-metric{display:flex;align-items:baseline;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 18px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s,background .12s}
.conciergeabuse-metric:hover{border-color:var(--gold-line)}
.conciergeabuse-metric .cm-n{font-family:Georgia,serif;font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.conciergeabuse-metric .cm-l{font-size:12px;color:var(--ink-soft)}
.conciergeabuse-metric.amber.on{background:var(--gold-soft);border-color:var(--gold-line)} .conciergeabuse-metric.amber .cm-n{color:#8a6d2f}
.conciergeabuse-metric.green.on{background:var(--sage-soft);border-color:var(--sage-line)} .conciergeabuse-metric.green .cm-n{color:var(--sage)}
.conciergeabuse-metric.red.on{background:var(--mulberry-soft);border-color:var(--mulberry-line)} .conciergeabuse-metric.red .cm-n{color:var(--mulberry)}

/* three-column body: filter rail | flagged-account list | detail. Fills wide screens by GROWING the list + widening detail. */
.conciergeabuse-wrap{display:grid;grid-template-columns:248px 1fr 412px;gap:16px;align-items:start}
@media(min-width:1700px){.conciergeabuse-wrap{grid-template-columns:280px 1fr 468px}}

/* ---- left rail: penalty ladder + how-it-works ---- */
.conciergeabuse-ladder{display:flex;flex-direction:column;gap:8px}
.conciergeabuse-rung{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--card)}
.conciergeabuse-rung.pending{background:var(--gold-soft);border-color:var(--gold-line)}
.conciergeabuse-rung.no{background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.conciergeabuse-rung .cr-n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font:700 12px system-ui;color:#fff;background:var(--ink-soft)}
.conciergeabuse-rung.pending .cr-n{background:var(--gold)} .conciergeabuse-rung.no .cr-n{background:var(--mulberry)}
.conciergeabuse-rung .cr-b b{font-size:12.5px;font-weight:700;display:block}
.conciergeabuse-rung .cr-b small{font-size:11px;color:var(--ink-soft);line-height:1.35;display:block;margin-top:1px}

.conciergeabuse-how{display:flex;flex-direction:column;gap:9px}
.conciergeabuse-how .ch-step{display:flex;gap:9px;font-size:12px;color:var(--ink-soft);line-height:1.4}
.conciergeabuse-how .ch-n{flex:0 0 auto;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font:700 10.5px system-ui;color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}

/* ---- middle: flagged-account queue cards ---- */
.conciergeabuse-listcol{display:flex;flex-direction:column;gap:11px}
.conciergeabuse-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:13px 15px;cursor:pointer;transition:border-color .12s,transform .06s}
.conciergeabuse-item:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.conciergeabuse-item.sel{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold),var(--shadow)}
.conciergeabuse-item .ci-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.conciergeabuse-item .ci-meta{flex:1;min-width:0}
.conciergeabuse-item .ci-meta b{font-weight:700;font-size:14px}
.conciergeabuse-item .ci-meta small{display:block;color:var(--ink-faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conciergeabuse-item .ci-event{font-size:12.5px;color:var(--ink-soft);margin-bottom:9px}
.conciergeabuse-item .ci-sig{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.conciergeabuse-item .ci-foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-faint)}
.conciergeabuse-item .ci-mcount{font-weight:600;color:var(--ink-soft)}
.conciergeabuse-item .ci-sep{opacity:.5}

/* similarity bar (red ≥.85 / amber .70-.85 / green <.70) */
.conciergeabuse-scorebar{position:relative;height:18px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;align-items:center}
.conciergeabuse-scorebar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;display:block}
.conciergeabuse-scorebar.red i{background:linear-gradient(90deg,var(--mulberry),#7a3a55)}
.conciergeabuse-scorebar.amber i{background:linear-gradient(90deg,var(--gold),#d8b878)}
.conciergeabuse-scorebar.green i{background:linear-gradient(90deg,var(--sage),#7d8f55)}
.conciergeabuse-scorebar .csb-v{position:relative;z-index:1;margin-left:auto;margin-right:9px;font:700 11px system-ui;
  font-variant-numeric:tabular-nums;color:var(--ink);background:var(--card);border-radius:99px;padding:0 7px}

/* signal chips (shared between list + detail) */
.conciergeabuse-sig{font-size:11px;font-weight:600;border:1px solid var(--gold-line);background:var(--gold-soft);color:#8a6d2f;
  border-radius:99px;padding:3px 9px;white-space:nowrap}
.conciergeabuse-sig.crit{border-color:var(--mulberry-line);background:var(--mulberry-soft);color:var(--mulberry)}
.conciergeabuse-sig.more{border-style:dashed;background:var(--card);color:var(--ink-soft)}

/* matched-account avatar stack on the card foot */
.conciergeabuse-avs{display:inline-flex;align-items:center}
.conciergeabuse-av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;
  font:700 10px system-ui;color:#fff;border:2px solid var(--card);position:relative}
.conciergeabuse-appealtag{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--mulberry);
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:2px 8px}

.conciergeabuse-emptylist{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  padding:46px 24px;text-align:center;color:var(--ink-faint)}
.conciergeabuse-emptylist .bi{font-size:32px;opacity:.5;margin-bottom:8px}

/* ---- right detail pane ---- */
.conciergeabuse-detail{position:sticky;top:0}
.conciergeabuse-herorow{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:11px}
.conciergeabuse-scorepill{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px}
.conciergeabuse-scorepill.red{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.conciergeabuse-scorepill.amber{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}
.conciergeabuse-scorepill.green{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}

.conciergeabuse-sectlabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:18px 0 9px}

.conciergeabuse-eventcard{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:12px;background:var(--bg)}
.conciergeabuse-eventcard .ce-ico{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:16px;background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.conciergeabuse-eventcard .ce-b{flex:1;min-width:0}
.conciergeabuse-eventcard .ce-b b{font-weight:700;font-size:13.5px}
.conciergeabuse-eventcard .ce-b small{display:block;color:var(--ink-soft);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conciergeabuse-trialtag{flex:0 0 auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--rose);background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:99px;padding:3px 8px}

.conciergeabuse-sigrow{display:flex;flex-wrap:wrap;gap:6px}

.conciergeabuse-cmphead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 0}
.conciergeabuse-toggle{font:600 12px system-ui;color:var(--gold);background:none;border:none;cursor:pointer}
.conciergeabuse-toggle:hover{color:#8a6d2f}

/* mini link-graph */
.conciergeabuse-graph{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:
  radial-gradient(circle at 50% 38%, var(--gold-soft), transparent 62%), var(--card);overflow:hidden}
.conciergeabuse-gsvg{display:block;width:100%;height:auto}
.conciergeabuse-gini{fill:#fff;font:700 11px system-ui}
.conciergeabuse-gini.big{font-size:14px}
.conciergeabuse-glbl{fill:var(--ink-faint);font:600 9.5px system-ui;letter-spacing:.02em}
.conciergeabuse-glbl.strong{fill:var(--mulberry);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.conciergeabuse-gnode{cursor:default}
.conciergeabuse-glegend{display:flex;flex-wrap:wrap;gap:14px;padding:8px 13px 11px;border-top:1px solid var(--line)}
.conciergeabuse-glegend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft)}
.conciergeabuse-glegend i{width:18px;height:3px;border-radius:99px;display:inline-block}

/* per-match comparison table */
.conciergeabuse-match{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.conciergeabuse-mhead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.conciergeabuse-mhead .cm-meta{flex:1;min-width:0}
.conciergeabuse-mhead .cm-meta b{font-weight:700;font-size:13px}
.conciergeabuse-mhead .cm-meta small{display:block;color:var(--ink-faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conciergeabuse-trialused{flex:0 0 auto;font-size:10.5px;font-weight:600;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.conciergeabuse-mnote{font-size:11.5px;color:var(--ink-soft);font-style:italic;padding:8px 12px;border-bottom:1px solid var(--line)}

.conciergeabuse-cmptable{display:flex;flex-direction:column}
.conciergeabuse-cmptable .cmp-r{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--line);font-size:12px;align-items:center}
.conciergeabuse-cmptable .cmp-r:last-child{border-bottom:none}
.conciergeabuse-cmptable .cmp-head{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;background:var(--alabaster)}
.conciergeabuse-cmptable .cmp-k{color:var(--ink-soft)}
.conciergeabuse-cmptable .cmp-v{font-weight:600;word-break:break-word}
.conciergeabuse-cmptable .cmp-r.match{background:var(--gold-soft)}
.conciergeabuse-cmptable .cmp-r.match.crit{background:var(--mulberry-soft)}
.conciergeabuse-cmptable .cmp-r.match .cmp-v:last-child{color:#8a6d2f}
.conciergeabuse-cmptable .cmp-r.match.crit .cmp-v:last-child{color:var(--mulberry)}
.conciergeabuse-cmptable .cmp-tick{font-style:normal;font-weight:700;margin-left:3px}

/* action zone */
.conciergeabuse-acts{margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
.conciergeabuse-nextline{font-size:12px;color:var(--ink-soft);margin-bottom:11px}
.conciergeabuse-nextline b{color:var(--ink)}
.conciergeabuse-actrow{display:flex;gap:8px}
.conciergeabuse-actrow.three .btn{flex:1;padding:9px 6px;text-align:center;white-space:nowrap}
.conciergeabuse-actrow.three .conciergeabuse-confirm{flex:1.5}
.conciergeabuse-clear{color:var(--sage);border-color:var(--sage-line);background:var(--sage-soft)}
.conciergeabuse-clear:hover{border-color:var(--sage)}
.conciergeabuse-confirm{background:var(--mulberry);border-color:var(--mulberry)}

.conciergeabuse-appealbox{background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.conciergeabuse-appealbox .ca-h{font-weight:700;font-size:13px;color:var(--mulberry)}
.conciergeabuse-appealbox .ca-s{font-size:12px;color:var(--ink-soft);line-height:1.45;margin-top:5px}
.conciergeabuse-appealbox + .conciergeabuse-actrow .btn{flex:1;text-align:center}

.conciergeabuse-notefield{margin-top:14px}
.conciergeabuse-notefield label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;display:block;margin-bottom:6px}
.conciergeabuse-notefield textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;font:13px/1.45 system-ui;background:var(--bg);color:var(--ink);outline:none}
.conciergeabuse-notefield textarea:focus{border-color:var(--gold-line)}

/* users */
/* ===== USERS surface — scoped extras. Palette vars only; every selector ".users-" prefixed. ===== */

/* stat strip reuses .statstrip/.stat; just tighten the value typography per the directory totals */
.users-strip{margin-bottom:14px}

/* lifecycle toggle (Active users / 🚫 Blacklisted) — segmented control above the body */
.users-life{display:inline-flex;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.users-life button{font:600 13px system-ui;border:1px solid transparent;background:none;color:var(--ink-soft);
  border-radius:9px;padding:8px 16px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.users-life button:hover{color:var(--ink)}
.users-life button.on{background:var(--card);color:var(--mulberry);border-color:var(--mulberry-line);box-shadow:var(--shadow)}
.users-life button b{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink-faint);background:var(--line);border-radius:99px;padding:1px 7px}
.users-life button.on b{color:var(--mulberry);background:var(--mulberry-soft)}

/* three-column body: filter rail | accounts table | profile detail. Fills wide screens by GROWING
   the center table + widening the detail pane (never by stretching a lone column). */
.users-wrap{display:grid;grid-template-columns:236px 1fr 372px;gap:16px;align-items:start}
@media(min-width:1700px){.users-wrap{grid-template-columns:264px 1fr 420px}}

/* account-type pill in the table (color via --c) */
.users-type{font-size:11.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 34%,transparent);border-radius:99px;padding:3px 10px;display:inline-block}

/* internal / team flags */
.users-flag{font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px;display:inline-block;white-space:nowrap;vertical-align:middle}
.users-flag.pur{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.users-flag.grn{color:var(--sage);background:var(--sage-soft);border:1px solid var(--sage-line)}

/* monospaced IDs / refs / emails */
.users-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.01em;color:var(--ink)}

/* detail pane — make it its own scroll column so the long profile never blows the viewport */
.users-detail{max-height:calc(100vh - 200px);overflow-y:auto}
.users-detail::-webkit-scrollbar{width:8px}
.users-detail::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* section labels inside the detail body */
.users-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;
  margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.users-sec:first-child{margin-top:0;padding-top:0;border-top:none}

/* mini stat trio */
.users-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.users-ministat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 8px;text-align:center}
.users-ministat .n{font-family:Georgia,serif;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.users-ministat .l{font-size:10px;color:var(--ink-faint);margin-top:3px;letter-spacing:.02em}

.users-note{font-size:12.5px;color:var(--ink-soft);background:var(--gold-soft);border:1px solid var(--gold-line);
  border-radius:10px;padding:9px 11px;margin-top:10px;line-height:1.45}
.users-hint{font-size:11.5px;color:var(--ink-faint);line-height:1.45;margin-top:8px}
.users-empty{font-size:12.5px;color:var(--ink-faint);padding:10px 0}

/* comp grant cards — left accent bar by kind */
.users-grant{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.users-grant.unl{border-left-color:var(--mulberry);background:var(--mulberry-soft)}
.users-grant.pool{border-left-color:var(--sage);background:var(--sage-soft)}
.users-grant.trial{border-left-color:var(--ink-faint)}
.users-grant.comp{border-left-color:var(--gold);background:var(--gold-soft)}
.users-grant-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.users-grant-h b{font-weight:700;font-size:13px}
.users-grant-v{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;color:var(--mulberry);white-space:nowrap}
.users-grant-m{font-size:11px;color:var(--ink-soft);margin-top:3px}
.users-grant-r{font-size:11.5px;color:var(--ink-soft);font-style:italic;margin-top:5px;line-height:1.4}

/* audit log — vertical thread */
.users-audit{display:flex;flex-direction:column}
.users-logrow{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.users-logrow:last-child{border-bottom:none}
.users-logdot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:5px}
.users-logb{flex:1;font-size:12.5px;min-width:0}
.users-logb b{font-weight:700;display:block}
.users-logb span{color:var(--ink-soft);font-size:12px}
.users-logt{flex:0 0 auto;font-size:11px;color:var(--ink-faint);white-space:nowrap}

/* action buttons grid */
.users-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.users-acts .btn{padding:9px 6px;text-align:center;font-size:12px;white-space:nowrap}

/* destructive actions row */
.users-danger{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}
.users-danger .btn{padding:9px 6px;text-align:center;font-size:12px;color:var(--rose);border-color:var(--mulberry-line)}
.users-danger .btn:hover:not(:disabled){background:var(--mulberry-soft);border-color:var(--mulberry)}
.users-twoadmin{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-faint);background:var(--line);border-radius:99px;padding:1px 5px;margin-left:4px;vertical-align:middle}

/* blacklist lifecycle table */
.users-blwrap{max-width:980px}
.users-blwrap tbody tr:hover{background:transparent}
.users-undo{padding:6px 12px;font-size:12px;color:var(--sage);border-color:var(--sage-line)}
.users-undo:hover{background:var(--sage-soft);border-color:var(--sage)}

/* vendors */
/* ===== VENDORS surface — scoped extras. Palette vars only; every selector ".vendors-" prefixed. ===== */

/* list-detail: filter rail | vendor table | detail pane. Ultrawide promotes a 4th tier-history column (fill-don't-stretch). */
.vendors-wrap{display:grid;grid-template-columns:236px 1fr 348px;gap:16px;align-items:start}
.vendors-histcol{display:none}
/* narrower desktop: drop the detail pane into the column flow */
@media(max-width:1320px){.vendors-wrap{grid-template-columns:220px 1fr}.vendors-wrap .gdetail{display:none}}
/* ultrawide: 4 real columns — rail | table | detail | tier history */
@media(min-width:1700px){
  .vendors-wrap{grid-template-columns:248px 1fr 360px 332px}
  .vendors-histcol{display:block;position:sticky;top:0}
}

/* left-rail footnote about the two-admin gate */
.vendors-note{margin-top:16px;font-size:11.5px;line-height:1.55;color:var(--ink-soft);
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:10px 11px}
.vendors-note b{color:#8a6d2f;font-weight:700}

/* in-table profile-completion mini bar */
.vendors-cbar{display:flex;align-items:center;gap:9px;min-width:120px}
.vendors-cbar-n{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;width:34px;flex:0 0 auto}
.vendors-cbar-t{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.vendors-cbar-t i{display:block;height:100%;border-radius:99px}

/* ---- detail pane ---- */
.vendors-logo{border-radius:15px}  /* square-ish company-logo tile, distinct from the round guest avatar */
.vendors-tierpill{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:11px}
.vendors-renew{font-size:11.5px;color:var(--ink-soft);font-weight:600}

.vendors-comp{margin-bottom:6px}
.vendors-comp-top{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.vendors-comp-top .k{color:var(--ink-soft)}
.vendors-comp-top b{font-variant-numeric:tabular-nums;font-size:15px}
.vendors-comp-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.vendors-comp-bar i{display:block;height:100%;border-radius:99px}
.vendors-comp small{font-size:11.5px;color:var(--ink-faint);line-height:1.4}

/* tier perks chips */
.vendors-perkhead,.vendors-acthead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;margin:16px 0 9px}
.vendors-perks{display:flex;flex-wrap:wrap;gap:7px}
.vendors-perk{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink-faint);
  border-radius:99px;padding:5px 11px;cursor:pointer;transition:border-color .12s,background .12s,color .12s}
.vendors-perk:hover{border-color:var(--gold-line)}
.vendors-perk.on{color:var(--sage);background:var(--sage-soft);border-color:var(--sage-line)}

/* edit-profile entry */
.vendors-edit{width:100%;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
.vendors-edit-path{font:600 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.vendors-edit:hover .vendors-edit-path{color:var(--ink-soft)}

/* force-tier-change action stack */
.vendors-acts{display:flex;flex-direction:column;gap:8px}
.vendors-acts .vendors-demote,.vendors-acts .vendors-promote,.vendors-acts .vendors-cancel{width:100%;text-align:center}
.vendors-demote{color:var(--mulberry);border-color:var(--mulberry-line);background:var(--mulberry-soft)}
.vendors-demote:hover{filter:brightness(.98)}
.vendors-actnote{font-size:11.5px;line-height:1.5;color:var(--ink-faint)}
.vendors-gate{font-size:11.5px;line-height:1.55;color:var(--mulberry);background:var(--mulberry-soft);
  border:1px solid var(--mulberry-line);border-radius:10px;padding:10px 11px}
.vendors-gate b{font-weight:700}

/* ---- ultrawide tier-history column ---- */
.vendors-histempty{padding:30px 6px;text-align:center;color:var(--ink-faint);font-size:12.5px;line-height:1.6}
.vendors-htl{display:flex;flex-direction:column}
.vendors-hrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);position:relative}
.vendors-hrow:last-child{border-bottom:none}
.vendors-hrow:not(:last-child)::before{content:"";position:absolute;left:5px;top:22px;bottom:-12px;width:2px;background:var(--line)}
.vendors-hdot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;margin-top:4px;border:2px solid var(--card);
  box-shadow:0 0 0 1px var(--line);z-index:1}
.vendors-hbody{flex:1;min-width:0}
.vendors-hstate{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vendors-hfrom{font-size:11px;color:var(--ink-faint)}
.vendors-hreason{font-size:12.5px;color:var(--ink);margin-top:5px;line-height:1.45}
.vendors-hmeta{font-size:11px;color:var(--ink-soft);margin-top:4px;font-variant-numeric:tabular-nums}
.vendors-hsys{font-style:italic;color:var(--ink-faint)}

/* demovendors */
/* ============================================================
   DEMO VENDORS surface — scoped extras (palette vars only).
   Every selector ".demovendors-" prefixed. Reuses shared
   .frail / .gini / .pill / .count / .card-h / .gd-empty / .btn.
   ============================================================ */

/* pilot-mode banner */
.demovendors-banner{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;padding:13px 16px;
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:var(--radius);font-size:13px;line-height:1.45;color:var(--ink)}
.demovendors-banner b{font-weight:700}
.demovendors-bdot{flex:0 0 auto;color:var(--sage);font-size:11px;margin-top:3px}
.demovendors-btag{flex:0 0 auto;align-self:center;margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.1em;
  color:#8a6d2f;background:var(--card);border:1px solid var(--gold-line);border-radius:99px;padding:4px 11px}

/* three-column body: account rail | detail pane | responder inbox.
   Fills wide screens by widening the detail + responder (NOT stretching one column). */
.demovendors-wrap{display:grid;grid-template-columns:288px 1fr 360px;gap:16px;align-items:start}
@media(min-width:1700px){.demovendors-wrap{grid-template-columns:320px 1fr 408px}}

/* ---- LEFT rail (extends .frail) ---- */
.demovendors-rail{position:sticky;top:0}
.demovendors-acclist{display:flex;flex-direction:column;gap:4px;margin:0 -4px;max-height:46vh;overflow-y:auto;padding:0 4px}
.demovendors-acclist::-webkit-scrollbar{width:7px}
.demovendors-acclist::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px}
.demovendors-accrow{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.demovendors-accrow:hover{background:var(--gold-soft)}
.demovendors-accrow.sel{background:var(--gold-soft);border-color:var(--gold-line)}
.demovendors-accmeta{flex:1;min-width:0}
.demovendors-accmeta b{font-weight:600;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demovendors-accmeta small{font-size:11px;color:var(--ink-faint);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demovendors-accright{flex:0 0 auto;display:flex;align-items:center;gap:7px}
.demovendors-tdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.demovendors-star{color:var(--gold)}
/* lean on shared .count for the badge but allow an alert variant if the shell lacks one */
.demovendors-accright .count{font-size:10.5px;font-weight:700;color:#fff;background:var(--mulberry);
  border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}

/* ---- CENTER detail pane ---- */
.demovendors-detail{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.demovendors-hero{display:flex;align-items:center;gap:16px;padding:20px 22px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--gold-soft),transparent)}
.demovendors-heroini{width:60px;height:60px;border-radius:15px;flex:0 0 auto;display:grid;place-items:center;
  font-size:26px;color:#fff;box-shadow:var(--shadow)}
.demovendors-herometa{flex:1;min-width:0}
.demovendors-heroname{font-size:21px;font-weight:700}
.demovendors-heroname .demovendors-star{font-size:16px}
.demovendors-herosub{font-size:13px;color:var(--ink-soft);margin-top:2px}
.demovendors-herorow{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.demovendors-ref{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px}

.demovendors-detbody{padding:18px 22px 20px}
.demovendors-blurb{margin:0 0 16px;font-size:13.5px;line-height:1.55;color:var(--ink-soft)}

/* fact grid — two columns on wide, one on narrow */
.demovendors-facts{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;border-top:1px solid var(--line);margin-bottom:18px}
@media(max-width:1200px){.demovendors-facts{grid-template-columns:1fr}}
.demovendors-fact{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.demovendors-fact .k{color:var(--ink-soft)}
.demovendors-fact .v{font-weight:600;text-align:right}

/* canned auto-responder script editor */
.demovendors-scriptcard{border:1px solid var(--gold-line);border-radius:12px;overflow:hidden;background:var(--gold-soft);margin-bottom:16px}
.demovendors-scripthead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--gold-line);font-size:13px;font-weight:700;color:#8a6d2f}
.demovendors-scriptnote{font-weight:500;font-size:11.5px;color:var(--ink-soft);margin-left:auto;text-align:right}
.demovendors-scriptbox{display:block;width:100%;border:none;outline:none;resize:vertical;min-height:110px;
  background:var(--card);color:var(--ink);font:13.5px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:13px 14px}
.demovendors-scriptfoot{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line)}
.demovendors-scriptlen{font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.demovendors-scriptfoot .btn{margin-left:auto}

.demovendors-acts{display:flex;gap:8px;flex-wrap:wrap}
.demovendors-acts .btn{flex:1;min-width:130px;text-align:center}

/* ---- RIGHT rail: responder inbox ---- */
.demovendors-inbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:0;overflow:hidden;display:flex;flex-direction:column}
.demovendors-inbhead{flex:0 0 auto}
.demovendors-inbbody{padding:14px 16px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;max-height:calc(100vh - 280px)}
.demovendors-inbbody::-webkit-scrollbar{width:7px}
.demovendors-inbbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:7px}
.demovendors-inbempty{text-align:center;color:var(--ink-faint);font-size:13px;padding:26px 6px}

.demovendors-inq{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--card)}
.demovendors-inq.done{background:var(--bg)}
.demovendors-inqtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.demovendors-inqtop b{font-weight:700;font-size:13.5px}
.demovendors-inqwhen{font-size:11px;color:var(--ink-faint);flex:0 0 auto}
.demovendors-inqask{font-size:12.5px;color:var(--ink-soft);font-style:italic;line-height:1.45;margin-top:5px}
.demovendors-sendbtn{width:100%;margin-top:11px}

.demovendors-inqreply{margin-top:11px;padding:10px 11px;border-radius:10px;background:var(--sage-soft);border:1px solid var(--sage-line)}
.demovendors-replytag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sage);margin-bottom:5px}
.demovendors-replytxt{display:block;font-size:12px;line-height:1.5;color:var(--ink)}

.demovendors-inbfoot{flex:0 0 auto;display:flex;justify-content:space-around;gap:10px;padding:12px 16px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-soft);background:var(--alabaster)}
.demovendors-inbfoot b{font-variant-numeric:tabular-nums;color:var(--ink)}

/* events */
/* ===== EVENTS surface — admin events directory · scoped extras.
   Palette vars only; every selector ".events-" prefixed. ===== */

/* ---- status strip (platform-wide stage counts) ---- */
.events-strip{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.events-spill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.events-spill.warn{color:var(--mulberry);background:var(--mulberry-soft);border-color:var(--mulberry-line)}
.events-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}

/* ---- three-column body: filter rail | table | detail. Fills wide screens by GROWING the
   table column + widening the detail pane (fill-don't-stretch). ---- */
.events-wrap{display:grid;grid-template-columns:236px 1fr 372px;gap:16px;align-items:start}
@media(min-width:1700px){.events-wrap{grid-template-columns:264px 1fr 420px}}

/* rail note (mirrors schedule-note tone) */
.events-railnote{margin-top:14px;font-size:11.5px;line-height:1.5;color:var(--ink-soft);
  background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:9px 11px}

/* ---- table cells ---- */
.events-mono{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-family:Georgia,serif;font-size:11.5px;letter-spacing:.02em;color:#fff;
  background:linear-gradient(135deg,var(--mulberry),#7a3a55)}
.events-flag{color:var(--rose);font-size:12px}
.events-date b{font-weight:700;display:block;white-space:nowrap}
.events-date small{font-size:11px;color:var(--ink-faint)}
.events-cc{color:var(--gold);font-weight:700}
.events-num{text-align:left}
.events-num b{font-weight:700;font-variant-numeric:tabular-nums;display:block}
.events-num small{font-size:11.5px;color:var(--ink-soft)}
.events-num small.events-clear{color:var(--sage)}

/* pill carrying an inline stage dot */
.pill .events-dot{margin-right:5px;vertical-align:0}

/* ---- detail pane ---- */
.events-hero-mono{font-family:Georgia,serif;background:linear-gradient(135deg,var(--mulberry),#7a3a55)!important}
.events-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.04em;
  color:var(--ink-faint);margin-top:7px}

/* section divider label inside the detail body */
.events-sect{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:700;margin:18px 0 9px}

/* attention alert (force majeure / abuse) */
.events-alert{display:flex;flex-direction:column;gap:2px;background:var(--mulberry-soft);
  border:1px solid var(--mulberry-line);border-radius:11px;padding:10px 12px;margin:12px 0 2px}
.events-alert b{font-size:12.5px;color:var(--mulberry);font-weight:700}
.events-alert span{font-size:12px;color:var(--ink-soft);line-height:1.4}

/* lifecycle timeline — 5 modes left→right; reached nodes gold, current emphasised */
.events-life{display:flex;align-items:flex-start;justify-content:space-between;gap:0;position:relative;
  padding:2px 4px 0}
.events-lifenode{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;
  font-size:10.5px;font-weight:600;color:var(--ink-faint);text-align:center;line-height:1.25}
/* connector line between nodes */
.events-lifenode::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;
  background:var(--line);z-index:0}
.events-lifenode:first-child::before{display:none}
.events-lifenode.reached::before{background:var(--gold-line)}
.events-lifedot{width:13px;height:13px;border-radius:50%;background:var(--card);
  border:2px solid var(--line);position:relative;z-index:1}
.events-lifenode.reached{color:#8a6d2f}
.events-lifenode.reached .events-lifedot{background:var(--gold);border-color:var(--gold)}
.events-lifenode.cur .events-lifedot{box-shadow:0 0 0 4px var(--gold-soft);border-color:var(--gold)}
.events-lifenode.cur{color:var(--mulberry);font-weight:700}

/* booked-vendor rows */
.events-vlist{display:flex;flex-direction:column;gap:2px}
.events-vrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.events-vrow:last-child{border-bottom:none}
.events-vico{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:15px;background:var(--gold-soft);border:1px solid var(--gold-line)}
.events-vmeta{flex:1;min-width:0}
.events-vmeta b{font-weight:700;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.events-vmeta small{font-size:11.5px;color:var(--ink-soft)}
.events-vamt{flex:0 0 auto;text-align:right;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.events-vamt .pill{font-weight:700}

/* in-app order rows */
.events-olist{display:flex;flex-direction:column;gap:2px}
.events-orow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.events-orow:last-child{border-bottom:none}
.events-ometa{flex:1;min-width:0}
.events-ometa b{font-weight:600;font-size:13px;display:block}
.events-ometa code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-faint);letter-spacing:.03em}
.events-oamt{flex:0 0 auto;text-align:right;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.events-empty-mini{font-size:12.5px;color:var(--ink-faint);padding:4px 0 2px}

/* admin actions */
.events-actnote{font-size:11.5px;line-height:1.45;color:var(--ink-soft);margin-bottom:6px}
.events-stageseg{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:230px}
.events-stageseg button{font:600 11px system-ui;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);border-radius:8px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.events-stageseg button:hover{border-color:var(--gold-line)}
.events-stageseg button.on{background:var(--mulberry);color:#fff;border-color:var(--mulberry)}
.events-acts{display:flex;gap:7px;margin-top:14px}
.events-acts .btn{flex:1;padding:9px 6px;text-align:center}
.events-danger{color:var(--rose);border-color:var(--mulberry-line)}
.events-danger:hover{background:var(--mulberry-soft);border-color:var(--rose)}
.events-gate{margin-top:9px;font-size:11.5px;font-weight:600;color:var(--mulberry);
  background:var(--mulberry-soft);border:1px solid var(--mulberry-line);border-radius:9px;padding:7px 11px}

/* venues */
/* ============================================================
   VENUES surface — scoped extras. Palette vars only; every
   selector ".venues-" prefixed. Desktop list-detail that FILLS
   wide screens by ADDING a 4th (linked-events) column — never
   stretching a single column.
   ============================================================ */

/* four-column body: filter rail | venue table | detail+edit pane | (ultrawide) linked-events.
   The 4th column is hidden below 1700px; at narrower desktop the detail pane drops to keep two
   readable columns rather than squeezing all four. Mirrors .guestwrap proportions. */
.venues-wrap{display:grid;grid-template-columns:236px 1fr 360px;gap:16px;align-items:start}
.venues-eventscol{display:none;flex-direction:column;gap:16px}
@media(min-width:1700px){
  .venues-wrap{grid-template-columns:248px 1fr 372px 320px}
  .venues-eventscol{display:flex}
}
@media(max-width:1280px){
  .venues-wrap{grid-template-columns:236px 1fr}
  .venues-wrap .gdetail{grid-column:1 / -1}
}

/* left-rail footer note */
.venues-railnote{margin-top:16px;font-size:11.5px;line-height:1.55;color:var(--ink-soft);
  border-top:1px dashed var(--line);padding-top:13px}
.venues-railnote b{color:var(--ink);font-weight:700}

/* type tag in the table — themed off the type's palette swatch via CSS vars */
.venues-typetag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  color:var(--tc);background:var(--ts);border:1px solid var(--tl);border-radius:99px;padding:3px 9px;white-space:nowrap}
.venues-cap small{color:var(--ink-faint);font-size:11px;font-weight:600}

/* ---- right pane: detail hero icon + create-form head ---- */
.venues-d-ico{width:60px;height:60px;border-radius:15px;margin:0 auto 10px;display:grid;place-items:center;
  font-size:26px;background:var(--card);border:1px solid var(--line);
  box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--tc) 22%, transparent)}
.venues-d-badges{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:11px}
.venues-ref{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;
  color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.venues-formhead{padding:22px 20px 16px;text-align:center;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--mulberry-soft),transparent)}
.venues-formhead .venues-d-ico{--tc:var(--mulberry);color:var(--mulberry);font-weight:700}

/* ---- form fields (live inside .gd-b) ---- */
.venues-field{padding:11px 0;border-bottom:1px solid var(--line)}
.venues-field:last-of-type{border-bottom:none}
.venues-flabel{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:700;margin-bottom:7px}
.venues-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;
  font:13.5px system-ui;background:var(--bg);color:var(--ink)}
.venues-input:focus{outline:none;border-color:var(--gold-line);background:var(--card);
  box-shadow:0 0 0 3px var(--gold-soft)}
.venues-input::placeholder{color:var(--ink-faint)}
.venues-textarea{min-height:74px;resize:vertical;line-height:1.5;font-family:system-ui}
.venues-fhint{font-size:11px;color:var(--ink-faint);margin-top:6px;line-height:1.45}
.venues-mono,.venues-input.venues-mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em}

/* two-up field row (phone + email) */
.venues-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.venues-2col .venues-field{padding:0;border-bottom:none}

/* region/type chip selectors */
.venues-selrow{display:flex;flex-wrap:wrap;gap:6px}
.venues-selchip{font:600 12px system-ui;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:99px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.venues-selchip:hover{border-color:var(--gold-line)}
.venues-selchip.on{background:var(--mulberry-soft);border-color:var(--mulberry-line);color:var(--mulberry)}

/* footer actions */
.venues-foot{display:flex;gap:8px;margin-top:16px}
.venues-foot .btn{flex:1;text-align:center}
.venues-foot .btn.primary{flex:1.4}
.venues-saved{background:var(--sage)!important;border-color:var(--sage)!important}

/* ---- ultrawide events column ---- */
.venues-evrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.venues-evrow:last-child{border-bottom:none}
.venues-emptycol{color:var(--ink-faint);font-size:12.5px;line-height:1.55;padding:8px 2px;text-align:center}

/* pricing */
/* ============================================================
   PRICING surface — scoped extras. Palette vars only;
   every selector is ".pricing-" prefixed. Reuses .frail / .gtable /
   .gdetail / .pill / .btn / .fchip / .fstat from the shared system.
   ============================================================ */

/* three-column body: filter rail | wide table | edit drawer.
   FILL-don't-stretch: wide screens widen the rail + drawer; the table
   keeps all its columns visible (incl. the cost-watch pair). */
.pricing-wrap{display:grid;grid-template-columns:236px minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(min-width:1700px){.pricing-wrap{grid-template-columns:268px minmax(0,1fr) 384px}}

/* surface-head extras */
.pricing-period{font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--card);
  border:1px solid var(--line);border-radius:99px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.pricing-period:hover{border-color:var(--gold-line)}

/* --- table cells --- */
.pricing-table{position:sticky;top:0}
.pricing-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;letter-spacing:.02em;
  color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
.pricing-name b{font-weight:600;display:block}
.pricing-name small{display:block;color:var(--ink-faint);font-size:11px;margin-top:1px}
.pricing-price{font-family:Georgia,serif;font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px;white-space:nowrap}
.pricing-tag{font-size:11.5px;font-weight:600;color:var(--ink-soft);background:var(--bg);
  border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.pricing-tag.wide{color:#8a6d2f;background:var(--gold-soft);border-color:var(--gold-line)}
.pricing-render{font-variant-numeric:tabular-nums;white-space:nowrap}
.pricing-render small{color:var(--ink-faint);font-size:11px;margin-left:2px}
.pricing-dash{color:var(--ink-faint)}
.pricing-costcol{color:var(--ink-soft)}
/* the cost-watch pair is the first to fold away on tighter widths (fill-don't-stretch) */
@media(max-width:1320px){.pricing-costcol{display:none}}

/* --- edit drawer --- */
.pricing-drawer{position:sticky;top:0}
.pricing-dmark{font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--mulberry);line-height:1;margin-bottom:8px;font-variant-numeric:tabular-nums}
.pricing-ro{color:var(--ink-faint);font-size:12px}

/* inline form controls */
.pricing-input{font:600 13px system-ui;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;outline:none;max-width:172px;text-align:right}
.pricing-input:focus{border-color:var(--gold);background:var(--card)}
.pricing-select{text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none;
  padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);
  background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.pricing-pricefield{display:flex;align-items:center;gap:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 4px 0 10px}
.pricing-pricefield:focus-within{border-color:var(--gold);background:var(--card)}
.pricing-pesosign{font-family:Georgia,serif;font-weight:700;color:var(--ink-soft);font-size:14px}
.pricing-num{border:none;background:none;padding:7px 6px;width:104px}
.pricing-num:focus{border:none;background:none}
.pricing-num::-webkit-outer-spin-button,.pricing-num::-webkit-inner-spin-button{opacity:.4}

/* toggle (mirrors the iOS-style switch idiom in palette vars) */
.pricing-toggle{width:42px;height:24px;border-radius:99px;border:1px solid var(--line);background:var(--bg);
  cursor:pointer;padding:0;position:relative;transition:background .14s,border-color .14s}
.pricing-toggle .pricing-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--card);box-shadow:var(--shadow);transition:left .14s}
.pricing-toggle.on{background:var(--mulberry);border-color:var(--mulberry)}
.pricing-toggle.on .pricing-knob{left:20px}

/* cost-watch read-only block in the drawer */
.pricing-cwbox{margin-top:14px;border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:var(--bg)}
.pricing-cw-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:8px}
.pricing-cw-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.pricing-cw-row:last-of-type{border-bottom:none}
.pricing-cw-row b{font-variant-numeric:tabular-nums}
.pricing-cw-row small{color:var(--ink-faint);font-weight:400}
.pricing-cw-foot{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.4}

/* two-admin gate note — live in drawer */
.pricing-gate{margin-top:14px}
.pricing-gate-card{display:flex;gap:11px;border-radius:11px;padding:12px 13px;align-items:flex-start}
.pricing-gate-card.ok{background:var(--sage-soft);border:1px solid var(--sage-line)}
.pricing-gate-card.warn{background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.pricing-gate-ico{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.pricing-gate-card.ok .pricing-gate-ico{background:var(--sage);color:#fff}
.pricing-gate-card.warn .pricing-gate-ico{background:var(--mulberry);color:#fff}
.pricing-gate-card b{font-weight:700;font-size:13px}
.pricing-gate-card.ok b{color:var(--sage)}
.pricing-gate-card.warn b{color:var(--mulberry)}
.pricing-gate-s{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.pricing-gate-list{margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--ink);line-height:1.5}
.pricing-gate-list li{margin:1px 0}

.pricing-acts{display:flex;gap:8px;margin-top:14px}

/* gate-note summary in the left rail */
.pricing-gatenote{font-size:12px;color:var(--ink-soft);line-height:1.4}
.pricing-gn-row{display:flex;align-items:flex-start;gap:8px;padding:4px 0}
.pricing-gn-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--mulberry);margin-top:5px}
.pricing-gn-foot{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-faint)}
.pricing-showing b{color:var(--mulberry)}

/* discountcodes */
/* ===== Discount codes surface — scoped extras. Palette vars only; every selector ".discountcodes-" prefixed. ===== */

/* list-detail body: filter rail | wide table | detail pane (mirrors .guestwrap) */
.discountcodes-wrap{display:grid;grid-template-columns:230px 1fr 348px;gap:16px;align-items:start}
/* ultrawide: widen the detail pane + let the table breathe — never stretch one column */
@media(min-width:1700px){.discountcodes-wrap{grid-template-columns:248px 1fr 392px}}
/* narrower desktop: drop the detail pane out of the grid flow */
@media(max-width:1320px){.discountcodes-wrap{grid-template-columns:220px 1fr}}
@media(max-width:1320px){.discountcodes-wrap .gdetail{display:none}}

/* rail help note */
.discountcodes-note{margin-top:16px;font-size:11.5px;line-height:1.55;color:var(--ink-soft);
  border-top:1px dashed var(--line);padding-top:13px}
.discountcodes-note b{color:var(--ink);font-weight:700}

/* ---- table cells ---- */
.discountcodes-code{font-family:Georgia,serif;font-weight:700;letter-spacing:.04em;font-size:14px}

.discountcodes-type{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;
  font-weight:700;font-size:12px;font-family:Georgia,serif}
.discountcodes-type.pct{color:var(--mulberry);background:var(--mulberry-soft);border:1px solid var(--mulberry-line)}
.discountcodes-type.flat{color:#8a6d2f;background:var(--gold-soft);border:1px solid var(--gold-line)}

.discountcodes-applies{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:inline-block;max-width:240px;vertical-align:bottom}

/* redemptions: count + mini progress bar (or unlimited tag) */
.discountcodes-redeem{display:flex;flex-direction:column;gap:5px;min-width:108px}
.discountcodes-redeem-n{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:13px}
.discountcodes-redeem-bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.discountcodes-redeem-bar i{display:block;height:100%;border-radius:99px}
.discountcodes-redeem-inf{font-size:11px;color:var(--ink-faint);letter-spacing:.03em}

/* ---- detail pane ---- */
.discountcodes-d-code{font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:.05em}
.discountcodes-bigval{color:var(--mulberry);font-weight:700}

/* redemption progress block */
.discountcodes-prog{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.discountcodes-prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-soft)}
.discountcodes-prog-top b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.discountcodes-prog-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:9px 0 7px}
.discountcodes-prog-bar i{display:block;height:100%;border-radius:99px}
.discountcodes-prog-cap{font-size:11px;color:var(--ink-faint);letter-spacing:.02em}

/* detail sub-heading (reuses .frail h4 rhythm) */
.discountcodes-d-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  margin:18px 0 9px;font-weight:700}

/* audit trail feed */
.discountcodes-audit{display:flex;flex-direction:column}
.discountcodes-aud{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.discountcodes-aud:last-child{border-bottom:none}
.discountcodes-aud-ico{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;background:var(--gold-soft);border:1px solid var(--gold-line)}
.discountcodes-aud-b{flex:1;font-size:12.5px;line-height:1.4}
.discountcodes-aud-b b{font-weight:700}
.discountcodes-aud-t{font-size:11px;color:var(--ink-faint);margin-top:2px}

/* action row */
.discountcodes-dact{display:flex;gap:7px;margin-top:16px}
.discountcodes-dact .btn{flex:1;padding:9px 6px;text-align:center}
.discountcodes-dact .btn.primary{flex:1.3}

/* addons */
/* ============================================================
   ADD-ONS surface — scoped extras (iteration 0023 § 3.12).
   Palette vars only · every selector ".addons-" prefixed.
   Desktop-native: auto-fit card grid (fills wider → more columns)
   + a fixed-width sticky right detail/editor pane.
   ============================================================ */

/* ---- tab + search toolbar ---- */
