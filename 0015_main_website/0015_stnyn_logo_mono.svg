<?xml version="1.0" encoding="UTF-8"?>
<!--
  STNYN Logo — Setnayan brandmark · MONOCHROME VINYL-CUT VARIANT
  Iteration 0015 — Setnayan Main Marketing Website
  Composition matches the stamp variant: STNYN · Baybayin · URL
  Use this variant for: vinyl cutters (single-color sheet), embroidery,
  laser etching, screen-printing one-color jobs, transfer paper.
  Every fill uses currentColor — set the color when embedding:
     <svg style="color:#1A1A1A">…</svg>   (ink, default)
     <svg style="color:#C97B4B">…</svg>   (terracotta accent)
     <svg style="color:#FAF6F0">…</svg>   (cream, for dark-vinyl cuts)
  Sun glyph and trailing period removed 2026-05-11.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="STNYN — Setnayan mono · www.setnayan.com" style="color:#1A1A1A">
  <defs>
    <style><![CDATA[
      .mono-letter {
        font-family: 'Inter', 'Manrope', system-ui, sans-serif;
        font-weight: 800;
        font-size: 60px;
        letter-spacing: 0.04em;
        fill: currentColor;
      }
      .mono-baybayin {
        font-family: 'Noto Sans Tagalog', 'Noto Serif Tagalog', 'Tagalog Unicode', serif;
        font-weight: 400;
        font-size: 32px;
        letter-spacing: 0.08em;
        fill: currentColor;
      }
      .mono-url {
        font-family: 'DM Mono', 'IBM Plex Mono', monospace;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        fill: currentColor;
      }
    ]]></style>
  </defs>

  <!-- STNYN wordmark, centered, top -->
  <text x="160" y="80" text-anchor="middle" class="mono-letter">STNYN</text>

  <!-- Baybayin script — "Setnayan" -->
  <text x="160" y="130" text-anchor="middle" class="mono-baybayin">ᜐᜒᜆ᜔ᜈᜌᜈ᜔</text>

  <!-- URL -->
  <text x="160" y="180" text-anchor="middle" class="mono-url">WWW.SETNAYAN.COM</text>
</svg>
