<?xml version="1.0" encoding="UTF-8"?>
<!--
  STNYN Logo — Setnayan brandmark · PRIMARY VERTICAL LOCKUP
  Iteration 0015 — Setnayan Main Marketing Website
  Locked 2026-05-11.

  Composition (top → bottom, all centered):
    1. Pin + star primary mark — terracotta teardrop with negative-space star
    2. STNYN consonant logotype — bold sans-serif
    3. www.setnayan.com URL tagline

  The pin uses the even-odd fill rule so its inner disc is a TRUE TRANSPARENT
  HOLE — the bg color shows through. Render against any color (cream, black,
  brand orange) and the cutout always reads correctly.

  Brand colors:
    Pin body / star : #C97B4B  (accent terracotta)
    STNYN wordmark  : #1A1A1A  (ink)
    URL tagline     : #1A1A1A  (ink, lower opacity)

  Companions:
    0015_setnayan_mark.svg    — pin + star alone (favicon / app icon / badge)
    0015_setnayan_phrase.svg  — "Set na 'yan." with pin-as-apostrophe lockup
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" role="img" aria-label="STNYN — Setnayan · www.setnayan.com">
  <title>STNYN — Setnayan</title>
  <desc>Vertical brand lockup: pin and star icon, STNYN consonant logotype, www.setnayan.com URL tagline.</desc>

  <defs>
    <style><![CDATA[
      .stnyn-letter {
        font-family: 'Inter', 'Manrope', system-ui, sans-serif;
        font-weight: 900;
        font-size: 200px;
        letter-spacing: 0.04em;
        fill: #1A1A1A;
      }
      .stnyn-tag {
        font-family: 'Inter', 'Manrope', system-ui, sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: 0.02em;
        fill: #1A1A1A;
        opacity: 0.92;
      }
    ]]></style>
  </defs>

  <!-- Pin + star — centered, ~340px tall, top y=20 -->
  <g transform="translate(290 20) scale(1.13)">
    <!-- Single path with even-odd fill: outer pin shape minus inner disc = transparent hole -->
    <path
      d="M 100 270
         C 60 248, 10 178, 10 100
         A 90 90 0 1 1 190 100
         C 190 178, 140 248, 100 270 Z
         M 100 38
         A 62 62 0 1 0 100 162
         A 62 62 0 1 0 100 38 Z"
      fill="#C97B4B"
      fill-rule="evenodd"/>
    <!-- 5-point star, terracotta — sits inside the transparent disc -->
    <polygon
      points="100,58 108.99,87.93 139.94,87.61 114.42,105.07 123.51,134.96 100,116.88 76.49,134.96 85.58,105.07 60.06,87.61 91.01,87.93"
      fill="#C97B4B"/>
  </g>

  <!-- STNYN wordmark — centered horizontally, baseline at y=580 -->
  <text x="400" y="580" text-anchor="middle" class="stnyn-letter">STNYN</text>

  <!-- URL tagline — centered, baseline at y=680 -->
  <text x="400" y="680" text-anchor="middle" class="stnyn-tag">www.setnayan.com</text>
</svg>
