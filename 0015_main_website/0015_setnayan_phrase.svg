<?xml version="1.0" encoding="UTF-8"?>
<!--
  "Set na 'yan." — phrase lockup with pin-as-apostrophe
  Iteration 0015 — Setnayan Main Marketing Website
  Locked 2026-05-11.

  Concept: the brand-origin phrase "Set na 'yan." rendered as display type, with
  the pin+star primary mark literally taking the place of the apostrophe between
  "na" and "yan". The pin marks the spot — Setnayan as the place where the event
  is "set."

  Use this where you'd otherwise use a tagline pull-quote: hero callouts,
  splash banners, brand-origin sections, marketing collateral, packaging.

  Brand colors:
    Phrase text     : #1A1A1A  (ink)
    Pin (apostrophe): #C97B4B  (accent terracotta)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-label="Set na 'yan. — Setnayan brand origin phrase, with the location pin as the apostrophe">
  <title>Set na 'yan.</title>
  <desc>The phrase "Set na 'yan" rendered as display type, with the Setnayan pin+star brandmark used as the apostrophe between "na" and "yan."</desc>

  <defs>
    <style><![CDATA[
      .phrase {
        font-family: 'Cormorant Garamond', 'Georgia', serif;
        font-weight: 500;
        font-style: italic;
        font-size: 220px;
        fill: #1A1A1A;
      }
    ]]></style>
  </defs>

  <!-- "Set na" — left run, baseline at y=210 -->
  <text x="40" y="210" class="phrase">Set na</text>

  <!-- Pin replaces the apostrophe — sized to match cap height, sits where ' would -->
  <!-- Pin native viewBox is 200×280; here scaled to 70 wide × 98 tall, positioned at the apostrophe slot -->
  <g transform="translate(620 28) scale(0.35)">
    <path
      d="M 100 270
         C 60 248, 10 178, 10 100
         A 90 90 0 1 1 190 100
         C 190 178, 140 248, 100 270 Z
         M 100 38
         A 62 62 0 1 0 100 162
         A 62 62 0 1 0 100 38 Z"
      fill="#C97B4B"
      fill-rule="evenodd"/>
    <polygon
      points="100,58 108.99,87.93 139.94,87.61 114.42,105.07 123.51,134.96 100,116.88 76.49,134.96 85.58,105.07 60.06,87.61 91.01,87.93"
      fill="#C97B4B"/>
  </g>

  <!-- "yan." — right run, baseline at y=210 -->
  <text x="710" y="210" class="phrase">yan.</text>
</svg>
