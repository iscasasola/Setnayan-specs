<?xml version="1.0" encoding="UTF-8"?>
<!--
  Setnayan Primary Brandmark — pin + star (icon only)
  Iteration 0015 — Setnayan Main Marketing Website
  Locked 2026-05-11.

  This is THE mark. Use it where the full vertical lockup (0015_stnyn_logo.svg)
  would be too tall — favicons, app icons, social avatars, vendor verified
  badges, the apostrophe slot in "Set na 'yan." phrase lockups.

  Inner disc uses fill-rule="evenodd" — true transparent hole. The star sits
  inside the hole so any background color (cream, black, terracotta) reads
  correctly. The mark is monochrome by design: pin body and star are the same
  terracotta; the bg shows through the disc to give the star its silhouette.

  Brand colors:
    Pin body / star : #C97B4B  (accent terracotta)
    Inner disc      : transparent (whatever bg sits behind)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" role="img" aria-label="Setnayan brandmark — location pin with star inside">
  <title>Setnayan</title>
  <desc>A location pin with a 5-point star inside its circular head. The primary Setnayan brandmark.</desc>

  <!-- Pin body with inner disc as a true transparent hole (even-odd fill rule) -->
  <path
    d="M 100 270
       C 60 248, 10 178, 10 100
       A 90 90 0 1 1 190 100
       C 190 178, 140 248, 100 270 Z
       M 100 38
       A 62 62 0 1 0 100 162
       A 62 62 0 1 0 100 38 Z"
    fill="#C97B4B"
    fill-rule="evenodd"/>

  <!-- 5-point star, terracotta — sits inside the transparent disc -->
  <polygon
    points="100,58 108.99,87.93 139.94,87.61 114.42,105.07 123.51,134.96 100,116.88 76.49,134.96 85.58,105.07 60.06,87.61 91.01,87.93"
    fill="#C97B4B"/>
</svg>
