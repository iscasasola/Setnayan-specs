<?xml version="1.0" encoding="UTF-8"?>
<!--
  STNYN Logo — Setnayan brandmark · COMPACT STAMP
  Iteration 0015 — Setnayan Main Marketing Website
  Composition (top→bottom, all centered):
    1. STNYN consonant logotype
    2. Baybayin script ᜐᜒᜆ᜔ᜈᜌᜈ᜔ ("Setnayan")
    3. WWW.SETNAYAN.COM url line
  Use this variant for: car stickers / decals, app icon, favicon, social avatar,
  letterhead seal, anywhere a self-contained mark with the URL is needed.
  Sticker-readiness rules followed:
    · single solid color per element (no gradients, no fine outlines)
    · all type sized to cut cleanly in vinyl at 100 mm sticker height
    · no shapes thinner than 6 px equivalent
  Sun glyph and trailing period removed 2026-05-11.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="STNYN — Setnayan stamp · www.setnayan.com">
  <defs>
    <style><![CDATA[
      .stnyn-ink    { fill: #1A1A1A; }
      .stnyn-accent { fill: #C97B4B; }
      .stnyn-letter {
        font-family: 'Inter', 'Manrope', system-ui, sans-serif;
        font-weight: 800;
        font-size: 60px;
        letter-spacing: 0.04em;
        fill: #1A1A1A;
      }
      .stnyn-baybayin {
        font-family: 'Noto Sans Tagalog', 'Noto Serif Tagalog', 'Tagalog Unicode', serif;
        font-weight: 400;
        font-size: 32px;
        letter-spacing: 0.08em;
        fill: #C97B4B;
      }
      .stnyn-url {
        font-family: 'DM Mono', 'IBM Plex Mono', monospace;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        fill: #1A1A1A;
        opacity: 0.78;
      }
    ]]></style>
  </defs>

  <!-- STNYN wordmark, centered, top -->
  <text x="160" y="80" text-anchor="middle" class="stnyn-letter">STNYN</text>

  <!-- Baybayin script — "Setnayan" -->
  <text x="160" y="130" text-anchor="middle" class="stnyn-baybayin">ᜐᜒᜆ᜔ᜈᜌᜈ᜔</text>

  <!-- URL — the call-to-action that makes the sticker functional -->
  <text x="160" y="180" text-anchor="middle" class="stnyn-url">WWW.SETNAYAN.COM</text>
</svg>
