<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=393,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}
body{background:#FBFBFA}
.shell-topbar{display:none}
.main{padding:24px 16px}
:root{--paper:#FBFBFA;--ink:#1E2229;--gold:#C5A059;--gold-deep:#8C6932;--mulberry:#5C2542;--ink-soft:#5C6660;--line:rgba(30,34,41,.12);--topbar-h:62px;--head-h:38px;--botnav-h:96px;--ease:cubic-bezier(.22,.61,.36,1);--serif:'Cormorant Garamond',Georgia,serif;--mono:ui-monospace,monospace}
.pba{position:relative;margin-top:-24px;background:var(--paper);color:var(--ink)}
.pba .topbar{position:sticky;top:0;z-index:60;min-height:var(--topbar-h);background:var(--ink);color:var(--paper);display:flex;align-items:center;padding:0 18px;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
.pba .topbar .figv{font-family:var(--serif);font-style:italic;font-size:19px;font-weight:600}
.pba .body{max-width:760px;margin:0 auto;padding:0}
.pba .intro{display:flex;flex-direction:column;gap:14px;padding:26px 22px 16px;min-height:calc(100svh - var(--topbar-h) - var(--botnav-h));background:var(--paper)}
.pba .intro-h{font-family:var(--serif);font-style:italic;font-size:29px;color:var(--ink)}
.pba .ibox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 15px}
.pba .intro-cta{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.pba .intro-cta .chev{font-size:18px}
.pba .cat-head{position:sticky;height:var(--head-h);background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}
.pba .cat-head .nm{font-family:var(--serif);font-style:italic;font-size:18px;font-weight:600}
.pba .cat-body{padding:14px 0 22px}
.pba .empty-child{display:flex;align-items:center;gap:10px;margin:0 20px 8px;padding:11px 14px;border:1.5px dashed rgba(92,37,66,.3);border-radius:12px;background:rgba(92,37,66,.03);width:calc(100% - 40px);box-sizing:border-box}
.pba .empty-child .en{font-family:system-ui;font-size:13.5px;font-weight:600;color:var(--mulberry)}
.pba .empty-child .eh{margin-left:auto;font-family:var(--mono);font-size:8px;text-transform:uppercase;color:#b8b4ac}
.pba .end-spacer{padding:30px 18px 0}
.pba .endcard{background:var(--mulberry);color:#fff;border-radius:22px;padding:24px;text-align:center}
.pba .endcard h3{font-family:var(--serif);font-style:italic;font-size:22px}
/* fake fixed bottom nav, z-30, ~96px with safe-area */
.botnav{position:fixed;inset-inline:0;bottom:0;z-index:30;height:96px;background:rgba(251,248,242,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding-top:8px;font-size:11px}
</style></head><body>
<div class="main"><div class="pba">
  <div class="topbar"><div class="figv">₱180k</div></div>
  <div class="body">
    <div class="intro">
      <div style="font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep)">Your budget &amp; plan</div>
      <div class="intro-h">Where your day stands</div>
      <div class="ibox">Estimate · Chosen · Could land</div>
      <div class="ibox">What to lock next: Nothing urgent</div>
      <div class="intro-cta"><span>Your categories below</span><span class="chev">↓</span></div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="end-spacer"><div class="endcard"><h3>Look how far you've come</h3><p>~18 hours saved · 5 shortlisted</p></div></div>
  </div>
</div></div>
<div class="botnav"><span>Home</span><span>Guests</span><span>Vendors</span><span>Website</span><span>Add-ons</span><span>More</span></div>
<script>
var F=["Venue","Planning","Feast","Design","Program","Documentary","Look","Booths","Prints","Transport"],T=62,H=38,c=document.getElementById('cats');
F.forEach(function(n,i){var h=document.createElement('div');h.className='cat-head';h.style.top='calc('+T+'px + '+i+'*'+H+'px)';h.style.zIndex=25-i;h.innerHTML='<span class="nm">'+n+'</span><span style="font-family:ui-monospace;font-size:11px;color:#8C6932">'+(i===0?'5 SHORTLISTED':'NOT STARTED')+'</span>';c.appendChild(h);var b=document.createElement('div');b.className='cat-body';if(i<2){b.innerHTML='<button class="empty-child"><span>+</span><span class="en">Find '+n.toLowerCase()+'</span><span class="eh">Search</span></button>';}else{b.innerHTML='<div style="height:150px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#efe9df,#e4dccd);margin:0 18px 10px"></div>';}c.appendChild(b);});
</script>
</body></html>
