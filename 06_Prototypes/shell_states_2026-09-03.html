<meta charset="utf-8">
<title>Setnayan Shell States</title>
<!--
  shell_states_2026-09-03.html — REFERENCE PROTOTYPE, not production code.
  The shared shell (top bar + left rail) reproduced faithfully across five real
  account states, so the rail's "one shell" rule can be seen instead of read:
  My Home and Studio are furniture that never move; each context (event / shop /
  admin console) is PUSHED IN as an additional group, never a replacement.
  Light mode only, matching the shipped front door's own lock.
-->
<style>
  :root{
    --cream:#ffffff; --ink:#2c2a29; --gold:#8c6932; --hi:#a9834b;
    --link:#3b4e67; --m1:#6e6a62; --m2:#8a857b; --m3:#a09a8e;
    --line:#e1dcd1; --wash:#f3ecdf; --hover:#f4eee3;
    --gold300:#CBA766; --success:#5E7C52;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --r-xs:6px; --r-sm:10px; --r-md:14px; --r-full:999px;
    --shadow:0 10px 44px rgba(96,78,48,.13), 0 2px 8px rgba(96,78,48,.07);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:#ece5d6; color:var(--ink);
    font-family:var(--sys); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
  a{color:inherit}
  button{font:inherit}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }

  /* ═══ deck chrome — the review harness, not the product ═══ */
  .deck-bar{
    position:sticky; top:0; z-index:60; background:var(--ink); color:#f5f1e8;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:10px 18px;
  }
  .deck-title{font-weight:800; letter-spacing:.14em; font-size:12px; text-transform:uppercase; color:var(--gold300); white-space:nowrap}
  .deck-title small{display:block; letter-spacing:.02em; text-transform:none; font-weight:500; color:#b7b0a4; font-size:11px}
  .tabs{display:flex; gap:6px; flex-wrap:wrap}
  .tab{
    border:1px solid rgba(245,241,232,.28); background:none; color:#f5f1e8;
    border-radius:var(--r-full); padding:5px 13px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .tab:hover{border-color:rgba(245,241,232,.6)}
  .tab[aria-pressed="true"]{background:var(--gold); border-color:var(--gold); font-weight:650}
  .deck-opts{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:#cfc9bd}
  .deck-opts input{accent-color:var(--gold)}
  .deck-note{
    margin:0; padding:9px 18px; font-size:12.5px; color:var(--m1);
    background:var(--wash); border-bottom:1px solid var(--line);
  }
  .deck-note b{color:var(--ink); font-weight:650}
  .scrollx{overflow-x:auto}

  /* ═══ the artboard ═══ */
  .board{padding:26px 26px 60px}
  .mock{
    min-width:1140px; max-width:1480px; margin:0 auto; background:var(--cream);
    border:1px solid #ddd6c7; border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow);
  }
  /* top bar — shipped grammar: 1fr / minmax(0,640px) / 1fr */
  .topbar{
    display:grid; grid-template-columns:1fr minmax(0,640px) 1fr; align-items:center;
    gap:16px; padding:10px 16px; background:var(--cream);
  }
  .topleft{display:flex; align-items:center; gap:8px}
  .iconbtn{
    width:40px; height:40px; border:0; background:none; border-radius:var(--r-full);
    display:grid; place-items:center; color:var(--ink); cursor:pointer; position:relative;
  }
  .iconbtn:hover{background:var(--hover)}
  .iconbtn svg{width:20px; height:20px}
  .iconbtn .dot{
    position:absolute; top:8px; right:9px; width:8px; height:8px; border-radius:50%;
    background:var(--gold); border:2px solid var(--cream);
  }
  .iconbtn .nbadge{
    position:absolute; top:4px; right:2px; min-width:16px; height:16px; padding:0 4px;
    border-radius:var(--r-full); background:var(--gold); color:#fff;
    font-size:10px; font-family:var(--mono); display:grid; place-items:center;
  }
  .wordmark{
    font-weight:800; letter-spacing:.15em; font-size:15px; color:var(--ink);
    text-decoration:none; padding:0 4px; text-transform:uppercase;
  }
  .searchbox{
    display:flex; align-items:center; border:1px solid var(--line); border-radius:var(--r-full);
    background:var(--cream); height:40px; min-width:0;
  }
  .searchbox input{
    flex:1; min-width:0; border:0; outline:none; background:none; font:inherit;
    font-size:14px; color:var(--ink); padding:0 16px; align-self:stretch;
  }
  .searchbox input::placeholder{color:var(--m2)}
  .kbd{
    flex:0 0 auto; margin-right:8px; border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; font-size:10.5px; font-family:var(--mono); color:var(--m2); background:#faf7f0;
  }
  .searchgo{
    width:58px; align-self:stretch; display:grid; place-items:center; background:#f6f1e7;
    border:0; border-left:1px solid var(--line); color:var(--m1); cursor:pointer;
    border-radius:0 var(--r-full) var(--r-full) 0;
  }
  .searchgo:hover{background:var(--wash)}
  .searchgo svg{width:18px; height:18px}
  .topright{display:flex; justify-content:flex-end; align-items:center; gap:8px}
  .pill-gold{
    white-space:nowrap; min-height:36px; padding:0 15px; border-radius:var(--r-full);
    background:var(--gold); color:#fff; border:0; font-size:13.5px; font-weight:650;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  }
  .pill-gold:hover{background:#7b5c2c}
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--wash);
    border:1px solid var(--line); display:grid; place-items:center; font-size:11px;
    font-weight:700; color:var(--gold); font-family:var(--mono); cursor:pointer;
  }

  /* ═══ body grid — rail + main ═══ */
  .mockbody{display:grid; grid-template-columns:var(--railw,240px) 1fr; min-height:640px}
  .mock[data-rail="compact"]{--railw:72px}

  .rail{padding:10px 8px 24px}
  .row{
    position:relative; display:flex; align-items:center; gap:12px; width:100%;
    min-height:44px; padding:0 12px; border-radius:var(--r-xs); border:0; background:none;
    font-size:14px; color:var(--ink); text-align:left; cursor:pointer; text-decoration:none;
  }
  .row:hover{background:var(--hover)}
  .row[data-on="true"]{background:var(--wash); font-weight:650}
  .row[data-on="true"]::before{
    content:''; position:absolute; left:0; top:9px; bottom:9px; width:3px;
    border-radius:0 3px 3px 0; background:var(--gold);
  }
  .gi{width:20px; flex:0 0 20px; display:flex; align-items:center; justify-content:center; color:var(--m1)}
  .gi svg{width:19px; height:19px}
  .lbl{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cnt{font-family:var(--mono); font-size:11.5px; color:var(--m2); flex:0 0 auto}
  .ct-word{font-family:var(--sys); font-size:11px; color:var(--m3); flex:0 0 auto}
  .ubadge{
    flex:0 0 auto; min-width:18px; height:18px; padding:0 5px; border-radius:var(--r-full);
    background:var(--gold); color:#fff; font-size:10.5px; font-family:var(--mono);
    display:grid; place-items:center;
  }
  .cap{display:none}
  .row2{min-height:56px; align-items:flex-start; padding-top:8px; padding-bottom:8px}
  .row2 .gi{margin-top:2px}
  .row2 .lbl{white-space:normal}
  .tool-name{display:block; font-size:14px; line-height:1.35}
  .tool-line{
    display:block; font-size:11.5px; line-height:1.4; color:var(--m2); margin-top:1px;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;
  }
  .tryit{
    flex:0 0 auto; align-self:flex-start; margin-top:3px;
    font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
    color:var(--gold); border:1px solid var(--gold300); border-radius:var(--r-xs);
    padding:1px 5px; background:#fdf8ec;
  }
  .rdiv{height:1px; background:var(--line); margin:12px}
  .rlabel{
    padding:10px 12px 3px; font-size:11px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--m2);
  }
  .rlabel small{font-weight:500; text-transform:none; letter-spacing:.01em; color:var(--m3); font-size:11px; margin-left:4px}
  .rctx{padding:8px 12px 4px}
  .rctx .cname{font-size:12.5px; font-weight:700; letter-spacing:.02em}
  .rctx .csub{font-size:11px; color:var(--m3)}
  .smallprint{padding:16px 12px 8px; display:flex; flex-wrap:wrap; gap:4px 10px}
  .smallprint a{font-size:12px; color:var(--m2); text-decoration:none}
  .smallprint a:hover{color:var(--gold); text-decoration:underline}

  /* ── the free-tools card grids: Planner / Builder / Together ──
     Card presentation distinguishes "free tools you already have" from the
     paid Studio products, which keep their flat text rows below. */
  .tgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:2px 8px 6px}
  .tcard{
    position:relative; border:1px solid var(--line); border-radius:var(--r-sm);
    background:#fbf8f1; padding:9px 9px 8px; display:flex; flex-direction:column;
    gap:3px; text-decoration:none; color:inherit;
  }
  .tcard:hover{background:var(--hover)}
  .tcard .gi{width:auto; flex:none; justify-content:flex-start; margin-bottom:1px}
  .tcard .tname{font-size:12px; font-weight:650; line-height:1.25}
  .tcard .tline{
    font-size:10.5px; line-height:1.35; color:var(--m2);
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;
  }
  .tnew{
    position:absolute; top:6px; right:6px; font-size:8.5px; letter-spacing:.08em;
    text-transform:uppercase; font-weight:700; color:var(--m2);
    border:1px solid var(--line); border-radius:4px; padding:0 4px; background:#f4f0e6;
  }

  /* ── state 6's main area: the signed-in homepage feed, no anchor ── */
  .fs-head{display:flex; align-items:baseline; gap:10px; margin:16px 0 10px}
  .fs-head h2{margin:0; font-size:15.5px; font-weight:700; letter-spacing:-.01em}
  .fs-cap{font-size:11.5px; color:var(--m2)}
  .shopband{background:#f8f4ea; border:1px solid var(--line); border-radius:var(--r-md); padding:2px 18px 16px; margin-bottom:6px}
  .shoprow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .shop{
    display:flex; align-items:center; gap:11px; padding:11px 13px; background:var(--cream);
    border:1px solid var(--line); border-radius:var(--r-sm); text-decoration:none; color:inherit;
  }
  .shop:hover{background:var(--hover)}
  .shoplogo{
    width:40px; height:40px; flex:0 0 40px; border-radius:var(--r-xs); background:var(--wash);
    border:1px solid var(--line); display:grid; place-items:center; font-size:11.5px;
    font-weight:700; color:var(--gold); font-family:var(--mono);
  }
  .shopname{display:flex; align-items:center; gap:5px; font-size:13px; font-weight:600; line-height:1.3}
  .shopname svg{width:13px; height:13px; color:var(--success); flex:0 0 13px}
  .shopcap{font-size:11.5px; color:var(--m2)}
  .shop-recruit{border-style:dashed; border-color:var(--gold300); background:#fdfaf2}
  .shop-recruit .shoplogo{background:#fff; border-style:dashed; border-color:var(--gold300)}
  .fgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px 14px; margin-bottom:4px}
  .fcard{min-width:0; display:block; text-decoration:none; color:inherit}
  .thumb{
    aspect-ratio:16/9; border-radius:var(--r-sm); position:relative; overflow:hidden;
    display:grid; place-items:center;
  }
  .fcard:hover .thumb{filter:brightness(.97)}
  .thumb svg{width:38px; height:38px; color:#b0a48a; opacity:.8}
  .th-plan{background:linear-gradient(135deg,#eae1cf,#d6c9ae)}
  .th-cult{background:linear-gradient(135deg,#e9d9c6,#d5bd9d)}
  .th-vend{background:linear-gradient(135deg,#e2ddd2,#c9c2b0)}
  .dur{
    position:absolute; right:6px; bottom:6px; background:rgba(30,28,26,.85); color:#f5f1e8;
    border-radius:var(--r-xs); padding:1px 6px; font-size:11px; font-family:var(--mono);
  }
  .cmeta{display:flex; gap:10px; padding-top:10px}
  .fava{
    width:32px; height:32px; border-radius:50%; flex:0 0 32px; background:var(--wash);
    border:1px solid var(--line); display:grid; place-items:center; font-size:10.5px;
    font-weight:700; color:var(--gold); font-family:var(--mono);
  }
  .fttl{
    font-size:13.5px; font-weight:500; line-height:1.4; margin:0 0 3px;
    display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .fby{font-size:11.5px; color:var(--m1); line-height:1.5; margin:0; min-width:0}
  .fby + .fby{color:var(--m2)}
  .ktag{
    display:inline-block; font-size:9px; letter-spacing:.1em; text-transform:uppercase;
    font-weight:700; border:1px solid var(--line); border-radius:var(--r-xs);
    padding:1px 5px; margin-right:4px; color:var(--m1); background:#f7f3ea;
  }
  .trendnote{
    border:1px solid #ece4d3; background:#faf6ec; border-radius:var(--r-sm);
    padding:16px 18px; font-size:12.5px; color:var(--m1);
  }
  .trendnote b{display:block; color:var(--ink); font-size:14px; margin-bottom:2px}

  /* the review overlay: rows that APPEARED vs the previous state */
  .is-new{background:#fcf6e8; box-shadow:inset 0 0 0 1px #ecd9b4}
  .is-new:hover{background:#f8f0dd}
  body[data-hl="off"] .is-new{background:none; box-shadow:none}
  body[data-hl="off"] .is-new:hover{background:var(--hover)}

  /* compact 72px icon strip — shipped behaviour mirrored, every state */
  .mock[data-rail="compact"] .rail{padding:10px 4px 24px}
  .mock[data-rail="compact"] .lbl,
  .mock[data-rail="compact"] .cnt,
  .mock[data-rail="compact"] .ct-word,
  .mock[data-rail="compact"] .rlabel,
  .mock[data-rail="compact"] .rctx,
  .mock[data-rail="compact"] .tryit,
  .mock[data-rail="compact"] .smallprint,
  .mock[data-rail="compact"] .tool-line{display:none}
  .mock[data-rail="compact"] .row{
    flex-direction:column; gap:4px; padding:8px 2px; font-size:10px;
    min-height:60px; justify-content:center; text-align:center;
  }
  .mock[data-rail="compact"] .row2{min-height:60px; align-items:center; padding-top:8px; padding-bottom:8px}
  .mock[data-rail="compact"] .row2 .gi{margin-top:0}
  .mock[data-rail="compact"] .cap{
    display:block; font-size:10px; line-height:1.2; color:var(--m1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;
  }
  .mock[data-rail="compact"] .ubadge{position:absolute; top:6px; right:8px}
  .mock[data-rail="compact"] .rdiv{margin:10px 6px}
  /* the free-tools card grids collapse to icon-only, like every other row */
  .mock[data-rail="compact"] .tgrid{grid-template-columns:1fr; gap:2px; padding:2px 4px}
  .mock[data-rail="compact"] .tcard{
    align-items:center; text-align:center; padding:8px 2px; gap:4px;
    background:none; border:0;
  }
  .mock[data-rail="compact"] .tcard:hover{background:var(--hover)}
  .mock[data-rail="compact"] .tcard .gi{margin:0; justify-content:center}
  .mock[data-rail="compact"] .tcard .tname,
  .mock[data-rail="compact"] .tcard .tline,
  .mock[data-rail="compact"] .tnew{display:none}
  .mock[data-rail="compact"] .tcard .cap{
    display:block; font-size:10px; line-height:1.2; color:var(--m1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;
  }

  /* the reveal panel behind "Show more" */
  .reveal{overflow:hidden}
  .reveal[data-open="false"]{display:none}
  .showmore .gi svg{transition:transform .15s ease}
  .showmore[data-open="true"] .gi svg{transform:rotate(180deg)}

  /* ═══ main content placeholders ═══ */
  .main{padding:22px 28px; background:var(--cream)}
  .ph{
    height:100%; min-height:560px; border:1px dashed #d8d0bd; border-radius:var(--r-md);
    background:#fbf8f1; display:grid; place-items:center; text-align:center; padding:40px;
  }
  .ph .pt{font-size:19px; font-weight:700; letter-spacing:-.01em; margin:0 0 6px}
  .ph .ps{font-size:13px; color:var(--m2); margin:0; max-width:44ch}
  .ph .pk{
    display:inline-block; margin-bottom:14px; font-size:10px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; color:var(--m2);
    border:1px solid var(--line); border-radius:var(--r-xs); padding:2px 7px; background:#f7f3ea;
  }
</style>

      note:'<b>Signed out on /.</b> Marketplace search and a Sign-in pill. Rail: Home, then a <b>deliberate gap</b> (the sign-in prompt panel and “What is Alaala?” were just removed — not missing content), then Studio selling with one-liners and three “try it” markers, then the small print.'},

    { name:'Signed in on /',
      top: ()=>`<div class="topleft">${railBtn}${wordmark}</div>${searchPalette()}
        <div class="topright">${create}${bell(false)}${avatar('BM')}</div>`,
      rail: ()=> row({key:'home',icon:'i-home',label:'Home',on:true}) +
        /* Marketplace row deliberately HIDDEN here — it appears only inside an event */
        rdiv() + myHome(false) + toolboxGroups() + studioGroup(true) + smallprint(),
      main:{k:'/',t:'Home',s:'Same public feed — you came out to read. “Back to your events” is the way back in.'},
      note:'<b>Signed in, still on /.</b> The search becomes a command palette; + Create event, bell and avatar join the bar. Marketplace row stays hidden right after login (owner ruling). “My Home” appears, and so do the three <b>free-tool card grids — Planner / Builder / Together</b> — new rail furniture in every signed-in state, drawn as cards so free tools read differently from the paid Studio rows below (which stay exactly as they were, lines gone — signed in, silence beats selling). Together’s items wear a muted “new” tag: <b>none has a public explainer page yet</b>, a real gap.'},

    { name:'Inside an event',
      top: ()=>`<div class="topleft">${railBtn}${wordmark}</div>${searchPalette()}
        <div class="topright">${create}${bell(true)}${msgs(3)}${avatar('BM')}</div>`,
      rail: ()=> row({key:'home',icon:'i-home',label:'Home'}) +
        row({key:'find',icon:'i-compass',label:'Marketplace',cap:'Market'}) +
        rdiv() + myHome(true) +
        rdiv() + rctx('Bea & Marco’s Wedding','June 2027 · Tagaytay') +
        sectionRows('ev',EVENT_SECTIONS) +
        categoryGroup() + toolboxGroups() + studioGroup(true) + smallprint(),
      main:{k:'/dashboard/[eventId]',t:'Event Home — Bea & Marco’s Wedding',s:'Placeholder — this artifact is about the rail changing, not this page.'},
      note:'<b>Inside an event.</b> The Marketplace row <b>appears — the only state it does</b>. The event’s own menu is <b>pushed in under My Home</b> (nothing above it moved), then Browse by category with its Show more toggle, then the same Studio — now scoped to open THIS event’s tools. The account cluster is the event’s own: its bell, its unread messages.'},

    { name:'Vendor shop',
      top: ()=>`<div class="topleft">${railBtn}${wordmark}</div>${searchPalette()}
        <div class="topright">${createShop}${bell(false)}${avatar('SC')}</div>`,
      rail: ()=> row({key:'home',icon:'i-home',label:'Home'}) +
        /* Marketplace hidden again — being a vendor is not "inside an event" */
        rdiv() + myHome(true) +
        rdiv() + rlabel('What you run') +
        row({key:'run-shop',icon:'i-store',label:'Silaw Films',cap:'Shop',ctWord:'your shop',on:true}) +
        rctx('Silaw Films','your shop’s desk') +
        sectionRows('shop',SHOP_SECTIONS) +
        toolboxGroups() + studioGroup(true) + smallprint(),
      main:{k:'/vendor-dashboard',t:'Shop Dashboard — Silaw Films',s:'Placeholder — the rail is the subject here.'},
      note:'<b>A vendor’s own shop.</b> Marketplace hidden again (a shop is not “inside an event”). The create pill becomes “<b>+ Create service card</b>” — the shop’s real primary action, per the shipped vendor-dashboard layout. “<b>What you run</b>” gains one row — the shop’s own name — and the shop’s menu is pushed in beneath it. My Home, the free-tool grids and Studio are untouched: the furniture never moves.'},

    { name:'Admin HQ',
      /* verified: the shipped admin bar passes createSlot={null} on purpose —
         no create pill; the admin's primary action is a different pill already
         in that bar */
      top: ()=>`<div class="topleft">${railBtn}${wordmark}</div>${searchPalette()}
        <div class="topright">${bell(true)}${avatar('IC')}</div>`,
      rail: ()=> row({key:'home',icon:'i-home',label:'Home'}) +
        rdiv() + myHome(true) +
        rdiv() + rlabel('What you run') +
        row({key:'run-hq',icon:'i-shield',label:'Setnayan HQ',cap:'HQ',ctWord:'admin',on:true}) +
        rctx('Setnayan HQ','console · illustrative set') +
        sectionRows('hq',ADMIN_SECTIONS) +
        toolboxGroups() + studioGroup(true) + smallprint(),
      main:{k:'/admin',t:'Admin Console — Setnayan HQ',s:'Placeholder — console categories shown in the rail are a representative, illustrative handful.'},
      note:'<b>The admin console.</b> No create pill — the shipped admin bar passes <b>createSlot={null}</b> deliberately. “What you run” holds <b>Setnayan HQ</b>; the console’s menu (illustrative handful) is pushed in beneath it. Everything else — My Home, the free-tool grids, Studio, small print — is identical to every other signed-in state.'},

    { name:'Back on /',
      /* owner-confirmed: a signed-in visitor landing back on / (logo click,
         bookmark) knows what Setnayan is — NO category-anchor strip; the
         content area goes straight to Shops → New uploads → Trending. */
      top: ()=>`<div class="topleft">${railBtn}${wordmark}</div>${searchPalette()}
        <div class="topright">${create}${bell(false)}${avatar('BM')}</div>`,
      rail: ()=> row({key:'home',icon:'i-home',label:'Home',on:true}) +
        rdiv() + myHome(false) + toolboxGroups() + studioGroup(true) + smallprint(),
      mainHtml: feedMain,
      note:'<b>Signed in, back on /.</b> Owner-confirmed: no anchor strip for someone who already knows what Setnayan is — the content area skips straight to <b>Shops → New uploads → Trending</b> (the honest sparse state, from the Home Feed prototype). Top bar and rail are state 2’s exactly.'},
  ];

  /* ─── render + diff highlight ─── */
  const topbarEl = document.getElementById('topbar');
  const railEl   = document.getElementById('rail');
  const mainEl   = document.getElementById('main');
  const noteEl   = document.getElementById('decknote');
  const mock     = document.getElementById('mock');
  const tabs     = [...document.querySelectorAll('.tab')];

  function keysOf(html){
    const ks=[]; const re=/data-key="([^"]+)"/g; let m;
    while((m=re.exec(html))) ks.push(m[1]); return ks;
  }
  function render(i){
    const s = STATES[i];
    topbarEl.innerHTML = s.top();
    railEl.innerHTML   = s.rail();
    mainEl.innerHTML   = s.mainHtml ? s.mainHtml()
      : `<div class="ph"><div><span class="pk mono">${s.main.k}</span>
      <p class="pt">${s.main.t}</p><p class="ps">${s.main.s}</p></div></div>`;
    noteEl.innerHTML   = s.note;
    tabs.forEach((t,j)=>t.setAttribute('aria-pressed', String(i===j)));

    /* highlight rows that did not exist in the PREVIOUS state */
    const prev = i>0 ? new Set(keysOf(STATES[i-1].rail())) : new Set(keysOf(s.rail()));
    railEl.querySelectorAll('[data-key]').forEach(el=>{
      if(!prev.has(el.dataset.key)) el.classList.add('is-new');
    });

    /* re-wire the per-render controls */
    const sm = document.getElementById('showmore');
    if(sm){
      sm.addEventListener('click',(e)=>{
        e.preventDefault();
        const open = sm.dataset.open==='true' ? 'false' : 'true';
        sm.dataset.open = open; sm.setAttribute('aria-expanded', open);
        document.getElementById('reveal').dataset.open = open;
        document.getElementById('showmore-lbl').textContent =
          open==='true' ? 'Show less' : `Show more — ${CATS_MORE.length} more`;
      });
    }
    const rt = document.getElementById('railtoggle');
    if(rt) rt.addEventListener('click',()=>{
      mock.dataset.rail = mock.dataset.rail==='compact' ? 'expanded' : 'compact';
    });
  }

  tabs.forEach((t)=>t.addEventListener('click',()=>{ render(Number(t.dataset.i)); window.scrollTo({top:0}); }));
  document.getElementById('hl').addEventListener('change',(e)=>{
    document.body.dataset.hl = e.target.checked ? 'on' : 'off';
  });
  document.body.dataset.hl='on';
  render(0);

  /* prototype links go nowhere */
  document.addEventListener('click',e=>{
    const a = e.target.closest('a[href="#"]'); if(a) e.preventDefault();
  });
</script>
