# The regulator-facing documents must not disagree with each other.
#
# This repo had no CI at all, which is why a five-week-stale counsel packet sat
# next to a corrected dossier and nothing noticed. A check with nowhere to run is
# decoration — so it runs here, on every push and pull request.
name: corpus facts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  facts:
    name: the compliance documents agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check corpus facts
        run: node scripts/check-corpus-facts.mjs
